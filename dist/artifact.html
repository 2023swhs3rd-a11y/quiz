 breaks make fewer mistakes and come up with more new ideas. In this sense, resting well is not the opposite of working hard; it is part of it."}, {"id": "EN-169", "s": "영어", "t": "수능", "g": 2, "d": "중", "q": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class='box'><b>As a result, the river became cleaner and fish returned for the first time in decades.</b></div>", "c": ["①", "②", "③", "④", "⑤"], "a": 4, "e": "결과를 나타내는 주어진 문장은 정화 노력(공장 폐수 규제, 하수 처리장 건설)이 나온 뒤인 ④에 와야 한다.", "p": "For many years, the river running through the city was so polluted that nothing could live in it. ( ① ) Factories dumped their waste into the water, and the smell was terrible. ( ② ) In the 1990s, citizens began to demand action. ( ③ ) The city made strict rules for factories and built new sewage treatment plants. ( ④ ) Today, the riverside is one of the most popular places for people to walk and relax. ( ⑤ )"}, {"id": "EN-170", "s": "영어", "t": "수능", "g": 2, "d": "중", "q": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 <u>않은</u> 것은?", "c": ["①", "②", "③", "④", "⑤"], "a": 3, "e": "줄 서기에서 앞사람을 따라 하는 경향을 설명하므로, 이미 줄이 긴 식당을 '피하는(avoid)' 것이 아니라 '고르는(choose)' 것이 자연스럽다.", "p": "When people are unsure what to do, they tend to ① <u>copy</u> what others are doing. Imagine you are in a new town looking for a place to eat. You see two restaurants: one is ② <u>empty</u>, and the other has a long line outside. Most people would ③ <u>avoid</u> the one with the line, assuming the food must be better there. This ④ <u>tendency</u> is called social proof. It can be useful, but it can also lead us to make ⑤ <u>poor</u> choices when the crowd is wrong."}, {"id": "EN-171", "s": "영어", "t": "수능", "g": 2, "d": "상", "q": "다음 글의 내용을 한 문장으로 요약할 때, 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?<div class='box'>Rather than making people (A) ______, giving them more choices can make it (B) ______ for them to decide.</div>", "c": ["(A) satisfied - (B) harder", "(A) satisfied - (B) easier", "(A) confused - (B) easier", "(A) tired - (B) faster", "(A) angry - (B) cheaper"], "a": 1, "e": "선택지가 많으면 만족이 커질 것 같지만(satisfied), 오히려 결정하기 더 어려워진다(harder)는 내용이다.", "p": "In one experiment, a store set up a table offering free samples of jam. On some days, the table had 24 kinds of jam; on others, only 6. The larger display attracted more visitors, but far fewer of them actually bought anything. When faced with too many options, people found it hard to compare them and often walked away without choosing. More choice, it seems, does not always lead to more satisfaction."}, {"id": "EN-172", "s": "영어", "t": "수능", "g": 3, "d": "하", "q": "다음 안내문의 내용과 일치하는 것은?<div class='box'><b>Summer Coding Camp</b><br>• For students aged 14 to 18<br>• July 22 – July 26, 9 a.m. – 3 p.m.<br>• Fee: $120 (lunch included)<br>• Bring your own laptop.<br>• Sign up online by July 10.</div>", "c": ["13세 학생도 참가할 수 있다.", "점심 식사가 참가비에 포함되어 있다.", "캠프는 2주 동안 진행된다.", "노트북은 캠프에서 빌려준다.", "현장에서만 신청할 수 있다."], "a": 2, "e": "Fee: $120 (lunch included)이므로 점심이 포함된다. 대상은 14~18세, 기간은 5일, 노트북은 각자 지참, 신청은 온라인이다.", "p": ""}, {"id": "EN-173", "s": "영어", "t": "수능", "g": 3, "d": "하", "q": "다음 글의 주제로 가장 적절한 것은?", "c": ["benefits of learning a second language", "difficulty of learning grammar", "history of the English language", "why children dislike languages", "how to travel without a guide"], "a": 1, "e": "제2 언어 학습이 기억력·문제 해결력 향상, 다른 문화 이해, 직업 기회 확대에 도움이 된다는 내용이다.", "p": "Learning a second language does more than help you order food on vacation. Studies show that bilingual people are often better at solving problems and switching between tasks. Learning another language also improves memory and opens the door to new cultures, helping you see the world from different points of view. On top of that, it can give you more opportunities in your future career."}, {"id": "EN-174", "s": "영어", "t": "수능", "g": 3, "d": "중", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?<div class='box'>Honey is one of the few foods that almost never spoils.</div>", "c": ["(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "a": 2, "e": "꿀은 거의 상하지 않는다 → (B) 고대 이집트 무덤에서 먹을 수 있는 꿀이 발견됨 → (A) 그 비결은 낮은 수분과 산성 → (C) 이런 조건에서는 세균이 살 수 없다의 순서이다.", "p": "(A) The secret lies in its chemistry. Honey contains very little water and is naturally acidic.\n(B) In fact, archaeologists have found pots of honey in ancient Egyptian tombs that were still safe to eat.\n(C) Under such conditions, bacteria and other tiny organisms cannot survive, so the honey stays fresh."}, {"id": "EN-175", "s": "영어", "t": "수능", "g": 3, "d": "중", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "c": ["work alone", "ask for help", "hide their weaknesses", "avoid feedback", "compete with others"], "a": 2, "e": "도움을 청하면 상대가 오히려 나를 더 좋게 본다는 연구를 소개하므로, 사람들이 '도움을 청하기'를 망설일 필요가 없다는 흐름이다.", "p": "Many people hesitate to ________ because they fear it will make them look weak or incompetent. However, studies suggest the opposite. When we ask others for advice, they tend to see us as more capable, not less, because asking shows that we are wise enough to know what we do not know. Moreover, people usually enjoy helping and feel closer to those who ask them."}, {"id": "EN-176", "s": "영어", "t": "수능", "g": 3, "d": "중", "q": "다음 글에서 전체 흐름과 관계 <u>없는</u> 문장은?", "c": ["①", "②", "③", "④", "⑤"], "a": 3, "e": "잠과 청소년 학습의 관계를 다룬 글인데, ③은 커피의 원산지에 관한 내용이라 흐름과 관계없다.", "p": "Teenagers need about eight to ten hours of sleep each night. ① However, many of them sleep much less because of homework and screen time. ② Lack of sleep makes it harder to concentrate in class and remember new information. ③ Coffee was first grown in Africa and later spread to the rest of the world. ④ Some schools have started classes later in the morning to help students get more rest. ⑤ As a result, students at these schools have shown better grades and fewer absences."}, {"id": "EN-177", "s": "영어", "t": "수능", "g": 3, "d": "중", "q": "다음 글의 밑줄 친 <u>a double-edged sword</u>가 의미하는 바로 가장 적절한 것은?", "c": ["매우 위험하여 쓰면 안 되는 것", "누구나 쉽게 쓸 수 있는 것", "아주 오래된 도구", "좋은 점과 나쁜 점을 함께 지닌 것", "이미 쓸모가 없어진 것"], "a": 4, "e": "누리 소통망이 친구와 연결해 주지만 비교와 외로움을 낳기도 하므로 '양날의 칼', 곧 장단점을 함께 지닌 것이라는 뜻이다.", "p": "Social media lets us stay in touch with friends who live far away and share our lives with them in an instant. Yet the same platforms can make us feel lonely when we compare our ordinary days with the carefully chosen highlights of others. In this way, social media is <u>a double-edged sword</u>: it can connect us, but it can also leave us feeling more isolated."}, {"id": "EN-178", "s": "영어", "t": "수능", "g": 3, "d": "중", "q": "다음 도표의 내용과 일치하지 <u>않는</u> 것은?<div class='tblwrap'><table class='tbl'><caption>Share of Electricity from Renewable Sources (%)</caption><thead><tr><th>Country</th><th>2015</th><th>2025</th></tr></thead><tbody><tr><td>A</td><td>20</td><td>45</td></tr><tr><td>B</td><td>35</td><td>40</td></tr><tr><td>C</td><td>10</td><td>30</td></tr><tr><td>D</td><td>50</td><td>55</td></tr></tbody></table></div>", "c": ["All four countries increased their share of renewable electricity.", "Country D had the highest share in both years.", "Country C's share tripled from 2015 to 2025.", "Country A showed the largest increase among the four countries.", "In 2025, Country B's share was higher than Country A's."], "a": 5, "e": "2025년에 B국은 40%, A국은 45%이므로 B국이 A국보다 높았다는 ⑤는 일치하지 않는다.", "p": ""}, {"id": "EN-179", "s": "영어", "t": "수능", "g": 3, "d": "상", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "c": ["too much time to prepare", "a lack of talent", "the pressure from others", "having too many friends", "the absence of a clear plan"], "a": 5, "e": "미루기의 원인은 게으름이 아니라 막연함, 곧 다음에 무엇을 해야 할지 모르는 '명확한 계획의 부재'라는 흐름이다.", "p": "We often blame procrastination on laziness. Yet many people who put things off are not lazy at all; they work hard on other tasks. Researchers have found that we tend to delay tasks that feel vague, such as 'write the report,' rather than tasks with clear steps, such as 'write the first paragraph.' When we do not know exactly where to start, our minds look for something easier to do. In many cases, then, what drives procrastination is not laziness but ________."}, {"id": "EN-180", "s": "영어", "t": "수능", "g": 3, "d": "상", "q": "다음 글의 내용을 한 문장으로 요약할 때, 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?<div class='box'>When people expect something to help them, that (A) ______ alone can bring about real (B) ______ in how they feel.</div>", "c": ["(A) doubt - (B) improvement", "(A) belief - (B) damage", "(A) belief - (B) improvement", "(A) medicine - (B) confusion", "(A) fear - (B) relief"], "a": 3, "e": "가짜 약도 효과가 있다고 '믿으면(belief)' 실제로 증상이 '나아지는(improvement)' 위약 효과를 설명한 글이다.", "p": "In medical studies, some patients receive a sugar pill instead of real medicine, but they are not told which one they got. Surprisingly, many patients who take the sugar pill report that their pain decreases. Brain scans even show changes similar to those caused by real painkillers. This placebo effect reveals that our expectations can shape our bodies' responses. Simply believing that a treatment will work can lead to genuine relief."}, {"id": "MA-001", "s": "수학", "t": "단편", "g": 1, "d": "하", "q": "다항식 (x + 2)(x − 3)을 전개했을 때 x의 계수는?", "c": ["−6", "−5", "−1", "1", "5"], "a": 3, "e": "(x + 2)(x − 3) = x² − 3x + 2x − 6 = x² − x − 6 이므로 x의 계수는 −1이다.", "p": ""}, {"id": "MA-002", "s": "수학", "t": "단편", "g": 1, "d": "하", "q": "i² + i⁴의 값은? (단, i = √−1)", "c": ["−4", "−3", "−2", "−1", "0"], "a": 5, "e": "i² = −1, i⁴ = (i²)² = 1 이므로 i² + i⁴ = −1 + 1 = 0이다.", "p": ""}, {"id": "MA-003", "s": "수학", "t": "단편", "g": 1, "d": "중", "q": "이차방정식 x² − 5x + 3 = 0의 두 근을 α, β라 할 때, α² + β²의 값은?", "c": ["19", "22", "25", "28", "31"], "a": 1, "e": "근과 계수의 관계에서 α + β = 5, αβ = 3이다. α² + β² = (α + β)² − 2αβ = 25 − 6 = 19.", "p": ""}, {"id": "MA-004", "s": "수학", "t": "단편", "g": 1, "d": "중", "q": "다항식 f(x) = x³ − 2x + 1을 x − 2로 나누었을 때의 나머지는?", "c": ["1", "3", "5", "7", "9"], "a": 3, "e": "나머지정리에 의해 나머지는 f(2) = 8 − 4 + 1 = 5이다.", "p": ""}, {"id": "MA-005", "s": "수학", "t": "단편", "g": 1, "d": "하", "q": "좌표평면 위의 두 점 A(1, 2), B(4, 6) 사이의 거리는?", "c": ["5", "6", "7", "8", "9"], "a": 1, "e": "AB = √{(4 − 1)² + (6 − 2)²} = √(9 + 16) = √25 = 5.", "p": ""}, {"id": "MA-006", "s": "수학", "t": "단편", "g": 1, "d": "하", "q": "집합 A = {1, 2, 3}의 부분집합의 개수는?", "c": ["3", "6", "7", "8", "9"], "a": 4, "e": "원소가 n개인 집합의 부분집합 개수는 2ⁿ이므로 2³ = 8개이다(공집합과 자기 자신 포함).", "p": ""}, {"id": "MA-007", "s": "수학", "t": "단편", "g": 1, "d": "중", "q": "5명의 학생 중에서 회장 1명, 부회장 1명을 뽑는 경우의 수는?", "c": ["20", "25", "30", "35", "40"], "a": 1, "e": "서로 다른 5명에서 2명을 뽑아 순서(역할)대로 세우는 순열이므로 ₅P₂ = 5 × 4 = 20이다.", "p": ""}, {"id": "MA-008", "s": "수학", "t": "단편", "g": 2, "d": "하", "q": "log₂ 8 + log₃ 9의 값은?", "c": ["4", "5", "6", "7", "8"], "a": 2, "e": "log₂ 8 = log₂ 2³ = 3, log₃ 9 = log₃ 3² = 2 이므로 합은 5이다.", "p": ""}, {"id": "MA-009", "s": "수학", "t": "단편", "g": 2, "d": "하", "q": "첫째항이 3, 공차가 4인 등차수열의 제10항은?", "c": ["31", "33", "35", "37", "39"], "a": 5, "e": "aₙ = a₁ + (n − 1)d 이므로 a₁₀ = 3 + 9 × 4 = 39이다.", "p": ""}, {"id": "MA-010", "s": "수학", "t": "단편", "g": 2, "d": "중", "q": "2 + 2² + 2³ + … + 2¹⁰의 값은?", "c": ["1022", "1024", "2044", "2046", "2048"], "a": 4, "e": "첫째항 2, 공비 2, 항수 10인 등비수열의 합이므로 2(2¹⁰ − 1) / (2 − 1) = 2 × 1023 = 2046이다.", "p": ""}, {"id": "MA-011", "s": "수학", "t": "단편", "g": 2, "d": "하", "q": "sin(π/6) + cos(π/3)의 값은?", "c": ["<span class='fr'><span>1</span><span>2</span></span>", "<span class='fr'><span>√2</span><span>2</span></span>", "1", "<span class='fr'><span>√3</span><span>2</span></span>", "√3"], "a": 3, "e": "sin(π/6) = 1/2, cos(π/3) = 1/2 이므로 합은 1이다.", "p": ""}, {"id": "MA-012", "s": "수학", "t": "단편", "g": 2, "d": "중", "q": "lim<sub>x→2</sub> (x² − 4)/(x − 2)의 값은?", "c": ["4", "0", "2", "8", "존재하지 않는다"], "a": 1, "e": "x ≠ 2일 때 (x² − 4)/(x − 2) = (x − 2)(x + 2)/(x − 2) = x + 2 이므로 극한값은 2 + 2 = 4이다.", "p": ""}, {"id": "MA-013", "s": "수학", "t": "단편", "g": 2, "d": "중", "q": "함수 f(x) = x³ − 3x에 대하여 f′(2)의 값은?", "c": ["9", "12", "15", "18", "21"], "a": 1, "e": "f′(x) = 3x² − 3 이므로 f′(2) = 12 − 3 = 9이다.", "p": ""}, {"id": "MA-014", "s": "수학", "t": "단편", "g": 2, "d": "중", "q": "정적분 ∫<sub>0</sub><sup>2</sup> (3x² + 2x) dx의 값은?", "c": ["6", "8", "10", "12", "14"], "a": 4, "e": "부정적분은 x³ + x² 이므로 (8 + 4) − 0 = 12이다.", "p": ""}, {"id": "MA-015", "s": "수학", "t": "단편", "g": 3, "d": "하", "q": "서로 다른 6권의 책 중에서 2권을 고르는 경우의 수는?", "c": ["12", "15", "20", "30", "36"], "a": 2, "e": "순서를 생각하지 않고 고르므로 조합 ₆C₂ = (6 × 5)/(2 × 1) = 15이다.", "p": ""}, {"id": "MA-016", "s": "수학", "t": "단편", "g": 3, "d": "중", "q": "함수 f(x) = e<sup>2x</sup>에 대하여 f′(0)의 값은?", "c": ["2", "0", "1", "e", "2e"], "a": 1, "e": "f′(x) = 2e<sup>2x</sup> 이므로 f′(0) = 2e⁰ = 2이다.", "p": ""}, {"id": "MA-017", "s": "수학", "t": "단편", "g": 3, "d": "중", "q": "lim<sub>n→∞</sub> (3n² + 1)/(n² + 2n)의 값은?", "c": ["0", "1", "<span class='fr'><span>3</span><span>2</span></span>", "3", "∞"], "a": 4, "e": "분자와 분모를 최고차항 n²으로 나누면 (3 + 1/n²)/(1 + 2/n) → 3/1 = 3이다.", "p": ""}, {"id": "MA-018", "s": "수학", "t": "단편", "g": 3, "d": "중", "q": "확률변수 X가 이항분포 B(100, 1/5)를 따를 때, X의 분산 V(X)는?", "c": ["4", "16", "20", "25", "80"], "a": 2, "e": "이항분포 B(n, p)의 분산은 np(1 − p)이므로 100 × 1/5 × 4/5 = 16이다. (평균은 np = 20)", "p": ""}, {"id": "MA-019", "s": "수학", "t": "단편", "g": 3, "d": "상", "q": "정적분 ∫<sub>1</sub><sup>e</sup> (ln x)/x dx의 값은?", "c": ["<span class='fr'><span>1</span><span>4</span></span>", "<span class='fr'><span>1</span><span>2</span></span>", "1", "e − 1", "e"], "a": 2, "e": "ln x = t로 치환하면 dt = (1/x)dx, x: 1→e일 때 t: 0→1. ∫<sub>0</sub><sup>1</sup> t dt = 1/2이다.", "p": ""}, {"id": "MA-020", "s": "수학", "t": "단편", "g": 3, "d": "중", "q": "등비급수 Σ<sub>n=1</sub><sup>∞</sup> (2/3)ⁿ의 값은?", "c": ["1", "<span class='fr'><span>3</span><span>2</span></span>", "2", "3", "발산한다"], "a": 3, "e": "첫째항 2/3, 공비 2/3(|r| < 1)인 등비급수이므로 합은 (2/3) / (1 − 2/3) = 2이다.", "p": ""}, {"id": "MA-021", "s": "수학", "t": "수능", "g": 1, "d": "중", "q": "이차함수 y = x² − 2x + k의 그래프가 직선 y = 2x − 1에 접할 때, 상수 k의 값은?", "c": ["1", "2", "3", "4", "5"], "a": 3, "e": "x² − 2x + k = 2x − 1, 즉 x² − 4x + (k + 1) = 0이 중근을 가져야 한다. 판별식 D/4 = 4 − (k + 1) = 0에서 k = 3.", "p": ""}, {"id": "MA-022", "s": "수학", "t": "수능", "g": 1, "d": "상", "q": "모든 실수 x에 대하여 부등식 x² − 2ax + a + 6 ≥ 0이 성립하도록 하는 정수 a의 개수는?", "c": ["2", "3", "4", "5", "6"], "a": 5, "e": "이차항 계수가 양수이므로 판별식 D/4 = a² − (a + 6) ≤ 0, 즉 (a − 3)(a + 2) ≤ 0에서 −2 ≤ a ≤ 3. 정수 a는 −2, −1, 0, 1, 2, 3의 6개이다.", "p": ""}, {"id": "MA-023", "s": "수학", "t": "수능", "g": 2, "d": "중", "q": "함수 f(x) = x³ − 6x² + 9x + 1의 극댓값과 극솟값의 합은?", "c": ["2", "3", "4", "5", "6"], "a": 5, "e": "f′(x) = 3x² − 12x + 9 = 3(x − 1)(x − 3). x = 1에서 극대, x = 3에서 극소이다. f(1) = 1 − 6 + 9 + 1 = 5, f(3) = 27 − 54 + 27 + 1 = 1이므로 합은 6이다.", "p": ""}, {"id": "MA-024", "s": "수학", "t": "수능", "g": 2, "d": "상", "q": "곡선 y = x² − 2x와 x축으로 둘러싸인 부분의 넓이는?", "c": ["<span class='fr'><span>2</span><span>3</span></span>", "1", "<span class='fr'><span>4</span><span>3</span></span>", "<span class='fr'><span>5</span><span>3</span></span>", "2"], "a": 3, "e": "x² − 2x = 0에서 x = 0, 2. 0 ≤ x ≤ 2에서 곡선이 x축 아래에 있으므로 넓이는 ∫<sub>0</sub><sup>2</sup> (2x − x²) dx = 4 − 8/3 = 4/3이다.", "p": ""}, {"id": "MA-025", "s": "수학", "t": "수능", "g": 2, "d": "상", "q": "등차수열 {aₙ}에서 a₃ = 7, a₇ = 19일 때, 첫째항부터 제10항까지의 합은?", "c": ["115", "125", "135", "145", "155"], "a": 4, "e": "a₇ − a₃ = 4d = 12에서 d = 3, a₁ = 7 − 6 = 1. S₁₀ = 10(2 × 1 + 9 × 3)/2 = 5 × 29 = 145.", "p": ""}, {"id": "MA-026", "s": "수학", "t": "수능", "g": 2, "d": "상", "q": "0 ≤ x < 2π일 때, 방정식 2sin²x − sin x − 1 = 0의 모든 해의 합은?", "c": ["2π", "<span class='fr'><span>5π</span><span>2</span></span>", "3π", "<span class='fr'><span>7π</span><span>2</span></span>", "4π"], "a": 4, "e": "(2sin x + 1)(sin x − 1) = 0에서 sin x = 1 또는 sin x = −1/2. sin x = 1이면 x = π/2, sin x = −1/2이면 x = 7π/6, 11π/6. 합은 3π/6 + 7π/6 + 11π/6 = 21π/6 = 7π/2.", "p": ""}, {"id": "MA-027", "s": "수학", "t": "수능", "g": 3, "d": "중", "q": "흰 공 3개, 검은 공 2개가 들어 있는 주머니에서 임의로 2개의 공을 동시에 꺼낼 때, 꺼낸 두 공의 색이 서로 다를 확률은?", "c": ["<span class='fr'><span>1</span><span>5</span></span>", "<span class='fr'><span>2</span><span>5</span></span>", "<span class='fr'><span>1</span><span>2</span></span>", "<span class='fr'><span>3</span><span>5</span></span>", "<span class='fr'><span>4</span><span>5</span></span>"], "a": 4, "e": "전체 경우의 수는 ₅C₂ = 10, 흰 공 1개와 검은 공 1개를 꺼내는 경우는 3 × 2 = 6이므로 확률은 6/10 = 3/5이다.", "p": ""}, {"id": "MA-028", "s": "수학", "t": "수능", "g": 3, "d": "상", "q": "두 사건 A, B에 대하여 P(A) = 1/2, P(B) = 1/3, P(A ∪ B) = 2/3일 때, P(A | B)의 값은?", "c": ["<span class='fr'><span>1</span><span>6</span></span>", "<span class='fr'><span>1</span><span>4</span></span>", "<span class='fr'><span>1</span><span>3</span></span>", "<span class='fr'><span>1</span><span>2</span></span>", "<span class='fr'><span>2</span><span>3</span></span>"], "a": 4, "e": "P(A ∩ B) = P(A) + P(B) − P(A ∪ B) = 1/2 + 1/3 − 2/3 = 1/6. P(A | B) = P(A ∩ B)/P(B) = (1/6)/(1/3) = 1/2.", "p": ""}, {"id": "MA-029", "s": "수학", "t": "수능", "g": 3, "d": "상", "q": "함수 f(x) = xe<sup>x</sup>의 최솟값은?", "c": ["−e", "−1", "−<span class='fr'><span>1</span><span>e</span></span>", "0", "<span class='fr'><span>1</span><span>e</span></span>"], "a": 3, "e": "f′(x) = (1 + x)e<sup>x</sup> = 0에서 x = −1. x < −1이면 f′ < 0, x > −1이면 f′ > 0이므로 x = −1에서 최소이고 최솟값은 f(−1) = −e<sup>−1</sup> = −1/e이다.", "p": ""}, {"id": "MA-030", "s": "수학", "t": "수능", "g": 1, "d": "중", "q": "이차방정식 x² + ax + b = 0의 한 근이 1 + 2i일 때, 실수 a, b에 대하여 a + b의 값은?", "c": ["1", "2", "3", "4", "5"], "a": 3, "e": "계수가 실수이므로 다른 한 근은 1 − 2i이다. 두 근의 합 2 = −a에서 a = −2, 두 근의 곱 (1 + 2i)(1 − 2i) = 1 + 4 = 5 = b. 따라서 a + b = 3.", "p": ""}, {"id": "MA-031", "s": "수학", "t": "단편", "g": 1, "d": "상", "q": "x + y = 3, xy = 1일 때, x³ + y³의 값은?", "c": ["6", "9", "12", "15", "18"], "a": 5, "e": "x³ + y³ = (x + y)³ − 3xy(x + y) = 27 − 3 × 1 × 3 = 18.", "p": ""}, {"id": "MA-032", "s": "수학", "t": "단편", "g": 1, "d": "상", "q": "다음 중 다항식 x⁴ + x² + 1의 인수인 것은?", "c": ["x² − x + 1", "x + 1", "x − 1", "x² + 1", "x² + 2x + 1"], "a": 1, "e": "x⁴ + x² + 1 = (x⁴ + 2x² + 1) − x² = (x² + 1)² − x² = (x² + x + 1)(x² − x + 1)이므로 x² − x + 1이 인수이다.", "p": ""}, {"id": "MA-033", "s": "수학", "t": "단편", "g": 1, "d": "상", "q": "방정식 |x − 1| + |x + 2| = 5의 모든 해의 합은?", "c": ["−3", "−2", "−1", "0", "1"], "a": 3, "e": "x ≥ 1이면 2x + 1 = 5에서 x = 2. −2 ≤ x < 1이면 좌변이 3이므로 해가 없다. x < −2이면 −2x − 1 = 5에서 x = −3. 따라서 해의 합은 2 + (−3) = −1.", "p": ""}, {"id": "MA-034", "s": "수학", "t": "단편", "g": 2, "d": "하", "q": "2³ × 2⁻¹의 값은?", "c": ["1", "2", "4", "8", "16"], "a": 3, "e": "지수법칙에 의해 2³ × 2⁻¹ = 2³⁻¹ = 2² = 4.", "p": ""}, {"id": "MA-035", "s": "수학", "t": "단편", "g": 2, "d": "하", "q": "sin(π/2) + cos π의 값은?", "c": ["−4", "−3", "−2", "−1", "0"], "a": 5, "e": "sin(π/2) = 1, cos π = −1이므로 합은 0이다.", "p": ""}, {"id": "MA-036", "s": "수학", "t": "단편", "g": 2, "d": "하", "q": "함수 f(x) = x² + 3x에 대하여 f′(1)의 값은?", "c": ["1", "2", "3", "4", "5"], "a": 5, "e": "f′(x) = 2x + 3이므로 f′(1) = 5.", "p": ""}, {"id": "MA-037", "s": "수학", "t": "단편", "g": 2, "d": "중", "q": "log₁₀ 2 = a일 때, log₁₀ 5를 a로 나타낸 것은?", "c": ["1 + a", "2a", "a − 1", "1 − a", "1 − 2a"], "a": 4, "e": "log₁₀ 5 = log₁₀ (10/2) = log₁₀ 10 − log₁₀ 2 = 1 − a.", "p": ""}, {"id": "MA-038", "s": "수학", "t": "단편", "g": 2, "d": "상", "q": "Σ<sub>k=1</sub><sup>10</sup> k(k + 1)의 값은?", "c": ["385", "400", "420", "440", "505"], "a": 4, "e": "Σk² + Σk = 10 × 11 × 21 / 6 + 10 × 11 / 2 = 385 + 55 = 440.", "p": ""}, {"id": "MA-039", "s": "수학", "t": "단편", "g": 2, "d": "상", "q": "두 변의 길이가 3, 5이고 그 끼인각의 크기가 120°인 삼각형에서 나머지 한 변의 길이는?", "c": ["7", "6", "√39", "√19", "8"], "a": 1, "e": "코사인법칙에 의해 c² = 3² + 5² − 2 × 3 × 5 × cos 120° = 34 + 15 = 49이므로 c = 7.", "p": ""}, {"id": "MA-040", "s": "수학", "t": "단편", "g": 2, "d": "상", "q": "함수 f(x) = x³ + ax² + 3x가 실수 전체의 집합에서 증가하도록 하는 정수 a의 개수는?", "c": ["5", "7", "9", "11", "13"], "a": 2, "e": "f′(x) = 3x² + 2ax + 3 ≥ 0이 항상 성립해야 하므로 판별식 D/4 = a² − 9 ≤ 0, 즉 −3 ≤ a ≤ 3. 정수 a는 7개이다.", "p": ""}, {"id": "MA-041", "s": "수학", "t": "단편", "g": 2, "d": "상", "q": "방정식 log₂ x + log₂ (x − 2) = 3의 해는?", "c": ["2", "3", "4", "6", "8"], "a": 3, "e": "진수 조건에서 x > 2. log₂ x(x − 2) = 3에서 x(x − 2) = 8, x² − 2x − 8 = 0, (x − 4)(x + 2) = 0. x > 2이므로 x = 4.", "p": ""}, {"id": "MA-042", "s": "수학", "t": "단편", "g": 3, "d": "하", "q": "5!의 값은?", "c": ["24", "60", "100", "120", "720"], "a": 4, "e": "5! = 5 × 4 × 3 × 2 × 1 = 120.", "p": ""}, {"id": "MA-043", "s": "수학", "t": "단편", "g": 3, "d": "하", "q": "한 개의 주사위를 던질 때, 짝수의 눈이 나올 확률은?", "c": ["<span class='fr'><span>1</span><span>6</span></span>", "<span class='fr'><span>1</span><span>3</span></span>", "<span class='fr'><span>1</span><span>2</span></span>", "<span class='fr'><span>2</span><span>3</span></span>", "<span class='fr'><span>5</span><span>6</span></span>"], "a": 3, "e": "짝수의 눈은 2, 4, 6의 3가지이므로 확률은 3/6 = 1/2이다.", "p": ""}, {"id": "MA-044", "s": "수학", "t": "단편", "g": 3, "d": "하", "q": "lim<sub>n→∞</sub> (2n + 1)/n의 값은?", "c": ["0", "1", "3", "∞", "2"], "a": 5, "e": "(2n + 1)/n = 2 + 1/n이고 n → ∞일 때 1/n → 0이므로 극한값은 2이다.", "p": ""}, {"id": "MA-045", "s": "수학", "t": "단편", "g": 3, "d": "하", "q": "함수 y = sin x의 도함수는?", "c": ["y′ = cos x", "y′ = −cos x", "y′ = −sin x", "y′ = tan x", "y′ = sin x"], "a": 1, "e": "(sin x)′ = cos x, (cos x)′ = −sin x이다.", "p": ""}, {"id": "MA-046", "s": "수학", "t": "단편", "g": 3, "d": "중", "q": "서로 다른 4개에서 중복을 허락하여 2개를 택하는 중복조합의 수 ₄H₂의 값은?", "c": ["6", "8", "10", "12", "16"], "a": 3, "e": "ₙHᵣ = ₙ₊ᵣ₋₁Cᵣ이므로 ₄H₂ = ₅C₂ = 10.", "p": ""}, {"id": "MA-047", "s": "수학", "t": "단편", "g": 3, "d": "중", "q": "(x + 2)⁴의 전개식에서 x²의 계수는?", "c": ["6", "12", "16", "24", "32"], "a": 4, "e": "이항정리에서 x²항은 ₄C₂ × x² × 2² = 6 × 4 × x² = 24x²이다.", "p": ""}, {"id": "MA-048", "s": "수학", "t": "단편", "g": 3, "d": "중", "q": "함수 f(x) = ln(x² + 1)에 대하여 f′(1)의 값은?", "c": ["<span class='fr'><span>1</span><span>2</span></span>", "1", "2", "ln 2", "2 ln 2"], "a": 2, "e": "합성함수의 미분법에 의해 f′(x) = 2x/(x² + 1)이므로 f′(1) = 2/2 = 1.", "p": ""}, {"id": "MA-049", "s": "수학", "t": "단편", "g": 3, "d": "상", "q": "정적분 ∫<sub>0</sub><sup>π</sup> x sin x dx의 값은?", "c": ["0", "1", "2", "π", "2π"], "a": 4, "e": "부분적분법에 의해 [−x cos x]<sub>0</sub><sup>π</sup> + ∫<sub>0</sub><sup>π</sup> cos x dx = π + [sin x]<sub>0</sub><sup>π</sup> = π + 0 = π.", "p": ""}, {"id": "MA-050", "s": "수학", "t": "단편", "g": 3, "d": "상", "q": "확률변수 X에 대하여 E(X) = 3, V(X) = 2일 때, E(X²) + V(2X + 1)의 값은?", "c": ["15", "17", "19", "21", "23"], "a": 3, "e": "E(X²) = V(X) + {E(X)}² = 2 + 9 = 11, V(2X + 1) = 2² × V(X) = 8. 따라서 11 + 8 = 19.", "p": ""}, {"id": "MA-051", "s": "수학", "t": "단편", "g": 3, "d": "상", "q": "lim<sub>x→0</sub> (e<sup>2x</sup> − 1)/sin 3x의 값은?", "c": ["<span class='fr'><span>1</span><span>3</span></span>", "<span class='fr'><span>2</span><span>3</span></span>", "1", "<span class='fr'><span>3</span><span>2</span></span>", "6"], "a": 2, "e": "(e<sup>2x</sup> − 1)/2x → 1, sin 3x/3x → 1이므로 주어진 식 = {(e<sup>2x</sup> − 1)/2x} × {3x/sin 3x} × (2/3) → 2/3.", "p": ""}, {"id": "MA-052", "s": "수학", "t": "수능", "g": 1, "d": "하", "q": "직선 y = 2x + 1에 평행하고 점 (1, 5)를 지나는 직선의 y절편은?", "c": ["3", "4", "5", "6", "7"], "a": 1, "e": "평행하므로 기울기는 2이다. y − 5 = 2(x − 1)에서 y = 2x + 3이므로 y절편은 3이다.", "p": ""}, {"id": "MA-053", "s": "수학", "t": "수능", "g": 1, "d": "하", "q": "두 집합 A = {1, 2, 3, 4}, B = {3, 4, 5}에 대하여 n(A ∪ B)의 값은?", "c": ["1", "2", "3", "4", "5"], "a": 5, "e": "A ∪ B = {1, 2, 3, 4, 5}이므로 원소의 개수는 5이다. (n(A) + n(B) − n(A ∩ B) = 4 + 3 − 2 = 5)", "p": ""}, {"id": "MA-054", "s": "수학", "t": "수능", "g": 1, "d": "하", "q": "이차함수 y = x² − 4x + 9의 최솟값은?", "c": ["1", "3", "5", "7", "9"], "a": 3, "e": "y = (x − 2)² + 5이므로 x = 2일 때 최솟값 5를 갖는다.", "p": ""}, {"id": "MA-055", "s": "수학", "t": "수능", "g": 1, "d": "중", "q": "원 x² + y² − 4x + 2y − 4 = 0의 반지름의 길이는?", "c": ["2", "3", "4", "5", "6"], "a": 2, "e": "(x − 2)² + (y + 1)² = 4 + 1 + 4 = 9이므로 반지름의 길이는 3이다.", "p": ""}, {"id": "MA-056", "s": "수학", "t": "수능", "g": 1, "d": "상", "q": "0 ≤ x ≤ 3에서 이차함수 f(x) = x² − 2x + a의 최댓값이 7일 때, f(x)의 최솟값은? (단, a는 상수)", "c": ["1", "2", "3", "4", "5"], "a": 3, "e": "f(x) = (x − 1)² + a − 1. 구간에서 꼭짓점 x = 1에서 가장 먼 x = 3에서 최대이므로 f(3) = 3 + a = 7, a = 4. 최솟값은 f(1) = a − 1 = 3.", "p": ""}, {"id": "MA-057", "s": "수학", "t": "수능", "g": 1, "d": "상", "q": "직선 y = x + k가 원 x² + y² = 8과 서로 다른 두 점에서 만나도록 하는 정수 k의 개수는?", "c": ["7", "9", "11", "13", "15"], "a": 1, "e": "원의 중심 (0, 0)과 직선 x − y + k = 0 사이의 거리 |k|/√2가 반지름 2√2보다 작아야 하므로 |k| < 4. 정수 k는 −3, −2, …, 3의 7개이다.", "p": ""}, {"id": "MA-058", "s": "수학", "t": "수능", "g": 2, "d": "하", "q": "등차수열 2, 5, 8, 11, …의 제6항은?", "c": ["16", "17", "18", "19", "20"], "a": 2, "e": "첫째항 2, 공차 3이므로 a₆ = 2 + 5 × 3 = 17.", "p": ""}, {"id": "MA-059", "s": "수학", "t": "수능", "g": 2, "d": "하", "q": "함수 f(x) = x²에서 x의 값이 1에서 3까지 변할 때의 평균변화율은?", "c": ["2", "3", "4", "6", "8"], "a": 3, "e": "평균변화율 = {f(3) − f(1)}/(3 − 1) = (9 − 1)/2 = 4.", "p": ""}, {"id": "MA-060", "s": "수학", "t": "수능", "g": 2, "d": "하", "q": "정적분 ∫<sub>0</sub><sup>1</sup> 2x dx의 값은?", "c": ["<span class='fr'><span>1</span><span>2</span></span>", "1", "<span class='fr'><span>3</span><span>2</span></span>", "2", "4"], "a": 2, "e": "[x²]<sub>0</sub><sup>1</sup> = 1 − 0 = 1.", "p": ""}, {"id": "MA-061", "s": "수학", "t": "수능", "g": 2, "d": "중", "q": "모든 항이 양수인 등비수열 {aₙ}에서 a₂ = 6, a₅ = 48일 때, a₇의 값은?", "c": ["96", "144", "192", "288", "384"], "a": 3, "e": "a₅/a₂ = r³ = 8에서 r = 2, a₁ = 3. a₇ = 3 × 2⁶ = 192.", "p": ""}, {"id": "MA-062", "s": "수학", "t": "수능", "g": 2, "d": "상", "q": "곡선 y = x³ − 3x + 2 위의 점 (2, 4)에서의 접선의 y절편은?", "c": ["−18", "−14", "−10", "−6", "−2"], "a": 2, "e": "y′ = 3x² − 3이므로 x = 2에서 접선의 기울기는 9. 접선은 y = 9(x − 2) + 4 = 9x − 14이므로 y절편은 −14.", "p": ""}, {"id": "MA-063", "s": "수학", "t": "수능", "g": 2, "d": "상", "q": "방정식 x³ − 3x − k = 0이 서로 다른 세 실근을 갖도록 하는 정수 k의 개수는?", "c": ["3", "4", "5", "6", "7"], "a": 1, "e": "f(x) = x³ − 3x라 하면 f′(x) = 3(x − 1)(x + 1)이고 극댓값 f(−1) = 2, 극솟값 f(1) = −2. y = k와 세 점에서 만나려면 −2 < k < 2이므로 정수 k는 −1, 0, 1의 3개이다.", "p": ""}, {"id": "MA-064", "s": "수학", "t": "수능", "g": 2, "d": "상", "q": "수직선 위를 움직이는 점 P의 시각 t(t ≥ 0)에서의 속도가 v(t) = 3t² − 6t일 때, t = 0에서 t = 3까지 점 P가 움직인 거리는?", "c": ["0", "4", "6", "8", "12"], "a": 4, "e": "0 ≤ t ≤ 2에서 v ≤ 0, 2 ≤ t ≤ 3에서 v ≥ 0이다. ∫<sub>0</sub><sup>2</sup>(6t − 3t²)dt = 12 − 8 = 4, ∫<sub>2</sub><sup>3</sup>(3t² − 6t)dt = [t³ − 3t²]<sub>2</sub><sup>3</sup> = 0 − (−4) = 4. 움직인 거리는 4 + 4 = 8. (위치의 변화량은 0이지만 움직인 거리는 8이다.)", "p": ""}, {"id": "MA-065", "s": "수학", "t": "수능", "g": 3, "d": "하", "q": "동전 2개를 동시에 던질 때, 모두 앞면이 나올 확률은?", "c": ["<span class='fr'><span>1</span><span>8</span></span>", "<span class='fr'><span>1</span><span>4</span></span>", "<span class='fr'><span>1</span><span>3</span></span>", "<span class='fr'><span>1</span><span>2</span></span>", "<span class='fr'><span>3</span><span>4</span></span>"], "a": 2, "e": "각 동전에서 앞면이 나올 확률은 1/2이고 두 사건은 독립이므로 1/2 × 1/2 = 1/4.", "p": ""}, {"id": "MA-066", "s": "수학", "t": "수능", "g": 3, "d": "하", "q": "4명이 원탁에 둘러앉는 경우의 수는? (단, 회전하여 일치하는 것은 같은 것으로 본다.)", "c": ["4", "6", "12", "24", "36"], "a": 2, "e": "서로 다른 n명을 원형으로 배열하는 경우의 수는 (n − 1)!이므로 3! = 6.", "p": ""}, {"id": "MA-067", "s": "수학", "t": "수능", "g": 3, "d": "하", "q": "함수 f(x) = e<sup>x</sup> + x에 대하여 f′(0)의 값은?", "c": ["2", "0", "1", "e", "e + 1"], "a": 1, "e": "f′(x) = e<sup>x</sup> + 1이므로 f′(0) = 1 + 1 = 2.", "p": ""}, {"id": "MA-068", "s": "수학", "t": "수능", "g": 3, "d": "하", "q": "확률변수 X의 확률분포가 다음과 같을 때, E(X)의 값은?\n<div class='box'>P(X = 0) = 1/4,　P(X = 1) = 1/2,　P(X = 2) = 1/4</div>", "c": ["<span class='fr'><span>1</span><span>2</span></span>", "<span class='fr'><span>3</span><span>4</span></span>", "1", "<span class='fr'><span>5</span><span>4</span></span>", "<span class='fr'><span>3</span><span>2</span></span>"], "a": 3, "e": "E(X) = 0 × 1/4 + 1 × 1/2 + 2 × 1/4 = 1.", "p": ""}, {"id": "MA-069", "s": "수학", "t": "수능", "g": 3, "d": "중", "q": "한 개의 주사위를 두 번 던질 때, 6의 눈이 적어도 한 번 나올 확률은?", "c": ["<span class='fr'><span>1</span><span>6</span></span>", "<span class='fr'><span>1</span><span>3</span></span>", "<span class='fr'><span>11</span><span>36</span></span>", "<span class='fr'><span>25</span><span>36</span></span>", "<span class='fr'><span>1</span><span>36</span></span>"], "a": 3, "e": "여사건(두 번 모두 6의 눈이 나오지 않음)의 확률은 5/6 × 5/6 = 25/36이므로 구하는 확률은 1 − 25/36 = 11/36.", "p": ""}, {"id": "MA-070", "s": "수학", "t": "수능", "g": 3, "d": "중", "q": "정적분 ∫<sub>0</sub><sup>1</sup> e<sup>2x</sup> dx의 값은?", "c": ["e² − 1", "<span class='fr'><span>e² − 1</span><span>2</span></span>", "e²", "<span class='fr'><span>e²</span><span>2</span></span>", "2e² − 2"], "a": 2, "e": "[e<sup>2x</sup>/2]<sub>0</sub><sup>1</sup> = (e² − 1)/2.", "p": ""}, {"id": "MA-071", "s": "수학", "t": "수능", "g": 3, "d": "중", "q": "정규분포 N(60, 8²)을 따르는 모집단에서 크기가 16인 표본을 임의추출할 때, 표본평균의 표준편차는?", "c": ["<span class='fr'><span>1</span><span>2</span></span>", "1", "2", "4", "8"], "a": 3, "e": "표본평균의 표준편차는 σ/√n = 8/√16 = 2.", "p": ""}, {"id": "MA-072", "s": "수학", "t": "수능", "g": 3, "d": "상", "q": "원점에서 곡선 y = e<sup>x</sup>에 그은 접선의 기울기는?", "c": ["1", "2", "2e", "e²", "e"], "a": 5, "e": "접점을 (t, e<sup>t</sup>)라 하면 접선은 y = e<sup>t</sup>(x − t) + e<sup>t</sup>. 원점을 지나므로 0 = e<sup>t</sup>(1 − t)에서 t = 1. 따라서 기울기는 e¹ = e.", "p": ""}, {"id": "MA-073", "s": "수학", "t": "수능", "g": 3, "d": "상", "q": "한 개의 동전을 5번 던질 때, 앞면이 정확히 3번 나올 확률은?", "c": ["<span class='fr'><span>1</span><span>8</span></span>", "<span class='fr'><span>3</span><span>16</span></span>", "<span class='fr'><span>1</span><span>4</span></span>", "<span class='fr'><span>5</span><span>16</span></span>", "<span class='fr'><span>3</span><span>8</span></span>"], "a": 4, "e": "독립시행의 확률에 의해 ₅C₃ × (1/2)³ × (1/2)² = 10/32 = 5/16.", "p": ""}, {"id": "MA-074", "s": "수학", "t": "단편", "g": 1, "d": "하", "q": "(2x + 1)(x − 3)을 전개했을 때 상수항은?", "c": ["−6", "−3", "−1", "1", "3"], "a": 2, "e": "(2x + 1)(x − 3) = 2x² − 5x − 3이므로 상수항은 −3이다.", "p": ""}, {"id": "MA-075", "s": "수학", "t": "단편", "g": 1, "d": "하", "q": "복소수 3 + 2i의 켤레복소수는?", "c": ["−3 + 2i", "−3 − 2i", "2 + 3i", "2 − 3i", "3 − 2i"], "a": 5, "e": "복소수 a + bi의 켤레복소수는 허수부분의 부호를 바꾼 a − bi이다.", "p": ""}, {"id": "MA-076", "s": "수학", "t": "단편", "g": 1, "d": "하", "q": "x² − 9를 인수분해한 것은?", "c": ["(x − 3)²", "(x + 3)²", "(x + 9)(x − 1)", "(x + 3)(x − 3)", "(x − 9)(x + 1)"], "a": 4, "e": "a² − b² = (a + b)(a − b)이므로 x² − 9 = (x + 3)(x − 3).", "p": ""}, {"id": "MA-077", "s": "수학", "t": "단편", "g": 1, "d": "하", "q": "부등식 2x − 4 > 0의 해는?", "c": ["x < 2", "x > −2", "x > 2", "x < −2", "x > 4"], "a": 3, "e": "2x > 4의 양변을 2로 나누면 x > 2.", "p": ""}, {"id": "MA-078", "s": "수학", "t": "단편", "g": 1, "d": "하", "q": "두 점 A(2, 3), B(6, 5)를 이은 선분 AB의 중점의 좌표는?", "c": ["(3, 4)", "(4, 5)", "(8, 8)", "(4, 4)", "(2, 1)"], "a": 4, "e": "중점의 좌표는 ((2 + 6)/2, (3 + 5)/2) = (4, 4).", "p": ""}, {"id": "MA-079", "s": "수학", "t": "단편", "g": 1, "d": "하", "q": "직선 y = 3x − 2의 기울기는?", "c": ["−3", "−2", "2", "3", "5"], "a": 4, "e": "직선 y = mx + n에서 기울기는 m이므로 3이다. −2는 y절편이다.", "p": ""}, {"id": "MA-080", "s": "수학", "t": "수능", "g": 1, "d": "하", "q": "이차방정식 x² − 5x + 6 = 0의 두 근의 합은?", "c": ["2", "3", "4", "5", "6"], "a": 4, "e": "(x − 2)(x − 3) = 0에서 두 근은 2, 3이므로 합은 5. 근과 계수의 관계로도 −(−5)/1 = 5이다.", "p": ""}, {"id": "MA-081", "s": "수학", "t": "수능", "g": 1, "d": "하", "q": "연립부등식 x − 1 > 0, 2x < 8을 만족시키는 정수 x의 개수는?", "c": ["2", "3", "4", "5", "6"], "a": 1, "e": "x > 1이고 x < 4이므로 1 < x < 4. 정수 x는 2, 3의 2개이다.", "p": ""}, {"id": "MA-082", "s": "수학", "t": "단편", "g": 1, "d": "하", "q": "원 x² + y² = 25의 반지름의 길이는?", "c": ["4", "5", "6", "7", "8"], "a": 2, "e": "원 x² + y² = r²의 반지름은 r이므로 √25 = 5.", "p": ""}, {"id": "MA-083", "s": "수학", "t": "수능", "g": 1, "d": "하", "q": "함수 f(x) = 2x + 1에 대하여 f(3)의 값은?", "c": ["6", "7", "8", "9", "10"], "a": 2, "e": "f(3) = 2 × 3 + 1 = 7.", "p": ""}, {"id": "MA-084", "s": "수학", "t": "단편", "g": 1, "d": "하", "q": "₄C₂의 값은?", "c": ["6", "8", "10", "12", "14"], "a": 1, "e": "₄C₂ = (4 × 3)/(2 × 1) = 6.", "p": ""}, {"id": "MA-085", "s": "수학", "t": "수능", "g": 1, "d": "하", "q": "명제 'x = 2이면 x² = 4이다.'의 역은?", "c": ["x ≠ 2이면 x² ≠ 4이다.", "x² ≠ 4이면 x ≠ 2이다.", "x² = 4이면 x = 2이다.", "x = 2이면 x² ≠ 4이다.", "x² = 4이고 x = 2이다."], "a": 3, "e": "명제 'p이면 q이다'의 역은 'q이면 p이다'이다. 참고로 이 역은 x = −2인 반례가 있어 거짓이다.", "p": ""}, {"id": "MA-086", "s": "수학", "t": "수능", "g": 1, "d": "하", "q": "(1 + i)²의 값은? (단, i = √−1)", "c": ["0", "2", "2i", "−2i", "1 + 2i"], "a": 3, "e": "(1 + i)² = 1 + 2i + i² = 1 + 2i − 1 = 2i.", "p": ""}, {"id": "MA-087", "s": "수학", "t": "단편", "g": 1, "d": "중", "q": "x³ − 1을 인수분해한 것은?", "c": ["(x − 1)(x² + x + 1)", "(x − 1)(x² − x + 1)", "(x + 1)(x² − x + 1)", "(x − 1)³", "(x − 1)(x² + 1)"], "a": 1, "e": "a³ − b³ = (a − b)(a² + ab + b²)이므로 x³ − 1 = (x − 1)(x² + x + 1).", "p": ""}, {"id": "MA-088", "s": "수학", "t": "수능", "g": 1, "d": "중", "q": "이차방정식 x² + 2x + k = 0이 중근을 갖도록 하는 상수 k의 값은?", "c": ["−1", "0", "1", "2", "4"], "a": 3, "e": "판별식 D/4 = 1 − k = 0에서 k = 1.", "p": ""}, {"id": "MA-089", "s": "수학", "t": "수능", "g": 1, "d": "중", "q": "이차부등식 x² − x − 6 < 0을 만족시키는 정수 x의 개수는?", "c": ["1", "2", "3", "4", "5"], "a": 4, "e": "(x − 3)(x + 2) < 0에서 −2 < x < 3. 정수 x는 −1, 0, 1, 2의 4개이다.", "p": ""}, {"id": "MA-090", "s": "수학", "t": "단편", "g": 1, "d": "중", "q": "(2 + i)(1 − i)의 값은? (단, i = √−1)", "c": ["1 − i", "3 + i", "1 + i", "2 − i", "3 − i"], "a": 5, "e": "2 − 2i + i − i² = 2 − i + 1 = 3 − i.", "p": ""}, {"id": "MA-091", "s": "수학", "t": "수능", "g": 1, "d": "중", "q": "점 (1, 2)와 직선 3x + 4y − 1 = 0 사이의 거리는?", "c": ["1", "2", "3", "4", "5"], "a": 2, "e": "|3 × 1 + 4 × 2 − 1| / √(3² + 4²) = 10/5 = 2.", "p": ""}, {"id": "MA-092", "s": "수학", "t": "수능", "g": 1, "d": "중", "q": "두 직선 y = 2x + 1, y = ax + 3이 서로 수직일 때, 상수 a의 값은?", "c": ["−2", "−<span class='fr'><span>1</span><span>2</span></span>", "<span class='fr'><span>1</span><span>2</span></span>", "1", "2"], "a": 2, "e": "두 직선이 수직이면 기울기의 곱이 −1이므로 2a = −1, a = −1/2.", "p": ""}, {"id": "MA-093", "s": "수학", "t": "단편", "g": 1, "d": "중", "q": "다항식 x³ + 2x² − x + 3을 x + 1로 나누었을 때의 나머지는?", "c": ["1", "3", "5", "7", "9"], "a": 3, "e": "나머지정리에 의해 f(−1) = −1 + 2 + 1 + 3 = 5.", "p": ""}, {"id": "MA-094", "s": "수학", "t": "수능", "g": 1, "d": "중", "q": "두 함수 f(x) = x + 2, g(x) = x²에 대하여 (g ∘ f)(1)의 값은?", "c": ["9", "11", "13", "15", "17"], "a": 1, "e": "(g ∘ f)(1) = g(f(1)) = g(3) = 9.", "p": ""}, {"id": "MA-095", "s": "수학", "t": "수능", "g": 1, "d": "중", "q": "함수 f(x) = 2x − 3의 역함수를 f⁻¹라 할 때, f⁻¹(5)의 값은?", "c": ["1", "2", "3", "4", "7"], "a": 4, "e": "f⁻¹(5) = a라 하면 f(a) = 5이므로 2a − 3 = 5, a = 4.", "p": ""}, {"id": "MA-096", "s": "수학", "t": "단편", "g": 1, "d": "중", "q": "두 집합 A = {1, 2, 3, 4, 5}, B = {2, 4, 6}에 대하여 집합 A − B의 모든 원소의 합은?", "c": ["9", "12", "15", "18", "21"], "a": 1, "e": "A − B = {1, 3, 5}이므로 원소의 합은 9.", "p": ""}, {"id": "MA-097", "s": "수학", "t": "수능", "g": 1, "d": "중", "q": "점 (3, −2)를 x축에 대하여 대칭이동한 다음 x축의 방향으로 2만큼 평행이동한 점의 좌표를 (a, b)라 할 때, a + b의 값은?", "c": ["3", "5", "7", "9", "11"], "a": 3, "e": "x축 대칭이동하면 (3, 2), x축 방향으로 2만큼 평행이동하면 (5, 2). 따라서 a + b = 7.", "p": ""}, {"id": "MA-098", "s": "수학", "t": "수능", "g": 1, "d": "중", "q": "5명 중에서 3명을 뽑아 일렬로 세우는 경우의 수는?", "c": ["10", "20", "30", "60", "120"], "a": 4, "e": "₅P₃ = 5 × 4 × 3 = 60.", "p": ""}, {"id": "MA-099", "s": "수학", "t": "단편", "g": 1, "d": "중", "q": "이차함수 y = −x² + 4x + 1의 최댓값은?", "c": ["5", "7", "9", "11", "13"], "a": 1, "e": "y = −(x − 2)² + 5이므로 x = 2일 때 최댓값 5를 갖는다.", "p": ""}, {"id": "MA-100", "s": "수학", "t": "수능", "g": 1, "d": "중", "q": "x + 1/x = 3일 때, x² + 1/x²의 값은?", "c": ["3", "5", "7", "9", "11"], "a": 3, "e": "x² + 1/x² = (x + 1/x)² − 2 = 9 − 2 = 7.", "p": ""}, {"id": "MA-101", "s": "수학", "t": "수능", "g": 1, "d": "상", "q": "x² − 3x + 1 = 0일 때, x³ + 1/x³의 값은?", "c": ["9", "12", "15", "18", "21"], "a": 4, "e": "x ≠ 0이므로 양변을 x로 나누면 x + 1/x = 3. x³ + 1/x³ = (x + 1/x)³ − 3(x + 1/x) = 27 − 9 = 18.", "p": ""}, {"id": "MA-102", "s": "수학", "t": "수능", "g": 1, "d": "상", "q": "이차함수 y = x² − 2ax + a² + a − 2의 그래프가 x축과 만나지 않도록 하는 가장 작은 정수 a의 값은?", "c": ["2", "3", "4", "5", "6"], "a": 2, "e": "y = (x − a)² + a − 2이므로 꼭짓점의 y좌표 a − 2가 0보다 커야 한다. a > 2이므로 가장 작은 정수는 3.", "p": ""}, {"id": "MA-103", "s": "수학", "t": "수능", "g": 1, "d": "상", "q": "삼차방정식 x³ − 6x² + 11x − 6 = 0의 세 근을 α, β, γ라 할 때, α² + β² + γ²의 값은?", "c": ["12", "14", "16", "18", "20"], "a": 2, "e": "(x − 1)(x − 2)(x − 3) = 0이므로 세 근은 1, 2, 3이고 1 + 4 + 9 = 14. (근과 계수의 관계로는 6² − 2 × 11 = 14)", "p": ""}, {"id": "MA-104", "s": "수학", "t": "단편", "g": 1, "d": "상", "q": "방정식 x² + x + 1 = 0의 한 허근을 ω라 할 때, ω¹⁰ + ω⁵ + 1의 값은?", "c": ["0", "1", "2", "3", "4"], "a": 1, "e": "ω³ = 1이므로 ω¹⁰ = ω, ω⁵ = ω². 따라서 ω + ω² + 1 = 0.", "p": ""}, {"id": "MA-105", "s": "수학", "t": "수능", "g": 1, "d": "상", "q": "원 x² + y² = 5 위의 점 (1, 2)에서의 접선의 y절편은?", "c": ["<span class='fr'><span>3</span><span>2</span></span>", "2", "<span class='fr'><span>5</span><span>2</span></span>", "3", "5"], "a": 3, "e": "원 x² + y² = r² 위의 점 (x₁, y₁)에서의 접선은 x₁x + y₁y = r²이므로 x + 2y = 5. x = 0일 때 y = 5/2.", "p": ""}, {"id": "MA-106", "s": "수학", "t": "수능", "g": 1, "d": "상", "q": "두 실수 x, y가 x + y = 4, x² + y² = 10을 만족시킬 때, |x − y|의 값은?", "c": ["2", "3", "4", "5", "6"], "a": 1, "e": "(x + y)² = x² + y² + 2xy에서 16 = 10 + 2xy, xy = 3. (x − y)² = 10 − 6 = 4이므로 |x − y| = 2.", "p": ""}, {"id": "MA-107", "s": "수학", "t": "수능", "g": 1, "d": "상", "q": "집합 A = {1, 2, 3, 4, 5}의 부분집합 중에서 1은 원소로 갖고 5는 원소로 갖지 않는 집합의 개수는?", "c": ["4", "8", "12", "16", "32"], "a": 2, "e": "1은 반드시 넣고 5는 빼므로 나머지 2, 3, 4의 포함 여부만 정하면 된다. 2³ = 8.", "p": ""}, {"id": "MA-108", "s": "수학", "t": "수능", "g": 1, "d": "상", "q": "x > 0일 때, x + 4/x의 최솟값은?", "c": ["2", "3", "4", "5", "6"], "a": 3, "e": "산술평균과 기하평균의 관계에 의해 x + 4/x ≥ 2√(x × 4/x) = 4. 등호는 x = 2일 때 성립한다.", "p": ""}, {"id": "MA-109", "s": "수학", "t": "수능", "g": 1, "d": "상", "q": "함수 f(x) = |x − 2| + |x + 1|의 최솟값은?", "c": ["2", "3", "4", "5", "6"], "a": 2, "e": "−1 ≤ x ≤ 2일 때 f(x) = (2 − x) + (x + 1) = 3으로 일정하고, 그 밖의 범위에서는 3보다 크다. 최솟값은 3.", "p": ""}, {"id": "MA-110", "s": "수학", "t": "수능", "g": 1, "d": "상", "q": "남학생 4명, 여학생 3명 중에서 3명을 뽑을 때, 여학생이 적어도 1명 포함되는 경우의 수는?", "c": ["25", "28", "31", "34", "35"], "a": 3, "e": "전체 ₇C₃ = 35에서 남학생만 뽑는 ₄C₃ = 4를 빼면 31.", "p": ""}, {"id": "MA-111", "s": "수학", "t": "단편", "g": 1, "d": "상", "q": "다항식 f(x)에 대하여 f(1) = 3, f(2) = 5이다. f(x)를 (x − 1)(x − 2)로 나누었을 때의 나머지를 ax + b라 할 때, a + b의 값은?", "c": ["2", "3", "4", "5", "6"], "a": 2, "e": "f(x) = (x − 1)(x − 2)Q(x) + ax + b에서 a + b = 3, 2a + b = 5이므로 a = 2, b = 1. 따라서 a + b = 3.", "p": ""}, {"id": "MA-112", "s": "수학", "t": "수능", "g": 1, "d": "상", "q": "직선 y = mx가 원 (x − 2)² + y² = 1에 접할 때, m²의 값은?", "c": ["<span class='fr'><span>1</span><span>4</span></span>", "<span class='fr'><span>1</span><span>3</span></span>", "<span class='fr'><span>1</span><span>2</span></span>", "1", "3"], "a": 2, "e": "원의 중심 (2, 0)과 직선 mx − y = 0 사이의 거리가 반지름 1과 같아야 한다. |2m|/√(m² + 1) = 1에서 4m² = m² + 1, m² = 1/3.", "p": ""}, {"id": "MA-113", "s": "수학", "t": "수능", "g": 1, "d": "상", "q": "부등식 |x − 1| < a의 해가 −2 < x < 4일 때, 양수 a의 값은?", "c": ["3", "4", "5", "6", "7"], "a": 1, "e": "|x − 1| < a이면 1 − a < x < 1 + a. 1 − a = −2, 1 + a = 4에서 a = 3.", "p": ""}, {"id": "MA-114", "s": "수학", "t": "수능", "g": 1, "d": "상", "q": "함수 y = (2x + 1)/(x − 1)의 그래프의 두 점근선의 교점의 좌표를 (p, q)라 할 때, p + q의 값은?", "c": ["1", "2", "3", "4", "5"], "a": 3, "e": "y = 3/(x − 1) + 2이므로 점근선은 x = 1, y = 2. 교점은 (1, 2)이고 p + q = 3.", "p": ""}, {"id": "MA-115", "s": "수학", "t": "단편", "g": 2, "d": "하", "q": "8<sup>1/3</sup>의 값은?", "c": ["1", "2", "3", "4", "8"], "a": 2, "e": "8<sup>1/3</sup> = (2³)<sup>1/3</sup> = 2.", "p": ""}, {"id": "MA-116", "s": "수학", "t": "단편", "g": 2, "d": "하", "q": "log₃ 27의 값은?", "c": ["1", "2", "3", "4", "9"], "a": 3, "e": "27 = 3³이므로 log₃ 27 = 3.", "p": ""}, {"id": "MA-117", "s": "수학", "t": "수능", "g": 2, "d": "하", "q": "등비수열 3, 6, 12, …의 제5항은?", "c": ["24", "36", "48", "60", "96"], "a": 3, "e": "첫째항 3, 공비 2이므로 a₅ = 3 × 2⁴ = 48.", "p": ""}, {"id": "MA-118", "s": "수학", "t": "단편", "g": 2, "d": "하", "q": "60°를 호도법으로 나타낸 것은?", "c": ["π/6", "π/4", "π/3", "π/2", "2π/3"], "a": 3, "e": "180° = π이므로 60° = π/3.", "p": ""}, {"id": "MA-119", "s": "수학", "t": "수능", "g": 2, "d": "하", "q": "lim<sub>x→1</sub> (x² + 2x)의 값은?", "c": ["2", "3", "4", "5", "6"], "a": 2, "e": "다항함수는 연속이므로 x = 1을 대입하면 1 + 2 = 3.", "p": ""}, {"id": "MA-120", "s": "수학", "t": "단편", "g": 2, "d": "하", "q": "함수 f(x) = x⁴의 도함수는?", "c": ["f′(x) = x³", "f′(x) = 3x³", "f′(x) = 4x⁴", "f′(x) = x⁵/5", "f′(x) = 4x³"], "a": 5, "e": "(xⁿ)′ = nxⁿ⁻¹이므로 f′(x) = 4x³.", "p": ""}, {"id": "MA-121", "s": "수학", "t": "수능", "g": 2, "d": "하", "q": "부정적분 ∫ 3x² dx를 구한 것은? (단, C는 적분상수)", "c": ["3x³ + C", "6x + C", "x² + C", "3x + C", "x³ + C"], "a": 5, "e": "(x³)′ = 3x²이므로 ∫ 3x² dx = x³ + C.", "p": ""}, {"id": "MA-122", "s": "수학", "t": "단편", "g": 2, "d": "하", "q": "tan(π/4)의 값은?", "c": ["0", "<span class='fr'><span>1</span><span>2</span></span>", "1", "√2", "√3"], "a": 3, "e": "π/4 = 45°이고 tan 45° = 1.", "p": ""}, {"id": "MA-123", "s": "수학", "t": "수능", "g": 2, "d": "하", "q": "Σ<sub>k=1</sub><sup>5</sup> k의 값은?", "c": ["15", "20", "25", "30", "35"], "a": 1, "e": "1 + 2 + 3 + 4 + 5 = 15.", "p": ""}, {"id": "MA-124", "s": "수학", "t": "단편", "g": 2, "d": "하", "q": "√2 × √8의 값은?", "c": ["2", "4", "6", "8", "16"], "a": 2, "e": "√2 × √8 = √16 = 4.", "p": ""}, {"id": "MA-125", "s": "수학", "t": "수능", "g": 2, "d": "하", "q": "함수 f(x) = 2x³ − x에 대하여 f′(1)의 값은?", "c": ["3", "4", "5", "6", "7"], "a": 3, "e": "f′(x) = 6x² − 1이므로 f′(1) = 5.", "p": ""}, {"id": "MA-126", "s": "수학", "t": "수능", "g": 2, "d": "중", "q": "log₂ 3 × log₃ 8의 값은?", "c": ["1", "2", "3", "4", "8"], "a": 3, "e": "밑의 변환 공식에 의해 log₂ 3 × log₃ 8 = log₂ 8 = 3.", "p": ""}, {"id": "MA-127", "s": "수학", "t": "수능", "g": 2, "d": "중", "q": "방정식 4<sup>x</sup> = 8의 해는?", "c": ["<span class='fr'><span>1</span><span>2</span></span>", "1", "<span class='fr'><span>3</span><span>2</span></span>", "2", "3"], "a": 3, "e": "2<sup>2x</sup> = 2³에서 2x = 3, x = 3/2.", "p": ""}, {"id": "MA-128", "s": "수학", "t": "단편", "g": 2, "d": "중", "q": "0 < θ < π/2이고 sin θ = 3/5일 때, cos θ의 값은?", "c": ["<span class='fr'><span>1</span><span>5</span></span>", "<span class='fr'><span>2</span><span>5</span></span>", "<span class='fr'><span>3</span><span>5</span></span>", "<span class='fr'><span>4</span><span>5</span></span>", "1"], "a": 4, "e": "sin²θ + cos²θ = 1에서 cos²θ = 16/25. θ가 제1사분면의 각이므로 cos θ = 4/5.", "p": ""}, {"id": "MA-129", "s": "수학", "t": "수능", "g": 2, "d": "중", "q": "첫째항이 2, 공차가 3인 등차수열의 첫째항부터 제10항까지의 합은?", "c": ["125", "135", "145", "155", "165"], "a": 4, "e": "S₁₀ = 10(2 × 2 + 9 × 3)/2 = 5 × 31 = 155.", "p": ""}, {"id": "MA-130", "s": "수학", "t": "수능", "g": 2, "d": "중", "q": "lim<sub>x→∞</sub> (2x² + 1)/(x² − x)의 값은?", "c": ["0", "2", "1", "3", "∞"], "a": 2, "e": "분자와 분모를 x²으로 나누면 (2 + 1/x²)/(1 − 1/x) → 2.", "p": ""}, {"id": "MA-131", "s": "수학", "t": "수능", "g": 2, "d": "중", "q": "곡선 y = x² − 4x + 1 위의 x = 3인 점에서의 접선의 기울기는?", "c": ["−4", "−2", "0", "2", "4"], "a": 4, "e": "y′ = 2x − 4이므로 x = 3에서 기울기는 2.", "p": ""}, {"id": "MA-132", "s": "수학", "t": "수능", "g": 2, "d": "중", "q": "정적분 ∫<sub>1</sub><sup>2</sup> (2x + 1) dx의 값은?", "c": ["2", "3", "4", "5", "6"], "a": 3, "e": "[x² + x]<sub>1</sub><sup>2</sup> = 6 − 2 = 4.", "p": ""}, {"id": "MA-133", "s": "수학", "t": "단편", "g": 2, "d": "중", "q": "1² + 2² + 3² + … + n²을 n에 대한 식으로 나타낸 것은?", "c": ["n(n + 1)/2", "{n(n + 1)/2}²", "n(n + 1)(n + 2)/3", "n(n + 1)(2n + 1)/6", "n²(n + 1)/2"], "a": 4, "e": "자연수의 제곱의 합 공식은 n(n + 1)(2n + 1)/6이다. n(n + 1)/2는 자연수의 합, {n(n + 1)/2}²은 세제곱의 합이다.", "p": ""}, {"id": "MA-134", "s": "수학", "t": "수능", "g": 2, "d": "중", "q": "함수 f(x) = x³ − 3x² + 2가 감소하는 구간이 a ≤ x ≤ b일 때, b − a의 값은?", "c": ["1", "2", "3", "4", "5"], "a": 2, "e": "f′(x) = 3x² − 6x = 3x(x − 2) ≤ 0에서 0 ≤ x ≤ 2. 따라서 b − a = 2.", "p": ""}, {"id": "MA-135", "s": "수학", "t": "수능", "g": 2, "d": "중", "q": "부등식 2<sup>x</sup> < 16을 만족시키는 자연수 x의 개수는?", "c": ["2", "3", "4", "5", "6"], "a": 2, "e": "2<sup>x</sup> < 2⁴에서 밑이 1보다 크므로 x < 4. 자연수 x는 1, 2, 3의 3개이다.", "p": ""}, {"id": "MA-136", "s": "수학", "t": "단편", "g": 2, "d": "중", "q": "삼각형 ABC에서 a = 4, A = 30°일 때, 외접원의 반지름의 길이는?", "c": ["2", "4", "6", "8", "16"], "a": 2, "e": "사인법칙 a/sin A = 2R에서 4/(1/2) = 8 = 2R, R = 4.", "p": ""}, {"id": "MA-137", "s": "수학", "t": "수능", "g": 2, "d": "중", "q": "두 변의 길이가 4, 6이고 그 끼인각의 크기가 30°인 삼각형의 넓이는?", "c": ["3", "6", "9", "12", "24"], "a": 2, "e": "S = ½ × 4 × 6 × sin 30° = 12 × ½ = 6.", "p": ""}, {"id": "MA-138", "s": "수학", "t": "수능", "g": 2, "d": "중", "q": "함수 f(x)가 x ≠ 1일 때 f(x) = (x² − 1)/(x − 1)이고 f(1) = a이다. f(x)가 x = 1에서 연속일 때, 상수 a의 값은?", "c": ["0", "1", "2", "3", "4"], "a": 3, "e": "lim<sub>x→1</sub> (x² − 1)/(x − 1) = lim<sub>x→1</sub> (x + 1) = 2. 연속이려면 f(1) = 2.", "p": ""}, {"id": "MA-139", "s": "수학", "t": "수능", "g": 2, "d": "상", "q": "방정식 (log₂ x)² − 3 log₂ x + 2 = 0의 두 근의 곱은?", "c": ["2", "4", "6", "8", "16"], "a": 4, "e": "log₂ x = t로 놓으면 (t − 1)(t − 2) = 0에서 t = 1, 2. x = 2, 4이므로 곱은 8.", "p": ""}, {"id": "MA-140", "s": "수학", "t": "수능", "g": 2, "d": "상", "q": "함수 f(x) = x³ − 3x² − 9x + a의 극솟값이 0일 때, 상수 a의 값은?", "c": ["5", "9", "18", "27", "32"], "a": 4, "e": "f′(x) = 3(x − 3)(x + 1)이므로 x = 3에서 극소. f(3) = 27 − 27 − 27 + a = 0에서 a = 27.", "p": ""}, {"id": "MA-141", "s": "수학", "t": "수능", "g": 2, "d": "상", "q": "정적분 ∫<sub>−1</sub><sup>1</sup> (x³ + 3x² + x) dx의 값은?", "c": ["0", "1", "2", "3", "4"], "a": 3, "e": "x³, x는 기함수이므로 적분값이 0이고, 3x²은 우함수이므로 2∫<sub>0</sub><sup>1</sup> 3x² dx = 2 × 1 = 2.", "p": ""}, {"id": "MA-142", "s": "수학", "t": "수능", "g": 2, "d": "상", "q": "수열 {aₙ}이 a₁ = 1, aₙ₊₁ = 2aₙ + 1을 만족시킬 때, a₅의 값은?", "c": ["15", "23", "31", "47", "63"], "a": 3, "e": "차례로 구하면 1, 3, 7, 15, 31이므로 a₅ = 31. (aₙ = 2ⁿ − 1)", "p": ""}, {"id": "MA-143", "s": "수학", "t": "수능", "g": 2, "d": "상", "q": "0 ≤ x < 2π일 때, 방정식 sin x = cos x의 모든 해의 합은?", "c": ["π", "<span class='fr'><span>3π</span><span>2</span></span>", "2π", "<span class='fr'><span>5π</span><span>2</span></span>", "3π"], "a": 2, "e": "tan x = 1에서 x = π/4, 5π/4. 합은 6π/4 = 3π/2.", "p": ""}, {"id": "MA-144", "s": "수학", "t": "수능", "g": 2, "d": "상", "q": "곡선 y = x²과 직선 y = x + 2로 둘러싸인 부분의 넓이는?", "c": ["<span class='fr'><span>7</span><span>2</span></span>", "4", "<span class='fr'><span>9</span><span>2</span></span>", "5", "<span class='fr'><span>11</span><span>2</span></span>"], "a": 3, "e": "x² = x + 2에서 x = −1, 2. ∫<sub>−1</sub><sup>2</sup> (x + 2 − x²) dx = [x²/2 + 2x − x³/3]<sub>−1</sub><sup>2</sup> = 10/3 − (−7/6) = 9/2.", "p": ""}, {"id": "MA-145", "s": "수학", "t": "수능", "g": 2, "d": "상", "q": "Σ<sub>k=1</sub><sup>9</sup> 1/{k(k + 1)}의 값은?", "c": ["<span class='fr'><span>4</span><span>5</span></span>", "<span class='fr'><span>8</span><span>9</span></span>", "<span class='fr'><span>9</span><span>10</span></span>", "<span class='fr'><span>10</span><span>11</span></span>", "1"], "a": 3, "e": "1/{k(k + 1)} = 1/k − 1/(k + 1)이므로 합은 1 − 1/10 = 9/10.", "p": ""}, {"id": "MA-146", "s": "수학", "t": "단편", "g": 2, "d": "상", "q": "함수 y = 2 sin 3x + 1의 최댓값과 최솟값의 합은?", "c": ["0", "1", "2", "3", "4"], "a": 3, "e": "−1 ≤ sin 3x ≤ 1이므로 최댓값은 3, 최솟값은 −1. 합은 2.", "p": ""}, {"id": "MA-147", "s": "수학", "t": "수능", "g": 2, "d": "상", "q": "다항함수 f(x)가 lim<sub>x→2</sub> {f(x) − 3}/(x − 2) = 5를 만족시킬 때, f(2) + f′(2)의 값은?", "c": ["5", "6", "7", "8", "9"], "a": 4, "e": "분모가 0으로 가므로 분자도 0으로 가야 한다. f(2) = 3. 이때 극한은 f′(2)의 정의이므로 f′(2) = 5. 합은 8.", "p": ""}, {"id": "MA-148", "s": "수학", "t": "수능", "g": 2, "d": "상", "q": "2<sup>x</sup> + 2<sup>−x</sup> = 3일 때, 4<sup>x</sup> + 4<sup>−x</sup>의 값은?", "c": ["3", "5", "7", "9", "11"], "a": 3, "e": "양변을 제곱하면 4<sup>x</sup> + 2 + 4<sup>−x</sup> = 9이므로 4<sup>x</sup> + 4<sup>−x</sup> = 7.", "p": ""}, {"id": "MA-149", "s": "수학", "t": "단편", "g": 3, "d": "하", "q": "₅P₂의 값은?", "c": ["10", "15", "20", "25", "30"], "a": 3, "e": "₅P₂ = 5 × 4 = 20.", "p": ""}, {"id": "MA-150", "s": "수학", "t": "단편", "g": 3, "d": "하", "q": "함수 y = e<sup>x</sup>의 도함수는?", "c": ["y′ = xe<sup>x−1</sup>", "y′ = e<sup>x</sup>", "y′ = e<sup>x−1</sup>", "y′ = 1/x", "y′ = ln x"], "a": 2, "e": "(e<sup>x</sup>)′ = e<sup>x</sup>이다.", "p": ""}, {"id": "MA-151", "s": "수학", "t": "수능", "g": 3, "d": "하", "q": "서로 다른 두 개의 주사위를 동시에 던질 때, 나온 눈의 수의 합이 2일 확률은?", "c": ["<span class='fr'><span>1</span><span>36</span></span>", "<span class='fr'><span>1</span><span>18</span></span>", "<span class='fr'><span>1</span><span>12</span></span>", "<span class='fr'><span>1</span><span>6</span></span>", "<span class='fr'><span>1</span><span>2</span></span>"], "a": 1, "e": "전체 36가지 중 합이 2인 경우는 (1, 1)의 1가지이므로 1/36.", "p": ""}, {"id": "MA-152", "s": "수학", "t": "단편", "g": 3, "d": "하", "q": "함수 y = ln x의 도함수는?", "c": ["y′ = ln x", "y′ = e<sup>x</sup>", "y′ = x", "y′ = 1/x", "y′ = 1/x²"], "a": 4, "e": "(ln x)′ = 1/x이다.", "p": ""}, {"id": "MA-153", "s": "수학", "t": "수능", "g": 3, "d": "하", "q": "lim<sub>n→∞</sub> (n + 1)/(2n)의 값은?", "c": ["0", "<span class='fr'><span>1</span><span>2</span></span>", "1", "2", "∞"], "a": 2, "e": "(n + 1)/(2n) = 1/2 + 1/(2n) → 1/2.", "p": ""}, {"id": "MA-154", "s": "수학", "t": "단편", "g": 3, "d": "하", "q": "확률변수 X의 평균이 E(X) = 5일 때, E(2X)의 값은?", "c": ["5", "7", "10", "20", "25"], "a": 3, "e": "E(aX) = aE(X)이므로 E(2X) = 10.", "p": ""}, {"id": "MA-155", "s": "수학", "t": "수능", "g": 3, "d": "하", "q": "정적분 ∫<sub>0</sub><sup>1</sup> e<sup>x</sup> dx의 값은?", "c": ["e − 1", "1", "e", "e + 1", "2e"], "a": 1, "e": "[e<sup>x</sup>]<sub>0</sub><sup>1</sup> = e − 1.", "p": ""}, {"id": "MA-156", "s": "수학", "t": "단편", "g": 3, "d": "하", "q": "표준정규분포 N(0, 1)의 평균과 표준편차의 합은?", "c": ["1", "2", "3", "4", "5"], "a": 1, "e": "표준정규분포는 평균이 0, 표준편차가 1인 정규분포이므로 합은 1.", "p": ""}, {"id": "MA-157", "s": "수학", "t": "수능", "g": 3, "d": "하", "q": "3명을 일렬로 세우는 경우의 수는?", "c": ["3", "6", "9", "12", "27"], "a": 2, "e": "3! = 3 × 2 × 1 = 6.", "p": ""}, {"id": "MA-158", "s": "수학", "t": "단편", "g": 3, "d": "하", "q": "함수 y = cos x의 도함수는?", "c": ["y′ = −sin x", "y′ = sin x", "y′ = cos x", "y′ = −cos x", "y′ = tan x"], "a": 1, "e": "(cos x)′ = −sin x이다.", "p": ""}, {"id": "MA-159", "s": "수학", "t": "수능", "g": 3, "d": "하", "q": "등비급수 Σ<sub>n=1</sub><sup>∞</sup> (1/2)ⁿ의 값은?", "c": ["<span class='fr'><span>1</span><span>2</span></span>", "1", "<span class='fr'><span>3</span><span>2</span></span>", "2", "발산한다"], "a": 2, "e": "첫째항 1/2, 공비 1/2인 등비급수이므로 (1/2)/(1 − 1/2) = 1.", "p": ""}, {"id": "MA-160", "s": "수학", "t": "수능", "g": 3, "d": "중", "q": "5개의 문자 a, a, b, b, c를 일렬로 나열하는 경우의 수는?", "c": ["20", "30", "60", "90", "120"], "a": 2, "e": "같은 것이 있는 순열이므로 5!/(2! × 2!) = 120/4 = 30.", "p": ""}, {"id": "MA-161", "s": "수학", "t": "수능", "g": 3, "d": "중", "q": "함수 f(x) = x ln x에 대하여 f′(e)의 값은?", "c": ["2", "0", "1", "e", "e + 1"], "a": 1, "e": "곱의 미분법에 의해 f′(x) = ln x + 1이므로 f′(e) = 1 + 1 = 2.", "p": ""}, {"id": "MA-162", "s": "수학", "t": "수능", "g": 3, "d": "중", "q": "두 사건 A, B가 서로 독립이고 P(A) = 0.4, P(B) = 0.5일 때, P(A ∪ B)의 값은?", "c": ["0.2", "0.5", "0.7", "0.8", "0.9"], "a": 3, "e": "독립이므로 P(A ∩ B) = 0.4 × 0.5 = 0.2. P(A ∪ B) = 0.4 + 0.5 − 0.2 = 0.7.", "p": ""}, {"id": "MA-163", "s": "수학", "t": "수능", "g": 3, "d": "중", "q": "정적분 ∫<sub>0</sub><sup>π</sup> sin x dx의 값은?", "c": ["0", "1", "2", "π", "2π"], "a": 3, "e": "[−cos x]<sub>0</sub><sup>π</sup> = 1 − (−1) = 2.", "p": ""}, {"id": "MA-164", "s": "수학", "t": "단편", "g": 3, "d": "중", "q": "확률변수 X가 이항분포 B(50, 1/5)을 따를 때, X의 평균은?", "c": ["5", "8", "10", "25", "40"], "a": 3, "e": "이항분포 B(n, p)의 평균은 np = 50 × 1/5 = 10.", "p": ""}, {"id": "MA-165", "s": "수학", "t": "수능", "g": 3, "d": "중", "q": "lim<sub>x→0</sub> (sin 2x)/x의 값은?", "c": ["0", "<span class='fr'><span>1</span><span>2</span></span>", "1", "2", "4"], "a": 4, "e": "(sin 2x)/x = 2 × (sin 2x)/(2x) → 2 × 1 = 2.", "p": ""}, {"id": "MA-166", "s": "수학", "t": "수능", "g": 3, "d": "중", "q": "함수 f(x) = x/(x + 1)에 대하여 f′(1)의 값은?", "c": ["<span class='fr'><span>1</span><span>4</span></span>", "<span class='fr'><span>1</span><span>2</span></span>", "1", "2", "4"], "a": 1, "e": "몫의 미분법에 의해 f′(x) = {(x + 1) − x}/(x + 1)² = 1/(x + 1)²이므로 f′(1) = 1/4.", "p": ""}, {"id": "MA-167", "s": "수학", "t": "수능", "g": 3, "d": "중", "q": "방정식 x + y + z = 5를 만족시키는 음이 아닌 정수 x, y, z의 순서쌍 (x, y, z)의 개수는?", "c": ["10", "15", "21", "28", "35"], "a": 3, "e": "서로 다른 3개에서 중복을 허락하여 5개를 택하는 중복조합의 수와 같으므로 ₃H₅ = ₇C₂ = 21.", "p": ""}, {"id": "MA-168", "s": "수학", "t": "단편", "g": 3, "d": "중", "q": "lim<sub>x→0</sub> (1 + x)<sup>1/x</sup>의 값은?", "c": ["0", "1", "2", "e", "∞"], "a": 4, "e": "무리수 e의 정의로, lim<sub>x→0</sub> (1 + x)<sup>1/x</sup> = e이다.", "p": ""}, {"id": "MA-169", "s": "수학", "t": "수능", "g": 3, "d": "상", "q": "정적분 ∫<sub>1</sub><sup>e</sup> x ln x dx의 값은?", "c": ["<span class='fr'><span>e² − 1</span><span>4</span></span>", "<span class='fr'><span>e² + 1</span><span>4</span></span>", "<span class='fr'><span>e²</span><span>2</span></span>", "<span class='fr'><span>e² + 1</span><span>2</span></span>", "e²"], "a": 2, "e": "부분적분법에 의해 [x²/2 × ln x]<sub>1</sub><sup>e</sup> − ∫<sub>1</sub><sup>e</sup> x/2 dx = e²/2 − (e² − 1)/4 = (e² + 1)/4.", "p": ""}, {"id": "MA-170", "s": "수학", "t": "수능", "g": 3, "d": "상", "q": "주머니 A에는 흰 공 2개와 검은 공 1개, 주머니 B에는 흰 공 1개와 검은 공 2개가 들어 있다. 두 주머니 중 하나를 임의로 택하여 공 1개를 꺼냈더니 흰 공이었을 때, 그 공이 주머니 A에서 나왔을 확률은?", "c": ["<span class='fr'><span>1</span><span>3</span></span>", "<span class='fr'><span>1</span><span>2</span></span>", "<span class='fr'><span>2</span><span>3</span></span>", "<span class='fr'><span>3</span><span>4</span></span>", "<span class='fr'><span>5</span><span>6</span></span>"], "a": 3, "e": "P(흰 공) = 1/2 × 2/3 + 1/2 × 1/3 = 1/2, P(A이고 흰 공) = 1/3. 따라서 조건부확률은 (1/3)/(1/2) = 2/3.", "p": ""}, {"id": "MA-171", "s": "수학", "t": "수능", "g": 3, "d": "상", "q": "함수 f(x) = e<sup>x</sup> − x의 최솟값은?", "c": ["0", "e − 1", "e", "2", "1"], "a": 5, "e": "f′(x) = e<sup>x</sup> − 1 = 0에서 x = 0. x < 0에서 감소, x > 0에서 증가하므로 최솟값은 f(0) = 1.", "p": ""}, {"id": "MA-172", "s": "수학", "t": "수능", "g": 3, "d": "상", "q": "곡선 y = 1/x과 x축 및 두 직선 x = 1, x = e로 둘러싸인 부분의 넓이는?", "c": ["<span class='fr'><span>1</span><span>2</span></span>", "1", "e − 1", "2", "e"], "a": 2, "e": "∫<sub>1</sub><sup>e</sup> (1/x) dx = [ln x]<sub>1</sub><sup>e</sup> = 1.", "p": ""}, {"id": "MA-173", "s": "수학", "t": "수능", "g": 3, "d": "상", "q": "확률변수 X가 이항분포 B(n, 1/2)을 따르고 V(X) = 25일 때, n의 값은?", "c": ["25", "50", "75", "100", "200"], "a": 4, "e": "V(X) = n × 1/2 × 1/2 = n/4 = 25에서 n = 100.", "p": ""}, {"id": "MA-174", "s": "수학", "t": "수능", "g": 3, "d": "상", "q": "곡선 x² + y² = 25 위의 점 (3, 4)에서의 접선의 기울기 dy/dx의 값은?", "c": ["−<span class='fr'><span>4</span><span>3</span></span>", "−<span class='fr'><span>3</span><span>4</span></span>", "<span class='fr'><span>3</span><span>4</span></span>", "<span class='fr'><span>4</span><span>3</span></span>", "0"], "a": 2, "e": "양변을 x에 대하여 미분하면 2x + 2y(dy/dx) = 0이므로 dy/dx = −x/y = −3/4.", "p": ""}, {"id": "MA-175", "s": "수학", "t": "수능", "g": 3, "d": "상", "q": "급수 Σ<sub>n=1</sub><sup>∞</sup> 1/{n(n + 1)}의 합은?", "c": ["<span class='fr'><span>1</span><span>2</span></span>", "1", "<span class='fr'><span>3</span><span>2</span></span>", "2", "발산한다"], "a": 2, "e": "부분합은 Sₙ = 1 − 1/(n + 1)이고 n → ∞일 때 1로 수렴한다.", "p": ""}, {"id": "MA-176", "s": "수학", "t": "수능", "g": 3, "d": "상", "q": "방정식 x + y + z = 6을 만족시키는 자연수 x, y, z의 순서쌍 (x, y, z)의 개수는?", "c": ["6", "10", "15", "21", "28"], "a": 2, "e": "x = x′ + 1, y = y′ + 1, z = z′ + 1로 놓으면 x′ + y′ + z′ = 3의 음이 아닌 정수해의 개수와 같다. ₃H₃ = ₅C₂ = 10.", "p": ""}, {"id": "MA-177", "s": "수학", "t": "수능", "g": 3, "d": "상", "q": "(x + 1/x)⁶의 전개식에서 상수항은?", "c": ["6", "15", "20", "30", "64"], "a": 3, "e": "일반항은 ₆Cᵣ x<sup>6−2r</sup>이고 6 − 2r = 0에서 r = 3. 상수항은 ₆C₃ = 20.", "p": ""}, {"id": "MA-178", "s": "수학", "t": "수능", "g": 3, "d": "상", "q": "lim<sub>n→∞</sub> {√(n² + 2n) − n}의 값은?", "c": ["0", "<span class='fr'><span>1</span><span>2</span></span>", "1", "2", "∞"], "a": 3, "e": "분자를 유리화하면 2n/{√(n² + 2n) + n}. 분자와 분모를 n으로 나누면 2/{√(1 + 2/n) + 1} → 2/2 = 1.", "p": ""}, {"id": "MA-179", "s": "수학", "t": "단편", "g": 3, "d": "상", "q": "함수 f(x) = sin²x에 대하여 f′(π/4)의 값은?", "c": ["0", "<span class='fr'><span>1</span><span>2</span></span>", "<span class='fr'><span>√2</span><span>2</span></span>", "1", "2"], "a": 4, "e": "f′(x) = 2 sin x cos x = sin 2x이므로 f′(π/4) = sin(π/2) = 1.", "p": ""}, {"id": "MA-180", "s": "수학", "t": "수능", "g": 3, "d": "상", "q": "확률변수 X가 정규분포 N(10, 2²)을 따를 때, 확률변수 Y = 2X + 1의 평균과 표준편차의 합은?", "c": ["21", "23", "25", "27", "29"], "a": 3, "e": "E(Y) = 2 × 10 + 1 = 21, σ(Y) = 2 × 2 = 4이므로 합은 25.", "p": ""}, {"id": "HI-001", "s": "한국사", "t": "단편", "g": 1, "d": "하", "q": "신석기 시대를 대표하는 토기는?", "c": ["민무늬 토기", "미송리식 토기", "검은 간 토기", "붉은 간 토기", "빗살무늬 토기"], "a": 5, "e": "빗살무늬 토기는 신석기 시대의 대표적인 토기이다. 민무늬 토기, 미송리식 토기, 붉은 간 토기는 청동기 시대, 검은 간 토기는 철기 시대의 토기이다.", "p": ""}, {"id": "HI-002", "s": "한국사", "t": "단편", "g": 1, "d": "하", "q": "고조선에 대한 설명으로 옳은 것은?", "c": ["범금 8조를 두어 사회 질서를 유지하였다.", "골품제라는 신분 제도가 있었다.", "22담로에 왕족을 파견하였다.", "5경 15부 62주의 지방 제도를 갖추었다.", "정사암 회의에서 재상을 선출하였다."], "a": 1, "e": "고조선은 범금 8조(8조법)로 사회 질서를 유지했으며 현재 3개 조항이 전한다. 골품제는 신라, 22담로와 정사암 회의는 백제, 5경 15부 62주는 발해와 관련된다.", "p": ""}, {"id": "HI-003", "s": "한국사", "t": "단편", "g": 1, "d": "중", "q": "아버지의 업적을 기리기 위해 광개토 대왕릉비를 세운 고구려의 왕은?", "c": ["소수림왕", "장수왕", "고국천왕", "미천왕", "영양왕"], "a": 2, "e": "장수왕은 414년 아버지 광개토 대왕의 업적을 기리는 비를 세웠으며, 427년 평양으로 천도하고 남진 정책을 추진하였다.", "p": ""}, {"id": "HI-004", "s": "한국사", "t": "단편", "g": 1, "d": "중", "q": "통일 신라 신문왕의 업적으로 <u>옳지 않은</u> 것은?", "c": ["관료전을 지급하였다.", "녹읍을 폐지하였다.", "국학을 설립하였다.", "9주 5소경 체제를 갖추었다.", "독서삼품과를 실시하였다."], "a": 5, "e": "독서삼품과는 원성왕(788) 때 유교 경전 이해 수준으로 관리를 뽑기 위해 실시하였다. 나머지는 모두 왕권을 강화한 신문왕의 정책이다.", "p": ""}, {"id": "HI-005", "s": "한국사", "t": "단편", "g": 1, "d": "중", "q": "고려 시대에 노비안검법을 실시하고 쌍기의 건의로 과거제를 도입한 왕은?", "c": ["태조", "성종", "현종", "공민왕", "광종"], "a": 5, "e": "광종은 노비안검법(956)으로 불법적으로 노비가 된 사람을 양인으로 되돌려 호족 세력을 약화하고, 과거제(958)를 시행하여 왕권을 강화하였다.", "p": ""}, {"id": "HI-006", "s": "한국사", "t": "단편", "g": 1, "d": "중", "q": "최승로의 시무 28조를 받아들여 12목에 지방관을 파견한 고려의 왕은?", "c": ["태조", "광종", "숙종", "성종", "인종"], "a": 4, "e": "성종은 최승로의 시무 28조를 수용해 유교 정치 이념을 확립하고, 처음으로 12목에 지방관을 파견하였다.", "p": ""}, {"id": "HI-007", "s": "한국사", "t": "단편", "g": 1, "d": "상", "q": "고려 무신 집권기에 교정도감을 설치하여 국정을 장악한 인물은?", "c": ["정중부", "이의민", "최우", "최충헌", "김준"], "a": 4, "e": "최충헌은 교정도감을 설치하여 최고 권력 기구로 삼았다. 그 아들 최우는 정방(인사 기구)과 서방(문신 숙위 기구)을 설치하였다.", "p": ""}, {"id": "HI-008", "s": "한국사", "t": "단편", "g": 1, "d": "중", "q": "조선 세종 대의 사실로 <u>옳지 않은</u> 것은?", "c": ["훈민정음을 창제하였다.", "경국대전을 완성하였다.", "4군 6진을 개척하였다.", "공법(전분 6등법, 연분 9등법)을 마련하였다.", "농사직설을 편찬하였다."], "a": 2, "e": "경국대전은 세조 때 편찬을 시작하여 성종 때 완성·반포되었다. 나머지는 모두 세종 대의 업적이다.", "p": ""}, {"id": "HI-009", "s": "한국사", "t": "단편", "g": 1, "d": "하", "q": "임진왜란 때 행주산성에서 일본군을 크게 물리친 인물은?", "c": ["이순신", "김시민", "곽재우", "권율", "신립"], "a": 4, "e": "권율은 1593년 행주 대첩을 승리로 이끌었다. 김시민은 진주 대첩, 이순신은 한산도 대첩 등 해전을 이끌었다.", "p": ""}, {"id": "HI-010", "s": "한국사", "t": "단편", "g": 1, "d": "상", "q": "조선 후기 대동법에 대한 설명으로 옳은 것은?", "c": ["공납을 토지 결수에 따라 쌀·베·동전 등으로 내게 하였다.", "영조 때 처음 시행되었다.", "군포 부담을 1년에 1필로 줄였다.", "토지 비옥도와 풍흉에 따라 전세를 차등 징수하였다.", "16세 이상 남자에게 호패를 차게 하였다."], "a": 1, "e": "대동법은 광해군 때 경기도에서 처음 실시되어(1608) 숙종 때 전국으로 확대되었다. 군포 1필은 균역법, 비옥도·풍흉에 따른 전세는 세종의 공법, 호패는 호패법의 내용이다.", "p": ""}, {"id": "HI-011", "s": "한국사", "t": "단편", "g": 1, "d": "중", "q": "흥선 대원군의 정책으로 <u>옳지 않은</u> 것은?", "c": ["서원을 대폭 정리하였다.", "경복궁을 중건하였다.", "갑신정변을 일으켰다.", "양반에게도 군포를 걷는 호포제를 실시하였다.", "비변사의 기능을 축소하였다."], "a": 3, "e": "갑신정변(1884)은 김옥균 등 급진 개화파가 일으킨 정변이다. 나머지는 흥선 대원군의 왕권 강화 및 민생 안정 정책이다.", "p": ""}, {"id": "HI-012", "s": "한국사", "t": "단편", "g": 2, "d": "중", "q": "제1차 갑오개혁의 내용으로 옳은 것은?", "c": ["단발령을 시행하였다.", "과거제를 폐지하였다.", "지계를 발급하였다.", "홍범 14조를 반포하였다.", "건양이라는 연호를 사용하였다."], "a": 2, "e": "제1차 갑오개혁(1894)은 군국기무처를 중심으로 과거제 폐지, 신분제 폐지 등을 추진하였다. 홍범 14조는 제2차 갑오개혁, 단발령과 건양 연호는 을미개혁, 지계 발급은 광무개혁의 내용이다.", "p": ""}, {"id": "HI-013", "s": "한국사", "t": "단편", "g": 1, "d": "하", "q": "1919년 수립된 대한민국 임시 정부가 처음 자리 잡은 도시는?", "c": ["상하이", "블라디보스토크", "충칭", "베이징", "하와이"], "a": 1, "e": "3·1 운동 이후 1919년 4월 상하이에서 대한민국 임시 정부가 수립되었다. 이후 여러 곳을 옮겨 1940년 충칭에 자리 잡았다.", "p": ""}, {"id": "HI-014", "s": "한국사", "t": "단편", "g": 2, "d": "중", "q": "1945년 12월 모스크바 3국 외상 회의에서 결정된 내용으로 옳은 것은?", "c": ["한반도에 임시 민주 정부를 수립하고 최대 5년간 신탁 통치를 실시한다.", "유엔 감시하에 남북한 총선거를 실시한다.", "북위 38도선을 경계로 미·소 양군이 주둔한다.", "한국을 적당한 시기에 독립시킨다는 원칙을 처음 밝힌다.", "남한만의 단독 정부를 수립한다."], "a": 1, "e": "모스크바 3국 외상 회의에서는 임시 민주 정부 수립, 미·소 공동 위원회 설치, 최대 5년간의 신탁 통치를 결정하였다. 한국의 독립을 처음 약속한 것은 카이로 회담(1943)이다.", "p": ""}, {"id": "HI-015", "s": "한국사", "t": "단편", "g": 2, "d": "하", "q": "1960년 3·15 부정 선거에 항거하여 일어나 이승만 정부를 무너뜨린 사건은?", "c": ["4·19 혁명", "5·16 군사 정변", "부·마 민주 항쟁", "5·18 민주화 운동", "6월 민주 항쟁"], "a": 1, "e": "4·19 혁명(1960)으로 이승만이 대통령직에서 물러났다. 6월 민주 항쟁(1987)은 대통령 직선제 개헌을 이끌어 냈다.", "p": ""}, {"id": "HI-016", "s": "한국사", "t": "단편", "g": 2, "d": "중", "q": "6·25 전쟁의 정전 협정이 체결된 해는?", "c": ["1950년", "1951년", "1952년", "1953년", "1954년"], "a": 4, "e": "1951년부터 정전 회담이 시작되어 1953년 7월 27일에 정전 협정이 체결되었다.", "p": ""}, {"id": "HI-017", "s": "한국사", "t": "수능", "g": 2, "d": "중", "q": "다음 자료의 주장을 내세운 사건에 대한 설명으로 옳은 것은?\n<div class='box'>개경은 이미 땅의 기운이 쇠하였고, 서경에는 왕이 될 기운이 서려 있습니다. 도읍을 서경으로 옮기시면 금나라가 스스로 항복하고 주변의 여러 나라가 모두 신하가 될 것입니다.</div>", "c": ["김부식이 이끄는 관군에 의해 진압되었다.", "망이·망소이가 주도하였다.", "무신 정권 수립의 직접적인 계기가 되었다.", "삼별초가 진도와 제주도로 근거지를 옮겼다.", "몽골의 침입에 맞서 일어났다."], "a": 1, "e": "서경 천도와 금 정벌을 주장한 것은 묘청의 서경 천도 운동(1135)이다. 묘청 세력은 서경에서 난을 일으켰으나 김부식이 이끄는 관군에 의해 진압되었다.", "p": ""}, {"id": "HI-018", "s": "한국사", "t": "수능", "g": 3, "d": "상", "q": "다음 자료의 단체에 대한 설명으로 옳은 것은?\n<div class='box'>이 단체는 1907년 안창호, 양기탁 등이 비밀 결사로 조직하였다. 공화정체의 국민 국가 수립을 목표로 하였으며, 대성 학교와 오산 학교를 세우고 태극 서관과 자기 회사를 운영하였다. 또한 국외에 독립운동 기지를 건설하는 데 힘썼다.</div>", "c": ["독립문을 건립하였다.", "만민 공동회를 개최하였다.", "일본의 황무지 개간권 요구를 저지하였다.", "105인 사건으로 조직이 와해되었다.", "고종의 강제 퇴위 반대 운동을 주도하다가 해산되었다."], "a": 4, "e": "자료는 신민회이다. 신민회는 서간도 삼원보에 신흥 강습소를 세우는 등 독립운동 기지 건설에 힘썼으나, 일제가 조작한 105인 사건(1911)으로 조직이 와해되었다. 독립문·만민 공동회는 독립 협회, 황무지 개간권 저지는 보안회, 고종 강제 퇴위 반대는 대한 자강회와 관련된다.", "p": ""}, {"id": "HI-019", "s": "한국사", "t": "수능", "g": 2, "d": "중", "q": "다음 구호를 내세운 운동에 대한 설명으로 옳은 것은?\n<div class='box'>내 살림 내 것으로! 조선 사람 조선 것!</div>", "c": ["대구에서 서상돈 등의 제안으로 시작되었다.", "한국인 본위의 대학 설립을 목표로 하였다.", "신간회의 지원을 받아 전국으로 확산되었다.", "브나로드 운동이라는 이름으로 전개되었다.", "조만식 등이 평양에서 시작하였다."], "a": 5, "e": "물산 장려 운동은 1920년 조만식 등이 평양에서 시작하여 국산품 애용과 민족 자본 육성을 주장하였다. 서상돈은 국채 보상 운동, 대학 설립은 민립 대학 설립 운동, 브나로드 운동은 농촌 계몽 운동이다.", "p": ""}, {"id": "HI-020", "s": "한국사", "t": "수능", "g": 3, "d": "상", "q": "다음 사건을 일어난 순서대로 바르게 나열한 것은?\n<div class='box'>(가) 을미사변　(나) 갑신정변　(다) 아관 파천　(라) 동학 농민 운동</div>", "c": ["(가) - (나) - (라) - (다)", "(나) - (가) - (라) - (다)", "(나) - (라) - (가) - (다)", "(라) - (나) - (다) - (가)", "(나) - (라) - (다) - (가)"], "a": 3, "e": "갑신정변(1884) → 동학 농민 운동(1894) → 을미사변(1895) → 아관 파천(1896) 순이다. 을미사변 이후 신변에 위협을 느낀 고종이 러시아 공사관으로 거처를 옮긴 것이 아관 파천이다.", "p": ""}, {"id": "HI-021", "s": "한국사", "t": "수능", "g": 3, "d": "상", "q": "다음 헌법이 시행되던 시기의 사실로 옳은 것은?\n<div class='box'>제39조 ① 대통령은 통일 주체 국민 회의에서 토론 없이 무기명 투표로 선거한다.<br>제47조 대통령의 임기는 6년으로 한다.<br>제53조 ① 대통령은 … 필요한 긴급 조치를 할 수 있다.</div>", "c": ["부·마 민주 항쟁이 일어났다.", "4·19 혁명이 일어났다.", "6·15 남북 공동 선언이 발표되었다.", "6월 민주 항쟁으로 직선제 개헌이 이루어졌다.", "금융 실명제가 실시되었다."], "a": 1, "e": "자료는 1972년 제정된 유신 헌법이다. 유신 체제 말기인 1979년 부산과 마산에서 부·마 민주 항쟁이 일어났다. 4·19 혁명은 1960년, 6월 민주 항쟁은 1987년, 금융 실명제는 1993년, 6·15 선언은 2000년이다.", "p": ""}, {"id": "HI-022", "s": "한국사", "t": "수능", "g": 2, "d": "중", "q": "다음 자료와 관련된 민주화 운동은?\n<div class='box'>1980년 5월, 비상계엄 확대와 신군부의 집권에 반대하는 시민과 학생들의 시위가 일어났다. 계엄군의 무력 진압에 맞서 시민들은 시민군을 조직하여 저항하였다. 이 운동의 기록물은 2011년 유네스코 세계 기록 유산으로 등재되었다.</div>", "c": ["4·19 혁명", "5·18 민주화 운동", "부·마 민주 항쟁", "6월 민주 항쟁", "3·1 민주 구국 선언"], "a": 2, "e": "1980년 광주에서 일어난 5·18 민주화 운동에 대한 설명이다. 관련 기록물은 2011년 유네스코 세계 기록 유산에 등재되었다.", "p": ""}, {"id": "HI-023", "s": "한국사", "t": "수능", "g": 2, "d": "중", "q": "다음 자료의 운동에 대한 설명으로 옳은 것은?\n<div class='box'>지금 우리 정부가 일본에 진 빚이 1,300만 원이나 됩니다. 이는 우리나라의 존망이 걸린 일입니다. 2천만 민중이 3개월 동안 담배를 끊고 그 대금으로 한 사람당 20전씩 모으면 1,300만 원이 될 것입니다.</div>", "c": ["조선 총독부의 회사령 폐지를 이끌어 냈다.", "신간회가 중심이 되어 전개하였다.", "독립 협회가 주도하여 관민 공동회를 열었다.", "일제의 지원으로 빠르게 목표를 달성하였다.", "대구에서 시작되어 전국으로 확산되었다."], "a": 5, "e": "국채 보상 운동(1907)은 대구에서 서상돈 등의 제안으로 시작되어 대한매일신보 등 언론의 지원을 받아 전국으로 확산되었으나 통감부의 탄압으로 좌절되었다.", "p": ""}, {"id": "HI-024", "s": "한국사", "t": "수능", "g": 3, "d": "상", "q": "다음 남북 관계의 사실을 시기 순으로 바르게 나열한 것은?\n<div class='box'>(가) 남북 기본 합의서 채택<br>(나) 7·4 남북 공동 성명 발표<br>(다) 6·15 남북 공동 선언 발표</div>", "c": ["(가) - (나) - (다)", "(가) - (다) - (나)", "(나) - (가) - (다)", "(나) - (다) - (가)", "(다) - (나) - (가)"], "a": 3, "e": "7·4 남북 공동 성명(1972, 박정희 정부) → 남북 기본 합의서(1991, 노태우 정부) → 6·15 남북 공동 선언(2000, 김대중 정부) 순이다.", "p": ""}, {"id": "HI-025", "s": "한국사", "t": "단편", "g": 1, "d": "상", "q": "장문휴를 보내 당의 산둥 지방(등주)을 공격하게 한 발해의 왕은?", "c": ["고왕(대조영)", "문왕", "무왕", "선왕", "성왕"], "a": 3, "e": "무왕은 영토 확장에 힘쓰며 당과 대립하여 장문휴의 수군으로 당의 등주를 공격하였다. 문왕은 당과 친선 관계를 맺고 체제를 정비하였으며, 선왕 때 '해동성국'이라 불렸다.", "p": ""}, {"id": "HI-026", "s": "한국사", "t": "단편", "g": 1, "d": "상", "q": "고려에서 관리에게 전지와 시지를 지급하는 전시과 제도를 처음 마련한 왕은?", "c": ["태조", "광종", "경종", "성종", "문종"], "a": 3, "e": "경종 때 처음으로 전시과(시정 전시과)가 마련되었다. 이후 목종 때 개정 전시과, 문종 때 경정 전시과로 정비되었다. 태조는 공신에게 역분전을 지급하였다.", "p": ""}, {"id": "HI-027", "s": "한국사", "t": "단편", "g": 1, "d": "상", "q": "조선 현종 때 효종과 효종비의 장례에서 자의 대비의 상복 입는 기간을 두고 예송을 벌인 두 붕당은?", "c": ["서인과 남인", "동인과 서인", "남인과 북인", "노론과 소론", "대북과 소북"], "a": 1, "e": "예송은 서인과 남인 사이에 벌어진 논쟁이다. 1차 기해예송에서는 서인의 주장이, 2차 갑인예송에서는 남인의 주장이 받아들여졌다.", "p": ""}, {"id": "HI-028", "s": "한국사", "t": "단편", "g": 2, "d": "하", "q": "1905년 을사늑약의 결과로 옳은 것은?", "c": ["대한 제국의 군대가 해산되었다.", "대한 제국의 외교권이 박탈되었다.", "조선 총독부가 설치되었다.", "부산, 원산, 인천이 개항되었다.", "고종이 러시아 공사관으로 거처를 옮겼다."], "a": 2, "e": "을사늑약으로 대한 제국은 외교권을 빼앗기고 통감부가 설치되었다. 군대 해산은 1907년 한·일 신협약 때, 조선 총독부 설치는 1910년 국권 피탈 이후의 일이다.", "p": ""}, {"id": "HI-029", "s": "한국사", "t": "단편", "g": 2, "d": "하", "q": "1909년 만주 하얼빈에서 이토 히로부미를 처단한 인물은?", "c": ["윤봉길", "이봉창", "안중근", "김구", "안창호"], "a": 3, "e": "안중근은 1909년 하얼빈역에서 초대 통감 이토 히로부미를 처단하였다. 윤봉길(훙커우 공원 의거)과 이봉창(일왕 폭살 시도)은 한인 애국단 소속으로 1932년에 의거를 일으켰다.", "p": ""}, {"id": "HI-030", "s": "한국사", "t": "단편", "g": 2, "d": "하", "q": "1920년 북로 군정서군 등을 이끌고 청산리 대첩을 승리로 이끈 인물은?", "c": ["지청천", "양세봉", "김원봉", "김좌진", "신채호"], "a": 4, "e": "김좌진의 북로 군정서군과 홍범도의 대한 독립군 등 독립군 연합 부대는 1920년 10월 청산리 일대에서 일본군을 크게 물리쳤다.", "p": ""}, {"id": "HI-031", "s": "한국사", "t": "단편", "g": 2, "d": "중", "q": "1926년 6·10 만세 운동이 일어난 직접적인 계기는?", "c": ["고종의 인산일", "순종의 인산일", "한·일 학생 간의 충돌", "토지 조사 사업의 실시", "치안 유지법의 제정"], "a": 2, "e": "6·10 만세 운동은 순종의 인산일(장례일)을 계기로 학생과 사회주의 세력 등이 준비한 만세 시위이다. 고종의 인산일은 3·1 운동(1919), 한·일 학생 간의 충돌은 광주 학생 항일 운동(1929)의 계기이다.", "p": ""}, {"id": "HI-032", "s": "한국사", "t": "단편", "g": 2, "d": "상", "q": "1927년에 창립된 신간회에 대한 설명으로 옳은 것은?", "c": ["105인 사건으로 해체되었다.", "고종의 강제 퇴위 반대 운동을 전개하였다.", "헌의 6조를 결의하였다.", "대성 학교와 오산 학교를 설립하였다.", "비타협적 민족주의 세력과 사회주의 세력이 연합하여 조직하였다."], "a": 5, "e": "신간회는 민족 유일당 운동의 결과로 비타협적 민족주의 세력과 사회주의 세력이 연합한 단체이며, 광주 학생 항일 운동 때 진상 조사단을 파견하였다. 105인 사건과 학교 설립은 신민회, 헌의 6조는 독립 협회와 관련된다.", "p": ""}, {"id": "HI-033", "s": "한국사", "t": "단편", "g": 2, "d": "상", "q": "한국 광복군에 대한 설명으로 옳은 것은?", "c": ["봉오동 전투에서 일본군을 격파하였다.", "자유시 참변으로 큰 피해를 입었다.", "쌍성보 전투에서 한·중 연합 작전을 펼쳤다.", "간도 참변 이후 밀산에서 조직되었다.", "미국 전략 정보국(OSS)과 협력하여 국내 진공 작전을 준비하였다."], "a": 5, "e": "한국 광복군은 1940년 충칭에서 대한민국 임시 정부의 정규군으로 창설되었으며(총사령 지청천), 미국 OSS와 협력해 국내 진공 작전을 준비했으나 일제의 항복으로 실행하지 못했다.", "p": ""}, {"id": "HI-034", "s": "한국사", "t": "단편", "g": 2, "d": "상", "q": "일제가 1910년대에 실시한 토지 조사 사업에 대한 설명으로 옳은 것은?", "c": ["쌀 생산량을 늘려 일본으로 가져가는 것이 목적이었다.", "회사를 세울 때 총독의 허가를 받게 하였다.", "정해진 기간 안에 토지 소유자가 직접 신고하게 하였다.", "소작농의 경작권을 법으로 보장하였다.", "지계를 발급하여 근대적 토지 소유권을 인정하였다."], "a": 3, "e": "토지 조사 사업(1910~1918)은 기한부 신고제로 진행되었고, 그 결과 총독부의 지세 수입이 늘고 농민의 관습적 경작권은 인정되지 않았다. 쌀 증산은 산미 증식 계획, 회사 설립 허가는 회사령, 지계 발급은 대한 제국의 광무개혁이다.", "p": ""}, {"id": "HI-035", "s": "한국사", "t": "단편", "g": 3, "d": "하", "q": "나·당 전쟁에서 승리하여 삼국 통일을 완성한 신라의 왕은?", "c": ["법흥왕", "진흥왕", "무열왕", "신문왕", "문무왕"], "a": 5, "e": "문무왕은 고구려를 멸망시키고(668), 매소성·기벌포 전투에서 당군을 물리쳐 삼국 통일을 완성하였다(676).", "p": ""}, {"id": "HI-036", "s": "한국사", "t": "단편", "g": 3, "d": "하", "q": "후삼국을 통일하고 고려를 세운 인물은?", "c": ["궁예", "견훤", "최승로", "강감찬", "왕건"], "a": 5, "e": "왕건은 918년 고려를 건국하고, 신라의 항복(935)을 받은 뒤 후백제를 멸망시켜(936) 후삼국을 통일하였다.", "p": ""}, {"id": "HI-037", "s": "한국사", "t": "단편", "g": 3, "d": "하", "q": "1392년 조선을 건국한 인물은?", "c": ["정몽주", "이성계", "최영", "이방원", "정도전"], "a": 2, "e": "이성계는 위화도 회군(1388)으로 권력을 잡은 뒤 1392년 조선을 건국하였다. 정도전은 건국을 도와 통치 체제의 기틀을 마련한 인물이다.", "p": ""}, {"id": "HI-038", "s": "한국사", "t": "단편", "g": 3, "d": "하", "q": "대한민국 정부가 수립된 해는?", "c": ["1945년", "1946년", "1948년", "1950년", "1953년"], "a": 3, "e": "1948년 5·10 총선거로 제헌 국회가 구성되어 헌법을 제정하고, 같은 해 8월 15일 대한민국 정부 수립을 선포하였다.", "p": ""}, {"id": "HI-039", "s": "한국사", "t": "단편", "g": 3, "d": "중", "q": "고려가 몽골의 침입을 부처의 힘으로 물리치고자 강화도에서 만들기 시작한 문화유산은?", "c": ["초조대장경", "직지심체요절", "상정고금예문", "속장경", "팔만대장경"], "a": 5, "e": "팔만대장경(재조대장경)은 몽골 침입기에 제작되어 현재 합천 해인사에 보관되어 있다. 초조대장경은 거란의 침입 때 만들어졌다가 몽골 침입으로 불탔다.", "p": ""}, {"id": "HI-040", "s": "한국사", "t": "단편", "g": 3, "d": "중", "q": "군포 부담을 1년에 2필에서 1필로 줄인 균역법을 시행한 조선의 왕은?", "c": ["숙종", "정조", "순조", "영조", "효종"], "a": 4, "e": "영조는 탕평책을 실시하고, 균역법(1750)을 시행하여 농민의 군포 부담을 줄였다.", "p": ""}, {"id": "HI-041", "s": "한국사", "t": "단편", "g": 3, "d": "중", "q": "독립 협회의 활동으로 옳은 것은?", "c": ["국채 보상 운동을 주도하였다.", "만민 공동회를 개최하였다.", "신흥 강습소를 설립하였다.", "물산 장려 운동을 전개하였다.", "조선어 큰사전 편찬을 시도하였다."], "a": 2, "e": "독립 협회(1896)는 독립문을 세우고 만민 공동회와 관민 공동회를 열어 헌의 6조를 결의하였다. 신흥 강습소는 신민회, 사전 편찬은 조선어 학회와 관련된다.", "p": ""}, {"id": "HI-042", "s": "한국사", "t": "단편", "g": 3, "d": "상", "q": "조선 정조 대의 사실로 <u>옳지 않은</u> 것은?", "c": ["규장각을 설치하였다.", "장용영을 설치하였다.", "속대전을 편찬하였다.", "수원 화성을 건설하였다.", "육의전을 제외한 시전 상인의 금난전권을 폐지하였다."], "a": 3, "e": "속대전은 영조 때 편찬되었다. 정조는 규장각·장용영 설치, 초계문신제 실시, 화성 건설, 신해통공(금난전권 폐지), 대전통편 편찬 등을 추진하였다.", "p": ""}, {"id": "HI-043", "s": "한국사", "t": "단편", "g": 3, "d": "상", "q": "1930년대 후반 이후 일제의 민족 말살 통치 시기에 실시된 정책이 <u>아닌</u> 것은?", "c": ["황국 신민 서사 암송 강요", "일본식 성명 강요(창씨개명)", "국가 총동원법 적용", "신사 참배 강요", "회사령 제정"], "a": 5, "e": "회사령은 1910년 무단 통치 시기에 제정되어 회사 설립 시 총독의 허가를 받게 한 법령이다(1920년 폐지). 나머지는 중·일 전쟁(1937) 이후 민족 말살 통치와 전시 동원 정책이다.", "p": ""}, {"id": "HI-044", "s": "한국사", "t": "단편", "g": 3, "d": "상", "q": "대한 제국 시기의 사실로 옳은 것은?", "c": ["군국기무처를 설치하였다.", "통리기무아문을 설치하였다.", "대한국 국제를 반포하였다.", "홍범 14조를 반포하였다.", "별기군을 창설하였다."], "a": 3, "e": "대한 제국은 1899년 대한국 국제를 반포하여 황제권이 무한함을 밝혔고, '구본신참'의 원칙에 따라 광무개혁을 추진하였다. 군국기무처와 홍범 14조는 갑오개혁, 통리기무아문과 별기군은 1880년대 초 개화 정책이다.", "p": ""}, {"id": "HI-045", "s": "한국사", "t": "수능", "g": 1, "d": "하", "q": "다음 자료에 해당하는 나라는?\n<div class='box'>• 12월에 영고라는 제천 행사를 열었다.<br>• 왕 아래에 마가, 우가, 저가, 구가가 있어 각자 사출도를 다스렸다.<br>• 왕이 죽으면 많은 사람을 함께 묻는 순장의 풍습이 있었다.</div>", "c": ["고구려", "옥저", "동예", "삼한", "부여"], "a": 5, "e": "영고, 사출도, 순장은 부여의 특징이다. 고구려는 동맹, 동예는 무천이라는 제천 행사를 열었고, 옥저에는 민며느리제가 있었다.", "p": ""}, {"id": "HI-046", "s": "한국사", "t": "수능", "g": 1, "d": "하", "q": "다음 자료와 관련된 시대의 생활 모습으로 옳은 것은?\n<div class='box'>이 시대 사람들은 주먹도끼, 찍개 같은 뗀석기를 사용하였고, 동굴이나 바위 그늘, 강가의 막집에서 살았다.</div>", "c": ["빗살무늬 토기에 음식을 저장하였다.", "벼농사를 지으며 고인돌을 만들었다.", "철제 농기구로 농사를 지었다.", "가락바퀴로 실을 뽑아 옷을 만들었다.", "사냥과 채집을 하며 이동 생활을 하였다."], "a": 5, "e": "뗀석기와 막집은 구석기 시대의 특징이다. 구석기 시대 사람들은 사냥과 채집을 하며 무리 지어 이동 생활을 하였다. 빗살무늬 토기와 가락바퀴는 신석기 시대, 고인돌은 청동기 시대의 유물·유적이다.", "p": ""}, {"id": "HI-047", "s": "한국사", "t": "수능", "g": 1, "d": "하", "q": "다음 글을 쓴 왕의 재위 시기에 있었던 사실로 옳은 것은?\n<div class='box'>우리나라 말이 중국과 달라 한자와는 서로 통하지 않는다. 그래서 어리석은 백성이 말하고자 하는 바가 있어도 끝내 제 뜻을 펴지 못하는 사람이 많다. 내가 이를 가엾게 여겨 새로 스물여덟 글자를 만드니…</div>", "c": ["4군 6진을 개척하였다.", "경국대전을 반포하였다.", "직전법을 실시하였다.", "집현전을 폐지하였다.", "한양으로 천도하였다."], "a": 1, "e": "훈민정음 서문으로, 글을 쓴 왕은 세종이다. 세종은 최윤덕과 김종서를 보내 4군 6진을 개척하였다. 경국대전 반포는 성종, 직전법 실시와 집현전 폐지는 세조, 한양 천도는 태조 때의 일이다.", "p": ""}, {"id": "HI-048", "s": "한국사", "t": "수능", "g": 1, "d": "중", "q": "다음 자료의 왕에 대한 설명으로 옳은 것은?\n<div class='box'>이 왕은 화랑도를 국가적인 조직으로 개편하고, 한강 유역을 차지하였다. 또한 새로 넓힌 영토를 직접 돌아보고 북한산, 창녕, 황초령, 마운령 등에 비석을 세웠다.</div>", "c": ["대가야를 정복하였다.", "율령을 반포하였다.", "불교를 공인하였다.", "우산국을 정복하였다.", "국학을 설립하였다."], "a": 1, "e": "자료의 왕은 신라 진흥왕이다. 진흥왕은 한강 유역을 차지하고 대가야를 정복(562)하였으며 순수비를 세웠다. 율령 반포와 불교 공인은 법흥왕, 우산국 정복은 지증왕, 국학 설립은 신문왕 때의 일이다.", "p": ""}, {"id": "HI-049", "s": "한국사", "t": "수능", "g": 1, "d": "상", "q": "다음 자료의 왕이 추진한 정책으로 옳은 것은?\n<div class='box'>왕이 기철 등 친원 세력을 제거하고, 정동행성 이문소를 폐지하였다. 또 군대를 보내 원이 차지하고 있던 쌍성총관부 지역을 되찾았다.</div>", "c": ["과거제를 처음 실시하였다.", "삼별초를 조직하였다.", "천리장성을 쌓았다.", "전민변정도감을 설치하여 권문세족이 빼앗은 토지와 노비를 조사하였다.", "만권당을 설치하였다."], "a": 4, "e": "자료의 왕은 공민왕이다. 공민왕은 반원 자주 정책과 함께 신돈을 등용하여 전민변정도감을 설치하고 권문세족을 견제하였다. 만권당은 충선왕이 원의 수도에 세운 것이다.", "p": ""}, {"id": "HI-050", "s": "한국사", "t": "수능", "g": 1, "d": "상", "q": "다음 자료의 왕이 재위하던 시기의 사실로 옳은 것은?\n<div class='box'>왕이 명의 요청으로 군대를 보내면서 도원수 강홍립에게 은밀히 일렀다. \"형세를 보아 향배를 정하라.\" 이 왕은 명과 후금 사이에서 실리를 추구하는 외교를 펼쳤으나, 훗날 서인이 주도한 반정으로 쫓겨났다.</div>", "c": ["동의보감이 간행되었다.", "훈련도감이 처음 설치되었다.", "삼전도에서 청에 항복하였다.", "나선 정벌에 조총 부대를 파견하였다.", "백두산정계비를 세웠다."], "a": 1, "e": "자료의 왕은 중립 외교를 펼친 광해군이다. 광해군 때 허준의 동의보감이 간행되고 경기도에 대동법이 처음 실시되었다. 훈련도감 설치는 선조, 삼전도의 굴욕은 인조, 나선 정벌은 효종, 백두산정계비는 숙종 때의 일이다.", "p": ""}, {"id": "HI-051", "s": "한국사", "t": "수능", "g": 1, "d": "상", "q": "다음 전투를 일어난 순서대로 바르게 나열한 것은?\n<div class='box'>(가) 안시성 싸움　(나) 살수 대첩　(다) 매소성 전투　(라) 황산벌 전투</div>", "c": ["(가) - (나) - (라) - (다)", "(나) - (가) - (라) - (다)", "(나) - (가) - (다) - (라)", "(나) - (라) - (가) - (다)", "(가) - (나) - (다) - (라)"], "a": 2, "e": "살수 대첩(612, 고구려-수) → 안시성 싸움(645, 고구려-당) → 황산벌 전투(660, 백제-신라) → 매소성 전투(675, 신라-당) 순이다.", "p": ""}, {"id": "HI-052", "s": "한국사", "t": "수능", "g": 2, "d": "하", "q": "다음 자료의 민족 운동이 끼친 영향으로 옳은 것은?\n<div class='box'>1919년 민족 대표 33인의 이름으로 독립 선언서가 발표되었고, 탑골 공원에서 시작된 만세 시위는 전국의 도시와 농촌, 국외로까지 퍼져 나갔다.</div>", "c": ["대한 제국 수립의 계기가 되었다.", "을사늑약 체결의 원인이 되었다.", "갑오개혁 추진의 배경이 되었다.", "일제가 헌병 경찰 제도를 처음 도입하는 계기가 되었다.", "대한민국 임시 정부 수립의 계기가 되었다."], "a": 5, "e": "3·1 운동을 계기로 독립운동을 체계적으로 이끌 지도부의 필요성이 커져 1919년 상하이에 대한민국 임시 정부가 수립되었다. 또한 일제는 통치 방식을 이른바 '문화 통치'로 바꾸었다.", "p": ""}, {"id": "HI-053", "s": "한국사", "t": "수능", "g": 2, "d": "하", "q": "다음 조약에 대한 설명으로 옳은 것은?\n<div class='box'>제1관 조선국은 자주국이며 일본국과 평등한 권리를 가진다.<br>제4관 조선국은 부산 이외에 두 곳의 항구를 개항한다.<br>제7관 일본국 항해자가 조선 해안을 자유로이 측량하도록 허가한다.<br>제10관 일본국 인민이 조선국 개항장에서 죄를 지으면 일본국 관원이 심판한다.</div>", "c": ["운요호 사건을 계기로 체결되었다.", "임오군란의 결과로 체결되었다.", "최혜국 대우를 처음 규정하였다.", "거중 조정 조항이 포함되었다.", "청의 알선으로 체결되었다."], "a": 1, "e": "자료는 강화도 조약(1876)이다. 일본이 운요호 사건을 구실로 체결을 강요한 우리나라 최초의 근대적 조약이자, 해안 측량권과 영사 재판권(치외 법권)을 인정한 불평등 조약이다. 최혜국 대우와 거중 조정은 조·미 수호 통상 조약(1882)에 들어 있다.", "p": ""}, {"id": "HI-054", "s": "한국사", "t": "수능", "g": 2, "d": "하", "q": "다음 자료와 관련된 사건에 대한 설명으로 옳은 것은?\n<div class='box'>농민군은 전주성을 점령한 뒤 정부와 화약을 맺고, 전라도 각지에 집강소를 설치하여 개혁을 추진하였다. 이후 일본군이 경복궁을 점령하자 다시 봉기하였으나 우금치에서 패하였다.</div>", "c": ["구식 군인에 대한 차별 대우에 반발하여 일어났다.", "급진 개화파가 우정총국 개국 축하연에서 일으켰다.", "단발령에 반발하여 일어났다.", "탐관오리 처벌과 신분 차별 폐지 등을 요구하였다.", "서경 천도를 주장하며 일어났다."], "a": 4, "e": "동학 농민 운동(1894)이다. 농민군은 탐관오리 처벌, 신분 차별 폐지, 토지 균등 분배 등을 담은 폐정 개혁을 요구하였다. 구식 군인의 봉기는 임오군란, 우정총국 사건은 갑신정변, 단발령 반발은 을미의병이다.", "p": ""}, {"id": "HI-055", "s": "한국사", "t": "수능", "g": 2, "d": "중", "q": "다음 자료의 전투를 이끈 인물은?\n<div class='box'>1920년 6월, 대한 독립군을 비롯한 독립군 연합 부대가 두만강을 건너 추격해 온 일본군을 봉오동 골짜기로 유인하여 크게 무찔렀다.</div>", "c": ["김원봉", "이회영", "박은식", "여운형", "홍범도"], "a": 5, "e": "봉오동 전투는 홍범도가 이끄는 대한 독립군 등 독립군 연합 부대가 거둔 승리이다. 김원봉은 의열단과 조선 의용대를 조직한 인물이다.", "p": ""}, {"id": "HI-056", "s": "한국사", "t": "수능", "g": 2, "d": "상", "q": "다음 자료와 같은 통치 방침이 발표된 이후 1920년대에 있었던 사실로 옳은 것은?\n<div class='box'>• 총독은 문관도 임명될 수 있도록 한다.<br>• 헌병 경찰 제도를 보통 경찰 제도로 바꾼다.<br>• 한국인이 경영하는 한글 신문의 발행을 허가한다.</div>", "c": ["조선 태형령이 시행되었다.", "국가 총동원법이 적용되었다.", "치안 유지법이 제정되었다.", "일본식 성명 사용이 강요되었다.", "교사가 제복을 입고 칼을 차기 시작하였다."], "a": 3, "e": "3·1 운동 이후 일제가 내세운 이른바 '문화 통치'이다. 실제로는 경찰의 수가 늘었고 1925년 치안 유지법을 제정하여 독립운동을 탄압하였다. 조선 태형령과 교사의 제복·착검은 1910년대 무단 통치, 국가 총동원법과 창씨개명은 1930년대 후반 이후의 일이다.", "p": ""}, {"id": "HI-057", "s": "한국사", "t": "수능", "g": 2, "d": "상", "q": "다음 원칙을 발표한 단체의 활동을 주도한 인물을 옳게 짝지은 것은?\n<div class='box'>1. 모스크바 3국 외상 회의 결정에 따라 남북을 통한 좌우 합작으로 민주주의 임시 정부를 수립할 것<br>2. 미·소 공동 위원회의 속개를 요청하는 공동 성명을 발표할 것<br>3. 토지 개혁에 있어 몰수, 유조건 몰수, 체감 매상 등으로 토지를 농민에게 무상으로 나누어 줄 것</div>", "c": ["이승만, 김성수", "김구, 이시영", "여운형, 김규식", "박헌영, 허헌", "조만식, 송진우"], "a": 3, "e": "자료는 1946년 좌우 합작 위원회가 발표한 좌우 합작 7원칙이다. 제1차 미·소 공동 위원회가 결렬된 뒤 중도 좌파의 여운형과 중도 우파의 김규식이 주도하여 좌우 합작 운동을 전개하였다.", "p": ""}, {"id": "HI-058", "s": "한국사", "t": "수능", "g": 2, "d": "상", "q": "다음 사건을 일어난 순서대로 바르게 나열한 것은?\n<div class='box'>(가) 을사늑약 체결　(나) 한·일 신협약(정미 7조약) 체결　(다) 러·일 전쟁 발발　(라) 국권 피탈(한·일 병합 조약)</div>", "c": ["(가) - (다) - (나) - (라)", "(다) - (가) - (나) - (라)", "(다) - (나) - (가) - (라)", "(가) - (나) - (다) - (라)", "(나) - (다) - (가) - (라)"], "a": 2, "e": "러·일 전쟁 발발(1904) → 을사늑약(1905, 외교권 박탈) → 한·일 신협약(1907, 군대 해산) → 국권 피탈(1910) 순이다.", "p": ""}, {"id": "HI-059", "s": "한국사", "t": "수능", "g": 3, "d": "하", "q": "다음 자료의 민주화 운동의 결과로 옳은 것은?\n<div class='box'>1987년, 박종철 고문 치사 사건의 진상이 드러나고 정부가 4·13 호헌 조치를 발표하자, 시민들은 \"호헌 철폐, 독재 타도\"를 외치며 전국에서 시위를 벌였다.</div>", "c": ["5년 단임의 대통령 직선제 개헌이 이루어졌다.", "이승만 대통령이 물러났다.", "유신 헌법이 제정되었다.", "내각 책임제 정부가 수립되었다.", "통일 주체 국민 회의가 구성되었다."], "a": 1, "e": "6월 민주 항쟁(1987)의 결과 6·29 민주화 선언이 발표되고, 5년 단임의 대통령 직선제를 핵심으로 하는 개헌이 이루어졌다. 이승만의 하야와 내각 책임제는 4·19 혁명(1960)의 결과이다.", "p": ""}, {"id": "HI-060", "s": "한국사", "t": "수능", "g": 3, "d": "하", "q": "다음 자료의 상황에서 국민들이 위기 극복을 위해 벌인 운동은?\n<div class='box'>1997년 말 외환 보유액이 바닥나 국가 부도 위기에 놓이자, 정부는 국제 통화 기금(IMF)에 긴급 구제 금융을 요청하였다. 이후 많은 기업이 문을 닫고 실업자가 크게 늘었다.</div>", "c": ["국채 보상 운동", "물산 장려 운동", "새마을 운동", "브나로드 운동", "금 모으기 운동"], "a": 5, "e": "1997년 외환 위기 당시 국민들은 집에 있던 금을 내놓는 금 모으기 운동에 참여하였다. 국채 보상 운동(1907)은 일본에 진 나랏빚을 갚자는 운동으로 시기가 다르다.", "p": ""}, {"id": "HI-061", "s": "한국사", "t": "수능", "g": 3, "d": "하", "q": "다음은 6·25 전쟁의 전개 과정이다. (가)에 들어갈 사건으로 옳은 것은?\n<div class='box'>북한군의 남침 → 낙동강 방어선 구축 → ( 가 ) → 서울 수복과 압록강 진격 → 중국군의 개입 → 정전 협정 체결</div>", "c": ["1·4 후퇴", "반공 포로 석방", "애치슨 선언 발표", "인천 상륙 작전", "흥남 철수"], "a": 4, "e": "낙동강까지 밀렸던 국군과 유엔군은 인천 상륙 작전(1950. 9.)으로 전세를 뒤집어 서울을 되찾고 압록강 부근까지 진격하였다. 1·4 후퇴와 흥남 철수는 중국군 개입 이후의 일이다.", "p": ""}, {"id": "HI-062", "s": "한국사", "t": "수능", "g": 3, "d": "중", "q": "다음 법률을 제정한 국회의 활동으로 옳은 것은?\n<div class='box'>제1조 본법은 헌법에 의거하여 농지를 농민에게 적절히 분배함으로써 농가 경제의 자립과 농업 생산력의 증진으로 인한 농민 생활의 향상 내지 국민 경제의 균형과 발전을 기함을 목적으로 한다.</div>", "c": ["유신 헌법을 의결하였다.", "한·일 기본 조약을 비준하였다.", "사사오입 개헌안을 통과시켰다.", "반민족 행위 처벌법을 제정하였다.", "국가 보위 비상 대책 위원회를 설치하였다."], "a": 4, "e": "자료는 농지 개혁법(1949)으로 제헌 국회에서 제정되었다. 제헌 국회는 헌법을 제정하고, 반민족 행위 처벌법을 만들어 반민 특위를 구성하였다. 사사오입 개헌(1954)은 제3대 국회 때의 일이다.", "p": ""}, {"id": "HI-063", "s": "한국사", "t": "수능", "g": 3, "d": "중", "q": "다음 자료의 인물로 옳은 것은?\n<div class='box'>이 인물은 마을 단위로 토지를 공동 소유·공동 경작하고 노동량에 따라 수확물을 나누자는 여전론을 주장하였다. 수원 화성을 쌓을 때 거중기를 만들었으며, 유배 생활 중에 지방관이 지켜야 할 도리를 담은 『목민심서』를 썼다.</div>", "c": ["박지원", "유형원", "정약용", "이익", "박제가"], "a": 3, "e": "정약용에 대한 설명이다. 유형원은 균전론, 이익은 한전론을 주장한 중농학파이며, 박지원과 박제가는 상공업 진흥을 주장한 중상학파(북학파)이다.", "p": ""}, {"id": "HI-064", "s": "한국사", "t": "수능", "g": 3, "d": "중", "q": "다음 자료의 단체로 옳은 것은?\n<div class='box'>1919년 만주에서 김원봉 등이 조직하였다. 신채호가 작성한 「조선 혁명 선언」을 활동 지침으로 삼았으며, 단원 김익상은 조선 총독부에, 나석주는 동양 척식 주식회사에 폭탄을 던졌다.</div>", "c": ["의열단", "한인 애국단", "신민회", "대한 광복회", "근우회"], "a": 1, "e": "의열단에 대한 설명이다. 한인 애국단은 1931년 김구가 조직한 단체로 이봉창, 윤봉길이 소속되어 있었다.", "p": ""}, {"id": "HI-065", "s": "한국사", "t": "수능", "g": 3, "d": "상", "q": "다음 강령이 발표된 이후의 사실로 옳은 것은?\n<div class='box'>1941년 대한민국 임시 정부는 조소앙의 삼균주의를 바탕으로, 정치·경제·교육의 균등을 통해 민주 공화국을 건설한다는 내용의 건국 강령을 발표하였다.</div>", "c": ["한인 애국단이 조직되었다.", "국민 대표 회의가 개최되었다.", "한국 광복군이 창설되었다.", "한국 광복군이 인도·미얀마 전선에 파견되었다.", "임시 정부가 상하이를 떠났다."], "a": 4, "e": "건국 강령은 1941년 11월에 발표되었다. 이후 한국 광복군은 영국군의 요청으로 인도·미얀마 전선에 파견되었다(1943). 국민 대표 회의(1923), 한인 애국단 조직(1931), 임시 정부의 상하이 이탈(1932), 한국 광복군 창설(1940)은 모두 그 이전의 일이다.", "p": ""}, {"id": "HI-066", "s": "한국사", "t": "단편", "g": 1, "d": "하", "q": "구석기 시대를 대표하는 뗀석기로, 경기도 연천 전곡리에서 출토된 도구는?", "c": ["가락바퀴", "비파형 동검", "주먹도끼", "반달 돌칼", "세형 동검"], "a": 3, "e": "구석기 시대에는 돌을 깨뜨려 만든 뗀석기를 사용하였으며, 주먹도끼가 대표적이다. 가락바퀴는 신석기, 비파형 동검과 반달 돌칼은 청동기 시대의 유물이다.", "p": ""}, {"id": "HI-067", "s": "한국사", "t": "단편", "g": 1, "d": "하", "q": "청동기 시대 지배층의 무덤으로, 당시 계급이 발생하였음을 보여 주는 유적은?", "c": ["움집", "고인돌", "조개더미", "돌무지덧널무덤", "벽돌무덤"], "a": 2, "e": "고인돌은 많은 사람을 동원해야 만들 수 있는 거대한 무덤으로, 청동기 시대에 권력을 가진 지배층이 등장하였음을 보여 준다.", "p": ""}, {"id": "HI-068", "s": "한국사", "t": "단편", "g": 1, "d": "하", "q": "졸본 지역에서 고구려를 건국한 인물은?", "c": ["온조", "주몽", "박혁거세", "김수로", "대조영"], "a": 2, "e": "부여에서 내려온 주몽이 졸본 지역에서 고구려를 세웠다. 온조는 백제, 박혁거세는 신라, 김수로는 금관가야, 대조영은 발해를 세웠다.", "p": ""}, {"id": "HI
