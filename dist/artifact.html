'라고 말했다. 수술을 받겠다는 사람은 A 집단에서 훨씬 많았다.</div>", "c": ["같은 정보라도 어떻게 표현하느냐에 따라 사람들의 판단이 달라졌다.", "B 집단은 A 집단보다 더 정확한 정보를 받았다.", "A 집단과 B 집단이 받은 정보의 내용이 서로 달랐다.", "사람들은 숫자의 크기만 보고 합리적으로 판단하였다.", "손실을 강조하면 사람들은 위험을 더 쉽게 받아들인다."], "a": 1, "e": "생존율 90%와 사망률 10%는 같은 정보지만 '이익(생존)'으로 표현했을 때 더 많은 사람이 수술을 택했다. 이것이 틀 효과이다.", "p": "사람들은 정보의 내용이 같아도 그것이 어떤 틀로 제시되느냐에 따라 다르게 판단한다. 이를 '틀 효과(framing effect)'라고 한다. 특히 같은 결과를 이익의 측면에서 제시하면 사람들은 확실한 선택을 선호하고, 손실의 측면에서 제시하면 위험을 무릅쓰는 선택을 하는 경향이 있다. 이는 사람이 늘 합리적으로 계산하여 판단한다는 전통 경제학의 가정과 어긋난다."}, {"id": "KO-174", "s": "국어", "t": "수능", "g": 3, "d": "상", "q": "&lt;보기&gt;는 중세 국어 자료와 현대어 풀이이다. 이를 통해 알 수 있는 중세 국어의 특징으로 적절하지 <u>않은</u> 것은?<div class='box'>&lt;보기&gt;<br>[중세 국어] 불휘 기픈 남ᄀᆞᆫ ᄇᆞᄅᆞ매 아니 뮐ᄊᆡ<br>[현대어] 뿌리 깊은 나무는 바람에 흔들리지 않으므로</div>", "c": ["'ᄇᆞᄅᆞ매'에서 오늘날 쓰지 않는 'ㆍ(아래아)'가 쓰였다.", "'ᄇᆞᄅᆞ매'는 '바람+애'를 소리 나는 대로 이어 적었다.", "'아니 뮐ᄊᆡ'에서 부정 부사 '아니'가 쓰였다.", "'남ᄀᆞᆫ'은 '나무'가 조사와 결합할 때 형태가 바뀐 모습이다.", "현대 국어와 달리 주격 조사 '가'가 쓰였다."], "a": 5, "e": "중세 국어에는 주격 조사 '가'가 없었다. <보기>에서도 '가'는 쓰이지 않았다. 나머지는 중세 국어의 특징(아래아, 이어 적기, '나무'의 특수한 곡용 형태 '낡')을 바르게 설명하였다.", "p": ""}, {"id": "KO-175", "s": "국어", "t": "수능", "g": 3, "d": "상", "q": "윗글에 대한 감상으로 가장 적절한 것은?", "c": ["임과의 재회를 확신하며 기뻐한다.", "자연을 객관적으로 묘사하는 데 그친다.", "이별의 원인을 임에게 돌리며 원망한다.", "역설적 표현을 통해 이별의 슬픔을 견디려는 의지를 드러낸다.", "경쾌한 리듬으로 축제의 분위기를 드러낸다."], "a": 4, "e": "'보내 드리오리다', '죽어도 아니 눈물 흘리오리다'는 슬픔을 억누르는 반어적·역설적 표현으로, 이별의 슬픔을 견디려는 의지를 드러낸다.", "p": "나 보기가 역겨워\n가실 때에는\n말없이 고이 보내 드리오리다.\n\n영변에 약산\n진달래꽃\n아름 따다 가실 길에 뿌리오리다.\n\n가시는 걸음걸음\n놓인 그 꽃을\n사뿐히 즈려밟고 가시옵소서.\n\n나 보기가 역겨워\n가실 때에는\n죽어도 아니 눈물 흘리오리다.\n<span class='src'>- 김소월, '진달래꽃'</span>"}, {"id": "KO-176", "s": "국어", "t": "수능", "g": 3, "d": "상", "q": "윗글의 내용을 바탕으로 &lt;보기&gt;를 이해한 것으로 가장 적절한 것은?<div class='box'>&lt;보기&gt;<br>어느 마을에서 우물 하나를 고쳐 쓰는 일을 두고, '모두가 조금씩 돈을 내면 모두가 이익'인 상황이 생겼다. 그런데 각자는 '나만 돈을 안 내면 더 이익'이라고 생각하여 아무도 돈을 내지 않았고, 우물은 끝내 고쳐지지 않았다.</div>", "c": ["각자가 협력을 선택하여 모두가 최선의 결과를 얻었다.", "한 사람만 돈을 내면 우물은 반드시 고쳐진다.", "개인에게 합리적인 선택이 모두에게 나쁜 결과를 낳는 죄수의 딜레마 구조이다.", "마을 사람들은 서로를 완전히 믿었다.", "이 상황은 반복될수록 협력이 불가능해진다."], "a": 3, "e": "각자는 배신(돈을 내지 않음)이 유리하지만 모두가 배신하면 모두에게 나쁜 결과가 된다. 지문에 따르면 반복되면 오히려 협력이 생겨날 수 있다.", "p": "두 용의자가 따로 조사를 받는다. 둘 다 침묵하면 가벼운 벌을, 둘 다 자백하면 무거운 벌을 받는다. 한 사람만 자백하면 그 사람은 풀려나고 침묵한 사람은 가장 무거운 벌을 받는다. 각자에게는 상대가 어떤 선택을 하든 자백하는 편이 유리하므로, 결국 둘 다 자백하여 둘 다 침묵했을 때보다 나쁜 결과를 얻는다. 이를 '죄수의 딜레마'라고 한다. 그러나 같은 상황이 여러 번 되풀이되면 사람들은 상대의 반응을 고려하게 되어, 협력이 생겨나기도 한다."}, {"id": "KO-177", "s": "국어", "t": "수능", "g": 3, "d": "상", "q": "윗글의 '우리'에 대한 설명으로 가장 적절한 것은?", "c": ["자연과 단절된 채 홀로 살아가는 존재이다.", "서로 경쟁하며 상대를 밀어내는 관계이다.", "두레박의 이미지를 통해 서로 기대어 살아가는 공동체의 모습을 드러낸다.", "물질적 풍요만을 추구하는 존재이다.", "도시를 떠나 고향으로 돌아가고자 한다."], "a": 3, "e": "두레박이 '내려가고 올라오며' 물을 길어 서로의 '목을 축여 주는' 모습은 서로 기대어 사는 공동체를 상징한다.", "p": "한 사람이 줄을 풀면\n한 사람이 물을 긷고\n두레박은 내려가고 또 올라오며\n우리는 서로의 목을 축여 주었다\n누구의 우물인지 묻지 않았다\n목마른 이가 먼저 마셨다\n<span class='src'>(창작 시)</span>"}, {"id": "KO-178", "s": "국어", "t": "수능", "g": 3, "d": "상", "q": "윗글을 읽고 추론한 내용으로 적절하지 <u>않은</u> 것은?", "c": ["숙주가 될 수 있는 동물의 종류가 다양하면 병원체가 분산된다.", "숲이 파괴되면 병원체를 옮기기 쉬운 종이 늘어날 수 있다.", "생물 다양성 보전은 사람의 건강과도 관련이 있다.", "생물 다양성이 높을수록 특정 질병이 사람에게 전파될 위험은 커진다.", "희석 효과는 생태계의 구성에 따라 달라진다."], "a": 4, "e": "지문에 따르면 생물 다양성이 높으면 병원체가 잘 옮기지 못하는 숙주에 분산되어 사람에게 옮을 위험이 줄어드는 '희석 효과'가 나타난다.", "p": "진드기가 옮기는 어떤 질병은 주로 흰발생쥐에게서 사람에게 전파된다. 숲에 여러 종류의 동물이 고루 살면 진드기는 병원체를 잘 옮기지 못하는 다른 동물에게도 피를 빨게 되어, 병원체가 여기저기 흩어진다. 그 결과 사람에게 병이 옮을 위험이 줄어드는데, 이를 '희석 효과'라 한다. 반대로 숲이 파괴되어 생물 다양성이 낮아지면, 환경에 잘 적응하는 흰발생쥐의 비율이 오히려 높아져 위험이 커질 수 있다."}, {"id": "KO-179", "s": "국어", "t": "수능", "g": 3, "d": "상", "q": "&lt;보기&gt;의 ㉠~㉤에 대한 설명으로 옳은 것만을 고른 것은?<div class='box'>&lt;보기&gt;<br>㉠ 동생이 언니에게 안겼다.<br>㉡ 형이 동생을 웃겼다.<br>㉢ 문이 저절로 열렸다.<br>㉣ 할머니께서 아이에게 옷을 입히셨다.<br>㉤ 쥐가 고양이에게 쫓겼다.<br><br>(가) ㉠, ㉢, ㉤은 피동문이다.<br>(나) ㉡, ㉣은 사동문이다.<br>(다) ㉣은 주어가 직접 행동한 것으로만 해석된다.</div>", "c": ["(가)", "(나)", "(가), (나)", "(나), (다)", "(가), (나), (다)"], "a": 3, "e": "㉠ 안기다, ㉢ 열리다, ㉤ 쫓기다는 피동사, ㉡ 웃기다, ㉣ 입히다는 사동사이다. '입히셨다'는 할머니가 직접 입혀 준 것으로도, 아이가 입도록 시킨 것으로도 해석될 수 있으므로 (다)는 틀리다.", "p": ""}, {"id": "KO-180", "s": "국어", "t": "수능", "g": 3, "d": "상", "q": "윗글의 글쓴이의 관점에서 &lt;보기&gt;를 평가한 내용으로 가장 적절한 것은?<div class='box'>&lt;보기&gt;<br>어느 기업이 '인공 지능이 채용 면접을 보면 사람의 편견이 없으므로 가장 공정하다'며 지원자 평가를 인공 지능에 전적으로 맡겼다.</div>", "c": ["인공 지능은 감정이 없으므로 항상 공정하다.", "사람의 판단보다 인공 지능의 판단이 언제나 정확하다.", "과거 자료가 많을수록 편향은 반드시 사라진다.", "인공 지능의 판단 근거는 누구나 쉽게 알 수 있다.", "인공 지능도 과거 자료의 편향을 학습할 수 있으므로 무조건 공정하다고 볼 수 없다."], "a": 5, "e": "글쓴이는 인공 지능이 과거 자료 속 편향을 그대로 배울 수 있고 판단 근거가 불투명하므로, 사람의 점검이 필요하다고 본다.", "p": "인공 지능은 감정이 없으니 사람보다 공정할 것이라고 믿는 사람이 많다. 그러나 인공 지능은 과거의 자료를 학습하여 판단하므로, 그 자료에 담긴 사회의 편향까지 그대로 배울 수 있다. 예컨대 과거에 특정 성별을 주로 뽑았던 회사의 자료로 학습하면, 인공 지능도 그 성별을 더 높게 평가하게 된다. 게다가 인공 지능이 왜 그런 판단을 내렸는지 사람이 알기 어려운 경우도 많다. 따라서 인공 지능의 판단을 그대로 받아들이기보다 사람이 그 과정과 결과를 끊임없이 점검해야 한다."}, {"id": "EN-001", "s": "영어", "t": "단편", "g": 1, "d": "하", "q": "다음 단어의 뜻으로 알맞은 것은?\n<b>abundant</b>", "c": ["부족한", "정확한", "일시적인", "위험한", "풍부한"], "a": 5, "e": "abundant는 '풍부한, 많은'이라는 뜻이다. 반의어는 scarce(부족한)이다.", "p": ""}, {"id": "EN-002", "s": "영어", "t": "단편", "g": 1, "d": "하", "q": "다음 단어와 의미가 가장 가까운 것은?\n<b>reluctant</b>", "c": ["eager", "unwilling", "careful", "generous", "honest"], "a": 2, "e": "reluctant는 '꺼리는, 마지못한'이라는 뜻으로 unwilling과 의미가 가깝다. eager(열망하는)는 반대 의미이다.", "p": ""}, {"id": "EN-003", "s": "영어", "t": "단편", "g": 1, "d": "하", "q": "다음 단어의 반의어로 알맞은 것은?\n<b>ancient</b>", "c": ["old", "modern", "historic", "huge", "ruined"], "a": 2, "e": "ancient는 '고대의, 아주 오래된'이라는 뜻으로 반의어는 modern(현대의)이다.", "p": ""}, {"id": "EN-004", "s": "영어", "t": "단편", "g": 1, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?\nI'm looking forward to ______ you again.", "c": ["seeing", "see", "saw", "be seen", "have seen"], "a": 1, "e": "look forward to에서 to는 전치사이므로 뒤에 동명사(-ing)가 온다. 따라서 seeing이 알맞다.", "p": ""}, {"id": "EN-005", "s": "영어", "t": "단편", "g": 1, "d": "중", "q": "밑줄 친 부분과 의미가 가장 가까운 것은?\nThe meeting was <u>put off</u> until next week.", "c": ["postponed", "cancelled", "attended", "organized", "shortened"], "a": 1, "e": "put off는 '미루다, 연기하다'라는 뜻으로 postpone과 같은 의미이다.", "p": ""}, {"id": "EN-006", "s": "영어", "t": "단편", "g": 2, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?\nIf I ______ you, I would apologize to her right away.", "c": ["am", "be", "were", "was being", "had been"], "a": 3, "e": "현재 사실과 반대되는 가정을 나타내는 가정법 과거이므로 if절에 be동사는 주어와 관계없이 were를 쓴다(구어에서 was도 쓰이지만 문법상 were가 기본형).", "p": ""}, {"id": "EN-007", "s": "영어", "t": "단편", "g": 2, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?\nThis is the house ______ I was born.", "c": ["where", "which", "what", "who", "whose"], "a": 1, "e": "선행사 the house가 장소이고 뒤 문장(I was born)이 완전하므로 관계부사 where(= in which)가 알맞다. which를 쓰려면 in which가 되어야 한다.", "p": ""}, {"id": "EN-008", "s": "영어", "t": "단편", "g": 2, "d": "중", "q": "다음 중 어법상 <u>틀린</u> 문장은?", "c": ["The number of students are increasing.", "Each of the students has a laptop.", "A number of people were waiting outside.", "Neither my brother nor I am ready.", "Ten dollars is enough for lunch."], "a": 1, "e": "'the number of + 복수명사'는 '~의 수'라는 뜻으로 단수 취급하므로 is increasing이 되어야 한다. 'a number of'는 '많은'이라는 뜻으로 복수 취급한다.", "p": ""}, {"id": "EN-009", "s": "영어", "t": "단편", "g": 2, "d": "하", "q": "빈칸에 들어갈 말로 알맞은 것은?\n______ the heavy rain, the game continued.", "c": ["Although", "Because", "Unless", "Despite", "While"], "a": 4, "e": "빈칸 뒤에 명사구(the heavy rain)가 오므로 전치사 Despite가 알맞다. Although는 접속사로 뒤에 절이 와야 한다.", "p": ""}, {"id": "EN-010", "s": "영어", "t": "단편", "g": 2, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?\nHardly ______ I arrived at the station when the train left.", "c": ["did", "had", "have", "was", "do"], "a": 2, "e": "'Hardly + had + 주어 + p.p. ~ when ...'은 '~하자마자 …했다'는 구문으로, 부정어가 문장 앞에 나와 주어와 조동사가 도치된다.", "p": ""}, {"id": "EN-011", "s": "영어", "t": "단편", "g": 3, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?\n______ from the top of the hill, the town looks beautiful.", "c": ["Seeing", "To see", "Having seen", "Seen", "Being seeing"], "a": 4, "e": "주절의 주어 the town은 '보이는' 대상이므로 수동 의미의 과거분사로 시작하는 분사구문 Seen이 알맞다.", "p": ""}, {"id": "EN-012", "s": "영어", "t": "단편", "g": 3, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?\nIf she had taken the medicine last night, she ______ better now.", "c": ["feels", "would have felt", "had felt", "would feel", "will feel"], "a": 4, "e": "if절은 과거(last night) 사실의 반대, 주절은 현재(now) 사실의 반대를 나타내는 혼합 가정법이므로 '조동사 과거형 + 동사원형'인 would feel이 알맞다.", "p": ""}, {"id": "EN-013", "s": "영어", "t": "단편", "g": 3, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?\nThe doctor suggested that he ______ more vegetables.", "c": ["eats", "eat", "ate", "eating", "to eat"], "a": 2, "e": "제안·요구를 나타내는 동사(suggest, insist, demand 등) 뒤의 that절이 '~해야 한다'는 당위를 나타내면 (should) + 동사원형을 쓴다.", "p": ""}, {"id": "EN-014", "s": "영어", "t": "단편", "g": 3, "d": "중", "q": "다음 단어의 뜻으로 알맞은 것은?\n<b>concise</b>", "c": ["간결한", "모호한", "정중한", "복잡한", "지속적인"], "a": 1, "e": "concise는 '간결한, 간명한'이라는 뜻이다. 모호한은 vague, 복잡한은 complicated이다.", "p": ""}, {"id": "EN-015", "s": "영어", "t": "단편", "g": 1, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?\nIt is important ______ students to get enough sleep.", "c": ["of", "to", "with", "for", "by"], "a": 4, "e": "to부정사의 의미상 주어는 보통 'for + 목적격'으로 나타낸다. kind, nice처럼 사람의 성격을 나타내는 형용사일 때만 of를 쓴다.", "p": ""}, {"id": "EN-016", "s": "영어", "t": "수능", "g": 2, "d": "중", "q": "다음 글의 주제로 가장 적절한 것은?", "c": ["the role of sleep in making memories last", "the best time of day to take an exam", "why students feel stressed before tests", "how to stay awake while studying", "the dangers of studying in groups"], "a": 1, "e": "잠자는 동안 뇌가 낮에 얻은 정보를 재생·정리하여 기억을 오래 가게 한다는 내용이므로, '기억을 오래 남기는 데 있어 수면의 역할'이 주제이다.", "p": "Many students believe that staying up late to study is the best way to prepare for an exam. However, research on memory suggests otherwise. During sleep, the brain does not simply rest; it replays and organizes the information gathered during the day, strengthening the connections that make memories last. When sleep is cut short, this process is interrupted, and much of what was studied may be lost. In other words, a good night's sleep is not time taken away from learning but an essential part of it."}, {"id": "EN-017", "s": "영어", "t": "수능", "g": 3, "d": "상", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "c": ["unlimited resources", "complete freedom", "careful imitation", "public praise", "restrictions"], "a": 5, "e": "엄격한 운율 규칙이나 적은 예산 같은 제약이 오히려 독창적인 해결책을 찾게 만든다는 내용이다. 따라서 '제약(restrictions)'이 정신을 독창성으로 이끈다는 말이 알맞다.", "p": "We often assume that creativity flourishes when people are given complete freedom. Yet artists and engineers frequently report the opposite. A poet who must follow a strict rhyme scheme is forced to search for unusual words, and a designer with a tiny budget must find solutions that others would never consider. Without limits, the number of possible choices can be so large that people simply fall back on familiar ideas. In this sense, ________ can actually push the mind toward originality."}, {"id": "EN-018", "s": "영어", "t": "수능", "g": 1, "d": "하", "q": "다음 글의 요지로 가장 적절한 것은?", "c": ["실험은 실패하지 않도록 철저히 준비해야 한다.", "실패한 결과는 빨리 잊는 것이 정신 건강에 좋다.", "과학자는 실패를 다른 사람에게 숨기는 것이 낫다.", "학생들은 실험보다 이론 학습에 집중해야 한다.", "실패를 능력에 대한 평가가 아닌 배움의 자료로 활용해야 한다."], "a": 5, "e": "마지막 문장에서 실수를 능력에 대한 판단이 아니라 하나의 자료(data)로 다루면 더 빨리 배우고 덜 걱정하게 된다고 하였다.", "p": "When an experiment fails, many students feel embarrassed and want to forget about it as quickly as possible. But a failed result is still a result. It tells you which path does not lead to the answer, and that information narrows down where the answer might be. Scientists who make important discoveries are often those who carefully study their failures instead of hiding them. If you treat each mistake as a piece of data rather than a judgment of your ability, you will learn faster and worry less."}, {"id": "EN-019", "s": "영어", "t": "수능", "g": 3, "d": "상", "q": "다음 글의 밑줄 친 부분 중, 어법상 <u>틀린</u> 것은?", "c": ["①", "②", "③", "④", "⑤"], "a": 5, "e": "주어가 관계대명사 what이 이끄는 명사절(What makes this system remarkable)이므로 단수 취급하여 are가 아니라 is가 되어야 한다. ①은 a movement를 수식하는 과거분사, ②는 분사구문, ④는 Other bees를 수식하는 현재분사로 모두 옳다.", "p": "Honeybees communicate the location of food through a movement ①<u>known</u> as the waggle dance. A bee that has found flowers returns to the hive and moves in a figure-eight pattern, ②<u>shaking</u> its body during the straight part of the dance. The direction of this straight run shows the direction of the food ③<u>relative to</u> the sun, and its length indicates how far away the food is. Other bees ④<u>watching</u> the dance can then fly directly to the flowers. What makes this system remarkable ⑤<u>are</u> that it allows thousands of bees to share information without any spoken language."}, {"id": "EN-020", "s": "영어", "t": "수능", "g": 2, "d": "중", "q": "다음 글에서 전체 흐름과 관계 <u>없는</u> 문장은?", "c": ["①", "②", "③", "④", "⑤"], "a": 3, "e": "도시 텃밭의 장점(신선한 채소, 이웃 교류, 홍수 위험 감소)을 설명하는 글인데, ③은 최초의 고층 건물에 관한 내용으로 흐름과 무관하다.", "p": "Urban gardens are becoming popular in many cities around the world. ① They give residents a chance to grow fresh vegetables close to home, reducing the need to transport food over long distances. ② They also turn empty lots into green spaces where neighbors can meet and work together. ③ The first skyscrapers were built in the late nineteenth century as steel became cheaper. ④ In addition, plants in these gardens help absorb rainwater, lowering the risk of flooding during heavy storms. ⑤ For these reasons, many local governments now support community garden projects."}, {"id": "EN-021", "s": "영어", "t": "수능", "g": 3, "d": "상", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "c": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(C) - (A) - (B)", "(C) - (B) - (A)", "(B) - (C) - (A)"], "a": 5, "e": "주어진 선택 상황에 대해 대부분 지금의 50달러를 고른다는 (B)가 먼저 오고, 같은 선택을 미래로 옮긴 경우를 설명하는 (C)가 이어진다. 마지막으로 이런 경향을 '현재 편향'이라 정의하는 (A)가 온다.", "p": "<b>Imagine you are offered a choice: receive $50 today or $60 in a month.</b>\n(A) This tendency to prefer smaller, immediate rewards over larger, delayed ones is called present bias. It helps explain why people put off saving money or exercising.\n(B) Most people choose the $50 today, even though waiting a month would give them 20 percent more. However, when the same choice is moved into the future, their answer often changes.\n(C) Offered $50 in twelve months or $60 in thirteen months, many of the same people now prefer to wait for the larger amount. The one-month delay is identical, but it feels less painful when both rewards are far away."}, {"id": "EN-022", "s": "영어", "t": "수능", "g": 1, "d": "하", "q": "Greenfield Youth Science Camp에 관한 다음 안내문의 내용과 일치하는 것은?", "c": ["4일 동안 진행된다.", "참가비에 점심 식사가 포함되어 있다.", "고등학교 3학년도 참가할 수 있다.", "신청서는 캠프 당일 현장에서 작성한다.", "참가 인원에 제한이 없다."], "a": 2, "e": "Fee: $40 (lunch included)에서 참가비에 점심이 포함됨을 알 수 있다. 기간은 3일, 대상은 10~11학년(고1~2), 신청은 웹사이트에서 7월 10일까지, 인원은 30명으로 제한된다.", "p": "<b>Greenfield Youth Science Camp</b>\n• Dates: July 22–24 (3 days)\n• Who can join: High school students in grades 10–11\n• Fee: $40 (lunch included)\n• Activities: robot building, star watching at night, water quality testing in the river\n• How to apply: Fill out the form on our website by July 10.\n※ Participants must bring their own water bottle.\n※ Spaces are limited to 30 students."}, {"id": "EN-023", "s": "영어", "t": "수능", "g": 2, "d": "중", "q": "다음 글에 드러난 Mina의 심경 변화로 가장 적절한 것은?", "c": ["nervous → delighted", "bored → excited", "proud → ashamed", "calm → anxious", "hopeful → disappointed"], "a": 1, "e": "처음에는 바이올린을 꽉 쥐고 음을 잊을까 걱정하며 긴장했지만(nervous), 연주 후 기립 박수를 받고 환하게 웃으므로 기쁨(delighted)으로 바뀌었다.", "p": "Mina stood at the edge of the stage, holding her violin so tightly that her fingers ached. The hall was full, and she could hear people whispering. What if she forgot the notes? When her name was called, she walked to the center and began to play. After the first few bars, the music seemed to carry her. By the time the final note faded, the audience was on its feet, clapping loudly. Mina bowed, a wide smile spreading across her face."}, {"id": "EN-024", "s": "영어", "t": "수능", "g": 2, "d": "중", "q": "다음 글의 제목으로 가장 적절한 것은?", "c": ["Why Concrete Is Better Than Grass", "Trees: Natural Air Conditioners for Hot Cities", "The History of City Streets", "How Climate Change Began", "Water Vapor: A Hidden Danger"], "a": 2, "e": "나무가 햇빛을 막고 잎에서 수증기를 내보내 주변 공기를 식혀, 더워지는 도시의 주민을 보호하는 간단하고 저렴한 방법이라는 내용이다.", "p": "On a hot summer afternoon, a street lined with trees can be several degrees cooler than a nearby street without them. Trees block sunlight before it reaches the pavement, and they release water vapor through their leaves, which cools the surrounding air. As cities grow hotter because of climate change and the spread of concrete, planting trees has become one of the simplest and cheapest ways to protect residents from dangerous heat."}, {"id": "EN-025", "s": "영어", "t": "단편", "g": 1, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?\nNot only ______ the book, but he also wrote a review of it.", "c": ["he read", "he did read", "read he", "he reads", "did he read"], "a": 5, "e": "부정어구 Not only가 문장 앞에 오면 주어와 조동사가 도치되어 'Not only + 조동사 + 주어 + 동사원형' 어순이 된다.", "p": ""}, {"id": "EN-026", "s": "영어", "t": "단편", "g": 1, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?\nThe man ______ I thought was honest deceived me.", "c": ["whom", "whose", "which", "what", "who"], "a": 5, "e": "I thought는 삽입절이다. 빈칸은 was honest의 주어 역할을 하므로 주격 관계대명사 who가 알맞다. 삽입절 때문에 목적격 whom을 고르지 않도록 주의한다.", "p": ""}, {"id": "EN-027", "s": "영어", "t": "단편", "g": 1, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?\nIt was not until midnight ______ he came home.", "c": ["that", "when", "what", "which", "until"], "a": 1, "e": "'It was not until ~ that …'은 '~가 되어서야 비로소 …했다'는 뜻의 강조 구문으로 that을 쓴다.", "p": ""}, {"id": "EN-028", "s": "영어", "t": "단편", "g": 2, "d": "하", "q": "다음 단어와 의미가 가장 가까운 것은?\n<b>purchase</b>", "c": ["sell", "borrow", "lend", "repair", "buy"], "a": 5, "e": "purchase는 '구입하다'라는 뜻으로 buy와 의미가 같다.", "p": ""}, {"id": "EN-029", "s": "영어", "t": "단편", "g": 2, "d": "하", "q": "빈칸에 들어갈 말로 알맞은 것은?\nShe is interested ______ classical music.", "c": ["at", "on", "in", "for", "with"], "a": 3, "e": "be interested in은 '~에 관심이 있다'는 뜻의 표현이다.", "p": ""}, {"id": "EN-030", "s": "영어", "t": "단편", "g": 2, "d": "하", "q": "다음 단어의 반의어로 알맞은 것은?\n<b>increase</b>", "c": ["improve", "expand", "continue", "develop", "decrease"], "a": 5, "e": "increase(증가하다)의 반의어는 decrease(감소하다)이다.", "p": ""}, {"id": "EN-031", "s": "영어", "t": "단편", "g": 2, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?\nI wish I ______ taller than my brother.", "c": ["am", "will be", "have been", "be", "were"], "a": 5, "e": "'I wish + 가정법 과거'는 현재 사실과 반대되는 소망을 나타내며, be동사는 were를 쓴다.", "p": ""}, {"id": "EN-032", "s": "영어", "t": "단편", "g": 2, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?\nNo sooner had he left the house ______ it started to rain.", "c": ["than", "when", "before", "that", "as"], "a": 1, "e": "'No sooner had + 주어 + p.p. ~ than …'은 '~하자마자 …했다'는 뜻이다. Hardly/Scarcely ~ when/before와 구별한다.", "p": ""}, {"id": "EN-033", "s": "영어", "t": "단편", "g": 2, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?\nThe bridge ______ next year will connect the two cities.", "c": ["building", "built", "to build", "having built", "to be built"], "a": 5, "e": "다리는 '지어지는' 대상이고 next year로 미래의 일이므로, 명사를 뒤에서 수식하는 to부정사의 수동형 to be built가 알맞다.", "p": ""}, {"id": "EN-034", "s": "영어", "t": "단편", "g": 2, "d": "상", "q": "다음 중 어법상 <u>틀린</u> 문장은?", "c": ["Don't forget to lock the door when you leave.", "She stopped talking when the teacher came in.", "He tried to open the window, but it was stuck.", "I remember to meet him at the party last year.", "I regret telling her the secret."], "a": 4, "e": "과거에 한 일을 기억하는 것은 'remember + 동명사'로 나타내므로 remember meeting이 되어야 한다. 'remember to부정사'는 '(앞으로) ~할 것을 기억하다'라는 뜻이다.", "p": ""}, {"id": "EN-035", "s": "영어", "t": "단편", "g": 2, "d": "상", "q": "다음 단어의 뜻으로 알맞은 것은?\n<b>ambiguous</b>", "c": ["모호한", "야심 찬", "풍부한", "적대적인", "즉각적인"], "a": 1, "e": "ambiguous는 '모호한, 여러 가지로 해석될 수 있는'이라는 뜻이다. '야심 찬'은 ambitious이다.", "p": ""}, {"id": "EN-036", "s": "영어", "t": "단편", "g": 3, "d": "하", "q": "다음 단어와 의미가 가장 가까운 것은?\n<b>huge</b>", "c": ["tiny", "narrow", "ordinary", "empty", "enormous"], "a": 5, "e": "huge는 '거대한'이라는 뜻으로 enormous와 의미가 가깝다.", "p": ""}, {"id": "EN-037", "s": "영어", "t": "단편", "g": 3, "d": "하", "q": "빈칸에 들어갈 말로 알맞은 것은?\nHe is taller ______ his older brother.", "c": ["as", "to", "than", "of", "from"], "a": 3, "e": "비교급(taller) 뒤에는 비교 대상을 나타내는 than을 쓴다.", "p": ""}, {"id": "EN-038", "s": "영어", "t": "단편", "g": 3, "d": "하", "q": "다음 단어의 뜻으로 알맞은 것은?\n<b>ancestor</b>", "c": ["조상", "후손", "이웃", "경쟁자", "동료"], "a": 1, "e": "ancestor는 '조상'이라는 뜻이다. '후손'은 descendant이다.", "p": ""}, {"id": "EN-039", "s": "영어", "t": "단편", "g": 3, "d": "하", "q": "빈칸에 들어갈 말로 알맞은 것은?\nI have lived in this town ______ 2010.", "c": ["for", "during", "from", "since", "at"], "a": 4, "e": "현재완료와 함께 '~ 이래로'라는 시작 시점을 나타낼 때는 since를 쓴다. for 뒤에는 기간(for ten years)이 온다.", "p": ""}, {"id": "EN-040", "s": "영어", "t": "단편", "g": 3, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?\nThis book is worth ______ twice.", "c": ["read", "reading", "to read", "being read", "to be read"], "a": 2, "e": "'be worth -ing'는 '~할 가치가 있다'는 뜻으로, worth 뒤에는 동명사가 온다.", "p": ""}, {"id": "EN-041", "s": "영어", "t": "단편", "g": 3, "d": "중", "q": "다음 단어와 의미가 가장 가까운 것은?\n<b>inevitable</b>", "c": ["unbelievable", "invisible", "incorrect", "unavoidable", "informal"], "a": 4, "e": "inevitable은 '피할 수 없는, 필연적인'이라는 뜻으로 unavoidable과 의미가 같다.", "p": ""}, {"id": "EN-042", "s": "영어", "t": "단편", "g": 3, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?\nHe talks ______ if he knew everything about the matter.", "c": ["even", "as", "only", "what", "so"], "a": 2, "e": "'as if + 가정법 과거'는 '마치 ~인 것처럼'이라는 뜻으로 현재 사실과 반대되는 내용을 나타낸다.", "p": ""}, {"id": "EN-043", "s": "영어", "t": "단편", "g": 3, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?\nHad it not been for your help, I ______ the exam.", "c": ["will fail", "would have failed", "would fail", "had failed", "failed"], "a": 2, "e": "'Had it not been for ~'는 'If it had not been for ~(~이 없었다면)'에서 if가 생략되어 도치된 가정법 과거완료이므로, 주절은 'would have + p.p.'가 된다.", "p": ""}, {"id": "EN-044", "s": "영어", "t": "단편", "g": 3, "d": "상", "q": "다음 단어와 의미가 가장 가까운 것은?\n<b>meticulous</b>", "c": ["careless", "hasty", "generous", "thorough", "modest"], "a": 4, "e": "meticulous는 '꼼꼼한, 세심한'이라는 뜻으로 thorough(철저한)와 의미가 가깝다.", "p": ""}, {"id": "EN-045", "s": "영어", "t": "단편", "g": 3, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?\nThe more you practice, ______ you will become.", "c": ["better", "the better", "the best", "more good", "the more good"], "a": 2, "e": "'The + 비교급 ~, the + 비교급 …'은 '~하면 할수록 더 …하다'는 뜻의 구문이다.", "p": ""}, {"id": "EN-046", "s": "영어", "t": "수능", "g": 1, "d": "하", "q": "다음 글의 목적으로 가장 적절한 것은?", "c": ["독서 모임 회원 가입을 신청하려고", "도서관 이용 시간 연장을 건의하려고", "독서 모임 일정 변경을 알리려고", "모임 장소의 난방기 수리를 요청하려고", "난방기를 고쳐 준 것에 감사하려고"], "a": 4, "e": "마지막 부분의 'Could you please send someone to repair the heater ~?'에서 난방기 수리를 요청하는 글임을 알 수 있다.", "p": "Dear Mr. Harris,\nI am a member of the Maple Street Library reading club. Our club meets every Saturday in Room B, but the heating in that room has not worked since last month. Several older members have stopped coming because of the cold. Could you please send someone to repair the heater before our next meeting? Thank you for your help.\nSincerely,\nJulia Kim"}, {"id": "EN-047", "s": "영어", "t": "수능", "g": 1, "d": "하", "q": "다음 글의 요지로 가장 적절한 것은?", "c": ["큰 목표를 세워야 강한 동기가 생긴다.", "바쁠 때는 새로운 일을 시작하지 말아야 한다.", "운동과 독서를 함께 해야 효과가 크다.", "목표는 다른 사람에게 알려야 지킬 수 있다.", "습관을 만들려면 아주 작은 행동부터 반복하는 것이 좋다."], "a": 5, "e": "거창한 목표는 포기하기 쉬우므로, 너무 쉬워 보일 만큼 작은 행동으로 시작해 반복하면 습관이 된다는 내용이다.", "p": "Many people try to change their lives by setting huge goals, such as running a marathon or reading a hundred books a year. These goals are exciting at first, but they are easy to give up when life gets busy. A better approach is to start with an action so small that it feels almost too easy, like putting on your running shoes or reading one page. Small actions are easy to repeat, and repetition is what turns an action into a habit. Once the habit is in place, it grows naturally."}, {"id": "EN-048", "s": "영어", "t": "수능", "g": 1, "d": "중", "q": "다음 글의 내용과 일치하는 것은?", "c": ["관객은 동전이 정말로 사라졌다고 믿는다.", "마술사는 관객의 예측에 맞추어 마술을 진행한다.", "마술은 손이 눈보다 빠르기 때문에 성공한다.", "우리의 뇌는 과거 경험을 바탕으로 다음에 일어날 일을 예측한다.", "마술사는 두 손을 항상 함께 보여 준다."], "a": 4, "e": "'our brains are built to predict what will happen next based on past experience'와 일치한다. 마술사는 그 예측을 일부러 깨뜨리며, 마술의 성공 요인은 손의 속도가 아니라 주의의 통제이다.", "p": "When we watch a magic show, we know that the coin has not really disappeared. Still, we are surprised, because our brains are built to predict what will happen next based on past experience. Magicians understand these predictions and deliberately break them. They guide our attention to one hand while the other hand does the real work. In other words, a magic trick succeeds not because the magician's hands are faster than our eyes, but because the magician controls where we look."}, {"id": "EN-049", "s": "영어", "t": "수능", "g": 1, "d": "상", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "c": ["how fast we blink", "what we remember from childhood", "where we look", "the size of the stage", "the price of the ticket"], "a": 3, "e": "마술사가 한 손으로 주의를 끄는 동안 다른 손이 실제 작업을 한다고 했으므로, 마술의 성공은 손의 속도가 아니라 '우리가 어디를 보는지'를 마술사가 통제하기 때문이다.", "p": "When we watch a magic show, we know that the coin has not really disappeared. Still, we are surprised, because our brains are built to predict what will happen next based on past experience. Magicians understand these predictions and deliberately break them. They guide our attention to one hand while the other hand does the real work. In other words, a magic trick succeeds not because the magician's hands are faster than our eyes, but because the magician controls ________."}, {"id": "EN-050", "s": "영어", "t": "수능", "g": 2, "d": "하", "q": "Riverside Park Night Run에 관한 다음 안내문의 내용과 일치하는 것은?", "c": ["모든 참가자는 티셔츠를 받는다.", "일요일에 열린다.", "코스는 한 가지뿐이다.", "12세 미만 어린이도 참가비를 낸다.", "행사 당일까지 등록할 수 있다."], "a": 1, "e": "'All participants receive a T-shirt and a light stick.'과 일치한다. 행사는 토요일이고, 코스는 5 km와 10 km 두 가지이며, 12세 미만은 무료, 등록 마감은 9월 7일이다.", "p": "<b>Riverside Park Night Run</b>\n• Date: Saturday, September 14\n• Start time: 7:30 p.m.\n• Courses: 5 km and 10 km\n• Entry fee: $15 for adults, free for children under 12\n• All participants receive a T-shirt and a light stick.\n• Registration closes on September 7.\n※ The event will be held even in light rain."}, {"id": "EN-051", "s": "영어", "t": "수능", "g": 2, "d": "하", "q": "다음 글에 드러난 Daniel의 심경으로 가장 적절한 것은?", "c": ["bored and sleepy", "proud and confident", "frightened and anxious", "relieved and thankful", "excited and joyful"], "a": 3, "e": "해가 지고 손전등이 희미해지는 숲에서 길을 잃었고, 뒤에서 나뭇가지 부러지는 소리에 심장이 뛰는 상황이므로 두렵고 불안한 심경이다.", "p": "The forest was silent except for the crunch of leaves under Daniel's boots. The sun had set an hour ago, and his flashlight was growing dim. He had been sure the cabin was just beyond the stream, but now nothing looked familiar. A branch snapped somewhere behind him. He turned quickly, his heart pounding, and saw nothing but darkness."}, {"id": "EN-052", "s": "영어", "t": "수능", "g": 2, "d": "하", "q": "다음 글의 주제로 가장 적절한 것은?", "c": ["why novels are more popular than movies", "the difficulty of writing a good story", "the history of the modern novel", "how reading fiction improves our ability to understand others", "ways to read more books in less time"], "a": 4, "e": "소설을 읽으며 인물의 생각과 감정을 상상하는 것이 타인의 감정을 이해하는 능력을 길러 준다는 내용이다.", "p": "Reading novels may do more than entertain us. When we follow a character through a story, we imagine that person's thoughts and feelings as if they were our own. Psychologists suggest that this mental practice works like a simulator for social life: it lets us experience situations and relationships that we might never meet in reality. As a result, people who often read fiction tend to be better at understanding what others feel. A good story, then, is a training ground for empathy."}, {"id": "EN-053", "s": "영어", "t": "수능", "g": 2, "d": "상", "q": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?", "c": ["①", "②", "③", "④", "⑤"], "a": 3, "e": "주어진 문장의 However는 '얼음이 녹을 것이라며 사람들이 비웃었다'는 내용 뒤에 와야 하고, ③ 뒤의 'Packed this way(이런 방식으로 포장하면)'는 톱밥으로 단열했다는 주어진 문장의 내용을 가리킨다.", "p": "<div class='box'>However, Tudor discovered that sawdust was an excellent insulator.</div>Before refrigerators existed, keeping food cold was a serious challenge. ( ① ) In the early nineteenth century, a Boston businessman named Frederic Tudor began cutting ice from frozen ponds in winter and shipping it to warm regions. ( ② ) Many people laughed at the idea, expecting the ice to melt long before it arrived. ( ③ ) Packed this way, large blocks could survive voyages of several months. ( ④ ) The ice trade soon grew into a major industry, supplying cities around the world. ( ⑤ ) It declined only when electric refrigeration became widely available in the twentieth century."}, {"id": "EN-054", "s": "영어", "t": "수능", "g": 2, "d": "상", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "c": ["What will I gain or lose from now on?", "Who is responsible for the loss?", "Why did I buy the ticket?", "How can I get my money back?", "When did the project begin?"], "a": 1, "e": "매몰 비용은 이미 써서 되찾을 수 없으므로 미래의 선택에 영향을 주어서는 안 된다는 내용이다. 따라서 합리적인 질문은 '얼마나 썼는가'가 아니라 '지금부터 무엇을 얻거나 잃는가'이다.", "p": "Economists use the term 'sunk cost' for money or time that has already been spent and cannot be recovered. Logically, such costs should not affect our future choices. Yet people often continue watching a boring movie simply because they paid for the ticket, or keep investing in a failing project because of what they have already put into it. The rational question is not 'How much have I spent?' but '________'"}, {"id": "EN-055", "s": "영어", "t": "수능", "g": 2, "d": "상", "q": "(A), (B), (C)의 각 네모 안에서 문맥에 맞는 낱말로 가장 적절한 것은?", "c": ["rich – survive – higher", "rich – avoid – lower", "poor – survive – lower", "poor – avoid – higher", "rich – survive – lower"], "a": 5, "e": "(A) but으로 '텅 빈 곳'이라는 통념과 반대되므로 rich, (B) 물을 저장해 비 없이도 '살아남는다'는 survive, (C) 밤에는 낮보다 기온이 '낮다'는 lower가 알맞다.", "p": "Deserts are often imagined as empty places, but many of them are surprisingly (A) [ rich / poor ] in life. Plants such as cacti store water in their thick stems, which allows them to (B) [ survive / avoid ] months without rain. Many desert animals are active only at night, when temperatures are much (C) [ higher / lower ] than during the day."}, {"id": "EN-056", "s": "영어", "t": "수능", "g": 3, "d": "하", "q": "다음 방송의 목적으로 가장 적절한 것은?", "c": ["동아리 신입 회원 모집을 안내하려고", "학교 웹사이트 개편을 홍보하려고", "통학 버스 이용 예절을 당부하려고", "내일 휴교 결정을 발표하려고", "폭설에 따른 방과 후 활동 취소와 버스 시간 변경을 알리려고"], "a": 5, "e": "폭설 예보로 방과 후 동아리 활동이 취소되고 통학 버스가 평소보다 일찍 출발한다는 것을 알리는 방송이다. 내일 일정은 아직 정해지지 않아 웹사이트를 확인하라고 했다.", "p": "Attention, students. This is your principal speaking. Due to the heavy snow expected this afternoon, all after-school club activities are cancelled today. School buses will leave at 3:30 p.m., thirty minutes earlier than usual. Please check the school website tonight for information about tomorrow's schedule. Thank you."}, {"id": "EN-057", "s": "영어", "t": "수능", "g": 3, "d": "하", "q": "다음 글에서 필자가 주장하는 바로 가장 적절한 것은?", "c": ["수업 시간에는 질문을 줄이고 집중해야 한다.", "질문은 수업이 끝난 뒤에 따로 해야 한다.", "교사는 학생에게 더 많은 질문을 던져야 한다.", "이해가 부족한 학생은 예습을 해야 한다.", "수업 중 질문을 장려하고 두려워하지 말아야 한다."], "a": 5, "e": "질문은 이해 부족의 표시가 아니라 적극적 학습이며 친구들에게도 도움이 되므로, 교사는 질문을 칭찬하고 학생은 손 들기를 두려워하지 말아야 한다고 주장한다.", "p": "Some people think that asking questions in class shows a lack of understanding. I believe the opposite is true. A student who asks a question is actively connecting new ideas with what he or she already knows. Moreover, one student's question often helps classmates who were confused but too shy to speak. Teachers should therefore praise questions, and students should never be afraid to raise their hands."}, {"id": "EN-058", "s": "영어", "t": "수능", "g": 3, "d": "중", "q": "다음 글의 주제로 가장 적절한 것은?", "c": ["the best way to raise healthy cows", "the history of farming villages", "advantages of private land over public parks", "why shared resources get overused and how to prevent it", "how farmers cooperate to sell their products"], "a": 4, "e": "모두에게 열린 자원은 각자가 자기 이익을 추구하다 고갈될 수 있으며(공유지의 비극), 이를 막으려면 공동의 규칙이 필요하다는 내용이다.", "p": "Imagine a pasture open to all the farmers of a village. Each farmer gains the full benefit of adding one more cow to his herd, while the cost of the extra grazing is shared by everyone. Acting on this logic, every farmer keeps adding cows. Before long, the grass is gone and all the herds starve. This situation, known as the tragedy of the commons, shows that when a resource belongs to everyone, individuals pursuing their own interest can destroy it. To prevent such outcomes, communities need shared rules that limit how much each person can take."}, {"id": "EN-059", "s": "영어", "t": "수능", "g": 3, "d": "상", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "c": ["the details it deliberately omits", "the number of facts it contains", "its perfect match with reality", "the beauty of its design", "the speed at which it was built"], "a": 1, "e": "지도는 대부분의 세부 사항을 생략하기 때문에 유용하며 과학 모형도 마찬가지라고 했다. 따라서 모형의 가치는 현실의 완벽한 복제가 아니라 '의도적으로 생략한 세부 사항'에 있다.", "p": "A map is useful precisely because it leaves things out. A map that showed every tree, every stone, and every crack in the pavement would be as large and as confusing as the land itself. By ignoring most details and keeping only those relevant to the traveler's purpose, the mapmaker makes the world readable. Scientific models work the same way. A model of the climate or the economy is not a perfect copy of reality; its value lies in ________."}, {"id": "EN-060", "s": "영어", "t": "단편", "g": 1, "d": "하", "q": "다음 단어의 뜻으로 알맞은 것은? <b>borrow</b>", "c": ["빌려주다", "돌려주다", "빌리다", "구입하다", "잃어버리다"], "a": 3, "e": "borrow는 '빌리다'이다. '빌려주다'는 lend이다.", "p": ""}, {"id": "EN-061", "s": "영어", "t": "단편", "g": 1, "d": "하", "q": "다음 단어의 뜻으로 알맞은 것은? <b>arrive</b>", "c": ["출발하다", "기다리다", "떠나다", "도착하다", "준비하다"], "a": 4, "e": "arrive는 '도착하다'이며, 반의어는 depart(출발하다)이다.", "p": ""}, {"id": "EN-062", "s": "영어", "t": "단편", "g": 1, "d": "하", "q": "다음 단어의 반의어로 알맞은 것은? <b>cheap</b>", "c": ["expensive", "low", "easy", "small", "free"], "a": 1, "e": "cheap(값싼)의 반의어는 expensive(비싼)이다.", "p": ""}, {"id": "EN-063", "s": "영어", "t": "단편", "g": 1, "d": "하", "q": "다음 단어와 의미가 가장 가까운 것은? <b>begin</b>", "c": ["finish", "stop", "close", "leave", "start"], "a": 5, "e": "begin과 start는 모두 '시작하다'라는 뜻이다.", "p": ""}, {"id": "EN-064", "s": "영어", "t": "단편", "g": 1, "d": "하", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>She ______ to school every day.", "c": ["walk", "walking", "to walk", "walked to", "walks"], "a": 5, "e": "주어가 3인칭 단수(She)이고 현재의 습관을 나타내므로 동사에 -s를 붙인 walks가 알맞다.", "p": ""}, {"id": "EN-065", "s": "영어", "t": "단편", "g": 1, "d": "하", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>There ______ many people in the park yesterday.", "c": ["were", "was", "is", "are", "be"], "a": 1, "e": "주어 many people이 복수이고 yesterday가 과거를 나타내므로 were가 알맞다.", "p": ""}, {"id": "EN-066", "s": "영어", "t": "단편", "g": 1, "d": "하", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>I am good ______ playing the piano.", "c": ["at", "in", "on", "for", "with"], "a": 1, "e": "be good at은 '~을 잘하다'라는 뜻이다.", "p": ""}, {"id": "EN-067", "s": "영어", "t": "단편", "g": 1, "d": "하", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>This bag is ______ than that one.", "c": ["heavy", "heaviest", "heavier", "more heavy", "the heaviest"], "a": 3, "e": "than이 있으므로 비교급이 필요하다. heavy의 비교급은 y를 i로 바꾸어 -er을 붙인 heavier이다.", "p": ""}, {"id": "EN-068", "s": "영어", "t": "단편", "g": 1, "d": "하", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>Would you mind ______ the window?", "c": ["open", "opening", "to open", "opened", "opens"], "a": 2, "e": "mind는 동명사를 목적어로 취한다. 'Would you mind opening the window?'는 '창문 좀 열어 주시겠어요?'라는 뜻이다.", "p": ""}, {"id": "EN-069", "s": "영어", "t": "수능", "g": 1, "d": "하", "q": "다음 글의 목적으로 가장 적절한 것은?", "c": ["카메라 사용법을 문의하려고", "동아리 영상 촬영에 초대하려고", "고장 난 카메라의 수리를 요청하려고", "빌린 카메라의 반납 기한 연장을 요청하려고", "미디어실 이용 시간을 안내하려고"], "a": 4, "e": "Sora는 촬영이 예상보다 길어져 카메라를 목요일까지 쓸 수 있는지 묻고 있다.", "p": "Hi Mr. Lee,\nI'm Sora from Class 2-3. I borrowed a camera from the school media room last Friday for our club project. I was supposed to return it today, but our filming took longer than we expected. Would it be possible to keep it until this Thursday? I promise to take good care of it and bring it back by 4 p.m. on Thursday.\nThank you,\nSora"}, {"id": "EN-070", "s": "영어", "t": "수능", "g": 1, "d": "하", "q": "Hillside High School Book Swap에 관한 다음 안내문의 내용과 일치하는 것은?", "c": ["책은 다섯 권까지 가져올 수 있다.", "만화책도 교환할 수 있다.", "학교 도서관에서 열린다.", "남은 책은 학생들에게 돌려준다.", "방과 후에 진행된다."], "a": 3, "e": "장소는 School library이다. 최대 3권, 만화책과 교과서는 불가, 남은 책은 지역 아동 센터에 기부, 시간은 점심시간(12:30~1:20)이다.", "p": "<b>Hillside High School Book Swap</b>\n• When: Wednesday, May 8, 12:30 p.m. – 1:20 p.m.\n• Where: School library\n• Bring up to 3 books in good condition and swap them for other books.\n• Comic books and textbooks are not accepted.\n• Leftover books will be donated to the local children's center."}, {"id": "EN-071", "s": "영어", "t": "수능", "g": 1, "d": "하", "q": "다음 글에 드러난 Jiho의 심경 변화로 가장 적절한 것은?", "c": ["bored → excited", "angry → calm", "happy → sad", "nervous → proud", "proud → ashamed"], "a": 4, "e": "처음에는 손이 떨리고 입이 마를 정도로 긴장했지만(nervous), 연설을 마친 뒤 자랑스러움으로 얼굴이 빛났다(proud).", "p": "When Jiho stepped onto the stage, his hands were shaking and his mouth was dry. He looked out at the hundreds of faces in the hall and almost forgot the first line of his speech. Then he saw his grandmother in the front row, smiling and nodding at him. He took a deep breath and began. As he spoke, his voice grew stronger. When he finished, the audience stood up and clapped loudly. Jiho bowed, his face glowing with pride."}, {"id": "EN-072", "s": "영어", "t": "단편", "g": 1, "d": "중", "q": "다음 단어의 뜻으로 알맞은 것은? <b>necessary</b>", "c": ["가능한", "필요한", "중요하지 않은", "위험한", "편리한"], "a": 2, "e": "necessary는 '필요한'이라는 뜻이다. possible은 '가능한', convenient는 '편리한'이다.", "p": ""}, {"id": "EN-073", "s": "영어", "t": "단편", "g": 1, "d": "중", "q": "다음 단어와 의미가 가장 가까운 것은? <b>rapid</b>", "c": ["quick", "slow", "gentle", "heavy", "quiet"], "a": 1, "e": "rapid와 quick은 모두 '빠른'이라는 뜻이다.", "p": ""}, {"id": "EN-074", "s": "영어", "t": "단편", "g": 1, "d": "중", "q": "다음 단어의 반의어로 알맞은 것은? <b>include</b>", "c": ["contain", "involve", "exclude", "add", "cover"], "a": 3, "e": "include(포함하다)의 반의어는 exclude(제외하다)이다.", "p": ""}, {"id": "EN-075", "s": "영어", "t": "단편", "g": 1, "d": "중", "q": "밑줄 친 부분과 의미가 가장 가까운 것은?<br>Please <u>look after</u> my dog while I'm away.", "c": ["look for", "look up", "look down on", "look forward to", "take care of"], "a": 5, "e": "look after는 '~을 돌보다'로 take care of와 같은 뜻이다. look for는 '찾다', look down on은 '깔보다'이다.", "p": ""}, {"id": "EN-076", "s": "영어", "t": "단편", "g": 1, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>I have ______ been to Jeju Island. I really want to go there.", "c": ["ever", "already", "just", "yet", "never"], "a": 5, "e": "가 보고 싶다고 했으므로 '한 번도 가 본 적이 없다'는 경험을 나타내는 현재완료 부정 never가 알맞다.", "p": ""}, {"id": "EN-077", "s": "영어", "t": "단편", "g": 1, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>The boy ______ is standing by the door is my brother.", "c": ["which", "whose", "whom", "what", "who"], "a": 5, "e": "선행사가 사람(The boy)이고 관계대명사가 관계절에서 주어 역할을 하므로 who가 알맞다.", "p": ""}, {"id": "EN-078", "s": "영어", "t": "단편", "g": 1, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>He was too tired ______ his homework.", "c": ["finishing", "finish", "to finish", "finished", "for finish"], "a": 3, "e": "'too + 형용사 + to부정사'는 '너무 ~해서 …할 수 없다'는 뜻이다.", "p": ""}, {"id": "EN-079", "s": "영어", "t": "단편", "g": 1, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>The window ______ by Tom yesterday.", "c": ["broke", "is broken", "breaks", "was broken", "has broken"], "a": 4, "e": "창문이 '깨진' 것이므로 수동태(be + p.p.)이고, yesterday가 있어 과거형 was broken이 알맞다.", "p": ""}, {"id": "EN-080", "s": "영어", "t": "단편", "g": 1, "d": "중", "q": "다음 중 어법상 <u>틀린</u> 문장은?", "c": ["She enjoys to read novels.", "I want to visit Paris.", "He decided to study harder.", "We finished cleaning the room.", "They hope to win the game."], "a": 1, "e": "enjoy는 동명사를 목적어로 취하므로 enjoys reading이 맞다. want, decide, hope는 to부정사를, finish는 동명사를 목적어로 취한다.", "p": ""}, {"id": "EN-081", "s": "영어", "t": "수능", "g": 1, "d": "중", "q": "다음 글의 요지로 가장 적절한 것은?", "c": ["병원은 정원을 반드시 갖추어야 한다.", "공원은 도시의 교통을 개선한다.", "자연 속에서 시간을 보내면 스트레스가 줄어든다.", "운동은 실내에서 하는 것이 좋다.", "창문은 건물의 에너지를 절약한다."], "a": 3, "e": "녹지에서 시간을 보내면 스트레스 호르몬이 줄고 집중력이 좋아진다는 연구들을 소개하고, 스트레스를 받으면 자연과 시간을 보내라고 권한다.", "p": "Have you ever noticed that you feel calmer after a walk in the park? Scientists have found that spending time in green spaces lowers stress hormones and helps people focus better. Even looking at trees through a window can make a difference. In one study, hospital patients whose rooms faced a garden recovered faster than those whose rooms faced a brick wall. So the next time you feel stressed, try stepping outside and spending a few minutes with nature."}, {"id": "EN-082", "s": "영어", "t": "수능", "g": 1, "d": "중", "q": "다음 글의 내용과 일치하는 것은?", "c": ["문어는 병뚜껑을 열지 못한다.", "문어의 신경 세포는 대부분 다리에 있다.", "문어의 다리는 맛을 느끼지 못한다.", "문어는 피부 색깔을 바꾸는 데 몇 분이 걸린다.", "문어는 바다에서 가장 느린 동물이다."], "a": 2, "e": "an octopus has most of its nerve cells in its arms라고 하였다. 병을 열 수 있고, 다리로 맛을 느끼며, 1초도 안 되어 색을 바꾼다.", "p": "Octopuses are among the smartest animals in the sea. They can open jars to get food inside, and some have even been seen carrying coconut shells to use as shelters. Unlike humans, an octopus has most of its nerve cells in its arms, not in its brain. This means each arm can taste, touch, and even make simple decisions on its own. Octopuses can also change the color and texture of their skin in less than a second to hide from enemies."}, {"id": "EN-083", "s": "영어", "t": "수능", "g": 1, "d": "중", "q": "다음 글의 밑줄 친 <u>it</u>이 가리키는 것으로 가장 적절한 것은?<div class='box'>I borrowed a camera from the school media room last Friday. I was supposed to return <u>it</u> today.</div>", "c": ["the school media room", "a camera", "last Friday", "today", "the club"], "a": 2, "e": "돌려주기로 한 것은 빌린 카메라이다.", "p": ""}, {"id": "EN-084", "s": "영어", "t": "수능", "g": 1, "d": "중", "q": "다음 대화의 빈칸에 들어갈 말로 가장 적절한 것은?<div class='box'>A: I have a bad cold. I can't stop coughing.<br>B: That's too bad. ________<br>A: Thanks. I'll go after school.</div>", "c": ["Let's play soccer together.", "Why don't you see a doctor?", "I'm glad to hear that.", "How about eating ice cream?", "You look very healthy."], "a": 2, "e": "감기에 걸렸다는 말에 병원에 가 보라고 권하고, A가 방과 후에 가겠다고 답하는 흐름이다.", "p": ""}, {"id": "EN-085", "s": "영어", "t": "단편", "g": 1, "d": "상", "q": "다음 단어의 뜻으로 알맞은 것은? <b>consequence</b>", "c": ["원인", "과정", "조건", "목표", "결과"], "a": 5, "e": "consequence는 '결과'라는 뜻이다. 원인은 cause이다.", "p": ""}, {"id": "EN-086", "s": "영어", "t": "단편", "g": 1, "d": "상", "q": "다음 단어와 의미가 가장 가까운 것은? <b>obvious</b>", "c": ["hidden", "strange", "difficult", "clear", "rare"], "a": 4, "e": "obvious와 clear는 '분명한, 명백한'이라는 뜻이다.", "p": ""}, {"id": "EN-087", "s": "영어", "t": "단편", "g": 1, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>I don't know ______ he will come to the party or not.", "c": ["that", "what", "which", "whether", "unless"], "a": 4, "e": "'~인지 아닌지'를 나타내며 or not과 함께 쓰이는 접속사는 whether이다.", "p": ""}, {"id": "EN-088", "s": "영어", "t": "단편", "g": 1, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>This is the museum ______ we visited last summer.", "c": ["which", "where", "who", "when", "what"], "a": 1, "e": "관계절 we visited ___에서 visited의 목적어가 빠져 있으므로 관계대명사 which가 알맞다. where는 완전한 절 앞에 쓴다.", "p": ""}, {"id": "EN-089", "s": "영어", "t": "단편", "g": 1, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>By the time we got to the theater, the movie ______.", "c": ["already starts", "has already started", "had already started", "will start", "is starting"], "a": 3, "e": "극장에 도착한 과거 시점보다 영화가 더 먼저 시작했으므로 과거완료(had p.p.)가 알맞다.", "p": ""}, {"id": "EN-090", "s": "영어", "t": "단편", "g": 1, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>______ tired, she went to bed early.", "c": ["Felt", "To feel", "Feeling", "Feel", "Feels"], "a": 3, "e": "'피곤했기 때문에'라는 이유를 나타내는 분사구문이다. 주어 she가 피곤함을 '느끼는' 능동 관계이므로 현재분사 Feeling을 쓴다.", "p": ""}, {"id": "EN-091", "s": "영어", "t": "단편", "g": 1, "d": "상", "q": "다음 중 어법상 <u>틀린</u> 문장은?", "c": ["Mathematics is my favorite subject.", "Each student has a locker.", "Two hours is enough time.", "The news were very surprising.", "The number of cars is increasing."], "a": 4, "e": "news는 형태와 달리 단수 취급하므로 was가 맞다. 'the number of + 복수 명사'는 단수 취급, 'a number of'는 복수 취급한다.", "p": ""}, {"id": "EN-092", "s": "영어", "t": "수능", "g": 1, "d": "상", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?<div class='box'>Students often think that studying one type of problem until it is mastered is the best way to learn. However, mixing different types of problems forces students to choose the right strategy each time. This feels harder, but it leads to ________.</div>", "c": ["better long-term learning", "faster boredom", "lower test scores", "less effort", "fewer strategies"], "a": 1, "e": "문제를 섞어 풀면 더 어렵게 느껴지지만 장기적인 학습 효과가 더 좋다는 흐름이다.", "p": ""}, {"id": "EN-093", "s": "영어", "t": "수능", "g": 1, "d": "상", "q": "다음 글의 주제로 가장 적절한 것은?", "c": ["the importance of studying only one subject a day", "why tests should be easier", "benefits of mixing different problem types while studying", "how to memorize formulas quickly", "the history of study methods"], "a": 3, "e": "여러 유형의 문제를 섞어서 공부하는 interleaving이 장기 학습에 더 효과적이라는 내용이다.", "p": "Many students believe that they learn best when they study one subject for a long time before moving on to the next. However, research suggests that mixing different types of problems in one study session, called interleaving, leads to better long-term learning. When problems are mixed, students must decide which strategy to use for each one, instead of simply repeating the same method. This extra effort feels harder at the moment, but it helps students remember and apply what they have learned on real tests."}, {"id": "EN-094", "s": "영어", "t": "수능", "g": 1, "d": "상", "q": "다음 글에서 전체 흐름과 관계 <u>없는</u> 문장은?<div class='box'>① Octopuses are among the smartest animals in the sea. ② They can open jars to get food inside. ③ Some octopuses carry coconut shells to use as shelters. ④ Many people enjoy eating seafood at the beach. ⑤ They can also change the color of their skin to hide from enemies.</div>", "c": ["①", "②", "③", "④", "⑤"], "a": 4, "e": "문어의 지능과 능력에 관한 글인데, ④는 해변에서 해산물을 즐겨 먹는 사람들에 관한 내용으로 흐름과 관계가 없다.", "p": ""}, {"id": "EN-095", "s": "영어", "t": "수능", "g": 1, "d": "상", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?<div class='box'>Jiho stepped onto the stage with shaking hands.<br>(A) He took a deep breath and began, and his voice grew stronger.<br>(B) When he finished, the audience stood up and clapped.<br>(C) Then he saw his grandmother smiling at him from the front row.</div>", "c": ["(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "a": 4, "e": "떨며 무대에 오름 → (C) 할머니를 봄 → (A) 숨을 쉬고 연설 시작 → (B) 연설을 마치자 박수를 받음의 순서이다.", "p": ""}, {"id": "EN-096", "s": "영어", "t": "수능", "g": 1, "d": "상", "q": "다음 글의 밑줄 친 부분 중, 어법상 <u>틀린</u> 것은?<div class='box'>Many students believe that they learn best when they ① <u>study</u> one subject for a long time. However, research suggests that mixing different types of problems ② <u>lead</u> to better learning. Students must decide which strategy ③ <u>to use</u> for each problem, ④ <u>instead of</u> simply repeating the same method. This extra effort ⑤ <u>feels</u> harder.</div>", "c": ["①", "②", "③", "④", "⑤"], "a": 2, "e": "동명사구 mixing different types of problems가 주어이므로 단수 동사 leads가 와야 한다.", "p": ""}, {"id": "EN-097", "s": "영어", "t": "수능", "g": 1, "d": "상", "q": "다음 글에서 주장하는 바로 가장 적절한 것은?<div class='box'>Many teenagers stay up late scrolling through their phones. But the light from screens tells the brain that it is still daytime, which makes it harder to fall asleep. Lack of sleep then affects memory and mood the next day. Putting your phone away at least an hour before bed is a simple step that can greatly improve your sleep and your school life.</div>", "c": ["휴대 전화로 공부하는 습관을 길러야 한다.", "아침에 일찍 일어나 운동을 해야 한다.", "밤에는 밝은 조명을 켜 두어야 한다.", "잠들기 한 시간 전에는 휴대 전화를 치워야 한다.", "청소년은 휴대 전화를 갖지 말아야 한다."], "a": 4, "e": "마지막 문장에서 자기 전 최소 한 시간 동안 휴대 전화를 치우라고 주장한다.", "p": ""}, {"id": "EN-098", "s": "영어", "t": "단편", "g": 2, "d": "하", "q": "다음 단어의 뜻으로 알맞은 것은? <b>decrease</b>", "c": ["증가하다", "유지하다", "결정하다", "설명하다", "감소하다"], "a": 5, "e": "decrease는 '감소하다'이며, 반의어는 increase(증가하다)이다.", "p": ""}, {"id": "EN-099", "s": "영어", "t": "단편", "g": 2, "d": "하", "q": "다음 단어의 뜻으로 알맞은 것은? <b>environment</b>", "c": ["환경", "정부", "경험", "장비", "오락"], "a": 1, "e": "environment는 '환경'이다. government는 정부, experience는 경험, equipment는 장비이다.", "p": ""}, {"id": "EN-100", "s": "영어", "t": "단편", "g": 2, "d": "하", "q": "다음 단어와 의미가 가장 가까운 것은? <b>answer</b>", "c": ["ask", "question", "wonder", "reply", "forget"], "a": 4, "e": "answer와 reply는 모두 '대답(하다)'이라는 뜻이다.", "p": ""}, {"id": "EN-101", "s": "영어", "t": "단편", "g": 2, "d": "하", "q": "다음 단어의 반의어로 알맞은 것은? <b>success</b>", "c": ["victory", "progress", "result", "failure", "effort"], "a": 4, "e": "success(성공)의 반의어는 failure(실패)이다.", "p": ""}, {"id": "EN-102", "s": "영어", "t": "단편", "g": 2, "d": "하", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>My sister is afraid ______ dogs.", "c": ["at", "on", "with", "in", "of"], "a": 5, "e": "be afraid of는 '~을 두려워하다'라는 뜻이다.", "p": ""}, {"id": "EN-103", "s": "영어", "t": "단편", "g": 2, "d": "하", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>I ______ my homework yet.", "c": ["didn't finished", "don't finish", "not finished", "wasn't finish", "haven't finished"], "a": 5, "e": "yet은 부정문에서 '아직'의 뜻으로 현재완료와 함께 쓰인다.", "p": ""}, {"id": "EN-104", "s": "영어", "t": "단편", "g": 2, "d": "하", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>If it ______ tomorrow, we will stay home.", "c": ["rains", "will rain", "rained", "raining", "rain"], "a": 1, "e": "시간·조건의 부사절에서는 미래의 일도 현재 시제로 나타낸다.", "p": ""}, {"id": "EN-105", "s": "영어", "t": "단편", "g": 2, "d": "하", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>Let's meet ______ Monday morning.", "c": ["on", "in", "at", "to", "for"], "a": 1, "e": "요일이나 특정한 날의 아침·저녁 앞에는 on을 쓴다.", "p": ""}, {"id": "EN-106", "s": "영어", "t": "수능", "g": 2, "d": "하", "q": "다음 글의 주제로 가장 적절한 것은?", "c": ["the danger of traveling without a map", "why explorers counted their steps", "how digital technology has changed mapmaking", "how to build a satellite", "the best roads in the world"], "a": 3, "e": "손으로 그리던 지도가 위성 정보 덕분에 몇 분 만에 갱신되는 디지털 지도로 바뀐 과정을 다룬다.", "p": "In the past, maps were drawn by hand, and making one could take years. Explorers measured distances by counting their steps and checked directions with the stars. Today, satellites circle the Earth and send detailed images back every day. With this information, digital maps can be updated in minutes when a new road opens or a bridge closes. Yet some things have not changed. A map is still a choice about what to show and what to leave out, and every map reflects the purpose of the person who made it."}, {"id": "EN-107", "s": "영어", "t": "수능", "g": 2, "d": "하", "q": "다음 글의 요지로 가장 적절한 것은?", "c": ["음식물 쓰레기는 자원 낭비와 환경 오염을 함께 일으킨다.", "음식은 오래 보관할수록 맛이 좋아진다.", "도시는 쓰레기 매립지를 늘려야 한다.", "메테인은 이산화 탄소보다 약한 온실가스이다.", "남은 음식은 모두 버려야 한다."], "a": 1, "e": "음식을 버리면 생산에 든 물·에너지·노동이 낭비되고, 매립지에서 강력한 온실가스인 메테인이 생긴다는 내용이다.", "p": "Food waste is not only a problem of throwing away good food. When food is wasted, all the water, energy, and labor used to grow, transport, and store it are wasted too. In addition, food that ends up in landfills produces methane, a greenhouse gas much more powerful than carbon dioxide. Some cities now collect food scraps separately and turn them into compost or energy. At home, people can reduce waste by planning meals, buying only what they need, and using leftovers creatively."}, {"id": "EN-108", "s": "영어", "t": "수능", "g": 2, "d": "하", "q": "다음 대화의 빈칸에 들어갈 말로 가장 적절한 것은?<div class='box'>A: Excuse me. How can I get to the city library?<br>B: ________<br>A: Thank you very much.</div>", "c": ["I don't like reading books.", "Go straight two blocks and turn left.", "The library closes on Mondays.", "I borrowed three books yesterday.", "You're welcome."], "a": 2, "e": "길을 묻는 말에 길을 알려 주는 대답이 알맞다.", "p": ""}, {"id": "EN-109", "s": "영어", "t": "단편", "g": 2, "d": "중", "q": "다음 단어의 뜻으로 알맞은 것은? <b>efficient</b>", "c": ["충분한", "효율적인", "필수적인", "효과 없는", "경제적인"], "a": 2, "e": "efficient는 '효율적인'이다. sufficient는 '충분한', essential은 '필수적인'이다.", "p": ""}, {"id": "EN-110", "s": "영어", "t": "단편", "g": 2, "d": "중", "q": "다음 단어와 의미가 가장 가까운 것은? <b>predict</b>", "c": ["remember", "describe", "prevent", "regret", "forecast"], "a": 5, "e": "predict와 forecast는 '예측하다'라는 뜻이다.", "p": ""}, {"id": "EN-111", "s": "영어", "t": "단편", "g": 2, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>She made her son ______ his room.", "c": ["to clean", "cleaning", "cleaned", "clean", "cleans"], "a": 4, "e": "사역동사 make는 목적격 보어로 동사원형을 쓴다.", "p": ""}, {"id": "EN-112", "s": "영어", "t": "단편", "g": 2, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>The concert was so ______ that everyone stood up and cheered.", "c": ["excited", "excite", "excitement", "excitedly", "exciting"], "a": 5, "e": "콘서트가 감정을 '일으키는' 쪽이므로 현재분사 exciting을 쓴다. 감정을 느끼는 사람에게는 excited를 쓴다.", "p": ""}, {"id": "EN-113", "s": "영어", "t": "단편", "g": 2, "d": "중", "q": "밑줄 친 부분과 의미가 가장 가까운 것은?<br>We have to <u>come up with</u> a new idea.", "c": ["give up", "put off", "think of", "turn down", "carry out"], "a": 3, "e": "come up with는 '(생각을) 떠올리다, 제시하다'로 think of와 뜻이 비슷하다.", "p": ""}, {"id": "EN-114", "s": "영어", "t": "수능", "g": 2, "d": "중", "q": "다음 글의 제목으로 가장 적절한 것은?", "c": ["How to Collect All the Facts", "More Information Is Not Always Better", "Why Experts Never Make Decisions", "The First Option Is the Best", "Information Makes Us Happy"], "a": 2, "e": "정보가 너무 많으면 오히려 결정이 나빠지므로 중요한 몇 가지 요소에 집중해야 한다는 내용이다.", "p": "People often think that the best way to make a good decision is to collect as much information as possible. But too much information can actually make decisions worse. When we face too many options or facts, we become tired and confused, and we may end up choosing nothing at all or simply picking the first option. Experts call this information overload. Good decision makers do not try to know everything. Instead, they first decide which few factors matter most and then focus only on the information related to those factors."}, {"id": "EN-115", "s": "영어", "t": "수능", "g": 2, "d": "중", "q": "다음 글에서 전체 흐름과 관계 <u>없는</u> 문장은?<div class='box'>① Bees are essential to the food we eat. ② About one-third of our food depends on pollination by insects. ③ Honey has been used as medicine for thousands of years. ④ However, bee populations are declining worldwide. ⑤ The loss of wildflowers and the use of pesticides are among the causes.</div>", "c": ["①", "②", "③", "④", "⑤"], "a": 3, "e": "꿀벌의 중요성과 개체 수 감소에 관한 글인데, ③은 꿀의 약용 역사에 관한 내용으로 흐름과 관계없다.", "p": ""}, {"id": "EN-116", "s": "영어", "t": "수능", "g": 2, "d": "중", "q": "다음 글의 주제로 가장 적절한 것은?", "c": ["how to make honey at home", "why insects are dangerous to crops", "the best flowers for city gardens", "the history of farming", "causes of bee decline and the need for wide action"], "a": 5, "e": "꿀벌의 중요성, 개체 수 감소의 여러 원인, 다방면의 보호 노력이 필요함을 다룬다.", "p": "Bees play a key role in our food system. About one-third of the food we eat depends on pollination by insects, mainly bees. Unfortunately, bee populations have been declining in many parts of the world. Scientists point to several causes, including the loss of wildflowers, the use of certain pesticides, and diseases spread by parasites. Because these causes are connected, protecting bees requires action on many fronts, from planting flowers in cities to changing farming practices."}, {"id": "EN-117", "s": "영어", "t": "단편", "g": 2, "d": "상", "q": "다음 단어의 뜻으로 알맞은 것은? <b>reluctantly</b>", "c": ["기꺼이", "재빨리", "마지못해", "조용히", "우연히"], "a": 3, "e": "reluctantly는 '마지못해, 꺼리며'라는 뜻이다. willingly(기꺼이)와 반대이다.", "p": ""}, {"id": "EN-118", "s": "영어", "t": "단편", "g": 2, "d": "상", "q": "다음 단어와 의미가 가장 가까운 것은? <b>abandon</b>", "c": ["take up", "pick up", "give up", "set up", "make up"], "a": 3, "e": "abandon은 '버리다, 포기하다'로 give up과 뜻이 비슷하다.", "p": ""}, {"id": "EN-119", "s": "영어", "t": "단편", "g": 2, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>It is high time you ______ to bed.", "c": ["went", "go", "going", "will go", "have gone"], "a": 1, "e": "'It is (high) time + 주어 + 과거 동사'는 '이미 ~해야 할 때이다'라는 뜻의 가정법 표현이다.", "p": ""}, {"id": "EN-120", "s": "영어", "t": "단편", "g": 2, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>She speaks English as fluently as ______ she were a native speaker.", "c": ["though", "whether", "if", "unless", "since"], "a": 3, "e": "'as if + 가정법 과거'는 '마치 ~인 것처럼'이라는 뜻이다. as though도 같은 뜻이지만 as가 이미 쓰였으므로 if가 알맞다.", "p": ""}, {"id": "EN-121", "s": "영어", "t": "단편", "g": 2, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>Only after the meeting ______ the truth.", "c": ["I realized", "did I realize", "I did realize", "realized I", "had realized I"], "a": 2, "e": "부정어나 only가 이끄는 부사구가 문장 앞에 오면 주어와 조동사가 도치된다.", "p": ""}, {"id": "EN-122", "s": "영어", "t": "단편", "g": 2, "d": "상", "q": "다음 중 어법상 <u>틀린</u> 문장은?", "c": ["She is used to getting up early.", "He stopped smoking last year.", "I look forward to see you again.", "I remember meeting her before.", "They spent the weekend painting the fence."], "a": 3, "e": "look forward to의 to는 전치사이므로 동명사 seeing을 써야 한다.", "p": ""}, {"id": "EN-123", "s": "영어", "t": "수능", "g": 2, "d": "상", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?<div class='box'>When a shirt originally priced at $50 is marked down to $30, we focus on the $20 we 'saved' rather than the $30 we spent. We judge the price by comparing it with ________.</div>", "c": ["the prices in other countries", "the quality of the material", "what our friends paid", "the cost of making the shirt", "the first number we see"], "a": 5, "e": "처음 본 숫자(원래 가격 $50)를 기준으로 가격을 판단하는 경향, 곧 기준점 효과(anchoring)를 설명하는 글이다.", "p": ""}, {"id": "EN-124", "s": "영어", "t": "수능", "g": 2, "d": "상", "q": "다음 글의 밑줄 친 <u>a different question</u>이 의미하는 바로 가장 적절한 것은?<div class='box'>Smart shoppers ask <u>a different question</u>: 'Would I buy this if it had always cost $30?'</div>", "c": ["얼마나 많이 할인받았는지 계산하는 것", "다른 가게의 할인율을 비교하는 것", "할인 전 가격에 흔들리지 않고 지금 가격에 살 가치가 있는지 따지는 것", "원래 가격이 얼마였는지 확인하는 것", "할인이 언제 끝나는지 묻는 것"], "a": 3, "e": "현명한 소비자는 원래 가격(기준점)에서 벗어나, 실제로 내는 $30가 그 물건에 쓸 만한 돈인지를 묻는다.", "p": ""}, {"id": "EN-125", "s": "영어", "t": "수능", "g": 2, "d": "상", "q": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class='box'><b>This means each arm can taste, touch, and even make simple decisions on its own.</b><br>Octopuses are among the smartest animals in the sea. ( ① ) They can open jars to get food inside. ( ② ) Unlike humans, an octopus has most of its nerve cells in its arms, not in its brain. ( ③ ) Octopuses can also change the color of their skin to hide from enemies. ( ④ ) Scientists are still studying how they do this. ( ⑤ )</div>", "c": ["①", "②", "③", "④", "⑤"], "a": 3, "e": "주어진 문장의 This는 '신경 세포가 대부분 다리에 있다'는 앞 문장을 가리키므로 ③에 들어가야 한다.", "p": ""}, {"id": "EN-126", "s": "영어", "t": "수능", "g": 2, "d": "상", "q": "(A), (B), (C)의 각 네모 안에서 문맥에 맞는 낱말로 가장 적절한 것은?<div class='box'>When food is wasted, all the water and energy used to grow it are (A) [saved / wasted] too. Food in landfills produces methane, a gas much more (B) [powerful / harmless] than carbon dioxide. People can (C) [reduce / increase] waste by planning meals.</div>", "c": ["wasted - harmless - reduce", "wasted - powerful - reduce", "saved - powerful - increase", "saved - harmless - reduce", "wasted - powerful - increase"], "a": 2, "e": "음식을 버리면 물과 에너지도 낭비되고(wasted), 메테인은 이산화 탄소보다 강력한(powerful) 온실가스이며, 식단 계획으로 쓰레기를 줄일(reduce) 수 있다.", "p": ""}, {"id": "EN-127", "s": "영어", "t": "수능", "g": 2, "d": "상", "q": "다음 글의 밑줄 친 부분 중, 어법상 <u>틀린</u> 것은?<div class='box'>In the past, maps ① <u>were drawn</u> by hand. Explorers measured distances by ② <u>counting</u> their steps. Today, satellites send detailed images, ③ <u>which</u> allow digital maps to be updated quickly. A map is still a choice about what to show and what ④ <u>leaving</u> out, and every map reflects the purpose of the person who ⑤ <u>made</u> it.</div>", "c": ["①", "②", "③", "④", "⑤"], "a": 4, "e": "what to show와 병렬을 이루어야 하므로 what to leave out이 되어야 한다.", "p": ""}, {"id": "EN-128", "s": "영어", "t": "수능", "g": 2, "d": "상", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?<div class='box'>In the past, maps were drawn by hand, and making one could take years.<br>(A) With this information, digital maps can be updated in minutes.<br>(B) Yet a map is still a choice about what to show and what to leave out.<br>(C) Today, satellites circle the Earth and send detailed images every day.</div>", "c": ["(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "a": 4, "e": "과거의 지도 → (C) 오늘날 위성이 이미지를 보냄 → (A) 이 정보로 지도를 빠르게 갱신 → (B) 그래도 지도는 선택이라는 점은 변하지 않음의 순서이다.", "p": ""}, {"id": "EN-129", "s": "영어", "t": "단편", "g": 3, "d": "하", "q": "다음 단어의 뜻으로 알맞은 것은? <b>frequently</b>", "c": ["자주", "드물게", "결코", "갑자기", "천천히"], "a": 1, "e": "frequently는 '자주, 빈번하게'라는 뜻이다. rarely는 '드물게'이다.", "p": ""}, {"id": "EN-130", "s": "영어", "t": "단편", "g": 3, "d": "하", "q": "다음 단어의 뜻으로 알맞은 것은? <b>volunteer</b>", "c": ["방문객", "자원봉사자", "경쟁자", "관객", "승객"], "a": 2, "e": "volunteer는 '자원봉사자; 자원하다'라는 뜻이다.", "p": ""}, {"id": "EN-131", "s": "영어", "t": "단편", "g": 3, "d": "하", "q": "다음 단어의 반의어로 알맞은 것은? <b>accept</b>", "c": ["receive", "refuse", "agree", "allow", "admit"], "a": 2, "e": "accept(받아들이다)의 반의어는 refuse(거절하다)이다.", "p": ""}, {"id": "EN-132", "s": "영어", "t": "단편", "g": 3, "d": "하", "q": "다음 단어와 의미가 가장 가까운 것은? <b>protect</b>", "c": ["attack", "destroy", "damage", "harm", "defend"], "a": 5, "e": "protect와 defend는 '보호하다, 지키다'라는 뜻이다.", "p": ""}, {"id": "EN-133", "s": "영어", "t": "단편", "g": 3, "d": "하", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>This is the ______ movie I have ever seen.", "c": ["good", "better", "well", "most good", "best"], "a": 5, "e": "'the + 최상급 + I have ever p.p.'는 '지금까지 ~한 것 중 가장 …한'이라는 뜻이다. good의 최상급은 best이다.", "p": ""}, {"id": "EN-134", "s": "영어", "t": "단편", "g": 3, "d": "하", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>He has studied English ______ five years.", "c": ["for", "since", "during", "in", "at"], "a": 1, "e": "현재완료와 함께 기간(five years)을 나타낼 때는 for, 시작 시점을 나타낼 때는 since를 쓴다.", "p": ""}, {"id": "EN-135", "s": "영어", "t": "단편", "g": 3, "d": "하", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>I'm sorry, but I can't go. I ______ visit my grandmother this weekend.", "c": ["has to", "must to", "having to", "had to be", "have to"], "a": 5, "e": "'~해야 한다'는 have to를 쓰며, 주어가 I이므로 have to가 알맞다.", "p": ""}, {"id": "EN-136", "s": "영어", "t": "단편", "g": 3, "d": "하", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>The children enjoyed ______ in the snow.", "c": ["to play", "playing", "play", "played", "plays"], "a": 2, "e": "enjoy는 동명사를 목적어로 취한다.", "p": ""}, {"id": "EN-137", "s": "영어", "t": "수능", "g": 3, "d": "하", "q": "다음 글의 요지로 가장 적절한 것은?", "c": ["재능은 태어날 때 모두 정해진다.", "연습은 편안할수록 효과가 크다.", "약점보다 강점만 연습해야 한다.", "체스는 음악보다 어렵다.", "재능보다 의도적인 연습이 전문가를 만든다."], "a": 5, "e": "전문가를 다른 사람과 구별하는 것은 타고난 재능만이 아니라 오랜 기간의 의도적인 연습이라는 내용이다.", "p": "It is tempting to believe that talent is something people are simply born with. However, studies of top performers in music, sports, and chess show that what separates experts from others is not natural gift alone, but years of deliberate practice. Deliberate practice is different from simply repeating an activity. It involves setting specific goals just beyond one's current ability, getting immediate feedback, and focusing on weaknesses rather than strengths. Such practice is often uncomfortable, which is exactly why few people are willing to do it."}, {"id": "EN-138", "s": "영어", "t": "수능", "g": 3, "d": "하", "q": "다음 글에서 설명하는 'anchoring'의 예로 가장 적절한 것은?", "c": ["필요한 물건의 목록을 미리 적어 가서 산다.", "여러 가게의 가격을 비교한 뒤 산다.", "품질 후기를 꼼꼼히 읽고 산다.", "할인과 관계없이 필요한 물건만 산다.", "원래 10만 원이던 운동화가 6만 원이라는 말에 필요 없는데도 산다."], "a": 5, "e": "처음 본 가격(10만 원)을 기준으로 삼아 실제 지불하는 금액보다 '아낀 돈'에 주목하는 것이 anchoring이다.", "p": "When we buy something on sale, we often feel that we have saved money. But stores know that a 'sale' sign can make people buy things they did not plan to buy. If a shirt originally priced at $50 is marked down to $30, we focus on the $20 we 'saved' rather than the $30 we actually spent. This tendency to judge a price by comparing it with the first number we see is called anchoring. Smart shoppers ask a different question: 'Would I buy this if it had always cost $30?'"}, {"id": "EN-139", "s": "영어", "t": "수능", "g": 3, "d": "하", "q": "다음 방송의 목적으로 가장 적절한 것은?<div class='box'>Good morning, students. This is your vice principal. Because of the heavy snow last night, the school bus will arrive 30 minutes late this afternoon. Students who take the bus should wait in the library until 4:30. Please be careful on the icy paths. Thank you.</div>", "c": ["폭설로 인한 스쿨버스 지연을 알리려고", "도서관 이용 시간을 바꾸려고", "눈사람 만들기 대회를 알리려고", "수업 시간 변경을 공지하려고", "새 스쿨버스 노선을 안내하려고"], "a": 1, "e": "폭설 때문에 오후 스쿨버스가 30분 늦게 도착한다는 것을 알리는 방송이다.", "p": ""}, {"id": "EN-140", "s": "영어", "t": "수능", "g": 3, "d": "하", "q": "다음 대화의 빈칸에 들어갈 말로 가장 적절한 것은?<div class='box'>A: I'm thinking of joining the school band. What do you think?<br>B: ________ You play the guitar really well.<br>A: Thanks! I'll sign up today.</div>", "c": ["I don't think you should.", "I can't play any instrument.", "The band practice is boring.", "That's a great idea!", "Let me think about it later."], "a": 4, "e": "뒤에 기타를 잘 친다고 칭찬하고, A가 오늘 신청하겠다고 하므로 찬성하는 말이 알맞다.", "p": ""}, {"id": "EN-141", "s": "영어", "t": "단편", "g": 3, "d": "중", "q": "다음 단어의 뜻으로 알맞은 것은? <b>sustainable</b>", "c": ["일시적인", "위험한", "비싼", "인공적인", "지속 가능한"], "a": 5, "e": "sustainable은 '지속 가능한'이라는 뜻이다. temporary는 '일시적인'이다.", "p": ""}, {"id": "EN-142", "s": "영어", "t": "단편", "g": 3, "d": "중", "q": "다음 단어와 의미가 가장 가까운 것은? <b>crucial</b>", "c": ["minor", "essential", "optional", "casual", "visible"], "a": 2, "e": "crucial과 essential은 '매우 중요한, 필수적인'이라는 뜻이다.", "p": ""}, {"id": "EN-143", "s": "영어", "t": "단편", "g": 3, "d": "중", "q": "다음 단어의 반의어로 알맞은 것은? <b>permanent</b>", "c": ["constant", "temporary", "eternal", "stable", "lasting"], "a": 2, "e": "permanent(영구적인)의 반의어는 temporary(일시적인)이다.", "p": ""}, {"id": "EN-144", "s": "영어", "t": "단편", "g": 3, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>______ he is very young, he can speak three languages.", "c": ["Because", "Unless", "Although", "If", "Since"], "a": 3, "e": "어린데도 3개 언어를 한다는 양보의 의미이므로 Although(비록 ~이지만)가 알맞다.", "p": ""}, {"id": "EN-145", "s": "영어", "t": "단편", "g": 3, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>I had my bike ______ yesterday.", "c": ["repair", "repairing", "repaired", "to repair", "repairs"], "a": 3, "e": "'have + 목적어 + p.p.'는 '~을 …되게 하다(시키다)'라는 뜻이다. 자전거는 수리'되는' 것이므로 과거분사를 쓴다.", "p": ""}, {"id": "EN-146", "s": "영어", "t": "단편", "g": 3, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>Neither my brother nor I ______ going to the party.", "c": ["is", "are", "be", "were", "am"], "a": 5, "e": "'neither A nor B'가 주어일 때 동사는 B(I)에 일치시키므로 am이 알맞다.", "p": ""}, {"id": "EN-147", "s": "영어", "t": "단편", "g": 3, "d": "중", "q": "다음 중 어법상 <u>틀린</u> 문장은?", "c": ["She has lived here since she was a child.", "Tell me what you want.", "I wonder if it will rain.", "Do you know who broke the window?", "I didn't know where did he live."], "a": 5, "e": "간접 의문문은 '의문사 + 주어 + 동사' 어순이므로 where he lived가 맞다.", "p": ""}, {"id": "EN-148", "s": "영어", "t": "수능", "g": 3, "d": "중", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?<div class='box'>Bee decline has several connected causes: the loss of wildflowers, certain pesticides, and diseases. Because these causes are linked, there is no single solution. Protecting bees therefore requires ________.</div>", "c": ["a ban on all flowers", "action on many fronts", "fewer farmers", "moving bees to cities only", "waiting for nature to recover"], "a": 2, "e": "원인이 서로 얽혀 있으므로 여러 방면의 노력이 필요하다는 흐름이다.", "p": ""}, {"id": "EN-149", "s": "영어", "t": "수능", "g": 3, "d": "중", "q": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 <u>않은</u> 것은?<div class='box'>Too much information can ① <u>harm</u> decisions. When we face too many options, we become ② <u>tired</u> and confused. Good decision makers do not try to know ③ <u>everything</u>. They first decide which few factors matter most and then ④ <u>ignore</u> the information related to those factors. This helps them make ⑤ <u>clearer</u> choices.</div>", "c": ["①", "②", "③", "④", "⑤"], "a": 4, "e": "좋은 결정자는 중요한 요소와 관련된 정보에 '집중'하므로 ignore가 아니라 focus on이 되어야 한다.", "p": ""}, {"id": "EN-150", "s": "영어", "t": "수능", "g": 3, "d": "중", "q": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class='box'><b>In one study, hospital patients whose rooms faced a garden recovered faster than those whose rooms faced a brick wall.</b><br>Have you ever noticed that you feel calmer after a walk in the park? ( ① ) Scientists have found that spending time in green spaces lowers stress. ( ② ) Even looking at trees through a window can make a difference. ( ③ ) So the next time you feel stressed, try stepping outside. ( ④ ) A few minutes with nature can change your whole day. ( ⑤ )</div>", "c": ["①", "②", "③", "④", "⑤"], "a": 3, "e": "창밖으로 나무를 보기만 해도 효과가 있다는 문장 뒤에, 그 예로 정원 쪽 병실 환자의 연구가 이어지는 것이 자연스럽다.", "p": ""}, {"id": "EN-151", "s": "영어", "t": "단편", "g": 3, "d": "상", "q": "다음 단어의 뜻으로 알맞은 것은? <b>inevitable</b>", "c": ["보이지 않는", "피할 수 없는", "믿을 수 없는", "견딜 수 없는", "잊을 수 없는"], "a": 2, "e": "inevitable은 '피할 수 없는, 필연적인'이라는 뜻이다.", "p": ""}, {"id": "EN-152", "s": "영어", "t": "단편", "g": 3, "d": "상", "q": "다음 단어와 의미가 가장 가까운 것은? <b>scrutinize</b>", "c": ["examine closely", "ignore", "praise", "summarize", "accept quickly"], "a": 1, "e": "scrutinize는 '면밀히 조사하다'라는 뜻이다.", "p": ""}, {"id": "EN-153", "s": "영어", "t": "단편", "g": 3, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>Were I in your position, I ______ the offer.", "c": ["will accept", "accept", "accepted", "have accepted", "would accept"], "a": 5, "e": "If I were in your position에서 if가 생략되고 도치된 가정법 과거이므로 주절에 would + 동사원형을 쓴다.", "p": ""}, {"id": "EN-154", "s": "영어", "t": "단편", "g": 3, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?<br>The professor, ______ lectures are always popular, retired last year.", "c": ["who", "whom", "which", "that", "whose"], "a": 5, "e": "선행사 The professor와 lectures가 소유 관계이므로 소유격 관계대명사 whose를 쓴다. 계속적 용법에는 that을 쓸 수 없다.", "p": ""}, {"id": "EN-155", "s": "영어", "t": "수능", "g": 3, "d": "상", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "c": ["everyone finds it easy to begin", "talent becomes unnecessary", "few people are willing to do it", "experts avoid feedback", "beginners improve faster than experts"], "a": 3, "e": "의도적인 연습은 불편하기 때문에 기꺼이 하려는 사람이 적고, 그래서 전문가가 드물다는 흐름이다.", "p": "It is tempting to believe that talent is something people are simply born with. However, studies of top performers in music, sports, and chess show that what separates experts from others is not natural gift alone, but years of deliberate practice. Deliberate practice is different from simply repeating an activity. It involves setting specific goals just beyond one's current ability, getting immediate feedback, and focusing on weaknesses rather than strengths. Such practice is often uncomfortable, which is exactly why ________."}, {"id": "EN-156", "s": "영어", "t": "수능", "g": 3, "d": "상", "q": "다음 글의 밑줄 친 부분 중, 어법상 <u>틀린</u> 것은?<div class='box'>It is tempting ① <u>to believe</u> that talent is something people are born with. However, studies show that ② <u>what</u> separates experts from others is years of deliberate practice. Deliberate practice involves ③ <u>setting</u> specific goals, getting feedback, and ④ <u>focus</u> on weaknesses. Such practice is often uncomfortable, ⑤ <u>which</u> is why few people do it.</div>", "c": ["①", "②", "③", "④", "⑤"], "a": 4, "e": "involves의 목적어인 동명사 setting, getting과 병렬을 이루어야 하므로 focusing이 되어야 한다.", "p": ""}, {"id": "EN-157", "s": "영어", "t": "수능", "g": 3, "d": "상", "q": "(A), (B), (C)의 각 네모 안에서 문맥에 맞는 낱말로 가장 적절한 것은?<div class='box'>Interleaving forces students to (A) [choose / repeat] a strategy for each problem. This makes studying feel (B) [easier / harder] at the moment, but it (C) [improves / weakens] long-term memory.</div>", "c": ["choose - easier - improves", "repeat - harder - weakens", "repeat - easier - improves", "choose - harder - weakens", "choose - harder - improves"], "a": 5, "e": "문제를 섞으면 문제마다 전략을 골라야(choose) 하고, 그 순간에는 더 어렵게(harder) 느껴지지만 장기 기억을 향상시킨다(improves).", "p": ""}, {"id": "EN-158", "s": "영어", "t": "수능", "g": 3, "d": "상", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?<div class='box'>It is tempting to believe that talent is something people are simply born with.<br>(A) Deliberate practice, however, is different from simply repeating an activity.<br>(B) It involves setting goals just beyond one's ability and focusing on weaknesses.<br>(C) But studies of top performers show that years of deliberate practice separate experts from others.</div>", "c": ["(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "a": 4, "e": "재능은 타고난다는 믿음 → (C) 그러나 연구는 의도적 연습이 핵심임을 보여 줌 → (A) 의도적 연습은 단순 반복과 다름 → (B) 그 구체적 내용의 순서이다.", "p": ""}, {"id": "EN-159", "s": "영어", "t": "수능", "g": 1, "d": "하", "q": "다음 글의 목적으로 가장 적절한 것은?", "c": ["도서 기증을 요청하려고", "도서관 휴관 일정을 안내하려고", "새 열람실 개관을 홍보하려고", "연체료 납부를 독촉하려고", "도서관 봉사자를 모집하려고"], "a": 2, "e": "도서관이 바닥 공사로 3월 4일부터 8일까지 문을 닫는다는 것을 알리는 글이다.", "p": "Dear Students,\nPlease note that the school library will be closed from March 4 to March 8 because new floors are being installed. During this period, you will not be able to borrow or return books. Due dates for all borrowed books will be extended to March 15. We apologize for any inconvenience.\nThe Library Staff"}, {"id": "EN-160", "s": "영어", "t": "수능", "g": 1, "d": "중", "q": "다음 도표의 내용과 일치하지 <u>않는</u> 것은?<div class='tblwrap'><table class='tbl'><caption>How Students Get to School (%)</caption><thead><tr><th>Means</th><th>2016</th><th>2026</th></tr></thead><tbody><tr><td>Walking</td><td>45</td><td>30</td></tr><tr><td>Bus</td><td>30</td><td>35</td></tr><tr><td>Bicycle</td><td>10</td><td>20</td></tr><tr><td>Car</td><td>15</td><td>15</td></tr></tbody></table></div>", "c": ["In 2016, walking was the most common way to get to school.", "The percentage of students who took the bus increased from 2016 to 2026.", "The percentage of students who rode a bicycle doubled from 2016 to 2026.", "The percentage of students who came by car stayed the same.", "In 2026, walking was more popular than taking the bus."], "a": 5, "e": "2026년에 걷기는 30%, 버스는 35%이므로 걷기가 버스보다 인기가 많았다는 ⑤는 도표와 일치하지 않는다.", "p": ""}, {"id": "EN-161", "s": "영어", "t": "수능", "g": 1, "d": "중", "q": "다음 글에서 필자가 주장하는 바로 가장 적절한 것은?", "c": ["실수를 숨기지 말고 배움의 기회로 삼아야 한다.", "실수를 하지 않도록 늘 조심해야 한다.", "다른 사람의 실수를 지적해 주어야 한다.", "실수를 줄이려면 혼자 공부해야 한다.", "실수한 과목은 포기하는 것이 낫다."], "a": 1, "e": "실수를 숨기려 하지 말고 무엇이 잘못되었는지 살펴 배우는 기회로 삼으라는 주장이다.", "p": "Many students feel embarrassed when they make mistakes, so they try to hide them. But mistakes are some of the best teachers we have. When you look closely at what went wrong, you understand the problem more deeply than if you had gotten it right the first time. So instead of hiding your mistakes, write them down, think about why they happened, and use them to grow."}, {"id": "EN-162", "s": "영어", "t": "수능", "g": 1, "d": "중", "q": "다음 글의 내용과 일치하는 것은?", "c": ["황제펭귄은 여름에 알을 낳는다.", "암컷 황제펭귄이 알을 품는다.", "수컷은 알을 품는 동안 자주 먹이를 먹는다.", "펭귄은 북극에만 산다.", "펭귄은 날지 못하지만 헤엄을 잘 친다."], "a": 5, "e": "Penguins cannot fly, but they are excellent swimmers라고 하였다. 황제펭귄은 겨울에 알을 낳고, 수컷이 약 두 달 동안 먹지 않고 알을 품으며, 펭귄은 주로 남반구에 산다.", "p": "Penguins cannot fly, but they are excellent swimmers. Most penguins live in the Southern Hemisphere. Emperor penguins lay their eggs in the middle of the cold Antarctic winter. After the female lays an egg, the male keeps it warm on his feet for about two months without eating anything, while the female goes to the sea to find food."}, {"id": "EN-163", "s": "영어", "t": "수능", "g": 1, "d": "상", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "c": ["what we can do", "what we cannot see", "how much we earn", "where we were born", "who our friends are"], "a": 1, "e": "통제할 수 없는 일(날씨, 타인의 말)에 매달리지 말고 우리가 할 수 있는 일에 집중하라는 흐름이다.", "p": "We often waste our energy worrying about things we cannot control, such as the weather or what other people think of us. This only makes us anxious and tired. A wiser approach is to separate the things we can change from the things we cannot. We cannot stop the rain, but we can bring an umbrella. Happiness grows when we focus on ________."}, {"id": "EN-164", "s": "영어", "t": "수능", "g": 1, "d": "상", "q": "다음 글의 제목으로 가장 적절한 것은?", "c": ["How to Stop Yawning in Class", "Yawning: A Sign of Illness", "Animals That Never Yawn", "Why Yawning Is Contagious", "The Best Time to Sleep"], "a": 4, "e": "남이 하품하는 것을 보면 따라 하품하게 되는 까닭(공감과 관련된 뇌 작용)을 설명하므로 제목은 '하품은 왜 전염되는가'가 알맞다.", "p": "Have you ever yawned right after seeing someone else yawn? This happens to about half of all adults. Scientists believe that contagious yawning is connected to empathy, our ability to understand other people's feelings. Studies show that people are more likely to yawn after seeing a family member or friend yawn than after seeing a stranger do it. Interestingly, young children under the age of four rarely catch yawns, perhaps because their empathy skills are still developing."}, {"id": "EN-165", "s": "영어", "t": "수능", "g": 1, "d": "상", "q": "다음 글의 밑줄 친 부분 중, 어법상 <u>틀린</u> 것은?", "c": ["①", "②", "③", "④", "⑤"], "a": 2, "e": "주어 One of the oldest board games는 단수(One)이므로 동사는 is가 되어야 한다.", "p": "Board games have a long history. ① <u>Played</u> by people thousands of years ago, they were a way to relax and to practice thinking skills. One of the oldest board games ② <u>are</u> the Royal Game of Ur, which was found in a tomb in ancient Mesopotamia. Its rules were lost for centuries until a scholar ③ <u>discovered</u> a clay tablet ④ <u>explaining</u> how to play. Today, people can enjoy the game again, ⑤ <u>thanks to</u> his work."}, {"id": "EN-166", "s": "영어", "t": "수능", "g": 2, "d": "하", "q": "다음 글에 드러난 'I'의 심경 변화로 가장 적절한 것은?", "c": ["excited → bored", "calm → angry", "proud → ashamed", "worried → relieved", "hopeful → disappointed"], "a": 4, "e": "강아지가 사라져 걱정했다가(worried), 이웃집 마당에서 찾아 안도했다(relieved).", "p": "When I got home, the back gate was open and Max was gone. My heart started pounding. I ran down the street, calling his name again and again, but there was no answer. Just as I was about to cry, I heard a familiar bark from the neighbor's yard. There was Max, happily chewing a ball. I hugged him tightly and let out a long breath."}, {"id": "EN-167", "s": "영어", "t": "수능", "g": 2, "d": "하", "q": "다음 도표의 내용과 일치하지 <u>않는</u> 것은?<div class='tblwrap'><table class='tbl'><caption>Hours Spent on Hobbies per Week</caption><thead><tr><th>Hobby</th><th>Teens</th><th>Adults</th></tr></thead><tbody><tr><td>Gaming</td><td>8</td><td>3</td></tr><tr><td>Reading</td><td>2</td><td>4</td></tr><tr><td>Exercise</td><td>4</td><td>4</td></tr><tr><td>Music</td><td>5</td><td>2</td></tr></tbody></table></div>", "c": ["Teens spent more time on gaming than on any other hobby.", "Adults spent more time reading than teens did.", "Teens and adults spent the same amount of time exercising.", "Teens spent more than twice as many hours on music as adults.", "Adults spent the most time on gaming among the four hobbies."], "a": 5, "e": "어른은 독서와 운동(각 4시간)에 가장 많은 시간을 썼고, 게임은 3시간이므로 ⑤는 일치하지 않는다.", "p": ""}, {"id": "EN-168", "s": "영어", "t": "수능", "g": 2, "d": "중", "q": "다음 글의 요지로 가장 적절한 것은?", "c": ["휴식 시간을 줄여야 성과가 오른다.", "잘 쉬는 것도 생산성을 높이는 중요한 일이다.", "긴 휴가는 업무 능력을 떨어뜨린다.", "일과 휴식은 서로 관련이 없다.", "휴식은 주말에만 해야 한다."], "a": 2, "e": "휴식이 뇌를 회복시켜 창의성과 생산성을 높이므로, 잘 쉬는 것도 일의 일부라는 내용이다.", "p": "Many people think that resting is a waste of time. They feel guilty when they are not working. However, research shows that short breaks during the day help the brain recover and improve both creativity and productivity. Workers who take regular
