<style>

    --bon-brand: #a5b4fc;
    --bon-c-plan: #7aa2ff; --bon-c-jinhak: #b79bff; --bon-c-gg: #4fc3dc; --bon-c-news: #4ade80; --bon-c-book: #fb923c; --bon-c-matrix: #f472b6;
    --bon-shadow: none; --bon-shadow-hover: 0 14px 32px rgba(0,0,0,.45); } }
:root[data-theme="dark"] { --bon-bg: #0f1216; --bon-card: #171b21; --bon-soft: #222831;
    --bon-text: #f3f4f6; --bon-body: #d1d5db; --bon-muted: #9ca3af; --bon-line: #2a3039;
    --bon-brand: #a5b4fc;
    --bon-c-plan: #7aa2ff; --bon-c-jinhak: #b79bff; --bon-c-gg: #4fc3dc; --bon-c-news: #4ade80; --bon-c-book: #fb923c; --bon-c-matrix: #f472b6;
    --bon-shadow: none; --bon-shadow-hover: 0 14px 32px rgba(0,0,0,.45); }
:where(*, *::before, *::after) { box-sizing: border-box; }

.bon-tag.is-plain { color: var(--bon-muted); background: transparent; border: 1px solid var(--bon-line); }

</style>
<style>
/* 봉일천고 진로진학부 공통 스타일(/assets/site.css)의 --bon-* 값을 그대로 쓴다. 이 사이트 고유색만 여기서 정한다. */
:root {
  --accent: #a16207; --on-accent: #ffffff;
  --ok: #15803d; --bad: #b91c1c;
  --bon-accent: var(--accent);
  --bg: var(--bon-bg); --card: var(--bon-card); --soft: var(--bon-soft); --text: var(--bon-text);
  --body: var(--bon-body); --muted: var(--bon-muted); --line: var(--bon-line);
  --radius: var(--bon-radius); --shadow: var(--bon-shadow);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --accent: #facc15; --on-accent: #1c1917; --ok: #4ade80; --bad: #f87171; color-scheme: dark; }
}
:root[data-theme="dark"] { --accent: #facc15; --on-accent: #1c1917; --ok: #4ade80; --bad: #f87171; color-scheme: dark; }

body { background: var(--bg); color: var(--body); }
h1, h2, h3 { color: var(--text); text-wrap: balance; }
.bon-bar { --bon-max: 860px; }
.bon-bar-in, .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 860px; margin: 0 auto; }
.stack { display: grid; gap: 22px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 머리 */
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 14px 0 0; padding: 0; list-style: none; font-size: .92rem; color: var(--muted); }
.stats b { color: var(--text); font-weight: 800; font-size: 1.05rem; font-variant-numeric: tabular-nums; margin-right: 3px; }
.stats li:first-child b { color: var(--accent); }

/* 설정 화면 */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; display: grid; gap: 18px; min-width: 0; }
.group { display: grid; gap: 8px; min-width: 0; }
.lbl { font-size: .82rem; font-weight: 600; color: var(--muted); }
.lbl small { font-weight: 400; }
.types { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.type-card { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 2px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); transition: border-color .18s ease, background .18s ease; }
.type-card strong { color: var(--text); font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; }
.type-card span { color: var(--muted); font-size: .88rem; }
.type-card .n { color: var(--accent); font-weight: 700; font-size: .82rem; font-variant-numeric: tabular-nums; }
.type-card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.type-card[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--card)); box-shadow: inset 0 0 0 1px var(--accent); }
.type-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 5px 13px; font-size: .9rem; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.chip small { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .7; }
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.startbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; }
.count { font-variant-numeric: tabular-nums; }
.count b { color: var(--accent); font-size: 1.15rem; font-weight: 800; }
.btn { border: 0; border-radius: 10px; padding: 10px 20px; font-weight: 700; background: var(--accent); color: var(--on-accent); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.ghost { background: var(--card); color: var(--text); border: 1px solid var(--line); font-weight: 600; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* 문제 화면 */
.qhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 22px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.lv-상 { --bon-accent: var(--bad); }
.lv-하 { --bon-accent: var(--ok); }
.progress { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .9rem; font-weight: 600; }
.meter { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
.passage { background: var(--soft); border-radius: 12px; padding: 16px 18px; white-space: pre-line; line-height: 1.85; color: var(--text); }
.passage .src { display: block; text-align: right; color: var(--muted); font-size: .85rem; }
.qtext { font-size: 1.08rem; font-weight: 600; color: var(--text); white-space: pre-line; min-width: 0; }
.qtext .num { color: var(--accent); font-weight: 800; margin-right: 6px; font-variant-numeric: tabular-nums; }
.box { border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 10px 14px; margin: 8px 0 4px; font-weight: 400; font-size: .97rem; line-height: 1.75; white-space: normal; color: var(--body); }
.passage .box { margin: 0 0 10px; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .82em; line-height: 1.15; margin: 0 2px; }
.fr span:first-child { border-bottom: 1px solid currentColor; padding: 0 2px; }
.choices { display: grid; gap: 8px; }
.choice { display: flex; align-items: flex-start; gap: 12px; text-align: left; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; color: var(--text); transition: border-color .18s ease, background .18s ease; }
.choice:hover:not(:disabled) { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.choice .bub { flex: none; width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; color: var(--muted); font-size: .85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.choice .txt { padding-top: 1px; min-width: 0; }
.choice[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--card)); }
.choice[aria-checked="true"] .bub { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.choice.correct { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--card)); }
.choice.correct .bub { background: var(--ok); border-color: var(--ok); color: var(--card); }
.choice.wrong { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--card)); }
.choice.wrong .bub { background: var(--bad); border-color: var(--bad); color: var(--card); }
.choice:disabled { cursor: default; }
.explain { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 6px; }
.verdict { font-weight: 800; font-size: 1.05rem; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.explain p { margin: 0; }

body.in-quiz .bon-header { display: none; }

/* '이 문제 이상해요' 제보: 문제 카드 오른쪽 위에 작게, 접어 둔다 */
.report { background: var(--soft); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
.report strong { color: var(--text); }
.report p { margin: 0; font-size: .86rem; color: var(--muted); }
.report textarea { width: 100%; min-height: 72px; resize: vertical; padding: 8px 12px; font: inherit; font-size: .95rem; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); }
.report textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
.report .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.report .status { min-height: 1.4em; color: var(--ok); font-weight: 600; }
.report .status.err { color: var(--bad); }

/* 결과 화면 */
.score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding-top: 26px; }
.score .big { font-size: 3rem; font-weight: 800; letter-spacing: -0.035em; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1; }
.score .sub { color: var(--muted); }
.brow { display: grid; grid-template-columns: 6.5em 1fr 4em; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; }
.brow .track { height: 10px; background: var(--soft); border-radius: 5px; overflow: hidden; }
.brow .track i { display: block; height: 100%; background: var(--ok); border-radius: 5px; }
.brow span:last-child { text-align: right; color: var(--muted); font-size: .9rem; }
.review { display: grid; gap: 10px; }
.review details { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.review summary { cursor: pointer; font-weight: 600; color: var(--text); }
.review .ans { margin: 8px 0 0; color: var(--muted); font-size: .95rem; }
.review .passage { margin-top: 10px; }

@media (max-width: 640px) {
  .types { grid-template-columns: minmax(0, 1fr); }
  .row3 { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .panel { padding: 16px 14px; }
  .brow { grid-template-columns: 5.5em 1fr 3.5em; }
}

/* 모드 선택 */
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mode-card { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 4px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); box-shadow: var(--shadow); transition: border-color .18s ease, background .18s ease; }
.mode-card strong { color: var(--text); font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; }
.mode-card span { color: var(--muted); font-size: .9rem; }
.mode-card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.mode-card[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--card)); box-shadow: inset 0 0 0 1px var(--accent); }
.mode-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bell-rule { margin: 0; color: var(--body); line-height: 1.7; }
.best { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .92rem; }
.best b { color: var(--accent); }

/* 시간 표시 줄 (문제 화면 맨 위에 붙어 있음) */
.timebar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  padding: 10px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.timebar .t { display: flex; gap: 16px; font-size: .92rem; color: var(--muted); }
.timebar .t b { color: var(--text); font-weight: 800; font-size: 1.02rem; margin-left: 4px; }
.timebar .t .cur b { color: var(--accent); }
.timebar .mode { font-weight: 800; color: var(--text); }

/* 문제 카드 오른쪽 위의 제보 */
.qcard { position: relative; }
.flag { position: absolute; top: 10px; right: 12px; z-index: 2; max-width: calc(100% - 24px); }
.flag > summary { list-style: none; cursor: pointer; font-size: .78rem; color: var(--muted); padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); white-space: nowrap; margin-left: auto; width: max-content; }
.flag > summary::-webkit-details-marker { display: none; }
.flag > summary:hover { color: var(--text); }
.flag > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.flag[open] { left: 12px; }
.flag[open] > summary { color: var(--text); }
.flag .report { margin-top: 8px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.qcard > .passage:first-of-type, .qcard > .qtext:first-of-type { margin-top: 18px; }

/* 그림·도표 */
.fig { margin: 8px 0 4px; display: grid; justify-items: center; gap: 4px; }
.fig svg { max-width: 100%; height: auto; color: var(--text); }
.fig figcaption { font-size: .82rem; color: var(--muted); }
.tbl { border-collapse: collapse; margin: 8px auto 4px; font-size: .92rem; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 5px 10px; text-align: center; }
.tbl th { background: var(--soft); color: var(--text); font-weight: 700; }
.tblwrap { overflow-x: auto; max-width: 100%; }
.ptime { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }

@media (max-width: 640px) { .modes { grid-template-columns: minmax(0, 1fr); } .timebar .t { gap: 10px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
const BANK = [{"id": "KO-001", "s": "국어", "t": "단편", "g": 1, "d": "하", "q": "다음 중 이중 모음은?", "c": ["ㅑ", "ㅏ", "ㅔ", "ㅚ", "ㅡ"], "a": 1, "e": "표준어의 단모음은 ㅏ, ㅐ, ㅓ, ㅔ, ㅗ, ㅚ, ㅜ, ㅟ, ㅡ, ㅣ의 10개이다. ㅑ는 반모음 [j]와 ㅏ가 결합한 이중 모음이다. (ㅚ, ㅟ는 이중 모음으로 발음하는 것도 허용된다.)", "p": ""}, {"id": "KO-002", "s": "국어", "t": "단편", "g": 1, "d": "중", "q": "다음 중 음운 변동의 유형이 나머지와 <u>다른</u> 하나는?", "c": ["국물[궁물]", "좋고[조코]", "굳이[구지]", "신라[실라]", "밭[받]"], "a": 2, "e": "국물(비음화), 굳이(구개음화), 신라(유음화), 밭(음절의 끝소리 규칙)은 모두 한 음운이 다른 음운으로 바뀌는 '교체'이다. 좋고[조코]는 ㅎ과 ㄱ이 합쳐져 ㅋ이 되는 거센소리되기로 '축약'이다.", "p": ""}, {"id": "KO-003", "s": "국어", "t": "단편", "g": 1, "d": "하", "q": "'새 옷을 샀다.'에서 '새'의 품사는?", "c": ["명사", "형용사", "부사", "접사", "관형사"], "a": 5, "e": "'새'는 체언 '옷'을 꾸며 주며 활용하지 않으므로 관형사이다. 형용사라면 '새로운'처럼 어미가 붙어 활용한다.", "p": ""}, {"id": "KO-004", "s": "국어", "t": "단편", "g": 2, "d": "중", "q": "다음 중 피동 표현이 쓰인 문장은?", "c": ["엄마가 아이에게 밥을 먹였다.", "그가 나를 웃겼다.", "나는 창문을 열었다.", "동생이 책을 읽었다.", "문이 바람에 열렸다."], "a": 5, "e": "'열리다'는 '열다'에 피동 접미사 '-리-'가 붙어 주어가 다른 힘에 의해 동작을 당함을 나타낸다. '먹였다', '웃겼다'는 사동 표현이다.", "p": ""}, {"id": "KO-005", "s": "국어", "t": "단편", "g": 2, "d": "중", "q": "다음 중 객체 높임 표현이 쓰인 문장은?", "c": ["나는 할머니께 선물을 드렸다.", "선생님께서 교실로 오신다.", "할아버지께서 진지를 잡수신다.", "아버지께서 댁에 계신다.", "어머니, 어서 식사하세요."], "a": 1, "e": "객체 높임은 문장의 목적어나 부사어가 가리키는 대상을 높이는 것으로, '드리다, 모시다, 여쭙다, 뵙다' 같은 특수 어휘와 조사 '께'를 쓴다. 나머지는 주체 높임이 중심인 문장이다.", "p": ""}, {"id": "KO-006", "s": "국어", "t": "단편", "g": 1, "d": "하", "q": "시에서 시 속에 등장하여 말하는 사람을 가리키는 용어는?", "c": ["서술자", "청자", "작가", "주인공", "화자"], "a": 5, "e": "시에서 말하는 이를 '화자(시적 화자)'라고 한다. 작가와 구별되는 개념이며, 소설에서 이야기를 전달하는 이는 '서술자'라고 한다.", "p": ""}, {"id": "KO-007", "s": "국어", "t": "단편", "g": 1, "d": "중", "q": "'내 마음은 호수요'에 쓰인 표현 방법은?", "c": ["직유법", "은유법", "의인법", "대유법", "반어법"], "a": 2, "e": "'~같이, ~처럼' 같은 연결어 없이 'A는 B이다' 형식으로 원관념(마음)을 보조 관념(호수)에 빗댄 은유법이다.", "p": ""}, {"id": "KO-008", "s": "국어", "t": "단편", "g": 2, "d": "중", "q": "작품 속 '나'가 자신의 이야기를 직접 들려주는 소설의 시점은?", "c": ["1인칭 관찰자 시점", "3인칭 관찰자 시점", "전지적 작가 시점", "2인칭 시점", "1인칭 주인공 시점"], "a": 5, "e": "주인공인 '나'가 자신의 경험과 내면을 직접 서술하면 1인칭 주인공 시점이다. '나'가 다른 인물의 이야기를 전하면 1인칭 관찰자 시점이 된다.", "p": ""}, {"id": "KO-009", "s": "국어", "t": "단편", "g": 3, "d": "상", "q": "3장 6구 45자 내외로 이루어지고, 종장의 첫 음보가 세 음절로 고정된 갈래는?", "c": ["향가", "고려 가요", "가사", "평시조", "경기체가"], "a": 4, "e": "평시조는 초장·중장·종장의 3장 구성이며 종장 첫 음보는 3음절로 고정된다. 가사는 4음보 연속체로 길이 제한이 없고, 향가는 향찰로 표기된 신라·고려 초의 노래이다.", "p": ""}, {"id": "KO-010", "s": "국어", "t": "단편", "g": 2, "d": "중", "q": "다음 중 한글 맞춤법에 맞게 쓴 문장은?", "c": ["어떻게 된 일인지 모르겠다.", "왠일로 일찍 왔니?", "몇일 뒤에 다시 만나자.", "소문이 금새 퍼졌다.", "내가 먼저 연락할께."], "a": 1, "e": "'어떻게'는 '어떠하게'의 준말로 바른 표기이다. 나머지는 각각 '웬일', '며칠', '금세', '연락할게'로 써야 한다.", "p": ""}, {"id": "KO-011", "s": "국어", "t": "단편", "g": 3, "d": "상", "q": "다음 중 표준 발음이 <u>옳지 않은</u> 것은?", "c": ["넓죽하다[널쭈카다]", "밟다[밥ː따]", "읽고[일꼬]", "맑다[막따]", "앉다[안따]"], "a": 1, "e": "겹받침 'ㄼ'은 대체로 [ㄹ]로 발음하지만 '밟-'과 '넓죽하다, 넓둥글다'의 '넓-'은 [ㅂ]으로 발음한다. 따라서 넓죽하다는 [넙쭈카다]가 표준 발음이다.", "p": ""}, {"id": "KO-012", "s": "국어", "t": "단편", "g": 1, "d": "중", "q": "'철수는 착한 학생이 되었다.'에서 '학생이'의 문장 성분은?", "c": ["주어", "목적어", "부사어", "관형어", "보어"], "a": 5, "e": "서술어 '되다, 아니다' 앞에서 조사 '이/가'와 결합하여 문장을 완성하는 필수 성분은 보어이다.", "p": ""}, {"id": "KO-013", "s": "국어", "t": "단편", "g": 2, "d": "상", "q": "훈민정음 초성(자음) 제자 원리에서 기본자가 <u>아닌</u> 것은?", "c": ["ㄱ", "ㄴ", "ㅁ", "ㄷ", "ㅅ"], "a": 4, "e": "초성의 기본자는 발음 기관을 본뜬 ㄱ, ㄴ, ㅁ, ㅅ, ㅇ의 다섯 자이다. ㄷ은 ㄴ에 획을 더한 가획자이다.", "p": ""}, {"id": "KO-014", "s": "국어", "t": "단편", "g": 3, "d": "중", "q": "한자 성어 '각주구검(刻舟求劍)'의 뜻으로 가장 적절한 것은?", "c": ["융통성 없이 낡은 방식만 고집하는 어리석음", "어려움을 참고 견디어 끝내 뜻을 이룸", "남의 의견을 귀담아듣지 않음", "작은 것을 탐하다 큰 것을 잃음", "겉과 속이 서로 다름"], "a": 1, "e": "배에서 칼을 떨어뜨리고 배에 표시를 해 두었다가 나중에 그 자리에서 칼을 찾으려 했다는 고사에서 나온 말로, 상황 변화를 모르고 융통성 없이 구는 어리석음을 뜻한다.", "p": ""}, {"id": "KO-015", "s": "국어", "t": "단편", "g": 1, "d": "하", "q": "다음 중 '서술자가 인물의 내면까지 모두 알고 서술하는' 시점은?", "c": ["1인칭 관찰자 시점", "3인칭 관찰자 시점", "1인칭 주인공 시점", "제한적 관찰 시점", "전지적 작가 시점"], "a": 5, "e": "작품 밖 서술자가 모든 인물의 심리와 사건을 알고 서술하는 시점은 전지적 작가 시점이다. 3인칭 관찰자 시점은 인물의 외부 행동만 객관적으로 전달한다.", "p": ""}, {"id": "KO-016", "s": "국어", "t": "단편", "g": 2, "d": "하", "q": "다음 중 '표준어'가 <u>아닌</u> 것은?", "c": ["설거지", "웃어른", "깡총깡총", "오뚝이", "멋쟁이"], "a": 3, "e": "모음 조화가 무너진 형태를 표준어로 삼아 '깡충깡충'이 표준어이다. '설거지, 웃어른, 오뚝이, 멋쟁이'는 모두 표준어이다.", "p": ""}, {"id": "KO-017", "s": "국어", "t": "수능", "g": 2, "d": "중", "q": "윗글의 내용과 일치하는 것은?", "c": ["가용성 휴리스틱은 판단에 드는 시간과 노력을 줄여 준다.", "가용성 휴리스틱은 통계 자료를 꼼꼼히 분석하는 판단 방식이다.", "드문 사건일수록 사람들은 그 확률을 실제보다 낮게 평가한다.", "가용성 휴리스틱은 어떤 상황에서도 오류를 낳지 않는다.", "대중 매체의 보도는 사람들의 확률 판단에 영향을 주지 않는다."], "a": 1, "e": "2문단에서 '이러한 판단 방식은 시간과 노력을 아껴 준다는 장점이 있다'고 하였다. 드물지만 강렬한 사건은 쉽게 떠오르므로 오히려 과대평가되기 쉬우며, 대중 매체 노출도 오류의 원인으로 제시되었다.", "p": "사람들은 어떤 사건이 일어날 확률을 판단할 때 실제 통계를 따져 보기보다 관련 사례가 얼마나 쉽게 떠오르는지에 의존하는 경향이 있다. 이를 <b>가용성 휴리스틱</b>이라 한다. 예컨대 비행기 사고 보도를 접한 직후에는 비행기 여행이 자동차 여행보다 위험하다고 느끼기 쉽다. 사고 장면이 생생하게 기억에 남아 쉽게 떠오르기 때문이다.\n이러한 판단 방식은 시간과 노력을 아껴 준다는 장점이 있다. 일상의 많은 결정은 정밀한 계산 없이도 대체로 무난한 결과로 이어지기 때문이다. 그러나 떠올리기 쉬운 정도가 실제 빈도와 어긋날 때, 즉 드물지만 강렬한 사건이나 대중 매체에 자주 노출된 사건을 판단할 때에는 체계적인 오류가 생긴다. 따라서 중요한 결정을 내릴 때에는 자신의 직관이 어떤 기억에 기대고 있는지 점검하고, 가능하다면 객관적인 자료와 대조해 보는 태도가 필요하다."}, {"id": "KO-018", "s": "국어", "t": "수능", "g": 2, "d": "중", "q": "윗글의 내용과 일치하지 <u>않는</u> 것은?", "c": ["대기 중 탄소의 대부분은 탄소-12이다.", "살아 있는 생물의 체내 탄소-14 비율은 대기와 거의 같다.", "생물이 죽으면 체내 탄소-14의 양은 줄어들기만 한다.", "이 방법으로 돌로 만든 도끼 자체의 제작 시기를 직접 측정할 수 있다.", "아주 오래된 시료는 탄소-14가 거의 남지 않아 측정이 어렵다."], "a": 4, "e": "윗글은 이 방법이 '한때 생물이었던 물질에만' 적용된다고 하였다. 돌은 생물이 아니므로 돌도끼 자체의 연대는 이 방법으로 직접 측정할 수 없다.", "p": "생물은 살아 있는 동안 호흡과 먹이 섭취를 통해 탄소를 끊임없이 받아들인다. 대기 중 탄소의 대부분은 탄소-12이지만, 극히 일부는 방사성 동위 원소인 탄소-14이다. 생물이 살아 있는 동안에는 체내 탄소-14의 비율이 대기와 거의 같게 유지된다. 그러나 생물이 죽으면 더 이상 탄소를 받아들이지 못하므로 체내의 탄소-14는 붕괴하여 줄어들기만 한다.\n탄소-14는 약 5730년이 지나면 그 양이 처음의 절반으로 줄어드는데, 이 기간을 <b>반감기</b>라고 한다. 따라서 유물에 남아 있는 탄소-14의 비율을 측정하면 그 생물이 죽은 뒤 얼마나 시간이 흘렀는지 추정할 수 있다. 다만 이 방법은 한때 생물이었던 물질에만 적용할 수 있으며, 시간이 너무 오래 지나 탄소-14가 거의 남지 않은 시료는 측정이 어렵다. 일반적으로 약 5만 년보다 오래된 시료에는 이 방법을 적용하기 어렵다."}, {"id": "KO-019", "s": "국어", "t": "수능", "g": 2, "d": "중", "q": "윗글의 표현상 특징으로 가장 적절한 것은?", "c": ["색채 대비를 통해 선명한 시각적 이미지를 만들고 있다.", "사물에 사람의 속성을 부여하여 대상의 모습을 드러내고 있다.", "명령형 어조를 사용하여 독자의 행동을 촉구하고 있다.", "계절의 변화에 따라 시상을 전개하고 있다.", "반어적 표현을 통해 화자의 분노를 드러내고 있다."], "a": 2, "e": "가로등이 '혼자 깨어 있다', '말없이 제 빛을 거두어들인다'처럼 사람처럼 표현되어 있으므로 의인법이 쓰였다. 시상은 계절이 아니라 밤에서 새벽으로 이어지는 시간의 흐름을 따른다.", "p": "골목 끝 가로등은\n밤마다 혼자 깨어 있다\n\n아무도 묻지 않는 길을\n한 뼘씩 밝혀 두고\n\n새벽이 오면 말없이\n제 빛을 거두어들인다\n\n나는 오늘도 그 아래를 지나며\n누군가의 늦은 귀가를 생각한다\n<span class='src'>(창작 시)</span>"}, {"id": "KO-020", "s": "국어", "t": "수능", "g": 3, "d": "상", "q": "&lt;보기&gt;의 탐구 결과로 가장 적절한 것은?\n<div class='box'>&lt;보기&gt; '부엌일'은 [부엉닐]로 발음된다. 이 과정에서 일어난 음운 변동의 유형을 정리해 보자.</div>", "c": ["교체만 일어났다.", "교체와 첨가가 일어났다.", "교체와 탈락이 일어났다.", "축약과 첨가가 일어났다.", "탈락과 첨가가 일어났다."], "a": 2, "e": "'부엌'의 ㅋ이 음절의 끝소리 규칙으로 [ㄱ]이 되고(교체), 합성어에서 뒷말 '일' 앞에 ㄴ이 덧붙고(첨가), [ㄱ]이 [ㄴ] 앞에서 [ㅇ]으로 바뀐다(비음화, 교체). 따라서 교체와 첨가가 일어났다.", "p": ""}, {"id": "KO-021", "s": "국어", "t": "수능", "g": 2, "d": "중", "q": "&lt;보기&gt;의 ㄱ~ㄹ에 대한 설명으로 옳은 것만을 있는 대로 고른 것은?\n<div class='box'>ㄱ. 나는 그가 범인임을 알았다.<br>ㄴ. 그는 소리도 없이 다가왔다.<br>ㄷ. 내가 읽은 책은 재미있다.<br>ㄹ. 코끼리는 코가 길다.</div>\n(가) ㄱ에는 명사절이 안겨 있다.  (나) ㄴ에는 부사절이 안겨 있다.  (다) ㄷ에는 관형절이 안겨 있다.  (라) ㄹ은 홑문장이다.", "c": ["(가), (나)", "(나), (라)", "(가), (나), (다)", "(가), (다), (라)", "(가), (나), (다), (라)"], "a": 3, "e": "ㄱ '그가 범인임'은 명사절, ㄴ '소리도 없이'는 부사절, ㄷ '내가 읽은'은 관형절이다. ㄹ '코가 길다'는 서술절로 안긴문장이므로 홑문장이 아니라 겹문장이다.", "p": ""}, {"id": "KO-022", "s": "국어", "t": "수능", "g": 1, "d": "하", "q": "윗글에 사용된 말하기 전략으로 가장 적절한 것은?", "c": ["전문가의 말을 인용하여 주장의 권위를 높이고 있다.", "반대 의견을 소개하고 이를 하나씩 반박하고 있다.", "개인적인 실패 경험을 고백하여 공감을 얻고 있다.", "청중에게 질문을 던져 관심을 유도하며 말을 시작하고 있다.", "여러 나라의 사례를 비교하여 문제의 심각성을 강조하고 있다."], "a": 4, "e": "'몇 개쯤 될까요?'라는 질문으로 시작하여 청중의 관심을 끌고 있다. 발표자가 직접 관찰한 자료와 사진을 활용했지만 전문가 인용이나 반론 제시는 없다.", "p": "여러분, 하루에 우리 학교에서 버려지는 일회용 컵이 몇 개쯤 될까요? 저는 지난주 일주일 동안 매점 앞 분리수거함을 직접 살펴보았습니다. 그 결과 하루 평균 100개가 넘는 컵이 버려지고 있었습니다. 이 사진을 보시면, 분리수거함이 가득 차서 바닥까지 컵이 쌓여 있는 것을 확인할 수 있습니다. 개인 컵 하나만 가지고 다녀도 이 숫자는 크게 줄어듭니다. 내일부터 저와 함께 개인 컵 사용을 시작해 보는 건 어떨까요?"}, {"id": "KO-023", "s": "국어", "t": "단편", "g": 1, "d": "상", "q": "'하늘이 맑다.'를 형태소로 나눌 때, 형태소의 개수는?", "c": ["2개", "3개", "4개", "5개", "6개"], "a": 3, "e": "'하늘 / 이 / 맑- / -다'의 4개로 나뉜다. 형태소는 뜻을 가진 가장 작은 말의 단위로, 조사와 어미도 각각 하나의 형태소이다.", "p": ""}, {"id": "KO-024", "s": "국어", "t": "단편", "g": 1, "d": "상", "q": "밑줄 친 말에 쓰인 접미사의 기능이 나머지와 <u>다른</u> 하나는?", "c": ["엄마가 아이에게 밥을 <u>먹였다</u>.", "형이 동생을 <u>웃겼다</u>.", "선생님이 목소리를 <u>낮추었다</u>.", "도둑이 경찰에게 <u>잡혔다</u>.", "누나가 나를 <u>깨웠다</u>."], "a": 4, "e": "'잡히다'의 '-히-'는 주어가 동작을 당함을 나타내는 피동 접미사이다. 나머지 '먹이다, 웃기다, 낮추다, 깨우다'는 남에게 동작을 하게 하는 사동 접미사가 쓰였다.", "p": ""}, {"id": "KO-025", "s": "국어", "t": "단편", "g": 1, "d": "상", "q": "다음 중 중간 단계가 없어 한쪽을 부정하면 다른 쪽이 되는 '상보 반의어'의 짝은?", "c": ["길다 – 짧다", "살다 – 죽다", "덥다 – 춥다", "사다 – 팔다", "위 – 아래"], "a": 2, "e": "'살다–죽다'는 중간 상태가 없는 상보 반의어이다. '길다–짧다', '덥다–춥다'는 중간 단계가 있는 정도(등급) 반의어, '사다–팔다', '위–아래'는 방향 반의어이다.", "p": ""}, {"id": "KO-026", "s": "국어", "t": "단편", "g": 2, "d": "하", "q": "글쓴이가 자신의 체험과 생각을 일정한 형식에 얽매이지 않고 자유롭게 쓴 산문 갈래는?", "c": ["수필", "소설", "희곡", "시조", "가사"], "a": 1, "e": "수필은 형식이 자유롭고 글쓴이의 개성이 잘 드러나는 산문이다. 소설은 허구의 이야기, 희곡은 공연을 위한 대본이다.", "p": ""}, {"id": "KO-027", "s": "국어", "t": "단편", "g": 2, "d": "하", "q": "다음 중 모양이나 움직임을 흉내 낸 말(의태어)은?", "c": ["멍멍", "쨍그랑", "살금살금", "딸랑딸랑", "꼬끼오"], "a": 3, "e": "'살금살금'은 남이 모르게 조심스럽게 움직이는 모양을 흉내 낸 의태어이다. 나머지는 소리를 흉내 낸 의성어이다.", "p": ""}, {"id": "KO-028", "s": "국어", "t": "단편", "g": 2, "d": "하", "q": "'할머니께서 책을 읽으<u>시</u>었다.'에서 밑줄 친 '-시-'가 높이는 대상은?", "c": ["문장의 목적어", "말을 듣는 사람", "말하는 사람", "문장의 주어", "문장의 부사어"], "a": 4, "e": "선어말 어미 '-(으)시-'는 문장의 주어(할머니)를 높이는 주체 높임법을 실현한다.", "p": ""}, {"id": "KO-029", "s": "국어", "t": "단편", "g": 2, "d": "중", "q": "다음 중 외래어 표기가 바른 것은?", "c": ["케익", "초콜렛", "메세지", "악세사리", "주스"], "a": 5, "e": "'주스'가 바른 표기이다. 나머지는 각각 '케이크, 초콜릿, 메시지, 액세서리'로 적어야 한다.", "p": ""}, {"id": "KO-030", "s": "국어", "t": "단편", "g": 2, "d": "상", "q": "훈민정음 서문의 '어린 百姓(백성)이 니르고져 홇 배 이셔도'에서 '어린'의 당시 의미는?", "c": ["어리석은", "나이가 적은", "불쌍한", "가난한", "착한"], "a": 1, "e": "중세 국어에서 '어리다'는 '어리석다'는 뜻이었다. 오늘날에는 '나이가 적다'는 뜻으로 의미가 이동하였다.", "p": ""}, {"id": "KO-031", "s": "국어", "t": "단편", "g": 2, "d": "상", "q": "월명사의 '제망매가'에 대한 설명으로 옳은 것은?", "c": ["죽은 누이를 추모하는 10구체 향가이다.", "임금의 덕을 기리는 경기체가이다.", "자연 속의 삶을 노래한 평시조이다.", "남녀 간의 사랑을 노래한 고려 가요이다.", "농사일의 즐거움을 노래한 가사이다."], "a": 1, "e": "'제망매가'는 신라의 승려 월명사가 죽은 누이의 명복을 빌며 지은 10구체 향가로, 삶과 죽음에 대한 슬픔을 종교적으로 승화하였다.", "p": ""}, {"id": "KO-032", "s": "국어", "t": "단편", "g": 2, "d": "상", "q": "다음 중 중의적으로 해석되지 <u>않는</u> 문장은?", "c": ["예쁜 친구의 동생을 만났다.", "나는 형과 아우를 찾아다녔다.", "학생들이 다 오지 않았다.", "그는 나보다 축구를 더 좋아한다.", "나는 어제 도서관에서 책을 읽었다."], "a": 5, "e": "①은 '예쁜'이 친구를 꾸미는지 동생을 꾸미는지, ②는 '나와 형이 함께' 찾는지 '형과 아우 둘 다'를 찾는지, ③은 전체 부정인지 부분 부정인지, ④는 비교 대상이 '나'인지 '내가 축구를 좋아하는 정도'인지 모호하다.", "p": ""}, {"id": "KO-033", "s": "국어", "t": "단편", "g": 2, "d": "상", "q": "다음 중 사이시옷 표기가 바른 것은?", "c": ["갯수", "촛점", "댓가", "햇님", "등굣길"], "a": 5, "e": "'등굣길(登校+길)'은 한자어와 고유어의 합성어로 뒷말의 첫소리가 된소리로 나므로 사이시옷을 적는다. '개수, 초점, 대가'는 한자어끼리의 결합이라 적지 않고, '해님'은 '-님'이 접미사인 파생어라 적지 않는다.", "p": ""}, {"id": "KO-034", "s": "국어", "t": "단편", "g": 3, "d": "하", "q": "속담 '소 잃고 외양간 고친다'의 뜻으로 알맞은 것은?", "c": ["작은 것이라도 모이면 큰 것이 된다.", "쉬운 일이라도 협력하면 더 쉽다.", "말을 조심해야 한다.", "일이 이미 잘못된 뒤에는 손을 써도 소용이 없다.", "아무리 급해도 순서를 지켜야 한다."], "a": 4, "e": "소를 도둑맞은 뒤에야 빈 외양간을 고친다는 뜻으로, 일이 잘못된 뒤에 뒤늦게 대책을 세워도 소용이 없음을 이르는 말이다.", "p": ""}, {"id": "KO-035", "s": "국어", "t": "단편", "g": 3, "d": "하", "q": "다음 중 판소리계 소설이 <u>아닌</u> 것은?", "c": ["춘향전", "심청전", "흥부전", "토끼전", "구운몽"], "a": 5, "e": "'구운몽'은 김만중이 지은 몽자류(꿈 구조) 소설이다. 나머지는 판소리 사설이 소설로 정착한 판소리계 소설이다.", "p": ""}, {"id": "KO-036", "s": "국어", "t": "단편", "g": 3, "d": "하", "q": "논설문을 쓰는 주된 목적은?", "c": ["정보를 있는 그대로 전달하기 위해", "개인의 감정을 표현하기 위해", "독자와 친교를 맺기 위해", "독자를 설득하기 위해", "재미있는 이야기를 꾸며 내기 위해"], "a": 4, "e": "논설문은 어떤 문제에 대한 글쓴이의 주장을 근거를 들어 논리적으로 펼쳐 독자를 설득하는 글이다.", "p": ""}, {"id": "KO-037", "s": "국어", "t": "단편", "g": 3, "d": "하", "q": "국어의 음절 끝(받침)에서 발음될 수 있는 일곱 자음에 해당하지 <u>않는</u> 것은?", "c": ["ㄱ", "ㄴ", "ㄹ", "ㅅ", "ㅇ"], "a": 4, "e": "음절의 끝소리 규칙에 따라 받침에서는 ㄱ, ㄴ, ㄷ, ㄹ, ㅁ, ㅂ, ㅇ의 7개 자음만 발음된다. 받침 ㅅ은 [ㄷ]으로 발음된다(예: 옷[옫]).", "p": ""}, {"id": "KO-038", "s": "국어", "t": "단편", "g": 3, "d": "중", "q": "밑줄 친 조사가 보조사인 것은?", "c": ["하늘<u>이</u> 맑다.", "나는 책<u>을</u> 읽었다.", "너<u>만</u> 오너라.", "학교<u>에서</u> 만나자.", "친구<u>의</u> 가방이다."], "a": 3, "e": "'만'은 '한정'의 뜻을 더해 주는 보조사이다. '이'(주격), '을'(목적격), '에서'(부사격), '의'(관형격)는 문장 성분의 자격을 나타내는 격 조사이다.", "p": ""}, {"id": "KO-039", "s": "국어", "t": "단편", "g": 3, "d": "중", "q": "김소월의 '진달래꽃'에 대한 설명으로 옳은 것은?", "c": ["도시 문명을 비판하는 모더니즘 시이다.", "일제에 대한 직접적인 저항을 노래한다.", "전통적인 3음보의 민요적 율격을 지닌다.", "행과 연의 구분이 없는 산문시이다.", "남성적이고 강인한 어조가 두드러진다."], "a": 3, "e": "'진달래꽃'은 7·5조, 3음보의 민요적 율격과 여성적 어조로 이별의 정한을 노래한 작품이다. '죽어도 아니 눈물 흘리우리다'에는 반어적 표현이 쓰였다.", "p": ""}, {"id": "KO-040", "s": "국어", "t": "단편", "g": 3, "d": "중", "q": "한자 성어 '온고지신(溫故知新)'의 뜻으로 알맞은 것은?", "c": ["같은 처지의 사람끼리 서로 동정함", "쓴 것이 다하면 단 것이 옴", "스승보다 제자가 나음", "옛것을 익혀 새것을 앎", "눈앞의 이익에 어두워 의리를 잊음"], "a": 4, "e": "'옛것을 익히고 그것을 미루어 새것을 안다'는 뜻이다. 나머지는 차례로 동병상련, 고진감래, 청출어람, 견리망의의 뜻이다.", "p": ""}, {"id": "KO-041", "s": "국어", "t": "단편", "g": 3, "d": "상", "q": "훈민정음 중성(모음)의 기본자 'ㆍ, ㅡ, ㅣ'를 만든 원리는?", "c": ["발음 기관의 모양을 본떴다.", "기본자에 획을 더하였다.", "기본자를 나란히 써서 만들었다.", "하늘·땅·사람의 모양을 본떴다.", "한자의 모양을 간략하게 줄였다."], "a": 4, "e": "중성의 기본자는 하늘(ㆍ), 땅(ㅡ), 사람(ㅣ)의 모양을 본뜬 상형의 원리로 만들었다. 발음 기관을 본뜬 것은 초성의 기본자이다.", "p": ""}, {"id": "KO-042", "s": "국어", "t": "단편", "g": 3, "d": "상", "q": "다음 중 활용할 때 어간과 어미의 형태가 규칙적으로 유지되는 용언은?", "c": ["(소리를) 듣다", "(집을) 짓다", "(손을) 씻다", "(일을) 돕다", "(물이) 흐르다"], "a": 3, "e": "'씻다'는 '씻어, 씻으니'로 규칙 활용한다. '듣다→들어'(ㄷ 불규칙), '짓다→지어'(ㅅ 불규칙), '돕다→도와'(ㅂ 불규칙), '흐르다→흘러'(르 불규칙)는 불규칙 활용이다.", "p": ""}, {"id": "KO-043", "s": "국어", "t": "수능", "g": 1, "d": "하", "q": "윗글의 내용과 일치하는 것은?", "c": ["에빙하우스는 의미 있는 문장을 외워 실험하였다.", "시간이 지날수록 잊는 속도가 점점 빨라진다.", "복습은 망각을 늦추는 데 효과가 없다.", "한 번에 몰아서 복습할 때 기억이 가장 오래 유지된다.", "망각은 학습 직후에 가장 빠르게 일어난다."], "a": 5, "e": "1문단에서 '망각은 학습 직후에 가장 빠르게 일어나고, 시간이 지날수록 잊는 속도가 점차 느려진다'고 하였다.", "p": "독일의 심리학자 에빙하우스는 의미 없는 철자들을 외운 뒤, 시간이 지남에 따라 얼마나 잊어버리는지를 스스로 실험하였다. 그 결과 망각은 학습 직후에 가장 빠르게 일어나고, 시간이 지날수록 잊는 속도가 점차 느려진다는 사실을 발견하였다. 이를 그래프로 나타낸 것이 <b>망각 곡선</b>이다.\n망각을 늦추는 가장 효과적인 방법은 복습이다. 특히 한 번에 몰아서 여러 번 반복하는 것보다 일정한 간격을 두고 나누어 복습할 때 기억이 더 오래 유지된다. 복습할 때마다 기억이 다시 강화되어 잊어버리는 속도가 이전보다 느려지기 때문이다."}, {"id": "KO-044", "s": "국어", "t": "수능", "g": 1, "d": "하", "q": "윗글의 화자가 처한 상황으로 가장 적절한 것은?", "c": ["친구들과 함께 운동장에서 공을 차고 있다.", "해 질 무렵 운동장을 떠나고 있다.", "잃어버린 공을 찾아 헤매고 있다.", "비 오는 날 빈 운동장을 바라보고 있다.", "비가 그치기를 기다리며 교실에서 공부하고 있다."], "a": 4, "e": "'빈 운동장에 비가 내린다', '오늘은 빗소리만 운동장을 가득 채운다'에서 화자가 비 내리는 빈 운동장을 바라보고 있음을 알 수 있다.", "p": "빈 운동장에 비가 내린다\n아무도 차지 않는 공이\n골대 옆에서 젖고 있다\n\n어제는 저 공 하나를 두고\n우리는 해가 지도록 소리쳤는데\n\n오늘은 빗소리만\n운동장을 가득 채운다\n<span class='src'>(창작 시)</span>"}, {"id": "KO-045", "s": "국어", "t": "수능", "g": 2, "d": "하", "q": "윗글의 내용과 일치하는 것은?", "c": ["백신을 접종하면 몸속의 기억 세포가 사라진다.", "백신을 맞으면 실제 병원체가 침입해도 항체가 만들어지지 않는다.", "집단 면역은 백신을 맞은 사람만 보호한다.", "영유아는 누구나 모든 백신을 맞을 수 있다.", "백신은 약하게 만든 병원체나 병원체의 일부를 이용해 만든다."], "a": 5, "e": "첫 문장에서 백신은 '병원체를 약하게 만들거나 병원체의 일부만을 이용해 만든 물질'이라고 하였다.", "p": "백신은 병원체를 약하게 만들거나 병원체의 일부만을 이용해 만든 물질이다. 백신을 접종하면 우리 몸의 면역 체계는 이를 실제 병원체처럼 인식하여 항체를 만들고, 그 병원체의 특징을 기억하는 기억 세포를 남긴다. 이후 실제 병원체가 침입하면 기억 세포가 빠르게 반응하여 많은 양의 항체를 신속히 만들어 내므로, 병에 걸리지 않거나 가볍게 앓고 지나갈 수 있다.\n한편 많은 사람이 면역을 갖추면 병원체가 사람에서 사람으로 옮겨 가기 어려워진다. 그 결과 백신을 맞을 수 없는 영유아나 환자도 간접적으로 보호받게 되는데, 이를 <b>집단 면역</b>이라고 한다."}, {"id": "KO-046", "s": "국어", "t": "수능", "g": 2, "d": "하", "q": "윗글에 드러난 화자의 정서로 가장 적절한 것은?", "c": ["자연 속에서 느끼는 한가로움", "세월의 흐름에 대한 허무함", "임금에 대한 변함없는 충성", "임에 대한 그리움과 기다림", "가난한 삶에 대한 한탄"], "a": 4, "e": "임이 없는 긴 겨울밤을 잘라 두었다가 임이 오신 날 밤에 펼치겠다는 발상에서, 임을 그리워하며 함께할 시간을 기다리는 마음이 드러난다.", "p": "동짓달 기나긴 밤을 한 허리를 베어 내어\n춘풍 이불 아래 서리서리 넣었다가\n어론 님 오신 날 밤이어든 굽이굽이 펴리라\n<span class='src'>- 황진이의 시조 (현대어 표기)</span>"}, {"id": "KO-047", "s": "국어", "t": "수능", "g": 2, "d": "하", "q": "윗글을 쓴 목적으로 가장 적절한 것은?", "c": ["도서부 신입 부원을 모집하려고", "도서관에 새 책을 신청하려고", "사서 선생님께 감사를 전하려고", "수업 시간 단축을 요청하려고", "도서관 운영 시간 연장을 건의하려고"], "a": 5, "e": "'도서관 운영 시간을 오후 6시까지 연장해 주시기를 건의드립니다.'에 글의 목적이 드러나 있다.", "p": "교장 선생님께.\n저는 2학년 김하늘입니다. 우리 학교 도서관은 오후 4시 30분에 문을 닫습니다. 그런데 수업이 4시 20분에 끝나기 때문에 학생들이 책을 빌리거나 읽을 시간이 거의 없습니다. 제가 2학년 학생 120명에게 물어보았더니 90명이 '이용 시간이 부족하다'고 답했습니다.\n도서관 운영 시간을 오후 6시까지 연장해 주시기를 건의드립니다. 운영 시간이 늘어나면 학생들의 독서량이 늘고, 방과 후에 조용히 공부할 공간도 생길 것입니다. 사서 선생님의 부담이 걱정된다면 도서부 학생들이 교대로 대출 업무를 돕겠습니다."}, {"id": "KO-048", "s": "국어", "t": "수능", "g": 3, "d": "하", "q": "윗글의 내용과 일치하는 것은?", "c": ["쌀이나 소금 같은 생활필수품은 일반적으로 비탄력적이다.", "대체재가 많은 상품은 일반적으로 비탄력적이다.", "탄력성은 가격의 변화율을 수요량의 변화율로 나눈 값이다.", "판매 수입은 가격에서 판매량을 뺀 값이다.", "사치품은 가격이 변해도 수요량이 거의 변하지 않는다."], "a": 1, "e": "1문단에서 '쌀이나 소금 같은 생활필수품은 비탄력적'이라고 하였다. 탄력성은 수요량의 변화율을 가격의 변화율로 나눈 값이고, 판매 수입은 가격에 판매량을 곱한 값이다.", "p": "어떤 상품의 가격이 변할 때 수요량이 얼마나 민감하게 변하는지를 나타내는 지표를 <b>수요의 가격 탄력성</b>이라고 한다. 이는 수요량의 변화율을 가격의 변화율로 나눈 값의 절댓값으로 구한다. 이 값이 1보다 크면 '탄력적', 1보다 작으면 '비탄력적'이라고 한다. 일반적으로 대체재가 많은 상품이나 사치품은 탄력적이고, 쌀이나 소금 같은 생활필수품은 비탄력적이다.\n탄력성은 기업의 판매 수입에도 영향을 준다. 판매 수입은 가격에 판매량을 곱한 값이다. 수요가 탄력적인 상품은 가격을 올리면 수요량이 더 큰 비율로 줄어 판매 수입이 감소한다. 반대로 수요가 비탄력적인 상품은 가격을 올려도 수요량이 조금만 줄어 판매 수입이 증가한다."}, {"id": "KO-049", "s": "국어", "t": "수능", "g": 3, "d": "중", "q": "&lt;보기&gt;의 단어 중 파생어만을 고른 것은?\n<div class='box'>ㄱ. 돌다리　ㄴ. 풋사과　ㄷ. 덮개　ㄹ. 밤낮</div>", "c": ["ㄱ, ㄴ", "ㄱ, ㄹ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "a": 3, "e": "'풋사과'는 접두사 '풋-'과 어근 '사과', '덮개'는 어근 '덮-'과 접미사 '-개'가 결합한 파생어이다. '돌다리(돌+다리)'와 '밤낮(밤+낮)'은 어근끼리 결합한 합성어이다.", "p": ""}, {"id": "KO-050", "s": "국어", "t": "수능", "g": 3, "d": "중", "q": "&lt;보기&gt;의 설명에 해당하는 표현의 예로 가장 적절한 것은?\n<div class='box'>&lt;보기&gt; 반어법은 겉으로 표현한 내용과 속에 담긴 의미를 서로 반대로 나타내어 의미를 강조하는 표현 방법이다.</div>", "c": ["\"내 마음은 호수요.\"", "\"꽃이 나를 보고 웃는다.\"", "\"산이 높고 물이 맑다.\"", "(약속에 한 시간 늦은 친구에게) \"참 일찍도 왔구나.\"", "\"구름처럼 가벼운 발걸음\""], "a": 4, "e": "늦게 온 친구에게 '일찍 왔다'고 말하는 것은 속뜻과 반대로 표현한 반어법이다. 나머지는 차례로 은유법, 의인법, 대구법, 직유법이다.", "p": ""}, {"id": "KO-051", "s": "국어", "t": "수능", "g": 3, "d": "하", "q": "&lt;보기&gt;의 문장을 바르게 고친 것과 그 이유를 옳게 짝지은 것은?\n<div class='box'>&lt;보기&gt; (카페에서 점원이 손님에게) \"손님, 주문하신 커피 나오셨습니다.\"</div>", "c": ["\"커피 나오셨어요.\" - 격식을 낮추어야 하기 때문이다.", "\"커피 나오시겠습니다.\" - 미래의 일이기 때문이다.", "\"커피 나왔다.\" - 손님을 높일 필요가 없기 때문이다.", "\"커피 드셨습니다.\" - 주체를 더 높여야 하기 때문이다.", "\"커피 나왔습니다.\" - 높일 필요가 없는 사물을 높였기 때문이다."], "a": 5, "e": "'-시-'는 문장의 주체를 높이는 말인데, '커피'는 높임의 대상이 아닌 사물이다. 손님은 '주문하신'에서 이미 높였으므로 '커피 나왔습니다'가 바른 표현이다.", "p": ""}, {"id": "KO-052", "s": "국어", "t": "단편", "g": 1, "d": "하", "q": "다음 자음 중 울림소리(유성음)가 <u>아닌</u> 것은?", "c": ["ㄴ", "ㄹ", "ㅁ", "ㅇ", "ㄱ"], "a": 5, "e": "국어의 자음 가운데 울림소리는 ㄴ, ㄹ, ㅁ, ㅇ 네 개이다. ㄱ은 안울림소리이다. 모음은 모두 울림소리이다.", "p": ""}, {"id": "KO-053", "s": "국어", "t": "단편", "g": 1, "d": "하", "q": "'동생이 <u>빨리</u> 달린다.'에서 밑줄 친 '빨리'의 품사는?", "c": ["형용사", "동사", "관형사", "명사", "부사"], "a": 5, "e": "'빨리'는 동사 '달린다'를 꾸며 주는 부사이다. 형용사 '빠르다'와 달리 형태가 변하지 않는다.", "p": ""}, {"id": "KO-054", "s": "국어", "t": "단편", "g": 1, "d": "하", "q": "문장을 이루는 데 꼭 필요한 주성분에 해당하지 <u>않는</u> 것은?", "c": ["주어", "서술어", "부사어", "목적어", "보어"], "a": 3, "e": "주성분은 주어, 서술어, 목적어, 보어이다. 부사어와 관형어는 다른 성분을 꾸며 주는 부속 성분이고, 독립어는 독립 성분이다.", "p": ""}, {"id": "KO-055", "s": "국어", "t": "단편", "g": 1, "d": "하", "q": "다음 중 한자어인 것은?", "c": ["하늘", "바다", "사람", "학교", "구름"], "a": 4, "e": "'학교(學校)'는 한자어이다. 하늘, 바다, 사람, 구름은 예부터 써 온 우리말인 고유어이다.", "p": ""}, {"id": "KO-056", "s": "국어", "t": "단편", "g": 1, "d": "하", "q": "'~처럼', '~같이', '~듯이' 등을 써서 두 대상을 직접 견주어 표현하는 방법은?", "c": ["은유법", "의인법", "반어법", "역설법", "직유법"], "a": 5, "e": "직유법은 '쟁반같이 둥근 달'처럼 연결하는 말을 써서 직접 비유한다. 은유법은 'A는 B이다'의 형식으로 넌지시 비유한다.", "p": ""}, {"id": "KO-057", "s": "국어", "t": "단편", "g": 1, "d": "하", "q": "소설 구성의 3요소를 옳게 묶은 것은?", "c": ["인물, 사건, 배경", "주제, 구성, 문체", "발단, 전개, 결말", "해설, 지문, 대사", "운율, 심상, 주제"], "a": 1, "e": "소설 구성의 3요소는 인물, 사건, 배경이다. 주제, 구성, 문체는 소설의 3요소이고, 해설·지문·대사는 희곡의 요소이다.", "p": ""}, {"id": "KO-058", "s": "국어", "t": "단편", "g": 1, "d": "하", "q": "다음 중 맞춤법에 맞게 쓴 문장은?", "c": ["오늘은 왠지 기분이 좋다.", "오늘은 웬지 기분이 좋다.", "이게 왠 떡이니?", "왠만하면 참아라.", "웬지 모르게 슬프다."], "a": 1, "e": "'왠지'는 '왜인지'의 준말이다. 그 밖의 경우에는 '웬 떡', '웬만하면'처럼 '웬'을 쓴다.", "p": ""}, {"id": "KO-059", "s": "국어", "t": "단편", "g": 1, "d": "하", "q": "속담 '가는 말이 고와야 오는 말이 곱다'의 뜻으로 알맞은 것은?", "c": ["내가 남에게 말과 행동을 좋게 해야 남도 나에게 좋게 한다.", "말을 많이 하면 실수하기 쉽다.", "말은 빨리 퍼지니 조심해야 한다.", "말만 앞세우고 실천하지 않는다.", "아무리 비밀로 해도 말은 새어 나간다."], "a": 1, "e": "상대에게 고운 말을 써야 나도 고운 말을 들을 수 있다는 뜻으로, 말할 때의 배려를 강조하는 속담이다.", "p": ""}, {"id": "KO-060", "s": "국어", "t": "단편", "g": 1, "d": "하", "q": "어떤 논제에 대해 찬성과 반대로 나뉘어 근거를 들며 자기 쪽 주장이 옳음을 밝히는 말하기는?", "c": ["토의", "면담", "발표", "토론", "협상"], "a": 4, "e": "토론은 찬반으로 나뉘어 상대를 설득하는 말하기이고, 토의는 공동의 문제를 해결하기 위해 함께 최선의 방안을 찾는 말하기이다.", "p": ""}, {"id": "KO-061", "s": "국어", "t": "수능", "g": 1, "d": "하", "q": "윗글의 내용과 일치하는 것은?", "c": ["확증 편향은 자신의 믿음과 어긋나는 정보를 더 잘 받아들이는 경향이다.", "믿음에 어긋나는 정보는 믿음에 맞는 정보보다 처리하기 편하다.", "필터 버블은 다양한 생각을 고루 접하게 되는 현상이다.", "추천 알고리즘은 이용자가 자주 본 것과 비슷한 내용을 먼저 보여 준다.", "확증 편향에서 벗어나려면 내 생각과 같은 주장을 더 찾아 읽어야 한다."], "a": 4, "e": "3문단에서 추천 알고리즘이 이용자가 자주 본 것과 비슷한 내용을 먼저 보여 준다고 하였다. 나머지는 모두 글의 내용과 반대이다.", "p": "사람들은 자신이 이미 믿고 있는 것과 일치하는 정보는 쉽게 받아들이고, 어긋나는 정보는 무시하거나 깎아내리는 경향이 있다. 이를 <b>확증 편향</b>이라고 한다. 예를 들어 어떤 가수를 좋아하는 사람은 그 가수를 칭찬하는 기사는 꼼꼼히 읽고 오래 기억하지만, 비판하는 기사는 '악의적인 글'이라며 넘겨 버리기 쉽다.\n확증 편향이 생기는 까닭은 우리 뇌가 에너지를 아끼려 하기 때문이다. 기존의 믿음에 맞는 정보는 따로 따져 볼 필요가 없어 처리하기 편하지만, 믿음에 어긋나는 정보를 받아들이려면 생각을 고쳐야 하는 수고가 든다. 또 자신의 믿음이 틀렸다는 사실을 인정하는 것은 자존심이 상하는 불편한 일이기도 하다.\n문제는 인터넷 환경이 확증 편향을 더욱 키운다는 점이다. 검색 서비스와 누리 소통망은 이용자가 자주 본 것과 비슷한 내용을 먼저 보여 주는 추천 알고리즘을 쓴다. 그 결과 이용자는 자기 생각과 비슷한 정보에만 둘러싸이게 되는데, 이를 '필터 버블'이라고 한다. 확증 편향에서 벗어나려면 내 생각과 다른 주장을 일부러 찾아 읽고, '내가 틀렸다면 어떤 증거가 나올까?'를 스스로 물어보는 습관이 필요하다."}, {"id": "KO-062", "s": "국어", "t": "수능", "g": 1, "d": "하", "q": "윗글의 내용과 일치하는 것은?", "c": ["구급차가 다가올 때 사이렌이 내는 소리 자체가 높아진다.", "진동수가 클수록 높은 소리로 들린다.", "구급차가 멀어지면 소리의 물결 사이 간격이 좁아진다.", "도플러 효과는 소리에서만 나타난다.", "멀어지는 별에서 오는 빛은 파장이 짧아진다."], "a": 2, "e": "1문단에서 진동수가 클수록 높은 소리로 들린다고 하였다. 사이렌이 내는 소리 자체는 변하지 않으며, 멀어지면 물결 간격이 벌어지고, 멀어지는 별의 빛은 파장이 길어진다.", "p": "구급차가 사이렌을 울리며 다가올 때는 소리가 높게 들리다가, 내 앞을 지나 멀어지면 갑자기 낮게 들린다. 사이렌이 내는 소리 자체는 변하지 않았는데 왜 다르게 들릴까? 소리는 공기의 떨림이 물결처럼 퍼져 나가는 파동이다. 1초 동안 떨리는 횟수를 진동수라고 하는데, 진동수가 클수록 높은 소리로 들린다.\n구급차가 관찰자 쪽으로 다가오면, 구급차는 자신이 내보낸 소리의 물결을 뒤쫓아 가면서 다음 물결을 내보내는 셈이 된다. 그래서 관찰자 쪽으로 가는 물결들의 간격, 곧 파장이 짧아진다. 소리의 속력은 일정하므로 파장이 짧아지면 관찰자의 귀에는 1초 동안 더 많은 물결이 도착하여 진동수가 커지고 소리가 높게 들린다. 반대로 구급차가 멀어지면 물결 사이의 간격이 벌어져 소리가 낮게 들린다. 이처럼 파동을 내는 물체와 관찰자의 상대적인 움직임에 따라 진동수가 다르게 관측되는 현상을 <b>도플러 효과</b>라고 한다.\n도플러 효과는 빛에서도 나타난다. 멀어지는 별에서 오는 빛은 파장이 길어져 원래보다 붉은색 쪽으로 치우쳐 보인다. 천문학자들은 이를 이용해 먼 은하들이 우리에게서 멀어지고 있다는 사실, 곧 우주가 팽창하고 있다는 사실을 알아냈다. 도로의 과속 단속 장비도 달리는 자동차에 전파를 쏜 뒤 반사되어 돌아온 전파의 진동수 변화를 재어 속력을 계산한다."}, {"id": "KO-063", "s": "국어", "t": "수능", "g": 1, "d": "하", "q": "(나)에 드러난 화자의 태도로 가장 적절한 것은?", "c": ["어떤 일이 있어도 임을 향한 마음을 바꾸지 않겠다고 다짐하고 있다.", "변해 가는 세상에 맞추어 살겠다고 마음먹고 있다.", "임과 헤어진 슬픔에 잠겨 체념하고 있다.", "자연 속에서 한가롭게 살아가는 삶에 만족하고 있다.", "지난날의 잘못을 뉘우치고 있다."], "a": 1, "e": "(나)의 화자는 백 번을 죽어 뼈가 흙이 되더라도 '임 향한 일편단심'은 변하지 않는다고 하여 굳은 충절을 드러낸다.", "p": "(가)\n이런들 어떠하며 저런들 어떠하리\n만수산 드렁칡이 얽혀진들 어떠하리\n우리도 이같이 얽혀져 백 년까지 누리리라\n<span class='src'>- 이방원의 시조 (현대어 표기)</span>\n\n(나)\n이 몸이 죽고 죽어 일백 번 고쳐 죽어\n백골이 진토 되어 넋이라도 있고 없고\n임 향한 일편단심이야 가실 줄이 있으랴\n<span class='src'>- 정몽주의 시조 (현대어 표기)</span>"}, {"id": "KO-064", "s": "국어", "t": "단편", "g": 1, "d": "중", "q": "'국물'이 [궁물]로 소리 나는 것과 같은 음운 변동이 일어나는 단어는?", "c": ["밥물[밤물]", "굳이[구지]", "좋다[조타]", "신라[실라]", "국밥[국빱]"], "a": 1, "e": "'국물[궁물]'과 '밥물[밤물]'은 비음이 아닌 자음이 비음 앞에서 비음으로 바뀌는 비음화이다. '굳이'는 구개음화, '좋다'는 거센소리되기, '신라'는 유음화, '국밥'은 된소리되기이다.", "p": ""}, {"id": "KO-065", "s": "국어", "t": "단편", "g": 1, "d": "중", "q": "다음 중 구개음화가 일어나는 단어는?", "c": ["먹는", "난로", "입학", "해돋이", "옷"], "a": 4, "e": "구개음화는 받침 ㄷ, ㅌ이 모음 'ㅣ'로 시작하는 형식 형태소를 만나 ㅈ, ㅊ으로 바뀌는 현상이다. '해돋이'는 [해도지]로 발음된다.", "p": ""}, {"id": "KO-066", "s": "국어", "t": "단편", "g": 1, "d": "중", "q": "다음 중 합성어인 것은?", "c": ["풋사과", "맨손", "덮개", "돌다리", "지우개"], "a": 4, "e": "'돌다리'는 어근 '돌'과 '다리'가 결합한 합성어이다. '풋사과', '맨손'은 접두사가, '덮개', '지우개'는 접미사가 붙은 파생어이다.", "p": ""}, {"id": "KO-067", "s": "국어", "t": "단편", "g": 1, "d": "중", "q": "'동생이 과자를 다 먹어 <u>버렸다</u>.'에서 밑줄 친 말에 대한 설명으로 옳은 것은?", "c": ["'물건을 내던지다'라는 뜻의 본용언이다.", "체언을 꾸미는 관형사이다.", "문장의 목적어이다.", "뜻을 더해 주는 조사이다.", "앞말에 '완료'의 뜻을 더해 주는 보조 용언이다."], "a": 5, "e": "'버리다'가 본용언 뒤에 쓰여 그 행동이 이미 끝났음을 나타낼 때는 보조 용언이다.", "p": ""}, {"id": "KO-068", "s": "국어", "t": "단편", "g": 1, "d": "중", "q": "겉으로는 모순되어 보이지만 그 속에 진실을 담고 있는 표현 방법인 '역설법'이 쓰인 것은?", "c": ["내 마음은 촛불이요", "쟁반같이 둥근 달", "찬란한 슬픔의 봄", "꽃이 나를 보고 웃는다", "산은 높고 물은 맑다"], "a": 3, "e": "'찬란한'과 '슬픔'은 함께 쓰기 어려운 말이지만, 이를 결합하여 복합적인 정서를 드러내므로 역설법이다.", "p": ""}, {"id": "KO-069", "s": "국어", "t": "단편", "g": 1, "d": "중", "q": "숙제를 하나도 하지 않은 동생에게 \"참 잘하는 짓이다.\"라고 말할 때 쓰인 표현 방법은?", "c": ["직유법", "과장법", "반어법", "의인법", "대구법"], "a": 3, "e": "반어법은 속마음과 반대로 말하여 뜻을 강조하는 표현 방법이다.", "p": ""}, {"id": "KO-070", "s": "국어", "t": "단편", "g": 1, "d": "중", "q": "다음 중 띄어쓰기가 바른 것은?", "c": ["나도 할 수 있다.", "나도 할수 있다.", "나도 할수있다.", "나 도 할 수 있다.", "나도 할 수있다."], "a": 1, "e": "'수'는 의존 명사이므로 앞말과 띄어 쓴다. 조사 '도'는 앞말에 붙여 쓴다.", "p": ""}, {"id": "KO-071", "s": "국어", "t": "단편", "g": 1, "d": "중", "q": "다음 중 높임 표현이 바르게 쓰인 문장은?", "c": ["교장 선생님의 말씀이 있으시겠습니다.", "교장 선생님의 말씀이 계시겠습니다.", "손님, 주문하신 커피 나오셨습니다.", "할머니, 아버지가 진지 잡수시래.", "이 상품은 품절이십니다."], "a": 1, "e": "높여야 할 대상의 말씀, 신체 등을 높일 때는 '있으시다'를 쓴다(간접 높임). '계시다'는 사람을 직접 높일 때 쓴다. 커피나 상품 같은 사물은 높이지 않는다.", "p": ""}, {"id": "KO-072", "s": "국어", "t": "단편", "g": 1, "d": "중", "q": "한자 성어 '역지사지(易地思之)'의 뜻으로 알맞은 것은?", "c": ["어려운 처지에서 서로 도움", "같은 처지의 사람끼리 가엾게 여김", "자기 처지를 모르고 날뜀", "남의 처지를 이용하여 이익을 얻음", "처지를 바꾸어 생각해 봄"], "a": 5, "e": "역지사지는 상대방의 처지에서 생각해 본다는 뜻이다. 같은 처지끼리 가엾게 여기는 것은 '동병상련'이다.", "p": ""}, {"id": "KO-073", "s": "국어", "t": "수능", "g": 1, "d": "중", "q": "윗글의 화자에 대한 설명으로 가장 적절한 것은?", "c": ["자연의 아름다움을 예찬하며 즐거워하고 있다.", "부끄러움 없는 삶을 살고자 자신을 돌아보며 다짐하고 있다.", "떠나간 임을 원망하며 슬퍼하고 있다.", "현실에 만족하며 여유롭게 살아가고 있다.", "다른 사람의 잘못을 비판하고 있다."], "a": 2, "e": "화자는 '한 점 부끄럼이 없기를' 바라며 괴로워하고, '주어진 길을 걸어가야겠다'고 다짐한다. 자기 성찰과 의지가 드러난다.", "p": "죽는 날까지 하늘을 우러러\n한 점 부끄럼이 없기를,\n잎새에 이는 바람에도\n나는 괴로워했다.\n별을 노래하는 마음으로\n모든 죽어 가는 것을 사랑해야지\n그리고 나한테 주어진 길을\n걸어가야겠다.\n\n오늘 밤에도 별이 바람에 스치운다.\n<span class='src'>- 윤동주, '서시'</span>"}, {"id": "KO-074", "s": "국어", "t": "단편", "g": 1, "d": "상", "q": "'꽃잎'의 표준 발음으로 옳은 것은?", "c": ["[꼬칩]", "[꼬딥]", "[꼳입]", "[꼰닙]", "[꼰입]"], "a": 4, "e": "'꽃잎'은 합성어로, [꼳잎] → ㄴ 첨가 [꼳닙] → 비음화 [꼰닙]의 과정을 거쳐 [꼰닙]으로 발음한다.", "p": ""}, {"id": "KO-075", "s": "국어", "t": "단편", "g": 1, "d": "상", "q": "'좋고'가 [조코]로 발음될 때 일어나는 음운 변동은?", "c": ["한 음운이 다른 음운으로 바뀌는 교체", "두 음운이 합쳐져 하나의 음운이 되는 축약", "한 음운이 없어지는 탈락", "없던 음운이 새로 생기는 첨가", "음운 변동이 일어나지 않는다."], "a": 2, "e": "ㅎ과 ㄱ이 만나 거센소리 ㅋ으로 합쳐지는 거센소리되기(자음 축약)이다.", "p": ""}, {"id": "KO-076", "s": "국어", "t": "단편", "g": 1, "d": "상", "q": "'나는 밥을 먹었다.'에서 단어의 개수는?", "c": ["3개", "4개", "5개", "6개", "7개"], "a": 3, "e": "조사도 단어로 인정하므로 '나 / 는 / 밥 / 을 / 먹었다'의 5개이다. 어미 '-었-', '-다'는 단어가 아니다.", "p": ""}, {"id": "KO-077", "s": "국어", "t": "단편", "g": 1, "d": "상", "q": "다음 중 명사절을 안은 문장은?", "c": ["이것은 내가 읽은 책이다.", "나는 네가 오기를 기다렸다.", "비가 소리도 없이 내린다.", "토끼는 앞발이 짧다.", "그는 내일 온다고 말했다."], "a": 2, "e": "'네가 오기'는 명사형 어미 '-기'가 붙어 목적어 역할을 하는 명사절이다. 차례로 관형절, 부사절, 서술절, 인용절을 안은 문장이다.", "p": ""}, {"id": "KO-078", "s": "국어", "t": "단편", "g": 1, "d": "상", "q": "다음 중 사동 표현이 쓰인 문장은?", "c": ["도둑이 경찰에게 잡혔다.", "엄마가 아이에게 밥을 먹였다.", "문이 바람에 닫혔다.", "아이가 밥을 먹었다.", "산이 구름에 덮였다."], "a": 2, "e": "사동은 주어가 남에게 어떤 동작을 하게 하는 것이다. '먹이다'는 '먹다'에 사동 접미사 '-이-'가 붙은 사동사이다. '잡히다', '닫히다', '덮이다'는 피동사이다.", "p": ""}, {"id": "KO-079", "s": "국어", "t": "단편", "g": 1, "d": "상", "q": "'비가 와서 길이 질다.'에 대한 설명으로 옳은 것은?", "c": ["두 절이 대등하게 이어진문장이다.", "앞 절이 뒤 절의 원인이 되는 종속적으로 이어진문장이다.", "주어와 서술어가 한 번만 나타나는 홑문장이다.", "명사절을 안은 문장이다.", "관형절을 안은 문장이다."], "a": 2, "e": "'-아서/-어서'로 연결되어 앞 절(비가 오다)이 뒤 절(길이 질다)의 원인을 나타내는 종속적으로 이어진문장이다.", "p": ""}, {"id": "KO-080", "s": "국어", "t": "단편", "g": 1, "d": "상", "q": "서술어 '주다'가 문장을 이루기 위해 반드시 필요로 하는 문장 성분의 개수(서술어의 자릿수)는?", "c": ["한 자리", "두 자리", "네 자리", "필요로 하는 성분이 없다.", "세 자리"], "a": 5, "e": "'주다'는 '누가 누구에게 무엇을 주다'처럼 주어, 부사어, 목적어 세 성분을 필요로 하는 세 자리 서술어이다.", "p": ""}, {"id": "KO-081", "s": "국어", "t": "단편", "g": 1, "d": "상", "q": "시의 앞부분에서 자연 경치를 그리고 뒷부분에서 화자의 정서를 드러내는 시상 전개 방식은?", "c": ["수미상관", "기승전결", "선경후정", "점층", "역순행"], "a": 3, "e": "선경후정(先景後情)은 먼저 경치를 묘사하고 나중에 감정을 드러내는 방식으로, 한시와 시조에서 자주 쓰인다.", "p": ""}, {"id": "KO-082", "s": "국어", "t": "단편", "g": 1, "d": "상", "q": "신라 시대에 한자의 음과 뜻을 빌려 우리말을 적은 표기 방식으로, 향가를 기록하는 데 쓰인 것은?", "c": ["향찰", "훈민정음", "구결", "이두", "언문"], "a": 1, "e": "향찰은 한자의 음과 뜻을 빌려 우리말 문장 전체를 적은 표기법으로, 향가가 향찰로 기록되어 전한다.", "p": ""}, {"id": "KO-083", "s": "국어", "t": "단편", "g": 1, "d": "상", "q": "고려 가요(고려 속요)의 일반적인 특징으로 옳은 것은?", "c": ["3장 6구 45자 내외의 정형시이다.", "주로 3음보 율격에 후렴구가 있으며 평민들의 솔직한 정서를 담았다.", "한자의 음과 뜻을 빌려 표기하였다.", "주로 양반 사대부가 유교 이념을 노래하였다.", "4음보 연속체의 긴 노래이다."], "a": 2, "e": "고려 가요는 평민층이 부르던 노래로, 3음보와 분연체, 후렴구가 특징이며 사랑과 이별 등 진솔한 감정을 노래하였다. '가시리', '청산별곡' 등이 있다.", "p": ""}, {"id": "KO-084", "s": "국어", "t": "단편", "g": 2, "d": "하", "q": "희곡에서 등장인물의 행동, 표정, 말투나 무대 장치 등을 지시하는 부분은?", "c": ["대사", "해설", "독백", "방백", "지문"], "a": 5, "e": "지문은 인물의 동작·표정·심리나 조명, 효과음 등을 지시한다. 해설은 희곡의 첫머리에서 등장인물, 때, 곳, 무대를 설명하는 부분이다.", "p": ""}, {"id": "KO-085", "s": "국어", "t": "단편", "g": 2, "d": "하", "q": "시에서 느껴지는 말의 가락을 무엇이라 하는가?", "c": ["심상", "주제", "어조", "시점", "운율"], "a": 5, "e": "운율은 같은 소리나 글자 수, 문장 구조 등을 반복하여 만들어지는 말의 가락이다. 심상은 시를 읽을 때 마음속에 떠오르는 감각적인 모습이다.", "p": ""}, {"id": "KO-086", "s": "국어", "t": "단편", "g": 2, "d": "하", "q": "'밥'의 높임말은?", "c": ["말씀", "댁", "연세", "성함", "진지"], "a": 5, "e": "'진지'는 '밥'의 높임말이다. 말씀은 말, 댁은 집, 연세는 나이, 성함은 이름의 높임말이다.", "p": ""}, {"id": "KO-087", "s": "국어", "t": "단편", "g": 2, "d": "하", "q": "다음 중 서로 반의 관계인 단어끼리 짝지은 것은?", "c": ["기쁘다 - 즐겁다", "책 - 서적", "과일 - 사과", "아버지 - 부친", "오르다 - 내리다"], "a": 5, "e": "'오르다'와 '내리다'는 뜻이 서로 반대인 반의어이다. 기쁘다-즐겁다, 책-서적, 아버지-부친은 유의 관계, 과일-사과는 상하 관계이다.", "p": ""}, {"id": "KO-088", "s": "국어", "t": "단편", "g": 2, "d": "하", "q": "다음 중 맞춤법에 맞게 쓴 문장은?", "c": ["그러면 안 되.", "그러면 않 돼.", "그러면 않 되.", "그러면 안 돼.", "그러면 안 됬어."], "a": 4, "e": "'돼'는 '되어'의 준말이다. '되어'로 바꾸어 말이 되면 '돼'를 쓴다. 문장 끝에는 '되'만 쓸 수 없으므로 '안 돼'가 옳다. '됬어'는 '됐어'로 써야 한다.", "p": ""}, {"id": "KO-089", "s": "국어", "t": "단편", "g": 2, "d": "하", "q": "다음 중 밑줄 친 말이 바르게 쓰인 것은?", "c": ["감기가 다 <u>나았다</u>.", "감기가 다 <u>낳았다</u>.", "감기가 다 <u>낫았다</u>.", "감기가 다 <u>났았다</u>.", "감기가 다 <u>나앗다</u>."], "a": 1, "e": "병이 고쳐지는 것은 '낫다'이며 '나아, 나았다'로 활용한다. '낳다'는 아이나 새끼를 몸 밖으로 내놓는다는 뜻이다.", "p": ""}, {"id": "KO-090", "s": "국어", "t": "단편", "g": 2, "d": "하", "q": "속담 '낮말은 새가 듣고 밤말은 쥐가 듣는다'의 뜻으로 알맞은 것은?", "c": ["말을 많이 하면 쓸 말이 적다.", "부지런한 사람이 성공한다.", "작은 것도 모이면 큰 것이 된다.", "남의 말을 잘 들어야 한다.", "아무도 안 듣는 데서라도 말을 조심해야 한다."], "a": 5, "e": "비밀스럽게 한 말도 남의 귀에 들어가기 쉬우니 늘 말조심하라는 뜻이다.", "p": ""}, {"id": "KO-091", "s": "국어", "t": "단편", "g": 2, "d": "하", "q": "관용 표현 '발이 넓다'의 뜻은?", "c": ["아는 사람이 많아 활동하는 범위가 넓다.", "걸음이 매우 빠르다.", "발의 크기가 크다.", "여러 곳을 돌아다닌다.", "성격이 너그럽다."], "a": 1, "e": "'발이 넓다'는 사귀어 아는 사람이 많다는 뜻의 관용 표현이다.", "p": ""}, {"id": "KO-092", "s": "국어", "t": "단편", "g": 2, "d": "하", "q": "면담(인터뷰)을 하기 전에 준비할 일로 적절하지 <u>않은</u> 것은?", "c": ["면담의 목적을 분명히 정한다.", "면담 대상자에게 미리 연락하여 허락을 받는다.", "대상자에 대한 정보를 조사한다.", "목적에 맞는 질문을 미리 준비한다.", "녹음은 상대방 몰래 하도록 계획한다."], "a": 5, "e": "녹음이나 촬영을 하려면 반드시 상대방에게 미리 알리고 동의를 구해야 한다.", "p": ""}, {"id": "KO-093", "s": "국어", "t": "수능", "g": 2, "d": "하", "q": "윗글의 내용과 일치하는 것은?", "c": ["하딘은 공유지의 비극이 일어나지 않는다고 주장하였다.", "농부가 소를 늘릴 때 생기는 손해는 그 농부 혼자서 진다.", "전통적인 해법은 주민들이 직접 규칙을 만드는 것이었다.", "오스트롬은 공유지를 개인에게 나누어 주어야 한다고 보았다.", "오스트롬은 주민들이 스스로 공유 자원을 잘 관리해 온 사례를 찾아냈다."], "a": 5, "e": "3문단에서 오스트롬이 정부 규제나 사유화 없이 주민들이 공유 자원을 관리해 온 사례를 찾았다고 하였다. 전통적 해법은 정부 규제와 사유화이다.", "p": "마을 사람 누구나 소를 풀어 기를 수 있는 공동 목초지가 있다고 하자. 목초지가 감당할 수 있는 소의 수에는 한계가 있다. 그런데 농부 한 사람의 처지에서 보면, 소를 한 마리 더 풀어놓을 때 생기는 이익은 모두 자기 것이 되지만, 풀이 줄어드는 손해는 마을 사람 전체가 나누어 진다. 그러니 저마다 소를 늘리는 것이 합리적인 선택이 된다. 모든 농부가 이렇게 생각하고 행동하면 목초지는 결국 황폐해져 아무도 소를 기를 수 없게 된다. 미국의 생물학자 하딘은 이를 <b>'공유지의 비극'</b>이라고 불렀다. 개인의 합리적 선택이 모여 공동체 전체에는 파멸적인 결과를 낳는다는 것이다.\n이 비극을 막는 전통적인 해법은 두 가지였다. 하나는 정부가 나서서 이용량을 정하고 어기는 사람을 처벌하는 것이고, 다른 하나는 공유지를 쪼개어 개인에게 소유권을 주는 것이다. 주인이 생기면 자기 땅을 아껴 쓸 것이라는 생각이다.\n그러나 정치학자 오스트롬은 제3의 길이 있음을 보여 주었다. 그는 세계 여러 지역의 어장, 숲, 관개 시설을 조사하여, 정부의 규제나 사유화 없이도 주민들이 수백 년 동안 공유 자원을 잘 관리해 온 사례를 찾아냈다. 이런 공동체에는 공통점이 있었다. 자원을 이용할 수 있는 사람의 범위가 분명하고, 이용 규칙을 주민들이 직접 만들며, 규칙을 지키는지 서로 감시하고, 어긴 사람에게는 위반 정도에 따라 단계적으로 불이익을 준다는 점이다. 오스트롬은 이 연구로 2009년 노벨 경제학상을 받았다."}, {"id": "KO-094", "s": "국어", "t": "수능", "g": 2, "d": "하", "q": "윗글의 형식상 특징으로 가장 적절한 것은?", "c": ["한 연이 한 줄로 이루어져 있다.", "대화를 주고받는 형식으로 되어 있다.", "각 연의 첫 글자를 같게 맞추었다.", "행의 길이가 뒤로 갈수록 길어진다.", "첫 연과 마지막 연이 비슷한 짜임으로 서로 대응한다."], "a": 5, "e": "1연 '산에는 꽃 피네 … 꽃이 피네'와 4연 '산에는 꽃 지네 … 꽃이 지네'가 같은 짜임으로 대응하여 안정감을 주고 주제를 강조한다.", "p": "산에는 꽃 피네\n꽃이 피네\n갈 봄 여름 없이\n꽃이 피네\n\n산에\n산에\n피는 꽃은\n저만치 혼자서 피어 있네\n\n산에서 우는 작은 새여\n꽃이 좋아\n산에서\n사노라네\n\n산에는 꽃 지네\n꽃이 지네\n갈 봄 여름 없이\n꽃이 지네\n<span class='src'>- 김소월, '산유화'</span>"}, {"id": "KO-095", "s": "국어", "t": "수능", "g": 2, "d": "하", "q": "윗글의 내용과 일치하는 것은?", "c": ["QR 코드는 점들을 가로와 세로 두 방향으로 배열한다.", "바코드는 QR 코드보다 많은 정보를 담을 수 있다.", "QR 코드에는 숫자만 넣을 수 있다.", "QR 코드는 똑바로 놓아야만 읽을 수 있다.", "QR 코드는 조금이라도 더러워지면 읽을 수 없다."], "a": 1, "e": "1문단에서 QR 코드는 정사각형 점들을 가로와 세로 두 방향으로 배열한다고 하였다. 문자와 주소도 넣을 수 있고, 거꾸로 들어도 읽히며, 일부가 손상되어도 복원된다.", "p": "물건 포장지에서 흔히 보는 막대 모양의 바코드는 굵기가 다른 검은 줄과 흰 줄을 가로 한 방향으로 늘어놓아 정보를 나타낸다. 그래서 담을 수 있는 정보가 숫자 20자 안팎에 그친다. 이에 비해 QR 코드는 작은 정사각형 점들을 가로와 세로 두 방향으로 배열하므로 훨씬 많은 정보를 담을 수 있다. 숫자만 담는다면 최대 7,000자 넘게 들어가고, 문자나 인터넷 주소도 넣을 수 있다.\nQR 코드의 세 모서리에는 큰 네모 무늬가 있는데 이를 '위치 찾기 무늬'라고 한다. 판독기는 이 세 무늬를 먼저 찾아 코드의 범위와 방향을 알아낸다. 덕분에 코드를 거꾸로 들거나 비스듬히 비추어도 빠르게 읽을 수 있다. QR이 '빠른 응답(Quick Response)'의 줄임말인 것도 이 때문이다.\n또 QR 코드에는 '오류 복원' 기능이 있다. 실제 정보 외에 이를 복구하는 데 쓰는 여분의 정보를 함께 넣어 두어, 코드 일부가 더러워지거나 찢어져도 원래 정보를 되살릴 수 있다. 복원 수준은 네 단계로 고를 수 있는데, 가장 높은 단계에서는 코드의 약 30%가 손상되어도 읽을 수 있다. 다만 복원 수준을 높일수록 여분의 정보가 늘어나므로, 같은 크기의 코드에 담을 수 있는 실제 정보의 양은 줄어든다."}, {"id": "KO-096", "s": "국어", "t": "단편", "g": 2, "d": "중", "q": "\"문학은 표현 형식에 따라 시, 소설, 희곡, 수필 등으로 나눌 수 있다.\"에 쓰인 설명 방법은?", "c": ["정의", "예시", "인과", "분류", "서사"], "a": 4, "e": "분류는 대상을 일정한 기준에 따라 종류별로 나누어 설명하는 방법이다.", "p": ""}, {"id": "KO-097", "s": "국어", "t": "단편", "g": 2, "d": "중", "q": "\"모든 사람은 죽는다. 소크라테스는 사람이다. 그러므로 소크라테스는 죽는다.\"와 같은 추론 방식은?", "c": ["연역 추론", "귀납 추론", "유비 추론", "변증법", "가설 추론"], "a": 1, "e": "연역 추론은 일반적인 원리에서 개별적인 결론을 이끌어 내는 방식이다. 귀납 추론은 개별 사례에서 일반적인 결론을 이끌어 낸다.", "p": ""}, {"id": "KO-098", "s": "국어", "t": "단편", "g": 2, "d": "중", "q": "\"내가 만난 그 학교 학생 두 명이 모두 친절했어. 그러니 그 학교 학생은 모두 친절해.\"에 나타난 논리적 오류는?", "c": ["성급한 일반화의 오류", "인신공격의 오류", "순환 논증의 오류", "흑백 논리의 오류", "동정에 호소하는 오류"], "a": 1, "e": "몇 개의 사례만으로 전체가 그렇다고 단정하는 것은 성급한 일반화의 오류이다.", "p": ""}, {"id": "KO-099", "s": "국어", "t": "단편", "g": 2, "d": "중", "q": "조선 후기에 등장한 사설시조에 대한 설명으로 옳은 것은?", "c": ["3장 6구 45자 내외의 형식을 엄격하게 지켰다.", "주로 사대부가 유교적 이념을 노래하였다.", "한문으로만 창작되었다.", "고려 시대에 가장 유행하였다.", "평시조보다 길이가 길어졌고, 주로 평민들의 생활과 감정을 익살스럽게 담았다."], "a": 5, "e": "사설시조는 평시조의 틀에서 벗어나 중장 등이 길어진 시조로, 서민들의 삶과 솔직한 감정, 풍자와 해학을 담았다.", "p": ""}, {"id": "KO-100", "s": "국어", "t": "단편", "g": 2, "d": "중", "q": "고전 소설의 일반적인 특징으로 적절하지 <u>않은</u> 것은?", "c": ["착한 사람이 복을 받고 악한 사람이 벌을 받는다.", "대체로 행복한 결말로 끝난다.", "인물의 내면 심리를 세밀하게 분석하는 데 중점을 둔다.", "우연한 사건이 자주 일어난다.", "인물의 성격이 처음부터 끝까지 잘 변하지 않는다."], "a": 3, "e": "고전 소설은 권선징악의 주제, 행복한 결말, 우연성, 평면적·전형적 인물 등이 특징이다. 인물의 내면 심리를 깊이 파고드는 것은 현대 소설의 특징이다.", "p": ""}, {"id": "KO-101", "s": "국어", "t": "단편", "g": 2, "d": "중", "q": "다음 중 문장 성분의 호응이 자연스러운 문장은?", "c": ["나는 결코 그 일을 하겠다.", "비록 비가 오니까 소풍을 간다.", "아마 그는 반드시 올 것이다.", "설마 그가 왔다.", "나는 결코 그 일을 하지 않겠다."], "a": 5, "e": "'결코'는 '~지 않다'와 같은 부정 표현과 호응한다. '비록'은 '~ㄹ지라도', '설마'는 '~ㄹ까'와 어울린다.", "p": ""}, {"id": "KO-102", "s": "국어", "t": "단편", "g": 2, "d": "중", "q": "한자 성어 '새옹지마(塞翁之馬)'의 뜻으로 알맞은 것은?", "c": ["한 가지 일로 두 가지 이익을 얻는다.", "고생 끝에 즐거움이 온다.", "어려운 일을 무릅쓰고 끝까지 노력한다.", "말을 타고 달리며 산을 구경하듯 대충 본다.", "인생의 좋고 나쁜 일은 변화가 많아 미리 알기 어렵다."], "a": 5, "e": "변방 노인의 말이 달아났다가 복이 되고 다시 화가 된 이야기에서 나온 말로, 길흉화복은 예측하기 어렵다는 뜻이다.", "p": ""}, {"id": "KO-103", "s": "국어", "t": "단편", "g": 2, "d": "상", "q": "중세 국어(15세기)의 특징으로 <u>옳지 않은</u> 것은?", "c": ["글자 왼쪽에 점을 찍어 소리의 높낮이를 표시하였다.", "'ㆍ'(아래아)와 같은 글자가 쓰였다.", "소리 나는 대로 이어 적는 방식이 일반적이었다.", "오늘날과 달리 띄어쓰기를 하지 않았다.", "주격 조사 '가'가 널리 쓰였다."], "a": 5, "e": "주격 조사 '가'는 근대 국어 시기에 나타났다. 중세 국어에서는 주격 조사로 '이', 'ㅣ'가 쓰이거나 생략되었다.", "p": ""}, {"id": "KO-104", "s": "국어", "t": "단편", "g": 2, "d": "상", "q": "'색연필'이 [생년필]로 발음될 때 일어나는 음운 변동을 순서대로 나열한 것은?", "c": ["ㄴ 첨가 → 비음화", "비음화 → ㄴ 첨가", "유음화 → ㄴ 첨가", "ㄴ 첨가 → 유음화", "된소리되기 → 비음화"], "a": 1, "e": "'색+연필'에서 뒷말이 '여'로 시작하므로 ㄴ이 첨가되어 [색년필]이 되고, 받침 ㄱ이 ㄴ 앞에서 ㅇ으로 바뀌는 비음화가 일어나 [생년필]이 된다.", "p": ""}, {"id": "KO-105", "s": "국어", "t": "단편", "g": 2, "d": "상", "q": "부정 표현에 대한 설명으로 옳은 것은?", "c": ["'안' 부정은 능력이 부족함을 나타낸다.", "'못' 부정은 주로 주어의 능력이 부족하거나 외부 사정 때문에 할 수 없음을 나타낸다.", "명령문에서는 '-지 않아라'를 쓴다.", "'못' 부정은 주어의 의지에 따른 부정이다.", "청유문에서는 '-지 못하자'를 쓴다."], "a": 2, "e": "'안' 부정은 단순 부정이나 의지 부정, '못' 부정은 능력 부정을 나타낸다. 명령문과 청유문에서는 '-지 마라', '-지 말자'처럼 '말다'를 쓴다.", "p": ""}, {"id": "KO-106", "s": "국어", "t": "단편", "g": 2, "d": "상", "q": "\"민수가 '내일 다시 올게.'라고 말했다.\"를 간접 인용으로 바르게 바꾼 것은?", "c": ["민수가 내일 다시 오겠다고 말했다.", "민수가 내일 다시 올게라고 말했다.", "민수가 내일 다시 온다라고 말했다.", "민수가 '내일 다시 오겠다'고 말했다.", "민수가 내일 다시 올게고 말했다."], "a": 1, "e": "간접 인용은 따옴표 없이 인용 조사 '고'를 쓰고, 말하는 이의 처지에 맞게 종결 표현을 바꾼다.", "p": ""}, {"id": "KO-107", "s": "국어", "t": "단편", "g": 2, "d": "상", "q": "조선 시대의 가사 문학에 대한 설명으로 옳은 것은?", "c": ["3·4조 또는 4·4조의 4음보가 길게 이어지는 형식이다.", "3장 6구의 짧은 정형시이다.", "향찰로 기록되었다.", "3음보에 후렴구가 붙는다.", "허구의 인물과 사건을 다룬 산문이다."], "a": 1, "e": "가사는 4음보의 율격을 지닌 연속체 시가로, 정철의 '관동별곡', '사미인곡' 등이 대표적이다.", "p": ""}, {"id": "KO-108", "s": "국어", "t": "단편", "g": 2, "d": "상", "q": "박지원의 '양반전'에 대한 설명으로 옳은 것은?", "c": ["영웅의 일대기를 그린 군담 소설이다.", "양반의 무능과 허례허식, 횡포를 풍자하였다.", "남녀의 사랑을 다룬 판소리계 소설이다.", "꿈속의 일을 다룬 몽유록이다.", "사물을 의인화한 가전체 작품이다."], "a": 2, "e": "'양반전'은 부자가 양반 신분을 사려다 포기하는 이야기를 통해 양반 사회의 위선과 무능을 풍자한 한문 소설이다.", "p": ""}, {"id": "KO-109", "s": "국어", "t": "단편", "g": 2, "d": "상", "q": "김유정의 소설 '동백꽃'에 대한 설명으로 옳은 것은?", "c": ["농촌을 배경으로 사춘기 소년·소녀의 사랑을 해학적으로 그렸다.", "도시 지식인의 무기력한 내면을 그렸다.", "전쟁의 비극과 이념 대립을 다루었다.", "일제 강점기 도시 빈민의 죽음을 다루었다.", "미래 사회를 배경으로 한 공상 과학 소설이다."], "a": 1, "e": "'동백꽃'은 강원도 산골을 배경으로, 눈치 없는 '나'와 적극적인 점순이 사이의 갈등과 화해를 토속적인 말투와 해학으로 그린 작품이다.", "p": ""}, {"id": "KO-110", "s": "국어", "t": "단편", "g": 3, "d": "하", "q": "\"너는 어디에 가니?\"와 같이 말하는 이가 듣는 이에게 대답을 요구하는 문장의 종류는?", "c": ["평서문", "명령문", "의문문", "청유문", "감탄문"], "a": 3, "e": "의문문은 질문하여 대답을 요구하는 문장이다. 평서문은 단순히 진술하고, 명령문은 행동을 요구하며, 청유문은 함께 하기를 요청한다.", "p": ""}, {"id": "KO-111", "s": "국어", "t": "단편", "g": 3, "d": "하", "q": "문장에서 주로 주어나 목적어 자리에 쓰이는 '체언'에 해당하는 품사를 옳게 묶은 것은?", "c": ["동사, 형용사", "관형사, 부사", "조사, 감탄사", "명사, 대명사, 수사", "명사, 동사, 형용사"], "a": 4, "e": "체언은 명사, 대명사, 수사이다. 동사와 형용사는 용언, 관형사와 부사는 수식언, 조사는 관계언, 감탄사는 독립언이다.", "p": ""}, {"id": "KO-112", "s": "국어", "t": "단편", "g": 3, "d": "하", "q": "다음 중 하나의 어근으로만 이루어진 단일어는?", "c": ["손수건", "햇밤", "먹이", "하늘", "밤낮"], "a": 4, "e": "'하늘'은 더 나눌 수 없는 단일어이다. '손수건', '밤낮'은 합성어이고, '햇밤', '먹이'는 파생어이다.", "p": ""}, {"id": "KO-113", "s": "국어", "t": "단편", "g": 3, "d": "하", "q": "한자 성어 '죽마고우(竹馬故友)'의 뜻으로 알맞은 것은?", "c": ["서로 뜻이 잘 맞는 부부", "스승과 제자 사이", "어릴 때부터 같이 놀며 자란 오랜 친구", "원수처럼 지내는 사이", "처음 만난 사람"], "a": 3, "e": "대나무 말을 타고 놀던 옛 친구라는 뜻으로, 어릴 때부터 가까이 지낸 벗을 이른다.", "p": ""}, {"id": "KO-114", "s": "국어", "t": "단편", "g": 3, "d": "하", "q": "속담 '티끌 모아 태산'의 뜻으로 알맞은 것은?", "c": ["일이 이미 잘못된 뒤에는 손을 써도 소용없다.", "쉬운 일도 조심해서 해야 한다.", "제 허물은 생각하지 않고 남의 허물만 탓한다.", "말만 잘하면 어려운 일도 해결된다.", "아무리 작은 것이라도 모이고 모이면 큰 것이 된다."], "a": 5, "e": "작은 것도 꾸준히 모으면 나중에 큰 덩어리가 된다는 뜻이다.", "p": ""}, {"id": "KO-115", "s": "국어", "t": "단편", "g": 3, "d": "하", "q": "다음 중 맞춤법에 맞게 쓴 것은?", "c": ["오늘이 몇 월 몇일이지?", "오늘이 몇 월 며칠이지?", "오늘이 몇 월 몇 일이지?", "오늘이 몇 월 며 칠이지?", "오늘이 몇 월 몇칠이지?"], "a": 2, "e": "'몇 일'이나 '몇일'로 적지 않고 소리 나는 대로 '며칠'로 적는 것이 맞다.", "p": ""}, {"id": "KO-116", "s": "국어", "t": "단편", "g": 3, "d": "하", "q": "다음 중 밑줄 친 조사가 바르게 쓰인 것은?", "c": ["학생<u>으로써</u> 지켜야 할 일이 있다.", "대화<u>로서</u> 갈등을 풀자.", "쌀<u>로서</u> 떡을 만든다.", "그는 칼<u>로서</u> 과일을 깎았다.", "학생<u>으로서</u> 지켜야 할 일이 있다."], "a": 5, "e": "'(으)로서'는 지위·신분·자격을, '(으)로써'는 수단·도구·재료를 나타낸다. 따라서 '대화로써', '쌀로써', '칼로써'가 맞다.", "p": ""}, {"id": "KO-117", "s": "국어", "t": "단편", "g": 3, "d": "하", "q": "문학의 갈래 중 인물과 사건을 서술자가 이야기로 전달하는 '서사' 갈래에 속하는 것은?", "c": ["시", "소설", "희곡", "수필", "시나리오"], "a": 2, "e": "소설은 서술자가 꾸며 낸 이야기를 전달하는 서사 갈래이다. 시는 서정, 희곡과 시나리오는 극, 수필은 교술 갈래에 속한다.", "p": ""}, {"id": "KO-118", "s": "국어", "t": "단편", "g": 3, "d": "하", "q": "보고서를 쓸 때 다른 사람의 글이나 자료를 가져온 경우 출처를 밝혀야 하는 까닭은?", "c": ["다른 사람의 지적 재산을 존중하는 쓰기 윤리를 지키기 위해", "글의 분량을 늘리기 위해", "글을 어렵게 보이게 하기 위해", "읽는 사람을 헷갈리게 하기 위해", "자료를 자기 것처럼 보이게 하기 위해"], "a": 1, "e": "남의 글이나 자료를 출처 없이 쓰는 것은 표절이다. 출처를 밝히는 것은 쓰기 윤리를 지키고 글의 신뢰도를 높이는 일이다.", "p": ""}, {"id": "KO-119", "s": "국어", "t": "단편", "g": 3, "d": "하", "q": "다음 중 서로 유의 관계인 단어끼리 짝지은 것은?", "c": ["길다 - 짧다", "동물 - 호랑이", "오다 - 가다", "남자 - 여자", "기쁘다 - 즐겁다"], "a": 5, "e": "'기쁘다'와 '즐겁다'는 뜻이 서로 비슷한 유의어이다. 길다-짧다, 오다-가다, 남자-여자는 반의 관계, 동물-호랑이는 상하 관계이다.", "p": ""}, {"id": "KO-120", "s": "국어", "t": "수능", "g": 3, "d": "하", "q": "윗글에서 설명한 '귀납'의 뜻으로 가장 적절한 것은?", "c": ["일반적인 원리에서 개별적인 사실을 이끌어 내는 추론", "비슷한 두 대상을 견주어 결론을 내는 추론", "개별 사례들을 바탕으로 일반적인 결론을 이끌어 내는 추론", "어떤 경우에도 틀릴 수 없는 주장", "가설을 반박하려고 시험하는 활동"], "a": 3, "e": "1문단에서 개별 사례들을 바탕으로 일반적인 결론을 이끌어 내는 추론을 귀납이라고 하였다.", "p": "'지금까지 관찰한 백조는 모두 희었다. 그러므로 모든 백조는 희다.' 이처럼 개별 사례들을 바탕으로 일반적인 결론을 이끌어 내는 추론을 <b>귀납</b>이라고 한다. 과학자들이 실험과 관찰을 되풀이하여 법칙을 세우는 것도 귀납에 기대고 있다. 그런데 18세기 철학자 흄은 귀납에 논리적 빈틈이 있다고 지적하였다. 아무리 많은 흰 백조를 관찰했더라도 다음에 만날 백조가 희다는 보장은 없다는 것이다. 실제로 유럽인들은 오스트레일리아에서 검은 백조를 발견하고 큰 충격을 받았다.\n20세기 철학자 포퍼는 이 문제를 다른 방향에서 풀고자 하였다. 그는 흰 백조를 아무리 많이 관찰해도 '모든 백조는 희다'가 참임을 증명할 수는 없지만, 검은 백조 한 마리만 발견하면 그 주장이 거짓임은 확실히 밝힐 수 있다는 점에 주목하였다. 포퍼에 따르면 과학은 가설을 증명하는 활동이 아니라, 과감한 가설을 세우고 그것을 반박하려는 시험을 거듭하는 활동이다. 엄격한 시험을 견뎌 낸 가설은 '아직 반증되지 않은 가설'로서 잠정적으로 받아들여질 뿐이다.\n그래서 포퍼는 과학과 과학이 아닌 것을 가르는 기준으로 <b>'반증 가능성'</b>을 내세웠다. 어떤 관찰 결과가 나오면 틀린 것으로 판명될지를 분명히 말할 수 있는 주장만이 과학적이라는 것이다. '내일 이곳에 비가 온다'는 주장은 내일 비가 오지 않으면 틀린 것이 되므로 반증 가능하다. 반면 '내일 비가 오거나 오지 않는다'는 주장은 어떤 경우에도 틀릴 수 없으므로, 참이기는 하지만 세계에 대해 아무것도 알려 주지 않는다."}, {"id": "KO-121", "s": "국어", "t": "수능", "g": 3, "d": "하", "q": "윗글에서 화자가 기다리는 대상은?", "c": ["아이", "손님", "돛단배", "청포도", "전설"], "a": 2, "e": "화자는 '내가 바라는 손님'이 찾아오기를 기다리며 은쟁반과 모시 수건을 마련해 두라고 한다.", "p": "내 고장 칠월은\n청포도가 익어 가는 시절\n\n이 마을 전설이 주저리주저리 열리고\n먼 데 하늘이 꿈꾸며 알알이 들어와 박혀\n\n하늘 밑 푸른 바다가 가슴을 열고\n흰 돛단배가 곱게 밀려서 오면\n\n내가 바라는 손님은 고달픈 몸으로\n청포(靑袍)를 입고 찾아온다고 했으니\n\n내 그를 맞아 이 포도를 따 먹으면\n두 손은 함뿍 적셔도 좋으련\n\n아이야 우리 식탁엔 은쟁반에\n하이얀 모시 수건을 마련해 두렴\n<span class='src'>- 이육사, '청포도'</span>"}, {"id": "KO-122", "s": "국어", "t": "수능", "g": 3, "d": "하", "q": "윗글의 내용과 일치하는 것은?", "c": ["경기가 과열되면 중앙은행은 기준 금리를 내린다.", "금리가 오르면 가계는 소비를 늘린다.", "기준 금리가 바뀌면 은행의 예금 금리와 대출 금리도 뒤따라 움직인다.", "금리를 조정하면 그 효과가 곧바로 나타난다.", "경기가 침체되면 중앙은행은 기준 금리를 올린다."], "a": 3, "e": "1문단에서 기준 금리가 바뀌면 예금·대출 금리가 뒤따라 움직인다고 하였다. 경기 과열 때는 금리를 올리고 침체 때는 내리며, 효과가 나타나는 데는 시간이 걸린다.", "p": "중앙은행은 물가를 안정시키고 경기의 지나친 출렁임을 막기 위해 <b>기준 금리</b>를 조정한다. 기준 금리는 중앙은행이 시중 은행과 돈을 거래할 때 기준으로 삼는 금리로, 이것이 바뀌면 은행의 예금 금리와 대출 금리도 뒤따라 움직인다.\n경기가 과열되어 물가가 빠르게 오르면 중앙은행은 기준 금리를 올린다. 금리가 오르면 가계는 대출 이자 부담이 커지고 저축의 이점이 늘어나므로 소비를 줄인다. 기업도 돈을 빌려 공장을 짓거나 설비를 늘리는 투자를 미루게 된다. 이렇게 소비와 투자가 줄면 상품에 대한 수요가 줄어 물가 상승세가 꺾인다. 반대로 경기가 침체되면 기준 금리를 내려 소비와 투자를 북돋운다.\n그러나 금리 정책에는 한계가 있다. 먼저 금리를 조정한 효과가 실제 경제에 나타나기까지는 보통 여러 달에서 1년 넘는 시간이 걸린다. 그래서 중앙은행은 현재가 아니라 앞으로의 경제 상황을 예측하여 미리 움직여야 하는데, 예측이 빗나가면 오히려 경기의 출렁임을 키울 수 있다. 또 경기가 매우 나쁠 때에는 금리를 내려도 가계와 기업이 미래를 불안해하여 돈을 쓰지 않고 쥐고만 있을 수 있다. 이런 상황을 '유동성 함정'이라고 한다."}, {"id": "KO-123", "s": "국어", "t": "단편", "g": 3, "d": "중", "q": "'국밥'이 [국빱]으로 발음될 때 일어나는 음운 변동은?", "c": ["비음화", "유음화", "된소리되기", "구개음화", "거센소리되기"], "a": 3, "e": "받침 ㄱ, ㄷ, ㅂ 뒤에서 예사소리 ㄱ, ㄷ, ㅂ, ㅅ, ㅈ이 된소리로 바뀌는 된소리되기이다.", "p": ""}, {"id": "KO-124", "s": "국어", "t": "단편", "g": 3, "d": "중", "q": "다음 중 표준어인 것은?", "c": ["설겆이", "설거지", "몇일", "오랫만에", "희안하다"], "a": 2, "e": "'설거지'가 표준어이다. '며칠', '오랜만에', '희한하다'로 써야 한다.", "p": ""}, {"id": "KO-125", "s": "국어", "t": "단편", "g": 3, "d": "중", "q": "다음 중 띄어쓰기가 바른 것은?", "c": ["먹을만큼 먹어라.", "나 만큼 키가 크다.", "먹을 만큼 먹어라.", "너 만큼 나도 할 수 있다.", "노력한만큼 얻는다."], "a": 3, "e": "'만큼'이 용언의 관형사형 뒤에 오면 의존 명사이므로 띄어 쓰고(먹을 만큼, 노력한 만큼), 체언 뒤에 오면 조사이므로 붙여 쓴다(나만큼, 너만큼).", "p": ""}, {"id": "KO-126", "s": "국어", "t": "단편", "g": 3, "d": "중", "q": "'이것은 <u>내가 읽은</u> 책이다.'에서 밑줄 친 부분에 대한 설명으로 옳은 것은?", "c": ["서술어를 꾸미는 부사절이다.", "주어 역할을 하는 명사절이다.", "문장 전체의 서술어 역할을 하는 서술절이다.", "남의 말을 옮긴 인용절이다.", "뒤에 오는 체언 '책'을 꾸미는 관형절이다."], "a": 5, "e": "'내가 읽은'은 관형사형 어미 '-(으)ㄴ'이 붙어 체언 '책'을 꾸미는 관형절이다.", "p": ""}, {"id": "KO-127", "s": "국어", "t": "단편", "g": 3, "d": "중", "q": "한용운의 시 '님의 침묵'에 대한 설명으로 옳은 것은?", "c": ["경어체를 써서 '님'에 대한 간절한 마음을 드러내고, 이별을 새로운 만남의 희망으로 바꾼다.", "명령하는 말투로 강한 의지를 드러낸다.", "'님'과 다시 만날 수 없다는 절망으로 끝난다.", "자연의 경치를 객관적으로 묘사하는 데 그친다.", "3장 6구의 시조 형식을 따른다."], "a": 1, "e": "'님의 침묵'은 '~습니다'의 경어체와 역설적 표현으로, 이별의 슬픔을 다시 만날 것이라는 믿음으로 이겨 내는 모습을 노래한다. '님'은 연인, 조국, 절대자 등으로 다양하게 해석된다.", "p": ""}, {"id": "KO-128", "s": "국어", "t": "단편", "g": 3, "d": "중", "q": "허균의 '홍길동전'에 대한 설명으로 옳은 것은?", "c": ["꿈과 현실을 오가는 구조로 인생무상을 드러낸다.", "양반의 허례허식을 풍자한 한문 단편이다.", "판소리로 불리다가 소설로 정착하였다.", "궁중에서 일어난 일을 기록한 수필이다.", "최초의 한글 소설로 알려져 있으며, 적서 차별 등 사회 제도의 모순을 비판하였다."], "a": 5, "e": "'홍길동전'은 서얼인 홍길동을 주인공으로 하여 적서 차별과 탐관오리의 횡포를 비판한 사회 소설이자 영웅 소설이다.", "p": ""}, {"id": "KO-129", "s": "국어", "t": "단편", "g": 3, "d": "중", "q": "김만중의 '구운몽'에 대한 설명으로 옳은 것은?", "c": ["적서 차별을 비판한 사회 소설이다.", "판소리계 소설로 해학과 풍자가 두드러진다.", "양반의 위선을 풍자한 한문 단편이다.", "현실-꿈-현실의 구조를 통해 세속적 욕망이 덧없음을 드러낸다.", "임진왜란을 배경으로 한 군담 소설이다."], "a": 4, "e": "'구운몽'은 성진이 꿈속에서 양소유로 태어나 부귀영화를 누리다가 깨어나 그것이 한바탕 꿈임을 깨닫는 환몽 구조의 소설이다.", "p": ""}, {"id": "KO-130", "s": "국어", "t": "단편", "g": 3, "d": "중", "q": "한자 성어 '과유불급(過猶不及)'의 뜻으로 알맞은 것은?", "c": ["잘못을 고치는 데 주저하지 않는다.", "정도를 지나침은 미치지 못함과 같다.", "지난 일을 뉘우쳐도 소용없다.", "허물이 있으면 반드시 벌을 받는다.", "노력하면 못 이룰 일이 없다."], "a": 2, "e": "무엇이든 지나치면 모자란 것과 마찬가지라는 뜻으로, 중용의 중요성을 이르는 말이다.", "p": ""}, {"id": "KO-131", "s": "국어", "t": "단편", "g": 3, "d": "상", "q": "'밟고'가 [밥꼬]로 발음될 때 일어나는 음운 변동을 모두 고른 것은?", "c": ["자음군 단순화(탈락), 된소리되기(교체)", "비음화(교체), 유음화(교체)", "거센소리되기(축약), 자음군 단순화(탈락)", "ㄴ 첨가(첨가), 된소리되기(교체)", "구개음화(교체), 된소리되기(교체)"], "a": 1, "e": "겹받침 ㄼ에서 ㄹ이 탈락하여 [밥]이 되고(자음군 단순화), 뒤의 ㄱ이 된소리 ㄲ으로 바뀐다(된소리되기). '밟다'는 예외적으로 자음 앞에서 [밥]으로 발음한다.", "p": ""}, {"id": "KO-132", "s": "국어", "t": "단편", "g": 3, "d": "상", "q": "\"어머니께서 할머니께 선물을 드리셨습니다.\"에 대한 설명으로 옳은 것은?", "c": ["주체 높임만 나타난다.", "객체 높임과 상대 높임만 나타난다.", "주체 높임, 객체 높임, 상대 높임이 모두 나타난다.", "주체 높임과 상대 높임만 나타난다.", "높임 표현이 나타나지 않는다."], "a": 3, "e": "'께서', '-시-'로 주어 '어머니'를 높이고(주체 높임), '께', '드리다'로 부사어 '할머니'를 높이며(객체 높임), '-습니다'로 듣는 이를 높인다(상대 높임).", "p": ""}, {"id": "KO-133", "s": "국어", "t": "단편", "g": 3, "d": "상", "q": "다음 중 서술절을 안은 문장은?", "c": ["나는 그가 오기를 바란다.", "꽃이 예쁘게 피었다.", "이것은 내가 만든 빵이다.", "토끼는 앞발이 짧다.", "형은 키가 큰 사람을 만났다."], "a": 4, "e": "'토끼는 앞발이 짧다'에서 '앞발이 짧다'는 주어와 서술어를 갖춘 절로서 전체 주어 '토끼는'의 서술어 역할을 한다.", "p": ""}, {"id": "KO-134", "s": "국어", "t": "단편", "g": 3, "d": "상", "q": "단어의 의미가 변한 양상 중, 의미가 가리키는 범위가 좁아진 '의미 축소'의 예는?", "c": ["'얼굴'이 '몸 전체의 모습'에서 '눈, 코, 입이 있는 머리의 앞면'을 뜻하게 되었다.", "'다리'가 '사람이나 짐승의 다리'에서 '책상 다리'까지 뜻하게 되었다.", "'어리다'가 '어리석다'에서 '나이가 적다'를 뜻하게 되었다.", "'세수'가 '손을 씻다'에서 '얼굴을 씻다'까지 뜻하게 되었다.", "'어여쁘다'가 '불쌍하다'에서 '예쁘다'를 뜻하게 되었다."], "a": 1, "e": "'얼굴'은 원래 형체 전체를 뜻하다가 안면만을 가리키게 되어 의미가 축소되었다. '다리', '세수'는 의미 확대, '어리다', '어여쁘다'는 의미 이동의 예이다.", "p": ""}, {"id": "KO-135", "s": "국어", "t": "단편", "g": 3, "d": "상", "q": "광복 직후 시집 '청록집'을 함께 펴내어 '청록파'라고 불리는 시인들을 옳게 묶은 것은?", "c": ["박목월, 조지훈, 박두진", "김소월, 한용운, 이상화", "윤동주, 이육사, 심훈", "정지용, 김영랑, 박용철", "김수영, 신동엽, 김춘수"], "a": 1, "e": "박목월, 조지훈, 박두진은 자연을 소재로 한 시를 쓰며 1946년 '청록집'을 함께 펴냈다.", "p": ""}, {"id": "KO-136", "s": "국어", "t": "단편", "g": 3, "d": "상", "q": "정철의 가사 '속미인곡'에 대한 설명으로 옳은 것은?", "c": ["두 여인이 주고받는 대화 형식으로 임금을 그리워하는 마음을 노래하였다.", "관동 지방의 경치를 구경하고 쓴 기행 가사이다.", "자연에 묻혀 사는 즐거움을 노래한 강호 가사이다.", "한문으로 지은 한시이다.", "유배지의 풍속을 객관적으로 기록하였다."], "a": 1, "e": "'속미인곡'은 '사미인곡'의 속편으로, 두 여인의 대화 형식을 빌려 임(임금)에 대한 그리움을 우리말의 아름다움을 살려 노래한 작품이다.", "p": ""}, {"id": "KO-137", "s": "국어", "t": "단편", "g": 3, "d": "상", "q": "판소리에서 소리꾼이 가락을 붙이지 않고 이야기하듯 말로 설명하는 부분은?", "c": ["창", "아니리", "발림", "추임새", "더늠"], "a": 2, "e": "판소리는 노래인 '창', 말로 하는 '아니리', 몸짓인 '발림'으로 이루어진다. '추임새'는 고수나 청중이 흥을 돋우려고 넣는 소리이다.", "p": ""}, {"id": "KO-138", "s": "국어", "t": "수능", "g": 1, "d": "하", "q": "윗글의 중심 내용으로 가장 적절한 것은?", "c": ["꿀벌은 꽃의 색깔로 먹이의 양을 판단한다.", "꿀벌은 춤으로 먹이가 있는 방향과 거리를 동료에게 알린다.", "꿀벌은 소리를 내어 적이 다가옴을 알린다.", "꿀벌은 혼자서 먹이를 찾아 먹는다.", "꿀벌의 춤은 짝을 찾기 위한 행동이다."], "a": 2, "e": "글 전체가 꿀벌이 원형 춤과 꼬리 춤으로 먹이의 위치(거리·방향)를 알린다는 내용이다.", "p": "먹이를 찾은 꿀벌은 벌집으로 돌아와 독특한 춤을 춘다. 먹이가 가까이 있으면 원을 그리며 도는 '원형 춤'을 추고, 멀리 있으면 숫자 8 모양으로 돌며 엉덩이를 흔드는 '꼬리 춤'을 춘다. 꼬리 춤에서 몸을 흔들며 나아가는 방향과 수직 방향 사이의 각도는 태양을 기준으로 한 먹이의 방향을 나타내고, 엉덩이를 흔드는 시간이 길수록 먹이가 멀리 있음을 뜻한다. 동료 벌들은 이 춤을 따라 하며 정보를 익힌 뒤 먹이를 찾아 날아간다."}, {"id": "KO-139", "s": "국어", "t": "수능", "g": 1, "d": "중", "q": "윗글을 바탕으로 할 때, 꼬리 춤을 추는 꿀벌이 엉덩이를 흔드는 시간이 이전보다 두 배 길어졌다면 알 수 있는 것은?", "c": ["새로 찾은 먹이가 이전보다 멀리 있다.", "새로 찾은 먹이가 이전보다 가까이 있다.", "먹이의 방향이 태양 쪽으로 바뀌었다.", "먹이의 양이 두 배로 늘었다.", "먹이가 벌집 안에 있다."], "a": 1, "e": "지문에서 흔드는 시간이 길수록 먹이까지의 거리가 멀다고 하였다. 방향은 각도로, 양은 언급되지 않았다.", "p": "꿀벌의 꼬리 춤은 먹이의 위치를 알리는 신호이다. 춤을 추며 직선으로 나아가는 구간에서 꿀벌은 엉덩이를 좌우로 흔드는데, 이 직선 구간의 방향은 태양을 기준으로 한 먹이의 방향을, 엉덩이를 흔드는 시간은 먹이까지의 거리를 나타낸다. 흔드는 시간이 길수록 먹이는 더 멀리 있다."}, {"id": "KO-140", "s": "국어", "t": "수능", "g": 1, "d": "중", "q": "&lt;보기&gt;의 ㉠~㉤ 중 표준 발음이 바르지 <u>않은</u> 것은?<div class='box'>&lt;보기&gt;<br>㉠ 맑다[막따]  ㉡ 넓다[널따]  ㉢ 밟다[발따]  ㉣ 앉다[안따]  ㉤ 읊다[읍따]</div>", "c": ["㉠", "㉡", "㉢", "㉣", "㉤"], "a": 3, "e": "겹받침 'ㄼ'은 대체로 [ㄹ]로 발음하지만 '밟다'는 예외로 [밥:따]로 발음한다. 맑다[막따], 넓다[널따], 앉다[안따], 읊다[읍따]는 바른 발음이다.", "p": ""}, {"id": "KO-141", "s": "국어", "t": "수능", "g": 1, "d": "중", "q": "윗글의 화자가 처한 상황과 정서로 가장 적절한 것은?", "c": ["떠난 사람을 그리워하며 쓸쓸해하고 있다.", "새로운 출발에 대한 기대로 들떠 있다.", "자연의 아름다움에 감탄하고 있다.", "자신의 잘못을 반성하고 있다.", "다른 사람을 원망하며 분노하고 있다."], "a": 1, "e": "'가고 오지 못한다는' 사람을 떠올리며 '그립다'고 말하고 있으므로 이별 뒤의 그리움과 쓸쓸함이 드러난다.", "p": "그립다\n말을 할까\n하니 그리워\n\n그냥 갈까\n그래도\n다시 더 한 번……\n\n저 산에도 까마귀, 들에 까마귀\n서산에는 해 진다고\n지저귑니다.\n\n앞 강물, 뒷 강물\n흐르는 물은\n어서 따라 오라고 따라 가자고\n흘러도 연달아 흐릅디다려.\n<span class='src'>- 김소월, '가는 길'</span>"}, {"id": "KO-142", "s": "국어", "t": "수능", "g": 1, "d": "중", "q": "윗글에서 글쓴이가 주장하는 바로 가장 적절한 것은?", "c": ["급식 메뉴를 모두 학생 투표로 정해야 한다.", "급식 잔반을 줄이려면 학생이 먹을 양을 스스로 정할 수 있게 해야 한다.", "남긴 음식은 벌점으로 다스려야 한다.", "급식 시간을 줄여야 한다.", "급식을 없애고 도시락을 싸 와야 한다."], "a": 2, "e": "글쓴이는 배식 양을 학생이 고르게 하는 '자율 배식'을 제안하고 그 근거를 들고 있다.", "p": "우리 학교 급식실에서는 하루 평균 40kg이 넘는 음식이 버려진다. 학생마다 먹는 양이 다른데 모두에게 같은 양을 나누어 주기 때문이다. 실제로 지난달 시범 운영한 '자율 배식' 기간에는 학생들이 먹을 만큼만 담아 가면서 버려지는 음식이 절반 가까이 줄었다. 잔반을 줄이고 싶다면 벌점이나 잔소리보다, 학생이 자기 먹을 양을 스스로 정하게 하는 것이 효과적이다."}, {"id": "KO-143", "s": "국어", "t": "수능", "g": 1, "d": "중", "q": "&lt;보기&gt;의 밑줄 친 말 가운데 품사가 나머지와 <u>다른</u> 하나는?<div class='box'>&lt;보기&gt;<br>㉠ <u>새</u> 신발을 신었다.<br>㉡ 그는 <u>헌</u> 책을 모은다.<br>㉢ <u>모든</u> 학생이 모였다.<br>㉣ 하늘이 매우 <u>푸른</u> 날이다.<br>㉤ <u>저</u> 사람이 누구니?</div>", "c": ["㉠", "㉡", "㉢", "㉣", "㉤"], "a": 4, "e": "'푸른'은 형용사 '푸르다'의 활용형(관형사형)이다. 새, 헌, 모든, 저는 형태가 변하지 않고 체언을 꾸미는 관형사이다.", "p": ""}, {"id": "KO-144", "s": "국어", "t": "수능", "g": 1, "d": "중", "q": "윗글을 읽고 보인 반응으로 적절하지 <u>않은</u> 것은?", "c": ["'멍 때리기'를 할 때 뇌가 완전히 쉬고 있다는 것을 알 수 있어.", "샤워하다가 좋은 생각이 떠오르는 까닭을 설명할 수 있겠어.", "쉬는 시간에도 휴대 전화만 보면 뇌가 생각을 정리할 기회가 줄겠군.", "디폴트 모드 네트워크는 기억을 정리하는 데 관여하는구나.", "아무것도 안 하는 시간도 뇌에는 의미 있는 시간이구나."], "a": 1, "e": "지문에서 멍하게 있을 때도 뇌는 쉬지 않고 디폴트 모드 네트워크가 활발히 움직인다고 하였다.", "p": "우리가 아무 일도 하지 않고 멍하게 있을 때 뇌도 쉬고 있을까? 뇌 영상을 찍어 보면 오히려 특정 부위들이 함께 활발하게 움직인다. 과학자들은 이 연결망을 '디폴트 모드 네트워크'라고 부른다. 이 연결망은 지난 경험을 정리하여 기억으로 저장하고, 서로 관계없어 보이던 생각들을 이어 새로운 아이디어를 떠올리게 한다. 산책이나 샤워 중에 문득 좋은 생각이 나는 것도 이 때문이다. 쉴 틈 없이 화면을 들여다보면 이 연결망이 일할 기회를 빼앗는 셈이다."}, {"id": "KO-145", "s": "국어", "t": "수능", "g": 1, "d": "중", "q": "다음 대화에서 '민지'의 말하기 방식에 대한 설명으로 가장 적절한 것은?", "c": ["상대의 잘못을 따지며 사과를 요구하고 있다.", "상대의 감정을 먼저 인정한 뒤 자신의 요청을 전하고 있다.", "자신의 주장만 되풀이하고 있다.", "대화 주제를 갑자기 바꾸고 있다.", "상대의 말을 끊고 끼어들고 있다."], "a": 2, "e": "민지는 '많이 속상했겠다'며 공감한 뒤 '다음에는 미리 말해 주면 좋겠어'라고 요청을 '나 전달법'으로 전한다.", "p": "준호: 미안, 오늘 모둠 과제 못 했어. 집에 일이 생겨서 정신이 없었어.\n민지: 그랬구나. 갑자기 일이 생겨서 많이 속상했겠다. 그런데 나는 마감이 내일이라 조금 걱정돼. 다음에는 사정이 생기면 미리 말해 주면 좋겠어. 오늘 밤에 같이 나눠서 해 볼까?"}, {"id": "KO-146", "s": "국어", "t": "수능", "g": 1, "d": "상", "q": "윗글을 바탕으로 &lt;보기&gt;를 이해한 내용으로 가장 적절한 것은?<div class='box'>&lt;보기&gt;<br>어떤 마을에 하나뿐인 다리가 낡았다. 다리를 고치면 모든 주민이 혜택을 보지만, 주민들은 저마다 '누군가 돈을 내겠지' 하며 비용을 내지 않았다.</div>", "c": ["주민들은 비용을 내지 않고 혜택만 누리려는 무임승차를 하고 있다.", "다리는 돈을 낸 사람만 이용할 수 있는 사적 재화이다.", "주민들은 다리 수리를 원하지 않는다.", "시장에 맡기면 다리 수리가 적정하게 이루어진다.", "다리는 한 사람이 쓰면 다른 사람이 쓸 수 없다."], "a": 1, "e": "다리는 비용을 내지 않은 사람도 쓸 수 있는 공공재이므로, 각자 비용을 피하려는 무임승차 문제가 생긴다.", "p": "공공재는 여러 사람이 동시에 이용할 수 있고, 대가를 치르지 않은 사람을 이용에서 배제하기 어려운 재화이다. 이 때문에 사람들은 비용은 내지 않고 혜택만 누리려 하는데, 이를 '무임승차'라고 한다. 모두가 무임승차를 하려 들면 공공재는 시장에서 충분히 공급되지 못하므로, 정부가 세금을 걷어 직접 공급하는 경우가 많다."}, {"id": "KO-147", "s": "국어", "t": "수능", "g": 1, "d": "상", "q": "&lt;보기&gt;의 ㉠~㉤에 대한 설명으로 옳은 것은?<div class='box'>&lt;보기&gt;<br>㉠ 국물[궁물]  ㉡ 칼날[칼랄]  ㉢ 굳이[구지]  ㉣ 놓고[노코]  ㉤ 값[갑]</div>", "c": ["㉠은 앞 자음이 뒤 자음의 영향을 받아 비음으로 바뀐 비음화이다.", "㉡은 ㄹ이 ㄴ으로 바뀐 비음화이다.", "㉢은 두 음운이 하나로 합쳐진 축약이다.", "㉣은 한 음운이 없어진 탈락이다.", "㉤은 없던 음운이 새로 생긴 첨가이다."], "a": 1, "e": "㉠은 ㄱ이 뒤의 ㅁ 때문에 ㅇ으로 바뀐 비음화(교체)이다. ㉡은 ㄴ이 ㄹ로 바뀐 유음화, ㉢은 ㄷ이 ㅈ으로 바뀐 구개음화(교체), ㉣은 ㅎ과 ㄱ이 ㅋ으로 합쳐진 축약, ㉤은 겹받침 중 ㅅ이 없어진 탈락이다.", "p": ""}, {"id": "KO-148", "s": "국어", "t": "수능", "g": 1, "d": "상", "q": "윗글의 '나'에 대한 이해로 가장 적절한 것은?", "c": ["친구의 충고를 무시하고 화를 내고 있다.", "친구의 말을 듣고 자신의 행동을 돌아보고 있다.", "처음부터 자신의 잘못을 알고 있었다.", "선생님께 친구의 잘못을 알리려 한다.", "친구와 다시는 만나지 않기로 결심한다."], "a": 2, "e": "'나'는 서윤의 말을 듣고 '내가 한 말이 칼이 될 수도 있었다'며 자신을 돌아본다.", "p": "\"너는 그냥 농담이었겠지만, 걔는 하루 종일 그 말을 곱씹었대.\"\n서윤의 말에 나는 대꾸할 말을 찾지 못했다. 웃자고 던진 한마디였다. 다들 웃었고, 그 애도 웃었으니 괜찮은 줄 알았다. 집에 돌아오는 길, 버스 창에 비친 내 얼굴이 낯설었다. 내가 한 말이 누군가에게는 칼이 될 수도 있었다는 생각이 그제야 들었다. 나는 휴대 전화를 꺼내 한참 동안 메시지 창만 바라보았다.\n<span class='src'>(창작 소설)</span>"}, {"id": "KO-149", "s": "국어", "t": "수능", "g": 1, "d": "상", "q": "윗글을 바탕으로 할 때, &lt;보기&gt;의 결과를 설명한 내용으로 가장 적절한 것은?<div class='box'>&lt;보기&gt;<br>두 모둠에 같은 수학 문제를 주었다. A 모둠에는 \"너희는 머리가 좋구나\"라고, B 모둠에는 \"끝까지 애쓰는 모습이 좋구나\"라고 칭찬했다. 이어서 더 어려운 문제를 고르게 하자 B 모둠이 어려운 문제를 더 많이 골랐다.</div>", "c": ["능력을 칭찬받은 A 모둠은 더 어려운 문제에 적극 도전했다.", "칭찬의 내용은 학생의 선택에 영향을 주지 않았다.", "B 모둠은 자신의 능력이 고정되어 있다고 믿게 되었다.", "A 모둠은 실패해도 자신의 능력이 드러나지 않는다고 생각했다.", "노력을 칭찬받은 B 모둠은 실패를 배움의 과정으로 여겨 도전을 피하지 않았다."], "a": 5, "e": "지문에 따르면 노력을 칭찬받으면 성장 마음가짐을 갖게 되어 어려운 과제를 배움의 기회로 여긴다.", "p": "심리학자 드웩은 사람의 능력에 대한 믿음을 두 가지로 나누었다. 능력은 타고나 바뀌지 않는다고 믿는 '고정 마음가짐'과, 노력하면 자랄 수 있다고 믿는 '성장 마음가짐'이다. 고정 마음가짐을 가진 사람은 실패하면 능력이 모자란 것이 드러난다고 여겨 어려운 일을 피한다. 반면 성장 마음가짐을 가진 사람은 실패를 배우는 과정으로 받아들여 도전을 즐긴다. 드웩은 결과나 재능보다 과정과 노력을 칭찬할 때 성장 마음가짐이 길러진다고 보았다."}, {"id": "KO-150", "s": "국어", "t": "수능", "g": 1, "d": "상", "q": "윗글에 대한 설명으로 가장 적절한 것은?", "c": ["화자가 임과 함께 지내는 기쁨을 노래한다.", "자연을 정복하려는 의지를 드러낸다.", "대화체를 통해 갈등을 해결하는 과정을 보여 준다.", "현실 비판을 위해 풍자적 표현을 사용한다.", "계절의 변화에 따라 시상을 전개하며 임에 대한 그리움을 드러낸다."], "a": 5, "e": "봄(꽃)·여름·가을(달)·겨울(눈)의 흐름에 따라 '임'을 그리워하는 마음을 드러낸다.", "p": "봄에는 꽃이 피어 임 생각이 피고\n여름엔 비가 와서 임 생각이 젖네\n가을엔 달이 밝아 임 생각이 차고\n겨울엔 눈이 덮여 임 생각만 남네\n<span class='src'>(창작 시가)</span>"}, {"id": "KO-151", "s": "국어", "t": "수능", "g": 1, "d": "상", "q": "윗글의 서술상 특징으로 가장 적절한 것은?", "c": ["여러 학자의 견해를 시대순으로 나열하고 있다.", "개인적인 경험을 일기 형식으로 서술하고 있다.", "대상을 여러 기준에 따라 분류하고 있다.", "용어의 어원을 밝혀 개념을 설명하고 있다.", "통념을 제시한 뒤 반박하며 자신의 견해를 밝히고 있다."], "a": 5, "e": "'공부는 오래 앉아 있을수록 잘된다는 생각'을 먼저 제시하고 '그러나'로 반박한 뒤 짧게 나누어 쉬며 공부하는 것이 낫다는 견해를 밝힌다.", "p": "흔히 공부는 오래 앉아 있을수록 잘된다고 생각한다. 그러나 집중력은 시간이 흐를수록 떨어지기 마련이어서, 쉬지 않고 세 시간을 앉아 있는 것은 효율이 낮다. 오히려 25분쯤 집중한 뒤 5분 쉬는 식으로 시간을 나누면 집중력을 오래 유지할 수 있다. 중요한 것은 책상 앞에 앉아 있는 시간이 아니라 실제로 집중한 시간이다."}, {"id": "KO-152", "s": "국어", "t": "수능", "g": 1, "d": "상", "q": "&lt;보기&gt;의 문장 중 문장 성분의 호응이 자연스러운 것은?<div class='box'>&lt;보기&gt;<br>㉠ 내 꿈은 훌륭한 의사가 되고 싶다.<br>㉡ 그는 결코 약속을 어긴다.<br>㉢ 우리는 환경을 보호하고 자원을 아껴야 한다.<br>㉣ 이 약은 반드시 식후에 드시지 마세요.<br>㉤ 나는 친구에게 선물과 편지를 받았다고 들었다.</div>", "c": ["㉠", "㉡", "㉢", "㉣", "㉤"], "a": 3, "e": "㉢은 '환경을 보호하다', '자원을 아끼다'가 각각 자연스럽게 호응한다. ㉠은 '내 꿈은 ~되는 것이다', ㉡은 '결코 ~않는다', ㉣은 '반드시 식후에 드세요'로 고쳐야 한다. ㉤은 누가 받았는지 불분명하다.", "p": ""}, {"id": "KO-153", "s": "국어", "t": "수능", "g": 2, "d": "하", "q": "윗글의 내용과 일치하는 것은?", "c": ["점자는 한 칸에 점 열 개를 쓴다.", "한글 점자는 세종 대왕이 만들었다.", "점자는 눈으로 보기 위한 문자이다.", "점자는 손가락으로 만져서 읽는 문자이다.", "한글 점자는 아직 만들어지지 않았다."], "a": 4, "e": "지문에서 점자는 볼록 튀어나온 점을 손가락으로 만져 읽는 문자라고 하였다.", "p": "점자는 종이 위에 볼록하게 튀어나온 점을 손가락으로 만져 읽는 문자이다. 한 칸은 세로 3개, 가로 2개, 모두 6개의 점으로 이루어지며, 어떤 점이 튀어나왔는지에 따라 글자가 달라진다. 한글 점자는 1926년 송암 박두성이 만든 '훈맹정음'에서 시작되었다."}, {"id": "KO-154", "s": "국어", "t": "수능", "g": 2, "d": "중", "q": "윗글에 대한 이해로 적절하지 <u>않은</u> 것은?", "c": ["가짜 뉴스는 진짜 뉴스보다 늦게 퍼진다.", "사람들은 놀랍고 새로운 소식을 더 많이 공유한다.", "가짜 뉴스를 퍼뜨리는 데는 사람의 역할이 크다.", "공유하기 전에 출처를 확인하는 습관이 필요하다.", "감정을 강하게 자극하는 글은 더 빨리 퍼진다."], "a": 1, "e": "지문에서 가짜 뉴스는 진짜 뉴스보다 훨씬 빠르고 넓게 퍼진다고 하였다.", "p": "한 연구진이 누리 소통망에 올라온 소식 수만 건을 분석한 결과, 거짓 소식이 진짜 소식보다 훨씬 빠르고 넓게 퍼졌다. 거짓 소식은 대개 새롭고 놀라우며 분노나 두려움 같은 감정을 강하게 자극하기 때문이다. 흥미롭게도 거짓 소식을 퍼뜨린 주체는 자동 프로그램보다 사람인 경우가 더 많았다. 그러므로 무엇보다 공유 버튼을 누르기 전에 출처를 확인하는 개인의 습관이 중요하다."}, {"id": "KO-155", "s": "국어", "t": "수능", "g": 2, "d": "중", "q": "&lt;보기&gt;를 참고할 때, 밑줄 친 부분의 높임 표현이 바르게 쓰인 것은?<div class='box'>&lt;보기&gt;<br>주체를 높일 때는 '-(으)시-'를 쓰고, 말하는 대상(객체)을 높일 때는 '드리다, 여쭙다, 모시다' 같은 특수 어휘를 쓴다. 높여야 할 대상과 관련된 사물은 간접적으로 높일 수 있지만, 상대와 무관한 사물을 높여서는 안 된다.</div>", "c": ["주문하신 음료 <u>나오셨습니다</u>.", "선생님께 모르는 것을 <u>물어봤다</u>.", "아버지를 <u>데리고</u> 병원에 갔다.", "할머니께서는 귀가 <u>밝으십니다</u>.", "이 옷은 사이즈가 <u>없으세요</u>."], "a": 4, "e": "'귀'는 높일 대상(할머니)의 신체이므로 '밝으시다'로 간접 높임을 할 수 있다. 음료·사이즈는 높일 수 없고, 선생님께는 '여쭈어봤다', 아버지는 '모시고'가 맞다.", "p": ""}, {"id": "KO-156", "s": "국어", "t": "수능", "g": 2, "d": "중", "q": "윗글에서 화자가 '꽃'을 통해 말하고자 하는 바로 가장 적절한 것은?", "c": ["꽃은 사람의 손을 타지 않을 때 가장 아름답다.", "꽃은 피었다가 결국 시들어 사라진다.", "자연은 인간보다 위대하다.", "이름을 불러 줄 때 비로소 서로에게 의미 있는 존재가 된다.", "사람은 꽃처럼 혼자 살아가야 한다."], "a": 4, "e": "이름을 몰랐을 때는 '길가의 풀'에 지나지 않던 대상이 이름을 불러 주자 '꽃'이 되었다는 것은, 서로를 인정하고 관계를 맺을 때 의미 있는 존재가 됨을 뜻한다.", "p": "이름을 몰랐을 때 너는\n그저 길가의 풀이었다\n\n내가 네 이름을 불러 주던 날\n너는 고개를 들어\n꽃이 되었다\n\n<span class='src'>(창작 시)</span>"}, {"id": "KO-157", "s": "국어", "t": "수능", "g": 2, "d": "중", "q": "윗글의 내용을 바탕으로 할 때 빈칸에 들어갈 말로 가장 적절한 것은?", "c": ["주변 기온과 관계없이 일정하다", "주변 기온이 올라갈수록 길어진다", "주변 기온이 내려갈수록 짧아진다", "주변 기온이 내려갈수록 길어진다", "해마다 정확히 같은 날 끝난다"], "a": 4, "e": "변온 동물은 기온이 낮을수록 대사가 느려져 발생이 늦어진다고 하였으므로, 기온이 낮을수록 애벌레 시기가 길어진다.", "p": "곤충은 스스로 체온을 유지하지 못하는 변온 동물이어서, 주변 기온이 낮으면 몸속 화학 반응이 느려지고 높으면 빨라진다. 그래서 같은 종의 나비라도 따뜻한 해에는 알에서 어른벌레가 되기까지의 기간이 짧고, 서늘한 해에는 길어진다. 다시 말해 곤충의 애벌레 시기는 ________."}, {"id": "KO-158", "s": "국어", "t": "수능", "g": 2, "d": "상", "q": "윗글을 바탕으로 &lt;보기&gt;를 이해한 내용으로 가장 적절한 것은?<div class='box'>&lt;보기&gt;<br>A 회사는 새 제품의 가격을 처음에 높게 정했다가, 경쟁사가 비슷한 제품을 내놓자 가격을 크게 내렸다. 그러자 판매량이 크게 늘어 전체 판매 수입이 증가했다.</div>", "c": ["A 회사 제품의 수요는 가격에 대해 탄력적이었다.", "A 회사 제품의 수요는 가격에 대해 비탄력적이었다.", "가격을 내렸으므로 판매 수입은 반드시 줄어든다.", "경쟁 제품이 생기면 수요는 비탄력적으로 바뀐다.", "판매량의 변화율이 가격의 변화율보다 작았다."], "a": 1, "e": "가격을 내렸는데 판매 수입이 늘었다면 판매량의 변화율이 가격 변화율보다 커서 수요가 탄력적이었다는 뜻이다. 대체재가 생기면 수요는 더 탄력적이 된다.", "p": "수요의 가격 탄력성은 가격이 변할 때 수요량이 얼마나 변하는지를 나타낸다. 수요량의 변화율이 가격의 변화율보다 크면 '탄력적', 작으면 '비탄력적'이라 한다. 수요가 탄력적인 상품은 가격을 내리면 판매량이 크게 늘어 판매 수입이 증가하고, 비탄력적인 상품은 가격을 내리면 판매 수입이 줄어든다. 일반적으로 대신 쓸 수 있는 상품(대체재)이 많을수록 수요는 탄력적이다."}, {"id": "KO-159", "s": "국어", "t": "수능", "g": 2, "d": "상", "q": "&lt;보기&gt;의 탐구 결과로 가장 적절한 것은?<div class='box'>&lt;보기&gt;<br>[자료] ㉠ 먹이다, ㉡ 보이다, ㉢ 잡히다, ㉣ 울리다, ㉤ 쓰이다<br>[탐구] 각 단어가 문장에서 '사동(남에게 하게 함)'으로 쓰이는지 '피동(남에게 당함)'으로 쓰이는지 알아본다.</div>", "c": ["'먹이다'는 피동으로만 쓰인다.", "'잡히다'는 사동으로만 쓰인다.", "'울리다'는 피동으로만 쓰인다.", "'보이다'는 '산이 보인다'에서는 피동, '사진을 보였다'에서는 사동으로 쓰인다.", "'쓰이다'는 사동으로만 쓰인다."], "a": 4, "e": "'보이다'는 문맥에 따라 피동사(산이 보이다)와 사동사(친구에게 사진을 보이다)로 모두 쓰인다. '먹이다', '울리다'는 사동, '잡히다', '쓰이다'는 주로 피동으로 쓰인다.", "p": ""}, {"id": "KO-160", "s": "국어", "t": "수능", "g": 2, "d": "상", "q": "윗글의 '빛'과 '어둠'에 대한 이해로 가장 적절한 것은?", "c": ["'어둠'은 시련을, '빛'은 그 시련을 견디며 기다리는 희망을 뜻한다.", "'빛'과 '어둠'은 모두 절망을 나타낸다.", "'어둠'은 화자가 바라는 이상 세계이다.", "'빛'은 화자를 괴롭히는 대상이다.", "'빛'과 '어둠'은 계절의 변화를 나타낸다."], "a": 1, "e": "화자는 깊은 '어둠' 속에서도 '빛'을 기다리며 '꺼지지 않는' 마음을 다짐하므로, 어둠은 시련, 빛은 희망이다.", "p": "가장 깊은 어둠이 내린 밤에도\n나는 창을 닫지 않으리라\n어둠이 깊을수록 별은 밝고\n새벽은 언제나 가장 추운 때에 오나니\n내 가슴의 작은 등불 하나\n바람에 흔들릴지언정 꺼지지 않으리라\n<span class='src'>(창작 시)</span>"}, {"id": "KO-161", "s": "국어", "t": "수능", "g": 2, "d": "상", "q": "윗글의 논지 전개 방식으로 가장 적절한 것은?", "c": ["하나의 사례를 들어 일반 원리를 이끌어 낸다.", "개념의 정의를 여러 차례 바꾸어 가며 제시한다.", "역사적 사건을 시간 순서대로 서술한다.", "두 견해를 소개하고 각각의 한계를 지적한 뒤 절충적 관점을 제시한다.", "하나의 이론을 일방적으로 옹호한다."], "a": 4, "e": "본성론과 환경론을 차례로 소개하고 각각의 한계를 지적한 뒤, 둘이 상호 작용한다는 관점을 제시한다.", "p": "인간의 성격이 무엇으로 정해지는가에 대해 오랫동안 두 견해가 맞서 왔다. 본성론은 성격이 타고난 유전자로 결정된다고 보지만, 같은 유전자를 가진 일란성 쌍둥이도 성격이 다르다는 점을 설명하지 못한다. 환경론은 양육과 경험이 성격을 만든다고 보지만, 같은 집에서 자란 형제가 서로 다른 성격을 가지는 이유를 충분히 설명하지 못한다. 오늘날에는 타고난 기질이 환경과 서로 영향을 주고받으며 성격을 형성한다는 관점이 널리 받아들여진다."}, {"id": "KO-162", "s": "국어", "t": "수능", "g": 2, "d": "상", "q": "윗글을 읽은 학생이 &lt;보기&gt;에 대해 보인 반응으로 가장 적절한 것은?<div class='box'>&lt;보기&gt;<br>어떤 학생이 시험 전날 밤을 새워 공부했다. 다음 날 시험에서 전날 외운 내용이 잘 떠오르지 않았다.</div>", "c": ["밤을 새우면 해마의 기억이 더 단단해지겠군.", "잠을 자는 동안 기억이 굳어지는 과정을 거치지 못했기 때문이겠군.", "잠은 기억과는 아무 관계가 없겠군.", "잠을 자면 낮에 배운 내용이 모두 지워지겠군.", "짧은 시간에 몰아서 공부할수록 오래 기억되겠군."], "a": 2, "e": "지문에서 잠자는 동안 해마의 기억이 대뇌 겉질로 옮겨져 장기 기억으로 굳어진다고 했으므로, 잠을 자지 않으면 이 과정이 이루어지지 못한다.", "p": "낮에 배운 내용은 먼저 뇌의 '해마'에 임시로 저장된다. 그리고 깊은 잠을 자는 동안 해마는 그날의 기억을 되풀이해 재생하면서 대뇌 겉질로 옮겨 보내고, 이 과정을 거친 기억은 오래 남는 장기 기억으로 굳어진다. 과학자들은 이를 '기억의 공고화'라고 부른다. 충분히 자지 못하면 공고화가 제대로 이루어지지 않아 배운 내용을 잊기 쉽다."}, {"id": "KO-163", "s": "국어", "t": "수능", "g": 2, "d": "상", "q": "윗글의 인물 '김 노인'에 대한 설명으로 가장 적절한 것은?", "c": ["새로 생긴 건물을 보며 기뻐하고 있다.", "젊은이들에게 마을을 떠나라고 권하고 있다.", "마을의 변화에 아무 관심이 없다.", "아파트 건설을 앞장서서 추진하고 있다.", "변해 가는 마을의 모습 앞에서 지난 시절에 대한 아쉬움을 느끼고 있다."], "a": 5, "e": "김 노인은 팽나무가 베어진 자리를 오래 바라보며 '그 나무 그늘에서 다들 모였었는데'라고 중얼거린다. 사라진 공동체의 기억에 대한 아쉬움이 드러난다.", "p": "포클레인이 지나간 자리에는 팽나무 밑동만 하얗게 남아 있었다. 김 노인은 지팡이를 짚고 한참 그 자리에 서 있었다. \"여름이면 그 나무 그늘에서 다들 모였었는데…….\" 그의 중얼거림은 공사장의 소음에 묻혀 누구의 귀에도 닿지 않았다. 멀리서 새 아파트 분양 현수막이 바람에 펄럭였다.\n<span class='src'>(창작 소설)</span>"}, {"id": "KO-164", "s": "국어", "t": "수능", "g": 2, "d": "상", "q": "&lt;보기&gt;의 ㉠~㉤ 가운데 단어의 형성 방법이 나머지와 <u>다른</u> 하나는?<div class='box'>&lt;보기&gt;<br>㉠ 덮밥  ㉡ 늦잠  ㉢ 접칼  ㉣ 검붉다  ㉤ 높이</div>", "c": ["㉠", "㉡", "㉢", "㉣", "㉤"], "a": 5, "e": "'높이'는 어근 '높-'에 접미사 '-이'가 붙은 파생어이다. 덮밥, 늦잠, 접칼, 검붉다는 용언의 어간이 어미 없이 다른 어근과 결합한 비통사적 합성어이다.", "p": ""}, {"id": "KO-165", "s": "국어", "t": "수능", "g": 2, "d": "상", "q": "윗글에서 알 수 있는 내용으로 적절하지 <u>않은</u> 것은?", "c": ["마이크가 바깥 소음을 받아들인다.", "노이즈 캔슬링은 소음을 더 큰 소리로 덮어 들리지 않게 한다.", "소음과 반대 모양의 소리를 만들어 낸다.", "두 소리가 만나 서로 상쇄된다.", "규칙적인 저음에서 효과가 크다."], "a": 2, "e": "노이즈 캔슬링은 소음을 덮는 것이 아니라 반대 위상의 소리로 소음을 상쇄하는 원리이다.", "p": "'노이즈 캔슬링' 이어폰은 소음을 더 큰 소리로 덮어 버리는 것이 아니다. 이어폰 바깥의 작은 마이크가 주변 소음을 받아들이면, 칩이 그 소리와 마루와 골이 정반대인 소리를 만들어 낸다. 두 소리가 만나면 마루와 골이 서로 맞물려 상쇄되어 소음이 줄어든다. 이 방식은 비행기 엔진 소리처럼 규칙적인 저음에서 효과가 크고, 사람 말소리처럼 갑자기 변하는 소리에는 효과가 작다."}, {"id": "KO-166", "s": "국어", "t": "수능", "g": 3, "d": "하", "q": "윗글의 글쓴이가 &lt;보기&gt;의 상황에 대해 할 말로 가장 적절한 것은?<div class='box'>&lt;보기&gt;<br>지수는 친구의 블로그 글이 마음에 들어 출처를 밝히지 않고 자기 과제 보고서에 그대로 옮겨 적었다.</div>", "c": ["남의 글을 쓸 때는 출처를 밝혀야 표절이 되지 않아.", "인터넷에 있는 글은 누구나 자유롭게 써도 돼.", "친구의 글이니 출처를 밝히지 않아도 돼.", "보고서는 길게 쓸수록 좋은 점수를 받아.", "블로그 글은 저작권이 없어."], "a": 1, "e": "글쓴이는 인터넷 글에도 저작권이 있으며, 남의 글을 쓸 때는 출처를 밝혀야 한다고 말한다.", "p": "인터넷에 올라 있는 글이라고 해서 누구나 마음대로 써도 되는 것은 아니다. 블로그 글이나 누리 소통망의 게시물에도 쓴 사람의 저작권이 있다. 다른 사람의 글을 인용할 때는 반드시 출처를 밝혀야 하며, 출처 없이 자기 글처럼 쓰는 것은 표절이다."}, {"id": "KO-167", "s": "국어", "t": "수능", "g": 3, "d": "중", "q": "윗글에 대한 이해로 가장 적절한 것은?", "c": ["백색 소음은 모든 사람의 집중력을 똑같이 높인다.", "백색 소음은 특정 주파수만 담고 있다.", "조용할수록 작은 소리는 덜 거슬린다.", "백색 소음은 다른 소음을 덜 거슬리게 하여 집중에 도움을 줄 수 있다.", "백색 소음은 음악보다 항상 효과가 크다."], "a": 4, "e": "지문에서 백색 소음이 주변의 작은 소리를 덮어 덜 거슬리게 한다고 했다. 사람마다 효과가 다르다고도 하였다.", "p": "빗소리나 파도 소리처럼 여러 주파수의 소리가 고르게 섞여 있는 소리를 '백색 소음'이라 한다. 아주 조용한 방에서는 시계 초침 소리 같은 작은 소리도 크게 거슬리지만, 백색 소음이 깔려 있으면 이런 소리가 묻혀 덜 신경 쓰인다. 그래서 백색 소음을 들으며 공부하면 집중이 잘된다는 사람이 많다. 다만 효과는 사람마다 달라서, 오히려 방해가 된다는 사람도 있다."}, {"id": "KO-168", "s": "국어", "t": "수능", "g": 3, "d": "중", "q": "&lt;보기&gt;의 설명을 바탕으로 할 때, ㉠~㉤ 중 '-음'이 붙어 명사가 된 것은?<div class='box'>&lt;보기&gt;<br>'-음'은 용언 어간에 붙어 명사를 만드는 접미사로 쓰이기도 하고, 서술 기능을 유지한 채 명사처럼 쓰이게 하는 명사형 어미로 쓰이기도 한다. 명사형 어미로 쓰이면 앞에 부사어의 꾸밈을 받거나 서술어 기능을 한다.<br>㉠ 그는 밝게 <u>웃음</u>으로 답했다.<br>㉡ 아이가 크게 <u>웃음</u>이 보기 좋다.<br>㉢ 그가 범인<u>임</u>이 밝혀졌다.<br>㉣ 그가 매일 새벽에 <u>달림</u>을 알았다.<br>㉤ 그는 <u>믿음</u>이 깊은 사람이다.</div>", "c": ["㉠", "㉡", "㉢", "㉣", "㉤"], "a": 5, "e": "㉤의 '믿음'은 관형어 '깊은'과 관계를 맺는 명사(파생 명사)이다. ㉠은 '밝게', ㉡은 '크게', ㉣은 '매일 새벽에'의 꾸밈을 받고, ㉢은 '범인이다'의 서술 기능을 유지하므로 명사형 어미이다.", "p": ""}, {"id": "KO-169", "s": "국어", "t": "수능", "g": 3, "d": "중", "q": "윗글에서 화자의 태도로 가장 적절한 것은?", "c": ["벼슬길에 나아가지 못한 처지를 한탄한다.", "임금에 대한 그리움을 드러낸다.", "부귀영화를 멀리하고 자연 속에서 소박하게 사는 삶에 만족한다.", "자연의 위협 앞에서 두려움을 느낀다.", "세상의 부조리를 날카롭게 풍자한다."], "a": 3, "e": "'십 년을 경영하여 초려삼간 지어 내니', '청풍 명월'과 함께 사는 모습에서 자연 속 소박한 삶(안빈낙도)에 만족하는 태도가 드러난다.", "p": "십 년을 경영하여 초려삼간 지어 내니\n나 한 칸 달 한 칸에 청풍 한 칸 맡겨 두고\n강산은 들일 데 없으니 둘러 두고 보리라\n<span class='src'>- 송순의 시조 (현대어 표기)</span>"}, {"id": "KO-170", "s": "국어", "t": "수능", "g": 3, "d": "중", "q": "윗글을 바탕으로 &lt;보기&gt;를 설명한 내용으로 가장 적절한 것은?<div class='box'>&lt;보기&gt;<br>어떤 도시가 교통 체증을 줄이려고 도로를 넓혔다. 몇 년 뒤, 도로는 다시 예전처럼 막히기 시작했다.</div>", "c": ["도로를 넓히면 교통 체증은 영원히 사라진다.", "교통 체증은 도로 폭과 아무 관련이 없다.", "도로를 넓히면 대중교통 이용자가 늘어난다.", "도로가 넓어지자 차를 몰고 나오는 사람이 늘어 새로운 교통 수요가 생겨났다.", "차량의 수는 도로 넓이와 관계없이 일정하다."], "a": 4, "e": "지문의 '유발 수요'에 따르면 도로를 넓혀 운전이 편해지면 새로운 차량 이용이 생겨 결국 다시 막힌다.", "p": "도로가 막히면 흔히 도로를 넓히자는 주장이 나온다. 그러나 교통 연구자들은 '유발 수요'에 주목한다. 도로가 넓어져 운전이 편해지면, 대중교통을 타던 사람이나 다른 시간·다른 길로 다니던 사람까지 그 길로 차를 몰고 나온다. 그 결과 늘어난 도로 용량은 곧 새로운 차량으로 채워지고, 체증은 다시 시작된다."}, {"id": "KO-171", "s": "국어", "t": "수능", "g": 3, "d": "중", "q": "윗글의 서술상 특징으로 가장 적절한 것은?", "c": ["등장인물들의 대화만으로 사건을 전개한다.", "현재와 과거를 교차하여 인물의 내면을 드러낸다.", "작품 밖 서술자가 여러 인물의 속마음을 두루 서술한다.", "공간의 이동에 따라 사건이 빠르게 진행된다.", "사건을 우화적으로 표현하여 교훈을 준다."], "a": 2, "e": "'지금'의 장면(빈 교실)과 '그때'의 장면(친구들과 떠들던 기억)이 번갈아 나타나며 '나'의 그리움을 드러낸다.", "p": "졸업식이 끝난 교실은 텅 비어 있었다. 나는 창가 맨 뒷자리에 앉았다. 그때 이 자리에서 우리는 쉬는 시간마다 창밖 운동장을 내려다보며 쓸데없는 이야기로 웃곤 했다. 지금 창밖에는 아무도 없다. 그때는 이 교실이 좁다고 투덜거렸는데, 지금은 너무 넓어 보인다. 나는 책상 모서리에 새겨진 우리 이름의 첫 글자들을 손가락으로 오래 쓸어 보았다.\n<span class='src'>(창작 소설)</span>"}, {"id": "KO-172", "s": "국어", "t": "수능", "g": 3, "d": "중", "q": "윗글의 핵심 개념인 '넛지'의 사례로 가장 적절한 것은?", "c": ["흡연자에게 벌금을 크게 물린다.", "과속한 운전자의 면허를 정지한다.", "설탕이 든 음료의 판매를 법으로 금지한다.", "운동하지 않는 학생에게 벌점을 준다.", "구내식당에서 채소 반찬을 눈높이에 두어 학생들이 더 많이 고르게 한다."], "a": 5, "e": "넛지는 금지나 강한 보상·처벌 없이 선택의 환경을 바꾸어 바람직한 선택을 유도하는 것이다. 나머지는 금지나 처벌에 해당한다.", "p": "'넛지(nudge)'는 '팔꿈치로 슬쩍 찌르다'라는 뜻이다. 경제학자 탈러는 사람들에게 무언가를 강요하거나 금지하지 않으면서, 선택의 환경을 살짝 바꾸어 더 나은 선택을 하도록 이끄는 방법을 넛지라고 불렀다. 선택의 자유는 그대로 두되, 사람들이 자연스럽게 바람직한 쪽을 고르게 만드는 것이 핵심이다."}, {"id": "KO-173", "s": "국어", "t": "수능", "g": 3, "d": "상", "q": "윗글을 바탕으로 &lt;보기&gt;의 실험 결과를 해석한 내용으로 가장 적절한 것은?<div class='box'>&lt;보기&gt;<br>두 집단에게 같은 수술의 결과를 알려 주었다. A 집단에는 '생존율 90%', B 집단에는 '사망률 10%
