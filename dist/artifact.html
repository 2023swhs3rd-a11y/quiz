100 = 60, 총부양비 = 100이다. 노령화 지수 = 노년층/유소년층×100 = 150이다. 노년층 비율이 20% 이상이므로 초고령 사회이다.", "p": ""}, {"id": "SO-134", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "여름에 덥고 비가 많이 내리는 아시아 계절풍 기후 지역에서 주로 재배하는 주식 작물은?", "c": ["밀", "옥수수", "감자", "벼(쌀)", "올리브"], "a": 4, "e": "벼는 자라는 동안 높은 기온과 많은 물이 필요하여 동아시아·동남아시아·남아시아의 계절풍 지역에서 많이 재배된다.", "p": ""}, {"id": "SO-135", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "냉장고의 냉매 등으로 쓰였으며, 성층권의 오존층을 파괴하는 물질은?", "c": ["이산화 탄소", "메테인", "질소", "수증기", "염화 플루오린화 탄소(프레온 가스)"], "a": 5, "e": "오존층이 파괴되면 지표에 닿는 자외선이 늘어 피부암, 백내장 등이 증가한다. 국제 사회는 몬트리올 의정서로 오존층 파괴 물질의 사용을 규제하였다.", "p": ""}, {"id": "SO-136", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "오랜 가뭄과 지나친 방목·경작 때문에 사막 주변의 초원이 황폐해지는 현상은?", "c": ["지구 온난화", "산성비", "오존층 파괴", "열섬 현상", "사막화"], "a": 5, "e": "사막화는 사하라 사막 남쪽의 사헬 지대 등에서 심각하며, 국제 사회는 사막화 방지 협약을 맺어 대응하고 있다.", "p": ""}, {"id": "SO-137", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "열대림이 파괴될 때 나타나는 결과로 가장 적절한 것은?", "c": ["이산화 탄소 흡수량이 늘어난다.", "야생 동물의 서식지가 넓어진다.", "토양 침식이 줄어든다.", "생물 종 다양성이 줄고 지구 온난화가 심해진다.", "지구의 평균 기온이 낮아진다."], "a": 4, "e": "열대림은 많은 생물의 서식지이자 이산화 탄소를 흡수하는 곳이다. 열대림이 사라지면 생물 다양성이 줄고 온실 효과가 강해진다.", "p": ""}, {"id": "SO-138", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "모든 국민이 성별, 종교, 사회적 신분 등에 의해 부당하게 차별받지 않을 권리는?", "c": ["자유권", "참정권", "청구권", "사회권", "평등권"], "a": 5, "e": "평등권은 합리적 이유 없는 차별을 금지하는 권리로, 다른 기본권을 보장받기 위한 전제가 된다.", "p": ""}, {"id": "SO-139", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "우리나라에서 법률을 만들고 고치는 입법권을 가진 국가 기관은?", "c": ["정부", "국회", "법원", "헌법 재판소", "감사원"], "a": 2, "e": "입법권은 국회, 행정권은 대통령을 수반으로 하는 정부, 사법권은 법원이 가진다.", "p": ""}, {"id": "SO-140", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "사회 구성원이 법과 규칙을 스스로 지키려는 태도를 무엇이라 하는가?", "c": ["시민 불복종", "준법 의식", "저항권", "권력 분립", "기본권 제한"], "a": 2, "e": "준법 의식은 다른 사람의 권리를 존중하고 사회 질서를 유지하는 바탕이 된다.", "p": ""}, {"id": "SO-141", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "어떤 것을 선택함으로써 포기한 것들 가운데 가장 가치가 큰 것을 무엇이라 하는가?", "c": ["편익", "매몰 비용", "기회비용", "균형 가격", "희소성"], "a": 3, "e": "합리적 선택이란 기회비용보다 편익이 큰 쪽을 고르는 것이다.", "p": ""}, {"id": "SO-142", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "신용을 잘 관리해야 하는 까닭으로 가장 적절한 것은?", "c": ["신용이 좋으면 세금을 내지 않아도 되기 때문에", "신용이 나쁘면 대출이나 신용 카드 발급 등 금융 거래에 제한을 받기 때문에", "신용은 한 번 정해지면 바뀌지 않기 때문에", "신용이 좋을수록 대출 이자가 높아지기 때문에", "신용은 현금으로만 쌓을 수 있기 때문에"], "a": 2, "e": "신용은 돈을 빌려 쓰고 약속대로 갚을 수 있는 능력이다. 연체가 잦으면 신용이 떨어져 대출이 어렵거나 더 높은 이자를 내야 한다.", "p": ""}, {"id": "SO-143", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "질병, 사고 등 미래에 일어날지 모르는 위험에 대비하여 미리 일정한 돈을 내고, 사고가 나면 보상을 받는 금융 상품은?", "c": ["보험", "예금", "주식", "채권", "펀드"], "a": 1, "e": "보험은 수익을 얻기보다 미래의 위험에 대비하는 것이 주된 목적이다.", "p": ""}, {"id": "SO-144", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "소득이나 재산의 격차가 커져 중간 계층이 줄고 상층과 하층으로 나뉘는 현상은?", "c": ["고령화", "도시화", "세계화", "사회 양극화", "정보화"], "a": 4, "e": "사회 양극화가 심해지면 계층 간 갈등이 커지고 사회 통합이 어려워진다. 이를 완화하려면 사회 복지 제도와 공정한 기회 보장이 필요하다.", "p": ""}, {"id": "SO-145", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "세계화가 진행되면서 나타나는 현상으로 가장 적절한 것은?", "c": ["국경을 넘는 상품, 자본, 사람의 이동이 활발해진다.", "국가 간 교류가 줄어든다.", "다국적 기업의 활동이 위축된다.", "국가 간 상호 의존성이 낮아진다.", "각 나라가 자급자족 경제로 돌아간다."], "a": 1, "e": "세계화는 교통·통신의 발달로 세계가 하나의 생활권으로 묶이는 현상이다. 교류가 늘면서 국가 간 상호 의존성도 커진다.", "p": ""}, {"id": "SO-146", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "지속 가능한 사회를 위한 개인의 노력으로 적절하지 <u>않은</u> 것은?", "c": ["유행에 맞추어 옷을 자주 사서 한두 번 입고 버리기", "일회용품 사용 줄이기", "가까운 거리는 걷거나 자전거 타기", "쓰지 않는 전자 제품의 플러그 뽑기", "재활용품 분리배출하기"], "a": 1, "e": "자원을 아끼고 쓰레기를 줄이는 생활 습관이 지속 가능한 발전에 도움이 된다. 필요 이상의 소비는 자원 낭비와 환경 오염을 일으킨다.", "p": ""}, {"id": "SO-147", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "저출산 문제를 완화하기 위한 대책으로 가장 적절한 것은?", "c": ["정년을 앞당긴다.", "육아 휴직을 확대하고 보육 시설을 늘린다.", "노인 일자리를 줄인다.", "양육비 지원을 축소한다.", "근로 시간을 늘린다."], "a": 2, "e": "저출산을 완화하려면 출산·양육에 따른 경제적 부담을 줄이고 일과 가정을 함께 돌볼 수 있는 환경을 만들어야 한다.", "p": ""}, {"id": "SO-148", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "행복의 조건 가운데 '질 높은 정주 환경'에 해당하는 것은?", "c": ["높은 소득과 안정된 일자리", "국민의 정치 참여 보장", "깨끗한 자연환경과 편리한 교통·의료·문화 시설", "타인에 대한 배려와 나눔의 실천", "자아 성찰"], "a": 3, "e": "정주 환경은 사람이 일정한 곳에 자리 잡고 사는 데 필요한 환경으로, 주거·교통·교육·의료·문화 시설과 쾌적한 자연환경을 포함한다.", "p": ""}, {"id": "SO-149", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "도덕적 고려의 범위를 동식물뿐 아니라 흙, 물까지 포함하는 대지(땅) 전체로 넓혀야 한다는 '대지 윤리'를 주장한 사람은?", "c": ["베이컨", "데카르트", "칸트", "레오폴드", "벤담"], "a": 4, "e": "레오폴드는 인간을 대지 공동체의 정복자가 아니라 평범한 구성원으로 보아야 한다고 주장한 생태 중심주의 사상가이다. 베이컨과 데카르트는 인간 중심주의적 자연관을 대표한다.", "p": ""}, {"id": "SO-150", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "화산 지대에 사는 사람들이 화산을 이용하는 모습으로 적절하지 <u>않은</u> 것은?", "c": ["지열로 전기를 생산한다.", "온천을 관광 자원으로 활용한다.", "비옥한 화산재 토양에서 농사를 짓는다.", "넓은 갯벌에서 양식업을 한다.", "독특한 화산 지형을 관광지로 개발한다."], "a": 4, "e": "화산 지대는 위험하지만 지열 발전, 온천, 비옥한 토양, 관광 자원 등의 이점이 있다. 갯벌은 조수 간만의 차가 큰 해안에 발달하는 지형이다.", "p": ""}, {"id": "SO-151", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "산업화·도시화로 사람이 기계의 부속품처럼 여겨지거나 노동에서 보람을 느끼지 못하게 되는 현상은?", "c": ["문화 지체", "정보 격차", "도심 공동화", "인간 소외", "지역 이기주의"], "a": 4, "e": "대량 생산 체제에서는 분업이 세분화되고 효율성이 강조되면서 인간이 수단처럼 취급되는 인간 소외가 나타날 수 있다.", "p": ""}, {"id": "SO-152", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "대도시의 인구와 기능이 주변 지역으로 퍼져 나가는 '교외화'의 결과로 가장 적절한 것은?", "c": ["대도시의 통근권이 좁아진다.", "주변 지역의 인구가 감소한다.", "대도시 도심의 상주인구가 늘어난다.", "대도시와 주변 지역 사이의 교통량이 줄어든다.", "대도시와 주변 지역이 하나의 생활권으로 묶인 대도시권이 형성된다."], "a": 5, "e": "교외화가 진행되면 대도시 주변에 주거 지역과 위성 도시가 발달하고, 대도시로 통근·통학하는 범위인 대도시권이 넓어진다.", "p": ""}, {"id": "SO-153", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "고속 철도 등 교통망이 새로 생기면서 중소 도시의 인구와 상권이 대도시로 빨려 들어가는 현상은?", "c": ["풍선 효과", "열섬 현상", "역도시화", "빨대 효과", "님비 현상"], "a": 4, "e": "교통이 발달하면 지역 간 접근성이 좋아지지만, 대도시로 소비와 인구가 쏠려 중소 도시의 경제가 위축되는 빨대 효과가 나타날 수 있다.", "p": ""}, {"id": "SO-154", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "오늘날 강조되는 '연대권'(3세대 인권)에 해당하는 것은?", "c": ["신체의 자유, 재산권", "선거권, 피선거권", "교육을 받을 권리, 근로의 권리", "재판을 받을 권리", "깨끗한 환경에서 살 권리, 평화롭게 살 권리"], "a": 5, "e": "인권은 자유권·참정권(1세대)에서 사회권(2세대)으로, 다시 인류 전체의 협력이 필요한 환경권·평화권·발전권 등 연대권(3세대)으로 넓어져 왔다.", "p": ""}, {"id": "SO-155", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "인권 침해나 차별 행위를 조사하고 관련 기관에 시정을 권고하는 독립된 국가 기관은?", "c": ["헌법 재판소", "국민 권익 위원회", "선거 관리 위원회", "공정 거래 위원회", "국가 인권 위원회"], "a": 5, "e": "국가 인권 위원회는 입법·행정·사법 어디에도 속하지 않는 독립 기구로, 인권 침해와 차별 행위를 조사하고 개선을 권고한다. 국민 권익 위원회는 행정 기관의 잘못으로 인한 고충 민원을 처리한다.", "p": ""}, {"id": "SO-156", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "공장이 폐수를 강에 흘려보내 주민에게 피해를 주는 것과 같은 '부정적 외부 효과'에 대한 설명으로 옳은 것은?", "c": ["사회적으로 바람직한 수준보다 적게 생산된다.", "보조금을 주어 생산을 늘려야 한다.", "다른 사람에게 이익을 주고도 대가를 받지 못한다.", "사회적으로 바람직한 수준보다 많이 생산되므로, 세금 부과나 규제로 줄일 필요가 있다.", "시장에 맡기면 저절로 해결된다."], "a": 4, "e": "부정적 외부 효과는 남에게 피해를 주고도 비용을 치르지 않는 것으로, 생산자가 사회적 비용을 고려하지 않아 과다 생산된다. 정부는 세금, 벌금, 규제 등으로 이를 줄이려 한다.", "p": ""}, {"id": "SO-157", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "기업의 담합이나 시장 지배력 남용 같은 불공정 거래 행위를 감시하고 제재하는 우리나라 기관은?", "c": ["금융 감독원", "한국은행", "국가 인권 위원회", "국세청", "공정 거래 위원회"], "a": 5, "e": "공정 거래 위원회는 독과점과 불공정 거래를 규제하여 시장의 공정한 경쟁을 지키는 역할을 한다.", "p": ""}, {"id": "SO-158", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "주식과 채권을 비교한 설명으로 옳은 것은?", "c": ["주식은 만기가 있고 채권은 만기가 없다.", "주식은 배당을 받을 수 있고, 채권은 정해진 이자를 받을 수 있다.", "주식은 채권보다 안전성이 높다.", "채권은 주식회사만 발행할 수 있다.", "주식 보유자는 회사에 돈을 빌려준 채권자이다."], "a": 2, "e": "주식 보유자는 회사의 주주로서 배당과 시세 차익을 기대하고, 채권 보유자는 채권자로서 이자와 원금을 받는다. 일반적으로 채권이 주식보다 안전성이 높고 수익성은 낮다.", "p": ""}, {"id": "SO-159", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "'업적에 따른 분배'에 대한 설명으로 옳은 것은?", "c": ["기본적 욕구를 충족하는 것을 가장 중시한다.", "모든 사람에게 똑같이 분배한다.", "평가 기준이 주관적이어서 객관화하기 어렵다.", "생산 의욕을 떨어뜨려 경제적 효율성이 낮아진다.", "성취동기를 높여 생산성이 향상되지만, 경쟁이 과열되고 약자에 대한 배려가 부족할 수 있다."], "a": 5, "e": "업적에 따른 분배는 성과를 객관적으로 평가하기 쉽고 동기를 부여하는 장점이 있지만, 서로 다른 종류의 업적을 비교하기 어렵고 빈부 격차가 커질 수 있다.", "p": ""}, {"id": "SO-160", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "개인선과 공동선의 관계에 대한 설명으로 가장 적절한 것은?", "c": ["개인선을 위해 공동선은 언제나 무시해도 된다.", "공동선을 위해 개인의 권리는 얼마든지 제한할 수 있다.", "개인선과 공동선은 결코 양립할 수 없다.", "개인의 권리 보장과 공동체에 대한 책임은 서로 보완하며 조화를 이루어야 한다.", "공동선은 개인의 행복과 아무 관련이 없다."], "a": 4, "e": "개인의 권리만 내세우면 이기주의로, 공동체만 앞세우면 집단주의로 흐를 수 있다. 개인의 자유와 공동체의 발전은 서로 조화를 이루어야 한다.", "p": ""}, {"id": "SO-161", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "문화 변동의 내재적 요인에 해당하는 사례는?", "c": ["불교가 중국을 거쳐 우리나라에 전해졌다.", "외국 드라마를 보고 그 나라 음식을 먹게 되었다.", "식민 지배로 지배국의 언어를 쓰게 되었다.", "세종이 한글을 창제하였다.", "유학생이 외국의 스포츠를 들여왔다."], "a": 4, "e": "내재적 요인에는 이전에 없던 것을 새로 만드는 발명과 이미 있던 것을 찾아내는 발견이 있다. 한글 창제는 발명이며, 나머지는 문화 전파(외재적 요인)의 사례이다.", "p": ""}, {"id": "SO-162", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "세계화로 나타날 수 있는 문제점으로 가장 적절한 것은?", "c": ["국가 간 교류의 감소", "강대국의 문화가 널리 퍼져 지역의 고유문화가 약해지는 문화 획일화", "기업 간 경쟁의 약화", "상품 선택 폭의 축소", "국제기구의 역할 축소"], "a": 2, "e": "세계화는 문화 교류를 늘리지만 특정 문화가 세계를 지배하여 문화 다양성이 줄어들 수 있고, 국가 간 빈부 격차가 커지는 문제도 낳는다.", "p": ""}, {"id": "SO-163", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "천연가스에 대한 설명으로 옳은 것은?", "c": ["석탄·석유보다 연소할 때 대기 오염 물질을 적게 내놓으며, 액화 기술의 발달로 소비가 늘었다.", "산업 혁명 시기의 주요 동력원이었다.", "고갈될 염려가 없는 재생 에너지이다.", "주로 제철 공업의 원료로 쓰인다.", "화석 연료에 해당하지 않는다."], "a": 1, "e": "천연가스는 화석 연료 가운데 비교적 깨끗한 에너지로, 냉동 액화 기술과 수송 수단의 발달로 가정용·발전용 소비가 크게 늘었다. 산업 혁명기의 동력원은 석탄이다.", "p": ""}, {"id": "SO-164", "s": "통합사회", "t": "단편", "g": 3, "d": "상", "q": "유해 폐기물이 국가 간에 이동하는 것을 규제하기 위해 맺은 국제 환경 협약은?", "c": ["바젤 협약", "람사르 협약", "몬트리올 의정서", "생물 다양성 협약", "사막화 방지 협약"], "a": 1, "e": "바젤 협약은 선진국의 유해 폐기물이 개발 도상국으로 넘어가는 것을 막기 위한 협약이다. 람사르 협약은 습지 보호, 몬트리올 의정서는 오존층 보호를 위한 것이다.", "p": ""}, {"id": "SO-165", "s": "통합사회", "t": "단편", "g": 3, "d": "상", "q": "'모든 생명체는 저마다 고유한 방식으로 자기 삶을 실현하려는 목적론적 삶의 중심'이라고 본 테일러의 관점은?", "c": ["인간 중심주의", "동물 중심주의", "공리주의", "도구적 자연관", "생명 중심주의"], "a": 5, "e": "테일러는 식물을 포함한 모든 생명체가 내재적 가치를 지닌다고 본 생명 중심주의자이다. 싱어와 레건은 동물의 도덕적 지위를 강조하였고, 레오폴드는 생태계 전체를 고려하는 생태 중심주의를 주장하였다.", "p": ""}, {"id": "SO-166", "s": "통합사회", "t": "수능", "g": 3, "d": "상", "q": "다음 사례에서 문제가 되는 기본권 제한의 한계(과잉 금지의 원칙)로 가장 적절한 것은?<div class='box'>○○시는 야간 소음을 줄인다는 이유로 밤 9시 이후 시내 모든 음식점의 영업을 전면 금지하였다. 법원은 \"소음이 심한 업소만 규제하거나 방음 시설을 설치하게 하는 등 덜 제한적인 방법이 있다.\"라고 판단하였다.</div>", "c": ["목적의 정당성", "침해의 최소성", "법률에 의한 제한", "국민 주권", "권력 분립"], "a": 2, "e": "기본권을 제한할 때는 목적이 정당하고, 수단이 적합하며, 피해를 최소화하는 방법을 택해야 하고, 얻는 공익이 침해되는 사익보다 커야 한다. 사례는 더 약한 수단이 있는데도 과도하게 제한하여 침해의 최소성에 어긋난다.", "p": ""}, {"id": "SO-167", "s": "통합사회", "t": "수능", "g": 3, "d": "상", "q": "다른 조건이 일정할 때, 다음 두 변화가 동시에 일어나면 커피 시장에 나타날 변화는?<div class='box'>• 주요 커피 생산국에 가뭄이 들어 원두 수확량이 크게 줄었다.<br>• 커피가 건강에 좋다는 연구 결과가 발표되어 커피를 찾는 사람이 늘었다.</div>", "c": ["균형 가격은 상승하고, 균형 거래량의 변화는 알 수 없다.", "균형 가격은 하락하고, 균형 거래량은 증가한다.", "균형 거래량은 증가하고, 균형 가격의 변화는 알 수 없다.", "균형 가격과 균형 거래량이 모두 하락한다.", "균형 거래량은 감소하고, 균형 가격의 변화는 알 수 없다."], "a": 1, "e": "공급 감소와 수요 증가는 모두 가격을 올리는 요인이다. 거래량은 공급 감소로 줄고 수요 증가로 늘어나므로 두 변화의 크기에 따라 달라진다.", "p": ""}, {"id": "SO-168", "s": "통합사회", "t": "수능", "g": 3, "d": "상", "q": "다음 자료에 대한 설명으로 옳은 것은? (단, 갑은 세 가지 중 하나만 선택할 수 있다.)<div class='box'>갑이 주말 하루 동안 할 수 있는 일과 그 일에서 얻는 만족(편익)을 돈으로 나타내면 다음과 같다.<br>아르바이트 8만 원, 영화 관람 5만 원, 독서 3만 원</div>", "c": ["아르바이트를 선택할 때의 기회비용은 5만 원이다.", "영화 관람을 선택할 때의 기회비용은 3만 원이다.", "독서를 선택할 때의 기회비용은 5만 원이다.", "독서를 선택하는 것이 합리적이다.", "아르바이트를 선택할 때의 기회비용은 영화 관람과 독서의 편익을 합한 8만 원이다."], "a": 1, "e": "기회비용은 포기한 대안 가운데 가장 가치가 큰 것이다. 아르바이트를 고르면 기회비용은 영화 관람의 5만 원이고, 영화 관람이나 독서를 고르면 기회비용은 아르바이트의 8만 원이다. 편익이 기회비용보다 큰 아르바이트가 합리적 선택이다.", "p": ""}, {"id": "SO-169", "s": "통합사회", "t": "단편", "g": 3, "d": "상", "q": "100만 원을 연 10%의 이자율로 2년 동안 복리로 예금하면 만기에 받는 원금과 이자의 합은? (단, 세금은 없다.)", "c": ["110만 원", "120만 원", "121만 원", "130만 원", "144만 원"], "a": 3, "e": "복리는 이자에도 이자가 붙는다. 1년 뒤 110만 원이 되고, 2년 뒤에는 110만 원의 10%인 11만 원이 더해져 121만 원이 된다. 단리라면 120만 원이다.", "p": ""}, {"id": "SO-170", "s": "통합사회", "t": "단편", "g": 3, "d": "상", "q": "원/달러 환율이 하락할 때(원화 가치 상승) 나타나는 일반적인 영향으로 옳은 것은?", "c": ["수입 원자재의 원화 표시 가격이 내려가 국내 물가 안정에 도움이 된다.", "우리나라 수출품의 가격 경쟁력이 높아진다.", "우리나라 국민의 미국 여행 경비 부담이 커진다.", "달러화 빚이 있는 기업의 상환 부담이 커진다.", "외국인 관광객의 우리나라 여행 경비 부담이 줄어든다."], "a": 1, "e": "환율이 내리면 같은 달러를 더 적은 원화로 살 수 있어 수입품 가격과 해외여행 경비, 외채 상환 부담이 줄어든다. 반면 수출품의 달러 표시 가격이 올라 수출에는 불리하다.", "p": ""}, {"id": "SO-171", "s": "통합사회", "t": "수능", "g": 3, "d": "상", "q": "다음 갑, 을의 입장에 대한 설명으로 옳은 것은?<div class='box'>갑: 재능과 가정 환경은 우연히 주어진 것이다. 따라서 불평등은 가장 불리한 처지의 사람에게 이익이 될 때에만 허용되어야 한다.<br>을: 개인이 정당하게 얻은 재산을 국가가 세금으로 거두어 다른 사람에게 나누어 주는 것은 강제 노동과 다를 바 없다.</div>", "c": ["갑은 모든 사람의 소득이 똑같아야 한다고 본다.", "을은 국가가 필요 없다고 본다.", "갑은 을과 달리 복지를 위한 국가의 재분배 정책을 정당하다고 본다.", "을은 갑과 달리 개인의 기본적 자유를 인정하지 않는다.", "갑과 을 모두 사회 전체의 행복 총량을 분배의 기준으로 삼는다."], "a": 3, "e": "갑은 롤스, 을은 노직이다. 롤스는 차등의 원칙에 따라 최소 수혜자를 위한 재분배를 인정하지만, 노직은 이를 소유권 침해로 본다. 노직도 치안·국방 등을 맡는 최소 국가는 인정하며, 두 사람 모두 개인의 자유를 중시하고 공리주의를 비판한다.", "p": ""}, {"id": "SO-172", "s": "통합사회", "t": "단편", "g": 3, "d": "상", "q": "왈처의 '복합 평등'에 대한 설명으로 옳은 것은?", "c": ["모든 재화를 하나의 기준에 따라 똑같이 나누어야 한다.", "돈이 많은 사람이 정치권력도 갖는 것이 정의롭다.", "재화마다 서로 다른 분배 기준이 적용되어야 하며, 한 영역의 우위가 다른 영역을 지배해서는 안 된다.", "분배는 시장의 자유로운 거래에만 맡겨야 한다.", "사회 전체의 효용을 최대화하는 분배가 정의롭다."], "a": 3, "e": "왈처는 돈, 권력, 명예, 교육 등 사회적 가치는 각각 고유한 영역과 분배 기준이 있다고 보았다. 예를 들어 부를 가졌다고 해서 정치권력이나 의료 혜택까지 독점해서는 안 된다는 것이다.", "p": ""}, {"id": "SO-173", "s": "통합사회", "t": "단편", "g": 3, "d": "상", "q": "공리주의적 분배관에 대해 제기되는 비판으로 가장 적절한 것은?", "c": ["사회 전체의 이익을 위해 소수나 개인의 권리가 희생될 수 있다.", "개인의 소유권을 지나치게 강조한다.", "공동체의 전통을 지나치게 강조한다.", "결과보다 동기만을 중시한다.", "사회 전체의 행복에 관심이 없다."], "a": 1, "e": "공리주의는 사회 전체의 행복 총량을 늘리는 것을 정의롭다고 보므로, 다수의 이익을 위해 소수의 권리를 침해하는 일을 정당화할 수 있다는 비판을 받는다.", "p": ""}, {"id": "SO-174", "s": "통합사회", "t": "단편", "g": 3, "d": "상", "q": "로크의 사회 계약설에 대한 설명으로 옳은 것은?", "c": ["자연 상태는 '만인의 만인에 대한 투쟁' 상태이다.", "국민은 모든 권리를 군주에게 완전히 넘겨야 한다.", "국가 권력은 신에게서 나온다.", "주권은 대표될 수 없으므로 직접 민주주의만 정당하다.", "국가가 생명·자유·재산의 권리를 침해하면 국민은 저항할 수 있다."], "a": 5, "e": "로크는 사람들이 자연권을 더 잘 보장받기 위해 계약으로 국가를 세웠으므로, 국가가 이를 어기면 저항할 수 있다고 보았다. 투쟁 상태와 권리의 전면 양도는 홉스, 직접 민주주의 강조는 루소의 주장이다.", "p": ""}, {"id": "SO-175", "s": "통합사회", "t": "수능", "g": 3, "d": "상", "q": "(가)~(다)에 해당하는 문화 변동의 양상을 옳게 짝지은 것은?<div class='box'>(가) 우리나라에는 한의원과 서양식 병원이 함께 운영되고 있다.<br>(나) 아메리카의 일부 원주민 사회는 유럽인의 지배를 받으며 고유 언어를 잃고 지배국의 언어만 쓰게 되었다.<br>(다) 서양의 침대에 우리의 온돌을 결합한 돌침대가 만들어졌다.</div>", "c": ["(가) 문화 병존, (나) 문화 동화, (다) 문화 융합", "(가) 문화 병존, (나) 문화 융합, (다) 문화 동화", "(가) 문화 융합, (나) 문화 동화, (다) 문화 병존", "(가) 문화 동화, (나) 문화 병존, (다) 문화 융합", "(가) 문화 융합, (나) 문화 병존, (다) 문화 동화"], "a": 1, "e": "두 문화가 나란히 존재하면 병존, 한 문화가 다른 문화에 흡수되어 사라지면 동화, 두 문화가 결합하여 새로운 문화가 생기면 융합이다.", "p": ""}, {"id": "SO-176", "s": "통합사회", "t": "단편", "g": 3, "d": "상", "q": "인구 변천 모형에서 인구가 가장 빠르게 늘어나는 단계의 특징은?", "c": ["출생률은 높은 상태로 유지되는데 사망률이 급격히 낮아진다.", "출생률과 사망률이 모두 높다.", "출생률과 사망률이 모두 낮다.", "출생률이 사망률보다 낮아진다.", "출생률이 급격히 낮아지고 사망률은 높아진다."], "a": 1, "e": "의료 기술 발달과 위생 개선으로 사망률이 빠르게 떨어지지만 출생률은 여전히 높은 단계에서 인구가 급증한다. 이후 출생률도 낮아지면서 인구 증가가 느려진다.", "p": ""}, {"id": "SO-177", "s": "통합사회", "t": "단편", "g": 3, "d": "상", "q": "석탄과 석유를 비교한 설명으로 옳은 것은?", "c": ["석탄은 석유보다 세계 에너지 소비에서 차지하는 비중이 크다.", "석유는 산업 혁명 초기의 주된 동력원이었다.", "석탄은 주로 자동차 연료로 쓰인다.", "석탄은 석유보다 연소할 때 오염 물질을 적게 내놓는다.", "석유는 석탄보다 특정 지역에 치우쳐 분포하여 국제 이동량이 많다."], "a": 5, "e": "석유는 서남아시아 등에 편중되어 있어 생산지와 소비지가 달라 국제 이동이 활발하다. 석탄은 비교적 고르게 분포하며 산업 혁명기의 동력원이었고, 지금은 주로 제철용과 발전용으로 쓰인다.", "p": ""}, {"id": "SO-178", "s": "통합사회", "t": "단편", "g": 3, "d": "상", "q": "2015년 국제 연합(UN)이 2030년까지 인류가 함께 달성하기로 정한 17개 목표를 무엇이라 하는가?", "c": ["새천년 개발 목표(MDGs)", "교토 의정서", "지속 가능 발전 목표(SDGs)", "의제 21", "람사르 협약"], "a": 3, "e": "지속 가능 발전 목표는 빈곤 퇴치, 양질의 교육, 기후 변화 대응 등 17개 목표로 이루어져 있으며, 2000년에 정한 새천년 개발 목표를 이어받았다.", "p": ""}, {"id": "SO-179", "s": "통합사회", "t": "수능", "g": 3, "d": "상", "q": "다음 글의 관점에서 지지할 주장으로 가장 적절한 것은?<div class='box'>어떤 사회의 관습이든 그 사회 안에서는 옳은 것이므로, 다른 사회의 사람이 그것을 평가해서는 안 된다는 주장이 있다. 그러나 이 주장을 그대로 받아들이면 노예제나 여성에 대한 폭력적 관습도 비판할 수 없게 된다. 문화의 차이는 존중하되, 인간의 존엄성과 같이 어느 사회에서나 지켜야 할 가치가 있음을 인정해야 한다.</div>", "c": ["모든 문화적 관습은 예외 없이 존중되어야 한다.", "문화의 다양성을 존중하면서도 보편 윤리의 관점에서 문화를 성찰해야 한다.", "자기 문화를 기준으로 다른 문화의 우열을 가려야 한다.", "선진국의 문화를 기준으로 삼아 다른 문화를 바꾸어야 한다.", "문화를 평가할 수 있는 기준은 어디에도 없다."], "a": 2, "e": "글은 윤리 상대주의로 흐르는 극단적 문화 상대주의를 비판하고, 문화 상대주의의 태도를 지니되 보편 윤리에 비추어 문화를 성찰해야 한다고 본다.", "p": ""}, {"id": "SO-180", "s": "통합사회", "t": "수능", "g": 3, "d": "상", "q": "다음 자료에 대한 분석으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?<div class='box'>갑국은 50년 사이에 합계 출산율이 4.5명에서 0.9명으로 낮아지고, 65세 이상 인구 비율은 4%에서 21%로 높아졌다.</div><div class='box'>&lt;보기&gt;<br>ㄱ. 갑국은 현재 초고령 사회에 해당한다.<br>ㄴ. 청장년층의 노년 부양 부담이 커졌을 것이다.<br>ㄷ. 노동력 부족을 완화하기 위해 정년을 앞당길 필요가 있다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "65세 이상 인구 비율이 20% 이상이면 초고령 사회이다(ㄱ). 노년층 비율이 높아지면 부양 부담이 커진다(ㄴ). 노동력 부족에 대응하려면 정년을 늦추거나 고령층 고용을 늘려야 하므로 ㄷ은 옳지 않다.", "p": ""}, {"id": "SC-001", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "빅뱅 이후 초기 우주에서 만들어져 현재 우주에서 질량 비로 가장 많은 원소는?", "c": ["헬륨", "탄소", "산소", "수소", "철"], "a": 4, "e": "빅뱅 직후 우주에서는 주로 수소와 헬륨이 만들어졌으며, 현재 우주를 이루는 원소의 질량 비는 수소 약 74%, 헬륨 약 24%이다.", "p": ""}, {"id": "SC-002", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "주기율표에서 같은 족에 속한 원소들의 화학적 성질이 비슷한 까닭은?", "c": ["원자가 전자 수가 같기 때문", "원자량이 같기 때문", "전자 껍질 수가 같기 때문", "중성자 수가 같기 때문", "양성자 수가 같기 때문"], "a": 1, "e": "화학적 성질은 주로 원자가 전자에 의해 결정된다. 같은 족 원소는 원자가 전자 수가 같아 화학적 성질이 비슷하다. 같은 주기 원소는 전자 껍질 수가 같다.", "p": ""}, {"id": "SC-003", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "다음 중 이온 결합으로 이루어진 물질은?", "c": ["물(H₂O)", "염화 나트륨(NaCl)", "이산화 탄소(CO₂)", "메테인(CH₄)", "산소(O₂)"], "a": 2, "e": "염화 나트륨은 금속 원소인 나트륨이 전자를 잃어 Na⁺, 비금속 원소인 염소가 전자를 얻어 Cl⁻이 된 뒤 정전기적 인력으로 결합한 이온 결합 물질이다. 나머지는 비금속 원소끼리 전자쌍을 공유한 공유 결합 물질이다.", "p": ""}, {"id": "SC-004", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "지구 시스템에서 오존층이 속한 권역은?", "c": ["지권", "수권", "생물권", "기권", "외권"], "a": 4, "e": "오존층은 대기권의 성층권(약 20~30 km 높이)에 있으므로 기권에 속한다. 오존층은 태양의 자외선을 흡수하여 지표의 생명체를 보호한다.", "p": ""}, {"id": "SC-005", "s": "통합과학", "t": "단편", "g": 1, "d": "중", "q": "히말라야산맥이 형성된 판 경계의 종류는?", "c": ["해양판과 해양판이 멀어지는 발산형 경계", "대륙판과 대륙판이 충돌하는 수렴형 경계", "해양판이 대륙판 아래로 섭입하는 수렴형 경계", "두 판이 어긋나는 보존형 경계", "대륙판이 갈라지는 발산형 경계"], "a": 2, "e": "히말라야산맥은 인도·오스트레일리아판과 유라시아판이 충돌하는 대륙판-대륙판 수렴형 경계에서 형성된 습곡 산맥이다.", "p": ""}, {"id": "SC-006", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "질량이 2 kg인 물체에 알짜힘이 작용하여 3 m/s²의 가속도로 운동할 때, 물체에 작용한 알짜힘의 크기는?", "c": ["1.5 N", "3 N", "5 N", "6 N", "9 N"], "a": 4, "e": "뉴턴 운동 제2법칙 F = ma에 따라 F = 2 kg × 3 m/s² = 6 N이다.", "p": ""}, {"id": "SC-007", "s": "통합과학", "t": "단편", "g": 1, "d": "중", "q": "자동차의 에어백이 충돌 시 탑승자를 보호하는 원리로 옳은 것은?", "c": ["충격량을 증가시킨다.", "운동량 변화량을 크게 한다.", "탑승자의 질량을 줄인다.", "충돌 시간을 늘려 탑승자가 받는 평균 힘을 줄인다.", "충돌 직전의 속력을 증가시킨다."], "a": 4, "e": "충격량(= 평균 힘 × 충돌 시간)은 운동량의 변화량과 같다. 같은 운동량 변화에서 충돌 시간을 길게 하면 탑승자가 받는 평균 힘이 줄어든다.", "p": ""}, {"id": "SC-008", "s": "통합과학", "t": "단편", "g": 1, "d": "중", "q": "세포막의 주요 구성 성분은?", "c": ["셀룰로스와 단백질", "DNA와 RNA", "녹말과 지방", "인지질과 단백질", "키틴과 단백질"], "a": 4, "e": "세포막은 인지질 2중층에 단백질이 파묻히거나 걸쳐 있는 구조로 되어 있다. 셀룰로스는 식물 세포벽의 주성분이다.", "p": ""}, {"id": "SC-009", "s": "통합과학", "t": "단편", "g": 1, "d": "중", "q": "효소가 생명체 내 화학 반응의 속도를 빠르게 하는 원리로 옳은 것은?", "c": ["반응열을 증가시킨다.", "활성화 에너지를 낮춘다.", "반응물의 양을 늘린다.", "생성물의 에너지를 높인다.", "반응 후 효소가 소모되어 에너지를 공급한다."], "a": 2, "e": "효소는 생체 촉매로 반응의 활성화 에너지를 낮추어 반응 속도를 빠르게 한다. 효소는 반응 전후에 변하지 않으므로 재사용된다.", "p": ""}, {"id": "SC-010", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "DNA의 유전 정보가 RNA로 옮겨지는 과정을 무엇이라 하는가?", "c": ["복제", "번역", "분열", "돌연변이", "전사"], "a": 5, "e": "DNA의 유전 정보를 RNA로 옮기는 과정은 전사, RNA의 정보에 따라 단백질을 합성하는 과정은 번역이다.", "p": ""}, {"id": "SC-011", "s": "통합과학", "t": "단편", "g": 1, "d": "중", "q": "철광석에서 철을 얻는 반응 Fe₂O₃ + 3CO → 2Fe + 3CO₂에 대한 설명으로 옳은 것은?", "c": ["Fe₂O₃는 산화된다.", "CO는 환원된다.", "산화와 환원은 따로 일어난다.", "CO₂는 반응물이다.", "Fe₂O₃는 산소를 잃고 환원된다."], "a": 5, "e": "Fe₂O₃는 산소를 잃고 Fe로 환원되고, CO는 산소를 얻어 CO₂로 산화된다. 산화와 환원은 항상 동시에 일어난다.", "p": ""}, {"id": "SC-012", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "산과 염기가 반응하여 물이 생성되는 중화 반응의 알짜 이온 반응식으로 옳은 것은?", "c": ["Na⁺ + Cl⁻ → NaCl", "H⁺ + OH⁻ → H₂O", "2H⁺ + O²⁻ → H₂O", "H₂ + O₂ → H₂O₂", "Na + H₂O → NaOH"], "a": 2, "e": "중화 반응은 산의 수소 이온(H⁺)과 염기의 수산화 이온(OH⁻)이 1 : 1로 반응하여 물을 생성하는 반응이다.", "p": ""}, {"id": "SC-013", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "발전기에서 전기 에너지가 만들어지는 원리는?", "c": ["정전기 유도", "빛의 굴절", "전자기 유도", "열의 대류", "핵분열"], "a": 3, "e": "발전기는 코일 속에서 자석을 회전시켜 코일을 지나는 자기 선속을 변화시킬 때 유도 전류가 흐르는 전자기 유도 현상을 이용한다.", "p": ""}, {"id": "SC-014", "s": "통합과학", "t": "단편", "g": 1, "d": "중", "q": "태양이 에너지를 만들어 내는 주된 과정은?", "c": ["우라늄의 핵분열", "수소의 핵융합", "탄소의 연소", "중력에 의한 수축만으로 발생", "방사성 붕괴"], "a": 2, "e": "태양 중심부에서는 수소 원자핵 4개가 융합하여 헬륨 원자핵 1개를 만드는 수소 핵융합 반응이 일어나며, 이때 줄어든 질량이 에너지로 바뀐다.", "p": ""}, {"id": "SC-015", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "생태계에서 광합성을 통해 빛에너지를 화학 에너지로 전환하는 구성 요소는?", "c": ["1차 소비자", "2차 소비자", "분해자", "생산자", "비생물적 요인"], "a": 4, "e": "식물과 같은 생산자는 광합성으로 빛에너지를 유기물의 화학 에너지로 전환하며, 이 에너지가 먹이 사슬을 따라 소비자에게 전달된다.", "p": ""}, {"id": "SC-016", "s": "통합과학", "t": "수능", "g": 1, "d": "상", "q": "농도가 같은 묽은 염산(HCl) 20 mL에 수산화 나트륨(NaOH) 수용액 10 mL를 넣었다. 혼합 용액에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>ㄱ. 혼합 용액은 산성이다.<br>ㄴ. 혼합 용액 속 Na⁺의 수는 Cl⁻의 수보다 적다.<br>ㄷ. 반응 과정에서 물이 생성되었다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 5, "e": "같은 농도에서 HCl 20 mL의 H⁺ 수는 NaOH 10 mL의 OH⁻ 수의 2배이므로 H⁺가 남아 산성이다(ㄱ). 구경꾼 이온의 수는 Cl⁻(20 단위) > Na⁺(10 단위)이다(ㄴ). H⁺와 OH⁻가 반응하여 물이 생성되었다(ㄷ).", "p": ""}, {"id": "SC-017", "s": "통합과학", "t": "수능", "g": 1, "d": "중", "q": "질량이 1 kg이고 4 m/s의 속력으로 운동하던 물체가 벽에 부딪쳐 0.2초 만에 정지하였다. 이 충돌에서 물체가 받은 충격량의 크기와 평균 힘의 크기를 옳게 짝지은 것은?", "c": ["4 N·s, 0.8 N", "0.8 N·s, 4 N", "20 N·s, 4 N", "4 N·s, 20 N", "4 N·s, 2 N"], "a": 4, "e": "충격량 = 운동량의 변화량 = 1 kg × (4 − 0) m/s = 4 N·s. 평균 힘 = 충격량 ÷ 충돌 시간 = 4 ÷ 0.2 = 20 N.", "p": ""}, {"id": "SC-018", "s": "통합과학", "t": "수능", "g": 1, "d": "중", "q": "해령 부근의 해양 지각에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>ㄱ. 해령에서 멀어질수록 해양 지각의 나이가 적어진다.<br>ㄴ. 해령에서 멀어질수록 해저 퇴적물의 두께가 두꺼워진다.<br>ㄷ. 해령은 두 판이 서로 멀어지는 발산형 경계이다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 4, "e": "해령에서 새로운 해양 지각이 생성되어 양쪽으로 이동하므로 해령에서 멀어질수록 지각의 나이가 많아진다(ㄱ 틀림). 오래된 지각일수록 퇴적물이 쌓인 시간이 길어 두께가 두껍다(ㄴ). 해령은 판이 서로 멀어지는 발산형 경계이다(ㄷ).", "p": ""}, {"id": "SC-019", "s": "통합과학", "t": "수능", "g": 1, "d": "중", "q": "어떤 생태계에서 각 영양 단계의 에너지양이 생산자 1000, 1차 소비자 100, 2차 소비자 10(상댓값)이었다. 이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>ㄱ. 1차 소비자의 에너지 효율은 10%이다.<br>ㄴ. 상위 영양 단계로 갈수록 에너지양이 줄어든다.<br>ㄷ. 전달되지 않은 에너지는 모두 다음 단계에서 다시 사용된다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "에너지 효율 = (현 영양 단계의 에너지양 ÷ 전 영양 단계의 에너지양) × 100 = 100/1000 × 100 = 10%(ㄱ). 각 단계에서 호흡 등으로 에너지가 열로 방출되어 상위 단계로 갈수록 에너지양이 줄어든다(ㄴ). 열로 방출된 에너지는 생태계에서 재사용되지 않으므로 ㄷ은 틀리다.", "p": ""}, {"id": "SC-020", "s": "통합과학", "t": "수능", "g": 1, "d": "상", "q": "어떤 2중 가닥 DNA에서 구아닌(G)이 전체 염기의 20%를 차지할 때, 아데닌(A)이 차지하는 비율은?", "c": ["10%", "20%", "30%", "40%", "60%"], "a": 3, "e": "2중 가닥 DNA에서 A는 T와, G는 C와 상보적으로 결합하므로 G = C = 20%이다. 남은 60%를 A와 T가 똑같이 나누므로 A = 30%이다.", "p": ""}, {"id": "SC-021", "s": "통합과학", "t": "수능", "g": 1, "d": "중", "q": "코일에 검류계를 연결하고 막대자석을 코일 속으로 넣었다 빼는 실험을 하였다. 이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>ㄱ. 자석을 코일 속에 가만히 두어도 유도 전류가 계속 흐른다.<br>ㄴ. 자석을 넣을 때와 뺄 때 유도 전류의 방향은 반대이다.<br>ㄷ. 자석을 빠르게 움직일수록 유도 전류의 세기가 커진다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 4, "e": "자석이 정지해 있으면 자기 선속이 변하지 않아 유도 전류가 흐르지 않는다(ㄱ 틀림). 넣을 때와 뺄 때 자기 선속의 변화 방향이 반대이므로 전류 방향도 반대이다(ㄴ). 자기 선속이 빠르게 변할수록 유도 전류가 세다(ㄷ).", "p": ""}, {"id": "SC-022", "s": "통합과학", "t": "수능", "g": 1, "d": "중", "q": "원자 번호 11인 나트륨(Na)과 원자 번호 17인 염소(Cl)에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>ㄱ. Na의 원자가 전자 수는 1이다.<br>ㄴ. Cl은 전자 1개를 얻어 Cl⁻이 되면 비활성 기체(Ar)와 같은 전자 배치를 갖는다.<br>ㄷ. Na와 Cl은 같은 족에 속한다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "Na의 전자 배치는 2, 8, 1로 원자가 전자가 1개이다(ㄱ). Cl(2, 8, 7)은 전자 1개를 얻으면 2, 8, 8로 Ar과 같아진다(ㄴ). 두 원소는 모두 3주기 원소이지만 Na는 1족, Cl은 17족이므로 ㄷ은 틀리다.", "p": ""}, {"id": "SC-023", "s": "통합과학", "t": "수능", "g": 1, "d": "상", "q": "다음은 광합성과 세포 호흡의 반응을 나타낸 것이다. 이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>(가) 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ (빛에너지 흡수)<br>(나) C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O (에너지 방출)<br><br>ㄱ. (가)에서 CO₂는 환원된다.<br>ㄴ. (나)에서 포도당은 산화된다.<br>ㄷ. (가)와 (나)는 모두 산화 환원 반응이다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 5, "e": "광합성(가)에서 CO₂는 수소를 얻어 포도당이 되므로 환원되고(ㄱ), 세포 호흡(나)에서 포도당은 산소와 결합하여 CO₂가 되므로 산화된다(ㄴ). 두 반응 모두 산화와 환원이 동시에 일어나는 산화 환원 반응이다(ㄷ).", "p": ""}, {"id": "SC-024", "s": "통합과학", "t": "수능", "g": 1, "d": "하", "q": "온실 효과에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>ㄱ. 대기 중의 온실 기체는 지표가 방출하는 적외선 일부를 흡수하였다가 다시 방출한다.<br>ㄴ. 온실 효과가 전혀 없다면 지구의 평균 기온은 현재보다 높을 것이다.<br>ㄷ. 대기 중 이산화 탄소 농도가 증가하면 온실 효과가 강화된다.</div>", "c": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "온실 기체(이산화 탄소, 메테인, 수증기 등)는 지표가 방출하는 적외선을 흡수했다가 다시 방출하여 지표를 데운다(ㄱ). 온실 효과가 없다면 지구의 평균 기온은 현재(약 15 ℃)보다 훨씬 낮은 약 −18 ℃ 정도가 될 것이므로 ㄴ은 틀리다. 이산화 탄소 농도가 증가하면 온실 효과가 강화된다(ㄷ).", "p": ""}, {"id": "SC-025", "s": "통합과학", "t": "단편", "g": 1, "d": "상", "q": "질량이 태양보다 매우 큰 별의 중심부에서 핵융합 반응으로 만들어질 수 있는 가장 무거운 원소는?", "c": ["철", "헬륨", "탄소", "산소", "우라늄"], "a": 1, "e": "별 내부의 핵융합으로는 철까지만 만들어진다. 철보다 무거운 금, 우라늄 등의 원소는 초신성 폭발 과정 등에서 만들어진다.", "p": ""}, {"id": "SC-026", "s": "통합과학", "t": "단편", "g": 1, "d": "상", "q": "높이 5 m인 곳에서 가만히 놓은 물체가 지면에 도달하는 순간의 속력은? (단, 중력 가속도는 10 m/s²이고 공기 저항은 무시한다.)", "c": ["5 m/s", "10 m/s", "15 m/s", "20 m/s", "50 m/s"], "a": 2, "e": "역학적 에너지 보존에 의해 mgh = ½mv²이므로 v = √(2gh) = √(2 × 10 × 5) = 10 m/s이다.", "p": ""}, {"id": "SC-027", "s": "통합과학", "t": "단편", "g": 1, "d": "상", "q": "세포막을 경계로 물 분자가 용질의 농도가 낮은 쪽에서 높은 쪽으로 이동하는 현상은?", "c": ["확산", "삼투", "능동 수송", "증산 작용", "모세관 현상"], "a": 2, "e": "삼투는 물이 세포막과 같은 선택적 투과성 막을 통해 용질 농도가 낮은 쪽에서 높은 쪽으로 이동하는 현상이다. 짠 용액에 넣은 세포에서 물이 빠져나가는 것이 그 예이다.", "p": ""}, {"id": "SC-028", "s": "통합과학", "t": "단편", "g": 2, "d": "하", "q": "지구 대기에서 부피 비로 가장 많은 양을 차지하는 기체는?", "c": ["질소", "산소", "아르곤", "이산화 탄소", "수증기"], "a": 1, "e": "지구 대기는 질소 약 78%, 산소 약 21%, 아르곤 약 0.9%로 이루어져 있다.", "p": ""}, {"id": "SC-029", "s": "통합과학", "t": "단편", "g": 2, "d": "상", "q": "지각을 이루는 규산염 광물의 기본 단위인 규산염 사면체의 구성으로 옳은 것은?", "c": ["규소 4개와 산소 1개", "규소 1개와 산소 2개", "규소 1개와 산소 4개", "탄소 1개와 산소 4개", "규소 2개와 산소 3개"], "a": 3, "e": "규산염 사면체(SiO₄)는 규소 원자 1개를 중심으로 산소 원자 4개가 공유 결합한 정사면체 구조이다.", "p": ""}, {"id": "SC-030", "s": "통합과학", "t": "단편", "g": 2, "d": "상", "q": "탄소 원자가 육각형 벌집 모양으로 결합하여 한 층을 이루며, 강도와 전기 전도성이 뛰어나 휘어지는 디스플레이 등에 활용되는 신소재는?", "c": ["초전도체", "액정", "그래핀", "형상 기억 합금", "네오디뮴 자석"], "a": 3, "e": "그래핀은 흑연의 한 층을 떼어 낸 것과 같은 구조로, 얇고 투명하면서도 강도와 전기 전도성, 열전도성이 뛰어나다.", "p": ""}, {"id": "SC-031", "s": "통합과학", "t": "단편", "g": 3, "d": "하", "q": "다음 중 화석 연료가 <u>아닌</u> 것은?", "c": ["석탄", "석유", "천연가스", "우라늄", "셰일 가스"], "a": 4, "e": "화석 연료는 과거 생물의 유해가 땅속에 묻혀 만들어진 석탄, 석유, 천연가스(셰일 가스 포함) 등이다. 우라늄은 핵발전에 쓰이는 핵연료이다.", "p": ""}, {"id": "SC-032", "s": "통합과학", "t": "단편", "g": 3, "d": "중", "q": "1차 코일과 2차 코일의 감은 수의 비가 1 : 2인 변압기의 1차 코일에 110 V의 교류 전압을 걸었을 때, 2차 코일에 유도되는 전압은? (단, 에너지 손실은 무시한다.)", "c": ["55 V", "110 V", "165 V", "220 V", "440 V"], "a": 4, "e": "변압기에서 전압의 비는 코일의 감은 수의 비와 같다. V₁ : V₂ = N₁ : N₂ = 1 : 2이므로 V₂ = 220 V이다.", "p": ""}, {"id": "SC-033", "s": "통합과학", "t": "단편", "g": 3, "d": "상", "q": "지구 시스템의 에너지원 중 밀물과 썰물을 일으키는 에너지는?", "c": ["태양 에너지", "지구 내부 에너지", "화학 에너지", "조력 에너지", "지열 에너지"], "a": 4, "e": "조력 에너지는 달과 태양의 인력 때문에 생기며 밀물과 썰물을 일으킨다. 지구 시스템의 에너지원은 태양 에너지, 지구 내부 에너지, 조력 에너지의 세 가지이며, 이 가운데 태양 에너지가 가장 많다.", "p": ""}, {"id": "SC-034", "s": "통합과학", "t": "수능", "g": 1, "d": "하", "q": "다음 자료에서 설명하는 물질은?\n<div class='box'>• 약 20종류의 아미노산이 펩타이드 결합으로 길게 연결되어 만들어진다.<br>• 효소, 항체, 근육 등의 주성분으로 생명 활동에서 다양한 기능을 한다.</div>", "c": ["탄수화물", "지질", "단백질", "핵산", "무기염류"], "a": 3, "e": "단백질은 단위체인 아미노산이 펩타이드 결합으로 연결된 물질로, 아미노산의 종류와 배열 순서에 따라 입체 구조와 기능이 달라진다. 핵산(DNA, RNA)의 단위체는 뉴클레오타이드이다.", "p": ""}, {"id": "SC-035", "s": "통합과학", "t": "수능", "g": 1, "d": "하", "q": "안정된 생태계에서 1차 소비자의 수가 일시적으로 증가했을 때, 그 직후에 나타나는 변화로 옳은 것은?", "c": ["생산자의 수는 증가하고, 2차 소비자의 수는 감소한다.", "생산자의 수는 감소하고, 2차 소비자의 수는 증가한다.", "생산자와 2차 소비자의 수가 모두 감소한다.", "생산자와 2차 소비자의 수가 모두 증가한다.", "다른 영양 단계에는 아무런 변화가 없다."], "a": 2, "e": "1차 소비자가 늘면 먹이인 생산자는 줄고, 1차 소비자를 먹는 2차 소비자는 늘어난다. 이후 1차 소비자가 다시 줄어들면서 생태계는 평형을 회복한다.", "p": ""}, {"id": "SC-036", "s": "통합과학", "t": "수능", "g": 1, "d": "중", "q": "같은 높이에서 공 A는 가만히 놓고, 동시에 공 B는 수평 방향으로 던졌다. 이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은? (단, 공기 저항은 무시한다.)\n<div class='box'>ㄱ. A와 B는 동시에 지면에 도달한다.<br>ㄴ. B는 수평 방향으로 속력이 일정한 운동을 한다.<br>ㄷ. 운동하는 동안 B에 작용하는 중력의 크기는 일정하다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 5, "e": "수평으로 던진 물체는 연직 방향으로는 자유 낙하와 같은 운동을 하므로 A와 동시에 지면에 도달한다(ㄱ). 수평 방향으로는 힘이 작용하지 않아 등속 운동을 한다(ㄴ). 물체에 작용하는 중력의 크기는 운동하는 동안 일정하다(ㄷ).", "p": ""}, {"id": "SC-037", "s": "통합과학", "t": "수능", "g": 1, "d": "상", "q": "농도가 같은 묽은 염산(HCl)과 수산화 나트륨(NaOH) 수용액을 표와 같이 섞었다. 이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>혼합 용액 (가): HCl 10 mL + NaOH 30 mL<br>혼합 용액 (나): HCl 20 mL + NaOH 20 mL<br>혼합 용액 (다): HCl 30 mL + NaOH 10 mL<br><br>ㄱ. 혼합 후 최고 온도는 (나)가 가장 높다.<br>ㄴ. (가)는 산성이다.<br>ㄷ. (다)에 가장 많이 들어 있는 이온은 Cl⁻이다.</div>", "c": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "같은 농도이므로 (나)에서 완전히 중화되어 중화열이 가장 많이 발생한다(ㄱ). (가)는 OH⁻이 남아 염기성이다(ㄴ 틀림). (다)에서 이온 수의 비는 H⁺ 20, Cl⁻ 30, Na⁺ 10이므로 Cl⁻이 가장 많다(ㄷ).", "p": ""}, {"id": "SC-038", "s": "통합과학", "t": "수능", "g": 1, "d": "상", "q": "질량 2 kg인 물체를 지면으로부터 10 m 높이에서 가만히 놓았다. 이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은? (단, 중력 가속도는 10 m/s²이고, 지면을 위치 에너지의 기준으로 하며, 공기 저항은 무시한다.)\n<div class='box'>ㄱ. 처음 위치에서 물체의 중력 퍼텐셜 에너지는 200 J이다.<br>ㄴ. 높이 5 m인 지점에서 운동 에너지와 퍼텐셜 에너지는 같다.<br>ㄷ. 지면에 도달하는 순간의 속력은 20 m/s이다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "퍼텐셜 에너지 = mgh = 2 × 10 × 10 = 200 J(ㄱ). 높이 5 m에서 퍼텐셜 에너지는 100 J, 운동 에너지도 200 − 100 = 100 J로 같다(ㄴ). 지면에서 ½ × 2 × v² = 200에서 v = √200 ≒ 14.1 m/s이므로 ㄷ은 틀리다.", "p": ""}, {"id": "SC-039", "s": "통합과학", "t": "수능", "g": 2, "d": "하", "q": "금이나 우라늄처럼 철보다 무거운 원소가 주로 만들어지는 과정은?", "c": ["빅뱅 직후의 핵합성", "태양과 비슷한 질량의 별 중심부의 핵융합", "성운의 수축", "행성의 충돌", "초신성 폭발"], "a": 5, "e": "별 중심부의 핵융합으로는 철까지만 만들어지고, 철보다 무거운 원소는 초신성 폭발과 같은 격렬한 과정에서 만들어져 우주로 퍼져 나간다.", "p": ""}, {"id": "SC-040", "s": "통합과학", "t": "수능", "g": 2, "d": "하", "q": "식물 세포에서 광합성이 일어나는 세포 소기관과 세포 호흡이 주로 일어나는 세포 소기관을 순서대로 옳게 짝지은 것은?", "c": ["미토콘드리아, 엽록체", "핵, 리보솜", "리보솜, 엽록체", "엽록체, 핵", "엽록체, 미토콘드리아"], "a": 5, "e": "엽록체에서는 빛에너지를 이용해 포도당을 합성하는 광합성이, 미토콘드리아에서는 포도당을 분해해 에너지를 얻는 세포 호흡이 일어난다.", "p": ""}, {"id": "SC-041", "s": "통합과학", "t": "수능", "g": 2, "d": "하", "q": "태양광 발전에 대한 설명으로 옳은 것은?", "c": ["발전 과정에서 이산화 탄소가 많이 발생한다.", "날씨와 관계없이 발전량이 일정하다.", "터빈을 돌려 전기를 생산한다.", "우라늄의 핵분열 에너지를 이용한다.", "태양 전지를 이용해 빛에너지를 전기 에너지로 직접 전환한다."], "a": 5, "e": "태양광 발전은 태양 전지로 빛에너지를 전기 에너지로 직접 전환하므로 터빈이 필요 없고 발전 중 온실 기체를 배출하지 않는다. 다만 날씨와 시간에 따라 발전량이 달라진다.", "p": ""}, {"id": "SC-042", "s": "통합과학", "t": "수능", "g": 2, "d": "중", "q": "해양판이 대륙판 아래로 섭입하는 수렴형 경계에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>ㄱ. 새로운 해양 지각이 생성된다.<br>ㄴ. 화산 활동과 지진이 활발하다.<br>ㄷ. 해구가 발달한다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 4, "e": "새로운 해양 지각이 생성되는 곳은 발산형 경계인 해령이다(ㄱ 틀림). 섭입 과정에서 지진과 화산 활동이 활발하고(ㄴ), 밀도가 큰 해양판이 대륙판 아래로 들어가는 곳에는 해구가 만들어진다(ㄷ).", "p": ""}, {"id": "SC-043", "s": "통합과학", "t": "수능", "g": 2, "d": "상", "q": "DNA 한쪽 가닥의 염기 서열이 TACGGA이고, 이 가닥이 전사되어 mRNA가 만들어졌다. 이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>ㄱ. 만들어진 mRNA의 염기 서열은 AUGCCU이다.<br>ㄴ. 이 mRNA는 최대 2개의 아미노산을 지정한다.<br>ㄷ. RNA에는 타이민(T) 대신 유라실(U)이 있다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 5, "e": "전사될 때 DNA의 A, T, G, C는 각각 mRNA의 U, A, C, G와 상보적으로 대응하므로 mRNA는 AUGCCU이다(ㄱ). mRNA의 연속된 3개 염기(코돈)가 아미노산 1개를 지정하므로 6개 염기는 최대 2개의 아미노산을 지정한다(ㄴ). RNA는 T 대신 U를 갖는다(ㄷ).", "p": ""}, {"id": "SC-044", "s": "통합과학", "t": "수능", "g": 2, "d": "상", "q": "푸른색의 황산 구리(Ⅱ) 수용액에 아연판을 넣었더니 아연판 표면에 붉은색 구리가 달라붙었다. 이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>ㄱ. 아연은 전자를 잃고 산화된다.<br>ㄴ. 구리 이온은 전자를 얻어 환원된다.<br>ㄷ. 수용액의 푸른색은 점점 진해진다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "Zn + Cu²⁺ → Zn²⁺ + Cu. 아연은 전자를 잃고 산화되어 Zn²⁺으로 녹아 들어가고(ㄱ), Cu²⁺은 전자를 얻어 구리로 환원된다(ㄴ). 푸른색을 띠는 Cu²⁺의 수가 줄어들므로 수용액의 푸른색은 점점 옅어진다(ㄷ 틀림).", "p": ""}, {"id": "SC-045", "s": "통합과학", "t": "수능", "g": 2, "d": "상", "q": "발전소에서 같은 전력을 송전할 때 송전 전압을 10배로 높이면, 송전선에서 열로 손실되는 전력은 몇 배가 되는가? (단, 송전선의 저항은 일정하다.)", "c": ["1/10배", "1배", "10배", "1/100배", "100배"], "a": 4, "e": "전력 P = VI가 일정할 때 전압을 10배로 높이면 전류는 1/10배가 된다. 손실 전력은 I²R이므로 (1/10)² = 1/100배가 된다. 이 때문에 발전소에서는 전압을 높여 송전한다.", "p": ""}, {"id": "SC-046", "s": "통합과학", "t": "수능", "g": 3, "d": "하", "q": "공룡과 암모나이트가 번성하였던 지질 시대는?", "c": ["선캄브리아 시대", "고생대", "신생대", "중생대", "현세"], "a": 4, "e": "중생대는 공룡과 암모나이트가 번성한 시대이다. 고생대에는 삼엽충, 신생대에는 매머드와 화폐석이 번성하였다.", "p": ""}, {"id": "SC-047", "s": "통합과학", "t": "수능", "g": 3, "d": "하", "q": "다음 사례가 나타내는 생물 다양성의 종류는?\n<div class='box'>같은 종의 무당벌레라도 개체마다 등 껍질의 색과 점무늬가 조금씩 다르다.</div>", "c": ["종 다양성", "생태계 다양성", "군집 다양성", "유전적 다양성", "서식지 다양성"], "a": 4, "e": "같은 종 안에서 개체마다 유전자가 달라 형질이 다양하게 나타나는 것은 유전적 다양성이다. 유전적 다양성이 높은 종은 환경이 급격히 변해도 살아남을 가능성이 크다.", "p": ""}, {"id": "SC-048", "s": "통합과학", "t": "수능", "g": 3, "d": "하", "q": "화력 발전소에서 일어나는 에너지 전환 과정을 순서대로 옳게 나타낸 것은?", "c": ["화학 에너지 → 열에너지 → 운동 에너지 → 전기 에너지", "열에너지 → 화학 에너지 → 전기 에너지 → 운동 에너지", "핵에너지 → 열에너지 → 운동 에너지 → 전기 에너지", "빛에너지 → 전기 에너지", "위치 에너지 → 운동 에너지 → 전기 에너지"], "a": 1, "e": "화력 발전은 화석 연료의 화학 에너지를 연소시켜 열에너지로 바꾸고, 이 열로 만든 수증기로 터빈을 돌려(운동 에너지) 발전기에서 전기 에너지를 얻는다.", "p": ""}, {"id": "SC-049", "s": "통합과학", "t": "수능", "g": 3, "d": "중", "q": "엘니뇨가 발생했을 때 나타나는 현상으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>ㄱ. 페루 연안에서 찬 해수의 용승이 강해져 어획량이 늘어난다.<br>ㄴ. 동태평양 적도 부근 해역의 표층 수온이 평상시보다 높아진다.<br>ㄷ. 무역풍이 평상시보다 약해진다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 4, "e": "엘니뇨는 무역풍이 약해져(ㄷ) 따뜻한 해수가 동쪽으로 이동하면서 동태평양 적도 해역의 수온이 높아지는 현상이다(ㄴ). 이때 페루 연안의 용승이 약해져 영양 염류가 줄고 어획량이 감소한다(ㄱ 틀림).", "p": ""}, {"id": "SC-050", "s": "통합과학", "t": "수능", "g": 3, "d": "중", "q": "항생제를 오래 사용한 환경에서 항생제 내성 세균의 비율이 높아지는 현상에 대한 설명으로 옳은 것은?", "c": ["항생제를 쓰기 전부터 내성을 가진 변이 세균이 있었고, 이들이 살아남아 번식하였다.", "세균이 살아남기 위해 스스로 필요한 유전자를 만들어 냈다.", "항생제가 모든 세균의 유전자를 똑같이 바꾸었다.", "내성이 없는 세균이 내성이 있는 세균보다 더 많이 살아남았다.", "이 현상은 자연 선택과 관계가 없다."], "a": 1, "e": "세균 집단에는 원래 다양한 변이가 있다. 항생제라는 환경에서 내성 변이를 가진 세균이 더 많이 살아남아 자손을 남기면서 집단 내 비율이 높아지는 자연 선택의 사례이다.", "p": ""}, {"id": "SC-051", "s": "통합과학", "t": "수능", "g": 3, "d": "중", "q": "핵발전에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>ㄱ. 우라늄 원자핵이 분열할 때 나오는 에너지를 이용한다.<br>ㄴ. 핵분열 과정에서 줄어든 질량이 에너지로 전환된다.<br>ㄷ. 발전 과정에서 화력 발전보다 이산화 탄소를 많이 배출한다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "핵발전은 우라늄의 핵분열 연쇄 반응에서 나오는 에너지를 이용하며(ㄱ), 이 에너지는 질량 결손에서 비롯된다(ㄴ). 발전 과정에서 이산화 탄소를 거의 배출하지 않지만, 방사성 폐기물 처리와 사고 위험이라는 문제가 있다(ㄷ 틀림).", "p": ""}, {"id": "SC-052", "s": "통합과학", "t": "수능", "g": 3, "d": "상", "q": "우주의 팽창과 빅뱅 우주론에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>ㄱ. 멀리 있는 은하일수록 더 빠르게 멀어진다.<br>ㄴ. 모든 은하가 우리은하에서 멀어지므로 우리은하가 우주의 중심이다.<br>ㄷ. 우주에 분포하는 수소와 헬륨의 질량 비가 약 3 : 1인 것은 빅뱅 우주론의 증거이다.</div>", "c": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "은하의 후퇴 속도는 거리에 비례한다(허블 법칙, ㄱ). 우주는 공간 자체가 팽창하므로 어느 은하에서 보아도 다른 은하가 멀어지며, 팽창의 중심은 없다(ㄴ 틀림). 수소와 헬륨의 질량 비 약 3 : 1과 우주 배경 복사는 빅뱅 우주론의 증거이다(ㄷ).", "p": ""}, {"id": "SC-053", "s": "통합과학", "t": "수능", "g": 3, "d": "상", "q": "어떤 열기관이 1,000 J의 열에너지를 공급받아 250 J의 일을 하였다. 이 열기관의 열효율과 버려지는 열에너지를 옳게 짝지은 것은?", "c": ["25%, 750 J", "25%, 250 J", "75%, 250 J", "75%, 750 J", "40%, 600 J"], "a": 1, "e": "열효율 = (한 일 ÷ 공급받은 열에너지) × 100 = 250/1000 × 100 = 25%. 에너지 보존 법칙에 따라 버려지는 열에너지는 1,000 − 250 = 750 J이다.", "p": ""}, {"id": "SC-054", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "원자에서 원자핵 주위에 분포하며 음(-)전하를 띠는 입자는?", "c": ["양성자", "전자", "중성자", "원자핵", "쿼크"], "a": 2, "e": "원자는 양(+)전하를 띠는 원자핵과 음(-)전하를 띠는 전자로 이루어져 있다. 원자핵은 양성자와 중성자로 이루어진다.", "p": ""}, {"id": "SC-055", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "다음 중 알칼리 금속에 해당하는 원소는?", "c": ["리튬(Li)", "헬륨(He)", "염소(Cl)", "산소(O)", "철(Fe)"], "a": 1, "e": "알칼리 금속은 주기율표의 1족 원소 가운데 수소를 뺀 리튬, 나트륨, 칼륨 등으로, 물과 잘 반응한다. 헬륨은 비활성 기체, 염소는 할로젠이다.", "p": ""}, {"id": "SC-056", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "다음 중 공유 결합으로 이루어진 물질은?", "c": ["염화 나트륨(NaCl)", "산화 마그네슘(MgO)", "염화 칼슘(CaCl₂)", "철(Fe)", "물(H₂O)"], "a": 5, "e": "공유 결합은 비금속 원소의 원자들이 전자쌍을 공유하여 이루어진다. 염화 나트륨, 산화 마그네슘, 염화 칼슘은 금속과 비금속 원소가 만난 이온 결합 물질이다.", "p": ""}, {"id": "SC-057", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "단백질을 이루는 기본 단위체는?", "c": ["아미노산", "포도당", "뉴클레오타이드", "지방산", "글리세롤"], "a": 1, "e": "단백질은 여러 개의 아미노산이 펩타이드 결합으로 길게 이어진 물질이다. 뉴클레오타이드는 핵산의 단위체이다.", "p": ""}, {"id": "SC-058", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "지구 시스템의 구성 요소 중 바다, 강, 호수, 빙하, 지하수를 포함하는 권역은?", "c": ["기권", "수권", "지권", "생물권", "외권"], "a": 2, "e": "수권은 지구에 있는 물이 분포하는 영역으로, 그 대부분은 바닷물(해수)이다.", "p": ""}, {"id": "SC-059", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "질량이 2 kg인 물체가 3 m/s의 속도로 운동할 때 이 물체의 운동량의 크기는?", "c": ["1.5 kg·m/s", "5 kg·m/s", "6 kg·m/s", "9 kg·m/s", "18 kg·m/s"], "a": 3, "e": "운동량 = 질량 × 속도 = 2 kg × 3 m/s = 6 kg·m/s이다.", "p": ""}, {"id": "SC-060", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "산성 수용액이 공통으로 내놓아 산의 성질을 나타내게 하는 이온은?", "c": ["수산화 이온(OH⁻)", "나트륨 이온(Na⁺)", "염화 이온(Cl⁻)", "수소 이온(H⁺)", "칼슘 이온(Ca²⁺)"], "a": 4, "e": "산은 물에 녹아 수소 이온(H⁺)을 내놓는 물질이다. 염기는 물에 녹아 수산화 이온(OH⁻)을 내놓는다.", "p": ""}, {"id": "SC-061", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "어떤 물질이 산소를 얻거나 전자를 잃는 반응을 무엇이라 하는가?", "c": ["환원", "산화", "중화", "융해", "전사"], "a": 2, "e": "산화는 산소를 얻거나 전자를 잃는 반응이고, 환원은 산소를 잃거나 전자를 얻는 반응이다. 산화와 환원은 항상 동시에 일어난다.", "p": ""}, {"id": "SC-062", "s": "통합과학", "t": "단편", "g": 1, "d": "중", "q": "헬륨, 네온, 아르곤과 같은 18족 원소(비활성 기체)가 다른 원소와 거의 반응하지 않는 까닭은?", "c": ["가장 바깥 전자 껍질에 전자가 모두 채워져 안정하기 때문에", "전자를 전혀 가지고 있지 않기 때문에", "원자핵에 양성자가 없기 때문에", "원자의 질량이 매우 크기 때문에", "실온에서 고체 상태이기 때문에"], "a": 1, "e": "18족 원소는 가장 바깥 전자 껍질에 전자가 8개(헬륨은 2개) 채워진 안정한 전자 배치를 하고 있어 전자를 잃거나 얻으려는 경향이 거의 없다.", "p": ""}, {"id": "SC-063", "s": "통합과학", "t": "단편", "g": 1, "d": "중", "q": "염화 나트륨과 같은 이온 결합 물질의 전기 전도성에 대한 설명으로 옳은 것은?", "c": ["고체 상태에서는 전류가 흐르지 않지만, 물에 녹이거나 액체 상태가 되면 전류가 흐른다.", "고체 상태에서만 전류가 흐른다.", "어떤 상태에서도 전류가 흐르지 않는다.", "모든 상태에서 전류가 잘 흐른다.", "기체 상태에서만 전류가 흐른다."], "a": 1, "e": "고체 상태에서는 이온들이 강하게 결합하여 움직이지 못하지만, 수용액이나 액체 상태에서는 이온이 자유롭게 움직일 수 있어 전류가 흐른다.", "p": ""}, {"id": "SC-064", "s": "통합과학", "t": "단편", "g": 1, "d": "중", "q": "지각을 구성하는 원소 중 질량 비가 가장 큰 두 원소를 큰 것부터 순서대로 나열한 것은?", "c": ["규소, 산소", "철, 산소", "산소, 탄소", "탄소, 수소", "산소, 규소"], "a": 5, "e": "지각에는 산소가 가장 많고 그다음으로 규소가 많다. 두 원소는 규산염 광물을 이루어 지각의 대부분을 구성한다.", "p": ""}, {"id": "SC-065", "s": "통합과학", "t": "단편", "g": 1, "d": "중", "q": "핵산의 단위체인 뉴클레오타이드를 이루는 세 가지 성분은?", "c": ["아미노산, 당, 염기", "인산, 지방산, 염기", "글리세롤, 지방산, 인산", "포도당, 아미노산, 인산", "인산, 당, 염기"], "a": 5, "e": "뉴클레오타이드는 인산, 당, 염기가 1:1:1로 결합한 물질이다. DNA의 염기에는 A, G, C, T가 있고 RNA에는 T 대신 U가 있다.", "p": ""}, {"id": "SC-066", "s": "통합과학", "t": "단편", "g": 1, "d": "중", "q": "가만히 놓은 물체가 자유 낙하할 때 2초 뒤 물체의 속력은? (단, 중력 가속도는 10 m/s²이고 공기 저항은 무시한다.)", "c": ["5 m/s", "10 m/s", "20 m/s", "40 m/s", "100 m/s"], "a": 3, "e": "자유 낙하 하는 물체의 속력은 1초마다 10 m/s씩 빨라진다. 따라서 2초 뒤의 속력은 10 m/s² × 2 s = 20 m/s이다.", "p": ""}, {"id": "SC-067", "s": "통합과학", "t": "단편", "g": 1, "d": "중", "q": "세포에서 단백질이 합성되는 장소는?", "c": ["미토콘드리아", "엽록체", "세포벽", "액포", "리보솜"], "a": 5, "e": "리보솜에서는 mRNA의 유전 정보에 따라 아미노산이 연결되어 단백질이 만들어진다. 미토콘드리아는 세포 호흡, 엽록체는 광합성이 일어나는 곳이다.", "p": ""}, {"id": "SC-068", "s": "통합과학", "t": "단편", "g": 1, "d": "중", "q": "수권과 기권의 상호 작용에 해당하는 예는?", "c": ["따뜻한 바다에서 수증기가 증발하여 태풍이 발생한다.", "화산이 폭발하여 화산재가 대기로 퍼진다.", "식물이 광합성으로 대기의 이산화 탄소를 흡수한다.", "지하수가 석회암을 녹여 동굴을 만든다.", "식물의 뿌리가 암석을 부순다."], "a": 1, "e": "태풍은 바닷물(수권)이 증발하면서 대기(기권)에 에너지를 공급하여 발생한다. 화산재 분출은 지권-기권, 광합성은 생물권-기권, 석회 동굴은 수권-지권, 뿌리의 풍화는 생물권-지권의 상호 작용이다.", "p": ""}, {"id": "SC-069", "s": "통합과학", "t": "단편", "g": 1, "d": "중", "q": "일상생활에서 중화 반응을 이용하는 예로 가장 적절한 것은?", "c": ["철로 만든 대문에 페인트를 칠한다.", "사과를 깎아 두면 갈색으로 변한다.", "겨울철 도로에 염화 칼슘을 뿌린다.", "위산이 많이 나와 속이 쓰릴 때 제산제를 먹는다.", "휴대용 손난로를 흔들어 따뜻하게 한다."], "a": 4, "e": "제산제의 염기성 성분이 위산(염산)을 중화한다. 페인트칠은 산화 방지, 사과의 갈변과 손난로는 산화 반응과 관련된다.", "p": ""}, {"id": "SC-070", "s": "통합과학", "t": "단편", "g": 1, "d": "상", "q": "빅뱅 우주론을 뒷받침하는 증거로 옳은 것은?", "c": ["우주의 크기가 시간에 따라 변하지 않는다.", "멀리 있는 은하일수록 더 빠르게 우리에게 다가온다.", "우주에는 철이 가장 많이 존재한다.", "별의 밝기가 모두 같다.", "우주 전체에서 수소와 헬륨의 질량 비가 약 3:1로 관측된다."], "a": 5, "e": "빅뱅 우주론은 초기 우주에서 수소와 헬륨이 약 3:1의 질량 비로 만들어졌다고 예측하며, 이는 관측 결과와 일치한다. 우주 배경 복사도 빅뱅의 증거이다.", "p": ""}, {"id": "SC-071", "s": "통합과학", "t": "단편", "g": 1, "d": "상", "q": "별빛의 스펙트럼에 나타나는 흡수선을 분석하여 알 수 있는 것은?", "c": ["별의 대기를 이루는 원소의 종류", "별이 가진 행성의 수", "별의 정확한 나이", "별 중심부의 압력", "별이 속한 은하의 모양"], "a": 1, "e": "원소마다 흡수하거나 방출하는 빛의 파장이 달라 고유한 선 스펙트럼이 나타난다. 별빛의 흡수선 위치를 원소의 선 스펙트럼과 비교하면 별의 구성 원소를 알 수 있다.", "p": ""}, {"id": "SC-072", "s": "통합과학", "t": "단편", "g": 1, "d": "상", "q": "산소 원자(원자 번호 8) 2개가 결합하여 산소 분자(O₂)를 만들 때, 두 원자가 공유하는 전자쌍의 수는?", "c": ["1쌍", "2쌍", "3쌍", "4쌍", "6쌍"], "a": 2, "e": "산소 원자의 원자가 전자는 6개이므로 안정한 전자 배치를 이루려면 전자 2개가 더 필요하다. 그래서 두 산소 원자는 전자쌍 2개를 공유하는 2중 결합을 한다.", "p": ""}, {"id": "SC-073", "s": "통합과학", "t": "단편", "g": 1, "d": "상", "q": "질량이 0.5 kg인 공이 10 m/s의 속력으로 날아오다가 글러브에 잡혀 0.1초 만에 정지하였다. 공이 글러브로부터 받은 평균 힘의 크기는?", "c": ["5 N", "10 N", "25 N", "50 N", "100 N"], "a": 4, "e": "운동량의 변화량(충격량)의 크기는 0.5 kg × 10 m/s = 5 N·s이다. 평균 힘 = 충격량 ÷ 시간 = 5 N·s ÷ 0.1 s = 50 N이다.", "p": ""}, {"id": "SC-074", "s": "통합과학", "t": "단편", "g": 1, "d": "상", "q": "가만히 놓은 물체가 자유 낙하할 때 3초 동안 낙하한 거리는? (단, 중력 가속도는 10 m/s²이고 공기 저항은 무시한다.)", "c": ["15 m", "30 m", "45 m", "60 m", "90 m"], "a": 3, "e": "3초 뒤의 속력은 30 m/s이고, 속력이 일정하게 증가하므로 평균 속력은 15 m/s이다. 낙하 거리 = 15 m/s × 3 s = 45 m이다.", "p": ""}, {"id": "SC-075", "s": "통합과학", "t": "단편", "g": 1, "d": "상", "q": "공기가 없는 곳에서 질량이 1 kg인 쇠구슬과 질량이 0.01 kg인 깃털을 같은 높이에서 동시에 가만히 놓았다. 이에 대한 설명으로 옳은 것은?", "c": ["쇠구슬이 깃털보다 먼저 바닥에 도달한다.", "두 물체에 작용하는 중력의 크기는 다르지만 동시에 바닥에 도달한다.", "두 물체에 작용하는 중력의 크기가 같다.", "깃털의 가속도가 쇠구슬보다 크다.", "두 물체 모두 일정한 속력으로 떨어진다."], "a": 2, "e": "중력의 크기(무게)는 질량에 비례하므로 쇠구슬이 더 크다. 그러나 가속도 = 힘 ÷ 질량이므로 중력 가속도는 질량과 관계없이 같아 두 물체는 동시에 떨어진다.", "p": ""}, {"id": "SC-076", "s": "통합과학", "t": "단편", "g": 1, "d": "상", "q": "어떤 단백질이 아미노산 100개로 이루어져 있다. 이 아미노산들을 지정하는 데 필요한 mRNA 염기의 수는? (단, 종결 코돈은 고려하지 않는다.)", "c": ["100개", "200개", "300개", "400개", "600개"], "a": 3, "e": "mRNA에서는 연속된 3개의 염기(코돈)가 아미노산 1개를 지정한다. 따라서 아미노산 100개를 지정하려면 염기 300개가 필요하다.", "p": ""}, {"id": "SC-077", "s": "통합과학", "t": "단편", "g": 1, "d": "상", "q": "세포막을 통한 물질 이동에 대한 설명으로 옳은 것은?", "c": ["포도당은 인지질 2중층을 직접 통과하여 빠르게 확산한다.", "확산은 농도가 낮은 쪽에서 높은 쪽으로 물질이 이동하는 현상이다.", "세포막은 모든 물질을 자유롭게 통과시킨다.", "산소와 이산화 탄소는 인지질 2중층을 직접 통과하여 확산한다.", "이온은 막단백질 없이도 세포막을 쉽게 통과한다."], "a": 4, "e": "산소, 이산화 탄소처럼 크기가 작은 기체 분자는 인지질 2중층을 직접 통과한다. 포도당, 아미노산, 이온 등은 막단백질을 통해 이동한다. 이처럼 세포막은 물질을 가려서 통과시키는 선택적 투과성을 지닌다.", "p": ""}, {"id": "SC-078", "s": "통합과학", "t": "수능", "g": 1, "d": "상", "q": "질산 은(AgNO₃) 수용액에 구리(Cu) 선을 넣었더니 구리 선 표면에 은이 달라붙고 수용액이 점점 푸른색으로 변하였다. 이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?<div class='box'>&lt;보기&gt;<br>ㄱ. 구리는 전자를 잃고 산화된다.<br>ㄴ. 은 이온(Ag⁺)은 전자를 얻어 환원된다.<br>ㄷ. 수용액 속 구리 이온(Cu²⁺)의 수는 점점 줄어든다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "Cu + 2Ag⁺ → Cu²⁺ + 2Ag 반응이 일어난다. 구리는 전자를 잃어 구리 이온이 되고(산화), 은 이온은 전자를 얻어 은이 된다(환원). 구리 이온이 생겨나므로 그 수는 늘어나고 용액이 푸른색을 띤다.", "p": ""}, {"id": "SC-079", "s": "통합과학", "t": "수능", "g": 1, "d": "상", "q": "농도가 같은 묽은 염산(HCl) 10 mL와 수산화 나트륨(NaOH) 수용액 15 mL를 섞은 혼합 용액에 대한 설명으로 옳은 것은?", "c": ["혼합 용액은 산성이다.", "혼합 용액에 수소 이온(H⁺)이 남아 있다.", "혼합 용액에 수산화 이온(OH⁻)이 없다.", "BTB 용액을 떨어뜨리면 파란색을 띤다.", "중화 반응이 일어나지 않는다."], "a": 4, "e": "농도가 같으므로 염산 10 mL와 수산화 나트륨 수용액 10 mL가 완전히 중화되고, 수산화 나트륨 수용액 5 mL에 해당하는 OH⁻이 남는다. 따라서 혼합 용액은 염기성이며 BTB 용액은 파란색을 띤다.", "p": ""}, {"id": "SC-080", "s": "통합과학", "t": "단편", "g": 1, "d": "상", "q": "산안드레아스 단층과 같은 보존형 경계(변환 단층)에 대한 설명으로 옳은 것은?", "c": ["판이 생성되거나 소멸하지 않고 서로 어긋나며, 지진은 자주 일어나지만 화산 활동은 거의 없다.", "새로운 해양 지각이 만들어진다.", "해양판이 대륙판 아래로 섭입한다.", "습곡 산맥이 형성된다.", "깊은 해구가 발달한다."], "a": 1, "e": "보존형 경계에서는 두 판이 서로 반대 방향으로 스쳐 지나가므로 지진이 자주 일어나지만 마그마가 만들어지지 않아 화산 활동은 거의 없다.", "p": ""}, {"id": "SC-081", "s": "통합과학", "t": "수능", "g": 1, "d": "상", "q": "지면으로부터 20 m 높이에서 가만히 놓은 물체가 지면으로부터 15 m 높이를 지날 때의 속력은? (단, 중력 가속도는 10 m/s²이고 공기 저항은 무시한다.)", "c": ["5 m/s", "10 m/s", "15 m/s", "20 m/s", "50 m/s"], "a": 2, "e": "물체가 5 m 낙하하는 동안 줄어든 위치 에너지가 운동 에너지로 바뀐다. m × 10 × 5 = ½mv² 에서 v² = 100이므로 v = 10 m/s이다.", "p": ""}, {"id": "SC-082", "s": "통합과학", "t": "단편", "g": 2, "d": "하", "q": "빅뱅 우주론에 대한 설명으로 옳은 것은?", "c": ["우주는 처음부터 지금과 같은 크기였다.", "우주는 팽창하면서 점점 뜨거워졌다.", "우주는 매우 뜨겁고 밀도가 큰 한 점에서 시작하여 팽창하면서 식어 왔다.", "우주는 시간이 지날수록 수축하고 있다.", "우주에는 시작이 없다."], "a": 3, "e": "빅뱅 우주론에 따르면 우주는 약 138억 년 전 초고온·초고밀도 상태에서 시작하여 계속 팽창해 왔으며, 팽창하면서 온도와 밀도가 낮아졌다.", "p": ""}, {"id": "SC-083", "s": "통합과학", "t": "단편", "g": 2, "d": "하", "q": "원소의 원자 번호를 결정하는 것은?", "c": ["원자핵 속 중성자의 수", "원자의 질량", "원자핵 속 양성자의 수", "원자의 크기", "전자 껍질의 수"], "a": 3, "e": "원자 번호는 원자핵에 들어 있는 양성자의 수와 같다. 중성 원자에서는 양성자 수와 전자 수가 같다.", "p": ""}, {"id": "SC-084", "s": "통합과학", "t": "단편", "g": 2, "d": "하", "q": "다음 중 금속 원소인 것은?", "c": ["나트륨(Na)", "산소(O)", "염소(Cl)", "탄소(C)", "헬륨(He)"], "a": 1, "e": "금속 원소는 주기율표의 왼쪽과 가운데에 주로 있으며 열과 전기를 잘 전달한다. 산소, 염소, 탄소, 헬륨은 비금속 원소이다.", "p": ""}, {"id": "SC-085", "s": "통합과학", "t": "단편", "g": 2, "d": "하", "q": "주기율표의 17족에 속하며, 금속과 잘 반응하는 플루오린(F), 염소(Cl), 브로민(Br) 등을 무엇이라 하는가?", "c": ["알칼리 금속", "비활성 기체", "전이 금속", "할로젠", "준금속"], "a": 4, "e": "할로젠은 원자가 전자가 7개로, 전자 1개를 얻어 음이온이 되기 쉽다. 알칼리 금속은 1족, 비활성 기체는 18족이다.", "p": ""}, {"id": "SC-086", "s": "통합과학", "t": "단편", "g": 2, "d": "하", "q": "우리 몸에서 주된 에너지원으로 쓰이며, 포도당·녹말 등이 속하는 물질은?", "c": ["단백질", "핵산", "물", "무기염류", "탄수화물"], "a": 5, "e": "탄수화물은 생명체의 주된 에너지원이다. 단백질은 효소·근육 등의 주성분이고, 핵산은 유전 정보를 저장한다.", "p": ""}, {"id": "SC-087", "s": "통합과학", "t": "단편", "g": 2, "d": "하", "q": "DNA의 구조에 대한 설명으로 옳은 것은?", "c": ["두 가닥의 폴리뉴클레오타이드가 꼬인 이중 나선 구조이다.", "한 가닥으로 이루어진 직선 구조이다.", "아미노산이 연결된 구조이다.", "염기로 유라실(U)을 가진다.", "포도당이 길게 연결된 구조이다."], "a": 1, "e": "DNA는 두 가닥이 마주 보고 꼬여 있는 이중 나선 구조이며, 염기 A는 T와, G는 C와 짝을 이룬다. 유라실(U)은 RNA에 있는 염기이다.", "p": ""}, {"id": "SC-088", "s": "통합과학", "t": "단편", "g": 2, "d": "하", "q": "지구가 물체를 지구 중심 방향으로 끌어당기는 힘은?", "c": ["중력", "마찰력", "탄성력", "자기력", "부력"], "a": 1, "e": "질량이 있는 모든 물체 사이에는 서로 끌어당기는 힘이 작용한다. 지구가 물체를 당기는 힘을 중력이라 하며, 그 크기를 무게라고 한다.", "p": ""}, {"id": "SC-089", "s": "통합과학", "t": "단편", "g": 2, "d": "하", "q": "달리던 버스가 갑자기 멈출 때 승객의 몸이 앞으로 쏠리는 현상과 관련된 성질은?", "c": ["중력", "탄성", "전자기 유도", "관성", "삼투"], "a": 4, "e": "관성은 물체가 원래의 운동 상태를 유지하려는 성질이다. 버스가 멈추어도 승객은 계속 앞으로 운동하려고 하므로 몸이 앞으로 쏠린다.", "p": ""}, {"id": "SC-090", "s": "통합과학", "t": "단편", "g": 2, "d": "하", "q": "지구 내부의 층상 구조 중 액체 상태인 층은?", "c": ["외핵", "지각", "맨틀", "내핵", "암석권"], "a": 1, "e": "지구 내부는 지각, 맨틀, 외핵, 내핵으로 이루어지며, 이 가운데 외핵만 액체 상태이다.", "p": ""}, {"id": "SC-091", "s": "통합과학", "t": "단편", "g": 2, "d": "하", "q": "세포에서 유전 물질인 DNA가 들어 있어 생명 활동을 조절하는 곳은?", "c": ["리보솜", "핵", "세포막", "세포벽", "액포"], "a": 2, "e": "핵에는 유전 정보를 저장한 DNA가 들어 있어 세포의 생명 활동을 조절한다.", "p": ""}, {"id": "SC-092", "s": "통합과학", "t": "단편", "g": 2, "d": "하", "q": "생명체 안에서 생명을 유지하기 위해 일어나는 모든 화학 반응을 무엇이라 하는가?", "c": ["삼투", "확산", "전사", "물질대사", "중화"], "a": 4, "e": "물질대사에는 물질을 합성하는 동화 작용(예: 광합성)과 분해하는 이화 작용(예: 세포 호흡)이 있으며, 효소가 관여한다.", "p": ""}, {"id": "SC-093", "s": "통합과학", "t": "단편", "g": 2, "d": "하", "q": "pH가 7보다 작은 수용액의 액성은?", "c": ["중성", "산성", "염기성", "알칼리성", "알 수 없다"], "a": 2, "e": "pH가 7보다 작으면 산성, 7이면 중성, 7보다 크면 염기성이다. pH가 작을수록 산성이 강하다.", "p": ""}, {"id": "SC-094", "s": "통합과학", "t": "단편", "g": 2, "d": "하", "q": "다음 중 염기성을 띠는 물질은?", "c": ["비눗물", "식초", "레몬즙", "탄산음료", "위액"], "a": 1, "e": "비눗물, 하수구 세정제, 베이킹 소다 수용액 등은 염기성이다. 식초, 레몬즙, 탄산음료, 위액은 산성이다.", "p": ""}, {"id": "SC-095", "s": "통합과학", "t": "단편", "g": 2, "d": "하", "q": "고생대를 대표하는 화석은?", "c": ["암모나이트", "공룡", "매머드", "화폐석", "삼엽충"], "a": 5, "e": "삼엽충은 고생대의 바다에서 번성하였다. 암모나이트와 공룡은 중생대, 매머드와 화폐석은 신생대의 표준 화석이다.", "p": ""}, {"id": "SC-096", "s": "통합과학", "t": "단편", "g": 2, "d": "하", "q": "생태계에서 죽은 생물이나 배설물 속의 유기물을 분해하는 버섯, 곰팡이, 세균 등을 무엇이라 하는가?", "c": ["분해자", "생산자", "1차 소비자", "2차 소비자", "비생물 요소"], "a": 1, "e": "분해자는 유기물을 무기물로 분해하여 생산자가 다시 이용할 수 있게 함으로써 물질 순환에 중요한 역할을 한다.", "p": ""}, {"id": "SC-097", "s": "통합과학", "t": "단편", "g": 2, "d": "하", "q": "에너지 보존 법칙에 대한 설명으로 옳은 것은?", "c": ["에너지는 쓰면 쓸수록 전체 양이 줄어든다.", "에너지는 다른 형태로 전환되어도 새로 생기거나 없어지지 않고 전체 양이 일정하다.", "에너지는 전환될 때마다 전체 양이 늘어난다.", "한 번 전환된 에너지는 다시 전환될 수 없다.", "열에너지는 에너지에 포함되지 않는다."], "a": 2, "e": "에너지가 전환될 때 전체 양은 보존된다. 다만 전환 과정에서 일부가 다시 쓰기 어려운 열에너지로 바뀌므로 에너지를 절약해야 한다.", "p": ""}, {"id": "SC-098", "s": "통합과학", "t": "단편", "g": 2, "d": "중", "q": "태양계 형성 과정에서 지구, 화성과 같은 지구형 행성이 태양 가까이에서 만들어진 까닭은?", "c": ["태양 가까운 곳에 수소와 헬륨이 가장 많았기 때문에", "태양 가까운 곳은 온도가 높아 녹는점이 높은 철, 규소 등 무거운 물질만 남아 뭉쳤기 때문에", "태양 가까운 곳의 온도가 낮았기 때문에", "태양의 중력이 미치지 않았기 때문에", "얼음 상태의 물질이 많이 모였기 때문에"], "a": 2, "e": "원시 태양 근처는 온도가 높아 가벼운 기체는 밀려나고 녹는점이 높은 무거운 물질이 미행성을 이루어 암석으로 된 지구형 행성이 되었다. 먼 곳에서는 기체가 많이 모여 목성형 행성이 되었다.", "p": ""}, {"id": "SC-099", "s": "통합과학", "t": "단편", "g": 2, "d": "중", "q": "주기율표에서 같은 주기에 속한 원소들의 공통점은?", "c": ["원자가 전자의 수가 같다.", "화학적 성질이 비슷하다.", "양성자의 수가 같다.", "모두 금속 원소이다.", "전자가 들어 있는 전자 껍질의 수가 같다."], "a": 5, "e": "같은 주기의 원소는 전자 껍질 수가 같고, 같은 족의 원소는 원자가 전자 수가 같아 화학적 성질이 비슷하다.", "p": ""}, {"id": "SC-100", "s": "통합과학", "t": "단편", "g": 2, "d": "중", "q": "나트륨(Na) 조각을 물에 넣었을 때 일어나는 변화로 옳은 것은?", "c": ["산소 기체가 발생하고 수용액은 산성이 된다.", "아무 반응도 일어나지 않는다.", "이산화 탄소가 발생한다.", "수소 기체가 발생하고 수용액은 염기성이 된다.", "수용액이 중성을 유지한다."], "a": 4, "e": "알칼리 금속은 물과 격렬히 반응하여 수소 기체를 발생시키고, 수용액은 염기성을 띤다. 그래서 페놀프탈레인 용액을 넣으면 붉게 변한다.", "p": ""}, {"id": "SC-101", "s": "통합과학", "t": "단편", "g": 2, "d": "중", "q": "나트륨 원자(원자 번호 11)가 나트륨 이온(Na⁺)이 될 때에 대한 설명으로 옳은 것은?", "c": ["전자 1개를 얻어 아르곤과 같은 전자 배치를 이룬다.", "양성자 1개를 잃는다.", "양성자 1개를 얻는다.", "전자 껍질의 수가 늘어난다.", "전자 1개를 잃어 네온과 같은 전자 배치를 이룬다."], "a": 5, "e": "나트륨 원자는 가장 바깥 껍질의 전자 1개를 잃고 네온(원자 번호 10)과 같은 안정한 전자 배치를 가진 양이온이 된다. 이때 양성자 수는 변하지 않는다.", "p": ""}, {"id": "SC-102", "s": "통합과학", "t": "단편", "g": 2, "d": "중", "q": "물 분자(H₂O) 1개에 들어 있는 공유 전자쌍의 수는?", "c": ["1쌍", "2쌍", "3쌍", "4쌍", "6쌍"], "a": 2, "e": "산소 원자 1개가 수소 원자 2개와 각각 전자쌍 1개씩을 공유하므로 물 분자에는 공유 전자쌍이 2쌍 있다.", "p": ""}, {"id": "SC-103", "s": "통합과학", "t": "단편", "g": 2, "d": "중", "q": "탄소가 생명체를 이루는 다양한 화합물의 기본 골격이 될 수 있는 까닭은?", "c": ["원자가 전자가 8개여서 매우 안정하기 때문에", "원자가 전자가 4개여서 다른 원자와 최대 4개의 결합을 하며 사슬·고리 등 다양한 구조를 만들 수 있기 때문에", "전자를 쉽게 잃어 양이온이 되기 때문에", "다른 원자와 전혀 결합하지 않기 때문에", "지구에서 가장 풍부한 원소이기 때문에"], "a": 2, "e": "탄소 원자는 원자가 전자가 4개여서 다른 탄소나 수소, 산소, 질소 등과 여러 방식으로 공유 결합을 하여 탄수화물, 단백질, 핵산 같은 복잡한 물질을 만든다.", "p": ""}, {"id": "SC-104", "s": "통합과학", "t": "단편", "g": 2, "d": "중", "q": "초전도체에 대한 설명으로 옳은 것은?", "c": ["특정 온도 이하에서 전기 저항이 0이 되어, 자기 부상 열차나 자기 공명 영상(MRI) 장치 등에 쓰인다.", "온도가 높을수록 전기 저항이 0에 가까워진다.", "전류가 전혀 흐르지 않는 물질이다.", "빛을 받으면 전류가 흐르는 물질이다.", "탄소 원자가 한 층으로 이루어진 물질이다."], "a": 1, "e": "초전도체는 임계 온도 이하에서 저항이 0이 되어 큰 전류를 흘려 강한 자기장을 만들 수 있고, 자석을 밀어내는 성질도 나타난다.", "p": ""}, {"id": "SC-105", "s": "통합과학", "t": "단편", "g": 2, "d": "중", "q": "마찰이 없는 수평면에 놓인 질량 2 kg인 물체에 수평 방향으로 10 N의 힘이 작용할 때 물체의 가속도의 크기는?", "c": ["0.2 m/s²", "2 m/s²", "5 m/s²", "12 m/s²", "20 m/s²"], "a": 3, "e": "가속도 = 힘 ÷ 질량 = 10 N ÷ 2 kg = 5 m/s²이다.", "p": ""}, {"id": "SC-106", "s": "통합과학", "t": "단편", "g": 2, "d": "중", "q": "물체에 5 N의 일정한 힘이 2초 동안 작용하였다. 이 물체가 받은 충격량의 크기는?", "c": ["2.5 N·s", "5 N·s", "7 N·s", "10 N·s", "20 N·s"], "a": 4, "e": "충격량 = 힘 × 시간 = 5 N × 2 s = 10 N·s이며, 이는 물체의 운동량 변화량과 같다.", "p": ""}, {"id": "SC-107", "s": "통합과학", "t": "단편", "g": 2, "d": "중", "q": "충돌할 때 힘을 받는 시간을 길게 하여 충격을 줄이는 예가 <u>아닌</u> 것은?", "c": ["자동차의 에어백", "포수의 두꺼운 글러브", "높이뛰기 경기장의 두꺼운 매트", "못을 박을 때 쓰는 단단한 쇠망치", "택배 상자 속의 포장용 완충재"], "a": 4, "e": "단단한 쇠망치는 충돌 시간을 짧게 하여 못에 큰 힘을 전달하기 위한 것이다. 나머지는 충돌 시간을 늘려 같은 충격량이라도 받는 힘을 줄인다.", "p": ""}, {"id": "SC-108", "s": "통합과학", "t": "단편", "g": 2, "d": "중", "q": "화석 연료를 태울 때 탄소가 이동하는 경로는?", "c": ["기권 → 수권", "기권 → 생물권", "수권 → 지권", "지권 → 기권", "생물권 → 지권"], "a": 4, "e": "화석 연료는 지권에 저장된 탄소이며, 연소하면 이산화 탄소가 되어 기권으로 이동한다. 광합성은 기권의 탄소가 생물권으로 이동하는 과정이다.", "p": ""}, {"id": "SC-109", "s": "통합과학", "t": "단편", "g": 2, "d": "중", "q": "판의 발산형 경계에서 볼 수 있는 지형은?", "c": ["해구와 호상 열도", "습곡 산맥", "변환 단층", "화산섬이 줄지어 늘어선 해구", "해령과 열곡대"], "a": 5, "e": "발산형 경계에서는 맨틀 물질이 올라와 판이 양쪽으로 갈라지며, 바다에서는 해령이, 대륙에서는 동아프리카 열곡대 같은 열곡대가 만들어진다.", "p": ""}, {"id": "SC-110", "s": "통합과학", "t": "단편", "g": 2, "d": "중", "q": "효소의 특성에 대한 설명으로 옳은 것은?", "c": ["한 번 반응에 쓰이면 다시 사용할 수 없다.", "한 종류의 효소는 자신의 구조에 맞는 특정 반응물(기질)에만 작용한다.", "반응이 끝나면 생성물로 바뀐다.", "모든 반응물에 똑같이 작용한다.", "활성화 에너지를 높여 반응을 빠르게 한다."], "a": 2, "e": "효소는 입체 구조가 맞는 기질과만 결합하는 기질 특이성이 있다. 반응 전후에 변하지 않아 다시 쓰일 수 있고, 활성화 에너지를 낮추어 반응을 빠르게 한다.", "p": ""}, {"id": "SC-111", "s": "통합과학", "t": "단편", "g": 2, "d": "중", "q": "진핵세포에서 유전 정보가 전달되는 과정에 대한 설명으로 옳은 것은?", "c": ["전사와 번역 모두 핵 안에서 일어난다.", "번역은 미토콘드리아에서만 일어난다.", "전사는 핵에서, 번역은 리보솜에서 일어난다.", "전사는 리보솜에서, 번역은 핵에서 일어난다.", "단백질의 정보가 DNA로 전달된다."], "a": 3, "e": "핵 속에서 DNA의 정보가 RNA로 옮겨지고(전사), RNA가 세포질로 나와 리보솜에서 단백질이 합성된다(번역).", "p": ""}, {"id": "SC-112", "s": "통합과학", "t": "단편", "g": 2, "d": "중", "q": "다음 중 산화 환원 반응의 예가 <u>아닌</u> 것은?", "c": ["철이 녹슨다.", "묽은 염산과 수산화 나트륨 수용액이 반응하여 물이 생긴다.", "메테인이 연소한다.", "식물이 광합성을 한다.", "세포 호흡으로 포도당이 분해된다."], "a": 2, "e": "산과 염기가 만나 물이 생기는 것은 중화 반응으로, 전자의 이동이나 산소의 이동이 없다. 녹, 연소, 광합성, 세포 호흡은 모두 산화 환원 반응이다.", "p": ""}, {"id": "SC-113", "s": "통합과학", "t": "단편", "g": 2, "d": "중", "q": "일정량의 묽은 염산에 수산화 나트륨 수용액을 조금씩 넣으면서 온도를 잴 때, 혼합 용액의 온도가 가장 높은 지점은?", "c": ["수산화 나트륨 수용액을 넣기 직전", "수산화 나트륨 수용액을 가장 많이 넣은 지점", "산과 염기가 완전히 중화된 지점", "혼합 용액이 가장 강한 산성일 때", "온도는 변하지 않는다."], "a": 3, "e": "중화 반응이 일어나면 열(중화열)이 발생한다. 반응한 H⁺과 OH⁻의 수가 가장 많은, 완전히 중화된 지점에서 온도가 가장 높다.", "p": ""}, {"id": "SC-114", "s": "통합과학", "t": "단편", "g": 2, "d": "중", "q": "신생대에 대한 설명으로 옳은 것은?", "c": ["삼엽충과 양치식물이 번성하였다.", "공룡과 암모나이트가 번성하였다.", "포유류와 속씨식물이 번성하였다.", "최초의 생명체가 출현하였다.", "지질 시대 중 가장 길다."], "a": 3, "e": "신생대에는 포유류와 속씨식물이 번성하였고 후기에 인류의 조상이 나타났다. 삼엽충은 고생대, 공룡은 중생대에 번성하였다. 가장 긴 시대는 선캄브리아 시대이다.", "p": ""}, {"id": "SC-115", "s": "통합과학", "t": "단편", "g": 2, "d": "중", "q": "다윈의 자연 선택설에 대한 설명으로 옳은 것은?", "c": ["많이 사용한 기관이 발달하여 자손에게 전해진다.", "환경에 유리한 형질을 가진 개체가 더 많이 살아남아 자손을 남긴다.", "개체는 살아 있는 동안 스스로 필요한 형질을 만든다.", "모든 개체의 형질은 같다.", "환경은 생물의 진화에 영향을 주지 않는다."], "a": 2, "e": "자연 선택설에 따르면 같은 종의 개체들 사이에는 변이가 있고, 환경에 더 알맞은 형질을 가진 개체가 생존 경쟁에서 살아남아 그 형질을 자손에게 전한다.", "p": ""}, {"id": "SC-116", "s": "통합과학", "t": "단편", "g": 2, "d": "중", "q": "먹이 그물이 복잡한 생태계가 단순한 생태계보다 안정적인 까닭은?", "c": ["어떤 생물이 사라져도 그 역할을 대신할 다른 생물이 있어 평형이 쉽게 깨지지 않기 때문에", "생물의 종류가 적어 경쟁이 없기 때문에", "생산자가 없어도 유지되기 때문에", "에너지가 계속 순환하기 때문에", "분해자가 필요 없기 때문에"], "a": 1, "e": "종 다양성이 높아 먹이 그물이 복잡하면 한 종의 수가 변해도 다른 먹이 경로가 있어 생태계 평형이 잘 유지된다.", "p": ""}, {"id": "SC-117", "s": "통합과학", "t": "단편", "g": 2, "d": "상", "q": "우주 배경 복사에 대한 설명으로 옳은 것은?", "c": ["별이 만들어질 때 나온 빛이다.", "태양에서 나온 빛이 반사된 것이다.", "빅뱅 후 약 38만 년이 지나 원자가 만들어지면서 퍼져 나간 빛으로, 우주의 모든 방향에서 관측된다.", "우주의 특정한 방향에서만 관측된다.", "빅뱅 우주론으로는 설명할 수 없다."], "a": 3, "e": "우주가 식어 원자핵과 전자가 결합해 원자가 만들어지자 빛이 물질에 방해받지 않고 퍼져 나가기 시작하였다. 이 빛은 우주 팽창으로 파장이 길어져 지금은 약 2.7 K에 해당하는 전파로 모든 방향에서 관측된다.", "p": ""}, {"id": "SC-118", "s": "통합과학", "t": "단편", "g": 2, "d": "상", "q": "마그네슘(Mg, 원자 번호 12)과 염소(Cl, 원자 번호 17)가 결합하여 만드는 화합물의 화학식은?", "c": ["MgCl", "Mg₂Cl", "Mg₂Cl₃", "MgCl₂", "MgCl₃"], "a": 4, "e": "마그네슘은 전자 2개를 잃어 Mg²⁺이 되고, 염소는 전자 1개를 얻어 Cl⁻이 된다. 전하의 합이 0이 되려면 Mg²⁺ 1개에 Cl⁻ 2개가 결합해야 하므로 MgCl₂이다.", "p": ""}, {"id": "SC-119", "s": "통합과학", "t": "단편", "g": 2, "d": "상", "q": "원자 번호 13인 알루미늄(Al)의 주기율표에서의 위치는?", "c": ["3주기 13족", "2주기 13족", "3주기 3족", "2주기 3족", "4주기 13족"], "a": 1, "e": "알루미늄의 전자는 첫 번째 껍질에 2개, 두 번째 껍질에 8개, 세 번째 껍질에 3개가 들어 있다. 전자 껍질이 3개이므로 3주기, 원자가 전자가 3개이므로 13족이다.", "p": ""}, {"id": "SC-120", "s": "통합과학", "t": "수능", "g": 2, "d": "상", "q": "마찰이 없는 수평면에 정지해 있던 질량 2 kg인 물체에 수평 방향으로 4 N의 일정한 힘을 3초 동안 작용하였다. 3초 뒤 물체의 속력은?", "c": ["2 m/s", "4 m/s", "6 m/s", "8 m/s", "12 m/s"], "a": 3, "e": "충격량 = 4 N × 3 s = 12 N·s이고, 이는 운동량 변화량과 같다. 2 kg × v = 12 kg·m/s 이므로 v = 6 m/s이다.", "p": ""}, {"id": "SC-121", "s": "통합과학", "t": "수능", "g": 2, "d": "상", "q": "지면으로부터 5 m 높이에서 공을 수평 방향으로 10 m/s의 속력으로 던졌다. 공이 지면에 닿을 때까지 수평 방향으로 이동한 거리는? (단, 중력 가속도는 10 m/s²이고 공기 저항은 무시한다.)", "c": ["5 m", "10 m", "15 m", "20 m", "50 m"], "a": 2, "e": "연직 방향으로는 자유 낙하 운동을 하므로 5 = ½ × 10 × t² 에서 t = 1초이다. 수평 방향으로는 속력이 일정하므로 이동 거리 = 10 m/s × 1 s = 10 m이다.", "p": ""}, {"id": "SC-122", "s": "통합과학", "t": "단편", "g": 2, "d": "상", "q": "질량이 60 kg인 사람이 달에 갔을 때에 대한 설명으로 옳은 것은? (단, 지구의 중력 가속도는 10 m/s²이고 달의 중력은 지구의 1/6이다.)", "c": ["질량은 10 kg이 되고, 무게는 600 N으로 같다.", "질량과 무게가 모두 1/6로 줄어든다.", "질량과 무게 모두 변하지 않는다.", "질량은 60 kg으로 같고, 무게는 3,600 N이 된다.", "질량은 60 kg으로 같고, 무게는 100 N이 된다."], "a": 5, "e": "질량은 물체 고유의 양이어서 장소가 바뀌어도 변하지 않는다. 무게는 중력의 크기이므로 지구에서는 60 × 10 = 600 N, 달에서는 그 1/6인 100 N이다.", "p": ""}, {"id": "SC-123", "s": "통합과학", "t": "수능", "g": 2, "d": "상", "q": "지구 시스템의 상호 작용에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?<div class='box'>&lt;보기&gt;<br>ㄱ. 화산 폭발로 화산 가스가 대기로 방출되는 것은 지권과 기권의 상호 작용이다.<br>ㄴ. 파도가 해안의 암석을 깎아 절벽을 만드는 것은 수권과 지권의 상호 작용이다.<br>ㄷ. 바다에 녹은 이산화 탄소를 해양 생물이 흡수하여 껍데기를 만드는 것은 기권과 지권의 상호 작용이다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "ㄱ, ㄴ은 옳다. 바닷물에 녹아 있는 탄산 이온 등을 해양 생물이 이용하는 것은 수권과 생물권의 상호 작용이다.", "p": ""}, {"id": "SC-124", "s": "통합과학", "t": "단편", "g": 2, "d": "상", "q": "판을 움직이는 원동력으로 가장 적절한 것은?", "c": ["지구의 자전", "맨틀의 대류", "달의 인력", "태양 복사 에너지", "지구 자기장"], "a": 2, "e": "지구 내부 에너지에 의해 맨틀이 대류하면서 그 위에 놓인 판이 이동한다. 맨틀 대류가 올라오는 곳에서는 판이 갈라지고, 내려가는 곳에서는 판이 섭입한다.", "p": ""}, {"id": "SC-125", "s": "통합과학", "t": "단편", "g": 2, "d": "상", "q": "DNA에서 염기 3개가 한 조가 되어 하나의 아미노산을 지정할 때, 만들 수 있는 조합의 가짓수는?", "c": ["4가지", "12가지", "16가지", "20가지", "64가지"], "a": 5, "e": "염기는 4종류이므로 3개씩 조합하면 4 × 4 × 4 = 64가지가 된다. 이는 20종류의 아미노산을 지정하기에 충분하다. 염기 2개씩이라면 16가지뿐이어서 부족하다.", "p": ""}, {"id": "SC-126", "s": "통합과학", "t": "수능", "g": 2, "d": "상", "q": "효소가 있을 때와 없을 때의 화학 반응을 비교한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?<div class='box'>&lt;보기&gt;<br>ㄱ. 효소가 있으면 활성화 에너지가 낮아진다.<br>ㄴ. 효소가 있으면 반응 속도가 빨라진다.<br>ㄷ. 효소가 있으면 반응물과 생성물의 에너지 차이(반응열)가 줄어든다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "효소는 활성화 에너지를 낮추어 반응이 빠르게 일어나게 한다. 그러나 반응물과 생성물이 가진 에너지는 변하지 않으므로 반응열은 달라지지 않는다.", "p": ""}, {"id": "SC-127", "s": "통합과학", "t": "수능", "g": 2, "d": "상", "q": "메테인의 연소 반응 CH₄ + 2O₂ → CO₂ + 2H₂O 에 대한 설명으로 옳은 것은?", "c": ["산소는 산화된다.", "산화만 일어나고 환원은 일어나지 않는다.", "반응이 일어날 때 열을 흡수한다.", "반응 전후에 원자의 종류와 수가 달라진다.", "메테인의 탄소는 산소와 결합하므로 메테인은 산화된다."], "a": 5, "e": "메테인은 산소를 얻어 이산화 탄소와 물이 되므로 산화되고, 산소는 환원된다. 산화와 환원은 항상 동시에 일어나며, 연소는 열과 빛을 내놓는 반응이다.", "p": ""}, {"id": "SC-128", "s": "통합과학", "t": "수능", "g": 2, "d": "상", "q": "수소 이온(H⁺) 100개가 들어 있는 묽은 염산에 수산화 이온(OH⁻) 60개가 들어 있는 수산화 나트륨 수용액을 섞었다. 혼합 용액에 대한 설명으로 옳은 것은?", "c": ["혼합 용액은 염기성이다.", "혼합 용액에 남아 있는 수소 이온은 60개이다.", "중화 반응으로 생긴 물 분자는 60개이다.", "혼합 용액 속 나트륨 이온(Na⁺)은 40개이다.", "혼합 용액 속 염화 이온(Cl⁻)은 40개이다."], "a": 3, "e": "H⁺과 OH⁻은 1:1로 반응하므로 물 분자 60개가 생기고 H⁺ 40개가 남아 산성이다. 반응에 참여하지 않는 Na⁺은 60개, Cl⁻은 100개 그대로 있다.", "p": ""}, {"id": "SC-129", "s": "통합과학", "t": "단편", "g": 2, "d": "상", "q": "갈라파고스 제도의 핀치가 섬마다 부리 모양이 다른 까닭을 자연 선택설로 설명한 것은?", "c": ["핀치가 먹이에 맞게 부리를 열심히 써서 모양이 바뀌었기 때문에", "핀치가 필요에 따라 스스로 부리 모양을 선택하였기 때문에", "모든 섬의 먹이가 같았기 때문에", "핀치 사이에 변이가 전혀 없었기 때문에", "섬마다 먹이 환경이 달라, 그 먹이에 알맞은 부리를 가진 개체가 더 많이 살아남아 자손을 남겼기 때문에"], "a": 5, "e": "원래 핀치 무리에는 부리 모양의 변이가 있었고, 각 섬의 먹이 환경에 유리한 부리를 가진 개체가 선택되어 오랜 세월 뒤 서로 다른 종으로 나뉘었다.", "p": ""}, {"id": "SC-130", "s": "통합과학", "t": "단편", "g": 2, "d": "상", "q": "지질 시대 동안 가장 큰 규모의 생물 대멸종이 일어난 시기는?", "c": ["선캄브리아 시대 초", "중생대 초", "신생대 초", "신생대 말", "고생대 말"], "a": 5, "e": "고생대 말에는 대륙이 하나로 모여 판게아가 형성되고 대규모 화산 활동 등으로 환경이 급변하여 해양 생물 종의 대부분이 멸종하였다. 중생대 말에는 공룡 등이 멸종하였다.", "p": ""}, {"id": "SC-131", "s": "통합과학", "t": "단편", "g": 2, "d": "상", "q": "오늘날 생물 다양성을 감소시키는 가장 큰 원인으로 꼽히는 것은?", "c": ["생태 통로 설치", "국립 공원 지정", "종자 은행 운영", "멸종 위기종 복원 사업", "개발에 따른 서식지 파괴와 단편화"], "a": 5, "e": "숲을 베거나 도로를 내면 서식지가 사라지거나 작게 나뉘어 생물이 살아가기 어려워진다. 그 밖에 남획, 외래종 유입, 환경 오염 등도 생물 다양성을 감소시킨다. 나머지는 생물 다양성을 지키려는 노력이다.", "p": ""}, {"id": "SC-132", "s": "통합과학", "t": "단편", "g": 3, "d": "하", "q": "생태계를 구성하는 요소 중 비생물적 요인에 해당하는 것은?", "c": ["풀, 나무", "토끼, 여우", "버섯, 곰팡이", "세균", "빛, 온도, 물, 토양"], "a": 5, "e": "생태계는 생물적 요인(생산자, 소비자, 분해자)과 빛, 온도, 물, 공기, 토양 같은 비생물적 요인으로 이루어진다.", "p": ""}, {"id": "SC-133", "s": "통합과학", "t": "단편", "g": 3, "d": "하", "q": "일정한 지역에 사는 같은 종의 개체들의 무리를 무엇이라 하는가?", "c": ["군집", "생태계", "개체", "생물권", "개체군"], "a": 5, "e": "같은 종의 개체가 모여 개체군을, 여러 개체군이 모여 군집을 이루며, 군집과 비생물적 환경이 상호 작용하는 체계가 생태계이다.", "p": ""}, {"id": "SC-134", "s": "통합과학", "t": "단편", "g": 3, "d": "하", "q": "먹이 사슬을 따라 상위 영양 단계로 갈수록 전달되는 에너지양의 변화는?", "c": ["늘어난다.", "변하지 않는다.", "늘어났다 줄어든다.", "알 수 없다.", "줄어든다."], "a": 5, "e": "각 영양 단계의 생물은 받은 에너지의 대부분을 생명 활동에 쓰거나 열로 내보내므로, 상위 단계로 전달되는 에너지양은 점점 줄어든다.", "p": ""}, {"id": "SC-135", "s": "통합과학", "t": "단편", "g": 3, "d": "하", "q": "선인장의 잎이 가시로 변한 것은 어떤 환경 요인에 적응한 결과인가?", "c": ["물", "빛", "공기", "토양 속 양분", "일조 시간"], "a": 1, "e": "건조한 곳에 사는 선인장은 잎을 가시로 바꾸어 수분이 빠져나가는 것을 줄이고 줄기에 물을 저장한다.", "p": ""}, {"id": "SC-136", "s": "통합과학", "t": "단편", "g": 3, "d": "하", "q": "지구 온난화를 일으키는 온실 기체가 <u>아닌</u> 것은?", "c": ["이산화 탄소", "질소", "메테인", "수증기", "산화 이질소"], "a": 2, "e": "대기의 대부분을 차지하는 질소와 산소는 지구 복사 에너지를 거의 흡수하지 않는다. 이산화 탄소, 메테인, 수증기 등이 온실 기체이다.", "p": ""}, {"id": "SC-137", "s": "통합과학", "t": "단편", "g": 3, "d": "하", "q": "지구 온난화가 계속될 때 나타나는 현상으로 가장 적절한 것은?", "c": ["해수면이 낮아진다.", "극지방의 빙하 면적이 넓어진다.", "지구의 평균 기온이 낮아진다.", "빙하가 녹고 해수면이 높아진다.", "대기 중 이산화 탄소 농도가 낮아진다."], "a": 4, "e": "기온이 오르면 빙하가 녹고 바닷물이 열팽창하여 해수면이 높아진다. 이 때문에 저지대가 침수되고 기상 이변이 잦아진다.", "p": ""}, {"id": "SC-138", "s": "통합과학", "t": "단편", "g": 3, "d": "하", "q": "선풍기를 켰을 때 일어나는 주된 에너지 전환은?", "c": ["운동 에너지 → 전기 에너지", "전기 에너지 → 운동 에너지", "화학 에너지 → 전기 에너지", "빛에너지 → 전기 에너지", "열에너지 → 전기 에너지"], "a": 2, "e": "선풍기의 전동기는 전기 에너지를 날개의 운동 에너지로 바꾼다. 발전기는 반대로 운동 에너지를 전기 에너지로 바꾼다.", "p": ""}, {"id": "SC-139", "s": "통합과학", "t": "단편", "g": 3, "d": "하", "q": "전기 기구가 1초 동안 사용하는 전기 에너지인 '전력'의 단위는?", "c": ["W(와트)", "V(볼트)", "A(암페어)", "Ω(옴)", "J(줄)"], "a": 1, "e": "전력의 단위는 W(와트)이며, 1 W는 1초에 1 J의 전기 에너지를 쓰는 것을 뜻한다. V는 전압, A는 전류, Ω은 저항의 단위이다.", "p": ""}, {"id": "SC-140", "s": "통합과학", "t": "단편", "g": 3, "d": "하", "q": "화력 발전, 핵발전, 수력 발전에서 공통으로 일어나는 과정은?", "c": ["화석 연료를 태운다.", "터빈을 돌려 발전기에서 전기를 생산한다.", "우라늄을 핵분열시킨다.", "높은 곳의 물을 떨어뜨린다.", "햇빛을 직접 전기로 바꾼다."], "a": 2, "e": "세 발전 방식은 에너지원은 다르지만, 터빈을 회전시키고 터빈에 연결된 발전기에서 전자기 유도로 전기를 만든다는 점이 같다.", "p": ""}, {"id": "SC-141", "s": "통합과학", "t": "단편", "g": 3, "d": "하", "q": "풍력 발전에서 전기 에너지로 전환되는 에너지는?", "c": ["물의 위치 에너지", "연료의 화학 에너지", "바람의 운동 에너지", "원자핵의 핵에너지", "땅속의 열에너지"], "a": 3, "e": "풍력 발전은 바람이 날개를 돌리는 운동 에너지를 발전기에서 전기 에너지로 바꾼다.", "p": ""}, {"id": "SC-142", "s": "통합과학", "t": "단편", "g": 3, "d": "하", "q": "핵발전소에서 연료로 쓰는 물질은?", "c": ["우라늄", "석탄", "천연가스", "수소", "헬륨"], "a": 1, "e": "핵발전은 우라늄 원자핵이 핵분열할 때 나오는 에너지로 물을 끓여 터빈을 돌린다.", "p": ""}, {"id": "SC-143", "s": "통합과학", "t": "단편", "g": 3, "d": "하", "q": "석탄, 석유와 같은 화석 연료에 저장된 에너지의 근원은?", "c": ["태양 에너지", "지구 내부 에너지", "조력 에너지", "핵에너지", "지구 자전 에너지"], "a": 1, "e": "화석 연료는 옛날 생물이 광합성으로 저장한 태양 에너지가 땅속에 묻혀 변한 것이다.", "p": ""}, {"id": "SC-144", "s": "통합과학", "t": "단편", "g": 3, "d": "하", "q": "수소 연료 전지에서 수소와 산소가 반응하여 전기를 만들 때 생기는 물질은?", "c": ["이산화 탄소", "메테인", "질소", "일산화 탄소", "물"], "a": 5, "e": "수소 연료 전지는 수소와 산소의 화학 반응으로 전기를 만들고 물만 배출하므로 환경 오염이 적다.", "p": ""}, {"id": "SC-145", "s": "통합과학", "t": "단편", "g": 3, "d": "하", "q": "온도가 다른 두 물체를 접촉시켰을 때 열이 이동하는 방향은?", "c": ["온도가 낮은 물체에서 높은 물체로", "질량이 큰 물체에서 작은 물체로", "부피가 큰 물체에서 작은 물체로", "열은 이동하지 않는다.", "온도가 높은 물체에서 낮은 물체로"], "a": 5, "e": "열은 스스로 고온에서 저온으로만 이동하며, 두 물체의 온도가 같아질 때까지 이동한다.", "p": ""}, {"id": "SC-146", "s": "통합과학", "t": "단편", "g": 3, "d": "하", "q": "식물이 광합성을 할 때 흡수하는 기체는?", "c": ["산소", "질소", "수소", "이산화 탄소", "메테인"], "a": 4, "e": "식물은 빛에너지를 이용해 이산화 탄소와 물로 포도당을 만들고 산소를 내놓는다.", "p": ""}, {"id": "SC-147", "s": "통합과학", "t": "단편", "g": 3, "d": "하", "q": "에너지를 절약하는 방법으로 적절하지 <u>않은</u> 것은?", "c": ["에너지 소비 효율 1등급 제품을 사용한다.", "사용하지 않는 전등을 끈다.", "냉방할 때 창문을 열어 둔다.", "백열전구를 LED 전구로 바꾼다.", "가까운 거리는 걸어 다닌다."], "a": 3, "e": "냉방 중에 창문을 열면 찬 공기가 빠져나가 전기가 더 많이 쓰인다. 효율이 높은 제품을 쓰고 불필요한 에너지 사용을 줄여야 한다.", "p": ""}, {"id": "SC-148", "s": "통합과학", "t": "단편", "g": 3, "d": "중", "q": "생물이 비생물적 환경에 영향을 주는 예는?", "c": ["가을에 기온이 낮아지면 단풍이 든다.", "지렁이가 흙 속을 돌아다녀 토양의 통기성이 좋아진다.", "일조 시간이 짧아지면 국화가 꽃을 피운다.", "추운 곳에 사는 여우는 귀가 작다.", "빛이 강한 곳의 잎은 두껍다."], "a": 2, "e": "생물이 환경에 영향을 주는 것을 반작용이라 한다. 나머지는 온도, 일조 시간, 빛 같은 환경 요인이 생물에 영향을 주는 예이다.", "p": ""}, {"id": "SC-149", "s": "통합과학", "t": "단편", "g": 3, "d": "중", "q": "추운 지방에 사는 북극여우가 더운 지방에 사는 사막여우보다 귀가 작고 몸집이 큰 까닭은?", "c": ["소리를 더 잘 듣기 위해", "물을 저장하기 위해", "빛을 더 많이 받기 위해", "천적의 눈에 잘 띄기 위해", "몸의 열이 빠져나가는 것을 줄이기 위해"], "a": 5, "e": "추운 곳의 동물은 몸의 말단부가 작고 몸집이 커서 부피에 비해 표면적이 작아 열 손실이 적다. 이는 온도에 대한 적응이다.", "p": ""}, {"id": "SC-150", "s": "통합과학", "t": "단편", "g": 3, "d": "중", "q": "지구의 연평균 기온이 거의 일정하게 유지되는 까닭은?", "c": ["지구가 태양 복사 에너지를 전혀 흡수하지 않기 때문에", "지구가 에너지를 방출하지 않기 때문에", "대기가 모든 에너지를 반사하기 때문에", "지구가 흡수하는 태양 복사 에너지양과 방출하는 지구 복사 에너지양이 같기 때문에", "지구 내부 에너지가 계속 늘어나기 때문에"], "a": 4, "e": "지구는 흡수한 만큼 에너지를 방출하는 복사 평형 상태에 있다. 온실 기체가 늘어나면 더 높은 온도에서 평형을 이루게 되어 지구 온난화가 일어난다.", "p": ""}, {"id": "SC-151", "s": "통합과학", "t": "단편", "g": 3, "d": "중", "q": "우리나라가 속한 중위도 지역의 지표 부근에서 주로 부는 바람은?", "c": ["편서풍", "무역풍", "극동풍", "계절풍", "해륙풍"], "a": 1, "e": "대기 대순환에 따라 위도 0°~30°에서는 무역풍, 30°~60°에서는 편서풍, 60°~90°에서는 극동풍이 분다. 그래서 우리나라의 날씨는 대체로 서쪽에서 동쪽으로 변해 간다.", "p": ""}, {"id": "SC-152", "s": "통합과학", "t": "단편", "g": 3, "d": "중", "q": "위도 30° 부근에 사막이 많이 분포하는 까닭은?", "c": ["하강 기류가 발달하여 날씨가 맑고 건조하기 때문에", "상승 기류가 발달하여 구름이 많기 때문에", "극지방의 찬 공기가 내려오기 때문에", "바다가 없기 때문에", "태양 복사 에너지가 가장 적게 도달하기 때문에"], "a": 1, "e": "적도에서 상승한 공기가 위도 30° 부근에서 내려오면서 고압대가 만들어진다. 하강 기류가 있는 곳은 구름이 잘 생기지 않아 증발량이 강수량보다 많다.", "p": ""}, {"id": "SC-153", "s": "통합과학", "t": "단편", "g": 3, "d": "중", "q": "해류의 역할에 대한 설명으로 옳은 것은?", "c": ["고위도의 에너지를 저위도로만 운반한다.", "에너지를 운반하지 못한다.", "대기 대순환과 관계없이 흐른다.", "저위도의 남는 에너지를 고위도로 운반하여 위도별 에너지 불균형을 줄인다.", "지구의 자전을 일으킨다."], "a": 4, "e": "표층 해류는 대기 대순환의 바람에 의해 만들어지며, 대기와 함께 저위도의 에너지를 고위도로 옮겨 지구 전체의 에너지 균형에 기여한다.", "p": ""}, {"id": "SC-154", "s": "통합과학", "t": "단편", "g": 3, "d": "중", "q": "220 V의 전압에서 2 A의 전류가 흐르는 전기 기구의 소비 전력은?", "c": ["110 W", "222 W", "440 W", "880 W", "4,400 W"], "a": 3, "e": "전력 = 전압 × 전류 = 220 V × 2 A = 440 W이다.", "p": ""}, {"id": "SC-155", "s": "통합과학", "t": "단편", "g": 3, "d": "중", "q": "소비 전력이 100 W인 전등을 5시간 동안 켰을 때 사용한 전력량은?", "c": ["0.05 kWh", "0.5 kWh", "5 kWh", "20 kWh", "500 kWh"], "a": 2, "e": "전력량 = 전력 × 시간 = 100 W × 5 h = 500 Wh = 0.5 kWh이다.", "p": ""}, {"id": "SC-156", "s": "통합과학", "t": "단편", "g": 3, "d": "중", "q": "같은 밝기를 낼 때 LED 전구가 백열전구보다 전기를 적게 쓰는 까닭은?", "c": ["에너지 보존 법칙이 성립하지 않기 때문에", "열에너지를 더 많이 내놓기 때문에", "전기 에너지를 새로 만들어 내기 때문에", "전압이 더 높기 때문에", "공급받은 전기 에너지 중 빛에너지로 전환되는 비율이 높고 열로 버려지는 비율이 낮기 때문에"], "a": 5, "e": "에너지 효율은 공급한 에너지 가운데 유용하게 쓰인 에너지의 비율이다. 백열전구는 전기 에너지의 대부분이 열로 버려지지만 LED 전구는 빛으로 전환되는 비율이 높다.", "p": ""}, {"id": "SC-157", "s": "통합과학", "t": "단편", "g": 3, "d": "중", "q": "핵분열과 핵융합의 공통점으로 옳은 것은?", "c": ["가벼운 원자핵이 합쳐져 무거운 원자핵이 된다.", "무거운 원자핵이 쪼개진다.", "반응 과정에서 줄어든 질량이 에너지로 전환된다.", "태양에서 주로 일어나는 반응이다.", "반응 전후 질량의 합이 같다."], "a": 3, "e": "핵분열은 무거운 원자핵이 쪼개지는 반응, 핵융합은 가벼운 원자핵이 합쳐지는 반응이다. 두 반응 모두 반응 뒤 질량이 조금 줄어들고 그만큼 큰 에너지가 나온다.", "p": ""}, {"id": "SC-158", "s": "통합과학", "t": "단편", "g": 3, "d": "중", "q": "조력 발전에 대한 설명으로 옳은 것은?", "c": ["밀물과 썰물 때 생기는 바닷물의 높이 차를 이용한다.", "파도의 움직임을 이용한다.", "바람의 운동 에너지를 이용한다.", "땅속의 열을 이용한다.", "태양 빛을 직접 전기로 바꾼다."], "a": 1, "e": "조력 발전은 조석 현상으로 생기는 해수면의 높이 차를 이용해 터빈을 돌린다. 파도의 운동을 이용하는 것은 파력 발전이다.", "p": ""}, {"id": "SC-159", "s": "통합과학", "t": "단편", "g": 3, "d": "중", "q": "수력 발전에서 일어나는 에너지 전환 과정으로 옳은 것은?", "c": ["물의 위치 에너지 → 운동 에너지 → 전기 에너지", "화학 에너지 → 열에너지 → 전기 에너지", "핵에너지 → 열에너지 → 전기 에너지", "빛에너지 → 전기 에너지", "전기 에너지 → 위치 에너지"], "a": 1, "e": "댐에 가둔 물이 높은 곳에서 떨어지면서 위치 에너지가 운동 에너지로 바뀌어 터빈을 돌리고, 발전기에서 전기 에너지가 만들어진다.", "p": ""}, {"id": "SC-160", "s": "통합과학", "t": "단편", "g": 3, "d": "중", "q": "같은 종의 개체들 사이에 나타나는 형질의 차이(변이)가 생기는 원인으로 옳은 것은?", "c": ["돌연변이와 유성 생식 과정에서의 유전자 조합", "개체가 평생 운동으로 얻은 근육", "개체의 의지와 노력", "먹이의 양", "사고로 생긴 흉터"], "a": 1, "e": "유전적 변이는 DNA의 유전 정보가 바뀌는 돌연변이와, 유성 생식에서 부모의 유전자가 다양하게 조합되는 과정에서 생긴다. 살아가면서 얻은 형질은 자손에게 유전되지 않는다.", "p": ""}, {"id": "SC-161", "s": "통합과학", "t": "단편", "g": 3, "d": "중", "q": "'생태계 다양성'의 의미로 옳은 것은?", "c": ["한 생태계에 사는 생물 종의 수", "같은 종의 개체들이 가진 유전자의 차이", "어느 지역에 숲, 초원, 갯벌, 습지 등 여러 종류의 생태계가 있는 정도", "한 종의 개체 수가 많은 정도", "먹이 사슬의 길이"], "a": 3, "e": "생물 다양성은 유전적 다양성(같은 종 안의 유전자 차이), 종 다양성(종의 수와 분포의 고른 정도), 생태계 다양성(생태계의 다양한 정도)을 모두 포함한다.", "p": ""}, {"id": "SC-162", "s": "통합과학", "t": "단편", "g": 3, "d": "중", "q": "지질 시대를 길이가 긴 것부터 순서대로 나열한 것은?", "c": ["선캄브리아 시대 - 고생대 - 중생대 - 신생대", "고생대 - 선캄브리아 시대 - 중생대 - 신생대", "신생대 - 중생대 - 고생대 - 선캄브리아 시대", "선캄브리아 시대 - 중생대 - 고생대 - 신생대", "중생대 - 고생대 - 신생대 - 선캄브리아 시대"], "a": 1, "e": "선캄브리아 시대는 지구 탄생부터 약 5억 4천만 년 전까지로 지질 시대의 대부분을 차지한다. 그다음 고생대, 중생대, 신생대 순으로 길다.", "p": ""}, {"id": "SC-163", "s": "통합과학", "t": "단편", "g": 3, "d": "중", "q": "어떤 열기관도 열효율이 100%가 될 수 없는 까닭은?", "c": ["에너지 보존 법칙이 성립하지 않기 때문에", "열에너지는 일로 전혀 전환되지 않기 때문에", "연료가 부족하기 때문에", "열이 저온에서 고온으로 스스로 이동하기 때문에", "공급받은 열에너지의 일부가 반드시 일로 전환되지 못하고 낮은 온도의 주변으로 방출되기 때문에"], "a": 5, "e": "열기관은 고온에서 받은 열의 일부만 일로 바꾸고 나머지는 저온으로 내보낸다. 에너지의 총량은 보존되지만 버려진 열은 다시 쓰기 어렵다.", "p": ""}, {"id": "SC-164", "s": "통합과학", "t": "수능", "g": 3, "d": "상", "q": "생태계에서의 에너지 흐름과 물질 순환에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?<div class='box'>&lt;보기&gt;<br>ㄱ. 에너지는 생태계 안에서 순환하지 않고 한 방향으로 흐른다.<br>ㄴ. 탄소와 같은 물질은 생물과 환경 사이를 순환한다.<br>ㄷ. 각 영양 단계의 에너지는 모두 다음 영양 단계로 전달된다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "에너지는 먹이 사슬을 따라 이동하다가 열로 방출되어 생태계 밖으로 빠져나가므로 순환하지 않는다. 물질은 순환한다. 각 단계의 에너지 중 일부만 다음 단계로 전달된다.", "p": ""}, {"id": "SC-165", "s": "통합과학", "t": "수능", "g": 3, "d": "상", "q": "어떤 생태계에서 각 영양 단계의 에너지양이 생산자 2,000, 1차 소비자 200, 2차 소비자 40일 때, 이에 대한 설명으로 옳은 것은? (단, 에너지 효율(%)은 전 단계 에너지양에 대한 현 단계 에너지양의 비율이다.)", "c": ["1차 소비자의 에너지 효율은 20%이다.", "에너지 효율은 2차 소비자가 1차 소비자의 2배이다.", "2차 소비자의 에너지 효율은 10%이다.", "상위 영양 단계로 갈수록 에너지양이 늘어난다.", "1차 소비자와 2차 소비자의 에너지 효율은 같다."], "a": 2, "e": "1차 소비자의 에너지 효율은 200/2,000 × 100 = 10%, 2차 소비자는 40/200 × 100 = 20%이다. 따라서 2차 소비자의 효율이 2배이다.", "p": ""}, {"id": "SC-166", "s": "통합과학", "t": "수능", "g": 3, "d": "상", "q": "지구에 도달하는 태양 복사 에너지를 100이라 할 때 30은 반사되어 우주로 되돌아간다. 지구가 복사 평형 상태일 때, 지구가 우주로 방출하는 지구 복사 에너지의 양은?", "c": ["30", "50", "70", "100", "130"], "a": 3, "e": "지구가 흡수하는 태양 복사 에너지는 100 - 30 = 70이다. 복사 평형 상태에서는 흡수한 양과 방출하는 양이 같으므로 지구 복사 에너지는 70이다.", "p": ""}, {"id": "SC-167", "s": "통합과학", "t": "수능", "g": 3, "d": "상", "q": "지구 온난화에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?<div class='box'>&lt;보기&gt;<br>ㄱ. 대기 중 온실 기체의 농도가 높아지면 지표가 방출한 복사 에너지가 대기에 더 많이 흡수된다.<br>ㄴ. 극지방의 빙하가 줄어들면 지표의 태양 빛 반사율이 낮아진다.<br>ㄷ. 빙하 면적의 감소는 지구 온난화를 늦추는 요인이다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "온실 기체가 늘면 지구 복사 에너지를 더 많이 흡수하여 기온이 오른다. 빙하가 줄면 반사율이 낮아져 지표가 태양 에너지를 더 많이 흡수하므로 온난화가 더 빨라진다.", "p": ""}, {"id": "SC-168", "s": "통합과학", "t": "수능", "g": 3, "d": "상", "q": "코일과 자석으로 전자기 유도 실험을 할 때 유도 전류에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?<div class='box'>&lt;보기&gt;<br>ㄱ. 자석을 코일 속에 넣고 가만히 두면 유도 전류가 흐르지 않는다.<br>ㄴ. 자석을 더 빠르게 움직이면 유도 전류의 세기가 커진다.<br>ㄷ. 자석을 코일에 넣을 때와 뺄 때 유도 전류의 방향은 같다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "유도 전류는 코일을 지나는 자기장이 변할 때에만 흐르고, 자기장이 빠르게 변할수록 세다. 자석을 넣을 때와 뺄 때는 자기장의 변화가 반대이므로 전류의 방향도 반대이다.", "p": ""}, {"id": "SC-169", "s": "통합과학", "t": "수능", "g": 3, "d": "상", "q": "1차 코일의 감은 수가 100회, 2차 코일의 감은 수가 500회인 변압기의 1차 코일에 5 A의 전류가 흐른다. 2차 코일에 흐르는 전류의 세기는? (단, 변압기에서의 에너지 손실은 없다.)", "c": ["0.2 A", "1 A", "5 A", "25 A", "500 A"], "a": 2, "e": "전압은 감은 수에 비례하므로 2차 코일의 전압은 1차의 5배이다. 에너지 손실이 없으면 1차와 2차의 전력(전압 × 전류)이 같으므로 전류는 1/5인 1 A가 된다.", "p": ""}, {"id": "SC-170", "s": "통합과학", "t": "단편", "g": 3, "d": "상", "q": "외부에서 에너지를 공급받지 않고도 계속 일을 하는 '영구 기관'을 만들 수 없는 까닭은?", "c": ["에너지는 새로 생겨나지 않으며, 일을 하는 과정에서 일부가 다시 쓸 수 없는 열로 흩어지기 때문에", "에너지가 전환될 때 전체 양이 늘어나기 때문에", "마찰이 없으면 물체가 움직일 수 없기 때문에", "열에너지는 에너지가 아니기 때문에", "기술이 아직 부족할 뿐 원리적으로는 가능하기 때문에"], "a": 1, "e": "에너지 보존 법칙에 따라 없던 에너지를 만들어 낼 수 없고, 에너지가 전환될 때마다 일부가 마찰 등으로 열이 되어 흩어지므로 영구 기관은 원리적으로 불가능하다.", "p": ""}, {"id": "SC-171", "s": "통합과학", "t": "수능", "g": 3, "d": "상", "q": "핵발전소의 원자로에서 일어나는 반응에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?<div class='box'>&lt;보기&gt;<br>ㄱ. 우라늄 원자핵이 중성자를 흡수하여 쪼개지면서 에너지와 중성자 2~3개를 내놓는다.<br>ㄴ. 방출된 중성자가 다른 우라늄 원자핵을 분열시키는 연쇄 반응이 일어난다.<br>ㄷ. 제어봉은 중성자를 방출하여 반응 속도를 높이는 역할을 한다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "우라늄의 핵분열에서 나온 중성자가 다시 다른 원자핵을 분열시켜 연쇄 반응이 일어난다. 제어봉은 중성자를 흡수하여 연쇄 반응의 속도를 조절한다.", "p": ""}, {"id": "SC-172", "s": "통합과학", "t": "단편", "g": 3, "d": "상", "q": "태양 중심부에서 일어나는 핵융합 반응에 대한 설명으로 옳은 것은?", "c": ["헬륨 원자핵이 쪼개져 수소 원자핵이 된다.", "수소 원자핵 4개가 융합하여 헬륨 원자핵 1개가 되며, 이때 줄어든 질량이 에너지로 전환된다.", "반응 뒤 질량이 늘어난다.", "우라늄 원자핵이 분열한다.", "낮은 온도에서 일어나는 화학 반응이다."], "a": 2, "e": "태양 중심부는 온도가 매우 높아 수소 핵융합 반응이 일어난다. 헬륨 원자핵 1개의 질량은 수소 원자핵 4개의 질량의 합보다 조금 작으며, 이 질량 차이만큼 에너지가 방출된다.", "p": ""}, {"id": "SC-173", "s": "통합과학", "t": "단편", "g": 3, "d": "상", "q": "질량이 2 kg인 물체의 속력이 3 m/s에서 6 m/s로 빨라졌을 때, 이 물체의 운동 에너지는 몇 배가 되는가?", "c": ["2배", "3배", "4배", "6배", "9배"], "a": 3, "e": "운동 에너지는 ½ × 질량 × 속력²이므로 속력의 제곱에 비례한다. 속력이 2배가 되면 운동 에너지는 4배(9 J → 36 J)가 된다.", "p": ""}, {"id": "SC-174", "s": "통합과학", "t": "수능", "g": 3, "d": "상", "q": "검은색 산화 구리(Ⅱ)와 탄소 가루를 섞어 가열하면 붉은색 구리가 생긴다(2CuO + C → 2Cu + CO₂). 이에 대한 설명으로 옳은 것은?", "c": ["산화 구리(Ⅱ)는 산소를 잃고 환원된다.", "탄소는 산소를 잃고 환원된다.", "구리는 산소를 얻는다.", "산화 구리(Ⅱ)는 산화된다.", "이 반응에서 산화만 일어난다."], "a": 1, "e": "산화 구리(Ⅱ)는 산소를 잃어 구리로 환원되고, 탄소는 산소를 얻어 이산화 탄소로 산화된다. 산화와 환원은 동시에 일어난다.", "p": ""}, {"id": "SC-175", "s": "통합과학", "t": "단편", "g": 3, "d": "상", "q": "낫 모양 적혈구 빈혈증이 나타나는 과정에 대한 설명으로 옳은 것은?", "c": ["염색체 수가 하나 더 많아진 결과이다.", "철분 섭취가 부족하여 나타난다.", "세균에 감염되어 나타난다.", "DNA 염기 하나가 바뀌어 단백질(헤모글로빈)의 아미노산 하나가 달라진 결과이다.", "DNA의 유전 정보와는 관계가 없다."], "a": 4, "e": "헤모글로빈 유전자의 염기 하나가 바뀌면 지정되는 아미노산이 달라져 헤모글로빈의 구조가 변하고, 그 결과 적혈구가 낫 모양으로 변한다. 유전 정보의 변화가 형질의 변화로 이어지는 예이다.", "p": ""}, {"id": "SC-176", "s": "통합과학", "t": "수능", "g": 3, "d": "상", "q": "다윈의 자연 선택설에 따른 진화 과정을 순서대로 바르게 나열한 것은?<div class='box'>(가) 환경에 알맞은 형질을 가진 개체가 살아남아 자손을 남긴다.<br>(나) 생물은 살아남을 수 있는 수보다 많은 자손을 낳는다.<br>(다) 개체들 사이에 먹이와 서식지를 둘러싼 경쟁이 일어난다.<br>(라) 이 과정이 오랫동안 반복되어 생물이 진화한다.</div>", "c": ["(가)-(나)-(다)-(라)", "(나)-(가)-(다)-(라)", "(나)-(다)-(가)-(라)", "(다)-(나)-(가)-(라)", "(다)-(가)-(나)-(라)"], "a": 3, "e": "과잉 생산 → 개체 변이와 생존 경쟁 → 자연 선택 → 진화의 순서이다.", "p": ""}, {"id": "SC-177", "s": "통합과학", "t": "단편", "g": 3, "d": "상", "q": "고생대에 생물이 육상으로 진출할 수 있었던 까닭으로 가장 적절한 것은?", "c": ["지구의 기온이 급격히 낮아졌기 때문에", "대기 중 산소가 늘어나 오존층이 형성되면서 해로운 자외선이 차단되었기 때문에", "바닷물이 모두 증발하였기 때문에", "대기 중 이산화 탄소가 사라졌기 때문에", "공룡이 멸종하였기 때문에"], "a": 2, "e": "광합성 생물이 내놓은 산소가 대기에 쌓여 오존층이 만들어지자, 지표에 닿는 자외선이 줄어들어 생물이 육지에서도 살 수 있게 되었다.", "p": ""}, {"id": "SC-178", "s": "통합과학", "t": "단편", "g": 3, "d": "상", "q": "원시 지구의 형성 과정을 순서대로 바르게 나열한 것은?", "c": ["마그마 바다 → 미행성 충돌 → 원시 바다 형성 → 맨틀과 핵의 분리 → 원시 지각 형성", "원시 바다 형성 → 원시 지각 형성 → 마그마 바다 → 미행성 충돌 → 맨틀과 핵의 분리", };

const saved = store.get("quiz-filters2", {}) || {};
const keep = (arr, all) => { const v = (Array.isArray(arr) ? arr : all).filter(x => all.includes(x)); return new Set(v.length ? v : all); };
const state = {
  mode: saved.mode === "bell" ? "bell" : "practice",

  grades: keep(saved.grades, [1, 2, 3]),
  levels: keep(saved.levels, ["하", "중", "상"]),

};

    grades: [...state.grades], levels: [...state.levels], bellGrades: [...state.bellGrades] });
}
const practicePool = () => BANK.filter(q => state.types.has(q.t) && state.subjects.has(q.s) && state.grades.has(q.g) && state.levels.has(q.d));
const bellPool = () => BANK.filter(q => state.bellGrades.has(q.g));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content; }
function wrongList() { return store.get("quiz-wrong", []).filter(id => BANK.some(q => q.id === id)); }
function fmt(ms) { const s = Math.floor(ms / 1000); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); }
const chip = (attr, v, on, label, n) => `<button class="chip" ${attr}="${v}" aria-pressed="${on}">${label}${n === undefined ? "" : `<small>${n}</small>`}</button>`;

/* 골든벨 문제 고르기: 과목이 고르게 섞이도록 과목별로 돌아가며 뽑는다 */
function bellPick() {
  const by = SUBJECTS.map(s => shuffle(bellPool().filter(q => q.s === s)));
  const out = [];
  for (let r = 0; out.length < BELL_SIZE && by.some(a => a.length); r++)
    for (const a of shuffle(by)) if (a.length && out.length < BELL_SIZE) out.push(a.pop());
  return shuffle(out);
}
