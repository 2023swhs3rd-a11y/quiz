<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주요과목 문제은행</title>

<style>
/* /assets/site.css 의 사본(단독 실행·미리보기용). 사이트에 올리는 파일은 원본 site.css 를 불러온다. */
:root {
  --bon-font: "Pretendard Variable", Pretendard, system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --bon-bg: #f4f5f7;       
  --bon-card: #ffffff;     
  --bon-soft: #eef1f5;     
  --bon-text: #111827;     
  --bon-body: #374151;     
  --bon-muted: #6b7280;    
  --bon-line: #e5e7eb;     
  --bon-brand: #1e3a8a;
  --bon-c-plan: #1d4ed8;   
  --bon-c-jinhak: #6d28d9; 
  --bon-c-gg: #0e7490;     
  --bon-c-news: #15803d;   
  --bon-c-book: #c2410c;   
  --bon-c-matrix: #be185d; 
  --bon-accent: var(--bon-brand);
  --bon-max: 1160px;       
  --bon-gutter: 16px;      
  --bon-radius: 16px;      
  --bon-radius-sm: 10px;   
  --bon-shadow: 0 1px 2px rgba(17,24,39,.04), 0 2px 8px rgba(17,24,39,.05);
  --bon-shadow-hover: 0 14px 32px rgba(17,24,39,.12);
  --bon-ease: .18s ease;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bon-bg: #0f1216; --bon-card: #171b21; --bon-soft: #222831;
    --bon-text: #f3f4f6; --bon-body: #d1d5db; --bon-muted: #9ca3af; --bon-line: #2a3039;
    --bon-brand: #a5b4fc;
    --bon-c-plan: #7aa2ff; --bon-c-jinhak: #b79bff; --bon-c-gg: #4fc3dc; --bon-c-news: #4ade80; --bon-c-book: #fb923c; --bon-c-matrix: #f472b6;
    --bon-shadow: none; --bon-shadow-hover: 0 14px 32px rgba(0,0,0,.45); } }
:root[data-theme="dark"] { --bon-bg: #0f1216; --bon-card: #171b21; --bon-soft: #222831;
    --bon-text: #f3f4f6; --bon-body: #d1d5db; --bon-muted: #9ca3af; --bon-line: #2a3039;
    --bon-brand: #a5b4fc;
    --bon-c-plan: #7aa2ff; --bon-c-jinhak: #b79bff; --bon-c-gg: #4fc3dc; --bon-c-news: #4ade80; --bon-c-book: #fb923c; --bon-c-matrix: #f472b6;
    --bon-shadow: none; --bon-shadow-hover: 0 14px 32px rgba(0,0,0,.45); }
:where(*, *::before, *::after) { box-sizing: border-box; }
:where(body) {
  margin: 0; background: var(--bon-bg); color: var(--bon-body);
  font-family: var(--bon-font); font-size: 16px; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;      
  overflow-wrap: anywhere;   
}
:where(button, input, select, textarea) { font-family: inherit; }
.bon-wrap { max-width: var(--bon-max); margin: 0 auto; padding: 0 var(--bon-gutter); }
.bon-bar { background: var(--bon-card); border-bottom: 1px solid var(--bon-line); font-family: var(--bon-font); font-size: .82rem; line-height: 1.4; }
.bon-bar-in { max-width: var(--bon-max); margin: 0 auto; padding: 8px var(--bon-gutter); display: flex; align-items: center; gap: 8px; min-width: 0; }
.bon-bar a { display: inline-flex; align-items: center; gap: 7px; flex: none; color: var(--bon-brand); font-weight: 700; text-decoration: none; }
.bon-bar a::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.bon-bar a:hover { text-decoration: underline; }
.bon-bar a:focus-visible { outline: 2px solid var(--bon-brand); outline-offset: 2px; border-radius: 4px; }
.bon-bar span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--bon-muted); }
.bon-bar span::before { content: "›"; margin-right: 8px; color: var(--bon-muted); }
@media print { .bon-bar { display: none; } }
.bon-header { padding: 28px 0 8px; }
.bon-school { display: flex; width: fit-content; align-items: center; gap: 8px; margin: 0; font-size: .9rem; font-weight: 700; color: var(--bon-brand); }
.bon-school::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.bon-title { margin: 8px 0 10px; color: var(--bon-text); font-size: clamp(1.9rem, 4.6vw, 2.75rem); font-weight: 800; letter-spacing: -0.035em; line-height: 1.2; }
.bon-lead { margin: 0; max-width: 42em; color: var(--bon-muted); font-size: 1.05rem; }
.bon-sec { display: flex; align-items: baseline; gap: 12px; margin: 0 0 14px; }
.bon-sec h2 { margin: 0; color: var(--bon-text); font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; }
.bon-sec p { margin: 0; color: var(--bon-muted); font-size: .9rem; }
@media (max-width: 640px) { .bon-sec { flex-direction: column; gap: 2px; } }
.bon-card {
  position: relative; display: flex; flex-direction: column; min-width: 0;
  background: var(--bon-card); border: 1px solid var(--bon-line); border-radius: var(--bon-radius);
  overflow: hidden; box-shadow: var(--bon-shadow);
  transition: transform var(--bon-ease), box-shadow var(--bon-ease), border-color var(--bon-ease);
}
a.bon-card { color: inherit; text-decoration: none; }
a.bon-card:hover, .bon-card.is-link:hover { transform: translateY(-3px); box-shadow: var(--bon-shadow-hover); border-color: color-mix(in srgb, var(--bon-accent) 45%, var(--bon-line)); }
.bon-card:focus-visible { outline: 3px solid var(--bon-accent); outline-offset: 3px; }
.bon-tag { display: inline-flex; align-self: flex-start; width: fit-content; align-items: center; gap: 4px; font-size: .76rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; color: var(--bon-accent); background: color-mix(in srgb, var(--bon-accent) 10%, var(--bon-card)); }
.bon-tag.is-plain { color: var(--bon-muted); background: transparent; border: 1px solid var(--bon-line); }
.bon-go { display: inline-flex; align-self: flex-start; width: fit-content; align-items: center; gap: 6px; font-weight: 700; font-size: .95rem; color: var(--bon-accent); text-decoration: none; }
.bon-go::after { content: "→"; transition: transform var(--bon-ease); }
.bon-go.is-out::after { content: "↗"; }
.bon-go:hover { text-decoration: underline; }
.bon-go:hover::after { transform: translateX(3px); }
.bon-go.is-out:hover::after { transform: translate(2px, -2px); }
.bon-note { margin: 14px 0 0; font-size: .86rem; color: var(--bon-muted); background: var(--bon-soft); border-radius: 12px; padding: 12px 16px; }
.bon-note b { color: var(--bon-text); }
.bon-footer { margin: 52px 0 32px; padding-top: 18px; border-top: 1px solid var(--bon-line); color: var(--bon-muted); font-size: .85rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; }
.bon-footer p { margin: 0; }
.bon-footer .bon-footer-info { flex: 1 1 100%; }
.bon-footer a { color: inherit; }
@media (prefers-reduced-motion: reduce) {
  .bon-card, .bon-go::after { transition: none; }
}
</style>
<style>
/* 봉일천고 진로진학부 공통 스타일(/assets/site.css)의 --bon-* 값을 그대로 쓴다. 이 사이트 고유색만 여기서 정한다. */
:root {
  --accent: #a16207; --on-accent: #ffffff;
  --ok: #15803d; --bad: #b91c1c;
  --bon-accent: var(--accent);
  --bg: var(--bon-bg); --card: var(--bon-card); --soft: var(--bon-soft); --text: var(--bon-text);
  --body: var(--bon-body); --muted: var(--bon-muted); --line: var(--bon-line);
  --radius: var(--bon-radius); --shadow: var(--bon-shadow);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --accent: #facc15; --on-accent: #1c1917; --ok: #4ade80; --bad: #f87171; color-scheme: dark; }
}
:root[data-theme="dark"] { --accent: #facc15; --on-accent: #1c1917; --ok: #4ade80; --bad: #f87171; color-scheme: dark; }

body { background: var(--bg); color: var(--body); }
h1, h2, h3 { color: var(--text); text-wrap: balance; }
.bon-bar { --bon-max: 860px; }
.bon-bar-in, .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 860px; margin: 0 auto; }
.stack { display: grid; gap: 22px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 머리 */
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 14px 0 0; padding: 0; list-style: none; font-size: .92rem; color: var(--muted); }
.stats b { color: var(--text); font-weight: 800; font-size: 1.05rem; font-variant-numeric: tabular-nums; margin-right: 3px; }
.stats li:first-child b { color: var(--accent); }

/* 설정 화면 */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; display: grid; gap: 18px; min-width: 0; }
.group { display: grid; gap: 8px; min-width: 0; }
.lbl { font-size: .82rem; font-weight: 600; color: var(--muted); }
.lbl small { font-weight: 400; }
.types { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.type-card { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 2px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); transition: border-color .18s ease, background .18s ease; }
.type-card strong { color: var(--text); font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; }
.type-card span { color: var(--muted); font-size: .88rem; }
.type-card .n { color: var(--accent); font-weight: 700; font-size: .82rem; font-variant-numeric: tabular-nums; }
.type-card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.type-card[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--card)); box-shadow: inset 0 0 0 1px var(--accent); }
.type-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 5px 13px; font-size: .9rem; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.chip small { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .7; }
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.startbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; }
.count { font-variant-numeric: tabular-nums; }
.count b { color: var(--accent); font-size: 1.15rem; font-weight: 800; }
.btn { border: 0; border-radius: 10px; padding: 10px 20px; font-weight: 700; background: var(--accent); color: var(--on-accent); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.ghost { background: var(--card); color: var(--text); border: 1px solid var(--line); font-weight: 600; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* 문제 화면 */
.qhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 22px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.lv-상 { --bon-accent: var(--bad); }
.lv-하 { --bon-accent: var(--ok); }
.progress { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .9rem; font-weight: 600; }
.meter { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
.passage { background: var(--soft); border-radius: 12px; padding: 16px 18px; white-space: pre-line; line-height: 1.85; color: var(--text); }
.passage .src { display: block; text-align: right; color: var(--muted); font-size: .85rem; }
.qtext { font-size: 1.08rem; font-weight: 600; color: var(--text); white-space: pre-line; min-width: 0; }
.qtext .num { color: var(--accent); font-weight: 800; margin-right: 6px; font-variant-numeric: tabular-nums; }
.box { border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 10px 14px; margin: 8px 0 4px; font-weight: 400; font-size: .97rem; line-height: 1.75; white-space: normal; color: var(--body); }
.passage .box { margin: 0 0 10px; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .82em; line-height: 1.15; margin: 0 2px; }
.fr span:first-child { border-bottom: 1px solid currentColor; padding: 0 2px; }
.choices { display: grid; gap: 8px; }
.choice { display: flex; align-items: flex-start; gap: 12px; text-align: left; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; color: var(--text); transition: border-color .18s ease, background .18s ease; }
.choice:hover:not(:disabled) { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.choice .bub { flex: none; width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; color: var(--muted); font-size: .85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.choice .txt { padding-top: 1px; min-width: 0; }
.choice[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--card)); }
.choice[aria-checked="true"] .bub { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.choice.correct { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--card)); }
.choice.correct .bub { background: var(--ok); border-color: var(--ok); color: var(--card); }
.choice.wrong { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--card)); }
.choice.wrong .bub { background: var(--bad); border-color: var(--bad); color: var(--card); }
.choice:disabled { cursor: default; }
.explain { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 6px; }
.verdict { font-weight: 800; font-size: 1.05rem; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.explain p { margin: 0; }

body.in-quiz .bon-header { display: none; }

/* '이 문제 이상해요' 제보 */
.report-open { all: unset; cursor: pointer; margin-right: auto; align-self: center; font-size: .86rem; color: var(--muted); border-bottom: 1px dashed currentColor; }
.report-open:hover { color: var(--text); }
.report-open:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.report { background: var(--soft); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
.report strong { color: var(--text); }
.report p { margin: 0; font-size: .86rem; color: var(--muted); }
.report textarea { width: 100%; min-height: 72px; resize: vertical; padding: 8px 12px; font: inherit; font-size: .95rem; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); }
.report textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
.report .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.report .status { min-height: 1.4em; color: var(--ok); font-weight: 600; }
.report .status.err { color: var(--bad); }

/* 결과 화면 */
.score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding-top: 26px; }
.score .big { font-size: 3rem; font-weight: 800; letter-spacing: -0.035em; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1; }
.score .sub { color: var(--muted); }
.brow { display: grid; grid-template-columns: 6.5em 1fr 4em; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; }
.brow .track { height: 10px; background: var(--soft); border-radius: 5px; overflow: hidden; }
.brow .track i { display: block; height: 100%; background: var(--ok); border-radius: 5px; }
.brow span:last-child { text-align: right; color: var(--muted); font-size: .9rem; }
.review { display: grid; gap: 10px; }
.review details { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.review summary { cursor: pointer; font-weight: 600; color: var(--text); }
.review .ans { margin: 8px 0 0; color: var(--muted); font-size: .95rem; }
.review .passage { margin-top: 10px; }

@media (max-width: 640px) {
  .types { grid-template-columns: minmax(0, 1fr); }
  .row3 { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .panel { padding: 16px 14px; }
  .brow { grid-template-columns: 5.5em 1fr 3.5em; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>
const BANK = [{"id": "KO-001", "s": "국어", "t": "단편", "g": 1, "d": "하", "q": "다음 중 이중 모음은?", "c": ["ㅑ", "ㅏ", "ㅔ", "ㅚ", "ㅡ"], "a": 1, "e": "표준어의 단모음은 ㅏ, ㅐ, ㅓ, ㅔ, ㅗ, ㅚ, ㅜ, ㅟ, ㅡ, ㅣ의 10개이다. ㅑ는 반모음 [j]와 ㅏ가 결합한 이중 모음이다. (ㅚ, ㅟ는 이중 모음으로 발음하는 것도 허용된다.)", "p": ""}, {"id": "KO-002", "s": "국어", "t": "단편", "g": 1, "d": "중", "q": "다음 중 음운 변동의 유형이 나머지와 <u>다른</u> 하나는?", "c": ["국물[궁물]", "좋고[조코]", "굳이[구지]", "신라[실라]", "밭[받]"], "a": 2, "e": "국물(비음화), 굳이(구개음화), 신라(유음화), 밭(음절의 끝소리 규칙)은 모두 한 음운이 다른 음운으로 바뀌는 '교체'이다. 좋고[조코]는 ㅎ과 ㄱ이 합쳐져 ㅋ이 되는 거센소리되기로 '축약'이다.", "p": ""}, {"id": "KO-003", "s": "국어", "t": "단편", "g": 1, "d": "하", "q": "'새 옷을 샀다.'에서 '새'의 품사는?", "c": ["명사", "형용사", "부사", "접사", "관형사"], "a": 5, "e": "'새'는 체언 '옷'을 꾸며 주며 활용하지 않으므로 관형사이다. 형용사라면 '새로운'처럼 어미가 붙어 활용한다.", "p": ""}, {"id": "KO-004", "s": "국어", "t": "단편", "g": 2, "d": "중", "q": "다음 중 피동 표현이 쓰인 문장은?", "c": ["엄마가 아이에게 밥을 먹였다.", "문이 바람에 열렸다.", "그가 나를 웃겼다.", "나는 창문을 열었다.", "동생이 책을 읽었다."], "a": 2, "e": "'열리다'는 '열다'에 피동 접미사 '-리-'가 붙어 주어가 다른 힘에 의해 동작을 당함을 나타낸다. '먹였다', '웃겼다'는 사동 표현이다.", "p": ""}, {"id": "KO-005", "s": "국어", "t": "단편", "g": 2, "d": "중", "q": "다음 중 객체 높임 표현이 쓰인 문장은?", "c": ["선생님께서 교실로 오신다.", "할아버지께서 진지를 잡수신다.", "나는 할머니께 선물을 드렸다.", "아버지께서 댁에 계신다.", "어머니, 어서 식사하세요."], "a": 3, "e": "객체 높임은 문장의 목적어나 부사어가 가리키는 대상을 높이는 것으로, '드리다, 모시다, 여쭙다, 뵙다' 같은 특수 어휘와 조사 '께'를 쓴다. 나머지는 주체 높임이 중심인 문장이다.", "p": ""}, {"id": "KO-006", "s": "국어", "t": "단편", "g": 1, "d": "하", "q": "시에서 시 속에 등장하여 말하는 사람을 가리키는 용어는?", "c": ["서술자", "화자", "청자", "작가", "주인공"], "a": 2, "e": "시에서 말하는 이를 '화자(시적 화자)'라고 한다. 작가와 구별되는 개념이며, 소설에서 이야기를 전달하는 이는 '서술자'라고 한다.", "p": ""}, {"id": "KO-007", "s": "국어", "t": "단편", "g": 1, "d": "중", "q": "'내 마음은 호수요'에 쓰인 표현 방법은?", "c": ["직유법", "은유법", "의인법", "대유법", "반어법"], "a": 2, "e": "'~같이, ~처럼' 같은 연결어 없이 'A는 B이다' 형식으로 원관념(마음)을 보조 관념(호수)에 빗댄 은유법이다.", "p": ""}, {"id": "KO-008", "s": "국어", "t": "단편", "g": 2, "d": "중", "q": "작품 속 '나'가 자신의 이야기를 직접 들려주는 소설의 시점은?", "c": ["1인칭 주인공 시점", "1인칭 관찰자 시점", "3인칭 관찰자 시점", "전지적 작가 시점", "2인칭 시점"], "a": 1, "e": "주인공인 '나'가 자신의 경험과 내면을 직접 서술하면 1인칭 주인공 시점이다. '나'가 다른 인물의 이야기를 전하면 1인칭 관찰자 시점이 된다.", "p": ""}, {"id": "KO-009", "s": "국어", "t": "단편", "g": 3, "d": "상", "q": "3장 6구 45자 내외로 이루어지고, 종장의 첫 음보가 세 음절로 고정된 갈래는?", "c": ["평시조", "향가", "고려 가요", "가사", "경기체가"], "a": 1, "e": "평시조는 초장·중장·종장의 3장 구성이며 종장 첫 음보는 3음절로 고정된다. 가사는 4음보 연속체로 길이 제한이 없고, 향가는 향찰로 표기된 신라·고려 초의 노래이다.", "p": ""}, {"id": "KO-010", "s": "국어", "t": "단편", "g": 2, "d": "중", "q": "다음 중 한글 맞춤법에 맞게 쓴 문장은?", "c": ["왠일로 일찍 왔니?", "몇일 뒤에 다시 만나자.", "소문이 금새 퍼졌다.", "내가 먼저 연락할께.", "어떻게 된 일인지 모르겠다."], "a": 5, "e": "'어떻게'는 '어떠하게'의 준말로 바른 표기이다. 나머지는 각각 '웬일', '며칠', '금세', '연락할게'로 써야 한다.", "p": ""}, {"id": "KO-011", "s": "국어", "t": "단편", "g": 3, "d": "상", "q": "다음 중 표준 발음이 <u>옳지 않은</u> 것은?", "c": ["넓죽하다[널쭈카다]", "밟다[밥ː따]", "읽고[일꼬]", "맑다[막따]", "앉다[안따]"], "a": 1, "e": "겹받침 'ㄼ'은 대체로 [ㄹ]로 발음하지만 '밟-'과 '넓죽하다, 넓둥글다'의 '넓-'은 [ㅂ]으로 발음한다. 따라서 넓죽하다는 [넙쭈카다]가 표준 발음이다.", "p": ""}, {"id": "KO-012", "s": "국어", "t": "단편", "g": 1, "d": "중", "q": "'철수는 착한 학생이 되었다.'에서 '학생이'의 문장 성분은?", "c": ["보어", "주어", "목적어", "부사어", "관형어"], "a": 1, "e": "서술어 '되다, 아니다' 앞에서 조사 '이/가'와 결합하여 문장을 완성하는 필수 성분은 보어이다.", "p": ""}, {"id": "KO-013", "s": "국어", "t": "단편", "g": 2, "d": "상", "q": "훈민정음 초성(자음) 제자 원리에서 기본자가 <u>아닌</u> 것은?", "c": ["ㄱ", "ㄴ", "ㅁ", "ㄷ", "ㅅ"], "a": 4, "e": "초성의 기본자는 발음 기관을 본뜬 ㄱ, ㄴ, ㅁ, ㅅ, ㅇ의 다섯 자이다. ㄷ은 ㄴ에 획을 더한 가획자이다.", "p": ""}, {"id": "KO-014", "s": "국어", "t": "단편", "g": 3, "d": "중", "q": "한자 성어 '각주구검(刻舟求劍)'의 뜻으로 가장 적절한 것은?", "c": ["어려움을 참고 견디어 끝내 뜻을 이룸", "융통성 없이 낡은 방식만 고집하는 어리석음", "남의 의견을 귀담아듣지 않음", "작은 것을 탐하다 큰 것을 잃음", "겉과 속이 서로 다름"], "a": 2, "e": "배에서 칼을 떨어뜨리고 배에 표시를 해 두었다가 나중에 그 자리에서 칼을 찾으려 했다는 고사에서 나온 말로, 상황 변화를 모르고 융통성 없이 구는 어리석음을 뜻한다.", "p": ""}, {"id": "KO-015", "s": "국어", "t": "단편", "g": 1, "d": "하", "q": "다음 중 '서술자가 인물의 내면까지 모두 알고 서술하는' 시점은?", "c": ["1인칭 관찰자 시점", "3인칭 관찰자 시점", "전지적 작가 시점", "1인칭 주인공 시점", "제한적 관찰 시점"], "a": 3, "e": "작품 밖 서술자가 모든 인물의 심리와 사건을 알고 서술하는 시점은 전지적 작가 시점이다. 3인칭 관찰자 시점은 인물의 외부 행동만 객관적으로 전달한다.", "p": ""}, {"id": "KO-016", "s": "국어", "t": "단편", "g": 2, "d": "하", "q": "다음 중 '표준어'가 <u>아닌</u> 것은?", "c": ["설거지", "깡총깡총", "웃어른", "오뚝이", "멋쟁이"], "a": 2, "e": "모음 조화가 무너진 형태를 표준어로 삼아 '깡충깡충'이 표준어이다. '설거지, 웃어른, 오뚝이, 멋쟁이'는 모두 표준어이다.", "p": ""}, {"id": "KO-017", "s": "국어", "t": "수능", "g": 2, "d": "중", "q": "윗글의 내용과 일치하는 것은?", "c": ["가용성 휴리스틱은 통계 자료를 꼼꼼히 분석하는 판단 방식이다.", "드문 사건일수록 사람들은 그 확률을 실제보다 낮게 평가한다.", "가용성 휴리스틱은 어떤 상황에서도 오류를 낳지 않는다.", "가용성 휴리스틱은 판단에 드는 시간과 노력을 줄여 준다.", "대중 매체의 보도는 사람들의 확률 판단에 영향을 주지 않는다."], "a": 4, "e": "2문단에서 '이러한 판단 방식은 시간과 노력을 아껴 준다는 장점이 있다'고 하였다. 드물지만 강렬한 사건은 쉽게 떠오르므로 오히려 과대평가되기 쉬우며, 대중 매체 노출도 오류의 원인으로 제시되었다.", "p": "사람들은 어떤 사건이 일어날 확률을 판단할 때 실제 통계를 따져 보기보다 관련 사례가 얼마나 쉽게 떠오르는지에 의존하는 경향이 있다. 이를 <b>가용성 휴리스틱</b>이라 한다. 예컨대 비행기 사고 보도를 접한 직후에는 비행기 여행이 자동차 여행보다 위험하다고 느끼기 쉽다. 사고 장면이 생생하게 기억에 남아 쉽게 떠오르기 때문이다.\n이러한 판단 방식은 시간과 노력을 아껴 준다는 장점이 있다. 일상의 많은 결정은 정밀한 계산 없이도 대체로 무난한 결과로 이어지기 때문이다. 그러나 떠올리기 쉬운 정도가 실제 빈도와 어긋날 때, 즉 드물지만 강렬한 사건이나 대중 매체에 자주 노출된 사건을 판단할 때에는 체계적인 오류가 생긴다. 따라서 중요한 결정을 내릴 때에는 자신의 직관이 어떤 기억에 기대고 있는지 점검하고, 가능하다면 객관적인 자료와 대조해 보는 태도가 필요하다."}, {"id": "KO-018", "s": "국어", "t": "수능", "g": 3, "d": "상", "q": "윗글을 바탕으로 &lt;보기&gt;를 이해한 내용으로 가장 적절한 것은?\n<div class='box'>&lt;보기&gt; 여름휴가를 앞둔 A는 상어가 해수욕객을 공격했다는 외국 뉴스를 여러 번 본 뒤 바다 수영을 포기했다. 그러나 A는 실제로 훨씬 자주 일어나는 물놀이 중 익사 사고나 강한 자외선으로 인한 화상에는 별다른 대비를 하지 않았다.</div>", "c": ["A는 객관적인 통계 자료를 근거로 상어 공격의 위험을 정확히 평가하였다.", "A는 상어 공격 장면이 쉽게 떠올라 그 위험을 실제보다 크게 판단하였다.", "A는 익사 사고에 관한 기억이 생생하여 익사의 위험을 과대평가하였다.", "A의 판단은 떠올리기 쉬운 정도와 실제 빈도가 일치한 경우에 해당한다.", "A는 자신의 직관이 어떤 기억에 기대고 있는지 충분히 점검하였다."], "a": 2, "e": "반복된 뉴스로 상어 공격 사례가 쉽게 떠올라 드문 위험을 과대평가하고, 실제로 더 흔한 위험은 소홀히 한 것이다. 이는 떠올리기 쉬운 정도와 실제 빈도가 어긋날 때 생기는 가용성 휴리스틱의 오류에 해당한다.", "p": "사람들은 어떤 사건이 일어날 확률을 판단할 때 실제 통계를 따져 보기보다 관련 사례가 얼마나 쉽게 떠오르는지에 의존하는 경향이 있다. 이를 <b>가용성 휴리스틱</b>이라 한다. 예컨대 비행기 사고 보도를 접한 직후에는 비행기 여행이 자동차 여행보다 위험하다고 느끼기 쉽다. 사고 장면이 생생하게 기억에 남아 쉽게 떠오르기 때문이다.\n이러한 판단 방식은 시간과 노력을 아껴 준다는 장점이 있다. 일상의 많은 결정은 정밀한 계산 없이도 대체로 무난한 결과로 이어지기 때문이다. 그러나 떠올리기 쉬운 정도가 실제 빈도와 어긋날 때, 즉 드물지만 강렬한 사건이나 대중 매체에 자주 노출된 사건을 판단할 때에는 체계적인 오류가 생긴다. 따라서 중요한 결정을 내릴 때에는 자신의 직관이 어떤 기억에 기대고 있는지 점검하고, 가능하다면 객관적인 자료와 대조해 보는 태도가 필요하다."}, {"id": "KO-019", "s": "국어", "t": "수능", "g": 2, "d": "중", "q": "윗글의 내용과 일치하지 <u>않는</u> 것은?", "c": ["이 방법으로 돌로 만든 도끼 자체의 제작 시기를 직접 측정할 수 있다.", "대기 중 탄소의 대부분은 탄소-12이다.", "살아 있는 생물의 체내 탄소-14 비율은 대기와 거의 같다.", "생물이 죽으면 체내 탄소-14의 양은 줄어들기만 한다.", "아주 오래된 시료는 탄소-14가 거의 남지 않아 측정이 어렵다."], "a": 1, "e": "윗글은 이 방법이 '한때 생물이었던 물질에만' 적용된다고 하였다. 돌은 생물이 아니므로 돌도끼 자체의 연대는 이 방법으로 직접 측정할 수 없다.", "p": "생물은 살아 있는 동안 호흡과 먹이 섭취를 통해 탄소를 끊임없이 받아들인다. 대기 중 탄소의 대부분은 탄소-12이지만, 극히 일부는 방사성 동위 원소인 탄소-14이다. 생물이 살아 있는 동안에는 체내 탄소-14의 비율이 대기와 거의 같게 유지된다. 그러나 생물이 죽으면 더 이상 탄소를 받아들이지 못하므로 체내의 탄소-14는 붕괴하여 줄어들기만 한다.\n탄소-14는 약 5730년이 지나면 그 양이 처음의 절반으로 줄어드는데, 이 기간을 <b>반감기</b>라고 한다. 따라서 유물에 남아 있는 탄소-14의 비율을 측정하면 그 생물이 죽은 뒤 얼마나 시간이 흘렀는지 추정할 수 있다. 다만 이 방법은 한때 생물이었던 물질에만 적용할 수 있으며, 시간이 너무 오래 지나 탄소-14가 거의 남지 않은 시료는 측정이 어렵다. 일반적으로 약 5만 년보다 오래된 시료에는 이 방법을 적용하기 어렵다."}, {"id": "KO-020", "s": "국어", "t": "수능", "g": 3, "d": "상", "q": "어떤 나무 유물에 남아 있는 탄소-14의 비율이 살아 있는 나무의 1/4이라면, 이 나무가 죽은 뒤 흐른 시간으로 가장 적절한 것은? (단, 반감기는 5730년으로 한다.)", "c": ["약 2865년", "약 11460년", "약 5730년", "약 17190년", "약 22920년"], "a": 2, "e": "1/4은 반감기를 두 번 거친 양이다(1 → 1/2 → 1/4). 따라서 5730년 × 2 = 약 11460년이 지났다.", "p": "생물은 살아 있는 동안 호흡과 먹이 섭취를 통해 탄소를 끊임없이 받아들인다. 대기 중 탄소의 대부분은 탄소-12이지만, 극히 일부는 방사성 동위 원소인 탄소-14이다. 생물이 살아 있는 동안에는 체내 탄소-14의 비율이 대기와 거의 같게 유지된다. 그러나 생물이 죽으면 더 이상 탄소를 받아들이지 못하므로 체내의 탄소-14는 붕괴하여 줄어들기만 한다.\n탄소-14는 약 5730년이 지나면 그 양이 처음의 절반으로 줄어드는데, 이 기간을 <b>반감기</b>라고 한다. 따라서 유물에 남아 있는 탄소-14의 비율을 측정하면 그 생물이 죽은 뒤 얼마나 시간이 흘렀는지 추정할 수 있다. 다만 이 방법은 한때 생물이었던 물질에만 적용할 수 있으며, 시간이 너무 오래 지나 탄소-14가 거의 남지 않은 시료는 측정이 어렵다. 일반적으로 약 5만 년보다 오래된 시료에는 이 방법을 적용하기 어렵다."}, {"id": "KO-021", "s": "국어", "t": "수능", "g": 2, "d": "중", "q": "윗글의 표현상 특징으로 가장 적절한 것은?", "c": ["사물에 사람의 속성을 부여하여 대상의 모습을 드러내고 있다.", "색채 대비를 통해 선명한 시각적 이미지를 만들고 있다.", "명령형 어조를 사용하여 독자의 행동을 촉구하고 있다.", "계절의 변화에 따라 시상을 전개하고 있다.", "반어적 표현을 통해 화자의 분노를 드러내고 있다."], "a": 1, "e": "가로등이 '혼자 깨어 있다', '말없이 제 빛을 거두어들인다'처럼 사람처럼 표현되어 있으므로 의인법이 쓰였다. 시상은 계절이 아니라 밤에서 새벽으로 이어지는 시간의 흐름을 따른다.", "p": "골목 끝 가로등은\n밤마다 혼자 깨어 있다\n\n아무도 묻지 않는 길을\n한 뼘씩 밝혀 두고\n\n새벽이 오면 말없이\n제 빛을 거두어들인다\n\n나는 오늘도 그 아래를 지나며\n누군가의 늦은 귀가를 생각한다\n<span class='src'>(창작 시)</span>"}, {"id": "KO-022", "s": "국어", "t": "수능", "g": 3, "d": "상", "q": "&lt;보기&gt;의 탐구 결과로 가장 적절한 것은?\n<div class='box'>&lt;보기&gt; '부엌일'은 [부엉닐]로 발음된다. 이 과정에서 일어난 음운 변동의 유형을 정리해 보자.</div>", "c": ["교체만 일어났다.", "교체와 첨가가 일어났다.", "교체와 탈락이 일어났다.", "축약과 첨가가 일어났다.", "탈락과 첨가가 일어났다."], "a": 2, "e": "'부엌'의 ㅋ이 음절의 끝소리 규칙으로 [ㄱ]이 되고(교체), 합성어에서 뒷말 '일' 앞에 ㄴ이 덧붙고(첨가), [ㄱ]이 [ㄴ] 앞에서 [ㅇ]으로 바뀐다(비음화, 교체). 따라서 교체와 첨가가 일어났다.", "p": ""}, {"id": "KO-023", "s": "국어", "t": "수능", "g": 2, "d": "중", "q": "&lt;보기&gt;의 ㄱ~ㄹ에 대한 설명으로 옳은 것만을 있는 대로 고른 것은?\n<div class='box'>ㄱ. 나는 그가 범인임을 알았다.<br>ㄴ. 그는 소리도 없이 다가왔다.<br>ㄷ. 내가 읽은 책은 재미있다.<br>ㄹ. 코끼리는 코가 길다.</div>\n(가) ㄱ에는 명사절이 안겨 있다.  (나) ㄴ에는 부사절이 안겨 있다.  (다) ㄷ에는 관형절이 안겨 있다.  (라) ㄹ은 홑문장이다.", "c": ["(가), (나)", "(나), (라)", "(가), (나), (다)", "(가), (다), (라)", "(가), (나), (다), (라)"], "a": 3, "e": "ㄱ '그가 범인임'은 명사절, ㄴ '소리도 없이'는 부사절, ㄷ '내가 읽은'은 관형절이다. ㄹ '코가 길다'는 서술절로 안긴문장이므로 홑문장이 아니라 겹문장이다.", "p": ""}, {"id": "KO-024", "s": "국어", "t": "수능", "g": 1, "d": "하", "q": "윗글에 사용된 말하기 전략으로 가장 적절한 것은?", "c": ["전문가의 말을 인용하여 주장의 권위를 높이고 있다.", "반대 의견을 소개하고 이를 하나씩 반박하고 있다.", "개인적인 실패 경험을 고백하여 공감을 얻고 있다.", "여러 나라의 사례를 비교하여 문제의 심각성을 강조하고 있다.", "청중에게 질문을 던져 관심을 유도하며 말을 시작하고 있다."], "a": 5, "e": "'몇 개쯤 될까요?'라는 질문으로 시작하여 청중의 관심을 끌고 있다. 발표자가 직접 관찰한 자료와 사진을 활용했지만 전문가 인용이나 반론 제시는 없다.", "p": "여러분, 하루에 우리 학교에서 버려지는 일회용 컵이 몇 개쯤 될까요? 저는 지난주 일주일 동안 매점 앞 분리수거함을 직접 살펴보았습니다. 그 결과 하루 평균 100개가 넘는 컵이 버려지고 있었습니다. 이 사진을 보시면, 분리수거함이 가득 차서 바닥까지 컵이 쌓여 있는 것을 확인할 수 있습니다. 개인 컵 하나만 가지고 다녀도 이 숫자는 크게 줄어듭니다. 내일부터 저와 함께 개인 컵 사용을 시작해 보는 건 어떨까요?"}, {"id": "KO-025", "s": "국어", "t": "수능", "g": 1, "d": "중", "q": "윗글의 화자가 마지막 문장에서 사용한 말하기 방식의 효과로 가장 적절한 것은?", "c": ["발표 내용을 처음부터 다시 요약하여 이해를 돕는다.", "청중에게 함께 행동하자고 권유하여 실천을 이끌어 낸다.", "반어적 표현으로 문제 상황을 비판한다.", "통계 수치의 출처를 밝혀 신뢰성을 높인다.", "청중의 반대 의견을 예상하여 미리 답한다."], "a": 2, "e": "'저와 함께 ~ 시작해 보는 건 어떨까요?'는 청유와 권유의 방식으로 청중의 실천을 이끌어 내려는 표현이다.", "p": "여러분, 하루에 우리 학교에서 버려지는 일회용 컵이 몇 개쯤 될까요? 저는 지난주 일주일 동안 매점 앞 분리수거함을 직접 살펴보았습니다. 그 결과 하루 평균 100개가 넘는 컵이 버려지고 있었습니다. 이 사진을 보시면, 분리수거함이 가득 차서 바닥까지 컵이 쌓여 있는 것을 확인할 수 있습니다. 개인 컵 하나만 가지고 다녀도 이 숫자는 크게 줄어듭니다. 내일부터 저와 함께 개인 컵 사용을 시작해 보는 건 어떨까요?"}, {"id": "KO-026", "s": "국어", "t": "단편", "g": 1, "d": "상", "q": "'하늘이 맑다.'를 형태소로 나눌 때, 형태소의 개수는?", "c": ["2개", "3개", "5개", "6개", "4개"], "a": 5, "e": "'하늘 / 이 / 맑- / -다'의 4개로 나뉜다. 형태소는 뜻을 가진 가장 작은 말의 단위로, 조사와 어미도 각각 하나의 형태소이다.", "p": ""}, {"id": "KO-027", "s": "국어", "t": "단편", "g": 1, "d": "상", "q": "밑줄 친 말에 쓰인 접미사의 기능이 나머지와 <u>다른</u> 하나는?", "c": ["엄마가 아이에게 밥을 <u>먹였다</u>.", "형이 동생을 <u>웃겼다</u>.", "선생님이 목소리를 <u>낮추었다</u>.", "누나가 나를 <u>깨웠다</u>.", "도둑이 경찰에게 <u>잡혔다</u>."], "a": 5, "e": "'잡히다'의 '-히-'는 주어가 동작을 당함을 나타내는 피동 접미사이다. 나머지 '먹이다, 웃기다, 낮추다, 깨우다'는 남에게 동작을 하게 하는 사동 접미사가 쓰였다.", "p": ""}, {"id": "KO-028", "s": "국어", "t": "단편", "g": 1, "d": "상", "q": "다음 중 중간 단계가 없어 한쪽을 부정하면 다른 쪽이 되는 '상보 반의어'의 짝은?", "c": ["길다 – 짧다", "덥다 – 춥다", "살다 – 죽다", "사다 – 팔다", "위 – 아래"], "a": 3, "e": "'살다–죽다'는 중간 상태가 없는 상보 반의어이다. '길다–짧다', '덥다–춥다'는 중간 단계가 있는 정도(등급) 반의어, '사다–팔다', '위–아래'는 방향 반의어이다.", "p": ""}, {"id": "KO-029", "s": "국어", "t": "단편", "g": 2, "d": "하", "q": "글쓴이가 자신의 체험과 생각을 일정한 형식에 얽매이지 않고 자유롭게 쓴 산문 갈래는?", "c": ["소설", "희곡", "시조", "가사", "수필"], "a": 5, "e": "수필은 형식이 자유롭고 글쓴이의 개성이 잘 드러나는 산문이다. 소설은 허구의 이야기, 희곡은 공연을 위한 대본이다.", "p": ""}, {"id": "KO-030", "s": "국어", "t": "단편", "g": 2, "d": "하", "q": "다음 중 모양이나 움직임을 흉내 낸 말(의태어)은?", "c": ["멍멍", "쨍그랑", "딸랑딸랑", "살금살금", "꼬끼오"], "a": 4, "e": "'살금살금'은 남이 모르게 조심스럽게 움직이는 모양을 흉내 낸 의태어이다. 나머지는 소리를 흉내 낸 의성어이다.", "p": ""}, {"id": "KO-031", "s": "국어", "t": "단편", "g": 2, "d": "하", "q": "'할머니께서 책을 읽으<u>시</u>었다.'에서 밑줄 친 '-시-'가 높이는 대상은?", "c": ["문장의 주어", "문장의 목적어", "말을 듣는 사람", "말하는 사람", "문장의 부사어"], "a": 1, "e": "선어말 어미 '-(으)시-'는 문장의 주어(할머니)를 높이는 주체 높임법을 실현한다.", "p": ""}, {"id": "KO-032", "s": "국어", "t": "단편", "g": 2, "d": "중", "q": "다음 중 외래어 표기가 바른 것은?", "c": ["케익", "주스", "초콜렛", "메세지", "악세사리"], "a": 2, "e": "'주스'가 바른 표기이다. 나머지는 각각 '케이크, 초콜릿, 메시지, 액세서리'로 적어야 한다.", "p": ""}, {"id": "KO-033", "s": "국어", "t": "단편", "g": 2, "d": "상", "q": "훈민정음 서문의 '어린 百姓(백성)이 니르고져 홇 배 이셔도'에서 '어린'의 당시 의미는?", "c": ["나이가 적은", "불쌍한", "가난한", "착한", "어리석은"], "a": 5, "e": "중세 국어에서 '어리다'는 '어리석다'는 뜻이었다. 오늘날에는 '나이가 적다'는 뜻으로 의미가 이동하였다.", "p": ""}, {"id": "KO-034", "s": "국어", "t": "단편", "g": 2, "d": "상", "q": "월명사의 '제망매가'에 대한 설명으로 옳은 것은?", "c": ["죽은 누이를 추모하는 10구체 향가이다.", "임금의 덕을 기리는 경기체가이다.", "자연 속의 삶을 노래한 평시조이다.", "남녀 간의 사랑을 노래한 고려 가요이다.", "농사일의 즐거움을 노래한 가사이다."], "a": 1, "e": "'제망매가'는 신라의 승려 월명사가 죽은 누이의 명복을 빌며 지은 10구체 향가로, 삶과 죽음에 대한 슬픔을 종교적으로 승화하였다.", "p": ""}, {"id": "KO-035", "s": "국어", "t": "단편", "g": 2, "d": "상", "q": "다음 중 중의적으로 해석되지 <u>않는</u> 문장은?", "c": ["예쁜 친구의 동생을 만났다.", "나는 형과 아우를 찾아다녔다.", "학생들이 다 오지 않았다.", "그는 나보다 축구를 더 좋아한다.", "나는 어제 도서관에서 책을 읽었다."], "a": 5, "e": "①은 '예쁜'이 친구를 꾸미는지 동생을 꾸미는지, ②는 '나와 형이 함께' 찾는지 '형과 아우 둘 다'를 찾는지, ③은 전체 부정인지 부분 부정인지, ④는 비교 대상이 '나'인지 '내가 축구를 좋아하는 정도'인지 모호하다.", "p": ""}, {"id": "KO-036", "s": "국어", "t": "단편", "g": 2, "d": "상", "q": "다음 중 사이시옷 표기가 바른 것은?", "c": ["갯수", "촛점", "댓가", "햇님", "등굣길"], "a": 5, "e": "'등굣길(登校+길)'은 한자어와 고유어의 합성어로 뒷말의 첫소리가 된소리로 나므로 사이시옷을 적는다. '개수, 초점, 대가'는 한자어끼리의 결합이라 적지 않고, '해님'은 '-님'이 접미사인 파생어라 적지 않는다.", "p": ""}, {"id": "KO-037", "s": "국어", "t": "단편", "g": 3, "d": "하", "q": "속담 '소 잃고 외양간 고친다'의 뜻으로 알맞은 것은?", "c": ["작은 것이라도 모이면 큰 것이 된다.", "쉬운 일이라도 협력하면 더 쉽다.", "말을 조심해야 한다.", "일이 이미 잘못된 뒤에는 손을 써도 소용이 없다.", "아무리 급해도 순서를 지켜야 한다."], "a": 4, "e": "소를 도둑맞은 뒤에야 빈 외양간을 고친다는 뜻으로, 일이 잘못된 뒤에 뒤늦게 대책을 세워도 소용이 없음을 이르는 말이다.", "p": ""}, {"id": "KO-038", "s": "국어", "t": "단편", "g": 3, "d": "하", "q": "다음 중 판소리계 소설이 <u>아닌</u> 것은?", "c": ["구운몽", "춘향전", "심청전", "흥부전", "토끼전"], "a": 1, "e": "'구운몽'은 김만중이 지은 몽자류(꿈 구조) 소설이다. 나머지는 판소리 사설이 소설로 정착한 판소리계 소설이다.", "p": ""}, {"id": "KO-039", "s": "국어", "t": "단편", "g": 3, "d": "하", "q": "논설문을 쓰는 주된 목적은?", "c": ["독자를 설득하기 위해", "정보를 있는 그대로 전달하기 위해", "개인의 감정을 표현하기 위해", "독자와 친교를 맺기 위해", "재미있는 이야기를 꾸며 내기 위해"], "a": 1, "e": "논설문은 어떤 문제에 대한 글쓴이의 주장을 근거를 들어 논리적으로 펼쳐 독자를 설득하는 글이다.", "p": ""}, {"id": "KO-040", "s": "국어", "t": "단편", "g": 3, "d": "하", "q": "국어의 음절 끝(받침)에서 발음될 수 있는 일곱 자음에 해당하지 <u>않는</u> 것은?", "c": ["ㄱ", "ㄴ", "ㄹ", "ㅅ", "ㅇ"], "a": 4, "e": "음절의 끝소리 규칙에 따라 받침에서는 ㄱ, ㄴ, ㄷ, ㄹ, ㅁ, ㅂ, ㅇ의 7개 자음만 발음된다. 받침 ㅅ은 [ㄷ]으로 발음된다(예: 옷[옫]).", "p": ""}, {"id": "KO-041", "s": "국어", "t": "단편", "g": 3, "d": "중", "q": "밑줄 친 조사가 보조사인 것은?", "c": ["하늘<u>이</u> 맑다.", "너<u>만</u> 오너라.", "나는 책<u>을</u> 읽었다.", "학교<u>에서</u> 만나자.", "친구<u>의</u> 가방이다."], "a": 2, "e": "'만'은 '한정'의 뜻을 더해 주는 보조사이다. '이'(주격), '을'(목적격), '에서'(부사격), '의'(관형격)는 문장 성분의 자격을 나타내는 격 조사이다.", "p": ""}, {"id": "KO-042", "s": "국어", "t": "단편", "g": 3, "d": "중", "q": "김소월의 '진달래꽃'에 대한 설명으로 옳은 것은?", "c": ["도시 문명을 비판하는 모더니즘 시이다.", "일제에 대한 직접적인 저항을 노래한다.", "행과 연의 구분이 없는 산문시이다.", "전통적인 3음보의 민요적 율격을 지닌다.", "남성적이고 강인한 어조가 두드러진다."], "a": 4, "e": "'진달래꽃'은 7·5조, 3음보의 민요적 율격과 여성적 어조로 이별의 정한을 노래한 작품이다. '죽어도 아니 눈물 흘리우리다'에는 반어적 표현이 쓰였다.", "p": ""}, {"id": "KO-043", "s": "국어", "t": "단편", "g": 3, "d": "중", "q": "한자 성어 '온고지신(溫故知新)'의 뜻으로 알맞은 것은?", "c": ["같은 처지의 사람끼리 서로 동정함", "옛것을 익혀 새것을 앎", "쓴 것이 다하면 단 것이 옴", "스승보다 제자가 나음", "눈앞의 이익에 어두워 의리를 잊음"], "a": 2, "e": "'옛것을 익히고 그것을 미루어 새것을 안다'는 뜻이다. 나머지는 차례로 동병상련, 고진감래, 청출어람, 견리망의의 뜻이다.", "p": ""}, {"id": "KO-044", "s": "국어", "t": "단편", "g": 3, "d": "상", "q": "훈민정음 중성(모음)의 기본자 'ㆍ, ㅡ, ㅣ'를 만든 원리는?", "c": ["발음 기관의 모양을 본떴다.", "기본자에 획을 더하였다.", "하늘·땅·사람의 모양을 본떴다.", "기본자를 나란히 써서 만들었다.", "한자의 모양을 간략하게 줄였다."], "a": 3, "e": "중성의 기본자는 하늘(ㆍ), 땅(ㅡ), 사람(ㅣ)의 모양을 본뜬 상형의 원리로 만들었다. 발음 기관을 본뜬 것은 초성의 기본자이다.", "p": ""}, {"id": "KO-045", "s": "국어", "t": "단편", "g": 3, "d": "상", "q": "다음 중 활용할 때 어간과 어미의 형태가 규칙적으로 유지되는 용언은?", "c": ["(소리를) 듣다", "(집을) 짓다", "(일을) 돕다", "(손을) 씻다", "(물이) 흐르다"], "a": 4, "e": "'씻다'는 '씻어, 씻으니'로 규칙 활용한다. '듣다→들어'(ㄷ 불규칙), '짓다→지어'(ㅅ 불규칙), '돕다→도와'(ㅂ 불규칙), '흐르다→흘러'(르 불규칙)는 불규칙 활용이다.", "p": ""}, {"id": "KO-046", "s": "국어", "t": "수능", "g": 1, "d": "하", "q": "윗글의 내용과 일치하는 것은?", "c": ["에빙하우스는 의미 있는 문장을 외워 실험하였다.", "시간이 지날수록 잊는 속도가 점점 빨라진다.", "망각은 학습 직후에 가장 빠르게 일어난다.", "복습은 망각을 늦추는 데 효과가 없다.", "한 번에 몰아서 복습할 때 기억이 가장 오래 유지된다."], "a": 3, "e": "1문단에서 '망각은 학습 직후에 가장 빠르게 일어나고, 시간이 지날수록 잊는 속도가 점차 느려진다'고 하였다.", "p": "독일의 심리학자 에빙하우스는 의미 없는 철자들을 외운 뒤, 시간이 지남에 따라 얼마나 잊어버리는지를 스스로 실험하였다. 그 결과 망각은 학습 직후에 가장 빠르게 일어나고, 시간이 지날수록 잊는 속도가 점차 느려진다는 사실을 발견하였다. 이를 그래프로 나타낸 것이 <b>망각 곡선</b>이다.\n망각을 늦추는 가장 효과적인 방법은 복습이다. 특히 한 번에 몰아서 여러 번 반복하는 것보다 일정한 간격을 두고 나누어 복습할 때 기억이 더 오래 유지된다. 복습할 때마다 기억이 다시 강화되어 잊어버리는 속도가 이전보다 느려지기 때문이다."}, {"id": "KO-047", "s": "국어", "t": "수능", "g": 1, "d": "하", "q": "윗글의 중심 화제로 가장 적절한 것은?", "c": ["에빙하우스의 생애와 업적", "의미 없는 철자를 외우는 요령", "기억력이 좋은 사람들의 공통점", "망각 곡선과 효과적인 복습 방법", "그래프를 그리는 방법"], "a": 4, "e": "1문단은 망각 곡선의 내용을, 2문단은 망각을 늦추는 복습 방법(간격을 둔 복습)을 설명하고 있다.", "p": "독일의 심리학자 에빙하우스는 의미 없는 철자들을 외운 뒤, 시간이 지남에 따라 얼마나 잊어버리는지를 스스로 실험하였다. 그 결과 망각은 학습 직후에 가장 빠르게 일어나고, 시간이 지날수록 잊는 속도가 점차 느려진다는 사실을 발견하였다. 이를 그래프로 나타낸 것이 <b>망각 곡선</b>이다.\n망각을 늦추는 가장 효과적인 방법은 복습이다. 특히 한 번에 몰아서 여러 번 반복하는 것보다 일정한 간격을 두고 나누어 복습할 때 기억이 더 오래 유지된다. 복습할 때마다 기억이 다시 강화되어 잊어버리는 속도가 이전보다 느려지기 때문이다."}, {"id": "KO-048", "s": "국어", "t": "수능", "g": 1, "d": "중", "q": "윗글을 읽은 학생이 세운 학습 계획으로 가장 적절한 것은?", "c": ["배운 날 저녁, 사흘 뒤, 일주일 뒤로 나누어 복습한다.", "시험 전날 밤에 모든 내용을 한꺼번에 다섯 번 읽는다.", "한 번 외운 내용은 다시 보지 않는다.", "잊어버릴 때까지 기다렸다가 처음부터 다시 공부한다.", "복습 대신 새로운 내용을 더 많이 공부한다."], "a": 1, "e": "2문단에서 일정한 간격을 두고 나누어 복습할 때 기억이 더 오래 유지된다고 하였다.", "p": "독일의 심리학자 에빙하우스는 의미 없는 철자들을 외운 뒤, 시간이 지남에 따라 얼마나 잊어버리는지를 스스로 실험하였다. 그 결과 망각은 학습 직후에 가장 빠르게 일어나고, 시간이 지날수록 잊는 속도가 점차 느려진다는 사실을 발견하였다. 이를 그래프로 나타낸 것이 <b>망각 곡선</b>이다.\n망각을 늦추는 가장 효과적인 방법은 복습이다. 특히 한 번에 몰아서 여러 번 반복하는 것보다 일정한 간격을 두고 나누어 복습할 때 기억이 더 오래 유지된다. 복습할 때마다 기억이 다시 강화되어 잊어버리는 속도가 이전보다 느려지기 때문이다."}, {"id": "KO-049", "s": "국어", "t": "수능", "g": 1, "d": "상", "q": "윗글을 바탕으로 &lt;보기&gt;를 이해한 내용으로 가장 적절한 것은?\n<div class='box'>&lt;보기&gt; A와 B는 같은 단원을 각각 모두 5시간씩 복습했다. A는 시험 전날 5시간을 이어서 복습했고, B는 5일 동안 하루 1시간씩 복습했다.</div>", "c": ["복습 시간이 같으므로 두 사람의 기억은 똑같이 유지될 것이다.", "B는 복습할 때마다 기억이 강화되어 A보다 기억이 오래 유지될 가능성이 크다.", "A는 복습 횟수가 적어 망각이 전혀 일어나지 않을 것이다.", "B는 간격을 두었기 때문에 복습할 때마다 잊는 속도가 빨라질 것이다.", "A와 B 모두 학습 직후에는 망각이 일어나지 않을 것이다."], "a": 2, "e": "같은 시간을 공부하더라도 간격을 두고 나누어 복습하면 복습할 때마다 기억이 다시 강화되어 잊는 속도가 느려진다. 따라서 B의 기억이 더 오래 유지될 가능성이 크다.", "p": "독일의 심리학자 에빙하우스는 의미 없는 철자들을 외운 뒤, 시간이 지남에 따라 얼마나 잊어버리는지를 스스로 실험하였다. 그 결과 망각은 학습 직후에 가장 빠르게 일어나고, 시간이 지날수록 잊는 속도가 점차 느려진다는 사실을 발견하였다. 이를 그래프로 나타낸 것이 <b>망각 곡선</b>이다.\n망각을 늦추는 가장 효과적인 방법은 복습이다. 특히 한 번에 몰아서 여러 번 반복하는 것보다 일정한 간격을 두고 나누어 복습할 때 기억이 더 오래 유지된다. 복습할 때마다 기억이 다시 강화되어 잊어버리는 속도가 이전보다 느려지기 때문이다."}, {"id": "KO-050", "s": "국어", "t": "수능", "g": 1, "d": "하", "q": "윗글의 화자가 처한 상황으로 가장 적절한 것은?", "c": ["친구들과 함께 운동장에서 공을 차고 있다.", "비 오는 날 빈 운동장을 바라보고 있다.", "해 질 무렵 운동장을 떠나고 있다.", "잃어버린 공을 찾아 헤매고 있다.", "비가 그치기를 기다리며 교실에서 공부하고 있다."], "a": 2, "e": "'빈 운동장에 비가 내린다', '오늘은 빗소리만 운동장을 가득 채운다'에서 화자가 비 내리는 빈 운동장을 바라보고 있음을 알 수 있다.", "p": "빈 운동장에 비가 내린다\n아무도 차지 않는 공이\n골대 옆에서 젖고 있다\n\n어제는 저 공 하나를 두고\n우리는 해가 지도록 소리쳤는데\n\n오늘은 빗소리만\n운동장을 가득 채운다\n<span class='src'>(창작 시)</span>"}, {"id": "KO-051", "s": "국어", "t": "수능", "g": 1, "d": "상", "q": "윗글에 대한 감상으로 가장 적절한 것은?", "c": ["같은 구절을 처음과 끝에 반복하여 운율을 만들고 있다.", "화자가 공에게 직접 말을 건네며 친근감을 표현하고 있다.", "어제의 떠들썩함과 오늘의 고요함을 대비하여 쓸쓸한 분위기를 드러내고 있다.", "미래에 대한 희망과 의지를 힘찬 어조로 노래하고 있다.", "여러 계절의 풍경을 차례로 보여 주고 있다."], "a": 3, "e": "'어제는 … 해가 지도록 소리쳤는데'와 '오늘은 빗소리만'이 대비되어, 친구들이 없는 빈 운동장의 쓸쓸함이 두드러진다.", "p": "빈 운동장에 비가 내린다\n아무도 차지 않는 공이\n골대 옆에서 젖고 있다\n\n어제는 저 공 하나를 두고\n우리는 해가 지도록 소리쳤는데\n\n오늘은 빗소리만\n운동장을 가득 채운다\n<span class='src'>(창작 시)</span>"}, {"id": "KO-052", "s": "국어", "t": "수능", "g": 2, "d": "하", "q": "윗글의 내용과 일치하는 것은?", "c": ["백신을 접종하면 몸속의 기억 세포가 사라진다.", "백신을 맞으면 실제 병원체가 침입해도 항체가 만들어지지 않는다.", "집단 면역은 백신을 맞은 사람만 보호한다.", "영유아는 누구나 모든 백신을 맞을 수 있다.", "백신은 약하게 만든 병원체나 병원체의 일부를 이용해 만든다."], "a": 5, "e": "첫 문장에서 백신은 '병원체를 약하게 만들거나 병원체의 일부만을 이용해 만든 물질'이라고 하였다.", "p": "백신은 병원체를 약하게 만들거나 병원체의 일부만을 이용해 만든 물질이다. 백신을 접종하면 우리 몸의 면역 체계는 이를 실제 병원체처럼 인식하여 항체를 만들고, 그 병원체의 특징을 기억하는 기억 세포를 남긴다. 이후 실제 병원체가 침입하면 기억 세포가 빠르게 반응하여 많은 양의 항체를 신속히 만들어 내므로, 병에 걸리지 않거나 가볍게 앓고 지나갈 수 있다.\n한편 많은 사람이 면역을 갖추면 병원체가 사람에서 사람으로 옮겨 가기 어려워진다. 그 결과 백신을 맞을 수 없는 영유아나 환자도 간접적으로 보호받게 되는데, 이를 <b>집단 면역</b>이라고 한다."}, {"id": "KO-053", "s": "국어", "t": "수능", "g": 2, "d": "하", "q": "윗글에서 설명한 '집단 면역'의 뜻으로 가장 적절한 것은?", "c": ["한 사람이 여러 종류의 백신을 한꺼번에 맞는 것", "병원체가 스스로 약해져 사라지는 것", "환자를 한곳에 모아 치료하는 것", "많은 사람이 면역을 갖추어 면역이 없는 사람까지 간접적으로 보호받는 것", "백신 없이 병을 앓고 나서 면역을 얻는 것"], "a": 4, "e": "2문단에서 많은 사람이 면역을 갖추면 병원체가 옮겨 가기 어려워져 백신을 맞을 수 없는 사람도 간접적으로 보호받는다고 하였다.", "p": "백신은 병원체를 약하게 만들거나 병원체의 일부만을 이용해 만든 물질이다. 백신을 접종하면 우리 몸의 면역 체계는 이를 실제 병원체처럼 인식하여 항체를 만들고, 그 병원체의 특징을 기억하는 기억 세포를 남긴다. 이후 실제 병원체가 침입하면 기억 세포가 빠르게 반응하여 많은 양의 항체를 신속히 만들어 내므로, 병에 걸리지 않거나 가볍게 앓고 지나갈 수 있다.\n한편 많은 사람이 면역을 갖추면 병원체가 사람에서 사람으로 옮겨 가기 어려워진다. 그 결과 백신을 맞을 수 없는 영유아나 환자도 간접적으로 보호받게 되는데, 이를 <b>집단 면역</b>이라고 한다."}, {"id": "KO-054", "s": "국어", "t": "수능", "g": 2, "d": "중", "q": "윗글을 바탕으로 할 때, 백신을 맞은 사람의 몸에 실제 병원체가 침입했을 때 항체가 빠르게 만들어지는 까닭은?", "c": ["백신 속 병원체가 몸속에서 계속 늘어나기 때문이다.", "실제 병원체는 백신보다 약하기 때문이다.", "병원체의 특징을 기억하는 기억 세포가 남아 있기 때문이다.", "주변 사람들이 모두 면역을 갖추었기 때문이다.", "항체는 한번 만들어지면 절대 줄어들지 않기 때문이다."], "a": 3, "e": "1문단에서 백신 접종 후 남은 기억 세포가 실제 병원체 침입 시 빠르게 반응하여 많은 양의 항체를 신속히 만든다고 하였다.", "p": "백신은 병원체를 약하게 만들거나 병원체의 일부만을 이용해 만든 물질이다. 백신을 접종하면 우리 몸의 면역 체계는 이를 실제 병원체처럼 인식하여 항체를 만들고, 그 병원체의 특징을 기억하는 기억 세포를 남긴다. 이후 실제 병원체가 침입하면 기억 세포가 빠르게 반응하여 많은 양의 항체를 신속히 만들어 내므로, 병에 걸리지 않거나 가볍게 앓고 지나갈 수 있다.\n한편 많은 사람이 면역을 갖추면 병원체가 사람에서 사람으로 옮겨 가기 어려워진다. 그 결과 백신을 맞을 수 없는 영유아나 환자도 간접적으로 보호받게 되는데, 이를 <b>집단 면역</b>이라고 한다."}, {"id": "KO-055", "s": "국어", "t": "수능", "g": 2, "d": "상", "q": "윗글을 바탕으로 &lt;보기&gt;를 이해한 내용으로 적절하지 <u>않은</u> 것은?\n<div class='box'>&lt;보기&gt; 어느 지역에서 한 감염병의 백신 접종률이 95%에서 60%로 떨어졌다. 그 뒤 이 지역에서는 한동안 사라졌던 그 감염병이 다시 유행하였고, 백신을 맞을 수 없는 영유아 환자도 늘어났다.</div>", "c": ["백신을 맞은 사람의 몸에서는 기억 세포가 만들어지지 않았을 것이다.", "접종률이 떨어지면서 면역을 갖춘 사람의 비율이 낮아졌을 것이다.", "병원체가 사람에서 사람으로 옮겨 가기가 이전보다 쉬워졌을 것이다.", "영유아 환자가 늘어난 것은 집단 면역의 간접 보호 효과가 약해졌기 때문일 것이다.", "접종률이 다시 높아지면 영유아가 감염될 위험도 줄어들 것이다."], "a": 1, "e": "백신을 맞은 사람의 몸에는 기억 세포가 남는다. 감염병이 다시 유행한 것은 접종률이 떨어져 집단 면역이 약해졌기 때문이지, 접종자에게 기억 세포가 생기지 않아서가 아니다.", "p": "백신은 병원체를 약하게 만들거나 병원체의 일부만을 이용해 만든 물질이다. 백신을 접종하면 우리 몸의 면역 체계는 이를 실제 병원체처럼 인식하여 항체를 만들고, 그 병원체의 특징을 기억하는 기억 세포를 남긴다. 이후 실제 병원체가 침입하면 기억 세포가 빠르게 반응하여 많은 양의 항체를 신속히 만들어 내므로, 병에 걸리지 않거나 가볍게 앓고 지나갈 수 있다.\n한편 많은 사람이 면역을 갖추면 병원체가 사람에서 사람으로 옮겨 가기 어려워진다. 그 결과 백신을 맞을 수 없는 영유아나 환자도 간접적으로 보호받게 되는데, 이를 <b>집단 면역</b>이라고 한다."}, {"id": "KO-056", "s": "국어", "t": "수능", "g": 2, "d": "하", "q": "윗글에 드러난 화자의 정서로 가장 적절한 것은?", "c": ["자연 속에서 느끼는 한가로움", "임에 대한 그리움과 기다림", "세월의 흐름에 대한 허무함", "임금에 대한 변함없는 충성", "가난한 삶에 대한 한탄"], "a": 2, "e": "임이 없는 긴 겨울밤을 잘라 두었다가 임이 오신 날 밤에 펼치겠다는 발상에서, 임을 그리워하며 함께할 시간을 기다리는 마음이 드러난다.", "p": "동짓달 기나긴 밤을 한 허리를 베어 내어\n춘풍 이불 아래 서리서리 넣었다가\n어론 님 오신 날 밤이어든 굽이굽이 펴리라\n<span class='src'>- 황진이의 시조 (현대어 표기)</span>"}, {"id": "KO-057", "s": "국어", "t": "수능", "g": 2, "d": "상", "q": "윗글의 표현상 특징에 대한 설명으로 적절하지 <u>않은</u> 것은?", "c": ["눈에 보이지 않는 시간을 자르고 넣을 수 있는 사물처럼 표현하고 있다.", "'서리서리', '굽이굽이'와 같은 음성 상징어로 우리말의 묘미를 살리고 있다.", "'동짓달 밤'과 '춘풍 이불'의 대조를 통해 화자의 소망을 드러내고 있다.", "임과 함께하는 밤을 길게 늘이고 싶은 마음을 참신한 발상으로 나타내고 있다.", "대상을 원망하는 직설적인 어조로 이별의 책임을 묻고 있다."], "a": 5, "e": "이 시조는 임을 원망하지 않고, 임이 없는 긴 밤을 잘라 임이 오신 밤에 이어 붙이겠다는 기발한 발상으로 그리움을 노래한다. 추상적인 시간의 구체화, 음성 상징어, 차가운 겨울밤과 따뜻한 봄바람의 대조가 쓰였다.", "p": "동짓달 기나긴 밤을 한 허리를 베어 내어\n춘풍 이불 아래 서리서리 넣었다가\n어론 님 오신 날 밤이어든 굽이굽이 펴리라\n<span class='src'>- 황진이의 시조 (현대어 표기)</span>"}, {"id": "KO-058", "s": "국어", "t": "수능", "g": 2, "d": "하", "q": "윗글을 쓴 목적으로 가장 적절한 것은?", "c": ["도서부 신입 부원을 모집하려고", "도서관에 새 책을 신청하려고", "사서 선생님께 감사를 전하려고", "수업 시간 단축을 요청하려고", "도서관 운영 시간 연장을 건의하려고"], "a": 5, "e": "'도서관 운영 시간을 오후 6시까지 연장해 주시기를 건의드립니다.'에 글의 목적이 드러나 있다.", "p": "교장 선생님께.\n저는 2학년 김하늘입니다. 우리 학교 도서관은 오후 4시 30분에 문을 닫습니다. 그런데 수업이 4시 20분에 끝나기 때문에 학생들이 책을 빌리거나 읽을 시간이 거의 없습니다. 제가 2학년 학생 120명에게 물어보았더니 90명이 '이용 시간이 부족하다'고 답했습니다.\n도서관 운영 시간을 오후 6시까지 연장해 주시기를 건의드립니다. 운영 시간이 늘어나면 학생들의 독서량이 늘고, 방과 후에 조용히 공부할 공간도 생길 것입니다. 사서 선생님의 부담이 걱정된다면 도서부 학생들이 교대로 대출 업무를 돕겠습니다."}, {"id": "KO-059", "s": "국어", "t": "수능", "g": 2, "d": "상", "q": "윗글에 사용된 글쓰기 전략으로 적절하지 <u>않은</u> 것은?", "c": ["문제 상황을 구체적인 시각을 들어 제시하였다.", "설문 조사 결과를 근거로 활용하였다.", "건의가 받아들여졌을 때의 기대 효과를 제시하였다.", "다른 학교의 운영 사례와 비교하여 문제점을 부각하였다.", "예상되는 어려움에 대한 해결 방안을 함께 제안하였다."], "a": 4, "e": "다른 학교의 사례는 언급되지 않았다. 운영 시간과 수업 종료 시각, 120명 중 90명이라는 설문 결과, 독서량 증가 등의 기대 효과, 도서부 학생들의 지원이라는 해결 방안은 모두 제시되어 있다.", "p": "교장 선생님께.\n저는 2학년 김하늘입니다. 우리 학교 도서관은 오후 4시 30분에 문을 닫습니다. 그런데 수업이 4시 20분에 끝나기 때문에 학생들이 책을 빌리거나 읽을 시간이 거의 없습니다. 제가 2학년 학생 120명에게 물어보았더니 90명이 '이용 시간이 부족하다'고 답했습니다.\n도서관 운영 시간을 오후 6시까지 연장해 주시기를 건의드립니다. 운영 시간이 늘어나면 학생들의 독서량이 늘고, 방과 후에 조용히 공부할 공간도 생길 것입니다. 사서 선생님의 부담이 걱정된다면 도서부 학생들이 교대로 대출 업무를 돕겠습니다."}, {"id": "KO-060", "s": "국어", "t": "수능", "g": 3, "d": "하", "q": "윗글의 내용과 일치하는 것은?", "c": ["대체재가 많은 상품은 일반적으로 비탄력적이다.", "탄력성은 가격의 변화율을 수요량의 변화율로 나눈 값이다.", "판매 수입은 가격에서 판매량을 뺀 값이다.", "쌀이나 소금 같은 생활필수품은 일반적으로 비탄력적이다.", "사치품은 가격이 변해도 수요량이 거의 변하지 않는다."], "a": 4, "e": "1문단에서 '쌀이나 소금 같은 생활필수품은 비탄력적'이라고 하였다. 탄력성은 수요량의 변화율을 가격의 변화율로 나눈 값이고, 판매 수입은 가격에 판매량을 곱한 값이다.", "p": "어떤 상품의 가격이 변할 때 수요량이 얼마나 민감하게 변하는지를 나타내는 지표를 <b>수요의 가격 탄력성</b>이라고 한다. 이는 수요량의 변화율을 가격의 변화율로 나눈 값의 절댓값으로 구한다. 이 값이 1보다 크면 '탄력적', 1보다 작으면 '비탄력적'이라고 한다. 일반적으로 대체재가 많은 상품이나 사치품은 탄력적이고, 쌀이나 소금 같은 생활필수품은 비탄력적이다.\n탄력성은 기업의 판매 수입에도 영향을 준다. 판매 수입은 가격에 판매량을 곱한 값이다. 수요가 탄력적인 상품은 가격을 올리면 수요량이 더 큰 비율로 줄어 판매 수입이 감소한다. 반대로 수요가 비탄력적인 상품은 가격을 올려도 수요량이 조금만 줄어 판매 수입이 증가한다."}, {"id": "KO-061", "s": "국어", "t": "수능", "g": 3, "d": "하", "q": "윗글에 따를 때, 수요의 가격 탄력성이 1보다 큰 경우를 가리키는 말은?", "c": ["비탄력적", "탄력적", "단위 탄력적", "완전 비탄력적", "대체적"], "a": 2, "e": "1문단에서 탄력성의 값이 1보다 크면 '탄력적', 1보다 작으면 '비탄력적'이라고 하였다.", "p": "어떤 상품의 가격이 변할 때 수요량이 얼마나 민감하게 변하는지를 나타내는 지표를 <b>수요의 가격 탄력성</b>이라고 한다. 이는 수요량의 변화율을 가격의 변화율로 나눈 값의 절댓값으로 구한다. 이 값이 1보다 크면 '탄력적', 1보다 작으면 '비탄력적'이라고 한다. 일반적으로 대체재가 많은 상품이나 사치품은 탄력적이고, 쌀이나 소금 같은 생활필수품은 비탄력적이다.\n탄력성은 기업의 판매 수입에도 영향을 준다. 판매 수입은 가격에 판매량을 곱한 값이다. 수요가 탄력적인 상품은 가격을 올리면 수요량이 더 큰 비율로 줄어 판매 수입이 감소한다. 반대로 수요가 비탄력적인 상품은 가격을 올려도 수요량이 조금만 줄어 판매 수입이 증가한다."}, {"id": "KO-062", "s": "국어", "t": "수능", "g": 3, "d": "중", "q": "윗글을 바탕으로 할 때, 가격을 10% 올렸더니 수요량이 20% 줄어든 상품에 대한 설명으로 옳은 것은?", "c": ["탄력성은 0.5이고 비탄력적이다.", "탄력성은 0.5이고 탄력적이다.", "탄력성은 2이고 탄력적이다.", "탄력성은 2이고 비탄력적이다.", "탄력성은 1이다."], "a": 3, "e": "탄력성 = 수요량의 변화율 ÷ 가격의 변화율 = 20% ÷ 10% = 2. 1보다 크므로 탄력적이다.", "p": "어떤 상품의 가격이 변할 때 수요량이 얼마나 민감하게 변하는지를 나타내는 지표를 <b>수요의 가격 탄력성</b>이라고 한다. 이는 수요량의 변화율을 가격의 변화율로 나눈 값의 절댓값으로 구한다. 이 값이 1보다 크면 '탄력적', 1보다 작으면 '비탄력적'이라고 한다. 일반적으로 대체재가 많은 상품이나 사치품은 탄력적이고, 쌀이나 소금 같은 생활필수품은 비탄력적이다.\n탄력성은 기업의 판매 수입에도 영향을 준다. 판매 수입은 가격에 판매량을 곱한 값이다. 수요가 탄력적인 상품은 가격을 올리면 수요량이 더 큰 비율로 줄어 판매 수입이 감소한다. 반대로 수요가 비탄력적인 상품은 가격을 올려도 수요량이 조금만 줄어 판매 수입이 증가한다."}, {"id": "KO-063", "s": "국어", "t": "수능", "g": 3, "d": "중", "q": "윗글을 바탕으로 추론할 때, 수요가 비탄력적인 상품의 가격을 <u>내리면</u> 판매 수입은 어떻게 되는가?", "c": ["수요량이 크게 늘어 판매 수입이 증가한다.", "수요량이 줄어 판매 수입이 감소한다.", "수요량이 변하지 않아 판매 수입도 변하지 않는다.", "가격과 관계없이 판매 수입은 항상 증가한다.", "수요량이 조금만 늘어 판매 수입이 감소한다."], "a": 5, "e": "비탄력적인 상품은 가격 변화에 수요량이 둔감하다. 가격을 내리면 수요량이 늘기는 하지만 가격 하락 비율보다 적게 늘어나므로 판매 수입(가격 × 판매량)은 감소한다.", "p": "어떤 상품의 가격이 변할 때 수요량이 얼마나 민감하게 변하는지를 나타내는 지표를 <b>수요의 가격 탄력성</b>이라고 한다. 이는 수요량의 변화율을 가격의 변화율로 나눈 값의 절댓값으로 구한다. 이 값이 1보다 크면 '탄력적', 1보다 작으면 '비탄력적'이라고 한다. 일반적으로 대체재가 많은 상품이나 사치품은 탄력적이고, 쌀이나 소금 같은 생활필수품은 비탄력적이다.\n탄력성은 기업의 판매 수입에도 영향을 준다. 판매 수입은 가격에 판매량을 곱한 값이다. 수요가 탄력적인 상품은 가격을 올리면 수요량이 더 큰 비율로 줄어 판매 수입이 감소한다. 반대로 수요가 비탄력적인 상품은 가격을 올려도 수요량이 조금만 줄어 판매 수입이 증가한다."}, {"id": "KO-064", "s": "국어", "t": "수능", "g": 3, "d": "상", "q": "윗글을 바탕으로 &lt;보기&gt;를 이해한 내용으로 가장 적절한 것은?\n<div class='box'>&lt;보기&gt; 어느 가게에서 A 상품의 가격을 1,000원에서 1,200원으로 올렸더니, 하루 판매량이 100개에서 90개로 줄었다.</div>", "c": ["탄력성은 2이고, 판매 수입은 감소하였다.", "탄력성은 2이고, 판매 수입은 증가하였다.", "탄력성은 0.5이고, 판매 수입은 감소하였다.", "탄력성은 1이고, 판매 수입은 변하지 않았다.", "탄력성은 0.5이고, 판매 수입은 증가하였다."], "a": 5, "e": "가격은 20% 오르고 수요량은 10% 줄었으므로 탄력성은 10% ÷ 20% = 0.5로 비탄력적이다. 판매 수입은 1,000원 × 100개 = 100,000원에서 1,200원 × 90개 = 108,000원으로 증가하였다.", "p": "어떤 상품의 가격이 변할 때 수요량이 얼마나 민감하게 변하는지를 나타내는 지표를 <b>수요의 가격 탄력성</b>이라고 한다. 이는 수요량의 변화율을 가격의 변화율로 나눈 값의 절댓값으로 구한다. 이 값이 1보다 크면 '탄력적', 1보다 작으면 '비탄력적'이라고 한다. 일반적으로 대체재가 많은 상품이나 사치품은 탄력적이고, 쌀이나 소금 같은 생활필수품은 비탄력적이다.\n탄력성은 기업의 판매 수입에도 영향을 준다. 판매 수입은 가격에 판매량을 곱한 값이다. 수요가 탄력적인 상품은 가격을 올리면 수요량이 더 큰 비율로 줄어 판매 수입이 감소한다. 반대로 수요가 비탄력적인 상품은 가격을 올려도 수요량이 조금만 줄어 판매 수입이 증가한다."}, {"id": "KO-065", "s": "국어", "t": "수능", "g": 3, "d": "중", "q": "&lt;보기&gt;의 단어 중 파생어만을 고른 것은?\n<div class='box'>ㄱ. 돌다리　ㄴ. 풋사과　ㄷ. 덮개　ㄹ. 밤낮</div>", "c": ["ㄱ, ㄴ", "ㄱ, ㄹ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "a": 3, "e": "'풋사과'는 접두사 '풋-'과 어근 '사과', '덮개'는 어근 '덮-'과 접미사 '-개'가 결합한 파생어이다. '돌다리(돌+다리)'와 '밤낮(밤+낮)'은 어근끼리 결합한 합성어이다.", "p": ""}, {"id": "KO-066", "s": "국어", "t": "수능", "g": 3, "d": "중", "q": "&lt;보기&gt;의 설명에 해당하는 표현의 예로 가장 적절한 것은?\n<div class='box'>&lt;보기&gt; 반어법은 겉으로 표현한 내용과 속에 담긴 의미를 서로 반대로 나타내어 의미를 강조하는 표현 방법이다.</div>", "c": ["\"내 마음은 호수요.\"", "\"꽃이 나를 보고 웃는다.\"", "\"산이 높고 물이 맑다.\"", "(약속에 한 시간 늦은 친구에게) \"참 일찍도 왔구나.\"", "\"구름처럼 가벼운 발걸음\""], "a": 4, "e": "늦게 온 친구에게 '일찍 왔다'고 말하는 것은 속뜻과 반대로 표현한 반어법이다. 나머지는 차례로 은유법, 의인법, 대구법, 직유법이다.", "p": ""}, {"id": "KO-067", "s": "국어", "t": "수능", "g": 3, "d": "하", "q": "&lt;보기&gt;의 문장을 바르게 고친 것과 그 이유를 옳게 짝지은 것은?\n<div class='box'>&lt;보기&gt; (카페에서 점원이 손님에게) \"손님, 주문하신 커피 나오셨습니다.\"</div>", "c": ["\"커피 나오셨어요.\" - 격식을 낮추어야 하기 때문이다.", "\"커피 나왔습니다.\" - 높일 필요가 없는 사물을 높였기 때문이다.", "\"커피 나오시겠습니다.\" - 미래의 일이기 때문이다.", "\"커피 나왔다.\" - 손님을 높일 필요가 없기 때문이다.", "\"커피 드셨습니다.\" - 주체를 더 높여야 하기 때문이다."], "a": 2, "e": "'-시-'는 문장의 주체를 높이는 말인데, '커피'는 높임의 대상이 아닌 사물이다. 손님은 '주문하신'에서 이미 높였으므로 '커피 나왔습니다'가 바른 표현이다.", "p": ""}, {"id": "EN-001", "s": "영어", "t": "단편", "g": 1, "d": "하", "q": "다음 단어의 뜻으로 알맞은 것은?\n<b>abundant</b>", "c": ["부족한", "정확한", "일시적인", "풍부한", "위험한"], "a": 4, "e": "abundant는 '풍부한, 많은'이라는 뜻이다. 반의어는 scarce(부족한)이다.", "p": ""}, {"id": "EN-002", "s": "영어", "t": "단편", "g": 1, "d": "하", "q": "다음 단어와 의미가 가장 가까운 것은?\n<b>reluctant</b>", "c": ["eager", "careful", "unwilling", "generous", "honest"], "a": 3, "e": "reluctant는 '꺼리는, 마지못한'이라는 뜻으로 unwilling과 의미가 가깝다. eager(열망하는)는 반대 의미이다.", "p": ""}, {"id": "EN-003", "s": "영어", "t": "단편", "g": 1, "d": "하", "q": "다음 단어의 반의어로 알맞은 것은?\n<b>ancient</b>", "c": ["old", "historic", "huge", "ruined", "modern"], "a": 5, "e": "ancient는 '고대의, 아주 오래된'이라는 뜻으로 반의어는 modern(현대의)이다.", "p": ""}, {"id": "EN-004", "s": "영어", "t": "단편", "g": 1, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?\nI'm looking forward to ______ you again.", "c": ["seeing", "see", "saw", "be seen", "have seen"], "a": 1, "e": "look forward to에서 to는 전치사이므로 뒤에 동명사(-ing)가 온다. 따라서 seeing이 알맞다.", "p": ""}, {"id": "EN-005", "s": "영어", "t": "단편", "g": 1, "d": "중", "q": "밑줄 친 부분과 의미가 가장 가까운 것은?\nThe meeting was <u>put off</u> until next week.", "c": ["cancelled", "postponed", "attended", "organized", "shortened"], "a": 2, "e": "put off는 '미루다, 연기하다'라는 뜻으로 postpone과 같은 의미이다.", "p": ""}, {"id": "EN-006", "s": "영어", "t": "단편", "g": 2, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?\nIf I ______ you, I would apologize to her right away.", "c": ["am", "be", "was being", "had been", "were"], "a": 5, "e": "현재 사실과 반대되는 가정을 나타내는 가정법 과거이므로 if절에 be동사는 주어와 관계없이 were를 쓴다(구어에서 was도 쓰이지만 문법상 were가 기본형).", "p": ""}, {"id": "EN-007", "s": "영어", "t": "단편", "g": 2, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?\nThis is the house ______ I was born.", "c": ["where", "which", "what", "who", "whose"], "a": 1, "e": "선행사 the house가 장소이고 뒤 문장(I was born)이 완전하므로 관계부사 where(= in which)가 알맞다. which를 쓰려면 in which가 되어야 한다.", "p": ""}, {"id": "EN-008", "s": "영어", "t": "단편", "g": 2, "d": "중", "q": "다음 중 어법상 <u>틀린</u> 문장은?", "c": ["Each of the students has a laptop.", "The number of students are increasing.", "A number of people were waiting outside.", "Neither my brother nor I am ready.", "Ten dollars is enough for lunch."], "a": 2, "e": "'the number of + 복수명사'는 '~의 수'라는 뜻으로 단수 취급하므로 is increasing이 되어야 한다. 'a number of'는 '많은'이라는 뜻으로 복수 취급한다.", "p": ""}, {"id": "EN-009", "s": "영어", "t": "단편", "g": 2, "d": "하", "q": "빈칸에 들어갈 말로 알맞은 것은?\n______ the heavy rain, the game continued.", "c": ["Despite", "Although", "Because", "Unless", "While"], "a": 1, "e": "빈칸 뒤에 명사구(the heavy rain)가 오므로 전치사 Despite가 알맞다. Although는 접속사로 뒤에 절이 와야 한다.", "p": ""}, {"id": "EN-010", "s": "영어", "t": "단편", "g": 2, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?\nHardly ______ I arrived at the station when the train left.", "c": ["did", "have", "was", "do", "had"], "a": 5, "e": "'Hardly + had + 주어 + p.p. ~ when ...'은 '~하자마자 …했다'는 구문으로, 부정어가 문장 앞에 나와 주어와 조동사가 도치된다.", "p": ""}, {"id": "EN-011", "s": "영어", "t": "단편", "g": 3, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?\n______ from the top of the hill, the town looks beautiful.", "c": ["Seeing", "To see", "Having seen", "Being seeing", "Seen"], "a": 5, "e": "주절의 주어 the town은 '보이는' 대상이므로 수동 의미의 과거분사로 시작하는 분사구문 Seen이 알맞다.", "p": ""}, {"id": "EN-012", "s": "영어", "t": "단편", "g": 3, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?\nIf she had taken the medicine last night, she ______ better now.", "c": ["feels", "would have felt", "had felt", "would feel", "will feel"], "a": 4, "e": "if절은 과거(last night) 사실의 반대, 주절은 현재(now) 사실의 반대를 나타내는 혼합 가정법이므로 '조동사 과거형 + 동사원형'인 would feel이 알맞다.", "p": ""}, {"id": "EN-013", "s": "영어", "t": "단편", "g": 3, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?\nThe doctor suggested that he ______ more vegetables.", "c": ["eats", "ate", "eat", "eating", "to eat"], "a": 3, "e": "제안·요구를 나타내는 동사(suggest, insist, demand 등) 뒤의 that절이 '~해야 한다'는 당위를 나타내면 (should) + 동사원형을 쓴다.", "p": ""}, {"id": "EN-014", "s": "영어", "t": "단편", "g": 3, "d": "중", "q": "다음 단어의 뜻으로 알맞은 것은?\n<b>concise</b>", "c": ["모호한", "정중한", "복잡한", "간결한", "지속적인"], "a": 4, "e": "concise는 '간결한, 간명한'이라는 뜻이다. 모호한은 vague, 복잡한은 complicated이다.", "p": ""}, {"id": "EN-015", "s": "영어", "t": "단편", "g": 1, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?\nIt is important ______ students to get enough sleep.", "c": ["of", "to", "with", "by", "for"], "a": 5, "e": "to부정사의 의미상 주어는 보통 'for + 목적격'으로 나타낸다. kind, nice처럼 사람의 성격을 나타내는 형용사일 때만 of를 쓴다.", "p": ""}, {"id": "EN-016", "s": "영어", "t": "수능", "g": 2, "d": "중", "q": "다음 글의 주제로 가장 적절한 것은?", "c": ["the best time of day to take an exam", "why students feel stressed before tests", "how to stay awake while studying", "the dangers of studying in groups", "the role of sleep in making memories last"], "a": 5, "e": "잠자는 동안 뇌가 낮에 얻은 정보를 재생·정리하여 기억을 오래 가게 한다는 내용이므로, '기억을 오래 남기는 데 있어 수면의 역할'이 주제이다.", "p": "Many students believe that staying up late to study is the best way to prepare for an exam. However, research on memory suggests otherwise. During sleep, the brain does not simply rest; it replays and organizes the information gathered during the day, strengthening the connections that make memories last. When sleep is cut short, this process is interrupted, and much of what was studied may be lost. In other words, a good night's sleep is not time taken away from learning but an essential part of it."}, {"id": "EN-017", "s": "영어", "t": "수능", "g": 3, "d": "상", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "c": ["unlimited resources", "complete freedom", "careful imitation", "public praise", "restrictions"], "a": 5, "e": "엄격한 운율 규칙이나 적은 예산 같은 제약이 오히려 독창적인 해결책을 찾게 만든다는 내용이다. 따라서 '제약(restrictions)'이 정신을 독창성으로 이끈다는 말이 알맞다.", "p": "We often assume that creativity flourishes when people are given complete freedom. Yet artists and engineers frequently report the opposite. A poet who must follow a strict rhyme scheme is forced to search for unusual words, and a designer with a tiny budget must find solutions that others would never consider. Without limits, the number of possible choices can be so large that people simply fall back on familiar ideas. In this sense, ________ can actually push the mind toward originality."}, {"id": "EN-018", "s": "영어", "t": "수능", "g": 1, "d": "하", "q": "다음 글의 요지로 가장 적절한 것은?", "c": ["실험은 실패하지 않도록 철저히 준비해야 한다.", "실패한 결과는 빨리 잊는 것이 정신 건강에 좋다.", "과학자는 실패를 다른 사람에게 숨기는 것이 낫다.", "학생들은 실험보다 이론 학습에 집중해야 한다.", "실패를 능력에 대한 평가가 아닌 배움의 자료로 활용해야 한다."], "a": 5, "e": "마지막 문장에서 실수를 능력에 대한 판단이 아니라 하나의 자료(data)로 다루면 더 빨리 배우고 덜 걱정하게 된다고 하였다.", "p": "When an experiment fails, many students feel embarrassed and want to forget about it as quickly as possible. But a failed result is still a result. It tells you which path does not lead to the answer, and that information narrows down where the answer might be. Scientists who make important discoveries are often those who carefully study their failures instead of hiding them. If you treat each mistake as a piece of data rather than a judgment of your ability, you will learn faster and worry less."}, {"id": "EN-019", "s": "영어", "t": "수능", "g": 3, "d": "상", "q": "다음 글의 밑줄 친 부분 중, 어법상 <u>틀린</u> 것은?", "c": ["①", "②", "③", "④", "⑤"], "a": 5, "e": "주어가 관계대명사 what이 이끄는 명사절(What makes this system remarkable)이므로 단수 취급하여 are가 아니라 is가 되어야 한다. ①은 a movement를 수식하는 과거분사, ②는 분사구문, ④는 Other bees를 수식하는 현재분사로 모두 옳다.", "p": "Honeybees communicate the location of food through a movement ①<u>known</u> as the waggle dance. A bee that has found flowers returns to the hive and moves in a figure-eight pattern, ②<u>shaking</u> its body during the straight part of the dance. The direction of this straight run shows the direction of the food ③<u>relative to</u> the sun, and its length indicates how far away the food is. Other bees ④<u>watching</u> the dance can then fly directly to the flowers. What makes this system remarkable ⑤<u>are</u> that it allows thousands of bees to share information without any spoken language."}, {"id": "EN-020", "s": "영어", "t": "수능", "g": 2, "d": "중", "q": "다음 글에서 전체 흐름과 관계 <u>없는</u> 문장은?", "c": ["①", "②", "③", "④", "⑤"], "a": 3, "e": "도시 텃밭의 장점(신선한 채소, 이웃 교류, 홍수 위험 감소)을 설명하는 글인데, ③은 최초의 고층 건물에 관한 내용으로 흐름과 무관하다.", "p": "Urban gardens are becoming popular in many cities around the world. ① They give residents a chance to grow fresh vegetables close to home, reducing the need to transport food over long distances. ② They also turn empty lots into green spaces where neighbors can meet and work together. ③ The first skyscrapers were built in the late nineteenth century as steel became cheaper. ④ In addition, plants in these gardens help absorb rainwater, lowering the risk of flooding during heavy storms. ⑤ For these reasons, many local governments now support community garden projects."}, {"id": "EN-021", "s": "영어", "t": "수능", "g": 3, "d": "상", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "c": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "a": 3, "e": "주어진 선택 상황에 대해 대부분 지금의 50달러를 고른다는 (B)가 먼저 오고, 같은 선택을 미래로 옮긴 경우를 설명하는 (C)가 이어진다. 마지막으로 이런 경향을 '현재 편향'이라 정의하는 (A)가 온다.", "p": "<b>Imagine you are offered a choice: receive $50 today or $60 in a month.</b>\n(A) This tendency to prefer smaller, immediate rewards over larger, delayed ones is called present bias. It helps explain why people put off saving money or exercising.\n(B) Most people choose the $50 today, even though waiting a month would give them 20 percent more. However, when the same choice is moved into the future, their answer often changes.\n(C) Offered $50 in twelve months or $60 in thirteen months, many of the same people now prefer to wait for the larger amount. The one-month delay is identical, but it feels less painful when both rewards are far away."}, {"id": "EN-022", "s": "영어", "t": "수능", "g": 1, "d": "하", "q": "Greenfield Youth Science Camp에 관한 다음 안내문의 내용과 일치하는 것은?", "c": ["참가비에 점심 식사가 포함되어 있다.", "4일 동안 진행된다.", "고등학교 3학년도 참가할 수 있다.", "신청서는 캠프 당일 현장에서 작성한다.", "참가 인원에 제한이 없다."], "a": 1, "e": "Fee: $40 (lunch included)에서 참가비에 점심이 포함됨을 알 수 있다. 기간은 3일, 대상은 10~11학년(고1~2), 신청은 웹사이트에서 7월 10일까지, 인원은 30명으로 제한된다.", "p": "<b>Greenfield Youth Science Camp</b>\n• Dates: July 22–24 (3 days)\n• Who can join: High school students in grades 10–11\n• Fee: $40 (lunch included)\n• Activities: robot building, star watching at night, water quality testing in the river\n• How to apply: Fill out the form on our website by July 10.\n※ Participants must bring their own water bottle.\n※ Spaces are limited to 30 students."}, {"id": "EN-023", "s": "영어", "t": "수능", "g": 2, "d": "중", "q": "다음 글에 드러난 Mina의 심경 변화로 가장 적절한 것은?", "c": ["bored → excited", "nervous → delighted", "proud → ashamed", "calm → anxious", "hopeful → disappointed"], "a": 2, "e": "처음에는 바이올린을 꽉 쥐고 음을 잊을까 걱정하며 긴장했지만(nervous), 연주 후 기립 박수를 받고 환하게 웃으므로 기쁨(delighted)으로 바뀌었다.", "p": "Mina stood at the edge of the stage, holding her violin so tightly that her fingers ached. The hall was full, and she could hear people whispering. What if she forgot the notes? When her name was called, she walked to the center and began to play. After the first few bars, the music seemed to carry her. By the time the final note faded, the audience was on its feet, clapping loudly. Mina bowed, a wide smile spreading across her face."}, {"id": "EN-024", "s": "영어", "t": "수능", "g": 2, "d": "중", "q": "다음 글의 제목으로 가장 적절한 것은?", "c": ["Why Concrete Is Better Than Grass", "The History of City Streets", "How Climate Change Began", "Trees: Natural Air Conditioners for Hot Cities", "Water Vapor: A Hidden Danger"], "a": 4, "e": "나무가 햇빛을 막고 잎에서 수증기를 내보내 주변 공기를 식혀, 더워지는 도시의 주민을 보호하는 간단하고 저렴한 방법이라는 내용이다.", "p": "On a hot summer afternoon, a street lined with trees can be several degrees cooler than a nearby street without them. Trees block sunlight before it reaches the pavement, and they release water vapor through their leaves, which cools the surrounding air. As cities grow hotter because of climate change and the spread of concrete, planting trees has become one of the simplest and cheapest ways to protect residents from dangerous heat."}, {"id": "EN-025", "s": "영어", "t": "단편", "g": 1, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?\nNot only ______ the book, but he also wrote a review of it.", "c": ["he read", "he did read", "read he", "did he read", "he reads"], "a": 4, "e": "부정어구 Not only가 문장 앞에 오면 주어와 조동사가 도치되어 'Not only + 조동사 + 주어 + 동사원형' 어순이 된다.", "p": ""}, {"id": "EN-026", "s": "영어", "t": "단편", "g": 1, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?\nThe man ______ I thought was honest deceived me.", "c": ["who", "whom", "whose", "which", "what"], "a": 1, "e": "I thought는 삽입절이다. 빈칸은 was honest의 주어 역할을 하므로 주격 관계대명사 who가 알맞다. 삽입절 때문에 목적격 whom을 고르지 않도록 주의한다.", "p": ""}, {"id": "EN-027", "s": "영어", "t": "단편", "g": 1, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?\nIt was not until midnight ______ he came home.", "c": ["when", "what", "which", "until", "that"], "a": 5, "e": "'It was not until ~ that …'은 '~가 되어서야 비로소 …했다'는 뜻의 강조 구문으로 that을 쓴다.", "p": ""}, {"id": "EN-028", "s": "영어", "t": "단편", "g": 2, "d": "하", "q": "다음 단어와 의미가 가장 가까운 것은?\n<b>purchase</b>", "c": ["sell", "borrow", "lend", "buy", "repair"], "a": 4, "e": "purchase는 '구입하다'라는 뜻으로 buy와 의미가 같다.", "p": ""}, {"id": "EN-029", "s": "영어", "t": "단편", "g": 2, "d": "하", "q": "빈칸에 들어갈 말로 알맞은 것은?\nShe is interested ______ classical music.", "c": ["at", "on", "for", "with", "in"], "a": 5, "e": "be interested in은 '~에 관심이 있다'는 뜻의 표현이다.", "p": ""}, {"id": "EN-030", "s": "영어", "t": "단편", "g": 2, "d": "하", "q": "다음 단어의 반의어로 알맞은 것은?\n<b>increase</b>", "c": ["improve", "expand", "continue", "develop", "decrease"], "a": 5, "e": "increase(증가하다)의 반의어는 decrease(감소하다)이다.", "p": ""}, {"id": "EN-031", "s": "영어", "t": "단편", "g": 2, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?\nI wish I ______ taller than my brother.", "c": ["am", "will be", "have been", "were", "be"], "a": 4, "e": "'I wish + 가정법 과거'는 현재 사실과 반대되는 소망을 나타내며, be동사는 were를 쓴다.", "p": ""}, {"id": "EN-032", "s": "영어", "t": "단편", "g": 2, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?\nNo sooner had he left the house ______ it started to rain.", "c": ["than", "when", "before", "that", "as"], "a": 1, "e": "'No sooner had + 주어 + p.p. ~ than …'은 '~하자마자 …했다'는 뜻이다. Hardly/Scarcely ~ when/before와 구별한다.", "p": ""}, {"id": "EN-033", "s": "영어", "t": "단편", "g": 2, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?\nThe bridge ______ next year will connect the two cities.", "c": ["to be built", "building", "built", "to build", "having built"], "a": 1, "e": "다리는 '지어지는' 대상이고 next year로 미래의 일이므로, 명사를 뒤에서 수식하는 to부정사의 수동형 to be built가 알맞다.", "p": ""}, {"id": "EN-034", "s": "영어", "t": "단편", "g": 2, "d": "상", "q": "다음 중 어법상 <u>틀린</u> 문장은?", "c": ["Don't forget to lock the door when you leave.", "She stopped talking when the teacher came in.", "He tried to open the window, but it was stuck.", "I remember to meet him at the party last year.", "I regret telling her the secret."], "a": 4, "e": "과거에 한 일을 기억하는 것은 'remember + 동명사'로 나타내므로 remember meeting이 되어야 한다. 'remember to부정사'는 '(앞으로) ~할 것을 기억하다'라는 뜻이다.", "p": ""}, {"id": "EN-035", "s": "영어", "t": "단편", "g": 2, "d": "상", "q": "다음 단어의 뜻으로 알맞은 것은?\n<b>ambiguous</b>", "c": ["야심 찬", "모호한", "풍부한", "적대적인", "즉각적인"], "a": 2, "e": "ambiguous는 '모호한, 여러 가지로 해석될 수 있는'이라는 뜻이다. '야심 찬'은 ambitious이다.", "p": ""}, {"id": "EN-036", "s": "영어", "t": "단편", "g": 3, "d": "하", "q": "다음 단어와 의미가 가장 가까운 것은?\n<b>huge</b>", "c": ["tiny", "narrow", "ordinary", "enormous", "empty"], "a": 4, "e": "huge는 '거대한'이라는 뜻으로 enormous와 의미가 가깝다.", "p": ""}, {"id": "EN-037", "s": "영어", "t": "단편", "g": 3, "d": "하", "q": "빈칸에 들어갈 말로 알맞은 것은?\nHe is taller ______ his older brother.", "c": ["than", "as", "to", "of", "from"], "a": 1, "e": "비교급(taller) 뒤에는 비교 대상을 나타내는 than을 쓴다.", "p": ""}, {"id": "EN-038", "s": "영어", "t": "단편", "g": 3, "d": "하", "q": "다음 단어의 뜻으로 알맞은 것은?\n<b>ancestor</b>", "c": ["후손", "이웃", "경쟁자", "동료", "조상"], "a": 5, "e": "ancestor는 '조상'이라는 뜻이다. '후손'은 descendant이다.", "p": ""}, {"id": "EN-039", "s": "영어", "t": "단편", "g": 3, "d": "하", "q": "빈칸에 들어갈 말로 알맞은 것은?\nI have lived in this town ______ 2010.", "c": ["for", "during", "from", "at", "since"], "a": 5, "e": "현재완료와 함께 '~ 이래로'라는 시작 시점을 나타낼 때는 since를 쓴다. for 뒤에는 기간(for ten years)이 온다.", "p": ""}, {"id": "EN-040", "s": "영어", "t": "단편", "g": 3, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?\nThis book is worth ______ twice.", "c": ["read", "to read", "being read", "reading", "to be read"], "a": 4, "e": "'be worth -ing'는 '~할 가치가 있다'는 뜻으로, worth 뒤에는 동명사가 온다.", "p": ""}, {"id": "EN-041", "s": "영어", "t": "단편", "g": 3, "d": "중", "q": "다음 단어와 의미가 가장 가까운 것은?\n<b>inevitable</b>", "c": ["unbelievable", "invisible", "incorrect", "informal", "unavoidable"], "a": 5, "e": "inevitable은 '피할 수 없는, 필연적인'이라는 뜻으로 unavoidable과 의미가 같다.", "p": ""}, {"id": "EN-042", "s": "영어", "t": "단편", "g": 3, "d": "중", "q": "빈칸에 들어갈 말로 알맞은 것은?\nHe talks ______ if he knew everything about the matter.", "c": ["as", "even", "only", "what", "so"], "a": 1, "e": "'as if + 가정법 과거'는 '마치 ~인 것처럼'이라는 뜻으로 현재 사실과 반대되는 내용을 나타낸다.", "p": ""}, {"id": "EN-043", "s": "영어", "t": "단편", "g": 3, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?\nHad it not been for your help, I ______ the exam.", "c": ["would have failed", "will fail", "would fail", "had failed", "failed"], "a": 1, "e": "'Had it not been for ~'는 'If it had not been for ~(~이 없었다면)'에서 if가 생략되어 도치된 가정법 과거완료이므로, 주절은 'would have + p.p.'가 된다.", "p": ""}, {"id": "EN-044", "s": "영어", "t": "단편", "g": 3, "d": "상", "q": "다음 단어와 의미가 가장 가까운 것은?\n<b>meticulous</b>", "c": ["careless", "hasty", "thorough", "generous", "modest"], "a": 3, "e": "meticulous는 '꼼꼼한, 세심한'이라는 뜻으로 thorough(철저한)와 의미가 가깝다.", "p": ""}, {"id": "EN-045", "s": "영어", "t": "단편", "g": 3, "d": "상", "q": "빈칸에 들어갈 말로 알맞은 것은?\nThe more you practice, ______ you will become.", "c": ["the better", "better", "the best", "more good", "the more good"], "a": 1, "e": "'The + 비교급 ~, the + 비교급 …'은 '~하면 할수록 더 …하다'는 뜻의 구문이다.", "p": ""}, {"id": "EN-046", "s": "영어", "t": "수능", "g": 1, "d": "하", "q": "다음 글의 목적으로 가장 적절한 것은?", "c": ["독서 모임 회원 가입을 신청하려고", "도서관 이용 시간 연장을 건의하려고", "독서 모임 일정 변경을 알리려고", "난방기를 고쳐 준 것에 감사하려고", "모임 장소의 난방기 수리를 요청하려고"], "a": 5, "e": "마지막 부분의 'Could you please send someone to repair the heater ~?'에서 난방기 수리를 요청하는 글임을 알 수 있다.", "p": "Dear Mr. Harris,\nI am a member of the Maple Street Library reading club. Our club meets every Saturday in Room B, but the heating in that room has not worked since last month. Several older members have stopped coming because of the cold. Could you please send someone to repair the heater before our next meeting? Thank you for your help.\nSincerely,\nJulia Kim"}, {"id": "EN-047", "s": "영어", "t": "수능", "g": 1, "d": "하", "q": "다음 글의 내용과 일치하는 것은?", "c": ["모임은 A실에서 열린다.", "난방기는 지난주부터 고장 났다.", "젊은 회원들이 추위 때문에 나오지 않는다.", "Julia는 도서관 직원이다.", "독서 모임은 매주 토요일에 열린다."], "a": 5, "e": "'Our club meets every Saturday in Room B'에서 매주 토요일 B실에서 모임을 함을 알 수 있다. 난방기는 지난달부터 고장 났고, 나오지 않는 사람은 나이 든 회원들이며, Julia는 독서 모임 회원이다.", "p": "Dear Mr. Harris,\nI am a member of the Maple Street Library reading club. Our club meets every Saturday in Room B, but the heating in that room has not worked since last month. Several older members have stopped coming because of the cold. Could you please send someone to repair the heater before our next meeting? Thank you for your help.\nSincerely,\nJulia Kim"}, {"id": "EN-048", "s": "영어", "t": "수능", "g": 1, "d": "하", "q": "다음 글의 요지로 가장 적절한 것은?", "c": ["큰 목표를 세워야 강한 동기가 생긴다.", "바쁠 때는 새로운 일을 시작하지 말아야 한다.", "운동과 독서를 함께 해야 효과가 크다.", "목표는 다른 사람에게 알려야 지킬 수 있다.", "습관을 만들려면 아주 작은 행동부터 반복하는 것이 좋다."], "a": 5, "e": "거창한 목표는 포기하기 쉬우므로, 너무 쉬워 보일 만큼 작은 행동으로 시작해 반복하면 습관이 된다는 내용이다.", "p": "Many people try to change their lives by setting huge goals, such as running a marathon or reading a hundred books a year. These goals are exciting at first, but they are easy to give up when life gets busy. A better approach is to start with an action so small that it feels almost too easy, like putting on your running shoes or reading one page. Small actions are easy to repeat, and repetition is what turns an action into a habit. Once the habit is in place, it grows naturally."}, {"id": "EN-049", "s": "영어", "t": "수능", "g": 1, "d": "중", "q": "다음 글의 주제로 가장 적절한 것은?", "c": ["the power of starting small in building habits", "the health benefits of running marathons", "reasons why busy people read fewer books", "the difficulty of choosing the right goal", "ways to finish a hundred books a year"], "a": 1, "e": "큰 목표 대신 아주 작은 행동으로 시작하는 것이 습관 형성에 효과적이라는 내용이므로, '습관을 만들 때 작게 시작하는 것의 힘'이 주제이다.", "p": "Many people try to change their lives by setting huge goals, such as running a marathon or reading a hundred books a year. These goals are exciting at first, but they are easy to give up when life gets busy. A better approach is to start with an action so small that it feels almost too easy, like putting on your running shoes or reading one page. Small actions are easy to repeat, and repetition is what turns an action into a habit. Once the habit is in place, it grows naturally."}, {"id": "EN-050", "s": "영어", "t": "수능", "g": 1, "d": "중", "q": "다음 글의 내용과 일치하는 것은?", "c": ["관객은 동전이 정말로 사라졌다고 믿는다.", "마술사는 관객의 예측에 맞추어 마술을 진행한다.", "마술은 손이 눈보다 빠르기 때문에 성공한다.", "마술사는 두 손을 항상 함께 보여 준다.", "우리의 뇌는 과거 경험을 바탕으로 다음에 일어날 일을 예측한다."], "a": 5, "e": "'our brains are built to predict what will happen next based on past experience'와 일치한다. 마술사는 그 예측을 일부러 깨뜨리며, 마술의 성공 요인은 손의 속도가 아니라 주의의 통제이다.", "p": "When we watch a magic show, we know that the coin has not really disappeared. Still, we are surprised, because our brains are built to predict what will happen next based on past experience. Magicians understand these predictions and deliberately break them. They guide our attention to one hand while the other hand does the real work. In other words, a magic trick succeeds not because the magician's hands are faster than our eyes, but because the magician controls where we look."}, {"id": "EN-051", "s": "영어", "t": "수능", "g": 1, "d": "상", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "c": ["how fast we blink", "where we look", "what we remember from childhood", "the size of the stage", "the price of the ticket"], "a": 2, "e": "마술사가 한 손으로 주의를 끄는 동안 다른 손이 실제 작업을 한다고 했으므로, 마술의 성공은 손의 속도가 아니라 '우리가 어디를 보는지'를 마술사가 통제하기 때문이다.", "p": "When we watch a magic show, we know that the coin has not really disappeared. Still, we are surprised, because our brains are built to predict what will happen next based on past experience. Magicians understand these predictions and deliberately break them. They guide our attention to one hand while the other hand does the real work. In other words, a magic trick succeeds not because the magician's hands are faster than our eyes, but because the magician controls ________."}, {"id": "EN-052", "s": "영어", "t": "수능", "g": 1, "d": "상", "q": "다음 글의 내용을 한 문장으로 요약할 때, 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?\n<div class='box'>Magic tricks work by (A) ______ the expectations our brains make and directing our (B) ______ elsewhere.</div>", "c": ["following – attention", "breaking – memory", "following – memory", "breaking – attention", "creating – money"], "a": 4, "e": "마술사는 뇌가 하는 예측을 일부러 깨뜨리고(break), 우리의 주의(attention)를 다른 곳으로 돌린다는 내용이다.", "p": "When we watch a magic show, we know that the coin has not really disappeared. Still, we are surprised, because our brains are built to predict what will happen next based on past experience. Magicians understand these predictions and deliberately break them. They guide our attention to one hand while the other hand does the real work. In other words, a magic trick succeeds not because the magician's hands are faster than our eyes, but because the magician controls where we look."}, {"id": "EN-053", "s": "영어", "t": "수능", "g": 2, "d": "하", "q": "Riverside Park Night Run에 관한 다음 안내문의 내용과 일치하는 것은?", "c": ["모든 참가자는 티셔츠를 받는다.", "일요일에 열린다.", "코스는 한 가지뿐이다.", "12세 미만 어린이도 참가비를 낸다.", "행사 당일까지 등록할 수 있다."], "a": 1, "e": "'All participants receive a T-shirt and a light stick.'과 일치한다. 행사는 토요일이고, 코스는 5 km와 10 km 두 가지이며, 12세 미만은 무료, 등록 마감은 9월 7일이다.", "p": "<b>Riverside Park Night Run</b>\n• Date: Saturday, September 14\n• Start time: 7:30 p.m.\n• Courses: 5 km and 10 km\n• Entry fee: $15 for adults, free for children under 12\n• All participants receive a T-shirt and a light stick.\n• Registration closes on September 7.\n※ The event will be held even in light rain."}, {"id": "EN-054", "s": "영어", "t": "수능", "g": 2, "d": "하", "q": "Riverside Park Night Run에 관한 다음 안내문의 내용과 일치하지 <u>않는</u> 것은?", "c": ["오후 7시 30분에 출발한다.", "성인의 참가비는 15달러이다.", "참가자는 야광 막대를 받는다.", "9월 7일에 등록이 마감된다.", "비가 조금이라도 오면 취소된다."], "a": 5, "e": "'The event will be held even in light rain.'이라고 했으므로 비가 조금 와도 행사는 진행된다.", "p": "<b>Riverside Park Night Run</b>\n• Date: Saturday, September 14\n• Start time: 7:30 p.m.\n• Courses: 5 km and 10 km\n• Entry fee: $15 for adults, free for children under 12\n• All participants receive a T-shirt and a light stick.\n• Registration closes on September 7.\n※ The event will be held even in light rain."}, {"id": "EN-055", "s": "영어", "t": "수능", "g": 2, "d": "하", "q": "다음 글에 드러난 Daniel의 심경으로 가장 적절한 것은?", "c": ["bored and sleepy", "proud and confident", "relieved and thankful", "frightened and anxious", "excited and joyful"], "a": 4, "e": "해가 지고 손전등이 희미해지는 숲에서 길을 잃었고, 뒤에서 나뭇가지 부러지는 소리에 심장이 뛰는 상황이므로 두렵고 불안한 심경이다.", "p": "The forest was silent except for the crunch of leaves under Daniel's boots. The sun had set an hour ago, and his flashlight was growing dim. He had been sure the cabin was just beyond the stream, but now nothing looked familiar. A branch snapped somewhere behind him. He turned quickly, his heart pounding, and saw nothing but darkness."}, {"id": "EN-056", "s": "영어", "t": "수능", "g": 2, "d": "하", "q": "다음 글의 주제로 가장 적절한 것은?", "c": ["why novels are more popular than movies", "the difficulty of writing a good story", "the history of the modern novel", "how reading fiction improves our ability to understand others", "ways to read more books in less time"], "a": 4, "e": "소설을 읽으며 인물의 생각과 감정을 상상하는 것이 타인의 감정을 이해하는 능력을 길러 준다는 내용이다.", "p": "Reading novels may do more than entertain us. When we follow a character through a story, we imagine that person's thoughts and feelings as if they were our own. Psychologists suggest that this mental practice works like a simulator for social life: it lets us experience situations and relationships that we might never meet in reality. As a result, people who often read fiction tend to be better at understanding what others feel. A good story, then, is a training ground for empathy."}, {"id": "EN-057", "s": "영어", "t": "수능", "g": 2, "d": "중", "q": "다음 글의 제목으로 가장 적절한 것은?", "c": ["Novels: A Gym for Your Empathy", "Why Fiction Is Less Useful Than Facts", "How to Become a Famous Novelist", "Simulators: The Future of Pilot Training", "Reading Fast, Forgetting Faster"], "a": 1, "e": "소설 읽기가 사회생활의 모의실험 장치처럼 작용해 공감 능력을 길러 준다는 내용이므로 '소설: 공감 능력을 위한 체육관'이 제목으로 알맞다.", "p": "Reading novels may do more than entertain us. When we follow a character through a story, we imagine that person's thoughts and feelings as if they were our own. Psychologists suggest that this mental practice works like a simulator for social life: it lets us experience situations and relationships that we might never meet in reality. As a result, people who often read fiction tend to be better at understanding what others feel. A good story, then, is a training ground for empathy."}, {"id": "EN-058", "s": "영어", "t": "수능", "g": 2, "d": "상", "q": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?", "c": ["①", "②", "③", "④", "⑤"], "a": 3, "e": "주어진 문장의 However는 '얼음이 녹을 것이라며 사람들이 비웃었다'는 내용 뒤에 와야 하고, ③ 뒤의 'Packed this way(이런 방식으로 포장하면)'는 톱밥으로 단열했다는 주어진 문장의 내용을 가리킨다.", "p": "<div class='box'>However, Tudor discovered that sawdust was an excellent insulator.</div>Before refrigerators existed, keeping food cold was a serious challenge. ( ① ) In the early nineteenth century, a Boston businessman named Frederic Tudor began cutting ice from frozen ponds in winter and shipping it to warm regions. ( ② ) Many people laughed at the idea, expecting the ice to melt long before it arrived. ( ③ ) Packed this way, large blocks could survive voyages of several months. ( ④ ) The ice trade soon grew into a major industry, supplying cities around the world. ( ⑤ ) It declined only when electric refrigeration became widely available in the twentieth century."}, {"id": "EN-059", "s": "영어", "t": "수능", "g": 2, "d": "상", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "c": ["Who is responsible for the loss?", "Why did I buy the ticket?", "How can I get my money back?", "When did the project begin?", "What will I gain or lose from now on?"], "a": 5, "e": "매몰 비용은 이미 써서 되찾을 수 없으므로 미래의 선택에 영향을 주어서는 안 된다는 내용이다. 따라서 합리적인 질문은 '얼마나 썼는가'가 아니라 '지금부터 무엇을 얻거나 잃는가'이다.", "p": "Economists use the term 'sunk cost' for money or time that has already been spent and cannot be recovered. Logically, such costs should not affect our future choices. Yet people often continue watching a boring movie simply because they paid for the ticket, or keep investing in a failing project because of what they have already put into it. The rational question is not 'How much have I spent?' but '________'"}, {"id": "EN-060", "s": "영어", "t": "수능", "g": 2, "d": "상", "q": "(A), (B), (C)의 각 네모 안에서 문맥에 맞는 낱말로 가장 적절한 것은?", "c": ["rich – survive – lower", "rich – survive – higher", "rich – avoid – lower", "poor – survive – lower", "poor – avoid – higher"], "a": 1, "e": "(A) but으로 '텅 빈 곳'이라는 통념과 반대되므로 rich, (B) 물을 저장해 비 없이도 '살아남는다'는 survive, (C) 밤에는 낮보다 기온이 '낮다'는 lower가 알맞다.", "p": "Deserts are often imagined as empty places, but many of them are surprisingly (A) [ rich / poor ] in life. Plants such as cacti store water in their thick stems, which allows them to (B) [ survive / avoid ] months without rain. Many desert animals are active only at night, when temperatures are much (C) [ higher / lower ] than during the day."}, {"id": "EN-061", "s": "영어", "t": "수능", "g": 3, "d": "하", "q": "다음 방송의 목적으로 가장 적절한 것은?", "c": ["동아리 신입 회원 모집을 안내하려고", "학교 웹사이트 개편을 홍보하려고", "통학 버스 이용 예절을 당부하려고", "내일 휴교 결정을 발표하려고", "폭설에 따른 방과 후 활동 취소와 버스 시간 변경을 알리려고"], "a": 5, "e": "폭설 예보로 방과 후 동아리 활동이 취소되고 통학 버스가 평소보다 일찍 출발한다는 것을 알리는 방송이다. 내일 일정은 아직 정해지지 않아 웹사이트를 확인하라고 했다.", "p": "Attention, students. This is your principal speaking. Due to the heavy snow expected this afternoon, all after-school club activities are cancelled today. School buses will leave at 3:30 p.m., thirty minutes earlier than usual. Please check the school website tonight for information about tomorrow's schedule. Thank you."}, {"id": "EN-062", "s": "영어", "t": "수능", "g": 3, "d": "하", "q": "다음 방송의 내용과 일치하는 것은?", "c": ["오전에 이미 많은 눈이 내렸다.", "방과 후 동아리 활동은 예정대로 진행된다.", "내일은 휴교한다.", "내일 일정은 문자 메시지로 안내한다.", "통학 버스는 평소보다 30분 일찍 출발한다."], "a": 5, "e": "'School buses will leave at 3:30 p.m., thirty minutes earlier than usual.'과 일치한다. 눈은 오후에 예상되고, 내일 일정은 학교 웹사이트에서 확인해야 한다.", "p": "Attention, students. This is your principal speaking. Due to the heavy snow expected this afternoon, all after-school club activities are cancelled today. School buses will leave at 3:30 p.m., thirty minutes earlier than usual. Please check the school website tonight for information about tomorrow's schedule. Thank you."}, {"id": "EN-063", "s": "영어", "t": "수능", "g": 3, "d": "하", "q": "다음 글에서 필자가 주장하는 바로 가장 적절한 것은?", "c": ["수업 시간에는 질문을 줄이고 집중해야 한다.", "수업 중 질문을 장려하고 두려워하지 말아야 한다.", "질문은 수업이 끝난 뒤에 따로 해야 한다.", "교사는 학생에게 더 많은 질문을 던져야 한다.", "이해가 부족한 학생은 예습을 해야 한다."], "a": 2, "e": "질문은 이해 부족의 표시가 아니라 적극적 학습이며 친구들에게도 도움이 되므로, 교사는 질문을 칭찬하고 학생은 손 들기를 두려워하지 말아야 한다고 주장한다.", "p": "Some people think that asking questions in class shows a lack of understanding. I believe the opposite is true. A student who asks a question is actively connecting new ideas with what he or she already knows. Moreover, one student's question often helps classmates who were confused but too shy to speak. Teachers should therefore praise questions, and students should never be afraid to raise their hands."}, {"id": "EN-064", "s": "영어", "t": "수능", "g": 3, "d": "중", "q": "다음 글의 주제로 가장 적절한 것은?", "c": ["why shared resources get overused and how to prevent it", "the best way to raise healthy cows", "the history of farming villages", "advantages of private land over public parks", "how farmers cooperate to sell their products"], "a": 1, "e": "모두에게 열린 자원은 각자가 자기 이익을 추구하다 고갈될 수 있으며(공유지의 비극), 이를 막으려면 공동의 규칙이 필요하다는 내용이다.", "p": "Imagine a pasture open to all the farmers of a village. Each farmer gains the full benefit of adding one more cow to his herd, while the cost of the extra grazing is shared by everyone. Acting on this logic, every farmer keeps adding cows. Befo
