"q": "다음 주장을 한 사상가의 자연관으로 가장 적절한 것은?\n<div class='box'>인간은 대지 공동체의 정복자가 아니라 그 공동체의 평범한 구성원이자 시민이다. 생명 공동체의 온전함, 안정성, 아름다움을 보전하는 경향이 있으면 옳고, 그렇지 않으면 그르다.</div>", "c": ["인간만이 도덕적 고려의 대상이다.", "자연은 인간의 필요를 충족하기 위한 도구이다.", "개별 동물의 고통만이 도덕적으로 중요하다.", "생태계 전체를 도덕적 고려의 대상으로 삼아야 한다.", "자연을 정복하는 것이 인간 진보의 핵심이다."], "a": 4, "e": "레오폴드의 '대지 윤리'로, 생태 중심주의 자연관이다. 도덕적 고려의 범위를 흙, 물, 동식물을 포함한 생태계 전체로 확대해야 한다고 본다. ①, ②, ⑤는 인간 중심주의, ③은 동물 중심주의에 가깝다.", "p": ""}, {"id": "SO-021", "s": "통합사회", "t": "단편", "g": 1, "d": "상", "q": "노동조합이 사용자와의 임금 협상이 결렬되자 법이 정한 절차에 따라 파업을 하였다. 이때 행사한 권리는?", "c": ["단결권", "단체 행동권", "단체 교섭권", "청원권", "재판 청구권"], "a": 2, "e": "노동 3권 가운데 근로 조건에 관한 주장을 관철하기 위해 파업 등 쟁의 행위를 할 수 있는 권리는 단체 행동권이다. 단결권은 노동조합을 만들고 가입할 권리, 단체 교섭권은 사용자와 근로 조건을 협상할 권리이다.", "p": ""}, {"id": "SO-022", "s": "통합사회", "t": "단편", "g": 1, "d": "상", "q": "이미 지출하여 다시 회수할 수 없으므로 합리적 선택을 할 때 고려하지 말아야 하는 비용은?", "c": ["기회비용", "매몰 비용", "명시적 비용", "암묵적 비용", "한계 비용"], "a": 2, "e": "매몰 비용은 이미 지출되어 어떤 선택을 하더라도 되돌릴 수 없는 비용이므로 합리적 선택에서는 고려하지 않아야 한다.", "p": ""}, {"id": "SO-023", "s": "통합사회", "t": "단편", "g": 1, "d": "상", "q": "자원 보유국이 자국의 자원에 대한 주권을 강화하고 이를 정치·경제적 수단으로 이용하려는 경향은?", "c": ["보호 무역주의", "신자유주의", "자원 민족주의", "지역주의", "자원의 유한성"], "a": 3, "e": "자원 민족주의는 자원 보유국이 자원을 국유화하거나 수출을 통제하여 영향력을 키우려는 움직임으로, 1970년대 석유 파동이 대표적인 사례이다.", "p": ""}, {"id": "SO-024", "s": "통합사회", "t": "단편", "g": 2, "d": "하", "q": "물가가 지속적으로 오르는 현상을 무엇이라 하는가?", "c": ["디플레이션", "인플레이션", "스태그네이션", "경기 침체", "환율 하락"], "a": 2, "e": "인플레이션은 물가가 지속적으로 상승하는 현상으로, 화폐의 구매력(가치)이 떨어진다. 반대로 물가가 지속적으로 하락하는 현상은 디플레이션이다.", "p": ""}, {"id": "SO-025", "s": "통합사회", "t": "단편", "g": 2, "d": "중", "q": "인공 열과 포장 면적의 증가 등으로 도심의 기온이 주변 지역보다 높게 나타나는 현상은?", "c": ["열대야 현상", "푄 현상", "엘니뇨 현상", "열섬 현상", "기온 역전 현상"], "a": 4, "e": "열섬 현상은 건물·자동차의 인공 열과 아스팔트·콘크리트 포장 때문에 도심의 기온이 주변보다 높아지는 현상이다. 녹지 확대와 바람길 조성이 대책으로 꼽힌다.", "p": ""}, {"id": "SO-026", "s": "통합사회", "t": "단편", "g": 2, "d": "상", "q": "국제 무역에서 '비교 우위'에 대한 설명으로 옳은 것은?", "c": ["다른 나라보다 더 적은 생산비로 생산할 수 있을 때만 성립한다.", "모든 상품에 절대 우위가 있는 나라는 무역으로 이익을 얻을 수 없다.", "다른 나라보다 더 적은 기회비용으로 생산할 수 있는 상품에 있다.", "두 나라가 같은 상품에 동시에 비교 우위를 가질 수 있다.", "비교 우위가 있는 상품은 수입하는 것이 유리하다."], "a": 3, "e": "비교 우위는 상대국보다 낮은 기회비용으로 생산할 수 있는 상품에 있다. 한 나라가 모든 상품에 절대 우위가 있더라도 각국이 비교 우위 상품에 특화하여 교환하면 서로 이익을 얻을 수 있다.", "p": ""}, {"id": "SO-027", "s": "통합사회", "t": "단편", "g": 2, "d": "상", "q": "우리나라 헌법 재판소의 권한이 <u>아닌</u> 것은?", "c": ["명령·규칙에 대한 최종 심사", "위헌 법률 심판", "헌법 소원 심판", "탄핵 심판", "정당 해산 심판"], "a": 1, "e": "헌법 재판소는 위헌 법률 심판, 헌법 소원 심판, 탄핵 심판, 정당 해산 심판, 권한 쟁의 심판을 담당한다. 명령·규칙이 헌법이나 법률에 위반되는지에 대한 최종 심사는 대법원의 권한이다.", "p": ""}, {"id": "SO-028", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "문화는 태어날 때부터 가지고 있는 것이 아니라 사회생활을 하면서 후천적으로 배워서 익힌다는 문화의 속성은?", "c": ["학습성", "공유성", "축적성", "변동성", "전체성"], "a": 1, "e": "문화의 학습성에 대한 설명이다. 공유성은 구성원들이 문화를 함께 누려 서로의 행동을 예측할 수 있게 하는 속성이다.", "p": ""}, {"id": "SO-029", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "개발 도상국의 생산자에게 정당한 대가를 지불하여 그들의 경제적 자립을 돕는 무역 방식은?", "c": ["공정 무역", "보호 무역", "중계 무역", "자유 무역", "가공 무역"], "a": 1, "e": "공정 무역은 생산자에게 공정한 가격을 지불하고 노동 환경과 환경 보전을 고려하는 윤리적 소비의 한 방식이다.", "p": ""}, {"id": "SO-030", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "'달걀을 한 바구니에 담지 말라'는 말과 가장 관련 깊은 자산 관리의 원칙은?", "c": ["분산 투자", "집중 투자", "단기 투자", "원금 보장", "신용 관리"], "a": 1, "e": "여러 금융 자산에 나누어 투자하여 위험을 줄이는 분산 투자(포트폴리오)의 원칙을 나타내는 말이다.", "p": ""}, {"id": "SO-031", "s": "통합사회", "t": "단편", "g": 3, "d": "상", "q": "1688년 영국 명예혁명의 결과 승인되어 의회 중심의 입헌 군주제 확립에 기여한 문서는?", "c": ["대헌장", "독립 선언", "권리 장전", "인권 선언", "권리 청원"], "a": 3, "e": "명예혁명의 결과 1689년 권리 장전이 승인되어 의회의 동의 없는 과세와 법 집행이 금지되었다. 대헌장은 1215년, 권리 청원은 1628년의 문서이다.", "p": ""}, {"id": "SO-032", "s": "통합사회", "t": "단편", "g": 3, "d": "상", "q": "다음 중 국제 비정부 기구(NGO)가 <u>아닌</u> 것은?", "c": ["그린피스", "국경 없는 의사회", "국제 앰네스티", "세계 무역 기구(WTO)", "세이브 더 칠드런"], "a": 4, "e": "세계 무역 기구(WTO)는 각국 정부를 회원으로 하는 정부 간 국제기구이다. 나머지는 개인이나 민간단체가 중심이 되어 환경·보건·인권 문제 해결에 힘쓰는 국제 비정부 기구이다.", "p": ""}, {"id": "SO-033", "s": "통합사회", "t": "수능", "g": 1, "d": "하", "q": "다음 자료에 나타난 가옥이 주로 분포하는 지역의 기후로 옳은 것은?\n<div class='box'>이 지역의 전통 가옥은 지면에서 바닥을 띄워 지은 고상 가옥이다. 땅에서 올라오는 열기와 습기를 피하고 해충의 침입을 막기 위해서이다. 지붕은 경사가 급하여 빗물이 잘 흘러내린다.</div>", "c": ["건조 기후", "한대 기후", "열대 기후", "지중해성 기후", "냉대 기후"], "a": 3, "e": "연중 덥고 비가 많이 내리는 열대 기후 지역에서는 열기와 습기, 해충을 피하기 위해 고상 가옥을 짓는다. 건조 기후 지역에서는 벽이 두껍고 창문이 작은 흙벽돌집이 나타난다.", "p": ""}, {"id": "SO-034", "s": "통합사회", "t": "수능", "g": 1, "d": "하", "q": "다음 사례에 대한 설명으로 옳은 것은?\n<div class='box'>고등학생 갑(17세)은 방학 동안 편의점에서 아르바이트를 하기로 하였다. 사장은 \"청소년이니까 최저 임금보다 조금 적게 줄게. 계약서는 따로 안 써도 되지?\"라고 말하였다.</div>", "c": ["청소년은 근로 계약서를 쓰지 않아도 된다.", "청소년의 임금은 부모가 대신 받아야 한다.", "사장의 제안은 법적으로 문제가 없다.", "청소년은 어떤 경우에도 일을 할 수 없다.", "청소년 근로자에게도 최저 임금이 적용된다."], "a": 5, "e": "청소년도 성인과 똑같이 최저 임금을 적용받으며, 근로 조건을 명시한 근로 계약서를 작성하고 임금은 본인이 직접 받아야 한다.", "p": ""}, {"id": "SO-035", "s": "통합사회", "t": "수능", "g": 1, "d": "중", "q": "다음 자료의 현상으로 도시에 나타난 문제로 적절하지 <u>않은</u> 것은?\n<div class='box'>산업화가 빠르게 진행되면서 농촌 인구가 일자리를 찾아 도시로 대거 이동하였다. 그 결과 짧은 기간에 도시 인구가 급격히 증가하였다.</div>", "c": ["노동력 부족", "주택 부족", "교통 혼잡", "환경 오염", "기반 시설 부족"], "a": 1, "e": "이촌 향도로 도시에 인구가 집중되면 주택·기반 시설 부족, 교통 혼잡, 환경 오염 등이 나타난다. 노동력 부족과 고령화는 인구가 빠져나간 농촌의 문제이다.", "p": ""}, {"id": "SO-036", "s": "통합사회", "t": "수능", "g": 1, "d": "상", "q": "다음 표에 대한 분석으로 옳은 것은? (단, 두 나라는 노동만을 사용하여 X재와 Y재만 생산한다.)\n<div class='box'>노동 1단위로 생산할 수 있는 양<br>• 갑국: X재 10개 또는 Y재 5개<br>• 을국: X재 4개 또는 Y재 4개</div>", "c": ["을국은 X재 생산에 절대 우위가 있다.", "을국은 Y재 생산에 비교 우위가 있다.", "갑국의 X재 1개 생산의 기회비용은 Y재 2개이다.", "갑국은 두 재화 모두에 비교 우위가 있다.", "두 나라는 무역을 통해 이익을 얻을 수 없다."], "a": 2, "e": "X재 1개의 기회비용은 갑국이 Y재 1/2개, 을국이 Y재 1개이므로 갑국이 X재에 비교 우위가 있다. Y재 1개의 기회비용은 갑국이 X재 2개, 을국이 X재 1개이므로 을국이 Y재에 비교 우위가 있다. 갑국은 두 재화 모두 절대 우위에 있지만 비교 우위는 X재에만 있다.", "p": ""}, {"id": "SO-037", "s": "통합사회", "t": "수능", "g": 1, "d": "상", "q": "다음 갑, 을의 주장에 대한 설명으로 옳은 것은?\n<div class='box'>갑: 오랫동안 차별받아 온 집단에게는 채용이나 입학에서 일정한 혜택을 주어야 합니다. 출발선이 다른데 똑같이 대우하는 것은 진정한 평등이 아닙니다.<br>을: 특정 집단에 혜택을 주면 그 때문에 기회를 잃는 사람이 생깁니다. 이는 또 다른 차별입니다.</div>", "c": ["갑은 모든 사람을 똑같이 대우하는 형식적 평등을 강조한다.", "갑은 실질적 기회의 평등을 강조한다.", "을은 사회적 약자 우대 정책의 확대를 주장한다.", "을은 과거의 차별에 대한 보상이 필요하다고 본다.", "갑과 을은 모두 우대 정책이 역차별을 낳는다고 본다."], "a": 2, "e": "갑은 적극적 우대 조치에 찬성하며 실질적 평등을 강조한다. 을은 그 정책이 역차별을 낳을 수 있다고 본다.", "p": ""}, {"id": "SO-038", "s": "통합사회", "t": "수능", "g": 2, "d": "하", "q": "다른 조건이 일정할 때, 다음 상황이 X재 시장에 미칠 영향으로 옳은 것은? (단, X재는 소득이 늘면 수요가 증가하는 정상재이다.)\n<div class='box'>경기가 좋아져 소비자들의 소득이 전반적으로 증가하였다.</div>", "c": ["수요가 감소하여 가격이 내리고 거래량이 줄어든다.", "공급이 증가하여 가격이 내리고 거래량이 늘어난다.", "공급이 감소하여 가격이 오르고 거래량이 줄어든다.", "가격과 거래량 모두 변하지 않는다.", "수요가 증가하여 가격이 오르고 거래량이 늘어난다."], "a": 5, "e": "정상재는 소득이 증가하면 수요가 증가(수요 곡선 오른쪽 이동)한다. 그 결과 균형 가격이 오르고 균형 거래량이 늘어난다.", "p": ""}, {"id": "SO-039", "s": "통합사회", "t": "수능", "g": 2, "d": "하", "q": "지구 온난화로 나타나는 현상으로 적절하지 <u>않은</u> 것은?", "c": ["해수면이 상승한다.", "고산 지대의 만년설이 줄어든다.", "해발 고도가 낮은 섬나라가 침수 위험에 놓인다.", "식물의 개화 시기가 빨라진다.", "극지방의 빙하 면적이 넓어진다."], "a": 5, "e": "지구 온난화로 기온이 오르면 극지방과 고산 지대의 빙하가 녹아 면적이 줄어들고, 그 결과 해수면이 상승한다.", "p": ""}, {"id": "SO-040", "s": "통합사회", "t": "수능", "g": 2, "d": "하", "q": "다음 자료에서 설명하는 다문화 사회의 이론은?\n<div class='box'>여러 채소와 과일이 각자의 맛과 모양을 유지하면서 한 그릇 안에서 조화를 이루듯이, 다양한 문화가 각각의 고유성을 지키면서 함께 어우러져야 한다고 본다.</div>", "c": ["샐러드 볼 이론", "용광로 이론", "문화 사대주의", "자문화 중심주의", "문화 동화 이론"], "a": 1, "e": "샐러드 볼 이론은 각 문화의 고유성을 인정하고 공존을 추구한다. 용광로 이론은 여러 문화를 하나의 주류 문화로 녹여 통합하려는 관점이다.", "p": ""}, {"id": "SO-041", "s": "통합사회", "t": "수능", "g": 2, "d": "중", "q": "다음 사례에 대한 설명으로 옳은 것은?\n<div class='box'>갑은 여윳돈 전부를 은행 정기 예금에 넣었고, 을은 여윳돈 전부로 한 회사의 주식을 샀다.</div>", "c": ["갑은 을보다 수익성을 중시하였다.", "을의 자산은 원금 손실의 위험이 없다.", "을은 분산 투자의 원칙을 잘 지켰다.", "갑은 을보다 안전성을 중시하였다.", "갑의 자산은 을의 자산보다 기대 수익이 높다."], "a": 4, "e": "예금은 안전성이 높고 수익성이 낮으며, 주식은 수익성이 높을 수 있지만 원금 손실 위험이 있어 안전성이 낮다. 을은 한 회사 주식에 모두 투자했으므로 분산 투자를 하지 않았다.", "p": ""}, {"id": "SO-042", "s": "통합사회", "t": "수능", "g": 2, "d": "중", "q": "다음 사례에 적용된 분배 정의의 실질적 기준은?\n<div class='box'>A 회사는 한 해 동안 판매 실적이 가장 높은 직원에게 가장 많은 성과급을 지급한다.</div>", "c": ["필요", "능력", "절대적 평등", "업적", "노동 시간"], "a": 4, "e": "성과(실적)에 따라 분배하는 것은 업적에 따른 분배이다. 생산성을 높이는 동기를 주지만, 사회적 약자에 대한 배려가 부족해질 수 있다는 한계가 있다.", "p": ""}, {"id": "SO-043", "s": "통합사회", "t": "수능", "g": 2, "d": "상", "q": "원/달러 환율이 1달러 = 1,000원에서 1달러 = 1,200원으로 상승했을 때 나타날 수 있는 현상으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은? (단, 다른 조건은 일정하다.)\n<div class='box'>ㄱ. 우리나라 수출품의 달러 표시 가격이 내려가 수출에 유리해진다.<br>ㄴ. 미국으로 여행을 가려는 우리나라 사람의 경비 부담이 커진다.<br>ㄷ. 달러로 빚을 진 우리나라 기업의 상환 부담이 줄어든다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "환율이 오르면(원화 가치 하락) 수출품의 달러 표시 가격이 내려가 수출이 유리해지고(ㄱ), 같은 달러를 사는 데 더 많은 원화가 필요해 해외여행 경비 부담이 커진다(ㄴ). 달러 빚을 갚는 데 필요한 원화도 늘어나므로 상환 부담은 커진다(ㄷ 틀림).", "p": ""}, {"id": "SO-044", "s": "통합사회", "t": "수능", "g": 2, "d": "상", "q": "다음 자료에 대한 분석으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>갑국의 연령별 인구 구성: 0~14세 20%, 15~64세 60%, 65세 이상 20%<br><br>ㄱ. 갑국은 초고령 사회에 해당한다.<br>ㄴ. 노령화 지수는 100이다.<br>ㄷ. 총부양비는 50보다 크다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 5, "e": "65세 이상 인구 비율이 20% 이상이므로 초고령 사회이다(ㄱ). 노령화 지수 = (노년 인구 ÷ 유소년 인구) × 100 = 20/20 × 100 = 100(ㄴ). 총부양비 = {(유소년 + 노년 인구) ÷ 생산 연령 인구} × 100 = 40/60 × 100 ≒ 66.7로 50보다 크다(ㄷ).", "p": ""}, {"id": "SO-045", "s": "통합사회", "t": "수능", "g": 3, "d": "하", "q": "다음 헌법 조항에 대한 설명으로 가장 적절한 것은?\n<div class='box'>모든 국민은 인간으로서의 존엄과 가치를 가지며, 행복을 추구할 권리를 가진다. 국가는 개인이 가지는 불가침의 기본적 인권을 확인하고 이를 보장할 의무를 진다.</div>", "c": ["국민의 의무를 구체적으로 나열하고 있다.", "기본권 보장의 근본이 되는 이념을 밝히고 있다.", "국가 기관의 구성 방법을 규정하고 있다.", "기본권을 제한할 수 있는 요건을 정하고 있다.", "선거의 원칙을 밝히고 있다."], "a": 2, "e": "헌법 제10조로, 인간의 존엄과 가치 및 행복 추구권은 모든 기본권의 바탕이 되는 근본 이념이다. 기본권 제한의 요건은 제37조 제2항에 규정되어 있다.", "p": ""}, {"id": "SO-046", "s": "통합사회", "t": "수능", "g": 3, "d": "하", "q": "다음 자료에서 설명하는 제도는?\n<div class='box'>'보성 녹차', '의성 마늘'처럼 상품의 품질이나 명성이 특정 지역의 지리적 특성에서 비롯된 경우, 그 지역에서 생산된 상품임을 인증하고 표시할 수 있게 하는 제도이다.</div>", "c": ["지역 브랜드", "장소 마케팅", "공정 무역 인증", "지리적 표시제", "지역 축제"], "a": 4, "e": "지리적 표시제는 특정 지역의 지리적 특성이 반영된 우수 상품에 지역명을 표시할 수 있도록 인증하는 제도이다. 우리나라에서는 보성 녹차가 제1호로 등록되었다.", "p": ""}, {"id": "SO-047", "s": "통합사회", "t": "수능", "g": 3, "d": "하", "q": "교통·통신의 발달로 전자 상거래가 활성화되면서 나타난 변화로 적절하지 <u>않은</u> 것은?", "c": ["소비자가 매장을 직접 방문해야만 상품을 살 수 있게 되었다.", "택배 산업이 성장하였다.", "소비 활동의 시간적·공간적 제약이 줄어들었다.", "상품의 유통 단계가 줄어들었다.", "해외 상품을 직접 구매하는 일이 쉬워졌다."], "a": 1, "e": "전자 상거래는 매장을 방문하지 않고도 언제 어디서나 상품을 구매할 수 있게 하여 소비의 시·공간적 제약을 줄였다.", "p": ""}, {"id": "SO-048", "s": "통합사회", "t": "수능", "g": 3, "d": "하", "q": "다음 사례에 공통으로 나타난 소비 방식은?\n<div class='box'>• 갑은 조금 비싸더라도 공정 무역 인증을 받은 초콜릿을 산다.<br>• 을은 동물 실험을 하지 않는 회사의 화장품을 골라 쓴다.</div>", "c": ["윤리적 소비", "과시 소비", "충동 소비", "모방 소비", "과소비"], "a": 1, "e": "윤리적 소비는 가격과 품질뿐 아니라 인권, 노동, 환경, 동물 복지 등 상품이 생산·유통되는 과정의 윤리적 가치를 고려하는 소비이다.", "p": ""}, {"id": "SO-049", "s": "통합사회", "t": "수능", "g": 3, "d": "중", "q": "시민 불복종이 정당화되기 위한 조건으로 적절하지 <u>않은</u> 것은?", "c": ["공동체 전체의 정의를 실현하려는 목적이어야 한다.", "비폭력적인 방법으로 이루어져야 한다.", "합법적인 수단을 모두 시도한 뒤 최후의 수단으로 해야 한다.", "위법 행위에 따른 처벌을 감수해야 한다.", "개인의 이익을 위해 은밀하게 이루어져야 한다."], "a": 5, "e": "시민 불복종은 공익성(목적의 정당성), 공개성, 비폭력성, 최후 수단성, 처벌 감수를 조건으로 한다. 사익을 위해 은밀히 법을 어기는 것은 시민 불복종이 아니다.", "p": ""}, {"id": "SO-050", "s": "통합사회", "t": "수능", "g": 3, "d": "중", "q": "다음 갑의 관점에 대한 설명으로 옳은 것은?\n<div class='box'>갑: 국제 사회에는 각국을 강제할 수 있는 중앙 정부가 없다. 따라서 각국은 자기 나라의 이익을 가장 먼저 추구하며, 국가의 안전은 스스로의 힘을 길러야만 지킬 수 있다.</div>", "c": ["국제 관계를 힘의 논리로 설명하는 현실주의 관점이다.", "국제법과 국제기구를 통한 협력을 가장 중시한다.", "국가는 도덕과 규범에 따라 행동한다고 본다.", "집단 안보 체제로 평화를 보장할 수 있다고 본다.", "인간의 이성과 선한 본성을 신뢰한다."], "a": 1, "e": "갑은 국제 사회를 무정부 상태로 보고 국가가 힘과 국익을 추구한다고 보는 현실주의 관점이다. 나머지는 국제법·국제기구·집단 안보를 통한 협력을 강조하는 자유주의(이상주의) 관점에 가깝다.", "p": ""}, {"id": "SO-051", "s": "통합사회", "t": "수능", "g": 3, "d": "중", "q": "다음 자료의 문제를 해결하기 위한 정부의 대책과 그 효과로 가장 적절한 것은?\n<div class='box'>A 공장은 제품을 만들면서 대기 오염 물질을 배출하지만, 주변 주민이 입는 피해에 대해서는 아무런 비용을 치르지 않는다. 그 결과 이 제품은 사회적으로 바람직한 수준보다 많이 생산되고 있다.</div>", "c": ["오염 물질 배출에 세금을 부과하여 생산량을 줄이도록 유도한다.", "A 공장에 보조금을 지급하여 생산량을 늘리도록 유도한다.", "제품의 최고 가격을 정해 가격을 낮춘다.", "주변 주민에게 세금을 부과한다.", "시장에 맡겨 두면 저절로 해결되므로 개입하지 않는다."], "a": 1, "e": "부정적 외부 효과(외부 불경제)가 있으면 사회적으로 바람직한 수준보다 과다 생산된다. 정부는 세금이나 부담금을 부과하여 생산자가 외부 비용을 고려하게 함으로써 생산량을 줄이도록 유도할 수 있다.", "p": ""}, {"id": "SO-052", "s": "통합사회", "t": "수능", "g": 3, "d": "상", "q": "&lt;보기&gt;의 정책에 대한 사상가 갑, 을의 평가로 가장 적절한 것은?\n<div class='box'>갑: 사회적·경제적 불평등은 사회의 가장 불리한 처지에 있는 사람들에게 최대의 이익이 될 때에만 정당하다.<br>을: 정당하게 취득한 소유물에 대해 개인은 절대적 권리를 가지며, 국가는 이를 침해해서는 안 된다.<br><br>&lt;보기&gt; 정부가 고소득층의 세금을 올려 마련한 재원으로 최저 소득층의 생활비를 지원한다.</div>", "c": ["갑은 찬성하고, 을은 개인의 소유권을 침해한다는 이유로 반대할 것이다.", "갑은 반대하고, 을은 찬성할 것이다.", "갑과 을 모두 찬성할 것이다.", "갑과 을 모두 반대할 것이다.", "갑은 사회 전체의 이익 총량이 늘어난다는 이유로만 찬성할 것이다."], "a": 1, "e": "갑은 롤스로, 최소 수혜자에게 이익이 되는 재분배 정책은 차등의 원칙에 부합한다고 볼 것이다. 을은 노직으로, 재분배를 위한 과세는 개인의 소유권을 침해한다고 보아 반대할 것이다. 이익 총량을 기준으로 삼는 것은 공리주의의 관점이다.", "p": ""}, {"id": "SC-001", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "빅뱅 이후 초기 우주에서 만들어져 현재 우주에서 질량 비로 가장 많은 원소는?", "c": ["헬륨", "탄소", "산소", "철", "수소"], "a": 5, "e": "빅뱅 직후 우주에서는 주로 수소와 헬륨이 만들어졌으며, 현재 우주를 이루는 원소의 질량 비는 수소 약 74%, 헬륨 약 24%이다.", "p": ""}, {"id": "SC-002", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "주기율표에서 같은 족에 속한 원소들의 화학적 성질이 비슷한 까닭은?", "c": ["원자량이 같기 때문", "전자 껍질 수가 같기 때문", "중성자 수가 같기 때문", "양성자 수가 같기 때문", "원자가 전자 수가 같기 때문"], "a": 5, "e": "화학적 성질은 주로 원자가 전자에 의해 결정된다. 같은 족 원소는 원자가 전자 수가 같아 화학적 성질이 비슷하다. 같은 주기 원소는 전자 껍질 수가 같다.", "p": ""}, {"id": "SC-003", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "다음 중 이온 결합으로 이루어진 물질은?", "c": ["물(H₂O)", "이산화 탄소(CO₂)", "메테인(CH₄)", "산소(O₂)", "염화 나트륨(NaCl)"], "a": 5, "e": "염화 나트륨은 금속 원소인 나트륨이 전자를 잃어 Na⁺, 비금속 원소인 염소가 전자를 얻어 Cl⁻이 된 뒤 정전기적 인력으로 결합한 이온 결합 물질이다. 나머지는 비금속 원소끼리 전자쌍을 공유한 공유 결합 물질이다.", "p": ""}, {"id": "SC-004", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "지구 시스템에서 오존층이 속한 권역은?", "c": ["지권", "수권", "생물권", "기권", "외권"], "a": 4, "e": "오존층은 대기권의 성층권(약 20~30 km 높이)에 있으므로 기권에 속한다. 오존층은 태양의 자외선을 흡수하여 지표의 생명체를 보호한다.", "p": ""}, {"id": "SC-005", "s": "통합과학", "t": "단편", "g": 1, "d": "중", "q": "히말라야산맥이 형성된 판 경계의 종류는?", "c": ["대륙판과 대륙판이 충돌하는 수렴형 경계", "해양판과 해양판이 멀어지는 발산형 경계", "해양판이 대륙판 아래로 섭입하는 수렴형 경계", "두 판이 어긋나는 보존형 경계", "대륙판이 갈라지는 발산형 경계"], "a": 1, "e": "히말라야산맥은 인도·오스트레일리아판과 유라시아판이 충돌하는 대륙판-대륙판 수렴형 경계에서 형성된 습곡 산맥이다.", "p": ""}, {"id": "SC-006", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "질량이 2 kg인 물체에 알짜힘이 작용하여 3 m/s²의 가속도로 운동할 때, 물체에 작용한 알짜힘의 크기는?", "c": ["6 N", "1.5 N", "3 N", "5 N", "9 N"], "a": 1, "e": "뉴턴 운동 제2법칙 F = ma에 따라 F = 2 kg × 3 m/s² = 6 N이다.", "p": ""}, {"id": "SC-007", "s": "통합과학", "t": "단편", "g": 1, "d": "중", "q": "자동차의 에어백이 충돌 시 탑승자를 보호하는 원리로 옳은 것은?", "c": ["충돌 시간을 늘려 탑승자가 받는 평균 힘을 줄인다.", "충격량을 증가시킨다.", "운동량 변화량을 크게 한다.", "탑승자의 질량을 줄인다.", "충돌 직전의 속력을 증가시킨다."], "a": 1, "e": "충격량(= 평균 힘 × 충돌 시간)은 운동량의 변화량과 같다. 같은 운동량 변화에서 충돌 시간을 길게 하면 탑승자가 받는 평균 힘이 줄어든다.", "p": ""}, {"id": "SC-008", "s": "통합과학", "t": "단편", "g": 1, "d": "중", "q": "세포막의 주요 구성 성분은?", "c": ["셀룰로스와 단백질", "DNA와 RNA", "인지질과 단백질", "녹말과 지방", "키틴과 단백질"], "a": 3, "e": "세포막은 인지질 2중층에 단백질이 파묻히거나 걸쳐 있는 구조로 되어 있다. 셀룰로스는 식물 세포벽의 주성분이다.", "p": ""}, {"id": "SC-009", "s": "통합과학", "t": "단편", "g": 1, "d": "중", "q": "효소가 생명체 내 화학 반응의 속도를 빠르게 하는 원리로 옳은 것은?", "c": ["반응열을 증가시킨다.", "반응물의 양을 늘린다.", "생성물의 에너지를 높인다.", "반응 후 효소가 소모되어 에너지를 공급한다.", "활성화 에너지를 낮춘다."], "a": 5, "e": "효소는 생체 촉매로 반응의 활성화 에너지를 낮추어 반응 속도를 빠르게 한다. 효소는 반응 전후에 변하지 않으므로 재사용된다.", "p": ""}, {"id": "SC-010", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "DNA의 유전 정보가 RNA로 옮겨지는 과정을 무엇이라 하는가?", "c": ["전사", "복제", "번역", "분열", "돌연변이"], "a": 1, "e": "DNA의 유전 정보를 RNA로 옮기는 과정은 전사, RNA의 정보에 따라 단백질을 합성하는 과정은 번역이다.", "p": ""}, {"id": "SC-011", "s": "통합과학", "t": "단편", "g": 1, "d": "중", "q": "철광석에서 철을 얻는 반응 Fe₂O₃ + 3CO → 2Fe + 3CO₂에 대한 설명으로 옳은 것은?", "c": ["Fe₂O₃는 산화된다.", "CO는 환원된다.", "산화와 환원은 따로 일어난다.", "CO₂는 반응물이다.", "Fe₂O₃는 산소를 잃고 환원된다."], "a": 5, "e": "Fe₂O₃는 산소를 잃고 Fe로 환원되고, CO는 산소를 얻어 CO₂로 산화된다. 산화와 환원은 항상 동시에 일어난다.", "p": ""}, {"id": "SC-012", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "산과 염기가 반응하여 물이 생성되는 중화 반응의 알짜 이온 반응식으로 옳은 것은?", "c": ["Na⁺ + Cl⁻ → NaCl", "H⁺ + OH⁻ → H₂O", "2H⁺ + O²⁻ → H₂O", "H₂ + O₂ → H₂O₂", "Na + H₂O → NaOH"], "a": 2, "e": "중화 반응은 산의 수소 이온(H⁺)과 염기의 수산화 이온(OH⁻)이 1 : 1로 반응하여 물을 생성하는 반응이다.", "p": ""}, {"id": "SC-013", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "발전기에서 전기 에너지가 만들어지는 원리는?", "c": ["정전기 유도", "빛의 굴절", "전자기 유도", "열의 대류", "핵분열"], "a": 3, "e": "발전기는 코일 속에서 자석을 회전시켜 코일을 지나는 자기 선속을 변화시킬 때 유도 전류가 흐르는 전자기 유도 현상을 이용한다.", "p": ""}, {"id": "SC-014", "s": "통합과학", "t": "단편", "g": 1, "d": "중", "q": "태양이 에너지를 만들어 내는 주된 과정은?", "c": ["수소의 핵융합", "우라늄의 핵분열", "탄소의 연소", "중력에 의한 수축만으로 발생", "방사성 붕괴"], "a": 1, "e": "태양 중심부에서는 수소 원자핵 4개가 융합하여 헬륨 원자핵 1개를 만드는 수소 핵융합 반응이 일어나며, 이때 줄어든 질량이 에너지로 바뀐다.", "p": ""}, {"id": "SC-015", "s": "통합과학", "t": "단편", "g": 1, "d": "하", "q": "생태계에서 광합성을 통해 빛에너지를 화학 에너지로 전환하는 구성 요소는?", "c": ["1차 소비자", "생산자", "2차 소비자", "분해자", "비생물적 요인"], "a": 2, "e": "식물과 같은 생산자는 광합성으로 빛에너지를 유기물의 화학 에너지로 전환하며, 이 에너지가 먹이 사슬을 따라 소비자에게 전달된다.", "p": ""}, {"id": "SC-016", "s": "통합과학", "t": "수능", "g": 1, "d": "상", "q": "농도가 같은 묽은 염산(HCl) 20 mL에 수산화 나트륨(NaOH) 수용액 10 mL를 넣었다. 혼합 용액에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>ㄱ. 혼합 용액은 산성이다.<br>ㄴ. 혼합 용액 속 Na⁺의 수는 Cl⁻의 수보다 적다.<br>ㄷ. 반응 과정에서 물이 생성되었다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 5, "e": "같은 농도에서 HCl 20 mL의 H⁺ 수는 NaOH 10 mL의 OH⁻ 수의 2배이므로 H⁺가 남아 산성이다(ㄱ). 구경꾼 이온의 수는 Cl⁻(20 단위) > Na⁺(10 단위)이다(ㄴ). H⁺와 OH⁻가 반응하여 물이 생성되었다(ㄷ).", "p": ""}, {"id": "SC-017", "s": "통합과학", "t": "수능", "g": 1, "d": "중", "q": "질량이 1 kg이고 4 m/s의 속력으로 운동하던 물체가 벽에 부딪쳐 0.2초 만에 정지하였다. 이 충돌에서 물체가 받은 충격량의 크기와 평균 힘의 크기를 옳게 짝지은 것은?", "c": ["4 N·s, 0.8 N", "0.8 N·s, 4 N", "20 N·s, 4 N", "4 N·s, 20 N", "4 N·s, 2 N"], "a": 4, "e": "충격량 = 운동량의 변화량 = 1 kg × (4 − 0) m/s = 4 N·s. 평균 힘 = 충격량 ÷ 충돌 시간 = 4 ÷ 0.2 = 20 N.", "p": ""}, {"id": "SC-018", "s": "통합과학", "t": "수능", "g": 1, "d": "중", "q": "해령 부근의 해양 지각에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>ㄱ. 해령에서 멀어질수록 해양 지각의 나이가 적어진다.<br>ㄴ. 해령에서 멀어질수록 해저 퇴적물의 두께가 두꺼워진다.<br>ㄷ. 해령은 두 판이 서로 멀어지는 발산형 경계이다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 4, "e": "해령에서 새로운 해양 지각이 생성되어 양쪽으로 이동하므로 해령에서 멀어질수록 지각의 나이가 많아진다(ㄱ 틀림). 오래된 지각일수록 퇴적물이 쌓인 시간이 길어 두께가 두껍다(ㄴ). 해령은 판이 서로 멀어지는 발산형 경계이다(ㄷ).", "p": ""}, {"id": "SC-019", "s": "통합과학", "t": "수능", "g": 1, "d": "중", "q": "어떤 생태계에서 각 영양 단계의 에너지양이 생산자 1000, 1차 소비자 100, 2차 소비자 10(상댓값)이었다. 이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>ㄱ. 1차 소비자의 에너지 효율은 10%이다.<br>ㄴ. 상위 영양 단계로 갈수록 에너지양이 줄어든다.<br>ㄷ. 전달되지 않은 에너지는 모두 다음 단계에서 다시 사용된다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "에너지 효율 = (현 영양 단계의 에너지양 ÷ 전 영양 단계의 에너지양) × 100 = 100/1000 × 100 = 10%(ㄱ). 각 단계에서 호흡 등으로 에너지가 열로 방출되어 상위 단계로 갈수록 에너지양이 줄어든다(ㄴ). 열로 방출된 에너지는 생태계에서 재사용되지 않으므로 ㄷ은 틀리다.", "p": ""}, {"id": "SC-020", "s": "통합과학", "t": "수능", "g": 1, "d": "상", "q": "어떤 2중 가닥 DNA에서 구아닌(G)이 전체 염기의 20%를 차지할 때, 아데닌(A)이 차지하는 비율은?", "c": ["30%", "10%", "20%", "40%", "60%"], "a": 1, "e": "2중 가닥 DNA에서 A는 T와, G는 C와 상보적으로 결합하므로 G = C = 20%이다. 남은 60%를 A와 T가 똑같이 나누므로 A = 30%이다.", "p": ""}, {"id": "SC-021", "s": "통합과학", "t": "수능", "g": 1, "d": "중", "q": "코일에 검류계를 연결하고 막대자석을 코일 속으로 넣었다 빼는 실험을 하였다. 이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>ㄱ. 자석을 코일 속에 가만히 두어도 유도 전류가 계속 흐른다.<br>ㄴ. 자석을 넣을 때와 뺄 때 유도 전류의 방향은 반대이다.<br>ㄷ. 자석을 빠르게 움직일수록 유도 전류의 세기가 커진다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 4, "e": "자석이 정지해 있으면 자기 선속이 변하지 않아 유도 전류가 흐르지 않는다(ㄱ 틀림). 넣을 때와 뺄 때 자기 선속의 변화 방향이 반대이므로 전류 방향도 반대이다(ㄴ). 자기 선속이 빠르게 변할수록 유도 전류가 세다(ㄷ).", "p": ""}, {"id": "SC-022", "s": "통합과학", "t": "수능", "g": 1, "d": "중", "q": "원자 번호 11인 나트륨(Na)과 원자 번호 17인 염소(Cl)에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>ㄱ. Na의 원자가 전자 수는 1이다.<br>ㄴ. Cl은 전자 1개를 얻어 Cl⁻이 되면 비활성 기체(Ar)와 같은 전자 배치를 갖는다.<br>ㄷ. Na와 Cl은 같은 족에 속한다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "Na의 전자 배치는 2, 8, 1로 원자가 전자가 1개이다(ㄱ). Cl(2, 8, 7)은 전자 1개를 얻으면 2, 8, 8로 Ar과 같아진다(ㄴ). 두 원소는 모두 3주기 원소이지만 Na는 1족, Cl은 17족이므로 ㄷ은 틀리다.", "p": ""}, {"id": "SC-023", "s": "통합과학", "t": "수능", "g": 1, "d": "상", "q": "다음은 광합성과 세포 호흡의 반응을 나타낸 것이다. 이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>(가) 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ (빛에너지 흡수)<br>(나) C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O (에너지 방출)<br><br>ㄱ. (가)에서 CO₂는 환원된다.<br>ㄴ. (나)에서 포도당은 산화된다.<br>ㄷ. (가)와 (나)는 모두 산화 환원 반응이다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 5, "e": "광합성(가)에서 CO₂는 수소를 얻어 포도당이 되므로 환원되고(ㄱ), 세포 호흡(나)에서 포도당은 산소와 결합하여 CO₂가 되므로 산화된다(ㄴ). 두 반응 모두 산화와 환원이 동시에 일어나는 산화 환원 반응이다(ㄷ).", "p": ""}, {"id": "SC-024", "s": "통합과학", "t": "수능", "g": 1, "d": "하", "q": "온실 효과에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>ㄱ. 대기 중의 온실 기체는 지표가 방출하는 적외선 일부를 흡수하였다가 다시 방출한다.<br>ㄴ. 온실 효과가 전혀 없다면 지구의 평균 기온은 현재보다 높을 것이다.<br>ㄷ. 대기 중 이산화 탄소 농도가 증가하면 온실 효과가 강화된다.</div>", "c": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "온실 기체(이산화 탄소, 메테인, 수증기 등)는 지표가 방출하는 적외선을 흡수했다가 다시 방출하여 지표를 데운다(ㄱ). 온실 효과가 없다면 지구의 평균 기온은 현재(약 15 ℃)보다 훨씬 낮은 약 −18 ℃ 정도가 될 것이므로 ㄴ은 틀리다. 이산화 탄소 농도가 증가하면 온실 효과가 강화된다(ㄷ).", "p": ""}, {"id": "SC-025", "s": "통합과학", "t": "단편", "g": 1, "d": "상", "q": "질량이 태양보다 매우 큰 별의 중심부에서 핵융합 반응으로 만들어질 수 있는 가장 무거운 원소는?", "c": ["헬륨", "탄소", "산소", "우라늄", "철"], "a": 5, "e": "별 내부의 핵융합으로는 철까지만 만들어진다. 철보다 무거운 금, 우라늄 등의 원소는 초신성 폭발 과정 등에서 만들어진다.", "p": ""}, {"id": "SC-026", "s": "통합과학", "t": "단편", "g": 1, "d": "상", "q": "높이 5 m인 곳에서 가만히 놓은 물체가 지면에 도달하는 순간의 속력은? (단, 중력 가속도는 10 m/s²이고 공기 저항은 무시한다.)", "c": ["5 m/s", "15 m/s", "20 m/s", "50 m/s", "10 m/s"], "a": 5, "e": "역학적 에너지 보존에 의해 mgh = ½mv²이므로 v = √(2gh) = √(2 × 10 × 5) = 10 m/s이다.", "p": ""}, {"id": "SC-027", "s": "통합과학", "t": "단편", "g": 1, "d": "상", "q": "세포막을 경계로 물 분자가 용질의 농도가 낮은 쪽에서 높은 쪽으로 이동하는 현상은?", "c": ["확산", "삼투", "능동 수송", "증산 작용", "모세관 현상"], "a": 2, "e": "삼투는 물이 세포막과 같은 선택적 투과성 막을 통해 용질 농도가 낮은 쪽에서 높은 쪽으로 이동하는 현상이다. 짠 용액에 넣은 세포에서 물이 빠져나가는 것이 그 예이다.", "p": ""}, {"id": "SC-028", "s": "통합과학", "t": "단편", "g": 2, "d": "하", "q": "지구 대기에서 부피 비로 가장 많은 양을 차지하는 기체는?", "c": ["산소", "아르곤", "이산화 탄소", "질소", "수증기"], "a": 4, "e": "지구 대기는 질소 약 78%, 산소 약 21%, 아르곤 약 0.9%로 이루어져 있다.", "p": ""}, {"id": "SC-029", "s": "통합과학", "t": "단편", "g": 2, "d": "상", "q": "지각을 이루는 규산염 광물의 기본 단위인 규산염 사면체의 구성으로 옳은 것은?", "c": ["규소 4개와 산소 1개", "규소 1개와 산소 2개", "탄소 1개와 산소 4개", "규소 1개와 산소 4개", "규소 2개와 산소 3개"], "a": 4, "e": "규산염 사면체(SiO₄)는 규소 원자 1개를 중심으로 산소 원자 4개가 공유 결합한 정사면체 구조이다.", "p": ""}, {"id": "SC-030", "s": "통합과학", "t": "단편", "g": 2, "d": "상", "q": "탄소 원자가 육각형 벌집 모양으로 결합하여 한 층을 이루며, 강도와 전기 전도성이 뛰어나 휘어지는 디스플레이 등에 활용되는 신소재는?", "c": ["초전도체", "액정", "그래핀", "형상 기억 합금", "네오디뮴 자석"], "a": 3, "e": "그래핀은 흑연의 한 층을 떼어 낸 것과 같은 구조로, 얇고 투명하면서도 강도와 전기 전도성, 열전도성이 뛰어나다.", "p": ""}, {"id": "SC-031", "s": "통합과학", "t": "단편", "g": 3, "d": "하", "q": "다음 중 화석 연료가 <u>아닌</u> 것은?", "c": ["우라늄", "석탄", "석유", "천연가스", "셰일 가스"], "a": 1, "e": "화석 연료는 과거 생물의 유해가 땅속에 묻혀 만들어진 석탄, 석유, 천연가스(셰일 가스 포함) 등이다. 우라늄은 핵발전에 쓰이는 핵연료이다.", "p": ""}, {"id": "SC-032", "s": "통합과학", "t": "단편", "g": 3, "d": "중", "q": "1차 코일과 2차 코일의 감은 수의 비가 1 : 2인 변압기의 1차 코일에 110 V의 교류 전압을 걸었을 때, 2차 코일에 유도되는 전압은? (단, 에너지 손실은 무시한다.)", "c": ["55 V", "110 V", "165 V", "220 V", "440 V"], "a": 4, "e": "변압기에서 전압의 비는 코일의 감은 수의 비와 같다. V₁ : V₂ = N₁ : N₂ = 1 : 2이므로 V₂ = 220 V이다.", "p": ""}, {"id": "SC-033", "s": "통합과학", "t": "단편", "g": 3, "d": "상", "q": "지구 시스템의 에너지원 중 밀물과 썰물을 일으키는 에너지는?", "c": ["태양 에너지", "지구 내부 에너지", "조력 에너지", "화학 에너지", "지열 에너지"], "a": 3, "e": "조력 에너지는 달과 태양의 인력 때문에 생기며 밀물과 썰물을 일으킨다. 지구 시스템의 에너지원은 태양 에너지, 지구 내부 에너지, 조력 에너지의 세 가지이며, 이 가운데 태양 에너지가 가장 많다.", "p": ""}, {"id": "SC-034", "s": "통합과학", "t": "수능", "g": 1, "d": "하", "q": "다음 자료에서 설명하는 물질은?\n<div class='box'>• 약 20종류의 아미노산이 펩타이드 결합으로 길게 연결되어 만들어진다.<br>• 효소, 항체, 근육 등의 주성분으로 생명 활동에서 다양한 기능을 한다.</div>", "c": ["탄수화물", "지질", "핵산", "무기염류", "단백질"], "a": 5, "e": "단백질은 단위체인 아미노산이 펩타이드 결합으로 연결된 물질로, 아미노산의 종류와 배열 순서에 따라 입체 구조와 기능이 달라진다. 핵산(DNA, RNA)의 단위체는 뉴클레오타이드이다.", "p": ""}, {"id": "SC-035", "s": "통합과학", "t": "수능", "g": 1, "d": "하", "q": "안정된 생태계에서 1차 소비자의 수가 일시적으로 증가했을 때, 그 직후에 나타나는 변화로 옳은 것은?", "c": ["생산자의 수는 증가하고, 2차 소비자의 수는 감소한다.", "생산자와 2차 소비자의 수가 모두 감소한다.", "생산자와 2차 소비자의 수가 모두 증가한다.", "생산자의 수는 감소하고, 2차 소비자의 수는 증가한다.", "다른 영양 단계에는 아무런 변화가 없다."], "a": 4, "e": "1차 소비자가 늘면 먹이인 생산자는 줄고, 1차 소비자를 먹는 2차 소비자는 늘어난다. 이후 1차 소비자가 다시 줄어들면서 생태계는 평형을 회복한다.", "p": ""}, {"id": "SC-036", "s": "통합과학", "t": "수능", "g": 1, "d": "중", "q": "같은 높이에서 공 A는 가만히 놓고, 동시에 공 B는 수평 방향으로 던졌다. 이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은? (단, 공기 저항은 무시한다.)\n<div class='box'>ㄱ. A와 B는 동시에 지면에 도달한다.<br>ㄴ. B는 수평 방향으로 속력이 일정한 운동을 한다.<br>ㄷ. 운동하는 동안 B에 작용하는 중력의 크기는 일정하다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 5, "e": "수평으로 던진 물체는 연직 방향으로는 자유 낙하와 같은 운동을 하므로 A와 동시에 지면에 도달한다(ㄱ). 수평 방향으로는 힘이 작용하지 않아 등속 운동을 한다(ㄴ). 물체에 작용하는 중력의 크기는 운동하는 동안 일정하다(ㄷ).", "p": ""}, {"id": "SC-037", "s": "통합과학", "t": "수능", "g": 1, "d": "상", "q": "농도가 같은 묽은 염산(HCl)과 수산화 나트륨(NaOH) 수용액을 표와 같이 섞었다. 이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>혼합 용액 (가): HCl 10 mL + NaOH 30 mL<br>혼합 용액 (나): HCl 20 mL + NaOH 20 mL<br>혼합 용액 (다): HCl 30 mL + NaOH 10 mL<br><br>ㄱ. 혼합 후 최고 온도는 (나)가 가장 높다.<br>ㄴ. (가)는 산성이다.<br>ㄷ. (다)에 가장 많이 들어 있는 이온은 Cl⁻이다.</div>", "c": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "같은 농도이므로 (나)에서 완전히 중화되어 중화열이 가장 많이 발생한다(ㄱ). (가)는 OH⁻이 남아 염기성이다(ㄴ 틀림). (다)에서 이온 수의 비는 H⁺ 20, Cl⁻ 30, Na⁺ 10이므로 Cl⁻이 가장 많다(ㄷ).", "p": ""}, {"id": "SC-038", "s": "통합과학", "t": "수능", "g": 1, "d": "상", "q": "질량 2 kg인 물체를 지면으로부터 10 m 높이에서 가만히 놓았다. 이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은? (단, 중력 가속도는 10 m/s²이고, 지면을 위치 에너지의 기준으로 하며, 공기 저항은 무시한다.)\n<div class='box'>ㄱ. 처음 위치에서 물체의 중력 퍼텐셜 에너지는 200 J이다.<br>ㄴ. 높이 5 m인 지점에서 운동 에너지와 퍼텐셜 에너지는 같다.<br>ㄷ. 지면에 도달하는 순간의 속력은 20 m/s이다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "퍼텐셜 에너지 = mgh = 2 × 10 × 10 = 200 J(ㄱ). 높이 5 m에서 퍼텐셜 에너지는 100 J, 운동 에너지도 200 − 100 = 100 J로 같다(ㄴ). 지면에서 ½ × 2 × v² = 200에서 v = √200 ≒ 14.1 m/s이므로 ㄷ은 틀리다.", "p": ""}, {"id": "SC-039", "s": "통합과학", "t": "수능", "g": 2, "d": "하", "q": "금이나 우라늄처럼 철보다 무거운 원소가 주로 만들어지는 과정은?", "c": ["빅뱅 직후의 핵합성", "태양과 비슷한 질량의 별 중심부의 핵융합", "성운의 수축", "행성의 충돌", "초신성 폭발"], "a": 5, "e": "별 중심부의 핵융합으로는 철까지만 만들어지고, 철보다 무거운 원소는 초신성 폭발과 같은 격렬한 과정에서 만들어져 우주로 퍼져 나간다.", "p": ""}, {"id": "SC-040", "s": "통합과학", "t": "수능", "g": 2, "d": "하", "q": "식물 세포에서 광합성이 일어나는 세포 소기관과 세포 호흡이 주로 일어나는 세포 소기관을 순서대로 옳게 짝지은 것은?", "c": ["엽록체, 미토콘드리아", "미토콘드리아, 엽록체", "핵, 리보솜", "리보솜, 엽록체", "엽록체, 핵"], "a": 1, "e": "엽록체에서는 빛에너지를 이용해 포도당을 합성하는 광합성이, 미토콘드리아에서는 포도당을 분해해 에너지를 얻는 세포 호흡이 일어난다.", "p": ""}, {"id": "SC-041", "s": "통합과학", "t": "수능", "g": 2, "d": "하", "q": "태양광 발전에 대한 설명으로 옳은 것은?", "c": ["발전 과정에서 이산화 탄소가 많이 발생한다.", "날씨와 관계없이 발전량이 일정하다.", "터빈을 돌려 전기를 생산한다.", "우라늄의 핵분열 에너지를 이용한다.", "태양 전지를 이용해 빛에너지를 전기 에너지로 직접 전환한다."], "a": 5, "e": "태양광 발전은 태양 전지로 빛에너지를 전기 에너지로 직접 전환하므로 터빈이 필요 없고 발전 중 온실 기체를 배출하지 않는다. 다만 날씨와 시간에 따라 발전량이 달라진다.", "p": ""}, {"id": "SC-042", "s": "통합과학", "t": "수능", "g": 2, "d": "중", "q": "해양판이 대륙판 아래로 섭입하는 수렴형 경계에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>ㄱ. 새로운 해양 지각이 생성된다.<br>ㄴ. 화산 활동과 지진이 활발하다.<br>ㄷ. 해구가 발달한다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 4, "e": "새로운 해양 지각이 생성되는 곳은 발산형 경계인 해령이다(ㄱ 틀림). 섭입 과정에서 지진과 화산 활동이 활발하고(ㄴ), 밀도가 큰 해양판이 대륙판 아래로 들어가는 곳에는 해구가 만들어진다(ㄷ).", "p": ""}, {"id": "SC-043", "s": "통합과학", "t": "수능", "g": 2, "d": "상", "q": "DNA 한쪽 가닥의 염기 서열이 TACGGA이고, 이 가닥이 전사되어 mRNA가 만들어졌다. 이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>ㄱ. 만들어진 mRNA의 염기 서열은 AUGCCU이다.<br>ㄴ. 이 mRNA는 최대 2개의 아미노산을 지정한다.<br>ㄷ. RNA에는 타이민(T) 대신 유라실(U)이 있다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 5, "e": "전사될 때 DNA의 A, T, G, C는 각각 mRNA의 U, A, C, G와 상보적으로 대응하므로 mRNA는 AUGCCU이다(ㄱ). mRNA의 연속된 3개 염기(코돈)가 아미노산 1개를 지정하므로 6개 염기는 최대 2개의 아미노산을 지정한다(ㄴ). RNA는 T 대신 U를 갖는다(ㄷ).", "p": ""}, {"id": "SC-044", "s": "통합과학", "t": "수능", "g": 2, "d": "상", "q": "푸른색의 황산 구리(Ⅱ) 수용액에 아연판을 넣었더니 아연판 표면에 붉은색 구리가 달라붙었다. 이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>ㄱ. 아연은 전자를 잃고 산화된다.<br>ㄴ. 구리 이온은 전자를 얻어 환원된다.<br>ㄷ. 수용액의 푸른색은 점점 진해진다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "Zn + Cu²⁺ → Zn²⁺ + Cu. 아연은 전자를 잃고 산화되어 Zn²⁺으로 녹아 들어가고(ㄱ), Cu²⁺은 전자를 얻어 구리로 환원된다(ㄴ). 푸른색을 띠는 Cu²⁺의 수가 줄어들므로 수용액의 푸른색은 점점 옅어진다(ㄷ 틀림).", "p": ""}, {"id": "SC-045", "s": "통합과학", "t": "수능", "g": 2, "d": "상", "q": "발전소에서 같은 전력을 송전할 때 송전 전압을 10배로 높이면, 송전선에서 열로 손실되는 전력은 몇 배가 되는가? (단, 송전선의 저항은 일정하다.)", "c": ["1/10배", "1배", "10배", "100배", "1/100배"], "a": 5, "e": "전력 P = VI가 일정할 때 전압을 10배로 높이면 전류는 1/10배가 된다. 손실 전력은 I²R이므로 (1/10)² = 1/100배가 된다. 이 때문에 발전소에서는 전압을 높여 송전한다.", "p": ""}, {"id": "SC-046", "s": "통합과학", "t": "수능", "g": 3, "d": "하", "q": "공룡과 암모나이트가 번성하였던 지질 시대는?", "c": ["선캄브리아 시대", "중생대", "고생대", "신생대", "현세"], "a": 2, "e": "중생대는 공룡과 암모나이트가 번성한 시대이다. 고생대에는 삼엽충, 신생대에는 매머드와 화폐석이 번성하였다.", "p": ""}, {"id": "SC-047", "s": "통합과학", "t": "수능", "g": 3, "d": "하", "q": "다음 사례가 나타내는 생물 다양성의 종류는?\n<div class='box'>같은 종의 무당벌레라도 개체마다 등 껍질의 색과 점무늬가 조금씩 다르다.</div>", "c": ["종 다양성", "생태계 다양성", "군집 다양성", "유전적 다양성", "서식지 다양성"], "a": 4, "e": "같은 종 안에서 개체마다 유전자가 달라 형질이 다양하게 나타나는 것은 유전적 다양성이다. 유전적 다양성이 높은 종은 환경이 급격히 변해도 살아남을 가능성이 크다.", "p": ""}, {"id": "SC-048", "s": "통합과학", "t": "수능", "g": 3, "d": "하", "q": "화력 발전소에서 일어나는 에너지 전환 과정을 순서대로 옳게 나타낸 것은?", "c": ["열에너지 → 화학 에너지 → 전기 에너지 → 운동 에너지", "핵에너지 → 열에너지 → 운동 에너지 → 전기 에너지", "화학 에너지 → 열에너지 → 운동 에너지 → 전기 에너지", "빛에너지 → 전기 에너지", "위치 에너지 → 운동 에너지 → 전기 에너지"], "a": 3, "e": "화력 발전은 화석 연료의 화학 에너지를 연소시켜 열에너지로 바꾸고, 이 열로 만든 수증기로 터빈을 돌려(운동 에너지) 발전기에서 전기 에너지를 얻는다.", "p": ""}, {"id": "SC-049", "s": "통합과학", "t": "수능", "g": 3, "d": "중", "q": "엘니뇨가 발생했을 때 나타나는 현상으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>ㄱ. 페루 연안에서 찬 해수의 용승이 강해져 어획량이 늘어난다.<br>ㄴ. 동태평양 적도 부근 해역의 표층 수온이 평상시보다 높아진다.<br>ㄷ. 무역풍이 평상시보다 약해진다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 4, "e": "엘니뇨는 무역풍이 약해져(ㄷ) 따뜻한 해수가 동쪽으로 이동하면서 동태평양 적도 해역의 수온이 높아지는 현상이다(ㄴ). 이때 페루 연안의 용승이 약해져 영양 염류가 줄고 어획량이 감소한다(ㄱ 틀림).", "p": ""}, {"id": "SC-050", "s": "통합과학", "t": "수능", "g": 3, "d": "중", "q": "항생제를 오래 사용한 환경에서 항생제 내성 세균의 비율이 높아지는 현상에 대한 설명으로 옳은 것은?", "c": ["세균이 살아남기 위해 스스로 필요한 유전자를 만들어 냈다.", "항생제가 모든 세균의 유전자를 똑같이 바꾸었다.", "내성이 없는 세균이 내성이 있는 세균보다 더 많이 살아남았다.", "이 현상은 자연 선택과 관계가 없다.", "항생제를 쓰기 전부터 내성을 가진 변이 세균이 있었고, 이들이 살아남아 번식하였다."], "a": 5, "e": "세균 집단에는 원래 다양한 변이가 있다. 항생제라는 환경에서 내성 변이를 가진 세균이 더 많이 살아남아 자손을 남기면서 집단 내 비율이 높아지는 자연 선택의 사례이다.", "p": ""}, {"id": "SC-051", "s": "통합과학", "t": "수능", "g": 3, "d": "중", "q": "핵발전에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>ㄱ. 우라늄 원자핵이 분열할 때 나오는 에너지를 이용한다.<br>ㄴ. 핵분열 과정에서 줄어든 질량이 에너지로 전환된다.<br>ㄷ. 발전 과정에서 화력 발전보다 이산화 탄소를 많이 배출한다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "핵발전은 우라늄의 핵분열 연쇄 반응에서 나오는 에너지를 이용하며(ㄱ), 이 에너지는 질량 결손에서 비롯된다(ㄴ). 발전 과정에서 이산화 탄소를 거의 배출하지 않지만, 방사성 폐기물 처리와 사고 위험이라는 문제가 있다(ㄷ 틀림).", "p": ""}, {"id": "SC-052", "s": "통합과학", "t": "수능", "g": 3, "d": "상", "q": "우주의 팽창과 빅뱅 우주론에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>ㄱ. 멀리 있는 은하일수록 더 빠르게 멀어진다.<br>ㄴ. 모든 은하가 우리은하에서 멀어지므로 우리은하가 우주의 중심이다.<br>ㄷ. 우주에 분포하는 수소와 헬륨의 질량 비가 약 3 : 1인 것은 빅뱅 우주론의 증거이다.</div>", "c": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "은하의 후퇴 속도는 거리에 비례한다(허블 법칙, ㄱ). 우주는 공간 자체가 팽창하므로 어느 은하에서 보아도 다른 은하가 멀어지며, 팽창의 중심은 없다(ㄴ 틀림). 수소와 헬륨의 질량 비 약 3 : 1과 우주 배경 복사는 빅뱅 우주론의 증거이다(ㄷ).", "p": ""}, {"id": "SC-053", "s": "통합과학", "t": "수능", "g": 3, "d": "상", "q": "어떤 열기관이 1,000 J의 열에너지를 공급받아 250 J의 일을 하였다. 이 열기관의 열효율과 버려지는 열에너지를 옳게 짝지은 것은?", "c": ["25%, 750 J", "25%, 250 J", "75%, 250 J", "75%, 750 J", "40%, 600 J"], "a": 1, "e": "열효율 = (한 일 ÷ 공급받은 열에너지) × 100 = 250/1000 × 100 = 25%. 에너지 보존 법칙에 따라 버려지는 열에너지는 1,000 − 250 = 750 J이다.", "p": ""}];
const SUBJECTS = ["국어", "영어", "수학", "한국사", "통합사회", "통합과학"];

const app = document.getElementById("app");

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

const state = {
  type: "단편",
  subjects: new Set(SUBJECTS),
  grades: new Set([1, 2, 3]),
  levels: new Set(["하", "중", "상"]),
  size: 10,
  ...(() => { const s = store.get("quiz-filters", null); if (!s) return {}; return {
    type: s.type in TYPES ? s.type : "단편",
    subjects: new Set((s.subjects || SUBJECTS).filter(x => SUBJECTS.includes(x))),
    grades: new Set(s.grades || [1, 2, 3]), levels: new Set(s.levels || ["하", "중", "상"]), size: s.size || 10 }; })()
};
let quiz = null;

function saveFilters() {
  store.set("quiz-filters", { type: state.type, subjects: [...state.subjects], grades: [...state.grades], levels: [...state.levels], size: state.size });
}
function pool() {
  return BANK.filter(q => q.t === state.type && state.subjects.has(q.s) && state.grades.has(q.g) && state.levels.has(q.d));
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content; }
function wrongList() { return store.get("quiz-wrong", []).filter(id => BANK.some(q => q.id === id)); }

/* ---------- 설정 화면 ---------- */

   </div>
    ${wrong.length ? `<div class="panel"><div class="startbar" style="border:0;padding:0"><div class="count"><b>오답 노트</b> 틀린 문제 ${wrong.length}개가 모여 있습니다.</div>
      <div class="actions"><button class="btn ghost" id="clear-wrong">비우기</button><button class="btn ghost" id="retry-wrong">오답만 다시 풀기</button></div></div></div>` : ""}
    <p class="bon-note" style="margin:0"><b>키보드로 풀기</b> 숫자 키 1~5로 답을 고르고 Enter로 채점하거나 다음 문제로 넘어갈 수 있습니다.</p>
  </section>`));

  app.querySelectorAll("[data-type]").forEach(b => b.onclick = () => { state.type = b.dataset.type; saveFilters(); renderHome(); });
  const toggle = (set, v) => { set.has(v) ? set.delete(v) : set.add(v); saveFilters(); renderHome(); };
  app.querySelectorAll("[data-subj]").forEach(b => b.onclick = () => toggle(state.subjects, b.dataset.subj));
  app.querySelectorAll("[data-grade]").forEach(b => b.onclick = () => toggle(state.grades, +b.dataset.grade));
  app.querySelectorAll("[data-level]").forEach(b => b.onclick = () => toggle(state.levels, b.dataset.level));
  app.querySelectorAll("[data-size]").forEach(b => b.onclick = () => { state.size = +b.dataset.size; saveFilters(); renderHome(); });
  document.getElementById("start").onclick = () => {
    const picked = shuffle(pool());
    startQuiz(state.size ? picked.slice(0, state.size) : picked, TYPES[state.type].name);
  };
  const rw = document.getElementById("retry-wrong");
  if (rw) rw.onclick = () => startQuiz(shuffle(BANK.filter(q => wrong.includes(q.id))), "오답 노트");
  const cw = document.getElementById("clear-wrong");
  if (cw) cw.onclick = () => { store.set("quiz-wrong", []); renderHome(); };
}

/* ---------- 문제 화면 ---------- */
function startQuiz(list, label) {
  quiz = { list, label, i: 0, picked: null, graded: false, answers: [] };
  renderQuestion();
  window.scrollTo(0, 0);
}

function renderQuestion() {
  document.body.classList.add("in-quiz");
  const q = quiz.list[quiz.i];
  const n = quiz.list.length;
  app.innerHTML = "";
  app.append(el(`
  <section class="stack">
    <div class="qhead">
      <div class="tags">
        <span class="bon-tag">${q.s}</span><span class="bon-tag is-plain">${quiz.label}</span><span class="bon-tag is-plain">고${q.g}</span>
        <span class="bon-tag lv-${q.d}">난이도 ${q.d}</span>
      </div>
      <span class="progress">${quiz.i + 1} / ${n}</span>
    </div>
    <div class="meter"><i style="width:${(quiz.i / n) * 100}%"></i></div>
    <article class="panel">
      ${q.p ? `<div class="passage">${q.p}</div>` : ""}
      <div class="qtext"><span class="num">${quiz.i + 1}.</span>${q.q}</div>
      <div class="choices" role="radiogroup" aria-label="선택지">
        ${q.c.map((c, k) => `<button class="choice" role="radio" aria-checked="false" data-k="${k + 1}"><span class="bub">${k + 1}</span><span class="txt">${c}</span></button>`).join("")}
      </div>
      <div id="explain"></div>
      <form class="report" id="report" data-endpoint="" hidden novalidate>
        <strong>이 문제 이상해요</strong>
        <p>어떤 점이 이상한지 골라 주세요. 선생님이 확인하고 고칠게요. 이름·전화번호 같은 개인정보는 적지 마세요.</p>
        <div class="chips">${REPORT_REASONS.map((r, k) => `<button type="button" class="chip" data-reason="${r}" aria-pressed="${k === 0}">${r}</button>`).join("")}</div>
        <textarea id="report-msg" name="msg" maxlength="500" placeholder="자세한 내용 (적지 않아도 돼요)" aria-label="자세한 내용"></textarea>
        <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <p class="status" id="report-status" role="status" aria-live="polite"></p>
        <div class="actions">
          <button type="button" class="btn ghost" id="report-copy">내용 복사</button>
          <button type="button" class="btn ghost" id="report-close">닫기</button>
          <button type="submit" class="btn" id="report-send">제보 보내기</button>
        </div>
      </form>
      <div class="actions">
        <button type="button" class="report-open" id="report-open">이 문제 이상해요</button>
        <button class="btn ghost" id="quit">그만 풀기</button>
        <button class="btn" id="go" disabled>채점하기</button>
      </div>
    </article>
  </section>`));
  quiz.picked = null; quiz.graded = false;
  app.querySelectorAll(".choice").forEach(b => b.onclick = () => pick(+b.dataset.k));
  document.getElementById("go").onclick = advance;
  document.getElementById("quit").onclick = () => quiz.answers.length ? renderResult() : renderHome();
  setupReport(q);
}

/* ---------- '이 문제 이상해요' 제보 ---------- */
function setupReport(q) {
  const form = document.getElementById("report"), status = document.getElementById("report-status");
  const send = document.getElementById("report-send"), msg = document.getElementById("report-msg");
  const say = (t, err) => { status.textContent = t; status.classList.toggle("err", !!err); };
  let reason = REPORT_REASONS[0];
  const text = () => `[문제 제보] ${q.id} (${q.s} · ${TYPES[q.t].name} · 고${q.g} · 난이도 ${q.d})\n사유: ${reason}\n내용: ${msg.value.trim() || "(없음)"}`;
  document.getElementById("report-open").onclick = () => {
    form.hidden = !form.hidden;
    if (!form.hidden) {
      if (!form.dataset.endpoint) say("아직 제보 받는 곳을 준비하고 있어요. '내용 복사'를 눌러 선생님께 전해 주세요.", true);
      form.scrollIntoView({ block: "nearest" });
    }
  };
  document.getElementById("report-close").onclick = () => { form.hidden = true; };
  form.querySelectorAll("[data-reason]").forEach(b => b.onclick = () => {
    reason = b.dataset.reason;
    form.querySelectorAll("[data-reason]").forEach(x => x.setAttribute("aria-pressed", x === b));
  });
  document.getElementById("report-copy").onclick = async () => {
    try { await navigator.clipboard.writeText(text()); say("복사했어요. 선생님께 붙여 넣어 보내 주세요."); }
    catch (e) { say(text(), true); }
  };
  form.onsubmit = async e => {
    e.preventDefault();
    const url = form.dataset.endpoint;
    if (!url) { say("아직 제보 받는 곳을 준비하고 있어요. '내용 복사'를 눌러 선생님께 전해 주세요.", true); return; }
    if (Date.now() - store.get("quiz-report-at", 0) < 10000) { say("조금 전에 보냈어요. 10초 뒤에 다시 보내 주세요.", true); return; }
    send.disabled = true; say("보내는 중…");
    try {
      // 구글 Apps Script 웹 앱은 응답을 읽을 수 없게(no-cors) 보내는 것이 가장 확실하다
      await fetch(url, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ id: q.id, subject: q.s, type: TYPES[q.t].name, grade: "고" + q.g, level: q.d, reason, msg: msg.value.trim(),
          question: q.q.replace(/<[^>]+>/g, " ").slice(0, 120), picked: quiz && quiz.picked || "", website: form.website.value }) });
      store.set("quiz-report-at", Date.now());
      msg.value = "";
      say("보냈어요! 선생님이 확인해 볼게요. 고마워요.");
    } catch (err) {
      say("보내지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.", true);
    } finally { send.disabled = false; }
  };
}

function pick(k) {
  if (quiz.graded) return;
  quiz.picked = k;
  app.querySelectorAll(".choice").forEach(b => b.setAttribute("aria-checked", +b.dataset.k === k));
  document.getElementById("go").disabled = false;
}

function advance() {
  if (!quiz) return;
  if (!quiz.graded) {
    if (!quiz.picked) return;
    const q = quiz.list[quiz.i];
    const ok = quiz.picked === q.a;
    quiz.graded = true;
    quiz.answers.push({ q, picked: quiz.picked, ok });
    let wrong = wrongList();
    wrong = ok ? wrong.filter(id => id !== q.id) : [...new Set([...wrong, q.id])];
    store.set("quiz-wrong", wrong);
    app.querySelectorAll(".choice").forEach(b => {
      const k = +b.dataset.k; b.disabled = true;
      if (k === q.a) b.classList.add("correct");
      else if (k === quiz.picked) b.classList.add("wrong");
    });
    document.getElementById("explain").innerHTML = `<div class="explain">
      <div class="verdict ${ok ? "ok" : "bad"}">${ok ? "정답입니다" : `오답입니다 · 정답 ${NUMS[q.a - 1]}`}</div>
      <p>${q.e}</p></div>`;
    const go = document.getElementById("go");
    go.textContent = quiz.i + 1 < quiz.list.length ? "다음 문제" : "결과 보기";
    go.focus();
  } else if (quiz.i + 1 < quiz.list.length) {
    quiz.i++; renderQuestion(); window.scrollTo(0, 0);
  } else {
    renderResult();
  }
}

/* ---------- 결과 화면 ---------- */
function renderResult() {
  const a = quiz.answers;
  const right = a.filter(x => x.ok).length;
  const pct = a.length ? Math.round(right / a.length * 100) : 0;
  const bySubj = SUBJECTS.map(s => { const r = a.filter(x => x.q.s === s); return { s, n: r.length, ok: r.filter(x => x.ok).length }; }).filter(x => x.n);
  const wrong = a.filter(x => !x.ok);
  app.innerHTML = "";
  app.append(el(`
  <section class="stack">
    <div class="score"><span class="big">${right} / ${a.length}</span><span class="sub">정답률 ${pct}% · ${quiz.label}</span></div>
    <div class="panel"><div class="lbl">과목별 결과</div>
      <div class="group">${bySubj.map(b => `<div class="brow"><span>${b.s}</span><div class="track"><i style="width:${b.ok / b.n * 100}%"></i></div><span>${b.ok}/${b.n}</span></div>`).join("")}</div>
    </div>
    ${wrong.length ? `<div class="group"><div class="lbl">틀린 문제 해설 (${wrong.length})</div><div class="review">
      ${wrong.map(x => `<details><summary>[${x.q.s} · 고${x.q.g} · ${x.q.d}] ${x.q.q.split("\n")[0]}</summary>
        ${x.q.p ? `<div class="passage">${x.q.p}</div>` : ""}
        <p class="ans">내 답 ${NUMS[x.picked - 1]} ${x.q.c[x.picked - 1]} → 정답 ${NUMS[x.q.a - 1]} ${x.q.c[x.q.a - 1]}</p>
        <p>${x.q.e}</p></details>`).join("")}
    </div></div>` : `<p class="bon-note" style="margin:0"><b>모두 맞혔습니다.</b> 난이도를 올리거나 다른 과목에 도전해 보세요.</p>`}
    <div class="actions">
      ${wrong.length ? `<button class="btn ghost" id="again-wrong">틀린 문제 다시 풀기</button>` : ""}
      <button class="btn" id="home">처음으로</button>
    </div>
  </section>`));
  document.getElementById("home").onclick = () => { renderHome(); window.scrollTo(0, 0); };
  const ag = document.getElementById("again-wrong");
  if (ag) ag.onclick = () => startQuiz(shuffle(wrong.map(x => x.q)), "다시 풀기");
  quiz = null;
}

document.addEventListener("keydown", e => {
  if (!quiz || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.target.closest && e.target.closest("#report")) return;  // 제보 내용을 쓰는 중에는 단축키를 끈다
  if (e.key >= "1" && e.key <= "5") pick(+e.key);
  else if (e.key === "Enter" && document.activeElement?.id !== "quit") { e.preventDefault(); advance(); }
});

renderHome();
</script>
