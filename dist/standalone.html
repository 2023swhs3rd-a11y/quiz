 세습을 처음 확립하였다.", "우경을 장려하고 순장을 금지하였다.", "삼국 통일을 완성하였다."], "a": 4, "e": "자료의 왕은 지증왕이다. 지증왕은 순장을 금지하고 소를 이용한 농사(우경)를 장려하였다. 불교 공인은 법흥왕, 화랑도 개편은 진흥왕, 김씨 왕위 세습은 내물왕, 삼국 통일은 문무왕 때의 일이다.", "p": ""}, {"id": "HI-092", "s": "한국사", "t": "단편", "g": 1, "d": "상", "q": "고구려 소수림왕의 업적으로 옳은 것은?", "c": ["평양으로 수도를 옮겼다.", "율령을 반포하고 태학을 설립하였다.", "영락이라는 연호를 사용하였다.", "천리장성을 쌓았다.", "낙랑군을 몰아냈다."], "a": 2, "e": "소수림왕은 불교 수용, 태학 설립, 율령 반포로 중앙 집권 체제를 정비하였다. 평양 천도는 장수왕, 영락 연호는 광개토 대왕, 낙랑군 축출은 미천왕 때의 일이다.", "p": ""}, {"id": "HI-093", "s": "한국사", "t": "단편", "g": 1, "d": "상", "q": "발해의 통치 체제에 대한 설명으로 옳은 것은?", "c": ["귀족 회의인 화백 회의에서 국가 중대사를 결정하였다.", "지방을 9주 5소경으로 정비하였다.", "당의 제도를 받아들여 3성 6부를 두었으나, 정당성을 중심으로 독자적으로 운영하였다.", "도병마사와 식목도감을 운영하였다.", "의정부와 6조를 중심으로 정치를 운영하였다."], "a": 3, "e": "발해는 당의 3성 6부를 받아들였지만 정당성 중심으로 운영하고 6부의 이름을 유교 덕목으로 짓는 등 독자성을 보였다. 9주 5소경은 통일 신라, 도병마사는 고려, 의정부는 조선의 제도이다.", "p": ""}, {"id": "HI-094", "s": "한국사", "t": "단편", "g": 1, "d": "상", "q": "고려의 도병마사에 대한 설명으로 옳은 것은?", "c": ["중서문하성과 중추원의 고위 관리가 모여 국방 문제 등을 논의한 회의 기구였다.", "관리의 비리를 감찰하는 기구였다.", "왕명 출납과 군사 기밀을 담당하였다.", "화폐와 곡식의 출납 회계를 맡았다.", "무신 집권기 최고 권력 기구였다."], "a": 1, "e": "도병마사는 재신과 추밀이 모여 국방·군사 문제를 논의한 고려의 독자적 회의 기구로, 원 간섭기에 도평의사사로 개편되었다. 감찰은 어사대, 왕명 출납은 중추원, 회계는 삼사가 맡았다.", "p": ""}, {"id": "HI-095", "s": "한국사", "t": "단편", "g": 1, "d": "상", "q": "고려 승려 지눌에 대한 설명으로 옳은 것은?", "c": ["해동 천태종을 창시하고 교관겸수를 내세웠다.", "'삼국유사'를 저술하였다.", "수선사 결사를 이끌고 정혜쌍수와 돈오점수를 주장하였다.", "화엄 사상을 바탕으로 부석사를 세웠다.", "무애가를 지어 불교 대중화에 힘썼다."], "a": 3, "e": "지눌은 무신 집권기에 수선사 결사를 통해 불교 개혁을 추진하고, 선종 중심으로 교종을 통합하려 하였다. 천태종은 의천, 삼국유사는 일연, 부석사는 의상, 무애가는 원효와 관련된다.", "p": ""}, {"id": "HI-096", "s": "한국사", "t": "단편", "g": 1, "d": "상", "q": "김부식이 왕명을 받아 편찬한 '삼국사기'에 대한 설명으로 옳은 것은?", "c": ["현재 전하는 우리나라에서 가장 오래된 역사서로, 기전체로 서술되었다.", "단군의 건국 이야기를 처음 수록하였다.", "발해를 우리 역사로 처음 다루었다.", "고구려 계승 의식을 강조하여 동명왕의 업적을 서사시로 표현하였다.", "불교 관련 설화와 민간 전승을 많이 실었다."], "a": 1, "e": "삼국사기는 유교적 합리주의 사관에 따라 기전체로 쓴 현존 최고(最古)의 역사서이다. 단군 이야기와 불교 설화는 일연의 삼국유사, 동명왕 서사시는 이규보의 동명왕편에 해당한다.", "p": ""}, {"id": "HI-097", "s": "한국사", "t": "단편", "g": 1, "d": "상", "q": "조선 시대 언론 기능을 담당한 '삼사'에 해당하는 기구를 옳게 묶은 것은?", "c": ["사헌부, 사간원, 홍문관", "의정부, 승정원, 의금부", "사헌부, 승정원, 춘추관", "사간원, 의금부, 한성부", "홍문관, 춘추관, 성균관"], "a": 1, "e": "사헌부(감찰), 사간원(간쟁), 홍문관(경연·자문)을 삼사라 하며, 권력의 독점과 부정을 견제하는 역할을 하였다.", "p": ""}, {"id": "HI-098", "s": "한국사", "t": "단편", "g": 1, "d": "상", "q": "조선 후기의 경제 변화로 <u>옳지 않은</u> 것은?", "c": ["벽란도가 국제 무역항으로 번성하였다.", "모내기법이 널리 퍼져 벼와 보리의 이모작이 확대되었다.", "담배, 인삼 등 상품 작물 재배가 늘었다.", "상평통보가 전국적으로 유통되었다.", "관청에 물품을 대는 공인이 등장하였다."], "a": 1, "e": "벽란도는 고려 시대의 국제 무역항이다. 조선 후기에는 모내기법 확산, 상품 작물 재배, 화폐 유통, 공인과 사상의 성장 등 경제적 변화가 나타났다.", "p": ""}, {"id": "HI-099", "s": "한국사", "t": "단편", "g": 1, "d": "상", "q": "비변사에 대한 설명으로 옳은 것은?", "c": ["고려 시대에 법과 제도를 논의하던 기구였다.", "정조가 개혁 정치를 위해 설치한 학문 기구였다.", "세종이 학문 연구를 위해 설치하였다.", "갑오개혁 때 개혁을 추진한 기구였다.", "국방 문제를 논의하는 임시 기구로 설치되었다가 임진왜란을 거치며 국정 최고 기구가 되었다."], "a": 5, "e": "비변사는 삼포왜란을 계기로 임시 기구로 설치되어 임진왜란 이후 기능이 크게 강화되었고, 세도 정치기의 권력 기반이 되었다. 흥선 대원군이 그 기능을 축소·폐지하였다.", "p": ""}, {"id": "HI-100", "s": "한국사", "t": "단편", "g": 1, "d": "상", "q": "1811년 세도 정치의 폐단과 평안도(서북) 지역에 대한 차별에 반발하여 일어난 봉기는?", "c": ["임술 농민 봉기", "만적의 난", "망이·망소이의 난", "이시애의 난", "홍경래의 난"], "a": 5, "e": "홍경래의 난은 몰락 양반 홍경래가 영세 농민, 광산 노동자 등과 함께 일으킨 봉기로, 청천강 이북 지역을 한때 장악하였다. 임술 농민 봉기는 1862년 진주에서 시작되었다.", "p": ""}, {"id": "HI-101", "s": "한국사", "t": "수능", "g": 1, "d": "상", "q": "다음 사건을 일어난 순서대로 바르게 나열한 것은?<div class='box'>(가) 이성계가 위화도에서 군대를 돌렸다.<br>(나) 한양으로 도읍을 옮겼다.<br>(다) 과전법이 실시되었다.<br>(라) 조선이 건국되었다.</div>", "c": ["(가)-(나)-(다)-(라)", "(가)-(다)-(라)-(나)", "(가)-(라)-(다)-(나)", "(다)-(가)-(라)-(나)", "(다)-(라)-(가)-(나)"], "a": 2, "e": "위화도 회군(1388) → 과전법 실시(1391) → 조선 건국(1392) → 한양 천도(1394)의 순서이다.", "p": ""}, {"id": "HI-102", "s": "한국사", "t": "수능", "g": 1, "d": "상", "q": "다음 자료의 왕이 실시한 정책으로 옳은 것은?<div class='box'>• 계유정난을 일으켜 권력을 장악한 뒤 왕위에 올랐다.<br>• 집현전과 경연을 폐지하고 6조 직계제를 다시 실시하였다.</div>", "c": ["현직 관리에게만 수조권을 지급하는 직전법을 실시하였다.", "4군 6진을 개척하였다.", "홍문관을 설치하였다.", "장용영을 설치하였다.", "탕평비를 세웠다."], "a": 1, "e": "자료의 왕은 세조이다. 세조는 관리에게 줄 토지가 부족해지자 현직 관리에게만 수조권을 주는 직전법을 실시하였다. 4군 6진은 세종, 홍문관은 성종, 장용영은 정조, 탕평비는 영조와 관련된다.", "p": ""}, {"id": "HI-103", "s": "한국사", "t": "수능", "g": 1, "d": "상", "q": "다음 자료에 대한 설명으로 옳은 것은?<div class='box'>일본 도다이사 쇼소인에서 발견된 통일 신라의 문서로, 서원경 부근 4개 촌락의 인구, 토지, 소와 말, 뽕나무·잣나무의 수 등이 기록되어 있다.</div>", "c": ["골품에 따른 관등 승진의 제한을 기록하였다.", "조세를 걷고 노동력을 동원하기 위해 3년마다 작성하였다.", "토지 매매를 증명하기 위해 관청이 발급하였다.", "촌락의 불교 신앙 활동을 기록하였다.", "촌주가 개인적으로 재산을 관리하려고 작성하였다."], "a": 2, "e": "신라 촌락 문서(민정 문서)는 국가가 조세와 노동력을 정확히 거두기 위해 촌주가 변동 사항을 조사하여 3년마다 다시 작성한 문서이다.", "p": ""}, {"id": "HI-104", "s": "한국사", "t": "단편", "g": 2, "d": "하", "q": "1876년 조선이 일본과 강화도 조약을 맺게 된 계기가 된 사건은?", "c": ["제너럴셔먼호 사건", "오페르트 도굴 사건", "임오군란", "운요호 사건", "거문도 사건"], "a": 4, "e": "일본은 운요호 사건(1875)을 구실로 조선에 개항을 강요하여 이듬해 강화도 조약을 체결하였다. 강화도 조약은 우리나라 최초의 근대적 조약이자 불평등 조약이다.", "p": ""}, {"id": "HI-105", "s": "한국사", "t": "단편", "g": 2, "d": "하", "q": "1882년 임오군란이 일어난 원인으로 옳은 것은?", "c": ["단발령이 시행되었다.", "명성 황후가 시해되었다.", "외교권이 박탈되었다.", "군대가 강제로 해산되었다.", "신식 군대인 별기군에 비해 구식 군인들이 차별 대우를 받았다."], "a": 5, "e": "구식 군인들은 별기군과의 차별, 밀린 급료로 받은 쌀에 겨와 모래가 섞인 일에 분노하여 임오군란을 일으켰다.", "p": ""}, {"id": "HI-106", "s": "한국사", "t": "단편", "g": 2, "d": "하", "q": "1884년 우정총국 개국 축하연을 이용하여 갑신정변을 일으킨 급진 개화파 인물은?", "c": ["김홍집", "최익현", "전봉준", "김옥균", "이항로"], "a": 4, "e": "김옥균, 박영효, 서광범 등 급진 개화파는 갑신정변을 일으켜 개화당 정부를 세웠으나 청군의 개입으로 3일 만에 실패하였다.", "p": ""}, {"id": "HI-107", "s": "한국사", "t": "단편", "g": 2, "d": "하", "q": "'사람이 곧 하늘'이라는 인내천 사상으로 이어진 동학을 1860년에 창시한 인물은?", "c": ["최시형", "손병희", "최제우", "전봉준", "나철"], "a": 3, "e": "동학은 경주의 몰락 양반 최제우가 창시하였다. 최시형은 2대 교주, 손병희는 3대 교주로 동학을 천도교로 개편하였다. 나철은 대종교를 창시하였다.", "p": ""}, {"id": "HI-108", "s": "한국사", "t": "단편", "g": 2, "d": "하", "q": "1896년 우리나라 최초의 순 한글 민간 신문인 독립신문을 창간한 인물은?", "c": ["양기탁", "서재필", "주시경", "박은식", "이승훈"], "a": 2, "e": "서재필은 정부의 지원을 받아 독립신문을 창간하고 독립 협회 창립을 주도하였다. 양기탁은 베델과 함께 대한매일신보를 발행하였다.", "p": ""}, {"id": "HI-109", "s": "한국사", "t": "단편", "g": 2, "d": "하", "q": "1907년 일본에 진 나랏빚을 국민의 힘으로 갚자는 국채 보상 운동이 처음 시작된 도시는?", "c": ["서울", "대구", "평양", "부산", "광주"], "a": 2, "e": "국채 보상 운동은 대구에서 서상돈 등의 제안으로 시작되어 대한매일신보 등의 지원으로 전국으로 퍼졌다.", "p": ""}, {"id": "HI-110", "s": "한국사", "t": "단편", "g": 2, "d": "하", "q": "1920년 6월 대한 독립군 등을 이끌고 봉오동 전투에서 일본군을 물리친 인물은?", "c": ["안중근", "이회영", "김원봉", "윤봉길", "홍범도"], "a": 5, "e": "홍범도가 이끈 대한 독립군 등 독립군 연합 부대는 봉오동에서 일본군을 크게 물리쳤다.", "p": ""}, {"id": "HI-111", "s": "한국사", "t": "단편", "g": 2, "d": "하", "q": "1910년대 일제가 헌병 경찰을 앞세워 실시한 강압적인 통치 방식을 무엇이라 하는가?", "c": ["무단 통치", "문화 통치", "민족 말살 통치", "통감 정치", "고문 정치"], "a": 1, "e": "1910년대 일제는 헌병이 경찰 업무까지 맡는 헌병 경찰제를 실시하고 교사에게도 칼을 차게 하는 등 무단 통치를 하였다.", "p": ""}, {"id": "HI-112", "s": "한국사", "t": "단편", "g": 2, "d": "하", "q": "일제 강점기에 한글 맞춤법 통일안을 만들고 '우리말 큰사전' 편찬을 추진한 단체는?", "c": ["신간회", "신민회", "조선어 학회", "의열단", "근우회"], "a": 3, "e": "조선어 학회는 한글 맞춤법 통일안과 표준어를 제정하고 사전 편찬을 추진하였으나, 1942년 일제가 일으킨 조선어 학회 사건으로 활동이 중단되었다.", "p": ""}, {"id": "HI-113", "s": "한국사", "t": "단편", "g": 2, "d": "하", "q": "1932년 상하이 훙커우 공원에서 일본군 장성과 고관들에게 폭탄을 던진 한인 애국단원은?", "c": ["이봉창", "안중근", "윤봉길", "강우규", "나석주"], "a": 3, "e": "윤봉길의 훙커우 공원 의거는 중국 국민당 정부가 대한민국 임시 정부를 적극 지원하는 계기가 되었다.", "p": ""}, {"id": "HI-114", "s": "한국사", "t": "단편", "g": 2, "d": "하", "q": "1907년 고종이 을사늑약의 부당함을 알리기 위해 특사를 파견한 곳은?", "c": ["미국 워싱턴", "프랑스 파리", "중국 상하이", "네덜란드 헤이그", "러시아 블라디보스토크"], "a": 4, "e": "고종은 헤이그 만국 평화 회의에 이준, 이상설, 이위종을 특사로 보냈다. 일제는 이를 구실로 고종을 강제로 퇴위시켰다.", "p": ""}, {"id": "HI-115", "s": "한국사", "t": "단편", "g": 2, "d": "하", "q": "을미사변 이후 신변의 위협을 느낀 고종이 1896년 러시아 공사관으로 거처를 옮긴 사건은?", "c": ["갑신정변", "임오군란", "을미개혁", "아관 파천", "삼국 간섭"], "a": 4, "e": "고종이 러시아 공사관으로 옮겨 간 사건을 아관 파천이라 한다. 이후 러시아 등 열강의 이권 침탈이 심해졌다.", "p": ""}, {"id": "HI-116", "s": "한국사", "t": "수능", "g": 2, "d": "하", "q": "다음 자료의 조약에 대한 설명으로 옳은 것은?<div class='box'>제1관 조선국은 자주국이며 일본국과 평등한 권리를 가진다.<br>제7관 일본국 항해자가 조선의 해안을 자유로이 측량하도록 허가한다.<br>제10관 일본국 인민이 조선국 지정 항구에서 죄를 범하면 일본국 관원이 심판한다.</div>", "c": ["부산 외에 두 곳의 항구를 개항하도록 하였다.", "최혜국 대우를 처음으로 규정하였다.", "외교권을 일본에 넘기는 내용을 담았다.", "임오군란을 계기로 체결되었다.", "서양 국가와 맺은 최초의 조약이다."], "a": 1, "e": "자료는 강화도 조약(1876)이다. 이 조약으로 부산·원산·인천이 개항되었고, 해안 측량권과 치외 법권을 인정한 불평등 조약이었다. 최혜국 대우는 조·미 수호 통상 조약에서 처음 규정되었다.", "p": ""}, {"id": "HI-117", "s": "한국사", "t": "단편", "g": 2, "d": "중", "q": "1866년 병인양요 때 프랑스군이 강화도에서 약탈해 간 것은?", "c": ["직지심체요절", "외규장각 도서(의궤)", "팔만대장경", "훈민정음 해례본", "조선왕조실록 전체"], "a": 2, "e": "프랑스군은 병인박해를 구실로 강화도를 침략하였고, 물러가면서 외규장각의 의궤 등 문화유산을 약탈하였다.", "p": ""}, {"id": "HI-118", "s": "한국사", "t": "단편", "g": 2, "d": "중", "q": "신미양요 직후 흥선 대원군이 통상 수교 거부 의지를 알리기 위해 전국 각지에 세운 것은?", "c": ["탕평비", "순수비", "척화비", "독립문", "황룡사 9층 목탑"], "a": 3, "e": "흥선 대원군은 병인양요와 신미양요를 겪은 뒤 '서양 오랑캐가 침범하는데 싸우지 않으면 화친하는 것'이라는 내용의 척화비를 세웠다.", "p": ""}, {"id": "HI-119", "s": "한국사", "t": "단편", "g": 2, "d": "중", "q": "동학 농민군이 전주 화약을 맺은 뒤 전라도 각지에 설치하여 개혁을 추진한 기구는?", "c": ["교정청", "군국기무처", "통리기무아문", "집강소", "별기군"], "a": 4, "e": "농민군은 정부와 전주 화약을 맺고 전라도 각 고을에 집강소를 설치하여 폐정 개혁을 추진하였다. 교정청은 정부가 설치한 개혁 기구이고, 군국기무처는 제1차 갑오개혁을 추진하였다.", "p": ""}, {"id": "HI-120", "s": "한국사", "t": "단편", "g": 2, "d": "중", "q": "1895년 을미개혁의 내용으로 옳은 것은?", "c": ["과거제를 폐지하였다.", "신분제를 폐지하였다.", "지계를 발급하였다.", "홍범 14조를 반포하였다.", "단발령을 시행하고 태양력을 사용하였다."], "a": 5, "e": "을미개혁에서는 단발령 시행, 태양력 사용, '건양' 연호 제정 등이 이루어졌다. 과거제·신분제 폐지는 제1차 갑오개혁, 홍범 14조는 제2차 갑오개혁, 지계 발급은 광무개혁의 내용이다.", "p": ""}, {"id": "HI-121", "s": "한국사", "t": "단편", "g": 2, "d": "중", "q": "1920년대 일제가 실시한 산미 증식 계획의 결과로 옳은 것은?", "c": ["늘어난 양보다 더 많은 쌀이 일본으로 빠져나가 한국인의 식량 사정이 나빠졌다.", "한국인 자작농의 비율이 크게 늘었다.", "쌀값이 안정되어 농민의 생활이 나아졌다.", "토지 소유권이 처음으로 조사되었다.", "공업 중심의 경제 구조가 만들어졌다."], "a": 1, "e": "산미 증식 계획으로 쌀 생산은 다소 늘었으나 그보다 많은 양이 일본으로 반출되었고, 수리 조합비 등의 부담이 농민에게 떠넘겨져 소작농으로 몰락하는 농민이 늘었다.", "p": ""}, {"id": "HI-122", "s": "한국사", "t": "단편", "g": 2, "d": "중", "q": "1929년 광주 학생 항일 운동에 대한 설명으로 옳은 것은?", "c": ["순종의 장례일에 일어났다.", "일제가 문화 통치를 실시하는 계기가 되었다.", "대한민국 임시 정부 수립의 배경이 되었다.", "평양에서 처음 시작되었다.", "한·일 학생 간의 충돌을 계기로 일어나 전국으로 확산되었다."], "a": 5, "e": "광주 학생 항일 운동은 나주역에서 벌어진 한·일 학생 충돌과 일제의 편파적 처리에 반발하여 일어났으며, 신간회가 조사단을 파견하여 지원하였다. 3·1 운동 이후 최대 규모의 항일 운동이었다.", "p": ""}, {"id": "HI-123", "s": "한국사", "t": "단편", "g": 2, "d": "중", "q": "1919년 만주에서 김원봉을 중심으로 조직되어 일제 요인 암살과 식민 통치 기관 파괴 활동을 벌인 단체는?", "c": ["의열단", "한인 애국단", "신민회", "대한 광복회", "독립 의군부"], "a": 1, "e": "의열단은 김원봉이 조직한 의열 투쟁 단체로, 신채호가 쓴 '조선 혁명 선언'을 활동 지침으로 삼았다. 한인 애국단은 1931년 김구가 조직하였다.", "p": ""}, {"id": "HI-124", "s": "한국사", "t": "단편", "g": 2, "d": "중", "q": "대한민국 임시 정부가 국내와 연락하고 독립 자금을 모으기 위해 운영한 비밀 조직은?", "c": ["연통제와 교통국", "집강소와 교정청", "통감부와 이사청", "대한 국민 의회와 한성 정부", "별기군과 무위영"], "a": 1, "e": "임시 정부는 비밀 행정 조직인 연통제와 통신 기관인 교통국을 통해 국내와 연락하고 독립 자금을 모았다.", "p": ""}, {"id": "HI-125", "s": "한국사", "t": "단편", "g": 2, "d": "중", "q": "1943년 미국·영국·중국의 대표가 모여 처음으로 한국의 독립을 약속한 회담은?", "c": ["얄타 회담", "카이로 회담", "포츠담 회담", "모스크바 3국 외상 회의", "파리 강화 회의"], "a": 2, "e": "카이로 회담에서 연합국은 '적절한 절차를 거쳐' 한국을 독립시킬 것을 처음 약속하였고, 이는 포츠담 선언에서 다시 확인되었다.", "p": ""}, {"id": "HI-126", "s": "한국사", "t": "단편", "g": 2, "d": "중", "q": "1938년 국가 총동원법 제정 이후 일제가 실시한 정책으로 옳은 것은?", "c": ["토지 조사 사업을 실시하였다.", "회사령을 제정하였다.", "징용과 징병으로 인력을 동원하고 식량과 금속을 공출하였다.", "헌병 경찰제를 처음 도입하였다.", "조선 태형령을 제정하였다."], "a": 3, "e": "중·일 전쟁 이후 일제는 국가 총동원법을 만들어 한국인을 징용·징병·일본군 '위안부' 등으로 강제 동원하고 물자를 공출하였다. 나머지는 1910년대의 정책이다.", "p": ""}, {"id": "HI-127", "s": "한국사", "t": "수능", "g": 2, "d": "중", "q": "다음 자료의 조약에 대한 설명으로 옳은 것은?<div class='box'>1882년 청의 알선으로 체결되었다. 제3국이 한쪽 나라를 부당하게 대하면 서로 돕는다는 '거중 조정' 조항과, 다른 나라에 준 가장 유리한 대우를 똑같이 인정하는 조항이 들어 있다.</div>", "c": ["조선이 서양 국가와 맺은 최초의 조약이다.", "운요호 사건을 계기로 체결되었다.", "일본 공사관에 경비병을 두도록 하였다.", "외교권이 박탈되는 결과를 가져왔다.", "청 상인의 내륙 통상을 허용하였다."], "a": 1, "e": "자료는 조·미 수호 통상 조약이다. 서양과 맺은 최초의 조약으로, 거중 조정과 관세 규정이 있었으나 치외 법권과 최혜국 대우를 인정한 불평등 조약이었다.", "p": ""}, {"id": "HI-128", "s": "한국사", "t": "단편", "g": 2, "d": "상", "q": "1880년 김홍집이 일본에서 들여온 '조선책략'이 국내에 끼친 영향으로 옳은 것은?", "c": ["미국과의 수교가 추진되고, 이에 반발하여 영남 만인소가 올라왔다.", "흥선 대원군이 척화비를 세웠다.", "병인박해가 일어났다.", "강화도 조약이 체결되었다.", "갑신정변이 일어났다."], "a": 1, "e": "조선책략은 러시아를 막기 위해 청·일본·미국과 손잡을 것을 주장한 책이다. 이를 계기로 미국과의 수교가 추진되자 이만손 등 영남 유생들이 만인소를 올려 반대하였다.", "p": ""}, {"id": "HI-129", "s": "한국사", "t": "단편", "g": 2, "d": "상", "q": "갑신정변 때 발표된 14개조 개혁 정강의 내용으로 <u>옳지 않은</u> 것은?", "c": ["청에 대한 조공의 허례를 폐지한다.", "토지를 농민에게 고르게 나누어 준다.", "문벌을 폐지하고 인민 평등의 권리를 세운다.", "지조법을 개혁한다.", "모든 재정은 호조에서 관할한다."], "a": 2, "e": "갑신정변의 개혁 정강에는 토지의 균등 분배가 없었다. 급진 개화파는 지조법 개혁을 주장하였을 뿐이며, 토지 균분 요구는 동학 농민 운동의 폐정 개혁안에서 나타난다.", "p": ""}, {"id": "HI-130", "s": "한국사", "t": "단편", "g": 2, "d": "상", "q": "제2차 갑오개혁의 내용으로 옳은 것은?", "c": ["군국기무처가 개혁을 주도하였다.", "단발령을 실시하였다.", "대한국 국제를 반포하였다.", "재판소를 설치하여 사법권을 독립시키고 8도를 23부로 개편하였다.", "통리기무아문을 설치하였다."], "a": 4, "e": "제2차 갑오개혁은 김홍집·박영효 연립 내각이 추진하였으며, 홍범 14조 반포, 재판소 설치, 지방 제도 개편(23부), 교육 입국 조서 반포 등이 이루어졌다.", "p": ""}, {"id": "HI-131", "s": "한국사", "t": "단편", "g": 2, "d": "상", "q": "대한 제국이 추진한 광무개혁에 대한 설명으로 옳은 것은?", "c": ["입헌 군주제를 수립하고자 하였다.", "일본의 간섭 아래 추진되었다.", "신분제를 처음으로 폐지하였다.", "'옛것을 근본으로 삼고 새것을 참고한다'는 원칙 아래 양전 사업을 하고 지계를 발급하였다.", "의회 설립을 통해 민권을 보장하였다."], "a": 4, "e": "광무개혁은 구본신참을 원칙으로 황제권을 강화하면서 원수부 설치, 양전 사업과 지계 발급, 상공업 진흥 등을 추진하였다.", "p": ""}, {"id": "HI-132", "s": "한국사", "t": "단편", "g": 2, "d": "상", "q": "1904년 제1차 한·일 협약의 결과로 옳은 것은?", "c": ["일본이 추천한 재정 고문과 외교 고문이 파견되었다.", "통감부가 설치되었다.", "대한 제국 군대가 해산되었다.", "사법권이 박탈되었다.", "각 부에 일본인 차관이 임명되었다."], "a": 1, "e": "제1차 한·일 협약으로 메가타(재정)와 스티븐스(외교)가 고문으로 파견되어 이른바 고문 정치가 시작되었다. 통감부 설치는 을사늑약, 군대 해산과 차관 임명은 한·일 신협약의 결과이다.", "p": ""}, {"id": "HI-133", "s": "한국사", "t": "단편", "g": 2, "d": "상", "q": "1907년에 일어난 정미의병에 대한 설명으로 옳은 것은?", "c": ["을미사변과 단발령에 반발하여 일어났다.", "고종의 해산 권고로 대부분 해산하였다.", "평민 의병장이 처음 등장하였다.", "해산된 군인이 합류하여 전투력이 강화되었고 13도 창의군이 서울 진공 작전을 펼쳤다.", "을사늑약 체결에 반발하여 최익현이 주도하였다."], "a": 4, "e": "정미의병은 고종 강제 퇴위와 군대 해산을 계기로 일어났다. 을미의병은 을미사변·단발령, 을사의병은 을사늑약이 계기이며 평민 의병장 신돌석은 을사의병 때 활약하였다.", "p": ""}, {"id": "HI-134", "s": "한국사", "t": "단편", "g": 2, "d": "상", "q": "1920년에 일제가 회사령을 폐지한(허가제를 신고제로 바꾼) 목적으로 가장 적절한 것은?", "c": ["한국인의 민족 자본을 보호하려고", "일본 자본이 한국에 쉽게 진출할 수 있도록 하려고", "토지 소유권을 확인하려고", "쌀 생산량을 늘리려고", "한국인의 정치 참여를 확대하려고"], "a": 2, "e": "일제는 제1차 세계 대전으로 성장한 일본 자본이 한국에 자유롭게 진출할 수 있도록 회사 설립을 신고제로 바꾸었다. 이에 맞서 한국인들은 물산 장려 운동을 벌였다.", "p": ""}, {"id": "HI-135", "s": "한국사", "t": "단편", "g": 2, "d": "상", "q": "1920년대 민립 대학 설립 운동에 대한 일제의 대응으로 옳은 것은?", "c": ["경성 제국 대학을 설립하여 한국인의 불만을 무마하려 하였다.", "조선 교육령을 폐지하였다.", "보통학교의 수업 연한을 줄였다.", "한국어를 필수 과목으로 지정하였다.", "사립 학교 설립을 전면 허용하였다."], "a": 1, "e": "이상재 등이 '한민족 1천만이 한 사람 1원씩'을 구호로 모금 운동을 벌이자, 일제는 이를 방해하고 경성 제국 대학을 세워 여론을 무마하려 하였다.", "p": ""}, {"id": "HI-136", "s": "한국사", "t": "단편", "g": 2, "d": "상", "q": "1930년대 전반 만주에서 전개된 한·중 연합 작전에 대한 설명으로 옳은 것은?", "c": ["김좌진의 북로 군정서가 청산리에서 승리하였다.", "홍범도 부대가 봉오동에서 승리하였다.", "지청천이 이끈 한국 독립군은 쌍성보와 대전자령에서 일본군을 물리쳤다.", "한국 광복군이 국내 진공 작전을 준비하였다.", "조선 의용대가 화북 지역에서 활동하였다."], "a": 3, "e": "만주 사변 이후 한국 독립군(지청천)은 중국 호로군과 쌍성보·대전자령에서, 조선 혁명군(양세봉)은 중국 의용군과 영릉가·흥경성에서 승리하였다.", "p": ""}, {"id": "HI-137", "s": "한국사", "t": "단편", "g": 2, "d": "상", "q": "1938년 김원봉이 중국 한커우에서 조직한, 중국 관내 최초의 한인 무장 부대는?", "c": ["한국 광복군", "대한 독립군", "조선 혁명군", "북로 군정서", "조선 의용대"], "a": 5, "e": "조선 의용대는 중국 국민당 정부의 지원을 받아 조직되었다. 이후 일부는 화북으로 이동하고, 김원봉 등 나머지는 한국 광복군에 합류하였다.", "p": ""}, {"id": "HI-138", "s": "한국사", "t": "단편", "g": 2, "d": "상", "q": "'한국통사'와 '한국독립운동지혈사'를 저술하고 민족정신으로 '국혼'을 강조한 역사학자는?", "c": ["신채호", "백남운", "박은식", "정인보", "최남선"], "a": 3, "e": "박은식은 '나라는 형체이고 역사는 정신'이라며 국혼을 강조하였다. 신채호는 '조선상고사'에서 역사를 아(我)와 비아(非我)의 투쟁으로 보았고, 백남운은 사회 경제 사학을 대표한다.", "p": ""}, {"id": "HI-139", "s": "한국사", "t": "수능", "g": 2, "d": "상", "q": "다음 사건을 일어난 순서대로 바르게 나열한 것은?<div class='box'>(가) 갑신정변<br>(나) 임오군란<br>(다) 을미사변<br>(라) 동학 농민 운동</div>", "c": ["(가)-(나)-(라)-(다)", "(나)-(가)-(다)-(라)", "(나)-(가)-(라)-(다)", "(나)-(라)-(가)-(다)", "(라)-(나)-(가)-(다)"], "a": 3, "e": "임오군란(1882) → 갑신정변(1884) → 동학 농민 운동(1894) → 을미사변(1895)의 순서이다.", "p": ""}, {"id": "HI-140", "s": "한국사", "t": "수능", "g": 2, "d": "상", "q": "다음 자료와 관련된 운동에 대한 설명으로 옳은 것은?<div class='box'>\"공평은 사회의 근본이요, 애정은 인류의 본령이다. 그러므로 우리는 계급을 타파하고 모욕적 칭호를 폐지하여 우리도 참다운 인간이 되기를 바란다.\"<br>- 1923년 진주에서 창립된 단체의 취지문</div>", "c": ["백정에 대한 사회적 차별을 없애고자 하였다.", "소작료 인하를 요구하였다.", "여성의 지위 향상을 목표로 하였다.", "국산품 애용을 주장하였다.", "어린이날을 제정하였다."], "a": 1, "e": "자료는 조선 형평사의 취지문이다. 갑오개혁으로 신분제가 폐지된 뒤에도 계속된 백정에 대한 차별을 없애려는 형평 운동이 진주에서 시작되어 전국으로 퍼졌다.", "p": ""}, {"id": "HI-141", "s": "한국사", "t": "수능", "g": 2, "d": "상", "q": "다음 법이 제정된 목적으로 가장 적절한 것은?<div class='box'>제1조 국체를 변혁하거나 사유 재산 제도를 부인할 목적으로 결사를 조직하거나 그 사정을 알고 가입한 자는 10년 이하의 징역 또는 금고에 처한다. (1925년)</div>", "c": ["일본인의 토지 소유를 확대하려고", "사회주의 운동과 독립운동을 탄압하려고", "한국인을 전쟁에 동원하려고", "한국인의 회사 설립을 막으려고", "신문 발행을 허가하려고"], "a": 2, "e": "자료는 치안 유지법이다. 일제는 사회주의 운동을 탄압한다는 명분으로 이 법을 만들었으나, 실제로는 독립운동 전반을 탄압하는 데 이용하였다.", "p": ""}, {"id": "HI-142", "s": "한국사", "t": "단편", "g": 3, "d": "하", "q": "단군왕검이 세웠다고 전해지는 우리 역사상 최초의 국가는?", "c": ["부여", "고구려", "삼한", "고조선", "가야"], "a": 4, "e": "고조선은 청동기 문화를 바탕으로 세워진 우리 역사상 최초의 국가이다.", "p": ""}, {"id": "HI-143", "s": "한국사", "t": "단편", "g": 3, "d": "하", "q": "고려 시대에 인쇄된 것으로, 현재 전하는 세계에서 가장 오래된 금속 활자본은?", "c": ["무구정광대다라니경", "팔만대장경", "상정고금예문", "삼국유사", "직지심체요절"], "a": 5, "e": "직지심체요절은 1377년 청주 흥덕사에서 금속 활자로 인쇄되었다. 무구정광대다라니경은 현존하는 가장 오래된 목판 인쇄물이다.", "p": ""}, {"id": "HI-144", "s": "한국사", "t": "단편", "g": 3, "d": "하", "q": "조선의 수도로, 지금의 서울에 해당하는 곳은?", "c": ["개경", "한양", "평양", "사비", "금성"], "a": 2, "e": "조선은 건국 뒤 한양으로 도읍을 옮기고 경복궁과 종묘, 사직 등을 세웠다.", "p": ""}, {"id": "HI-145", "s": "한국사", "t": "단편", "g": 3, "d": "하", "q": "임진왜란이 일어난 해는?", "c": ["1392년", "1636년", "1592년", "1876년", "1894년"], "a": 3, "e": "임진왜란은 1592년 일본의 침략으로 시작되었다. 1636년은 병자호란, 1876년은 강화도 조약, 1894년은 동학 농민 운동과 갑오개혁이 있었던 해이다.", "p": ""}, {"id": "HI-146", "s": "한국사", "t": "단편", "g": 3, "d": "하", "q": "흥선 대원군이 왕실의 권위를 높이기 위해 다시 지은 궁궐은?", "c": ["창덕궁", "덕수궁", "창경궁", "경희궁", "경복궁"], "a": 5, "e": "흥선 대원군은 임진왜란 때 불탄 경복궁을 중건하였다. 이 과정에서 원납전을 걷고 당백전을 발행하여 백성의 원망을 샀다.", "p": ""}, {"id": "HI-147", "s": "한국사", "t": "단편", "g": 3, "d": "하", "q": "3·1 운동이 일어난 해는?", "c": ["1919년", "1910년", "1926년", "1929년", "1945년"], "a": 1, "e": "3·1 운동은 1919년에 일어난 거족적인 독립운동으로, 대한민국 임시 정부 수립의 계기가 되었다.", "p": ""}, {"id": "HI-148", "s": "한국사", "t": "단편", "g": 3, "d": "하", "q": "광복 직후 북위 38도선 이남 지역에서 군정을 실시한 나라는?", "c": ["소련", "영국", "중국", "미국", "프랑스"], "a": 4, "e": "일본이 패망한 뒤 38도선을 경계로 남쪽에는 미군, 북쪽에는 소련군이 들어왔다. 남쪽에서는 미군정이 실시되었다.", "p": ""}, {"id": "HI-149", "s": "한국사", "t": "단편", "g": 3, "d": "하", "q": "6·25 전쟁이 시작된 계기는?", "c": ["중국군의 참전", "1950년 6월 25일 북한의 남침", "인천 상륙 작전", "유엔군의 북진", "정전 협정 체결"], "a": 2, "e": "6·25 전쟁은 1950년 6월 25일 북한의 기습 남침으로 시작되었다.", "p": ""}, {"id": "HI-150", "s": "한국사", "t": "단편", "g": 3, "d": "하", "q": "6·25 전쟁 때 전세를 뒤집은 인천 상륙 작전을 지휘한 유엔군 사령관은?", "c": ["아이젠하워", "맥아더", "트루먼", "하지", "애치슨"], "a": 2, "e": "맥아더가 지휘한 유엔군과 국군은 1950년 9월 인천 상륙 작전에 성공하여 서울을 되찾고 압록강 부근까지 북진하였다.", "p": ""}, {"id": "HI-151", "s": "한국사", "t": "단편", "g": 3, "d": "하", "q": "1980년 5월 신군부의 비상계엄 확대에 맞서 민주화 운동이 일어난 도시는?", "c": ["부산", "마산", "대구", "광주", "대전"], "a": 4, "e": "5·18 민주화 운동은 광주에서 일어났으며, 관련 기록물은 유네스코 세계 기록 유산으로 등재되었다.", "p": ""}, {"id": "HI-152", "s": "한국사", "t": "단편", "g": 3, "d": "하", "q": "2000년 평양에서 분단 이후 첫 남북 정상 회담을 한 대한민국의 대통령은?", "c": ["김영삼", "노태우", "김대중", "노무현", "전두환"], "a": 3, "e": "김대중 대통령은 2000년 평양에서 김정일 국방 위원장과 만나 6·15 남북 공동 선언을 발표하였다.", "p": ""}, {"id": "HI-153", "s": "한국사", "t": "단편", "g": 3, "d": "하", "q": "1972년 유신 헌법을 선포하여 장기 집권을 꾀한 대통령은?", "c": ["이승만", "윤보선", "최규하", "박정희", "전두환"], "a": 4, "e": "박정희 정부는 1972년 10월 유신을 선포하고 대통령에게 권한을 집중한 유신 헌법을 만들었다.", "p": ""}, {"id": "HI-154", "s": "한국사", "t": "수능", "g": 3, "d": "하", "q": "다음 자료와 관련된 사건은?<div class='box'>1960년 3월 15일 정·부통령 선거에서 부정이 저질러지자 마산에서 항의 시위가 일어났다. 4월에 실종되었던 김주열 학생의 시신이 발견되면서 시위는 전국으로 번졌다.</div>", "c": ["5·16 군사 정변", "부·마 민주 항쟁", "4·19 혁명", "5·18 민주화 운동", "6월 민주 항쟁"], "a": 3, "e": "3·15 부정 선거에 대한 항의는 4·19 혁명으로 이어졌고, 그 결과 이승만 대통령이 물러났다.", "p": ""}, {"id": "HI-155", "s": "한국사", "t": "단편", "g": 3, "d": "중", "q": "1948년 5·10 총선거에 대한 설명으로 옳은 것은?", "c": ["남북한 전 지역에서 실시되었다.", "김구와 김규식이 적극 참여하였다.", "대통령을 국민이 직접 선출하였다.", "임기 4년의 국회의원을 뽑았다.", "우리나라 최초의 보통 선거로, 제헌 국회를 구성하였다."], "a": 5, "e": "5·10 총선거는 남한 지역에서만 실시된 최초의 보통 선거이다. 김구·김규식 등 남북 협상파는 불참하였고, 임기 2년의 제헌 국회의원이 선출되어 국회에서 대통령을 뽑았다.", "p": ""}, {"id": "HI-156", "s": "한국사", "t": "단편", "g": 3, "d": "중", "q": "이승만 정부가 실시한 농지 개혁에 대한 설명으로 옳은 것은?", "c": ["무상 몰수·무상 분배 방식으로 실시되었다.", "산림과 임야도 분배 대상에 포함되었다.", "지주의 토지 소유를 더욱 확대하였다.", "유상 매수·유상 분배 원칙에 따라 3정보를 상한으로 실시되었다.", "6·25 전쟁 이후에 법이 처음 만들어졌다."], "a": 4, "e": "농지 개혁법(1949 제정, 1950 시행)은 가구당 3정보를 넘는 농지를 국가가 사들여 농민에게 유상으로 분배하였다. 이로써 자작농이 크게 늘었다. 무상 몰수·무상 분배는 북한의 토지 개혁 방식이다.", "p": ""}, {"id": "HI-157", "s": "한국사", "t": "단편", "g": 3, "d": "중", "q": "6·25 전쟁 중이던 1952년에 이루어진 '발췌 개헌'의 핵심 내용은?", "c": ["내각 책임제", "대통령 3선 허용", "대통령 간선제", "대통령 단임제", "대통령 직선제"], "a": 5, "e": "이승만 대통령은 국회 간선으로는 재선이 어렵다고 보고, 임시 수도 부산에서 계엄령을 내린 채 대통령 직선제를 담은 발췌 개헌안을 통과시켰다.", "p": ""}, {"id": "HI-158", "s": "한국사", "t": "단편", "g": 3, "d": "중", "q": "1954년 '사사오입 개헌'의 내용으로 옳은 것은?", "c": ["개헌 당시의 대통령에 한해 중임 제한을 없앴다.", "대통령을 국회에서 뽑도록 하였다.", "내각 책임제를 도입하였다.", "대통령 임기를 7년으로 늘렸다.", "통일 주체 국민 회의를 설치하였다."], "a": 1, "e": "자유당은 초대 대통령에 한해 중임 제한을 없애는 개헌안이 1표 차로 부결되자 '사사오입(반올림)' 논리를 내세워 통과시켰다.", "p": ""}, {"id": "HI-159", "s": "한국사", "t": "단편", "g": 3, "d": "중", "q": "4·19 혁명 이후 수립된 장면 내각 시기의 정부 형태는?", "c": ["대통령 중심제와 단원제 국회", "대통령 간선제와 긴급 조치", "군사 정부", "내각 책임제와 양원제 국회", "대통령 직선제와 5년 단임제"], "a": 4, "e": "4·19 혁명 뒤 헌법이 내각 책임제와 양원제(민의원·참의원)로 바뀌었고, 윤보선 대통령과 장면 국무총리의 민주당 정부가 들어섰다.", "p": ""}, {"id": "HI-160", "s": "한국사", "t": "단편", "g": 3, "d": "중", "q": "1964년 박정희 정부의 한·일 회담 추진에 반대하여 학생과 시민이 벌인 시위는?", "c": ["4·19 혁명", "부·마 민주 항쟁", "6월 민주 항쟁", "3선 개헌 반대 운동", "6·3 시위"], "a": 5, "e": "박정희 정부가 경제 개발 자금을 마련하려고 한·일 국교 정상화를 추진하자, 학생과 시민들은 '굴욕 외교'라며 6·3 시위를 벌였다. 한·일 협정은 1965년에 체결되었다.", "p": ""}, {"id": "HI-161", "s": "한국사", "t": "단편", "g": 3, "d": "중", "q": "박정희 정부 시기의 사실로 <u>옳지 않은</u> 것은?", "c": ["경제 개발 5개년 계획을 추진하였다.", "경부 고속 국도를 개통하였다.", "금융 실명제를 실시하였다.", "베트남에 국군을 파병하였다.", "새마을 운동을 시작하였다."], "a": 3, "e": "금융 실명제는 1993년 김영삼 정부가 실시하였다. 나머지는 모두 박정희 정부 시기(1960~70년대)의 사실이다.", "p": ""}, {"id": "HI-162", "s": "한국사", "t": "단편", "g": 3, "d": "중", "q": "1972년 7·4 남북 공동 성명에서 합의한 통일의 3대 원칙은?", "c": ["자유, 평등, 박애", "자주, 평화, 민족 대단결", "반공, 승공, 멸공", "민주, 자립, 복지", "화해, 불가침, 교류"], "a": 2, "e": "7·4 남북 공동 성명은 분단 이후 남북이 처음으로 합의한 통일 원칙으로, 자주·평화·민족 대단결을 내세웠다.", "p": ""}, {"id": "HI-163", "s": "한국사", "t": "단편", "g": 3, "d": "중", "q": "1979년 12·12 사태를 일으켜 군권을 장악한 세력은?", "c": ["박정희 등 5·16 군사 정변 세력", "전두환, 노태우 등 신군부", "자유당 정권", "유엔군 사령부", "민주당 구파"], "a": 2, "e": "10·26 사태로 박정희 대통령이 사망한 뒤, 전두환·노태우 등 신군부가 12·12 사태를 일으켜 군사권을 장악하였다.", "p": ""}, {"id": "HI-164", "s": "한국사", "t": "단편", "g": 3, "d": "중", "q": "1987년 6월 민주 항쟁의 배경으로 옳은 것은?", "c": ["3·15 부정 선거", "박종철 고문 치사 사건과 4·13 호헌 조치", "유신 헌법 선포", "YH 무역 사건", "한·일 협정 체결"], "a": 2, "e": "박종철 고문 치사 사건이 드러나고 전두환 정부가 직선제 개헌 논의를 금지하는 4·13 호헌 조치를 발표하자, '호헌 철폐, 독재 타도'를 외치는 6월 민주 항쟁이 일어났다.", "p": ""}, {"id": "HI-165", "s": "한국사", "t": "단편", "g": 3, "d": "중", "q": "김영삼 정부 시기의 사실로 옳은 것은?", "c": ["서울 올림픽을 개최하였다.", "개성 공단 건설에 합의하였다.", "남북한이 유엔에 동시 가입하였다.", "금융 실명제를 실시하고 지방 자치제를 전면 시행하였다.", "제1차 경제 개발 5개년 계획을 시작하였다."], "a": 4, "e": "김영삼 정부는 금융 실명제, 지방 자치제 전면 실시, 경제 협력 개발 기구(OECD) 가입 등을 추진하였으나 임기 말 외환 위기를 맞았다.", "p": ""}, {"id": "HI-166", "s": "한국사", "t": "단편", "g": 3, "d": "중", "q": "노태우 정부 시기의 사실로 옳은 것은?", "c": ["6·15 남북 공동 선언을 발표하였다.", "금강산 관광을 시작하였다.", "7·4 남북 공동 성명을 발표하였다.", "남북 이산가족 상봉을 처음 성사시켰다.", "북방 외교를 추진하여 소련·중국과 수교하고, 남북 기본 합의서를 채택하였다."], "a": 5, "e": "노태우 정부는 북방 외교로 소련(1990)·중국(1992)과 수교하였고, 1991년 남북한 유엔 동시 가입과 남북 기본 합의서 채택이 이루어졌다. 최초의 이산가족 상봉은 1985년 전두환 정부 때이다.", "p": ""}, {"id": "HI-167", "s": "한국사", "t": "단편", "g": 3, "d": "중", "q": "1961년 5·16 군사 정변 직후 군부 세력이 만든 최고 통치 기구는?", "c": ["통일 주체 국민 회의", "국가 재건 최고 회의", "국가 보위 비상 대책 위원회", "반민족 행위 특별 조사 위원회", "조선 건국 준비 위원회"], "a": 2, "e": "박정희를 중심으로 한 군부 세력은 정변 직후 국가 재건 최고 회의를 구성하여 군정을 실시하였다. 국가 보위 비상 대책 위원회는 1980년 신군부가 만든 기구이다.", "p": ""}, {"id": "HI-168", "s": "한국사", "t": "수능", "g": 3, "d": "중", "q": "다음 자료의 상황에서 김구가 한 활동으로 옳은 것은?<div class='box'>미·소 공동 위원회가 결렬되자 한국 문제는 유엔으로 넘어갔다. 1948년 2월 유엔 소총회는 '선거가 가능한 지역에서만이라도 총선거를 실시한다'고 결의하였다.</div>", "c": ["좌우 합작 위원회를 조직하였다.", "조선 건국 준비 위원회를 결성하였다.", "5·10 총선거에 출마하여 당선되었다.", "초대 대통령으로 선출되었다.", "김규식과 함께 평양으로 가서 남북 협상에 참여하였다."], "a": 5, "e": "남한만의 단독 선거가 결정되자 김구와 김규식은 분단을 막기 위해 1948년 4월 평양에서 열린 남북 협상에 참여하였다. 좌우 합작 위원회는 여운형과 김규식이 주도하였다.", "p": ""}, {"id": "HI-169", "s": "한국사", "t": "단편", "g": 3, "d": "상", "q": "광복 직후 여운형이 중심이 되어 조직한 조선 건국 준비 위원회에 대한 설명으로 옳은 것은?", "c": ["미군정의 지원을 받아 결성되었다.", "신탁 통치 반대 운동을 주도하였다.", "5·10 총선거를 관리하였다.", "반민족 행위자를 조사하고 처벌하였다.", "치안대를 조직하여 질서 유지에 힘썼고, 이후 조선 인민 공화국 수립을 선포하였다."], "a": 5, "e": "조선 건국 준비 위원회는 광복과 동시에 조직되어 전국에 지부를 두고 치안과 행정을 맡았다. 미군이 들어오기 직전 조선 인민 공화국을 선포하였으나 미군정은 이를 인정하지 않았다.", "p": ""}, {"id": "HI-170", "s": "한국사", "t": "단편", "g": 3, "d": "상", "q": "제주 4·3 사건에 대한 설명으로 옳은 것은?", "c": ["남한만의 단독 선거에 반대하는 무장봉기와 이를 진압하는 과정에서 많은 주민이 희생되었다.", "6·25 전쟁 중에 일어났다.", "3·15 부정 선거에 항의하여 일어났다.", "신탁 통치 결정에 반대하여 일어났다.", "유신 체제에 저항하여 일어났다."], "a": 1, "e": "1948년 4월 3일 제주도에서 단독 선거 반대 등을 내세운 무장봉기가 일어났고, 진압 과정에서 수많은 주민이 희생되었다. 이 때문에 제주도 일부 선거구에서는 5·10 총선거가 제대로 치러지지 못하였다.", "p": ""}, {"id": "HI-171", "s": "한국사", "t": "단편", "g": 3, "d": "상", "q": "1950년 1월 발표된 '애치슨 선언'의 내용으로 옳은 것은?", "c": ["한국에 대한 신탁 통치를 결정하였다.", "유엔군의 한국 파병을 결정하였다.", "한·미 상호 방위 조약을 체결하였다.", "미국의 태평양 방위선에서 한반도와 타이완을 제외하였다.", "38도선을 군사 분계선으로 정하였다."], "a": 4, "e": "미국 국무 장관 애치슨은 미국의 태평양 방위선을 알류샨 열도-일본-오키나와-필리핀으로 설정하여 한반도를 제외하였다. 이는 북한이 남침을 결심하는 배경 가운데 하나가 되었다.", "p": ""}, {"id": "HI-172", "s": "한국사", "t": "단편", "g": 3, "d": "상", "q": "1969년 '3선 개헌'의 내용으로 옳은 것은?", "c": ["대통령을 통일 주체 국민 회의에서 뽑도록 하였다.", "내각 책임제를 도입하였다.", "대통령 임기를 7년 단임으로 하였다.", "대통령 직선제를 처음 도입하였다.", "대통령의 3회 연임을 허용하였다."], "a": 5, "e": "박정희 정부는 대통령의 3회 연임을 허용하는 개헌안을 여당 의원만으로 변칙 통과시켰고, 박정희는 1971년 대통령 선거에서 다시 당선되었다.", "p": ""}, {"id": "HI-173", "s": "한국사", "t": "단편", "g": 3, "d": "상", "q": "1979년 부·마 민주 항쟁에 대한 설명으로 옳은 것은?", "c": ["대통령 직선제 개헌을 이끌어 냈다.", "YH 무역 사건과 야당 총재의 국회의원 제명을 계기로 일어나 유신 체제 붕괴에 영향을 주었다.", "이승만 대통령의 하야를 가져왔다.", "신군부의 비상계엄 확대에 맞서 일어났다.", "한·일 협정 체결에 반대하여 일어났다."], "a": 2, "e": "YH 무역 사건을 비판한 김영삼 신민당 총재가 국회에서 제명되자 부산과 마산에서 유신 반대 시위가 일어났다. 이 과정에서 권력 내부의 갈등이 커져 10·26 사태로 유신 체제가 무너졌다.", "p": ""}, {"id": "HI-174", "s": "한국사", "t": "단편", "g": 3, "d": "상", "q": "1970년 서울 평화 시장의 노동자 전태일이 분신하며 요구한 것은?", "c": ["대통령 직선제 개헌", "유신 헌법 철폐", "근로 기준법 준수", "농지 개혁 실시", "지방 자치제 실시"], "a": 3, "e": "전태일은 '근로 기준법을 준수하라, 우리는 기계가 아니다'라고 외치며 분신하였다. 이 사건은 저임금·장시간 노동에 의존한 경제 성장의 그늘을 드러내고 노동 운동이 활발해지는 계기가 되었다.", "p": ""}, {"id": "HI-175", "s": "한국사", "t": "단편", "g": 3, "d": "상", "q": "1980년대 중·후반 우리 경제가 크게 성장하는 배경이 된 '3저 호황'의 세 가지 요소는?", "c": ["저임금, 저물가, 저금리", "저유가, 저달러, 저금리", "저환율, 저관세, 저임금", "저유가, 저임금, 저출생", "저달러, 저물가, 저세율"], "a": 2, "e": "1980년대 중반 국제 유가 하락, 달러 가치 하락, 국제 금리 하락이라는 유리한 조건 속에서 수출이 크게 늘어 무역 수지 흑자를 기록하였다.", "p": ""}, {"id": "HI-176", "s": "한국사", "t": "단편", "g": 3, "d": "상", "q": "김대중 정부 시기의 사실로 옳은 것은?", "c": ["남북 기본 합의서를 채택하였다.", "금융 실명제를 실시하였다.", "한·미 자유 무역 협정(FTA)을 체결하였다.", "국제 통화 기금(IMF)의 지원금을 일찍 갚았고, 금강산 관광을 시작하였다.", "남북한이 유엔에 동시 가입하였다."], "a": 4, "e": "김대중 정부는 구조 조정과 국민의 금 모으기 운동 등으로 외환 위기를 극복하였고, 햇볕 정책을 추진하여 금강산 관광 시작(1998), 남북 정상 회담(2000) 등의 성과를 거두었다.", "p": ""}, {"id": "HI-177", "s": "한국사", "t": "단편", "g": 3, "d": "상", "q": "독도에 대한 설명으로 <u>옳지 않은</u> 것은?", "c": ["신라 지증왕 때 이사부가 우산국을 복속하였다.", "조선 숙종 때 안용복이 일본에 건너가 우리 영토임을 확인받았다.", "대한 제국은 칙령 제41호로 울도 군수가 독도를 관할하도록 하였다.", "일본은 러·일 전쟁 중 독도를 불법적으로 자국 영토에 편입하였다.", "간도 협약에 따라 일본의 영토로 인정되었다."], "a": 5, "e": "간도 협약(1909)은 일본이 남만주 철도 부설권 등을 얻는 대가로 간도를 청의 영토로 인정한 것으로, 독도와는 관계가 없다. 독도는 역사적·지리적·국제법적으로 명백한 우리 영토이다.", "p": ""}, {"id": "HI-178", "s": "한국사", "t": "수능", "g": 3, "d": "상", "q": "다음 개헌을 이루어진 순서대로 바르게 나열한 것은?<div class='box'>(가) 유신 헌법<br>(나) 발췌 개헌<br>(다) 3선 개헌<br>(라) 사사오입 개헌</div>", "c": ["(나)-(다)-(라)-(가)", "(나)-(라)-(가)-(다)", "(나)-(라)-(다)-(가)", "(라)-(나)-(다)-(가)", "(라)-(나)-(가)-(다)"], "a": 3, "e": "발췌 개헌(1952) → 사사오입 개헌(1954) → 3선 개헌(1969) → 유신 헌법(1972)의 순서이다.", "p": ""}, {"id": "HI-179", "s": "한국사", "t": "수능", "g": 3, "d": "상", "q": "다음 선언이 발표된 이후의 사실로 옳은 것은?<div class='box'>1. 남과 북은 나라의 통일 문제를 우리 민족끼리 서로 힘을 합쳐 자주적으로 해결해 나가기로 하였다.<br>2. 남과 북은 남측의 연합제 안과 북측의 낮은 단계의 연방제 안이 서로 공통성이 있다고 인정하였다.</div>", "c": ["개성 공단이 조성되고 경의선 철도 연결 사업이 추진되었다.", "남북한이 유엔에 동시 가입하였다.", "남북 기본 합의서가 채택되었다.", "남북 조절 위원회가 설치되었다.", "최초의 이산가족 고향 방문이 이루어졌다."], "a": 1, "e": "자료는 6·15 남북 공동 선언(2000)이다. 이후 개성 공단 조성, 경의선 연결 등 교류가 확대되었다. 유엔 동시 가입과 기본 합의서는 1991년, 남북 조절 위원회는 1972년, 첫 이산가족 방문은 1985년의 일이다.", "p": ""}, {"id": "HI-180", "s": "한국사", "t": "수능", "g": 3, "d": "상", "q": "다음 자료에 나타난 시기의 경제 상황으로 옳은 것은?<div class='box'>정부는 철강, 조선, 기계, 석유 화학 등의 산업을 집중 육성하였다. 포항 제철이 가동되고 울산·창원 등에 대규모 공업 단지가 들어섰으며, 1977년에는 수출 100억 달러를 달성하였다.</div>", "c": ["미국의 원조 물자를 바탕으로 삼백 산업이 발달하였다.", "두 차례의 석유 파동으로 경제적 어려움을 겪었다.", "3저 호황으로 무역 흑자를 기록하였다.", "국제 통화 기금의 구제 금융을 받았다.", "경제 협력 개발 기구에 가입하였다."], "a": 2, "e": "자료는 1970년대 중화학 공업화 시기이다. 이 시기에는 제1·2차 석유 파동(1973, 1978~79)으로 어려움을 겪었다. 삼백 산업은 1950년대, 3저 호황은 1980년대, 구제 금융과 OECD 가입은 1990년대의 일이다.", "p": ""}, {"id": "SO-001", "s": "통합사회", "t": "단편", "g": 1, "d": "하", "q": "'행복은 인간 삶의 궁극적 목적이자 최고선'이라고 보고, 이성에 따른 덕 있는 활동을 통해 행복에 이를 수 있다고 주장한 사상가는?", "c": ["아리스토텔레스", "칸트", "벤담", "홉스", "마르크스"], "a": 1, "e": "아리스토텔레스는 행복을 그 자체로 추구되는 최고선으로 보고, 이성에 따른 덕(탁월성)의 실천을 통해 행복에 도달한다고 보았다.", "p": ""}, {"id": "SO-002", "s": "통합사회", "t": "단편", "g": 1, "d": "하", "q": "연중 기온이 높고 강수량이 많으며, 오후에 스콜이 자주 내리는 기후는?", "c": ["사막 기후", "열대 우림 기후", "지중해성 기후", "툰드라 기후", "온대 겨울 건조 기후"], "a": 2, "e": "열대 우림 기후는 적도 부근에 분포하며 연중 고온 다습하고 대류성 강수인 스콜이 자주 내린다.", "p": ""}, {"id": "SO-003", "s": "통합사회", "t": "단편", "g": 1, "d": "중", "q": "인간다운 생활을 보장받을 권리인 사회권을 처음으로 명시한 헌법은?", "c": ["미국 독립 선언", "바이마르 헌법", "프랑스 인권 선언", "영국 권리 장전", "세계 인권 선언"], "a": 2, "e": "1919년 독일의 바이마르 헌법은 사회권을 최초로 규정한 헌법이다. 미국 독립 선언, 프랑스 인권 선언, 영국 권리 장전은 자유권 중심의 문서이다.", "p": ""}, {"id": "SO-004", "s": "통합사회", "t": "단편", "g": 1, "d": "중", "q": "다음 중 긍정적 외부 효과의 사례로 가장 적절한 것은?", "c": ["양봉업자의 벌 덕분에 이웃 과수원의 열매가 많이 열렸다.", "공장 폐수로 하천이 오염되었다.", "독점 기업이 가격을 크게 올렸다.", "흡연으로 주변 사람들이 피해를 입었다.", "정부가 최저 임금을 인상하였다."], "a": 1, "e": "외부 효과는 어떤 경제 활동이 대가 없이 제3자에게 이익이나 손해를 주는 현상이다. 양봉업자가 의도치 않게 과수원에 이익을 준 것은 긍정적 외부 효과(외부 경제)이다. 폐수와 흡연은 부정적 외부 효과이다.", "p": ""}, {"id": "SO-005", "s": "통합사회", "t": "단편", "g": 1, "d": "중", "q": "사회 계약 당사자들이 자신의 처지를 모르는 '무지의 베일' 상태에서 정의의 원칙을 합의한다고 본 사상가는?", "c": ["노직", "롤스", "왈처", "매킨타이어", "샌델"], "a": 2, "e": "롤스는 원초적 입장에서 무지의 베일을 쓴 사람들이 합의하는 원칙이 공정한 정의의 원칙이라고 보았다.", "p": ""}, {"id": "SO-006", "s": "통합사회", "t": "단편", "g": 1, "d": "하", "q": "자기 문화만이 우월하다고 여기고 다른 문화를 낮게 평가하는 태도는?", "c": ["자문화 중심주의", "문화 상대주의", "문화 사대주의", "극단적 문화 상대주의", "문화 다원주의"], "a": 1, "e": "자기 문화를 기준으로 다른 문화를 평가하며 자기 문화가 우월하다고 보는 태도는 자문화 중심주의이다. 문화 사대주의는 반대로 다른 문화를 동경하며 자기 문화를 낮게 보는 태도이다.", "p": ""}, {"id": "SO-007", "s": "통합사회", "t": "단편", "g": 1, "d": "중", "q": "다국적 기업의 공간적 분업에 대한 설명으로 가장 적절한 것은?", "c": ["생산 공장은 노동비가 저렴하거나 시장 확보에 유리한 지역에 둔다.", "본사는 주로 노동비가 저렴한 개발 도상국에 둔다.", "생산 공장은 주로 자본과 고급 인력이 풍부한 선진국에 둔다.", "연구소는 주로 원료 산지 가까이에 둔다.", "모든 기능을 한 국가에 집중시킨다."], "a": 1, "e": "다국적 기업은 본사와 연구소를 자본·정보·고급 인력이 풍부한 선진국에, 생산 공장을 노동비가 저렴하거나 무역 장벽을 피해 시장을 확보하기 유리한 지역에 두는 경향이 있다.", "p": ""}, {"id": "SO-008", "s": "통합사회", "t": "단편", "g": 1, "d": "중", "q": "1992년 브라질 리우데자네이루에서 열린 유엔 환경 개발 회의에서 채택된 지속 가능 발전 실천 계획은?", "c": ["교토 의정서", "파리 협정", "몬트리올 의정서", "바젤 협약", "의제 21"], "a": 5, "e": "리우 회의에서는 '환경적으로 건전하고 지속 가능한 발전'을 위한 실천 계획인 의제 21(Agenda 21)이 채택되었다. 몬트리올 의정서는 오존층 파괴 물질 규제, 바젤 협약은 유해 폐기물 이동 규제에 관한 것이다.", "p": ""}, {"id": "SO-009", "s": "통합사회", "t": "단편", "g": 1, "d": "중", "q": "다음 기본권 중 '청구권'에 해당하는 것은?", "c": ["선거권", "교육을 받을 권리", "신체의 자유", "평등권", "청원권"], "a": 5, "e": "청구권은 기본권이 침해되었을 때 국가에 일정한 행위를 요구하는 권리로 청원권, 재판 청구권, 국가 배상 청구권, 형사 보상 청구권 등이 있다. 선거권은 참정권, 교육을 받을 권리는 사회권이다.", "p": ""}, {"id": "SO-010", "s": "통합사회", "t": "단편", "g": 1, "d": "하", "q": "다음 금융 자산 중 일반적으로 안전성이 가장 높은 것은?", "c": ["주식", "예금", "펀드", "가상 자산", "회사채"], "a": 2, "e": "예금은 원금 손실 위험이 낮아 안전성이 높지만 수익성은 낮은 편이다. 주식은 수익성이 높을 수 있지만 가격 변동이 커서 안전성이 낮다.", "p": ""}, {"id": "SO-011", "s": "통합사회", "t": "단편", "g": 1, "d": "중", "q": "2015년 채택되어 선진국과 개발 도상국 모두에게 온실가스 감축 의무를 부여한 기후 변화 협약은?", "c": ["교토 의정서", "람사르 협약", "파리 협정", "런던 협약", "사막화 방지 협약"], "a": 3, "e": "파리 협정(2015)은 모든 당사국이 자발적으로 감축 목표를 정해 이행하도록 하였다. 교토 의정서(1997)는 주로 선진국에만 감축 의무를 부과하였다.", "p": ""}, {"id": "SO-012", "s": "통합사회", "t": "단편", "g": 1, "d": "하", "q": "전체 인구 중 65세 이상 인구 비율이 15%인 사회는 국제 연합(UN)의 기준으로 무엇에 해당하는가?", "c": ["고령화 이전 사회", "고령화 사회", "초고령 사회", "고령 사회", "인구 절벽 사회"], "a": 4, "e": "UN 기준으로 65세 이상 인구 비율이 7% 이상이면 고령화 사회, 14% 이상이면 고령 사회, 20% 이상이면 초고령 사회이다.", "p": ""}, {"id": "SO-013", "s": "통합사회", "t": "수능", "g": 1, "d": "중", "q": "다음 사상가 갑, 을 중 을의 입장으로 가장 적절한 것은?\n<div class='box'>갑: 개인은 공동체보다 앞서는 존재이다. 국가는 개인의 자유와 권리를 보장하는 데 그쳐야 하며 특정한 좋은 삶을 강요해서는 안 된다.<br>을: 개인의 정체성은 그가 속한 공동체의 역사와 전통 속에서 형성된다. 공동선을 함께 추구할 때 개인의 삶도 의미를 가질 수 있다.</div>", "c": ["개인의 권리는 어떠한 경우에도 공동선보다 우선한다.", "개인은 공동체와 무관하게 자신의 정체성을 형성한다.", "공동체의 가치와 공동선을 중시해야 한다.", "국가는 시민의 삶에 대해 완전히 중립을 지켜야 한다.", "사회는 독립된 개인들의 단순한 집합에 불과하다."], "a": 3, "e": "갑은 자유주의, 을은 공동체주의 입장이다. 공동체주의는 개인이 공동체 속에서 정체성을 형성한다고 보며 공동선과 공동체의 가치를 중시한다. 나머지 선택지는 자유주의적 주장이다.", "p": ""}, {"id": "SO-014", "s": "통합사회", "t": "수능", "g": 1, "d": "상", "q": "다른 조건이 일정할 때, 다음 상황이 X재 시장에 미칠 영향으로 옳은 것은?\n<div class='box'>X재의 주요 원자재 가격이 크게 올라 X재의 생산 비용이 증가하였다.</div>", "c": ["수요가 증가하여 가격이 오른다.", "공급이 증가하여 거래량이 늘어난다.", "공급이 감소하여 가격이 오르고 거래량이 줄어든다.", "수요가 감소하여 가격과 거래량이 모두 줄어든다.", "가격과 거래량 모두 변하지 않는다."], "a": 3, "e": "생산 비용이 증가하면 공급이 감소(공급 곡선 왼쪽 이동)한다. 그 결과 균형 가격은 상승하고 균형 거래량은 감소한다.", "p": ""}, {"id": "SO-015", "s": "통합사회", "t": "수능", "g": 1, "d": "중", "q": "다음 자료에서 설명하는 분쟁 지역은?\n<div class='box'>이 지역은 1947년 영국으로부터 독립하는 과정에서 영토 귀속 문제가 해결되지 않아 분쟁이 시작되었다. 주민 다수는 이슬람교를 믿지만 힌두교 국가로 귀속된 부분이 있어, 두 나라 사이에 여러 차례 무력 충돌이 일어났다.</div>", "c": ["카슈미르", "팔레스타인", "쿠릴 열도", "난사 군도(스프래틀리 군도)", "북아일랜드"], "a": 1, "e": "카슈미르는 인도와 파키스탄이 분리 독립(1947)하는 과정에서 귀속 문제가 발생한 지역으로, 이슬람교도가 다수이지만 힌두교 중심의 인도와 이슬람교 중심의 파키스탄 사이에서 분쟁이 이어지고 있다.", "p": ""}, {"id": "SO-016", "s": "통합사회", "t": "수능", "g": 1, "d": "중", "q": "다음 자료에서 설명하는 사회 보장 제도로 옳은 것은?\n<div class='box'>• 질병, 노령, 실업, 산업 재해 등 사회적 위험에 대비한다.<br>• 국가가 법으로 가입을 의무화하고, 개인·기업·국가가 보험료를 함께 부담한다.<br>• 국민연금, 국민건강보험, 고용 보험 등이 해당한다.</div>", "c": ["공공 부조", "사회 서비스", "사회 보험", "민간 보험", "기본 소득"], "a": 3, "e": "강제 가입과 보험료 분담 원칙에 따라 사회적 위험에 대비하는 제도는 사회 보험이다. 공공 부조는 국가가 생활 능력이 없는 사람에게 비용을 전액 부담하여 지원하는 제도(국민 기초 생활 보장 등)이다.", "p": ""}, {"id": "SO-017", "s": "통합사회", "t": "수능", "g": 1, "d": "상", "q": "다음 사상가 갑의 입장으로 가장 적절한 것은?\n<div class='box'>갑: 정당한 절차를 거쳐 취득하거나 이전받은 재산에 대해 개인은 절대적인 권리를 가진다. 국가가 개인의 동의 없이 재산을 강제로 걷어 다른 사람에게 재분배하는 것은 정의롭지 못하다. 국가는 개인의 권리 보호에 그치는 최소 국가여야 한다.</div>", "c": ["사회적 약자에게 최대 이익이 돌아가도록 불평등을 조정해야 한다.", "분배 정의는 사회적 가치마다 다른 기준이 적용되어야 한다.", "취득과 이전 과정이 정당하다면 그 소유는 정의롭다.", "무지의 베일 속에서 합의된 원칙이 정의의 원칙이다.", "국가는 복지 확대를 위해 누진세를 강화해야 한다."], "a": 3, "e": "갑은 노직이다. 노직은 소유 권리 이론(취득·이전·교정의 원칙)을 제시하고 최소 국가를 주장했다. ①, ④는 롤스, ②는 왈처의 입장이다.", "p": ""}, {"id": "SO-018", "s": "통합사회", "t": "수능", "g": 1, "d": "중", "q": "다음 자료에 나타난 문화 변동의 양상은?\n<div class='box'>19세기 초 아메리카 원주민 체로키족의 세쿼이아는 백인들이 문자를 사용하는 것을 보고 아이디어를 얻어, 체로키어를 표기할 수 있는 독자적인 문자를 만들었다.</div>", "c": ["자극 전파", "직접 전파", "간접 전파", "발견", "문화 동화"], "a": 1, "e": "다른 문화 요소에서 아이디어를 얻어 새로운 문화 요소를 만들어 내는 것은 자극 전파이다. 문자 그 자체가 아니라 '문자를 쓴다'는 발상이 전해진 것이다.", "p": ""}, {"id": "SO-019", "s": "통합사회", "t": "수능", "g": 1, "d": "상", "q": "다음 사례에서 갑이 공연 관람을 선택한 것의 기회비용으로 옳은 것은? (단, 제시된 내용 외에는 고려하지 않는다.)\n<div class='box'>토요일 오후 갑은 시급 1만 원을 받고 3시간 동안 아르바이트를 할 수 있었지만, 무료로 열리는 3시간짜리 공연을 관람하기로 하였다. 공연장까지 가는 교통비는 들지 않았다.</div>", "c": ["0원", "1만 원", "2만 원", "3만 원", "4만 원"], "a": 4, "e": "공연은 무료라 명시적 비용은 0원이지만, 포기한 아르바이트 수입 3만 원(1만 원 × 3시간)이 암묵적 비용이다. 기회비용 = 명시적 비용 + 암묵적 비용 = 3만 원.", "p": ""}, {"id": "SO-020", "s": "통합사회", "t": "수능", "g": 1, "d": "중", "q": "다음 주장을 한 사상가의 자연관으로 가장 적절한 것은?\n<div class='box'>인간은 대지 공동체의 정복자가 아니라 그 공동체의 평범한 구성원이자 시민이다. 생명 공동체의 온전함, 안정성, 아름다움을 보전하는 경향이 있으면 옳고, 그렇지 않으면 그르다.</div>", "c": ["인간만이 도덕적 고려의 대상이다.", "자연은 인간의 필요를 충족하기 위한 도구이다.", "개별 동물의 고통만이 도덕적으로 중요하다.", "생태계 전체를 도덕적 고려의 대상으로 삼아야 한다.", "자연을 정복하는 것이 인간 진보의 핵심이다."], "a": 4, "e": "레오폴드의 '대지 윤리'로, 생태 중심주의 자연관이다. 도덕적 고려의 범위를 흙, 물, 동식물을 포함한 생태계 전체로 확대해야 한다고 본다. ①, ②, ⑤는 인간 중심주의, ③은 동물 중심주의에 가깝다.", "p": ""}, {"id": "SO-021", "s": "통합사회", "t": "단편", "g": 1, "d": "상", "q": "노동조합이 사용자와의 임금 협상이 결렬되자 법이 정한 절차에 따라 파업을 하였다. 이때 행사한 권리는?", "c": ["단결권", "단체 교섭권", "청원권", "재판 청구권", "단체 행동권"], "a": 5, "e": "노동 3권 가운데 근로 조건에 관한 주장을 관철하기 위해 파업 등 쟁의 행위를 할 수 있는 권리는 단체 행동권이다. 단결권은 노동조합을 만들고 가입할 권리, 단체 교섭권은 사용자와 근로 조건을 협상할 권리이다.", "p": ""}, {"id": "SO-022", "s": "통합사회", "t": "단편", "g": 1, "d": "상", "q": "이미 지출하여 다시 회수할 수 없으므로 합리적 선택을 할 때 고려하지 말아야 하는 비용은?", "c": ["매몰 비용", "기회비용", "명시적 비용", "암묵적 비용", "한계 비용"], "a": 1, "e": "매몰 비용은 이미 지출되어 어떤 선택을 하더라도 되돌릴 수 없는 비용이므로 합리적 선택에서는 고려하지 않아야 한다.", "p": ""}, {"id": "SO-023", "s": "통합사회", "t": "단편", "g": 1, "d": "상", "q": "자원 보유국이 자국의 자원에 대한 주권을 강화하고 이를 정치·경제적 수단으로 이용하려는 경향은?", "c": ["보호 무역주의", "신자유주의", "지역주의", "자원의 유한성", "자원 민족주의"], "a": 5, "e": "자원 민족주의는 자원 보유국이 자원을 국유화하거나 수출을 통제하여 영향력을 키우려는 움직임으로, 1970년대 석유 파동이 대표적인 사례이다.", "p": ""}, {"id": "SO-024", "s": "통합사회", "t": "단편", "g": 2, "d": "하", "q": "물가가 지속적으로 오르는 현상을 무엇이라 하는가?", "c": ["디플레이션", "스태그네이션", "경기 침체", "인플레이션", "환율 하락"], "a": 4, "e": "인플레이션은 물가가 지속적으로 상승하는 현상으로, 화폐의 구매력(가치)이 떨어진다. 반대로 물가가 지속적으로 하락하는 현상은 디플레이션이다.", "p": ""}, {"id": "SO-025", "s": "통합사회", "t": "단편", "g": 2, "d": "중", "q": "인공 열과 포장 면적의 증가 등으로 도심의 기온이 주변 지역보다 높게 나타나는 현상은?", "c": ["열대야 현상", "푄 현상", "열섬 현상", "엘니뇨 현상", "기온 역전 현상"], "a": 3, "e": "열섬 현상은 건물·자동차의 인공 열과 아스팔트·콘크리트 포장 때문에 도심의 기온이 주변보다 높아지는 현상이다. 녹지 확대와 바람길 조성이 대책으로 꼽힌다.", "p": ""}, {"id": "SO-026", "s": "통합사회", "t": "단편", "g": 2, "d": "상", "q": "국제 무역에서 '비교 우위'에 대한 설명으로 옳은 것은?", "c": ["다른 나라보다 더 적은 기회비용으로 생산할 수 있는 상품에 있다.", "다른 나라보다 더 적은 생산비로 생산할 수 있을 때만 성립한다.", "모든 상품에 절대 우위가 있는 나라는 무역으로 이익을 얻을 수 없다.", "두 나라가 같은 상품에 동시에 비교 우위를 가질 수 있다.", "비교 우위가 있는 상품은 수입하는 것이 유리하다."], "a": 1, "e": "비교 우위는 상대국보다 낮은 기회비용으로 생산할 수 있는 상품에 있다. 한 나라가 모든 상품에 절대 우위가 있더라도 각국이 비교 우위 상품에 특화하여 교환하면 서로 이익을 얻을 수 있다.", "p": ""}, {"id": "SO-027", "s": "통합사회", "t": "단편", "g": 2, "d": "상", "q": "우리나라 헌법 재판소의 권한이 <u>아닌</u> 것은?", "c": ["위헌 법률 심판", "헌법 소원 심판", "탄핵 심판", "정당 해산 심판", "명령·규칙에 대한 최종 심사"], "a": 5, "e": "헌법 재판소는 위헌 법률 심판, 헌법 소원 심판, 탄핵 심판, 정당 해산 심판, 권한 쟁의 심판을 담당한다. 명령·규칙이 헌법이나 법률에 위반되는지에 대한 최종 심사는 대법원의 권한이다.", "p": ""}, {"id": "SO-028", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "문화는 태어날 때부터 가지고 있는 것이 아니라 사회생활을 하면서 후천적으로 배워서 익힌다는 문화의 속성은?", "c": ["학습성", "공유성", "축적성", "변동성", "전체성"], "a": 1, "e": "문화의 학습성에 대한 설명이다. 공유성은 구성원들이 문화를 함께 누려 서로의 행동을 예측할 수 있게 하는 속성이다.", "p": ""}, {"id": "SO-029", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "개발 도상국의 생산자에게 정당한 대가를 지불하여 그들의 경제적 자립을 돕는 무역 방식은?", "c": ["공정 무역", "보호 무역", "중계 무역", "자유 무역", "가공 무역"], "a": 1, "e": "공정 무역은 생산자에게 공정한 가격을 지불하고 노동 환경과 환경 보전을 고려하는 윤리적 소비의 한 방식이다.", "p": ""}, {"id": "SO-030", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "'달걀을 한 바구니에 담지 말라'는 말과 가장 관련 깊은 자산 관리의 원칙은?", "c": ["집중 투자", "단기 투자", "원금 보장", "분산 투자", "신용 관리"], "a": 4, "e": "여러 금융 자산에 나누어 투자하여 위험을 줄이는 분산 투자(포트폴리오)의 원칙을 나타내는 말이다.", "p": ""}, {"id": "SO-031", "s": "통합사회", "t": "단편", "g": 3, "d": "상", "q": "1688년 영국 명예혁명의 결과 승인되어 의회 중심의 입헌 군주제 확립에 기여한 문서는?", "c": ["대헌장", "독립 선언", "권리 장전", "인권 선언", "권리 청원"], "a": 3, "e": "명예혁명의 결과 1689년 권리 장전이 승인되어 의회의 동의 없는 과세와 법 집행이 금지되었다. 대헌장은 1215년, 권리 청원은 1628년의 문서이다.", "p": ""}, {"id": "SO-032", "s": "통합사회", "t": "단편", "g": 3, "d": "상", "q": "다음 중 국제 비정부 기구(NGO)가 <u>아닌</u> 것은?", "c": ["그린피스", "국경 없는 의사회", "국제 앰네스티", "세이브 더 칠드런", "세계 무역 기구(WTO)"], "a": 5, "e": "세계 무역 기구(WTO)는 각국 정부를 회원으로 하는 정부 간 국제기구이다. 나머지는 개인이나 민간단체가 중심이 되어 환경·보건·인권 문제 해결에 힘쓰는 국제 비정부 기구이다.", "p": ""}, {"id": "SO-033", "s": "통합사회", "t": "수능", "g": 1, "d": "하", "q": "다음 자료에 나타난 가옥이 주로 분포하는 지역의 기후로 옳은 것은?\n<div class='box'>이 지역의 전통 가옥은 지면에서 바닥을 띄워 지은 고상 가옥이다. 땅에서 올라오는 열기와 습기를 피하고 해충의 침입을 막기 위해서이다. 지붕은 경사가 급하여 빗물이 잘 흘러내린다.</div>", "c": ["건조 기후", "한대 기후", "열대 기후", "지중해성 기후", "냉대 기후"], "a": 3, "e": "연중 덥고 비가 많이 내리는 열대 기후 지역에서는 열기와 습기, 해충을 피하기 위해 고상 가옥을 짓는다. 건조 기후 지역에서는 벽이 두껍고 창문이 작은 흙벽돌집이 나타난다.", "p": ""}, {"id": "SO-034", "s": "통합사회", "t": "수능", "g": 1, "d": "하", "q": "다음 사례에 대한 설명으로 옳은 것은?\n<div class='box'>고등학생 갑(17세)은 방학 동안 편의점에서 아르바이트를 하기로 하였다. 사장은 \"청소년이니까 최저 임금보다 조금 적게 줄게. 계약서는 따로 안 써도 되지?\"라고 말하였다.</div>", "c": ["청소년은 근로 계약서를 쓰지 않아도 된다.", "청소년의 임금은 부모가 대신 받아야 한다.", "청소년 근로자에게도 최저 임금이 적용된다.", "사장의 제안은 법적으로 문제가 없다.", "청소년은 어떤 경우에도 일을 할 수 없다."], "a": 3, "e": "청소년도 성인과 똑같이 최저 임금을 적용받으며, 근로 조건을 명시한 근로 계약서를 작성하고 임금은 본인이 직접 받아야 한다.", "p": ""}, {"id": "SO-035", "s": "통합사회", "t": "수능", "g": 1, "d": "중", "q": "다음 자료의 현상으로 도시에 나타난 문제로 적절하지 <u>않은</u> 것은?\n<div class='box'>산업화가 빠르게 진행되면서 농촌 인구가 일자리를 찾아 도시로 대거 이동하였다. 그 결과 짧은 기간에 도시 인구가 급격히 증가하였다.</div>", "c": ["노동력 부족", "주택 부족", "교통 혼잡", "환경 오염", "기반 시설 부족"], "a": 1, "e": "이촌 향도로 도시에 인구가 집중되면 주택·기반 시설 부족, 교통 혼잡, 환경 오염 등이 나타난다. 노동력 부족과 고령화는 인구가 빠져나간 농촌의 문제이다.", "p": ""}, {"id": "SO-036", "s": "통합사회", "t": "수능", "g": 1, "d": "상", "q": "다음 표에 대한 분석으로 옳은 것은? (단, 두 나라는 노동만을 사용하여 X재와 Y재만 생산한다.)\n<div class='box'>노동 1단위로 생산할 수 있는 양<br>• 갑국: X재 10개 또는 Y재 5개<br>• 을국: X재 4개 또는 Y재 4개</div>", "c": ["을국은 Y재 생산에 비교 우위가 있다.", "을국은 X재 생산에 절대 우위가 있다.", "갑국의 X재 1개 생산의 기회비용은 Y재 2개이다.", "갑국은 두 재화 모두에 비교 우위가 있다.", "두 나라는 무역을 통해 이익을 얻을 수 없다."], "a": 1, "e": "X재 1개의 기회비용은 갑국이 Y재 1/2개, 을국이 Y재 1개이므로 갑국이 X재에 비교 우위가 있다. Y재 1개의 기회비용은 갑국이 X재 2개, 을국이 X재 1개이므로 을국이 Y재에 비교 우위가 있다. 갑국은 두 재화 모두 절대 우위에 있지만 비교 우위는 X재에만 있다.", "p": ""}, {"id": "SO-037", "s": "통합사회", "t": "수능", "g": 1, "d": "상", "q": "다음 갑, 을의 주장에 대한 설명으로 옳은 것은?\n<div class='box'>갑: 오랫동안 차별받아 온 집단에게는 채용이나 입학에서 일정한 혜택을 주어야 합니다. 출발선이 다른데 똑같이 대우하는 것은 진정한 평등이 아닙니다.<br>을: 특정 집단에 혜택을 주면 그 때문에 기회를 잃는 사람이 생깁니다. 이는 또 다른 차별입니다.</div>", "c": ["갑은 모든 사람을 똑같이 대우하는 형식적 평등을 강조한다.", "갑은 실질적 기회의 평등을 강조한다.", "을은 사회적 약자 우대 정책의 확대를 주장한다.", "을은 과거의 차별에 대한 보상이 필요하다고 본다.", "갑과 을은 모두 우대 정책이 역차별을 낳는다고 본다."], "a": 2, "e": "갑은 적극적 우대 조치에 찬성하며 실질적 평등을 강조한다. 을은 그 정책이 역차별을 낳을 수 있다고 본다.", "p": ""}, {"id": "SO-038", "s": "통합사회", "t": "수능", "g": 2, "d": "하", "q": "다른 조건이 일정할 때, 다음 상황이 X재 시장에 미칠 영향으로 옳은 것은? (단, X재는 소득이 늘면 수요가 증가하는 정상재이다.)\n<div class='box'>경기가 좋아져 소비자들의 소득이 전반적으로 증가하였다.</div>", "c": ["수요가 감소하여 가격이 내리고 거래량이 줄어든다.", "수요가 증가하여 가격이 오르고 거래량이 늘어난다.", "공급이 증가하여 가격이 내리고 거래량이 늘어난다.", "공급이 감소하여 가격이 오르고 거래량이 줄어든다.", "가격과 거래량 모두 변하지 않는다."], "a": 2, "e": "정상재는 소득이 증가하면 수요가 증가(수요 곡선 오른쪽 이동)한다. 그 결과 균형 가격이 오르고 균형 거래량이 늘어난다.", "p": ""}, {"id": "SO-039", "s": "통합사회", "t": "수능", "g": 2, "d": "하", "q": "지구 온난화로 나타나는 현상으로 적절하지 <u>않은</u> 것은?", "c": ["해수면이 상승한다.", "극지방의 빙하 면적이 넓어진다.", "고산 지대의 만년설이 줄어든다.", "해발 고도가 낮은 섬나라가 침수 위험에 놓인다.", "식물의 개화 시기가 빨라진다."], "a": 2, "e": "지구 온난화로 기온이 오르면 극지방과 고산 지대의 빙하가 녹아 면적이 줄어들고, 그 결과 해수면이 상승한다.", "p": ""}, {"id": "SO-040", "s": "통합사회", "t": "수능", "g": 2, "d": "하", "q": "다음 자료에서 설명하는 다문화 사회의 이론은?\n<div class='box'>여러 채소와 과일이 각자의 맛과 모양을 유지하면서 한 그릇 안에서 조화를 이루듯이, 다양한 문화가 각각의 고유성을 지키면서 함께 어우러져야 한다고 본다.</div>", "c": ["용광로 이론", "문화 사대주의", "자문화 중심주의", "문화 동화 이론", "샐러드 볼 이론"], "a": 5, "e": "샐러드 볼 이론은 각 문화의 고유성을 인정하고 공존을 추구한다. 용광로 이론은 여러 문화를 하나의 주류 문화로 녹여 통합하려는 관점이다.", "p": ""}, {"id": "SO-041", "s": "통합사회", "t": "수능", "g": 2, "d": "중", "q": "다음 사례에 대한 설명으로 옳은 것은?\n<div class='box'>갑은 여윳돈 전부를 은행 정기 예금에 넣었고, 을은 여윳돈 전부로 한 회사의 주식을 샀다.</div>", "c": ["갑은 을보다 수익성을 중시하였다.", "갑은 을보다 안전성을 중시하였다.", "을의 자산은 원금 손실의 위험이 없다.", "을은 분산 투자의 원칙을 잘 지켰다.", "갑의 자산은 을의 자산보다 기대 수익이 높다."], "a": 2, "e": "예금은 안전성이 높고 수익성이 낮으며, 주식은 수익성이 높을 수 있지만 원금 손실 위험이 있어 안전성이 낮다. 을은 한 회사 주식에 모두 투자했으므로 분산 투자를 하지 않았다.", "p": ""}, {"id": "SO-042", "s": "통합사회", "t": "수능", "g": 2, "d": "중", "q": "다음 사례에 적용된 분배 정의의 실질적 기준은?\n<div class='box'>A 회사는 한 해 동안 판매 실적이 가장 높은 직원에게 가장 많은 성과급을 지급한다.</div>", "c": ["필요", "능력", "업적", "절대적 평등", "노동 시간"], "a": 3, "e": "성과(실적)에 따라 분배하는 것은 업적에 따른 분배이다. 생산성을 높이는 동기를 주지만, 사회적 약자에 대한 배려가 부족해질 수 있다는 한계가 있다.", "p": ""}, {"id": "SO-043", "s": "통합사회", "t": "수능", "g": 2, "d": "상", "q": "원/달러 환율이 1달러 = 1,000원에서 1달러 = 1,200원으로 상승했을 때 나타날 수 있는 현상으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은? (단, 다른 조건은 일정하다.)\n<div class='box'>ㄱ. 우리나라 수출품의 달러 표시 가격이 내려가 수출에 유리해진다.<br>ㄴ. 미국으로 여행을 가려는 우리나라 사람의 경비 부담이 커진다.<br>ㄷ. 달러로 빚을 진 우리나라 기업의 상환 부담이 줄어든다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 3, "e": "환율이 오르면(원화 가치 하락) 수출품의 달러 표시 가격이 내려가 수출이 유리해지고(ㄱ), 같은 달러를 사는 데 더 많은 원화가 필요해 해외여행 경비 부담이 커진다(ㄴ). 달러 빚을 갚는 데 필요한 원화도 늘어나므로 상환 부담은 커진다(ㄷ 틀림).", "p": ""}, {"id": "SO-044", "s": "통합사회", "t": "수능", "g": 2, "d": "상", "q": "다음 자료에 대한 분석으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?\n<div class='box'>갑국의 연령별 인구 구성: 0~14세 20%, 15~64세 60%, 65세 이상 20%<br><br>ㄱ. 갑국은 초고령 사회에 해당한다.<br>ㄴ. 노령화 지수는 100이다.<br>ㄷ. 총부양비는 50보다 크다.</div>", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": 5, "e": "65세 이상 인구 비율이 20% 이상이므로 초고령 사회이다(ㄱ). 노령화 지수 = (노년 인구 ÷ 유소년 인구) × 100 = 20/20 × 100 = 100(ㄴ). 총부양비 = {(유소년 + 노년 인구) ÷ 생산 연령 인구} × 100 = 40/60 × 100 ≒ 66.7로 50보다 크다(ㄷ).", "p": ""}, {"id": "SO-045", "s": "통합사회", "t": "수능", "g": 3, "d": "하", "q": "다음 헌법 조항에 대한 설명으로 가장 적절한 것은?\n<div class='box'>모든 국민은 인간으로서의 존엄과 가치를 가지며, 행복을 추구할 권리를 가진다. 국가는 개인이 가지는 불가침의 기본적 인권을 확인하고 이를 보장할 의무를 진다.</div>", "c": ["기본권 보장의 근본이 되는 이념을 밝히고 있다.", "국민의 의무를 구체적으로 나열하고 있다.", "국가 기관의 구성 방법을 규정하고 있다.", "기본권을 제한할 수 있는 요건을 정하고 있다.", "선거의 원칙을 밝히고 있다."], "a": 1, "e": "헌법 제10조로, 인간의 존엄과 가치 및 행복 추구권은 모든 기본권의 바탕이 되는 근본 이념이다. 기본권 제한의 요건은 제37조 제2항에 규정되어 있다.", "p": ""}, {"id": "SO-046", "s": "통합사회", "t": "수능", "g": 3, "d": "하", "q": "다음 자료에서 설명하는 제도는?\n<div class='box'>'보성 녹차', '의성 마늘'처럼 상품의 품질이나 명성이 특정 지역의 지리적 특성에서 비롯된 경우, 그 지역에서 생산된 상품임을 인증하고 표시할 수 있게 하는 제도이다.</div>", "c": ["지리적 표시제", "지역 브랜드", "장소 마케팅", "공정 무역 인증", "지역 축제"], "a": 1, "e": "지리적 표시제는 특정 지역의 지리적 특성이 반영된 우수 상품에 지역명을 표시할 수 있도록 인증하는 제도이다. 우리나라에서는 보성 녹차가 제1호로 등록되었다.", "p": ""}, {"id": "SO-047", "s": "통합사회", "t": "수능", "g": 3, "d": "하", "q": "교통·통신의 발달로 전자 상거래가 활성화되면서 나타난 변화로 적절하지 <u>않은</u> 것은?", "c": ["택배 산업이 성장하였다.", "소비자가 매장을 직접 방문해야만 상품을 살 수 있게 되었다.", "소비 활동의 시간적·공간적 제약이 줄어들었다.", "상품의 유통 단계가 줄어들었다.", "해외 상품을 직접 구매하는 일이 쉬워졌다."], "a": 2, "e": "전자 상거래는 매장을 방문하지 않고도 언제 어디서나 상품을 구매할 수 있게 하여 소비의 시·공간적 제약을 줄였다.", "p": ""}, {"id": "SO-048", "s": "통합사회", "t": "수능", "g": 3, "d": "하", "q": "다음 사례에 공통으로 나타난 소비 방식은?\n<div class='box'>• 갑은 조금 비싸더라도 공정 무역 인증을 받은 초콜릿을 산다.<br>• 을은 동물 실험을 하지 않는 회사의 화장품을 골라 쓴다.</div>", "c": ["과시 소비", "윤리적 소비", "충동 소비", "모방 소비", "과소비"], "a": 2, "e": "윤리적 소비는 가격과 품질뿐 아니라 인권, 노동, 환경, 동물 복지 등 상품이 생산·유통되는 과정의 윤리적 가치를 고려하는 소비이다.", "p": ""}, {"id": "SO-049", "s": "통합사회", "t": "수능", "g": 3, "d": "중", "q": "시민 불복종이 정당화되기 위한 조건으로 적절하지 <u>않은</u> 것은?", "c": ["공동체 전체의 정의를 실현하려는 목적이어야 한다.", "비폭력적인 방법으로 이루어져야 한다.", "합법적인 수단을 모두 시도한 뒤 최후의 수단으로 해야 한다.", "위법 행위에 따른 처벌을 감수해야 한다.", "개인의 이익을 위해 은밀하게 이루어져야 한다."], "a": 5, "e": "시민 불복종은 공익성(목적의 정당성), 공개성, 비폭력성, 최후 수단성, 처벌 감수를 조건으로 한다. 사익을 위해 은밀히 법을 어기는 것은 시민 불복종이 아니다.", "p": ""}, {"id": "SO-050", "s": "통합사회", "t": "수능", "g": 3, "d": "중", "q": "다음 갑의 관점에 대한 설명으로 옳은 것은?\n<div class='box'>갑: 국제 사회에는 각국을 강제할 수 있는 중앙 정부가 없다. 따라서 각국은 자기 나라의 이익을 가장 먼저 추구하며, 국가의 안전은 스스로의 힘을 길러야만 지킬 수 있다.</div>", "c": ["국제 관계를 힘의 논리로 설명하는 현실주의 관점이다.", "국제법과 국제기구를 통한 협력을 가장 중시한다.", "국가는 도덕과 규범에 따라 행동한다고 본다.", "집단 안보 체제로 평화를 보장할 수 있다고 본다.", "인간의 이성과 선한 본성을 신뢰한다."], "a": 1, "e": "갑은 국제 사회를 무정부 상태로 보고 국가가 힘과 국익을 추구한다고 보는 현실주의 관점이다. 나머지는 국제법·국제기구·집단 안보를 통한 협력을 강조하는 자유주의(이상주의) 관점에 가깝다.", "p": ""}, {"id": "SO-051", "s": "통합사회", "t": "수능", "g": 3, "d": "중", "q": "다음 자료의 문제를 해결하기 위한 정부의 대책과 그 효과로 가장 적절한 것은?\n<div class='box'>A 공장은 제품을 만들면서 대기 오염 물질을 배출하지만, 주변 주민이 입는 피해에 대해서는 아무런 비용을 치르지 않는다. 그 결과 이 제품은 사회적으로 바람직한 수준보다 많이 생산되고 있다.</div>", "c": ["A 공장에 보조금을 지급하여 생산량을 늘리도록 유도한다.", "오염 물질 배출에 세금을 부과하여 생산량을 줄이도록 유도한다.", "제품의 최고 가격을 정해 가격을 낮춘다.", "주변 주민에게 세금을 부과한다.", "시장에 맡겨 두면 저절로 해결되므로 개입하지 않는다."], "a": 2, "e": "부정적 외부 효과(외부 불경제)가 있으면 사회적으로 바람직한 수준보다 과다 생산된다. 정부는 세금이나 부담금을 부과하여 생산자가 외부 비용을 고려하게 함으로써 생산량을 줄이도록 유도할 수 있다.", "p": ""}, {"id": "SO-052", "s": "통합사회", "t": "수능", "g": 3, "d": "상", "q": "&lt;보기&gt;의 정책에 대한 사상가 갑, 을의 평가로 가장 적절한 것은?\n<div class='box'>갑: 사회적·경제적 불평등은 사회의 가장 불리한 처지에 있는 사람들에게 최대의 이익이 될 때에만 정당하다.<br>을: 정당하게 취득한 소유물에 대해 개인은 절대적 권리를 가지며, 국가는 이를 침해해서는 안 된다.<br><br>&lt;보기&gt; 정부가 고소득층의 세금을 올려 마련한 재원으로 최저 소득층의 생활비를 지원한다.</div>", "c": ["갑은 반대하고, 을은 찬성할 것이다.", "갑과 을 모두 찬성할 것이다.", "갑과 을 모두 반대할 것이다.", "갑은 찬성하고, 을은 개인의 소유권을 침해한다는 이유로 반대할 것이다.", "갑은 사회 전체의 이익 총량이 늘어난다는 이유로만 찬성할 것이다."], "a": 4, "e": "갑은 롤스로, 최소 수혜자에게 이익이 되는 재분배 정책은 차등의 원칙에 부합한다고 볼 것이다. 을은 노직으로, 재분배를 위한 과세는 개인의 소유권을 침해한다고 보아 반대할 것이다. 이익 총량을 기준으로 삼는 것은 공리주의의 관점이다.", "p": ""}, {"id": "SO-053", "s": "통합사회", "t": "단편", "g": 1, "d": "하", "q": "툰드라 기후 지역 주민의 전통적인 생활 모습으로 가장 적절한 것은?", "c": ["올리브와 포도를 재배한다.", "벼농사를 1년에 두세 번 짓는다.", "오아시스에서 대추야자를 재배한다.", "순록을 유목한다.", "카카오와 천연고무를 대규모로 재배한다."], "a": 4, "e": "툰드라 기후 지역은 기온이 매우 낮아 농사가 어려워 순록 유목이나 사냥, 어로로 생활해 왔다. 올리브·포도는 지중해성 기후, 대추야자는 건조 기후 지역의 작물이다.", "p": ""}, {"id": "SO-054", "s": "통합사회", "t": "단편", "g": 1, "d": "하", "q": "인간을 자연의 일부로 보고, 자연 전체의 조화와 균형을 중시하는 자연관은?", "c": ["인간 중심주의", "생태 중심주의", "환경 결정론", "이분법적 세계관", "도구적 자연관"], "a": 2, "e": "생태 중심주의는 인간도 생태계의 한 구성원이라고 보고 자연 그 자체의 가치를 존중한다. 인간 중심주의는 자연을 인간의 이익을 위한 도구로 본다.", "p": ""}, {"id": "SO-055", "s": "통합사회", "t": "단편", "g": 1, "d": "하", "q": "전체 인구 중 도시에 거주하는 인구의 비율을 무엇이라 하는가?", "c": ["인구 밀도", "부양비", "노령화 지수", "합계 출산율", "도시화율"], "a": 5, "e": "도시화율은 전체 인구 가운데 도시 지역에 사는 인구의 비율로, 도시화의 진행 정도를 나타낸다.", "p": ""}, {"id": "SO-056", "s": "통합사회", "t": "단편", "g": 1, "d": "하", "q": "우리 헌법이 정한 국민의 기본 의무에 해당하지 <u>않는</u> 것은?", "c": ["납세의 의무", "국방의 의무", "교육의 의무", "근로의 의무", "투표의 의무"], "a": 5, "e": "헌법은 납세, 국방, 교육, 근로, 환경 보전 등의 의무를 규정한다. 투표(선거권 행사)는 권리이며 헌법상 의무로 규정되어 있지 않다.", "p": ""}, {"id": "SO-057", "s": "통합사회", "t": "단편", "g": 1, "d": "하", "q": "인권은 사람이 태어나면서부터 당연히 가지는 권리라는 뜻을 나타내는 인권의 특성은?", "c": ["보편성", "천부성", "항구성", "불가침성", "상대성"], "a": 2, "e": "천부성은 인권이 국가나 법이 주는 것이 아니라 태어날 때부터 하늘이 준 권리라는 뜻이다. 보편성은 누구나 누린다는 뜻, 항구성은 영원히 보장된다는 뜻, 불가침성은 남이 침해할 수 없다는 뜻이다.", "p": ""}, {"id": "SO-058", "s": "통합사회", "t": "단편", "g": 1, "d": "하", "q": "시장에서 수요량과 공급량이 일치할 때의 가격을 무엇이라 하는가?", "c": ["최고 가격", "최저 가격", "독점 가격", "균형 가격", "기회비용"], "a": 4, "e": "수요량과 공급량이 같아지는 지점에서 균형 가격과 균형 거래량이 결정된다.", "p": ""}, {"id": "SO-059", "s": "통합사회", "t": "단편", "g": 1, "d": "하", "q": "주식회사가 사업 자금을 마련하기 위해 발행하며, 보유자가 이익의 일부를 배당으로 받을 수 있는 증서는?", "c": ["채권", "예금 통장", "보험 증서", "주식", "신용 카드"], "a": 4, "e": "주식을 가진 사람(주주)은 회사 이익의 일부를 배당금으로 받거나 주식 가격이 오르면 시세 차익을 얻을 수 있다. 채권은 돈을 빌리면서 발행하는 차용 증서이다.", "p": ""}, {"id": "SO-060", "s": "통합사회", "t": "단편", "g": 1, "d": "하", "q": "한 사회의 문화 요소가 다른 사회로 전해져 그 사회의 문화에 영향을 주는 현상은?", "c": ["발명", "발견", "문화 지체", "사회화", "문화 전파"], "a": 5, "e": "문화 전파는 문화 변동의 외부적 요인이다. 발명과 발견은 한 사회 안에서 새로운 문화 요소가 나타나는 내부적 요인이다.", "p": ""}, {"id": "SO-061", "s": "통합사회", "t": "단편", "g": 1, "d": "하", "q": "어떤 문화를 그 사회의 자연환경과 역사적·사회적 맥락 속에서 이해하려는 태도는?", "c": ["자문화 중심주의", "문화 사대주의", "문화 상대주의", "문화 제국주의", "국수주의"], "a": 3, "e": "문화 상대주의는 문화에 우열이 없다고 보고 각 문화를 그 사회의 맥락에서 이해하려는 태도로, 문화의 다양성을 존중하는 데 도움이 된다.", "p": ""}, {"id": "SO-062", "s": "통합사회", "t": "단편", "g": 1, "d": "하", "q": "자유 무역을 확대하고 회원국 사이의 무역 분쟁을 조정하기 위해 1995년에 출범한 국제기구는?", "c": ["세계 보건 기구(WHO)", "국제 통화 기금(IMF)", "유네스코(UNESCO)", "세계 무역 기구(WTO)", "국제 사면 위원회"], "a": 4, "e": "세계 무역 기구는 관세와 무역 장벽을 낮추어 자유 무역을 확대하고, 무역 분쟁을 조정하는 역할을 한다.", "p": ""}, {"id": "SO-063", "s": "통합사회", "t": "단편", "g": 1, "d": "하", "q": "세계 평화와 안전 유지를 위해 1945년에 설립된 국제기구는?", "c": ["유럽 연합(EU)", "국제 연합(UN)", "북대서양 조약 기구(NATO)", "그린피스", "세계 무역 기구(WTO)"], "a": 2, "e": "국제 연합은 제2차 세계 대전 뒤 전쟁을 막고 국제 평화와 협력을 이루기 위해 세워졌다.", "p": ""}, {"id": "SO-064", "s": "통합사회", "t": "단편", "g": 1, "d": "하", "q": "다음 중 재생 가능한 에너지(신·재생 에너지)에 해당하지 <u>않는</u> 것은?", "c": ["석탄", "태양광", "풍력", "지열", "조력"], "a": 1, "e": "석탄은 석유, 천연가스와 함께 화석 연료로, 매장량에 한계가 있고 연소할 때 온실가스를 많이 내놓는다.", "p": ""}, {"id": "SO-065", "s": "통합사회", "t": "단편", "g": 1, "d": "하", "q": "여성 한 명이 평생 낳을 것으로 예상되는 평균 자녀 수를 나타내는 지표는?", "c": ["인구 부양비", "중위 연령", "기대 수명", "합계 출산율", "노령화 지수"], "a": 4, "e": "합계 출산율은 저출산의 정도를 보여 주는 대표적인 지표이다. 인구를 현재 수준으로 유지하려면 약 2.1명이 필요하다고 본다.", "p": ""}, {"id": "SO-066", "s": "통합사회", "t": "단편", "g": 1, "d": "중", "q": "지중해성 기후 지역에서 올리브, 포도 등을 재배하는 수목 농업이 발달한 까닭은?", "c": ["연중 비가 많이 내리기 때문에", "겨울이 매우 춥고 길기 때문에", "일 년 내내 서늘하기 때문에", "여름이 덥고 건조하기 때문에", "여름에 계절풍으로 비가 집중되기 때문에"], "a": 4, "e": "지중해성 기후는 여름에 고온 건조하므로 가뭄에 잘 견디는 올리브, 포도, 오렌지 등을 재배한다. 온화하고 비가 내리는 겨울에는 밀 등을 재배한다.", "p": ""}, {"id": "SO-067", "s": "통합사회", "t": "단편", "g": 1, "d": "중", "q": "인간 중심주의 자연관에 대한 설명으로 옳은 것은?", "c": ["자연을 인간의 이익과 필요를 위한 수단으로 본다.", "인간을 생태계의 한 구성원으로 본다.", "모든 생명체가 동등한 도덕적 지위를 갖는다고 본다.", "자연 그 자체의 내재적 가치를 강조한다.", "개발보다 생태계 보전을 항상 우선한다."], "a": 1, "e": "인간 중심주의는 인간만이 이성을 지닌 존재이며 자연은 인간을 위한 도구라고 본다. 과학 기술과 경제 발전에 기여하였지만 환경 문제의 원인이 되었다는 비판을 받는다.", "p": ""}, {"id": "SO-068", "s": "통합사회", "t": "단편", "g": 1, "d": "중", "q": "정보 기기나 정보에 접근하고 이용하는 능력의 차이 때문에 사회적·경제적 격차가 벌어지는 현상은?", "c": ["정보 격차", "사생활 침해", "사이버 폭력", "인터넷 중독", "저작권 침해"], "a": 1, "e": "정보 격차는 지역, 연령, 소득 수준 등에 따라 정보 접근·활용 능력이 달라 생기며, 정보 소외 계층에 대한 교육과 지원이 필요하다.", "p": ""}, {"id": "SO-069", "s": "통합사회", "t": "단편", "g": 1, "d": "중", "q": "국가 권력을 입법부, 행정부, 사법부로 나누어 맡기는 권력 분립 제도의 궁극적인 목적은?", "c": ["국가 운영의 속도를 높이려고", "권력 남용을 막아 국민의 기본권을 보장하려고", "공무원의 수를 줄이려고", "지방 정부의 권한을 없애려고", "대통령의 권한을 강화하려고"], "a": 2, "e": "권력 분립은 국가 기관이 서로 견제하고 균형을 이루게 하여 권력의 남용을 막고 국민의 자유와 권리를 보장하려는 제도이다.", "p": ""}, {"id": "SO-070", "s": "통합사회", "t": "단편", "g": 1, "d": "중", "q": "소수의 기업이 시장을 지배하는 독과점 시장에서 나타날 수 있는 문제로 가장 적절한 것은?", "c": ["상품 가격이 항상 낮아진다.", "기업들이 담합하여 가격을 올리거나 생산량을 줄일 수 있다.", "소비자의 선택 폭이 넓어진다.", "기업 간 경쟁이 지나치게 치열해진다.", "공공재가 과다하게 생산된다."], "a": 2, "e": "독과점 기업은 경쟁 압력이 약해 가격을 높이거나 품질 개선을 게을리할 수 있다. 정부는 공정 거래 관련 법으로 불공정 행위를 규제한다.", "p": ""}, {"id": "SO-071", "s": "통합사회", "t": "단편", "g": 1, "d": "중", "q": "'능력에 따른 분배'에 대한 설명으로 옳은 것은?", "c": ["모든 사람에게 똑같이 나누므로 생산 의욕이 낮아진다.", "개인의 잠재력과 재능을 발휘할 동기를 주지만, 능력은 타고난 환경의 영향을 받는다는 한계가 있다.", "사회적 약자를 가장 잘 보호할 수 있다.", "성과를 객관적으로 측정하기 쉽다는 장점이 있다.", "기본적인 욕구를 충족하는 것을 최우선으로 한다."], "a": 2, "e": "능력에 따른 분배는 능력이 뛰어난 사람에게 더 많이 분배하는 것으로, 능력을 평가할 정확한 기준을 정하기 어렵고 타고난 재능이나 환경 같은 우연한 요소의 영향을 받는다는 문제가 있다.", "p": ""}, {"id": "SO-072", "s": "통합사회", "t": "단편", "g": 1, "d": "중", "q": "서로 다른 두 문화가 만나 이전에 없던 새로운 문화가 만들어지는 문화 변동의 양상은?", "c": ["문화 융합", "문화 동화", "문화 병존", "문화 지체", "문화 전파"], "a": 1, "e": "문화 융합은 두 문화 요소가 결합하여 새로운 제3의 문화가 나타나는 현상이다. 문화 동화는 기존 문화가 사라지는 것, 문화 병존은 두 문화가 함께 존재하는 것이다.", "p": ""}, {"id": "SO-073", "s": "통합사회", "t": "단편", "g": 1, "d": "상", "q": "국방, 치안과 같은 공공재가 시장에서 충분히 공급되기 어려운 까닭은?", "c": ["생산 비용이 전혀 들지 않기 때문에", "대가를 내지 않은 사람도 이용할 수 있어 무임승차 문제가 생기기 때문에", "소비자들이 원하지 않기 때문에", "한 사람이 쓰면 다른 사람이 쓸 수 없기 때문에", "정부가 생산을 금지하기 때문에"], "a": 2, "e": "공공재는 여러 사람이 동시에 쓸 수 있고(비경합성) 돈을 내지 않은 사람을 막기 어려워(비배제성) 기업이 이윤을 얻기 힘들다. 그래서 주로 정부가 공급한다.", "p": ""}, {"id": "SO-074", "s": "통합사회", "t": "단편", "g": 1, "d": "상", "q": "다른 조건이 일정할 때 어떤 상품의 수요와 공급이 동시에 증가하면 나타나는 변화는?", "c": ["균형 가격은 상승하고, 균형 거래량의 변화는 알 수 없다.", "균형 가격과 균형 거래량이 모두 상승한다.", "균형 가격은 하락하고 균형 거래량은 감소한다.", "균형 가격과 균형 거래량 모두 변하지 않는다.", "균형 거래량은 증가하고, 균형 가격의 변화는 알 수 없다."], "a": 5, "e": "수요 증가는 가격을 올리고 공급 증가는 가격을 내리므로 가격 변화는 두 변화의 크기에 따라 달라진다. 거래량은 두 경우 모두 늘어나므로 반드시 증가한다.", "p": ""}, {"id": "SO-075", "s": "통합사회", "t": "단편", "g": 1, "d": "상", "q": "자유주의적 정의관에 대한 설명으로 옳은 것은?", "c": ["개인의 자유와 권리를 최대한 보장하는 것을 정의롭다고 본다.", "개인의 자유보다 공동체의 전통을 항상 우선한다.", "개인은 공동체에 대해 아무런 책임도 없다고 본다.", "국가가 좋은 삶의 방식을 정해 주어야 한다고 본다.", "사익 추구는 언제나 부도덕하다고 본다."], "a": 1, "e": "자유주의적 정의관은 개인이 자신의 삶을 스스로 선택하고 책임질 자유를 중시한다. 공동체주의적 정의관은 개인이 공동체의 구성원으로서 공동선을 실현하는 것을 강조한다.", "p": ""}, {"id": "SO-076", "s": "통합사회", "t": "단편", "g": 1, "d": "상", "q": "노직의 정의관에 대한 설명으로 옳은 것은?", "c": ["최소 수혜자에게 최대의 이익이 돌아가야 한다.", "사회 전체의 행복 총량을 늘리는 분배가 정의롭다.", "정당하게 취득한 소유물에 대해서는 개인이 절대적 권리를 가지며, 국가는 최소한의 역할만 해야 한다.", "공동체의 공동선을 위해 재산권을 제한해야 한다.", "필요에 따라 평등하게 분배해야 한다."], "a": 3, "e": "노직은 취득과 이전의 과정이 정당하다면 그 결과로 생긴 소유는 정의롭다고 보았다. 따라서 복지를 위한 세금 재분배에 반대하고, 국가의 역할을 치안·국방 등으로 한정하는 최소 국가를 주장하였다.", "p": ""}, {"id": "SO-077", "s": "통합사회", "t": "단편", "g": 1, "d": "상", "q": "사회적 약자에게 대학 입학이나 취업에서 혜택을 주는 '적극적 우대 조치'에 대해 제기되는 비판은?", "c": ["사회적 약자의 기회를 줄인다.", "과거의 차별을 더 심하게 만든다.", "형식적 평등만을 추구한다.", "혜택을 받지 못하는 집단에 대한 역차별이 될 수 있다.", "모든 사람을 똑같이 대우한다."], "a": 4, "e": "적극적 우대 조치는 실질적 평등을 이루기 위한 제도이지만, 다른 집단의 기회를 제한하여 역차별을 낳을 수 있다는 논란이 있다.", "p": ""}, {"id": "SO-078", "s": "통합사회", "t": "단편", "g": 1, "d": "상", "q": "우리나라 법이 정한 청소년(연소자)의 근로에 대한 설명으로 <u>옳지 않은</u> 것은?", "c": ["원칙적으로 만 15세 이상이어야 일할 수 있다.", "근로 계약은 본인이 직접 맺어야 한다.", "성인과 같은 최저 임금을 적용받는다.", "부모님 등 친권자의 동의서가 필요하다.", "임금은 부모님이 대신 받는 것이 원칙이다."], "a": 5, "e": "임금은 근로자 본인에게 직접 주어야 하며, 미성년자도 임금을 스스로 청구할 수 있다. 청소년의 근로 계약은 부모가 대신 맺을 수 없고 본인이 맺어야 한다.", "p": ""}, {"id": "SO-079", "s": "통합사회", "t": "단편", "g": 1, "d": "상", "q": "다른 사회의 문화를 우수한 것으로 여기고 자기 문화를 낮게 평가하는 태도는?", "c": ["문화 사대주의", "자문화 중심주의", "문화 상대주의", "문화 다원주의", "보편 윤리"], "a": 1, "e": "문화 사대주의는 다른 문화를 받아들이는 데는 유리할 수 있지만, 자기 문화의 정체성과 주체성을 잃을 위험이 있다.", "p": ""}, {"id": "SO-080", "s": "통합사회", "t": "단편", "g": 1, "d": "상", "q": "문화 상대주의를 극단적으로 적용할 때 생길 수 있는 문제는?", "c": ["인간의 존엄성을 해치는 관습까지도 인정하게 될 수 있다.", "자기 문화만을 우월하다고 여기게 된다.", "다른 문화를 무조건 따르게 된다.", "문화의 다양성이 사라진다.", "다른 사회와의 교류가 불가능해진다."], "a": 1, "e": "모든 문화를 무조건 인정하는 극단적 문화 상대주의는 인권을 침해하는 관습도 비판할 수 없게 만든다. 그래서 인간의 존엄성, 자유, 평등 같은 보편 윤리의 관점에서 문화를 성찰할 필요가 있다.", "p": ""}, {"id": "SO-081", "s": "통합사회", "t": "단편", "g": 1, "d": "상", "q": "생애 주기에 따른 금융 설계에 대한 설명으로 가장 적절한 것은?", "c": ["소득이 소비보다 많은 중·장년기에 저축하여 은퇴 이후를 대비해야 한다.", "노년기에는 소득이 가장 많으므로 소비를 늘려야 한다.", "청년기에는 소득이 없으므로 금융 설계가 필요 없다.", "생애 전체에서 소득과 소비는 항상 같다.", "자녀 교육과 주택 마련은 노년기의 주요 과업이다."], "a": 1, "e": "일반적으로 소득은 중·장년기에 가장 많고 은퇴 뒤에는 크게 줄지만 소비는 평생 이어진다. 따라서 생애 전체를 내다보고 저축과 투자를 계획해야 한다.", "p": ""}, {"id": "SO-082", "s": "통합사회", "t": "수능", "g": 1, "d": "상", "q": "다음 글의 (가)에 해당하는 사례로 가장 적절한 것은?<div class='box'>평화학자 갈퉁은 전쟁, 테러와 같은 직접적 폭력이 없는 상태를 소극적 평화라고 하였다. 그리고 직접적 폭력뿐 아니라 <b>(가)</b> 사회 구조나 문화에서 비롯되는 폭력까지 사라진 상태를 적극적 평화라고 하였다.</div>", "c": ["이웃 나라의 군대가 국경을 침범하는 것", "무장 단체가 민간인을 공격하는 것", "두 나라가 영토 문제로 전쟁을 벌이는 것", "강도가 흉기로 행인을 위협하는 것", "빈곤과 차별 때문에 교육받을 기회를 얻지 못하는 것"], "a": 5, "e": "빈곤, 기아, 차별, 억압처럼 사회 구조 때문에 생기는 고통을 구조적 폭력이라 한다. 나머지는 모두 물리적 힘이 직접 가해지는 직접적 폭력이다.", "p": ""}, {"id": "SO-083", "s": "통합사회", "t": "단편", "g": 1, "d": "상", "q": "선진국과 비교하여 개발 도상국에서 주로 나타나는 인구 문제는?", "c": ["저출산에 따른 노동력 부족", "높은 출생률에 따른 인구 급증과 식량·일자리 부족", "고령화에 따른 노인 부양 부담 증가", "인구 감소에 따른 지방 소멸", "연금 재정의 고갈"], "a": 2, "e": "개발 도상국은 출생률이 높아 인구가 빠르게 늘면서 식량·주택·일자리 부족을 겪는 경우가 많다. 선진국은 저출산·고령화로 인한 노동력 부족과 부양 부담이 주된 문제이다.", "p": ""}, {"id": "SO-084", "s": "통합사회", "t": "단편", "g": 1, "d": "상", "q": "'지속 가능한 발전'의 의미로 가장 적절한 것은?", "c": ["환경 보전을 위해 경제 성장을 완전히 멈추는 것", "미래 세대가 필요를 충족할 능력을 해치지 않으면서 현재 세대의 필요를 충족하는 발전", "현재 세대의 경제적 이익을 최대로 높이는 발전", "선진국만 환경 보전의 책임을 지는 발전", "자원을 최대한 빨리 개발하여 이용하는 것"], "a": 2, "e": "지속 가능한 발전은 경제 성장, 환경 보전, 사회 통합이 조화를 이루어 현재 세대와 미래 세대가 함께 잘 살 수 있도록 하는 발전이다.", "p": ""}, {"id": "SO-085", "s": "통합사회", "t": "단편", "g": 2, "d": "하", "q": "행복한 삶을 실현하기 위한 조건으로 보기 <u>어려운</u> 것은?", "c": ["다른 사람과의 끊임없는 재산 비교", "쾌적하고 안전한 정주 환경", "생활에 필요한 경제적 안정", "시민의 의사가 반영되는 민주주의", "자신을 돌아보는 도덕적 성찰과 실천"], "a": 1, "e": "행복한 삶을 위해서는 질 높은 정주 환경, 경제적 안정, 민주주의의 발전, 도덕적 실천과 성찰이 필요하다. 남과의 지나친 비교는 오히려 행복감을 떨어뜨린다.", "p": ""}, {"id": "SO-086", "s": "통합사회", "t": "단편", "g": 2, "d": "하", "q": "열대 기후 지역에서 집을 땅에서 띄워 짓는 고상 가옥이 나타나는 까닭은?", "c": ["눈이 많이 쌓이는 것을 막으려고", "지면의 열기와 습기를 피하고 해충의 침입을 막으려고", "모래바람을 막으려고", "얼어 있던 땅이 녹아 집이 기우는 것을 막으려고", "강한 햇빛을 반사하려고"], "a": 2, "e": "덥고 습한 열대 지역에서는 바닥을 지면에서 띄워 열기와 습기, 해충과 짐승을 피한다. 한편 툰드라 지역의 고상 가옥은 건물의 열 때문에 언 땅이 녹는 것을 막기 위한 것이다.", "p": ""}, {"id": "SO-087", "s": "통합사회", "t": "단편", "g": 2, "d": "하", "q": "다음 자연재해 중 기후와 관련된 기상 재해가 <u>아닌</u> 것은?", "c": ["태풍", "지진", "홍수", "가뭄", "폭설"], "a": 2, "e": "지진은 화산 활동, 지진 해일과 함께 땅속의 힘 때문에 일어나는 지형(지질) 재해이다.", "p": ""}, {"id": "SO-088", "s": "통합사회", "t": "단편", "g": 2, "d": "하", "q": "산업화가 진행되면서 나타나는 변화로 가장 적절한 것은?", "c": ["2·3차 산업에 종사하는 인구의 비율이 높아진다.", "농업 종사자의 비율이 높아진다.", "도시 인구가 농촌으로 이동한다.", "생산이 가내 수공업 중심으로 바뀐다.", "자급자족하는 생활이 늘어난다."], "a": 1, "e": "산업화는 농업 중심 사회가 공업·서비스업 중심 사회로 바뀌는 현상으로, 일자리를 찾아 도시로 인구가 모이는 도시화와 함께 진행된다.", "p": ""}, {"id": "SO-089", "s": "통합사회", "t": "단편", "g": 2, "d": "하", "q": "교통의 발달이 생활 공간에 끼친 영향으로 가장 적절한 것은?", "c": ["지역 간 교류가 줄었다.", "이동 시간이 줄어 생활권이 넓어졌다.", "통근할 수 있는 거리가 짧아졌다.", "물자의 이동 비용이 늘었다.", "지역마다 고립된 생활을 하게 되었다."], "a": 2, "e": "교통이 발달하면 같은 거리를 더 짧은 시간에 이동할 수 있어 통근·통학권과 상권 등 생활권이 넓어지고 지역 간 교류가 활발해진다.", "p": ""}, {"id": "SO-090", "s": "통합사회", "t": "단편", "g": 2, "d": "하", "q": "국민이 국가의 의사 결정에 참여할 수 있는 권리인 참정권에 해당하는 것은?", "c": ["재판 청구권", "신체의 자유", "교육을 받을 권리", "선거권", "재산권"], "a": 4, "e": "참정권에는 선거권, 공무 담임권, 국민 투표권이 있다. 재판 청구권은 청구권, 신체의 자유와 재산권은 자유권, 교육을 받을 권리는 사회권에 해당한다.", "p": ""}, {"id": "SO-091", "s": "통합사회", "t": "단편", "g": 2, "d": "하", "q": "국가의 간섭을 받지 않고 자유롭게 생활할 수 있는 권리인 자유권에 해당하는 것은?", "c": ["선거권", "근로의 권리", "국가 배상 청구권", "사회 보장을 받을 권리", "종교의 자유"], "a": 5, "e": "자유권에는 신체의 자유, 종교의 자유, 언론·출판의 자유, 직업 선택의 자유, 재산권 등이 있다.", "p": ""}, {"id": "SO-092", "s": "통합사회", "t": "단편", "g": 2, "d": "하", "q": "\"대한민국의 주권은 국민에게 있고, 모든 권력은 국민으로부터 나온다.\"라는 헌법 조항에 담긴 원리는?", "c": ["권력 분립의 원리", "복지 국가의 원리", "국제 평화주의", "문화 국가의 원리", "국민 주권의 원리"], "a": 5, "e": "헌법 제1조 제2항은 나라의 주인이 국민임을 밝힌 국민 주권의 원리를 담고 있다.", "p": ""}, {"id": "SO-093", "s": "통합사회", "t": "단편", "g": 2, "d": "하", "q": "시장 경제 체제에서 '무엇을, 얼마나, 어떻게 생산할 것인가'를 결정하는 데 가장 큰 역할을 하는 것은?", "c": ["정부의 명령", "전통과 관습", "기업 간 담합", "시장 가격", "국제기구의 지시"], "a": 4, "e": "시장 경제에서는 수요와 공급에 따라 정해지는 가격이 신호 역할을 하여 자원이 배분된다. 정부의 명령과 계획에 따르는 것은 계획 경제 체제이다.", "p": ""}, {"id": "SO-094", "s": "통합사회", "t": "단편", "g": 2, "d": "하", "q": "기업이 이윤을 추구하면서도 법을 지키고, 환경 보호나 사회 공헌 활동으로 사회에 대한 책임을 다하는 것은?", "c": ["기업가 정신", "독과점", "담합", "외부 효과", "기업의 사회적 책임"], "a": 5, "e": "기업의 사회적 책임은 기업이 소비자·노동자·지역 사회 등에 끼치는 영향을 고려하여 윤리적으로 경영하는 것이다. 기업가 정신은 위험을 무릅쓰고 혁신에 도전하는 자세이다.", "p": ""}, {"id": "SO-095", "s": "통합사회", "t": "단편", "g": 2, "d": "하", "q": "예금과 비교할 때 주식 투자의 일반적인 특징은?", "c": ["기대 수익은 높지만 원금을 잃을 위험도 크다.", "원금이 항상 보장된다.", "이자 수익이 정해져 있다.", "수익성과 위험성이 모두 낮다.", "만기가 되면 원금을 돌려받는다."], "a": 1, "e": "주식은 배당과 시세 차익으로 높은 수익을 기대할 수 있지만 가격이 떨어지면 원금을 잃을 수 있어 안전성이 낮다.", "p": ""}, {"id": "SO-096", "s": "통합사회", "t": "단편", "g": 2, "d": "하", "q": "생활이 어려운 국민에게 국가가 세금으로 최저 생활을 보장해 주는 '공공 부조'에 해당하는 제도는?", "c": ["국민 기초 생활 보장 제도", "국민연금", "국민 건강 보험", "고용 보험", "산업 재해 보상 보험"], "a": 1, "e": "공공 부조는 가입자가 보험료를 내지 않고 국가가 전액 부담한다. 국민연금, 건강 보험, 고용 보험, 산재 보험은 보험료를 내는 사회 보험이다.", "p": ""}, {"id": "SO-097", "s": "통합사회", "t": "단편", "g": 2, "d": "하", "q": "다른 문화와 접촉한 결과 기존의 문화가 새로운 문화에 흡수되어 사라지는 현상은?", "c": ["문화 동화", "문화 병존", "문화 융합", "문화 지체", "문화 상대주의"], "a": 1, "e": "문화 동화는 한 사회의 문화가 다른 문화에 완전히 흡수되어 고유한 성격을 잃는 것이다.", "p": ""}, {"id": "SO-098", "s": "통합사회", "t": "단편", "g": 2, "d": "하", "q": "감염병 대응 등 세계인의 건강 증진을 위해 활동하는 국제 연합(UN) 산하 전문 기구는?", "c": ["세계 보건 기구(WHO)", "세계 무역 기구(WTO)", "국제 통화 기금(IMF)", "국제 노동 기구(ILO)", "유엔 난민 기구(UNHCR)"], "a": 1, "e": "세계 보건 기구는 질병 예방과 퇴치, 보건 정책 지원 등 세계인의 건강 문제를 다룬다.", "p": ""}, {"id": "SO-099", "s": "통합사회", "t": "단편", "g": 2, "d": "하", "q": "세계에서 가장 많이 소비되는 에너지 자원으로, 서남아시아 페르시아만 연안에 많이 매장된 것은?", "c": ["석유", "석탄", "우라늄", "철광석", "천연고무"], "a": 1, "e": "석유는 수송용 연료와 화학 공업의 원료로 널리 쓰이며, 매장 지역이 치우쳐 있어 국제 이동량이 많다.", "p": ""}, {"id": "SO-100", "s": "통합사회", "t": "단편", "g": 2, "d": "하", "q": "지구촌의 구성원이라는 생각으로 빈곤, 환경 등 인류 공동의 문제 해결에 책임감을 갖고 참여하는 자세는?", "c": ["자문화 중심주의", "지역 이기주의", "국수주의", "세계 시민 의식", "보호 무역주의"], "a": 4, "e": "세계 시민 의식은 국가와 민족을 넘어 인류 전체를 공동체로 여기고 지구촌 문제 해결에 협력하려는 태도이다.", "p": ""}, {"id": "SO-101", "s": "통합사회", "t": "단편", "g": 2, "d": "중", "q": "인위적으로 꾸미지 않고 자연의 흐름에 따라 사는 '무위자연'의 삶을 행복으로 본 사상은?", "c": ["유교", "도가", "불교", "스토아학파", "공리주의"], "a": 2, "e": "노자와 장자의 도가는 억지로 하지 않고 자연의 순리에 따르는 삶을 강조하였다. 유교는 인(仁)의 실현, 불교는 수행을 통한 해탈을 행복으로 보았다.", "p": ""}, {"id": "SO-102", "s": "통합사회", "t": "단편", "g": 2, "d": "중", "q": "자연환경이 인간 생활을 완전히 결정하는 것이 아니라, 인간이 자연환경을 이용하는 방식을 선택할 수 있다고 보는 관점은?", "c": ["환경 가능론", "환경 결정론", "생태 중심주의", "문화 사대주의", "사회 계약론"], "a": 1, "e": "환경 가능론은 자연환경이 여러 가능성을 주고 인간이 그 가운데 선택하여 문화를 만든다고 본다. 환경 결정론은 자연환경이 인간 생활을 결정한다고 본다.", "p": ""}, {"id": "SO-103", "s": "통합사회", "t": "단편", "g": 2, "d": "중", "q": "도로 건설 등으로 끊어진 야생 동물의 서식지를 이어 주기 위해 만드는 시설은?", "c": ["생태 통로", "방조제", "방풍림", "하수 처리장", "댐"], "a": 1, "e": "생태 통로는 도로나 댐 때문에 나뉜 서식지를 연결하여 야생 동물이 안전하게 이동할 수 있게 한다. 인간과 자연의 공존을 위한 노력의 한 예이다.", "p": ""}, {"id": "SO-104", "s": "통합사회", "t": "단편", "g": 2, "d": "중", "q": "도시화의 단계 중 '가속화 단계'의 특징으로 옳은 것은?", "c": ["대부분의 인구가 농촌에 살고 1차 산업에 종사한다.", "도시 인구가 농촌으로 이동하는 역도시화가 나타난다.", "농촌 인구가 도시로 이동하는 이촌 향도 현상이 활발하다.", "도시화율이 80%를 넘어 증가 속도가 느려진다.", "산업화가 아직 시작되지 않았다."], "a": 3, "e": "가속화 단계에서는 산업화와 함께 이촌 향도로 도시화율이 빠르게 높아진다. 초기 단계는 농촌 인구가 대부분이고, 종착 단계에서는 도시화율 증가가 느려지며 역도시화가 나타나기도 한다.", "p": ""}, {"id": "SO-105", "s": "통합사회", "t": "단편", "g": 2, "d": "중", "q": "자신에 관한 정보가 언제, 누구에게, 어느 범위까지 알려지고 이용될지를 스스로 결정할 수 있는 권리는?", "c": ["알 권리", "저작권", "청원권", "환경권", "개인 정보 자기 결정권"], "a": 5, "e": "정보 사회에서는 개인 정보 유출과 사생활 침해가 늘어나면서 개인 정보 자기 결정권의 보장이 중요해졌다.", "p": ""}, {"id": "SO-106", "s": "통합사회", "t": "단편", "g": 2, "d": "중", "q": "1789년 프랑스 혁명 때 발표되어 자유, 평등, 재산권, 저항권 등을 인간의 자연권으로 선언한 문서는?", "c": ["권리 청원", "미국 독립 선언", "세계 인권 선언", "인간과 시민의 권리 선언", "바이마르 헌법"], "a": 4, "e": "프랑스 인권 선언은 '인간은 자유롭고 평등한 권리를 가지고 태어난다'고 밝히고 국민 주권과 권력 분립의 원리를 담았다.", "p": ""}, {"id": "SO-107", "s": "통합사회", "t": "단편", "g": 2, "d": "중", "q": "1948년 국제 연합(UN) 총회에서 채택되어 인권 보장의 국제적 기준을 제시한 문서는?", "c": ["대서양 헌장", "권리 장전", "인간과 시민의 권리 선언", "교토 의정서", "세계 인권 선언"], "a": 5, "e": "세계 인권 선언은 제2차 세계 대전의 참상을 반성하며 채택되었고, 인류가 보편적으로 누려야 할 인권의 내용을 담고 있다.", "p": ""}, {"id": "SO-108", "s": "통합사회", "t": "단편", "g": 2, "d": "중", "q": "우리 헌법에서 기본권을 제한할 수 있는 요건에 대한 설명으로 <u>옳지 않은</u> 것은?", "c": ["대통령의 명령만으로 언제든지 제한할 수 있다.", "국가 안전 보장, 질서 유지, 공공복리를 위해 필요한 경우여야 한다.", "국회가 만든 법률로써 제한해야 한다.", "필요한 최소한의 범위에서 제한해야 한다.", "제한하더라도 기본권의 본질적인 내용은 침해할 수 없다."], "a": 1, "e": "헌법 제37조 제2항에 따라 기본권은 국가 안전 보장·질서 유지·공공복리를 위해 필요한 경우에 한하여 '법률로써' 제한할 수 있으며, 그 경우에도 본질적 내용은 침해할 수 없다.", "p": ""}, {"id": "SO-109", "s": "통합사회", "t": "단편", "g": 2, "d": "중", "q": "근로자가 근로 조건을 유지·개선하기 위해 노동조합을 만들거나 가입할 수 있는 권리는?", "c": ["단체 교섭권", "단체 행동권", "단결권", "청원권", "공무 담임권"], "a": 3, "e": "노동 3권은 단결권, 단체 교섭권(사용자와 근로 조건을 협의할 권리), 단체 행동권(파업 등 쟁의 행위를 할 권리)이다.", "p": ""}, {"id": "SO-110", "s": "통합사회", "t": "단편", "g": 2, "d": "중", "q": "자산을 필요할 때 손해 없이 쉽게 현금으로 바꿀 수 있는 정도를 나타내는 자산 관리의 원칙은?", "c": ["유동성", "안전성", "수익성", "희소성", "효율성"], "a": 1, "e": "안전성은 원금이 손실되지 않을 정도, 수익성은 이익을 얻을 수 있는 정도, 유동성(환금성)은 현금으로 쉽게 바꿀 수 있는 정도이다. 부동산은 유동성이 낮은 자산이다.", "p": ""}, {"id": "SO-111", "s": "통합사회", "t": "단편", "g": 2, "d": "중", "q": "채권에 대한 설명으로 옳은 것은?", "c": ["회사의 소유권 일부를 나타내며 배당을 받는다.", "예금자 보호 제도로 원금 전액이 보장된다.", "일반적으로 주식보다 위험성이 크다.", "정부나 기업 등이 돈을 빌리면서 발행하며, 만기에 원금과 이자를 받을 수 있다.", "미래의 사고에 대비하여 보험료를 내는 상품이다."], "a": 4, "e": "채권은 정부, 공공 기관, 기업 등이 자금을 빌리면서 발행하는 증서이다. 일반적으로 예금보다는 수익성이 높고 주식보다는 안전성이 높다.", "p": ""}, {"id": "SO-112", "s": "통합사회", "t": "단편", "g": 2, "d": "중", "q": "국제 무역이 확대될 때 나타나는 영향으로 <u>옳지 않은</u> 것은?", "c": ["소비자가 선택할 수 있는 상품이 다양해진다.", "기업이 더 넓은 시장을 확보할 수 있다.", "경쟁력이 낮은 국내 산업이 위축될 수 있다.", "기업 간 경쟁으로 기술 개발이 촉진된다.", "다른 나라 경제 상황의 영향을 덜 받게 된다."], "a": 5, "e": "무역이 확대되면 국가 간 경제적 상호 의존도가 높아져 다른 나라의 경제 위기나 정책 변화의 영향을 더 크게 받는다.", "p": ""}, {"id": "SO-113", "s": "통합사회", "t": "단편", "g": 2, "d": "중", "q": "'필요에 따른 분배'에 대한 설명으로 옳은 것은?", "c": ["사회적 약자를 보호할 수 있지만, 한정된 자원으로 모든 필요를 충족하기 어렵다.", "성취동기를 높여 생산성을 향상시킨다.", "성과를 객관적으로 측정하기 쉽다.", "타고난 재능이 분배에 크게 영향을 준다.", "과열 경쟁으로 사회적 갈등이 커진다."], "a": 1, "e": "필요에 따른 분배는 인간다운 생활을 위한 기본적 욕구를 충족하도록 분배하는 것이다. 약자를 보호하지만 재화가 한정되어 있고 일할 의욕을 떨어뜨릴 수 있다.", "p": ""}, {"id": "SO-114", "s": "통합사회", "t": "단편", "g": 2, "d": "중", "q": "수도권과 비수도권 사이의 공간 불평등을 완화하기 위한 정책으로 가장 적절한 것은?", "c": ["공공 기관을 지방으로 이전하여 혁신 도시를 조성한다.", "수도권에 대기업 본사를 더 많이 유치한다.", "지방의 교통망 투자를 줄인다.", "수도권에 대규모 신도시만 계속 건설한다.", "지방 대학에 대한 지원을 줄인다."], "a": 1, "e": "정부는 지역 격차를 줄이기 위해 공공 기관 지방 이전, 혁신 도시와 기업 도시 조성, 지역 특화 산업 육성 등 균형 발전 정책을 추진한다.", "p": ""}, {"id": "SO-115", "s": "통합사회", "t": "단편", "g": 2, "d": "중", "q": "기술 같은 물질문화의 빠른 변화를 제도나 의식 같은 비물질문화가 따라가지 못해 생기는 부조화 현상은?", "c": ["문화 융합", "문화 지체", "문화 전파", "문화 병존", "아노미"], "a": 2, "e": "스마트폰은 빠르게 보급되었지만 공공장소 통화 예절이 뒤따르지 못하는 것이 문화 지체의 예이다.", "p": ""}, {"id": "SO-116", "s": "통합사회", "t": "단편", "g": 2, "d": "중", "q": "이슬람교 문화권에서 볼 수 있는 모습으로 옳은 것은?", "c": ["소를 신성하게 여겨 소고기를 먹지 않는다.", "십자가가 있는 성당에서 예배를 드린다.", "돼지고기와 술을 먹지 않고, 라마단 기간에 낮 동안 금식한다.", "불상을 모신 사원과 탑을 세운다.", "갠지스강에서 목욕하며 죄를 씻는다."], "a": 3, "e": "이슬람교도는 쿠란의 가르침에 따라 돼지고기와 술을 금하고 하루 다섯 번 메카를 향해 기도한다. 소를 신성시하고 갠지스강에서 목욕하는 것은 힌두교, 십자가는 크리스트교, 불상과 탑은 불교의 특징이다.", "p": ""}, {"id": "SO-117", "s": "통합사회", "t": "단편", "g": 2, "d": "중", "q": "주로 북반구에 있는 선진국과 남반구에 있는 개발 도상국 사이의 경제적 격차 문제를 무엇이라 하는가?", "c": ["동서 냉전", "자원 민족주의", "남북문제", "무역 마찰", "문화 갈등"], "a": 3, "e": "남북문제는 선진국과 개발 도상국 간의 경제 격차와 그에 따른 갈등을 말한다. 이를 줄이기 위해 공적 개발 원조(ODA), 공정 무역 등의 노력이 이루어지고 있다.", "p": ""}, {"id": "SO-118", "s": "통합사회", "t": "단편", "g": 2, "d": "상", "q": "헬레니즘 시대 스토아학파가 추구한 행복한 삶의 모습은?", "c": ["육체적 쾌락을 최대한 누리는 상태", "신에게 구원받아 영원한 삶을 얻는 상태", "이성으로 욕망과 감정을 다스려 어떤 일에도 흔들리지 않는 평온한 상태", "많은 재산과 높은 지위를 얻은 상태", "최대 다수가 최대의 쾌락을 누리는 상태"], "a": 3, "e": "스토아학파는 자연의 질서(이성)에 따라 살며 정념에 휘둘리지 않는 상태(아파테이아)를 행복으로 보았다. 에피쿠로스학파는 고통과 불안이 없는 평온한 상태(아타락시아)를 추구하였다.", "p": ""}, {"id": "SO-119", "s": "통합사회", "t": "단편", "g": 2, "d": "상", "q": "'최대 다수의 최대 행복'을 도덕과 입법의 원리로 삼고, 쾌락의 양을 계산할 수 있다고 본 사상가는?", "c": ["칸트", "아리스토텔레스", "롤스", "노자", "벤담"], "a": 5, "e": "벤담은 쾌락을 늘리고 고통을 줄이는 행위가 옳다고 보는 양적 공리주의를 주장하였다. 밀은 쾌락의 질적 차이를 강조하였다.", "p": ""}, {"id": "SO-120", "s": "통합사회", "t": "단편", "g": 2, "d": "상", "q": "대규모 개발 사업을 시작하기 전에 그 사업이 환경에 끼칠 영향을 미리 조사·예측하여 피해를 줄이도록 하는 제도는?", "c": ["탄소 배출권 거래제", "쓰레기 종량제", "환경 영향 평가", "환경 마크 제도", "생산자 책임 재활용 제도"], "a": 3, "e": "환경 영향 평가는 개발로 생길 수 있는 환경 피해를 사전에 예방하기 위한 제도이다.", "p": ""}, {"id": "SO-121", "s": "통합사회", "t": "단편", "g": 2, "d": "상", "q": "'탄소 배출권 거래제'에 대한 설명으로 옳은 것은?", "c": ["화석 연료의 사용을 전면 금지하는 제도이다.", "온실가스 배출 허용량을 정해 주고, 남거나 모자란 양을 사고팔 수 있게 한 제도이다.", "쓰레기를 버린 양만큼 수수료를 내게 하는 제도이다.", "선진국만 온실가스를 감축하도록 한 제도이다.", "개발 사업 전에 환경 영향을 조사하는 제도이다."], "a": 2, "e": "탄소 배출권 거래제는 기업마다 배출 허용량을 할당하고, 허용량보다 적게 배출한 기업이 남은 배출권을 팔 수 있게 하여 시장 원리로 온실가스 감축을 유도한다.", "p": ""}, {"id": "SO-122", "s": "통합사회", "t": "단편", "g": 2, "d": "상", "q": "낙후된 도심 지역이 개발되어 임대료가 오르면서, 원래 살던 주민이나 상인이 다른 곳으로 밀려나는 현상은?", "c": ["열섬 현상", "역도시화", "교외화", "젠트리피케이션", "도심 공동화"], "a": 4, "e": "젠트리피케이션은 지역이 활성화되면서 임대료와 땅값이 올라 기존 주민과 영세 상인이 내몰리는 현상이다. 도심 공동화는 도심의 주거 기능이 약해져 밤에 인구가 줄어드는 현상이다.", "p": ""}, {"id": "SO-123", "s": "통합사회", "t": "단편", "g": 2, "d": "상", "q": "재판 중인 사건에 적용할 법률이 헌법에 어긋나는지 의심될 때, 법원이 헌법 재판소에 심판을 요청하는 제도는?", "c": ["헌법 소원 심판", "탄핵 심판", "위헌 법률 심판", "권한 쟁의 심판", "정당 해산 심판"], "a": 3, "e": "위헌 법률 심판은 법원의 제청으로 이루어진다. 헌법 소원 심판은 공권력 때문에 기본권을 침해당한 국민이 직접 헌법 재판소에 청구하는 제도이다.", "p": ""}, {"id": "SO-124", "s": "통합사회", "t": "단편", "g": 2, "d": "상", "q": "자유권과 비교한 사회권의 특징으로 옳은 것은?", "c": ["국가의 간섭을 배제하는 소극적 권리이다.", "근대 시민 혁명 시기에 가장 먼저 보장되었다.", "국가의 정치 과정에 참여하는 권리이다.", "다른 기본권이 침해되었을 때 구제를 요청하는 권리이다.", "국가에 인간다운 생활의 보장을 적극적으로 요구할 수 있는 권리이다."], "a": 5, "e": "사회권은 교육을 받을 권리, 근로의 권리, 인간다운 생활을 할 권리 등으로, 국가의 적극적 역할을 요구하는 현대적 권리이다.", "p": ""}, {"id": "SO-125", "s": "통합사회", "t": "수능", "g": 2, "d": "상", "q": "다음은 X재의 가격별 수요량과 공급량이다. 이에 대한 설명으로 옳은 것은?<div class='box'>가격 1,000원: 수요량 50개, 공급량 10개<br>가격 2,000원: 수요량 40개, 공급량 20개<br>가격 3,000원: 수요량 30개, 공급량 30개<br>가격 4,000원: 수요량 20개, 공급량 40개</div>", "c": ["균형 가격은 2,000원이다.", "정부가 최고 가격을 2,000원으로 정하면 20개의 초과 수요가 생긴다.", "균형 거래량은 40개이다.", "가격이 4,000원이면 20개의 초과 수요가 생긴다.", "가격이 1,000원이면 40개의 초과 공급이 생긴다."], "a": 2, "e": "수요량과 공급량이 30개로 같은 3,000원이 균형 가격이다. 가격을 2,000원으로 묶으면 수요량 40개, 공급량 20개로 20개의 초과 수요가 생긴다. 4,000원에서는 20개의 초과 공급, 1,000원에서는 40개의 초과 수요가 생긴다.", "p": ""}, {"id": "SO-126", "s": "통합사회", "t": "단편", "g": 2, "d": "상", "q": "정부가 최저 임금을 시장의 균형 임금보다 높게 정할 때 노동 시장에서 나타날 수 있는 현상은?", "c": ["노동의 초과 수요가 생긴다.", "기업의 고용이 반드시 늘어난다.", "모든 근로자의 임금이 내려간다.", "노동의 초과 공급이 생겨 실업이 늘어날 수 있다.", "노동 공급이 줄어든다."], "a": 4, "e": "최저 임금제는 가격 하한제의 예이다. 균형 임금보다 높은 수준에서는 일하려는 사람은 늘고 기업의 고용은 줄어 초과 공급(실업)이 생길 수 있다.", "p": ""}, {"id": "SO-127", "s": "통합사회", "t": "단편", "g": 2, "d": "상", "q": "다른 조건이 일정할 때 시중 금리(이자율)가 오르면 나타나는 일반적인 변화는?", "c": ["저축이 줄고 소비가 늘어난다.", "대출을 받으려는 사람이 늘어난다.", "기업의 투자가 늘어난다.", "예금의 이자 수익이 줄어든다.", "저축은 늘고 기업의 투자와 가계의 소비는 줄어든다."], "a": 5, "e": "금리가 오르면 저축의 이익이 커지고 돈을 빌리는 비용이 늘어나므로 저축은 늘고 대출·투자·소비는 줄어드는 경향이 있다.", "p": ""}, {"id": "SO-128", "s": "통합사회", "t": "단편", "g": 2, "d": "상", "q": "정부가 수입 농산물에 높은 관세를 매길 때 나타나는 영향으로 가장 적절한 것은?", "c": ["수입 농산물의 국내 가격이 내려간다.", "소비자가 선택할 수 있는 상품이 늘어난다.", "수입량이 늘어난다.", "국내 생산자의 판매량이 줄어든다.", "국내 생산자는 보호받지만 소비자는 더 비싼 값을 내게 된다."], "a": 5, "e": "관세를 매기면 수입품 가격이 올라 수입이 줄고 국내 생산자가 보호받는다. 그러나 소비자는 더 높은 가격을 부담하게 되고, 상대국의 보복으로 무역 마찰이 생길 수 있다.", "p": ""}, {"id": "SO-129", "s": "통합사회", "t": "단편", "g": 2, "d": "상", "q": "롤스가 주장한 '차등의 원칙'의 내용으로 옳은 것은?", "c": ["사회적·경제적 불평등은 사회의 최소 수혜자에게 최대의 이익이 될 때에만 허용된다.", "모든 사람의 소득은 완전히 같아야 한다.", "개인의 소유권은 어떤 경우에도 제한할 수 없다.", "사회 전체의 효용이 늘면 소수의 희생은 정당하다.", "분배는 전적으로 시장에 맡겨야 한다."], "a": 1, "e": "롤스는 모든 사람이 평등한 기본적 자유를 누려야 하며(제1원칙), 불평등은 공정한 기회 균등 아래에서 가장 불리한 사람에게 이익이 될 때에만 정당하다(제2원칙)고 보았다.", "p": ""}, {"id": "SO-130", "s": "통합사회", "t": "단편", "g": 2, "d": "상", "q": "공동체주의적 정의관에 대한 설명으로 옳은 것은?", "c": ["개인은 공동체의 역사와 전통 속에서 정체성을 형성하므로 공동선을 추구할 책임이 있다.", "개인은 공동체와 무관하게 선택하는 독립적 존재이다.", "국가는 개인의 삶에 일절 개입해서는 안 된다.", "개인의 권리는 언제나 공동선에 우선한다.", "공동체에 대한 의무는 개인의 동의가 있을 때만 생긴다."], "a": 1, "e": "매킨타이어, 샌델 등의 공동체주의는 인간을 공동체에 뿌리를 둔 존재로 보고 연대 의식과 공동선의 실현을 강조한다. 다만 공동체를 지나치게 앞세우면 개인의 자유가 침해될 수 있다.", "p": ""}, {"id": "SO-131", "s": "통합사회", "t": "단편", "g": 2, "d": "상", "q": "사회 보험과 공공 부조를 비교한 설명으로 옳은 것은?", "c": ["사회 보험은 생활이 어려운 사람만을 대상으로 한다.", "공공 부조는 원하는 사람만 가입하는 임의 가입 방식이다.", "사회 보험은 공공 부조보다 소득 재분배 효과가 크다.", "공공 부조는 미래의 위험에 미리 대비하는 성격이 강하다.", "사회 보험은 가입자가 보험료를 부담하지만, 공공 부조는 국가가 비용을 전액 부담한다."], "a": 5, "e": "사회 보험은 질병·실업·노령 등 미래의 위험에 대비하여 보험료를 내는 강제 가입 제도이다. 공공 부조는 현재 생활이 어려운 사람을 세금으로 돕는 제도로 소득 재분배 효과가 더 크다.", "p": ""}, {"id": "SO-132", "s": "통합사회", "t": "수능", "g": 2, "d": "상", "q": "다음 지역의 갈등에 대한 설명으로 옳은 것은?<div class='box'>난사(스프래틀리) 군도 주변 바다는 석유와 천연가스가 많이 묻혀 있는 것으로 알려져 있고, 인도양과 태평양을 잇는 중요한 해상 교통로이다.</div>", "c": ["인도와 파키스탄이 종교 차이로 대립하고 있다.", "이스라엘과 팔레스타인이 대립하고 있다.", "러시아와 일본이 영유권을 다투고 있다.", "북극해 항로를 둘러싼 갈등이다.", "중국, 베트남, 필리핀 등 여러 나라가 영유권을 주장하고 있다."], "a": 5, "e": "남중국해의 난사 군도는 자원과 해상 교통로를 둘러싸고 중국, 베트남, 필리핀, 말레이시아 등이 영유권을 주장하는 분쟁 지역이다. 인도·파키스탄의 갈등 지역은 카슈미르이다.", "p": ""}, {"id": "SO-133", "s": "통합사회", "t": "수능", "g": 2, "d": "상", "q": "다음 자료에 대한 분석으로 옳은 것은?<div class='box'>갑국의 인구 구성: 유소년층(0~14세) 20%, 청장년층(15~64세) 50%, 노년층(65세 이상) 30%</div>", "c": ["노령화 지수는 150이다.", "유소년 부양비는 20이다.", "노년 부양비는 30이다.", "총부양비는 50이다.", "갑국은 고령화 사회에 해당한다."], "a": 1, "e": "유소년 부양비 = 20/50×100 = 40, 노년 부양비 = 30/50×100 = 60, 총부양비 = 100이다. 노령화 지수 = 노년층/유소년층×100 = 150이다. 노년층 비율이 20% 이상이므로 초고령 사회이다.", "p": ""}, {"id": "SO-134", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "여름에 덥고 비가 많이 내리는 아시아 계절풍 기후 지역에서 주로 재배하는 주식 작물은?", "c": ["밀", "옥수수", "벼(쌀)", "감자", "올리브"], "a": 3, "e": "벼는 자라는 동안 높은 기온과 많은 물이 필요하여 동아시아·동남아시아·남아시아의 계절풍 지역에서 많이 재배된다.", "p": ""}, {"id": "SO-135", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "냉장고의 냉매 등으로 쓰였으며, 성층권의 오존층을 파괴하는 물질은?", "c": ["이산화 탄소", "메테인", "질소", "염화 플루오린화 탄소(프레온 가스)", "수증기"], "a": 4, "e": "오존층이 파괴되면 지표에 닿는 자외선이 늘어 피부암, 백내장 등이 증가한다. 국제 사회는 몬트리올 의정서로 오존층 파괴 물질의 사용을 규제하였다.", "p": ""}, {"id": "SO-136", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "오랜 가뭄과 지나친 방목·경작 때문에 사막 주변의 초원이 황폐해지는 현상은?", "c": ["지구 온난화", "산성비", "오존층 파괴", "열섬 현상", "사막화"], "a": 5, "e": "사막화는 사하라 사막 남쪽의 사헬 지대 등에서 심각하며, 국제 사회는 사막화 방지 협약을 맺어 대응하고 있다.", "p": ""}, {"id": "SO-137", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "열대림이 파괴될 때 나타나는 결과로 가장 적절한 것은?", "c": ["이산화 탄소 흡수량이 늘어난다.", "야생 동물의 서식지가 넓어진다.", "생물 종 다양성이 줄고 지구 온난화가 심해진다.", "토양 침식이 줄어든다.", "지구의 평균 기온이 낮아진다."], "a": 3, "e": "열대림은 많은 생물의 서식지이자 이산화 탄소를 흡수하는 곳이다. 열대림이 사라지면 생물 다양성이 줄고 온실 효과가 강해진다.", "p": ""}, {"id": "SO-138", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "모든 국민이 성별, 종교, 사회적 신분 등에 의해 부당하게 차별받지 않을 권리는?", "c": ["자유권", "참정권", "청구권", "사회권", "평등권"], "a": 5, "e": "평등권은 합리적 이유 없는 차별을 금지하는 권리로, 다른 기본권을 보장받기 위한 전제가 된다.", "p": ""}, {"id": "SO-139", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "우리나라에서 법률을 만들고 고치는 입법권을 가진 국가 기관은?", "c": ["국회", "정부", "법원", "헌법 재판소", "감사원"], "a": 1, "e": "입법권은 국회, 행정권은 대통령을 수반으로 하는 정부, 사법권은 법원이 가진다.", "p": ""}, {"id": "SO-140", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "사회 구성원이 법과 규칙을 스스로 지키려는 태도를 무엇이라 하는가?", "c": ["시민 불복종", "저항권", "권력 분립", "준법 의식", "기본권 제한"], "a": 4, "e": "준법 의식은 다른 사람의 권리를 존중하고 사회 질서를 유지하는 바탕이 된다.", "p": ""}, {"id": "SO-141", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "어떤 것을 선택함으로써 포기한 것들 가운데 가장 가치가 큰 것을 무엇이라 하는가?", "c": ["편익", "매몰 비용", "기회비용", "균형 가격", "희소성"], "a": 3, "e": "합리적 선택이란 기회비용보다 편익이 큰 쪽을 고르는 것이다.", "p": ""}, {"id": "SO-142", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "신용을 잘 관리해야 하는 까닭으로 가장 적절한 것은?", "c": ["신용이 좋으면 세금을 내지 않아도 되기 때문에", "신용은 한 번 정해지면 바뀌지 않기 때문에", "신용이 좋을수록 대출 이자가 높아지기 때문에", "신용이 나쁘면 대출이나 신용 카드 발급 등 금융 거래에 제한을 받기 때문에", "신용은 현금으로만 쌓을 수 있기 때문에"], "a": 4, "e": "신용은 돈을 빌려 쓰고 약속대로 갚을 수 있는 능력이다. 연체가 잦으면 신용이 떨어져 대출이 어렵거나 더 높은 이자를 내야 한다.", "p": ""}, {"id": "SO-143", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "질병, 사고 등 미래에 일어날지 모르는 위험에 대비하여 미리 일정한 돈을 내고, 사고가 나면 보상을 받는 금융 상품은?", "c": ["예금", "주식", "채권", "보험", "펀드"], "a": 4, "e": "보험은 수익을 얻기보다 미래의 위험에 대비하는 것이 주된 목적이다.", "p": ""}, {"id": "SO-144", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "소득이나 재산의 격차가 커져 중간 계층이 줄고 상층과 하층으로 나뉘는 현상은?", "c": ["사회 양극화", "고령화", "도시화", "세계화", "정보화"], "a": 1, "e": "사회 양극화가 심해지면 계층 간 갈등이 커지고 사회 통합이 어려워진다. 이를 완화하려면 사회 복지 제도와 공정한 기회 보장이 필요하다.", "p": ""}, {"id": "SO-145", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "세계화가 진행되면서 나타나는 현상으로 가장 적절한 것은?", "c": ["국경을 넘는 상품, 자본, 사람의 이동이 활발해진다.", "국가 간 교류가 줄어든다.", "다국적 기업의 활동이 위축된다.", "국가 간 상호 의존성이 낮아진다.", "각 나라가 자급자족 경제로 돌아간다."], "a": 1, "e": "세계화는 교통·통신의 발달로 세계가 하나의 생활권으로 묶이는 현상이다. 교류가 늘면서 국가 간 상호 의존성도 커진다.", "p": ""}, {"id": "SO-146", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "지속 가능한 사회를 위한 개인의 노력으로 적절하지 <u>않은</u> 것은?", "c": ["일회용품 사용 줄이기", "가까운 거리는 걷거나 자전거 타기", "유행에 맞추어 옷을 자주 사서 한두 번 입고 버리기", "쓰지 않는 전자 제품의 플러그 뽑기", "재활용품 분리배출하기"], "a": 3, "e": "자원을 아끼고 쓰레기를 줄이는 생활 습관이 지속 가능한 발전에 도움이 된다. 필요 이상의 소비는 자원 낭비와 환경 오염을 일으킨다.", "p": ""}, {"id": "SO-147", "s": "통합사회", "t": "단편", "g": 3, "d": "하", "q": "저출산 문제를 완화하기 위한 대책으로 가장 적절한 것은?", "c": ["정년을 앞당긴다.", "노인 일자리를 줄인다.", "육아 휴직을 확대하고 보육 시설을 늘린다.", "양육비 지원을 축소한다.", "근로 시간을 늘린다."], "a": 3, "e": "저출산을 완화하려면 출산·양육에 따른 경제적 부담을 줄이고 일과 가정을 함께 돌볼 수 있는 환경을 만들어야 한다.", "p": ""}, {"id": "SO-148", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "행복의 조건 가운데 '질 높은 정주 환경'에 해당하는 것은?", "c": ["높은 소득과 안정된 일자리", "국민의 정치 참여 보장", "타인에 대한 배려와 나눔의 실천", "자아 성찰", "깨끗한 자연환경과 편리한 교통·의료·문화 시설"], "a": 5, "e": "정주 환경은 사람이 일정한 곳에 자리 잡고 사는 데 필요한 환경으로, 주거·교통·교육·의료·문화 시설과 쾌적한 자연환경을 포함한다.", "p": ""}, {"id": "SO-149", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "도덕적 고려의 범위를 동식물뿐 아니라 흙, 물까지 포함하는 대지(땅) 전체로 넓혀야 한다는 '대지 윤리'를 주장한 사람은?", "c": ["베이컨", "레오폴드", "데카르트", "칸트", "벤담"], "a": 2, "e": "레오폴드는 인간을 대지 공동체의 정복자가 아니라 평범한 구성원으로 보아야 한다고 주장한 생태 중심주의 사상가이다. 베이컨과 데카르트는 인간 중심주의적 자연관을 대표한다.", "p": ""}, {"id": "SO-150", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "화산 지대에 사는 사람들이 화산을 이용하는 모습으로 적절하지 <u>않은</u> 것은?", "c": ["지열로 전기를 생산한다.", "온천을 관광 자원으로 활용한다.", "비옥한 화산재 토양에서 농사를 짓는다.", "독특한 화산 지형을 관광지로 개발한다.", "넓은 갯벌에서 양식업을 한다."], "a": 5, "e": "화산 지대는 위험하지만 지열 발전, 온천, 비옥한 토양, 관광 자원 등의 이점이 있다. 갯벌은 조수 간만의 차가 큰 해안에 발달하는 지형이다.", "p": ""}, {"id": "SO-151", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "산업화·도시화로 사람이 기계의 부속품처럼 여겨지거나 노동에서 보람을 느끼지 못하게 되는 현상은?", "c": ["문화 지체", "정보 격차", "도심 공동화", "인간 소외", "지역 이기주의"], "a": 4, "e": "대량 생산 체제에서는 분업이 세분화되고 효율성이 강조되면서 인간이 수단처럼 취급되는 인간 소외가 나타날 수 있다.", "p": ""}, {"id": "SO-152", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "대도시의 인구와 기능이 주변 지역으로 퍼져 나가는 '교외화'의 결과로 가장 적절한 것은?", "c": ["대도시의 통근권이 좁아진다.", "주변 지역의 인구가 감소한다.", "대도시 도심의 상주인구가 늘어난다.", "대도시와 주변 지역이 하나의 생활권으로 묶인 대도시권이 형성된다.", "대도시와 주변 지역 사이의 교통량이 줄어든다."], "a": 4, "e": "교외화가 진행되면 대도시 주변에 주거 지역과 위성 도시가 발달하고, 대도시로 통근·통학하는 범위인 대도시권이 넓어진다.", "p": ""}, {"id": "SO-153", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "고속 철도 등 교통망이 새로 생기면서 중소 도시의 인구와 상권이 대도시로 빨려 들어가는 현상은?", "c": ["풍선 효과", "열섬 현상", "빨대 효과", "역도시화", "님비 현상"], "a": 3, "e": "교통이 발달하면 지역 간 접근성이 좋아지지만, 대도시로 소비와 인구가 쏠려 중소 도시의 경제가 위축되는 빨대 효과가 나타날 수 있다.", "p": ""}, {"id": "SO-154", "s": "통합사회", "t": "단편", "g": 3, "d": "중", "q": "오늘날 강조되는 '연대권'(3세대 인권)에 해당하는 것은?", "c": ["신체의 자유, 재산권", "선거권, 피선거권", "교육을 받을 권리, 근로의 권리", "깨끗한 환경에서 살 권리, 평화롭게 살 권리", "재판을 받을 권리"], "a": 4, "e": "인권은 자유권·참정권(1세대)에서 사회권(2세대)으로, 다시 인류 전체의 협력이 필요한 환경권·평화권·발전권 등 연대권(3세대)으로 넓어져 왔다.", "p": ""}, {"id": "SO-155", "
